<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 荒野流寇 — 勝利（刀扛肩，冷笑） -->
  <defs>
    <radialGradient id="mobRogueFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c4a470"/>
    </radialGradient>
    <linearGradient id="mobRogueArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a5040"/>
      <stop offset="100%" stop-color="#3a3830"/>
    </linearGradient>
    <linearGradient id="mobRoguePants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4030"/>
      <stop offset="100%" stop-color="#2e2820"/>
    </linearGradient>
    <linearGradient id="mobRogueHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#302820"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="mobRogueBlade" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="205" rx="24" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（輕鬆站姿） ===== -->
      <!-- 後腿 -->
      <ellipse cx="10" cy="185" rx="9" ry="16" fill="url(#mobRoguePants)" transform="rotate(-2,10,185)"/>
      <ellipse cx="9" cy="200" rx="10" ry="6" fill="#3a2818"/>
      <!-- 前腿 -->
      <ellipse cx="-8" cy="183" rx="10" ry="17" fill="url(#mobRoguePants)" transform="rotate(2,-8,183)"/>
      <ellipse cx="-9" cy="200" rx="11" ry="6" fill="#3a2818"/>

      <!-- ===== 身體（挺胸） ===== -->
      <ellipse cx="-2" cy="149" rx="23" ry="26" fill="url(#mobRogueArmor)" transform="rotate(3,-2,149)"/>

      <!-- 皮甲細節 -->
      <path d="M-10,132 L-4,144 L4,132" fill="none" stroke="#4a4030" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- 護肩片 -->
      <ellipse cx="-20" cy="130" rx="8" ry="4" fill="#4a4030" stroke="#3a3020" stroke-width="0.8" transform="rotate(-10,-20,130)"/>
      <ellipse cx="16" cy="130" rx="8" ry="4" fill="#4a4030" stroke="#3a3020" stroke-width="0.8" transform="rotate(10,16,130)"/>
      <!-- 甲片縫線 -->
      <path d="M-18,142 L-15,158" fill="none" stroke="#2e2820" stroke-width="0.8" opacity="0.4"/>
      <path d="M14,142 L17,158" fill="none" stroke="#2e2820" stroke-width="0.8" opacity="0.4"/>

      <!-- 腰帶 -->
      <path d="M-22,168 Q-2,174 20,168" fill="none" stroke="#4a3820" stroke-width="4" stroke-linecap="round"/>
      <rect x="-6" y="167" width="8" height="5" rx="1" fill="#8a7a50" opacity="0.6"/>

      <!-- ===== 右手臂（角色左手，扛刀在肩） ===== -->
      <path d="M18,138 Q28,124 30,108" fill="none" stroke="url(#mobRogueArmor)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <circle cx="30" cy="106" r="5" fill="url(#mobRogueFace)" opacity="0.85"/>

      <!-- ===== 刀（扛在右肩上，斜向後） ===== -->
      <path d="M32,54 Q36,58 36,68 Q34,82 32,96 Q30,104 28,110 L24,108 Q26,102 28,94 Q30,80 32,66 Q32,58 30,54 Z" fill="url(#mobRogueBlade)" stroke="#666" stroke-width="0.5"/>
      <!-- 刀脊 -->
      <path d="M32,62 Q34,78 30,98" fill="none" stroke="#aaa" stroke-width="0.5" opacity="0.5"/>
      <!-- 刀柄 -->
      <rect x="25" y="108" width="8" height="10" rx="1" fill="#4a3020"/>
      <rect x="24" y="107" width="10" height="3" rx="1" fill="#6a5a40"/>

      <!-- ===== 左手臂（角色右手，���腰） ===== -->
      <path d="M-20,138 Q-32,150 -26,164" fill="none" stroke="url(#mobRogueArmor)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-26" cy="166" r="5.5" fill="url(#mobRogueFace)"/>

      <!-- ===== 大頭（微仰得意） ===== -->
      <ellipse cx="0" cy="96" rx="36" ry="38" fill="url(#mobRogueHair)"/>

      <!-- 臉 -->
      <path d="M-24,88 C-28,98 -26,114 -20,126 C-14,134 -4,138 4,136 C12,134 18,126 22,116 C26,104 24,90 18,82 C12,76 2,72 -4,74 C-14,76 -22,82 -24,88Z" fill="url(#mobRogueFace)"/>

      <!-- 短髮 -->
      <path d="M-16,78 C-12,62 4,54 16,58 C24,62 28,72 24,82 C20,74 14,68 6,66 C0,64 -8,66 -14,72" fill="url(#mobRogueHair)"/>
      <path d="M-26,88 C-30,78 -32,82 -30,90 C-28,94 -26,92 -26,90" fill="url(#mobRogueHair)"/>
      <path d="M20,86 C24,80 26,86 24,94 C22,96 20,94 20,90" fill="url(#mobRogueHair)"/>

      <!-- 耳朵 -->
      <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,110" fill="url(#mobRogueFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（得意瞇眼） ===== -->
      <ellipse cx="-10" cy="108" rx="6" ry="4.5" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="3.5" ry="3" fill="#3a2818"/>
      <ellipse cx="-11.5" cy="108.5" rx="2" ry="1.8" fill="#1a1008"/>
      <circle cx="-13" cy="107.5" r="1.2" fill="#fff" opacity="0.6"/>

      <ellipse cx="6" cy="108" rx="6" ry="4.5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.5" ry="3" fill="#3a2818"/>
      <ellipse cx="4.5" cy="108.5" rx="2" ry="1.8" fill="#1a1008"/>
      <circle cx="3" cy="107.5" r="1.2" fill="#fff" opacity="0.6"/>

      <!-- 傷疤 -->
      <path d="M-16,100 L-6,108" fill="none" stroke="#a08060" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>

      <!-- 眉毛（輕鬆上揚） -->
      <path d="M-16,100 C-12,98 -8,100 -6,102" fill="none" stroke="#302820" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,102 C10,100 14,98 18,100" fill="none" stroke="#302820" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#b09068" stroke-width="1.4" stroke-linecap="round"/>

      <!-- 鬍渣 -->
      <circle cx="-8" cy="130" r="0.5" fill="#4a3828" opacity="0.3"/>
      <circle cx="-4" cy="132" r="0.5" fill="#4a3828" opacity="0.3"/>
      <circle cx="0" cy="130" r="0.5" fill="#4a3828" opacity="0.3"/>
      <circle cx="4" cy="131" r="0.5" fill="#4a3828" opacity="0.3"/>

      <!-- 嘴巴（冷笑，露齒） -->
      <path d="M-10,128 C-4,136 4,136 8,130" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-6,130 C-2,134 2,134 6,130" fill="#4a2020"/>
      <path d="M-4,130 C-2,132 2,132 4,130" fill="#eee" opacity="0.7"/>
    </g>
  </g>
</svg>
