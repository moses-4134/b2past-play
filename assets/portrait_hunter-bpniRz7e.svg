<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- 獵人 — 對話肖像 -->
  <defs>
    <radialGradient id="hunter_face" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8c0a0"/>
      <stop offset="100%" stop-color="#c8a080"/>
    </radialGradient>
    <linearGradient id="hunter_vest" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#7a6040"/>
      <stop offset="100%" stop-color="#5a4020"/>
    </linearGradient>
    <linearGradient id="hunter_fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7050"/>
      <stop offset="100%" stop-color="#6a5030"/>
    </linearGradient>
    <linearGradient id="hunter_hair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#3a2810"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
  </defs>

  <g transform="translate(60, 8)">
    <!-- 身體/肩膀 — 簡單衣服 -->
    <ellipse cx="0" cy="98" rx="30" ry="22" fill="#6a5a40"/>
    <!-- 毛皮背心 -->
    <path d="M-20,82 C-22,88 -22,100 -20,108 L20,108 C22,100 22,88 20,82 L10,78 L-10,78Z" fill="url(#hunter_fur)"/>
    <!-- 毛皮邊緣 -->
    <path d="M-20,82 C-18,84 -14,82 -12,84 C-10,82 -8,84 -6,82 L-10,78Z" fill="#9a8060" opacity="0.6"/>
    <path d="M20,82 C18,84 14,82 12,84 C10,82 8,84 6,82 L10,78Z" fill="#9a8060" opacity="0.6"/>

    <path d="M-6,82 L0,88 L6,82" fill="none" stroke="#8a7a58" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="38" rx="32" ry="34" fill="url(#hunter_hair)"/>

    <!-- 臉 — 粗獷 -->
    <path d="M-24,34 C-28,44 -27,56 -22,66 C-18,74 -8,78 0,78 C8,78 18,74 22,66 C27,56 28,44 24,34 C20,28 12,24 0,24 C-12,24 -20,28 -24,34Z" fill="url(#hunter_face)"/>

    <!-- 短亂髮 -->
    <path d="M-22,28 C-18,12 0,6 16,8 C26,12 30,22 26,30 C20,20 10,14 2,12 C-8,10 -16,14 -20,22Z" fill="url(#hunter_hair)"/>
    <path d="M-20,28 C-24,20 -16,14 -10,18" fill="url(#hunter_hair)"/>
    <path d="M-8,24 C-10,16 -2,10 6,14" fill="url(#hunter_hair)" opacity="0.9"/>
    <path d="M6,24 C8,14 16,10 22,16" fill="url(#hunter_hair)" opacity="0.85"/>

    <!-- 側髮 -->
    <path d="M-26,36 C-30,32 -32,40 -30,48" fill="none" stroke="url(#hunter_hair)" stroke-width="3" stroke-linecap="round"/>
    <path d="M26,36 C30,32 32,40 30,48" fill="none" stroke="url(#hunter_hair)" stroke-width="3" stroke-linecap="round"/>

    <!-- 鬍渣 -->
    <circle cx="-10" cy="72" r="0.5" fill="#5a4030" opacity="0.3"/>
    <circle cx="-6" cy="74" r="0.5" fill="#5a4030" opacity="0.3"/>
    <circle cx="-2" cy="73" r="0.5" fill="#5a4030" opacity="0.3"/>
    <circle cx="3" cy="74" r="0.5" fill="#5a4030" opacity="0.3"/>
    <circle cx="7" cy="72" r="0.5" fill="#5a4030" opacity="0.3"/>
    <circle cx="10" cy="73" r="0.5" fill="#5a4030" opacity="0.3"/>

    <!-- 繃帶（右臉頰） -->
    <rect x="10" y="58" width="14" height="6" rx="2" fill="#e8e0d0" transform="rotate(-15 17 61)"/>
    <path d="M12,60 L22,58" fill="none" stroke="#c8c0b0" stroke-width="0.5"/>
    <path d="M12,62 L22,60" fill="none" stroke="#c8c0b0" stroke-width="0.5"/>

    <!-- 左眼 — 堅毅但痛苦 -->
    <ellipse cx="-10" cy="52" rx="5.5" ry="5" fill="#fff"/>
    <ellipse cx="-10" cy="53" rx="3.5" ry="3.8" fill="#3a2818"/>
    <ellipse cx="-10" cy="52" rx="2" ry="2.2" fill="#1a0c04"/>
    <circle cx="-12" cy="50" r="1.3" fill="#fff" opacity="0.9"/>
    <!-- 皺眉 -->
    <path d="M-15,44 C-12,46 -7,46 -5,45" fill="none" stroke="#3a2810" stroke-width="1.3" stroke-linecap="round"/>

    <!-- 右眼 — 微瞇（痛） -->
    <ellipse cx="10" cy="52" rx="5.5" ry="4" fill="#fff"/>
    <ellipse cx="10" cy="52.5" rx="3.2" ry="3" fill="#3a2818"/>
    <ellipse cx="10" cy="52" rx="1.8" ry="1.8" fill="#1a0c04"/>
    <circle cx="8" cy="51" r="1.2" fill="#fff" opacity="0.9"/>
    <path d="M5,45 C7,46 12,46 15,44" fill="none" stroke="#3a2810" stroke-width="1.3" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M0,58 C-1,61 1,61 0,58" fill="none" stroke="#b08868" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴 — 忍痛 -->
    <path d="M-5,68 C-2,67 2,67 5,68" fill="none" stroke="#906050" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
