<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 程蛟 — 吉卜力2頭身 面朝右（敵方）受擊 -->
  <defs>
    <radialGradient id="chengjiaoFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b090"/>
      <stop offset="100%" stop-color="#c09878"/>
    </radialGradient>
    <linearGradient id="chengjiaoArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a2828"/>
      <stop offset="100%" stop-color="#4a1818"/>
    </linearGradient>
    <linearGradient id="chengjiaoPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2020"/>
      <stop offset="100%" stop-color="#1e1010"/>
    </linearGradient>
    <linearGradient id="chengjiaoBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="34" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（受擊後退） ===== -->
      <ellipse cx="18" cy="202" rx="12" ry="17" fill="url(#chengjiaoPants)" transform="rotate(-5,18,202)"/>
      <ellipse cx="16" cy="218" rx="13" ry="7" fill="#3a2018"/>
      <ellipse cx="-10" cy="200" rx="13" ry="18" fill="url(#chengjiaoPants)" transform="rotate(5,-10,200)"/>
      <ellipse cx="-12" cy="218" rx="14" ry="7" fill="#3a2018"/>

      <!-- ===== 身體（微後仰受擊） ===== -->
      <ellipse cx="-2" cy="158" rx="30" ry="32" fill="url(#chengjiaoArmor)" transform="rotate(8,-2,160)"/>

      <!-- 肩甲 -->
      <path d="M-28,138 Q-34,134 -36,140 Q-32,148 -26,148" fill="#5a2020" stroke="#4a1818" stroke-width="0.8"/>
      <path d="M24,138 Q30,134 32,140 Q28,148 22,148" fill="#5a2020" stroke="#4a1818" stroke-width="0.8"/>

      <!-- 領口 -->
      <path d="M-12,135 L-6,149 L4,135" fill="none" stroke="#7a3030" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-30,182 Q-2,191 28,182" fill="none" stroke="#4a2818" stroke-width="7" stroke-linecap="round"/>
      <rect x="-8" y="180" width="10" height="10" rx="1" fill="#a08030" stroke="#806020" stroke-width="0.5"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="94" rx="40" ry="42" fill="#c09070"/>
      <ellipse cx="-6" cy="72" rx="18" ry="12" fill="#d0a080" opacity="0.4"/>

      <!-- 臉 -->
      <path d="M-30,86 C-34,98 -32,116 -26,128 C-20,136 -6,142 4,140 C14,138 24,128 28,116 C32,104 30,92 24,84 C18,78 6,74 -4,76 C-16,78 -28,80 -30,86Z" fill="url(#chengjiaoFace)"/>

      <!-- 傷疤 -->
      <path d="M-8,78 L6,90" fill="none" stroke="#a08060" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 耳朵 -->
      <path d="M22,100 C26,96 28,102 26,110 C24,114 22,112 22,106" fill="url(#chengjiaoFace)" stroke="#b08860" stroke-width="0.5"/>

      <!-- ===== 眼睛（受擊瞇眼） ===== -->
      <ellipse cx="-12" cy="106" rx="7" ry="3" fill="#fff"/>
      <ellipse cx="-13" cy="107" rx="4.5" ry="2.2" fill="#3a1810"/>
      <ellipse cx="-13.5" cy="106" rx="2.5" ry="1.3" fill="#1a0800"/>
      <circle cx="-15" cy="105" r="1" fill="#fff" opacity="0.5"/>

      <ellipse cx="6" cy="106" rx="7" ry="3" fill="#fff"/>
      <ellipse cx="5" cy="107" rx="4.5" ry="2.2" fill="#3a1810"/>
      <ellipse cx="4.5" cy="106" rx="2.5" ry="1.3" fill="#1a0800"/>
      <circle cx="3" cy="105" r="1" fill="#fff" opacity="0.5"/>

      <!-- 粗眉毛（皺起） -->
      <path d="M-18,98 C-14,95 -10,97 -8,99" fill="none" stroke="#5a3828" stroke-width="3" stroke-linecap="round"/>
      <path d="M10,99 C12,97 16,95 20,98" fill="none" stroke="#5a3828" stroke-width="3" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-18,114 C-20,120 -16,124" fill="none" stroke="#a08058" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-14,130 C-8,129 -2,129 4,130" fill="none" stroke="#704840" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-14,130 C-16,132 -17,133" fill="none" stroke="#704840" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <path d="M4,130 C5,132 6,133" fill="none" stroke="#704840" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

      <!-- ===== 畫面左側手臂（角色左手，受擊向後甩） ===== -->
      <path d="M-24,146 Q-48,150 -50,158" fill="none" stroke="url(#chengjiaoArmor)" stroke-width="13" stroke-linecap="round" opacity="0.8"/>
      <circle cx="-50" cy="158" r="6.5" fill="url(#chengjiaoFace)" opacity="0.85"/>

      <!-- ===== 畫面右側手臂（角色右手，持刀受擊偏移） ===== -->
      <path d="M24,146 Q42,152 54,164" fill="none" stroke="url(#chengjiaoArmor)" stroke-width="14" stroke-linecap="round"/>

      <!-- ===== 大刀（受擊偏移，刀指向下，在正x區域） ===== -->
      <path d="M56,166 L52,220 L51,226 L60,224 Q58,196 62,168 Z" fill="url(#chengjiaoBlade)" stroke="#666" stroke-width="0.5"/>
      <line x1="56" y1="166" x2="52" y2="220" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="51" y1="226" x2="60" y2="224" stroke="#777" stroke-width="1.2"/>
      <path d="M62,168 Q58,196 60,224" fill="none" stroke="#ddd" stroke-width="0.8" opacity="0.3"/>
      <line x1="64" y1="164" x2="52" y2="162" stroke="#806030" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="54" y1="160" x2="56" y2="154" stroke="#4a3520" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="56" cy="152" r="3.5" fill="#806030"/>
      <circle cx="55" cy="162" r="7" fill="url(#chengjiaoFace)"/>
    </g>
  </g>
</svg>
