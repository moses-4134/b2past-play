<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 賭坊打手 — 吉卜力2頭身 面朝右（敵方）倒地/戰敗 -->
  <defs>
    <radialGradient id="mobEnforcerFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c4a0"/>
      <stop offset="100%" stop-color="#cca880"/>
    </radialGradient>
    <linearGradient id="mobEnforcerCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a2a28"/>
      <stop offset="100%" stop-color="#1a1a18"/>
    </linearGradient>
    <linearGradient id="mobEnforcerPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222220"/>
      <stop offset="100%" stop-color="#121210"/>
    </linearGradient>
    <linearGradient id="mobEnforcerHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181810"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(78, 10)">
      <!-- 陰影（倒地拉長） -->
      <ellipse cx="-4" cy="228" rx="44" ry="4" fill="#000" opacity="0.08"/>

      <g transform="rotate(90, -4, 176)">
        <!-- ===== 腿（放鬆垂落） ===== -->
        <!-- 後腿 -->
        <ellipse cx="10" cy="200" rx="10" ry="16" fill="url(#mobEnforcerPants)"/>
        <ellipse cx="9" cy="216" rx="11" ry="6" fill="#1a1810"/>
        <!-- 前腿 -->
        <ellipse cx="-14" cy="198" rx="11" ry="17" fill="url(#mobEnforcerPants)"/>
        <ellipse cx="-15" cy="216" rx="12" ry="6" fill="#1a1810"/>

        <!-- ===== 身體（放鬆） ===== -->
        <ellipse cx="-2" cy="160" rx="24" ry="26" fill="url(#mobEnforcerCloth)"/>

        <!-- 勁裝衣褶 -->
        <path d="M-8,144 L-5,156" fill="none" stroke="#0e0e0c" stroke-width="0.8" opacity="0.4"/>

        <!-- 領口 -->
        <path d="M-12,138 L-4,146 L6,138" fill="none" stroke="#1a1a18" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- 腰帶 -->
        <path d="M-24,178 Q-2,184 22,178" fill="none" stroke="#1a1810" stroke-width="5" stroke-linecap="round"/>
        <rect x="-6" y="176" width="8" height="8" rx="1" fill="#404040" stroke="#303030" stroke-width="0.5"/>

        <!-- ===== 右手臂（角色左手，自然垂落） ===== -->
        <path d="M20,146 Q34,158 32,172" fill="none" stroke="url(#mobEnforcerCloth)" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
        <circle cx="32" cy="174" r="5.5" fill="url(#mobEnforcerFace)" opacity="0.85"/>

        <!-- ===== 左手臂（角色右手，自然垂落） ===== -->
        <path d="M-22,146 Q-36,156 -40,168" fill="none" stroke="url(#mobEnforcerCloth)" stroke-width="11" stroke-linecap="round"/>
        <circle cx="-40" cy="170" r="5.5" fill="url(#mobEnforcerFace)"/>

        <!-- ===== 鐵棍（脫手掉落在身旁） ===== -->
        <line x1="-70" y1="182" x2="-58" y2="212" stroke="#404040" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

        <!-- ===== 大頭 ===== -->
        <!-- 後腦 -->
        <ellipse cx="0" cy="96" rx="36" ry="40" fill="url(#mobEnforcerHair)"/>

        <!-- 臉 -->
        <path d="M-26,86 C-30,96 -28,114 -24,126 C-18,134 -6,138 2,136 C12,134 20,126 24,114 C28,102 26,88 20,80 C14,74 4,72 -4,74 C-16,76 -24,80 -26,86Z" fill="url(#mobEnforcerFace)"/>

        <!-- 短髮 -->
        <path d="M-16,78 C-12,60 4,52 14,56 C22,60 26,72 22,82 C18,74 12,68 4,66 C-2,64 -8,66 -14,72" fill="url(#mobEnforcerHair)"/>
        <path d="M-26,86 C-28,78 -30,80 -28,88 C-26,90 -26,88 -26,86" fill="url(#mobEnforcerHair)"/>
        <path d="M20,80 C22,76 24,80 22,88 C20,90 20,88 20,86" fill="url(#mobEnforcerHair)"/>

        <!-- 耳朵 -->
        <path d="M18,100 C22,96 24,102 22,110 C20,114 18,112 18,106" fill="url(#mobEnforcerFace)" stroke="#b09060" stroke-width="0.5"/>

        <!-- ===== 眼睛（閉眼橫線） ===== -->
        <!-- 左眼 -->
        <line x1="-14" y1="106" x2="-6" y2="106" stroke="#282020" stroke-width="2" stroke-linecap="round"/>
        <!-- 右眼 -->
        <line x1="2" y1="106" x2="10" y2="106" stroke="#282020" stroke-width="2" stroke-linecap="round"/>

        <!-- 眉毛（放鬆） -->
        <path d="M-16,101 C-12,99 -8,100 -6,102" fill="none" stroke="#181810" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
        <path d="M8,102 C10,100 14,99 18,101" fill="none" stroke="#181810" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

        <!-- 鼻子 -->
        <path d="M-12,112 C-14,118 -10,122" fill="none" stroke="#b89868" stroke-width="1.3" stroke-linecap="round"/>

        <!-- 嘴巴（倒地一字線） -->
        <path d="M-10,128 C-4,128 2,128 6,128" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>