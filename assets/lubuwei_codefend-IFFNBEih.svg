<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 呂不韋 — 吉卜力2頭身 面朝右（敵方）協防（挺身護人） -->
  <defs>
    <radialGradient id="lubuweiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8dcd0"/>
      <stop offset="100%" stop-color="#d8c8b8"/>
    </radialGradient>
    <linearGradient id="lubuweiRobe" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#3a1028"/>
      <stop offset="100%" stop-color="#2a0818"/>
    </linearGradient>
    <linearGradient id="lubuweiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="lubuweiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0818"/>
      <stop offset="100%" stop-color="#1a0410"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-2" cy="225" rx="28" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（挺身向前，前腿邁出） ===== -->
      <!-- 後腿 -->
      <ellipse cx="14" cy="188" rx="10" ry="18" fill="url(#lubuweiPants)" transform="rotate(-5,14,188)"/>
      <ellipse cx="12" cy="216" rx="11" ry="6" fill="#1a0810"/>
      <!-- 前腿（向前邁步護人） -->
      <ellipse cx="-10" cy="186" rx="11" ry="19" fill="url(#lubuweiPants)" transform="rotate(6,-10,186)"/>
      <ellipse cx="-14" cy="216" rx="12" ry="6" fill="#1a0810"/>

      <!-- 長袍下擺 -->
      <path d="M-28,170 Q-30,194 -26,218 L24,218 Q28,194 26,170" fill="url(#lubuweiRobe)" opacity="0.4"/>

      <!-- ===== 身體（挺身前傾護人） ===== -->
      <ellipse cx="-2" cy="148" rx="26" ry="30" fill="url(#lubuweiRobe)" transform="rotate(-3,-2,148)"/>

      <!-- 內袍領口 -->
      <path d="M-14,124 L-4,142 L8,124" fill="none" stroke="#5a2838" stroke-width="3" stroke-linejoin="round"/>

      <!-- 金色繡花 -->
      <path d="M-18,142 Q-14,150 -10,158" fill="none" stroke="#c8a840" stroke-width="0.8" opacity="0.4"/>
      <path d="M14,140 Q10,148 8,156" fill="none" stroke="#c8a840" stroke-width="0.8" opacity="0.4"/>

      <!-- 金腰帶 -->
      <path d="M-26,172 Q-2,180 22,172" fill="none" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
      <rect x="-6" y="170" width="8" height="8" rx="1" fill="#c8a840" stroke="#a08030" stroke-width="0.5"/>

      <!-- ===== 大頭（堅定護人表情） ===== -->
      <ellipse cx="-2" cy="86" rx="38" ry="40" fill="url(#lubuweiHair)"/>

      <!-- 臉 -->
      <path d="M-32,80 C-36,92 -34,110 -28,122 C-22,130 -8,134 0,132 C10,130 20,122 24,110 C28,98 26,84 20,76 C14,70 2,66 -6,68 C-20,70 -30,74 -32,80Z" fill="url(#lubuweiFace)"/>

      <!-- 高冠 -->
      <rect x="-20" y="34" width="32" height="28" rx="2" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="0.5"/>
      <rect x="-20" y="48" width="32" height="3" fill="#c8a840" opacity="0.8"/>
      <rect x="-18" y="30" width="28" height="6" rx="1" fill="#0c0c0c"/>
      <line x1="-22" y1="44" x2="20" y2="44" stroke="#c8a840" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-22" cy="44" r="2" fill="#c8a840"/>
      <circle cx="20" cy="44" r="2" fill="#c8a840"/>

      <!-- 頭髮 -->
      <path d="M-22,70 C-18,58 -2,52 12,56 C22,60 26,70 24,76 C20,70 12,66 4,64 C-4,62 -14,64 -20,68" fill="url(#lubuweiHair)"/>
      <path d="M20,78 C24,74 26,82 24,90 C22,96 20,92 20,88" fill="url(#lubuweiHair)"/>
      <path d="M22,80 C24,78 25,84 24,88" fill="none" stroke="#4a4a50" stroke-width="1" opacity="0.5"/>

      <!-- 耳朵 -->
      <path d="M20,94 C24,90 26,96 24,104 C22,108 20,106 20,100" fill="url(#lubuweiFace)" stroke="#c0b0a0" stroke-width="0.5"/>

      <!-- ===== 眼（堅定護人，凝視前方） ===== -->
      <ellipse cx="-14" cy="100" rx="6" ry="4" fill="#fff"/>
      <ellipse cx="-15" cy="100.5" rx="3.5" ry="3" fill="#2a1a10"/>
      <ellipse cx="-15.5" cy="100" rx="2" ry="2" fill="#0a0400"/>
      <circle cx="-17" cy="99" r="1" fill="#fff" opacity="0.4"/>
      <path d="M-20,97 C-16,96 -12,96 -8,98" fill="none" stroke="#8a7060" stroke-width="2" stroke-linecap="round"/>

      <ellipse cx="6" cy="100" rx="6" ry="4" fill="#fff"/>
      <ellipse cx="5" cy="100.5" rx="3.5" ry="3" fill="#2a1a10"/>
      <ellipse cx="4.5" cy="100" rx="2" ry="2" fill="#0a0400"/>
      <circle cx="3" cy="99" r="1" fill="#fff" opacity="0.4"/>
      <path d="M2,97 C6,96 10,96 12,98" fill="none" stroke="#8a7060" stroke-width="2" stroke-linecap="round"/>

      <!-- 眉毛（堅定皺眉） -->
      <path d="M-20,92 C-16,90 -12,91 -8,94" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M10,94 C12,91 16,90 18,92" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-8,106 C-10,112 -6,116 -2,116" fill="none" stroke="#c0a890" stroke-width="1.4" stroke-linecap="round"/>

      <!-- 嘴巴（堅定抿嘴） -->
      <path d="M-12,124 C-8,122 0,122 4,124" fill="none" stroke="#705040" stroke-width="2" stroke-linecap="round"/>

      <!-- 鬍子 -->
      <line x1="-10" y1="128" x2="-12" y2="138" stroke="#2a2a30" stroke-width="1" opacity="0.5"/>
      <line x1="-7" y1="128" x2="-8" y2="140" stroke="#2a2a30" stroke-width="1" opacity="0.6"/>
      <line x1="-4" y1="128" x2="-4" y2="141" stroke="#2a2a30" stroke-width="1" opacity="0.6"/>
      <line x1="-1" y1="128" x2="0" y2="140" stroke="#4a4a50" stroke-width="1" opacity="0.5"/>
      <line x1="2" y1="127" x2="4" y2="138" stroke="#4a4a50" stroke-width="1" opacity="0.5"/>

      <!-- ===== 空手臂（負x，向後護住同伴） ===== -->
      <path d="M-24,140 Q-38,146 -44,152" fill="none" stroke="url(#lubuweiRobe)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
      <ellipse cx="-44" cy="152" rx="7" ry="4" fill="#3a1028" opacity="0.5"/>
      <circle cx="-44" cy="152" r="5" fill="url(#lubuweiFace)" opacity="0.85"/>

      <!-- ===== 權杖手臂（正x，向前伸出擋住攻擊者） ===== -->
      <path d="M22,140 Q42,130 50,124" fill="none" stroke="url(#lubuweiRobe)" stroke-width="12" stroke-linecap="round"/>
      <ellipse cx="50" cy="124" rx="7" ry="4" fill="#3a1028" opacity="0.5"/>
      <circle cx="50" cy="124" r="5.5" fill="url(#lubuweiFace)"/>

      <!-- ===== 權杖（正x，前方橫擋，~70px） ===== -->
      <!-- 杖身 -->
      <line x1="52" y1="122" x2="80" y2="60" stroke="#3a2018" stroke-width="4" stroke-linecap="round"/>
      <!-- 漆面亮線 -->
      <line x1="53" y1="120" x2="81" y2="62" stroke="#5a3828" stroke-width="1" opacity="0.3"/>
      <!-- 玉環 -->
      <circle cx="76" cy="70" r="4" fill="none" stroke="#4a8a50" stroke-width="2.5"/>
      <circle cx="76" cy="70" r="4" fill="#4a8a50" opacity="0.2"/>
      <!-- 金龍頭 -->
      <circle cx="80" cy="60" r="5" fill="#c8a840"/>
      <circle cx="80" cy="60" r="3.5" fill="#a08030"/>
      <circle cx="80" cy="58" r="1.5" fill="#e0c060" opacity="0.7"/>
      <!-- 龍角 -->
      <path d="M77,56 L75,51" fill="none" stroke="#c8a840" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M83,56 L85,51" fill="none" stroke="#c8a840" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 杖底 -->
      <circle cx="50" cy="126" r="2.5" fill="#c8a840"/>

      <!-- 袍角飄動 -->
      <path d="M-28,170 Q-36,176 -32,184" fill="none" stroke="#3a1028" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    </g>
  </g>
</svg>
