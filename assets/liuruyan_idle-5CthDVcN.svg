<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 柳萸 — 吉卜力2頭身 側面朝左 待機（持劍護衛） -->
  <defs>
    <radialGradient id="lrFace" cx="40%" cy="35%" r="55%"><stop offset="0%" stop-color="#f8ece0"/><stop offset="100%" stop-color="#e8d4bc"/></radialGradient>
    <linearGradient id="lrRobe" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#8090a0"/><stop offset="100%" stop-color="#607080"/></linearGradient>
    <linearGradient id="lrSkirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#708090"/><stop offset="100%" stop-color="#506070"/></linearGradient>
    <linearGradient id="lrHair" x1="0.2" y1="0" x2="0.7" y2="1"><stop offset="0%" stop-color="#1a0c04"/><stop offset="100%" stop-color="#0a0402"/></linearGradient>
  </defs>
  <g transform="translate(130, 14)">
    <ellipse cx="-4" cy="211" rx="26" ry="5" fill="#000" opacity="0.1"/>
    <ellipse cx="8" cy="190" rx="8" ry="15" fill="url(#lrSkirt)" transform="rotate(-3,8,196)"/>
    <ellipse cx="6" cy="205" rx="9" ry="6" fill="#506068"/>
    <ellipse cx="-12" cy="188" rx="9" ry="16" fill="url(#lrSkirt)" transform="rotate(4,-12,194)"/>
    <ellipse cx="-14" cy="205" rx="10" ry="6" fill="#506068"/>
    <!-- 身體 -->
    <ellipse cx="-2" cy="155" rx="24" ry="26" fill="url(#lrRobe)" transform="rotate(-3,-2,163)"/>
    <!-- 素色腰帶 -->
    <path d="M-24,170 Q-2,178 20,170" fill="none" stroke="#607068" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-4" cy="174" r="3" fill="#708078"/>
    <!-- 白色交領 -->
    <path d="M-10,133 L-5,145 L4,133" fill="none" stroke="#e8e4e0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 角色左手垂放 -->
    <path d="M18,140 Q28,154 26,166" fill="none" stroke="url(#lrRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="26" cy="168" r="4.5" fill="url(#lrFace)" opacity="0.85"/>
    <!-- 角色右手持劍 -->
    <path d="M-22,141 Q-34,146 -38,148" fill="none" stroke="url(#lrRobe)" stroke-width="10" stroke-linecap="round"/>
    <!-- 大頭 -->
    <ellipse cx="0" cy="92" rx="36" ry="38" fill="url(#lrHair)"/>
    <!-- 臉（柔美堅毅） -->
    <path d="M-24,86 C-28,96 -26,112 -20,122 C-14,130 -4,134 6,132 C14,130 20,124 24,114 C28,102 26,90 20,82 C14,76 6,74 -2,76 C-12,78 -22,80 -24,86Z" fill="url(#lrFace)"/>
    <!-- 腮紅 -->
    <ellipse cx="-18" cy="120" rx="6" ry="3.5" fill="#d89090" opacity="0.25"/>
    <!-- 髮頂（簡單盤起，逃亡中的實用髮型） -->
    <path d="M-16,78 C-12,58 4,50 16,54 C26,58 30,70 26,80 C22,74 14,68 4,66 C-4,64 -10,68 -14,74" fill="url(#lrHair)"/>
    <!-- 低盤髮髻 -->
    <ellipse cx="8" cy="68" rx="12" ry="10" fill="url(#lrHair)"/>
    <!-- 木簪（樸素） -->
    <line x1="-4" y1="66" x2="18" y2="62" stroke="#8a7050" stroke-width="2" stroke-linecap="round"/>
    <!-- 瀏海（散落幾縷） -->
    <path d="M-26,88 C-32,76 -34,80 -36,88 C-34,94 -28,94 -26,90" fill="url(#lrHair)"/>
    <path d="M-22,82 C-26,70 -30,74 -30,84 C-28,90 -22,88 -22,84" fill="#1a0c04"/>
    <!-- 散髮（逃亡中散亂的幾縷） -->
    <path d="M22,84 C26,78 28,86 26,96" fill="url(#lrHair)" stroke="none"/>
    <path d="M24,96 C26,106 26,116 24,128" fill="none" stroke="url(#lrHair)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M-28,90 C-30,100 -30,112 -28,124" fill="none" stroke="url(#lrHair)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <!-- 耳朵 -->
    <path d="M22,100 C26,96 28,102 26,108 C24,112 22,110 22,106" fill="url(#lrFace)" stroke="#e0d0bc" stroke-width="0.5"/>
    <!-- 眼睛（堅定柔美） -->
    <ellipse cx="-8" cy="106" rx="7.5" ry="7.5" fill="#fff"/>
    <ellipse cx="-9" cy="107" rx="4.5" ry="5" fill="#2a1810"/>
    <ellipse cx="-9.5" cy="106" rx="2.2" ry="2.8" fill="#0a0804"/>
    <circle cx="-11" cy="104" r="2" fill="#fff" opacity="0.7"/>
    <circle cx="-7" cy="108.5" r="0.8" fill="#fff" opacity="0.4"/>
    <ellipse cx="8" cy="106" rx="7.5" ry="7.5" fill="#fff"/>
    <ellipse cx="7" cy="107" rx="4.5" ry="5" fill="#2a1810"/>
    <ellipse cx="6.5" cy="106" rx="2.2" ry="2.8" fill="#0a0804"/>
    <circle cx="5" cy="104" r="2" fill="#fff" opacity="0.7"/>
    <circle cx="9" cy="108.5" r="0.8" fill="#fff" opacity="0.4"/>
    <!-- 細眉 -->
    <path d="M-15,98 C-12,96 -6,96 -3,98" fill="none" stroke="#1a0c04" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M1,98 C4,96 10,96 13,98" fill="none" stroke="#1a0c04" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 鼻子 -->
    <path d="M-12,114 C-12.5,117 -11,118" fill="none" stroke="#e0d0bc" stroke-width="1" stroke-linecap="round"/>
    <!-- 嘴巴（堅定微抿） -->
    <path d="M-5,124 C-2,125.5 2,125.5 5,124" fill="none" stroke="#906858" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 劍（垂直持，最上層） -->
    <path d="M-40,96 L-41.2,144 L-40,144 L-38.8,144 Z" fill="#b8c0c8" stroke="#8890a0" stroke-width="0.5"/>
    <line x1="-40" y1="98" x2="-40" y2="143" stroke="#e0e4e8" stroke-width="0.8" opacity="0.5"/>
    <line x1="-46" y1="145" x2="-34" y2="145" stroke="#708078" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-40" y1="146" x2="-40" y2="162" stroke="#6a5038" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-40" cy="164" r="2" fill="#708078"/>
    <circle cx="-38" cy="150" r="5" fill="url(#lrFace)"/>
  </g>
</svg>
