<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 韓猛「鐵面」— 吉卜力2頭身 面朝右（敵方）倒地/戰敗 -->
  <defs>
    <radialGradient id="hanmengFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b088"/>
      <stop offset="100%" stop-color="#c0986a"/>
    </radialGradient>
    <linearGradient id="hanmengArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a1818"/>
      <stop offset="100%" stop-color="#2a0c0c"/>
    </linearGradient>
    <linearGradient id="hanmengPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1818"/>
      <stop offset="100%" stop-color="#1e0a0a"/>
    </linearGradient>
    <linearGradient id="hanmengMask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(78, 10)">
      <!-- 陰影（倒地時拉長） -->
      <ellipse cx="-4" cy="228" rx="46" ry="4" fill="#000" opacity="0.08"/>

      <g transform="rotate(90, -4, 176)">
        <!-- ===== 腿（放鬆垂落） ===== -->
        <!-- 後腿 -->
        <ellipse cx="14" cy="202" rx="12" ry="17" fill="url(#hanmengPants)"/>
        <ellipse cx="12" cy="218" rx="13" ry="7" fill="#2a1010"/>
        <!-- 前腿 -->
        <ellipse cx="-14" cy="200" rx="13" ry="18" fill="url(#hanmengPants)"/>
        <ellipse cx="-16" cy="218" rx="14" ry="7" fill="#2a1010"/>

        <!-- ===== 身體（放鬆） ===== -->
        <ellipse cx="-2" cy="162" rx="30" ry="32" fill="url(#hanmengArmor)"/>

        <!-- 重甲鉚釘 -->
        <circle cx="-14" cy="148" r="1.5" fill="#806040" opacity="0.5"/>
        <circle cx="6" cy="148" r="1.5" fill="#806040" opacity="0.5"/>

        <!-- 領口 -->
        <path d="M-14,137 L-6,148 L4,137" fill="none" stroke="#3a1414" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- 腰帶 -->
        <path d="M-30,183 Q-2,192 26,183" fill="none" stroke="#3a2010" stroke-width="7" stroke-linecap="round"/>
        <rect x="-8" y="181" width="10" height="10" rx="1" fill="#806030" stroke="#604020" stroke-width="0.5"/>

        <!-- ===== 大頭 ===== -->
        <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#hanmengFace)"/>

        <!-- 臉 -->
        <path d="M-30,88 C-34,100 -32,116 -26,128 C-20,136 -8,140 2,138 C12,136 22,128 26,116 C30,104 28,90 22,82 C16,76 4,72 -4,74 C-18,76 -28,82 -30,88Z" fill="url(#hanmengFace)"/>

        <ellipse cx="-4" cy="72" rx="16" ry="8" fill="#e8c8a0" opacity="0.1"/>

        <!-- 耳朵 -->
        <path d="M22,100 C26,96 28,102 26,110 C24,114 22,112 22,106" fill="url(#hanmengFace)" stroke="#b08858" stroke-width="0.5"/>

        <!-- 鐵面罩（微歪） -->
        <path d="M-26,112 C-28,118 -26,128 -22,134 C-16,140 -4,144 4,142 C12,140 20,134 24,124 C26,118 24,112 22,110 L-24,110 Z" fill="url(#hanmengMask)" stroke="#383838" stroke-width="0.8"/>
        <circle cx="-16" cy="118" r="1.2" fill="#888" opacity="0.6"/>
        <circle cx="12" cy="118" r="1.2" fill="#888" opacity="0.6"/>
        <ellipse cx="-4" cy="130" rx="6" ry="2" fill="#2a2a2a" opacity="0.3"/>

        <!-- 眼睛（閉眼橫線） -->
        <line x1="-16" y1="104" x2="-8" y2="104" stroke="#2a0c08" stroke-width="2" stroke-linecap="round"/>
        <line x1="2" y1="104" x2="10" y2="104" stroke="#2a0c08" stroke-width="2" stroke-linecap="round"/>

        <!-- 粗眉毛（放鬆） -->
        <path d="M-18,100 C-14,98 -10,99 -8,101" fill="none" stroke="#4a3020" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <path d="M10,101 C12,99 16,98 20,100" fill="none" stroke="#4a3020" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

        <!-- 鼻子 -->
        <path d="M-16,108 C-18,112 -14,114" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

        <!-- ===== 空手臂（負x左肩，自然垂落） ===== -->
        <path d="M-24,148 Q-38,160 -34,176" fill="none" stroke="url(#hanmengArmor)" stroke-width="13" stroke-linecap="round" opacity="0.8"/>
        <circle cx="-34" cy="178" r="6.5" fill="url(#hanmengFace)" opacity="0.85"/>

        <!-- ===== 武器手臂（正x右肩，自然垂落） ===== -->
        <path d="M28,148 Q42,158 48,168" fill="none" stroke="url(#hanmengArmor)" stroke-width="14" stroke-linecap="round"/>
        <circle cx="48" cy="170" r="6.5" fill="url(#hanmengFace)"/>

        <!-- ===== 鐵鞭（脫手掉落地上） ===== -->
        <path d="M40,192 Q60,188 88,186" fill="none" stroke="#505050" stroke-width="5" stroke-linecap="round"/>
        <path d="M41,190 Q61,186 87,184" fill="none" stroke="#888" stroke-width="1" opacity="0.3"/>
        <ellipse cx="90" cy="186" rx="4" ry="3" fill="#505050" stroke="#383838" stroke-width="0.5"/>
      </g>
    </g>
  </g>
</svg>
