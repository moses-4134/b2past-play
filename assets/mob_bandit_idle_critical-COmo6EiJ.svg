<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 山野毛賊 — 瀕死待機（HP <30%：半跪、撐棍、喘息） -->
  <defs>
    <radialGradient id="mobBanditCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </radialGradient>
    <linearGradient id="mobBanditCCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a5a48"/>
      <stop offset="100%" stop-color="#4a3a28"/>
    </linearGradient>
    <linearGradient id="mobBanditCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a28"/>
      <stop offset="100%" stop-color="#2e2218"/>
    </linearGradient>
    <linearGradient id="mobBanditCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#282018"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="198" rx="28" ry="5" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="6" cy="178" rx="9" ry="12" fill="url(#mobBanditCPants)" transform="rotate(-20,6,178)"/>
      <ellipse cx="0" cy="190" rx="8" ry="5" fill="url(#mobBanditCPants)"/>
      <ellipse cx="-2" cy="194" rx="9" ry="5" fill="#3a2818"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-12" cy="172" rx="9" ry="16" fill="url(#mobBanditCPants)" transform="rotate(12,-12,172)"/>
      <ellipse cx="-16" cy="192" rx="10" ry="5" fill="#3a2818"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="142" rx="20" ry="22" fill="url(#mobBanditCCloth)" transform="rotate(-14,-4,142)"/>

      <!-- 破衣裂痕 -->
      <path d="M-10,132 L-7,142" fill="none" stroke="#2e2218" stroke-width="0.8" opacity="0.4"/>
      <path d="M4,136 L7,146" fill="none" stroke="#2e2218" stroke-width="0.7" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-12,124 L-6,134 L2,124" fill="none" stroke="#5a4a38" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-22,160 Q-4,166 16,160" fill="none" stroke="#4a3820" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 右手臂（角色左手，撐在膝蓋上） ===== -->
      <path d="M14,132 Q22,146 14,164" fill="none" stroke="url(#mobBanditCCloth)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="13" cy="166" r="4.5" fill="url(#mobBanditCFace)" opacity="0.85"/>

      <!-- ===== 左手臂（角色右手，撐棍） ===== -->
      <path d="M-18,130 Q-36,138 -44,152" fill="none" stroke="url(#mobBanditCCloth)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>

      <!-- ===== 短棍（插地撐住身體） ===== -->
      <line x1="-46" y1="154" x2="-48" y2="198" stroke="#5a4028" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 棍插入地面效果 -->
      <ellipse cx="-48" cy="198" rx="3" ry="1.5" fill="#5a4a30" opacity="0.4"/>
      <!-- 握棍的手 -->
      <circle cx="-45" cy="156" r="5" fill="url(#mobBanditCFace)"/>

      <!-- ===== 大頭（低垂喘息） ===== -->
      <!-- 後腦蓬亂髮 -->
      <ellipse cx="-2" cy="96" rx="34" ry="36" fill="url(#mobBanditCHair)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-24,88 C-28,98 -26,112 -20,122 C-14,130 -4,134 4,132 C10,130 14,124 18,114 C22,102 20,88 14,80 C8,74 2,72 -4,74 C-14,76 -22,82 -24,88Z" fill="url(#mobBanditCFace)"/>

      <!-- 腮紅（痛苦更明顯） -->
      <ellipse cx="-18" cy="120" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.4"/>

      <!-- 蓬亂頭髮頂部 -->
      <path d="M-18,78 C-14,60 2,52 14,56 C22,60 26,72 22,82 C18,74 12,68 4,66 C-2,64 -10,66 -16,72" fill="url(#mobBanditCHair)"/>

      <!-- 蓬亂瀏海（散亂） -->
      <path d="M-26,88 C-30,76 -34,80 -34,90 C-32,94 -26,94 -26,90" fill="url(#mobBanditCHair)"/>
      <path d="M-22,82 C-26,70 -30,74 -30,86 C-28,90 -22,90 -22,86" fill="#3a3028"/>
      <path d="M-18,80 C-20,68 -24,70 -24,82 C-22,88 -18,86 -18,82" fill="url(#mobBanditCHair)" opacity="0.9"/>
      <!-- 散落髮絲 -->
      <path d="M-30,94 C-32,100 -30,104" fill="none" stroke="url(#mobBanditCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 側髮 -->
      <path d="M16,86 C22,80 24,88 22,96 C20,100 16,98 16,94" fill="url(#mobBanditCHair)"/>
      <path d="M18,96 C24,92 26,102 24,108 C22,112 18,108 18,104" fill="url(#mobBanditCHair)" opacity="0.8"/>

      <!-- 耳朵 -->
      <path d="M14,104 C18,100 20,106 18,112 C16,116 14,114 14,110" fill="url(#mobBanditCFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼瞇成線） ===== -->
      <!-- 左眼（幾乎閉上） -->
      <ellipse cx="-12" cy="108" rx="5" ry="1.8" fill="#fff"/>
      <ellipse cx="-13" cy="108.5" rx="3.5" ry="1.2" fill="#383028"/>
      <ellipse cx="-13.5" cy="108" rx="2" ry="0.8" fill="#1a1008"/>

      <!-- 右眼（勉強睜一線） -->
      <ellipse cx="4" cy="108" rx="5" ry="2.2" fill="#fff"/>
      <ellipse cx="3" cy="108.5" rx="3.5" ry="1.5" fill="#383028"/>
      <ellipse cx="2.5" cy="108" rx="2" ry="1" fill="#1a1008"/>
      <circle cx="1" cy="107.5" r="0.7" fill="#fff" opacity="0.5"/>

      <!-- 眉毛（痛苦下壓） -->
      <path d="M-16,102 C-12,101 -8,103 -6,105" fill="none" stroke="#3a3028" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M6,105 C8,103 12,101 16,103" fill="none" stroke="#3a3028" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 眉間皺紋（深刻） -->
      <path d="M-5,101 C-3,99 0,99 2,101" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-6,103 C-4,101.5 -1,101.5 1,103" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 鼻子 -->
      <path d="M-16,116 C-18,120 -14,124" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-4" cy="129" rx="4.5" ry="4" fill="#703030"/>
      <path d="M-8,127 L0,127" fill="none" stroke="#eee" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

      <!-- 汗滴（多顆） -->
      <path d="M-22,90 C-23,94 -22,100 -21,103" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-21" cy="104" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M18,92 C19,96 18,100" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="18" cy="101" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-6" cy="78" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>
