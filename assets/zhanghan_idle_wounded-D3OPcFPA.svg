<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 章邯 — 吉卜力2頭身 面朝右（敵方）受傷待機（HP 30~60%：身體微傾、單手按腹、眼睛半瞇、槍下垂） -->
  <defs>
    <radialGradient id="zhanghanWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d0b090"/>
      <stop offset="100%" stop-color="#b89870"/>
    </radialGradient>
    <linearGradient id="zhanghanWArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="zhanghanWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#18181e"/>
    </linearGradient>
    <linearGradient id="zhanghanWHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <linearGradient id="zhanghanWSpearhead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d0d8"/>
      <stop offset="100%" stop-color="#a0a0a8"/>
    </linearGradient>
    <linearGradient id="zhanghanWShoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="34" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 紅色短披風（背後，破損） ===== -->
      <path d="M-20,134 Q-24,162 -18,180" fill="none" stroke="#8a2020" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
      <path d="M20,134 Q24,162 18,180" fill="none" stroke="#8a2020" stroke-width="5" stroke-linecap="round" opacity="0.3"/>

      <!-- ===== 腿（重心偏移） ===== -->
      <!-- 後腿 -->
      <ellipse cx="14" cy="202" rx="11" ry="18" fill="url(#zhanghanWPants)" transform="rotate(-3,14,202)"/>
      <ellipse cx="13" cy="218" rx="13" ry="7" fill="#222228"/>
      <rect x="6" y="206" width="14" height="10" rx="2" fill="#3a3a42" stroke="#8a7030" stroke-width="0.8" opacity="0.7"/>
      <!-- 前腿（微彎） -->
      <ellipse cx="-16" cy="200" rx="12" ry="18" fill="url(#zhanghanWPants)" transform="rotate(8,-16,200)"/>
      <ellipse cx="-18" cy="218" rx="13" ry="7" fill="#222228"/>
      <rect x="-25" y="205" width="14" height="10" rx="2" fill="#3a3a42" stroke="#8a7030" stroke-width="0.8"/>

      <!-- ===== 身體（前傾彎腰） ===== -->
      <ellipse cx="-2" cy="158" rx="28" ry="32" fill="url(#zhanghanWArmor)" transform="rotate(-8,-2,158)"/>

      <!-- 鐵甲紋飾 -->
      <line x1="-20" y1="138" x2="-22" y2="182" stroke="#3a3a42" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      <line x1="16" y1="138" x2="18" y2="182" stroke="#3a3a42" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      <!-- 帝國禁衛軍徽章 -->
      <path d="M-2,150 L4,157 L-2,164 L-8,157 Z" fill="#8a2020" stroke="#8a7030" stroke-width="0.8"/>

      <!-- 大肩甲 -->
      <ellipse cx="-34" cy="138" rx="13" ry="9" fill="url(#zhanghanWShoulder)" stroke="#8a7030" stroke-width="1"/>
      <line x1="-42" y1="135" x2="-26" y2="135" stroke="#8a2020" stroke-width="1.5" opacity="0.6"/>
      <ellipse cx="24" cy="138" rx="13" ry="9" fill="url(#zhanghanWShoulder)" stroke="#8a7030" stroke-width="1"/>
      <line x1="16" y1="135" x2="32" y2="135" stroke="#8a2020" stroke-width="1.5" opacity="0.6"/>

      <!-- 領口 -->
      <path d="M-12,132 L-4,148 L6,132" fill="none" stroke="#2a2a30" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-28,182 Q-2,190 26,182" fill="none" stroke="#1a1a20" stroke-width="7" stroke-linecap="round"/>
      <rect x="-8" y="179" width="12" height="10" rx="2" fill="#8a7030" stroke="#6a5020" stroke-width="0.8"/>

      <!-- ===== 畫面左側手臂（按住傷口） ===== -->
      <path d="M-26,144 Q-40,156 -30,174" fill="none" stroke="url(#zhanghanWArmor)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
      <rect x="-36" y="150" width="12" height="8" rx="2" fill="#3a3a42" stroke="#8a7030" stroke-width="0.6" opacity="0.7" transform="rotate(-10,-30,154)"/>
      <circle cx="-30" cy="176" r="6.5" fill="url(#zhanghanWFace)" opacity="0.85"/>

      <!-- ===== 大頭（低頭） ===== -->
      <!-- 頭盔底座 -->
      <ellipse cx="0" cy="92" rx="40" ry="42" fill="url(#zhanghanWHelmet)"/>

      <!-- 臉（微低頭） -->
      <path d="M-30,88 C-34,98 -32,116 -26,126 C-20,134 -8,138 2,136 C12,134 22,128 26,118 C30,106 28,92 22,84 C16,78 4,74 -4,76 C-14,78 -28,82 -30,88Z" fill="url(#zhanghanWFace)"/>

      <!-- 腮紅（傷痛） -->
      <ellipse cx="-22" cy="122" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- 鐵盔主體 -->
      <path d="M-32,80 C-26,62 -4,52 14,56 C28,60 36,72 32,84 C28,76 16,68 6,66 C-4,64 -16,66 -24,74" fill="url(#zhanghanWHelmet)" stroke="#4a4a52" stroke-width="0.8"/>
      <path d="M-32,84 C-22,78 -6,74 14,76 C26,78 34,82 32,86" fill="none" stroke="#4a4a52" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-28,80 C-20,66 -2,58 16,62" fill="none" stroke="#8a2020" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <!-- 鼻護甲 -->
      <line x1="-2" y1="80" x2="-4" y2="106" stroke="#4a4a52" stroke-width="3" stroke-linecap="round"/>
      <!-- 頰甲 -->
      <path d="M-28,88 C-30,98 -28,110 -24,118" fill="none" stroke="#3a3a42" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <path d="M22,88 C24,98 22,110 18,118" fill="none" stroke="#3a3a42" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <!-- 盔頂飾 -->
      <path d="M-2,58 L0,42 L2,58" fill="#4a4a52" stroke="#3a3a42" stroke-width="0.8"/>

      <!-- 耳朵 -->
      <path d="M20,104 C24,100 26,106 24,112" fill="url(#zhanghanWFace)" stroke="#a08860" stroke-width="0.5"/>

      <!-- ===== 眼睛（左眼半瞇、右眼微睜） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-12" cy="108" rx="5" ry="2.8" fill="#fff"/>
      <ellipse cx="-13" cy="109" rx="3.2" ry="2" fill="#2a2018"/>
      <ellipse cx="-13.5" cy="108" rx="1.8" ry="1.2" fill="#1a0800"/>

      <!-- 右眼（微瞇） -->
      <ellipse cx="8" cy="108" rx="5" ry="3.5" fill="#fff"/>
      <ellipse cx="7" cy="109" rx="3.2" ry="2.8" fill="#2a2018"/>
      <ellipse cx="6.5" cy="108" rx="1.8" ry="1.8" fill="#1a0800"/>
      <circle cx="5" cy="107" r="0.8" fill="#fff" opacity="0.6"/>

      <!-- 粗眉（皺眉） -->
      <path d="M-18,102 C-14,100 -10,101 -7,103" fill="none" stroke="#2a1808" stroke-width="3" stroke-linecap="round"/>
      <path d="M12,103 C14,101 18,100 22,102" fill="none" stroke="#2a1808" stroke-width="3" stroke-linecap="round"/>

      <!-- 眉間皺紋 -->
      <path d="M-5,104 C-3,102 -1,102 1,104" fill="none" stroke="#a08860" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 鼻子 -->
      <path d="M-16,116 C-18,122 -14,126" fill="none" stroke="#a08860" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <line x1="-12" y1="132" x2="6" y2="132" stroke="#805040" stroke-width="2" stroke-linecap="round"/>
      <path d="M-12,132 C-13,134 -14,135" fill="none" stroke="#805040" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴 -->
      <path d="M-24,94 C-25,98 -24,102 -23,104" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-23" cy="105" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>

      <!-- ===== 畫面右側手臂（持槍，下垂） ===== -->
      <path d="M26,142 Q40,148 46,162" fill="none" stroke="url(#zhanghanWArmor)" stroke-width="13" stroke-linecap="round"/>
      <rect x="34" y="146" width="12" height="8" rx="2" fill="#3a3a42" stroke="#8a7030" stroke-width="0.6" transform="rotate(20,40,150)"/>

      <!-- ===== 槍（下垂） ===== -->
      <line x1="78" y1="218" x2="38" y2="140" stroke="#4a4040" stroke-width="5" stroke-linecap="round"/>
      <!-- 槍頭（朝下方） -->
      <path d="M82,226 L76,220 L80,214 Z" fill="url(#zhanghanWSpearhead)" stroke="#888" stroke-width="0.8"/>
      <!-- 紅纓 -->
      <circle cx="78" cy="218" r="2.5" fill="#aa2020"/>

      <!-- 右手（握槍） -->
      <circle cx="46" cy="162" r="6.5" fill="url(#zhanghanWFace)"/>
    </g>
  </g>
</svg>