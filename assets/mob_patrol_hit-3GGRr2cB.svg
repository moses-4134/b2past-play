<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙國巡邏兵 — 受擊（後仰） -->
  <defs>
    <radialGradient id="mobPatrolFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c4a0"/>
      <stop offset="100%" stop-color="#cca880"/>
    </radialGradient>
    <linearGradient id="mobPatrolArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a4038"/>
      <stop offset="100%" stop-color="#2a3028"/>
    </linearGradient>
    <linearGradient id="mobPatrolPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3028"/>
      <stop offset="100%" stop-color="#1a2018"/>
    </linearGradient>
    <linearGradient id="mobPatrolHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobPatrolSteel" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="4" cy="198" rx="22" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（後仰踉蹌） ===== -->
      <!-- 後腿 -->
      <ellipse cx="14" cy="178" rx="8" ry="15" fill="url(#mobPatrolPants)" transform="rotate(8,14,178)"/>
      <ellipse cx="16" cy="192" rx="9" ry="6" fill="#1a2018"/>
      <!-- 前腿（前滑） -->
      <ellipse cx="-8" cy="176" rx="9" ry="16" fill="url(#mobPatrolPants)" transform="rotate(-10,-8,176)"/>
      <ellipse cx="-12" cy="192" rx="10" ry="6" fill="#1a2018"/>

      <!-- ===== 身體（大幅後仰） ===== -->
      <ellipse cx="2" cy="146" rx="23" ry="25" fill="url(#mobPatrolArmor)" transform="rotate(15,2,146)"/>

      <!-- 甲片紋理 -->
      <path d="M-6,136 L-3,146" fill="none" stroke="#1a2018" stroke-width="0.8" opacity="0.4"/>
      <path d="M8,140 L11,150" fill="none" stroke="#1a2018" stroke-width="0.7" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-8,128 L-2,138 L6,128" fill="none" stroke="#2a3028" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-18,166 Q2,172 22,166" fill="none" stroke="#2a2418" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 大頭（後仰） ===== -->
      <ellipse cx="4" cy="98" rx="34" ry="36" fill="url(#mobPatrolHair)" transform="rotate(12,4,98)"/>

      <!-- 臉 -->
      <path d="M-22,90 C-26,100 -24,112 -18,122 C-12,130 -4,134 4,132 C10,130 14,124 18,114 C22,102 20,90 14,82 C8,76 2,74 -4,76 C-12,78 -20,84 -22,90Z" fill="url(#mobPatrolFace)" transform="rotate(12,0,106)"/>

      <!-- 頭髮頂部 -->
      <path d="M-12,78 C-8,62 8,54 20,58 C28,62 32,72 28,82 C24,74 18,68 10,66 C4,64 -4,66 -10,72" fill="url(#mobPatrolHair)" transform="rotate(12,4,68)"/>

      <!-- 巡邏布帽 -->
      <path d="M-22,80 C-18,70 -4,64 12,66 C22,68 30,74 28,80" fill="#3a4038" stroke="#2a3028" stroke-width="0.5" transform="rotate(12,4,74)"/>
      <path d="M-24,80 C-24,78 -22,76 -18,78 L30,78 C32,78 32,82 30,82 L-22,82 C-24,82 -24,80 -24,80Z" fill="#3a4038" stroke="#2a3028" stroke-width="0.5" transform="rotate(12,4,80)"/>

      <!-- 瀏海 -->
      <path d="M-18,86 C-22,78 -24,82 -24,90 C-22,94 -18,92 -18,88" fill="url(#mobPatrolHair)" transform="rotate(12,0,86)"/>

      <!-- 側髮 -->
      <path d="M22,84 C28,78 30,84 28,92 C26,96 22,94 22,90" fill="url(#mobPatrolHair)" transform="rotate(12,22,88)"/>

      <!-- 耳朵 -->
      <path d="M20,102 C24,98 26,104 24,110 C22,114 20,112 20,108" fill="url(#mobPatrolFace)" stroke="#b09060" stroke-width="0.5" transform="rotate(12,20,106)"/>

      <!-- ===== 眼睛（瞇眼痛苦 ry=2.5） ===== -->
      <ellipse cx="-8" cy="108" rx="6" ry="2.5" fill="#fff" transform="rotate(12,0,106)"/>
      <ellipse cx="-9" cy="108" rx="3" ry="1.8" fill="#2a2820" transform="rotate(12,0,106)"/>

      <ellipse cx="8" cy="108" rx="6" ry="2.5" fill="#fff" transform="rotate(12,0,106)"/>
      <ellipse cx="7" cy="108" rx="3" ry="1.8" fill="#2a2820" transform="rotate(12,0,106)"/>

      <!-- 眉毛（皺成一團） -->
      <path d="M-14,102 C-10,100 -6,102 -4,104" fill="none" stroke="#2a2420" stroke-width="2" stroke-linecap="round" transform="rotate(12,0,106)"/>
      <path d="M6,104 C8,102 14,100 18,102" fill="none" stroke="#2a2420" stroke-width="2" stroke-linecap="round" transform="rotate(12,0,106)"/>

      <!-- 鼻子 -->
      <path d="M-12,116 C-14,120 -10,124" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round" transform="rotate(12,0,106)"/>

      <!-- 嘴巴（痛苦張嘴） -->
      <ellipse cx="-1" cy="130" rx="5" ry="4" fill="#4a2020" transform="rotate(12,0,106)"/>

      <!-- ===== 左手臂（負x，後甩） ===== -->
      <path d="M-14,138 Q-28,130 -36,122" fill="none" stroke="url(#mobPatrolArmor)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-36" cy="120" r="4.5" fill="url(#mobPatrolFace)" opacity="0.85"/>

      <!-- ===== 右手臂（正x，劍被打歪） ===== -->
      <path d="M20,138 Q36,128 42,118" fill="none" stroke="url(#mobPatrolArmor)" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== 劍（斜飛，50.6px） ===== -->
      <line x1="48" y1="66" x2="42" y2="116.6" stroke="url(#mobPatrolSteel)" stroke-width="4" stroke-linecap="round"/>
      <!-- 劍格 -->
      <rect x="38" y="114" width="10" height="3" rx="1" fill="#6a5a40"/>
      <!-- 劍柄 -->
      <rect x="40" y="117" width="6" height="9" rx="1" fill="#4a3020"/>
      <!-- 握劍的手 -->
      <circle cx="43" cy="120" r="5" fill="url(#mobPatrolFace)"/>
    </g>
  </g>
</svg>