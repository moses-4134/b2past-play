<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 趙王宮朝堂 — 吉卜力風格：藍銀冷調、青玉柱、素雅莊嚴（別於秦宮黑紅金） -->
  <defs>
    <linearGradient id="zhaoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16202e"/>
      <stop offset="55%" stop-color="#1e2c3c"/>
      <stop offset="100%" stop-color="#16222e"/>
    </linearGradient>
    <linearGradient id="zhaoPillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#28485a"/>
      <stop offset="35%" stop-color="#3a6a82"/>
      <stop offset="70%" stop-color="#3a6a82"/>
      <stop offset="100%" stop-color="#28485a"/>
    </linearGradient>
    <linearGradient id="zhaoFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243444"/>
      <stop offset="100%" stop-color="#161e28"/>
    </linearGradient>
    <radialGradient id="zhaoGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#88c0e0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4080a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="zhaoLamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a0d8f0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3080b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#zhaoBg)"/>
  <!-- 天花板 -->
  <rect x="0" y="0" width="960" height="34" fill="#101822"/>
  <rect x="0" y="31" width="960" height="7" fill="#22405060" opacity="0.8"/>
  <line x1="0" y1="24" x2="960" y2="24" stroke="#88c0e0" stroke-width="0.5" opacity="0.15"/>
  <!-- 後牆 -->
  <rect x="0" y="34" width="960" height="148" fill="#1e2c3c" opacity="0.9"/>

  <!-- 巨柱（青玉柱，銀線） -->
  <g>
    <rect x="60" y="34" width="38" height="144" fill="url(#zhaoPillar)"/>
    <rect x="55" y="30" width="48" height="9" fill="#4a7a92" rx="2"/><rect x="55" y="172" width="48" height="9" fill="#4a7a92" rx="2"/>
    <line x1="79" y1="42" x2="79" y2="174" stroke="#b8dcec" stroke-width="0.7" opacity="0.25"/>
    <rect x="222" y="34" width="38" height="144" fill="url(#zhaoPillar)"/>
    <rect x="217" y="30" width="48" height="9" fill="#4a7a92" rx="2"/><rect x="217" y="172" width="48" height="9" fill="#4a7a92" rx="2"/>
    <line x1="241" y1="42" x2="241" y2="174" stroke="#b8dcec" stroke-width="0.7" opacity="0.25"/>
    <rect x="700" y="34" width="38" height="144" fill="url(#zhaoPillar)"/>
    <rect x="695" y="30" width="48" height="9" fill="#4a7a92" rx="2"/><rect x="695" y="172" width="48" height="9" fill="#4a7a92" rx="2"/>
    <line x1="719" y1="42" x2="719" y2="174" stroke="#b8dcec" stroke-width="0.7" opacity="0.25"/>
    <rect x="862" y="34" width="38" height="144" fill="url(#zhaoPillar)"/>
    <rect x="857" y="30" width="48" height="9" fill="#4a7a92" rx="2"/><rect x="857" y="172" width="48" height="9" fill="#4a7a92" rx="2"/>
    <line x1="881" y1="42" x2="881" y2="174" stroke="#b8dcec" stroke-width="0.7" opacity="0.25"/>
  </g>

  <!-- 王座高台 -->
  <rect x="350" y="150" width="260" height="30" fill="#2a4050" stroke="#88c0e0" stroke-width="0.5" opacity="0.8"/>
  <rect x="370" y="132" width="220" height="22" fill="#243848" stroke="#88c0e0" stroke-width="0.5" opacity="0.8"/>
  <rect x="395" y="115" width="170" height="20" fill="#1e3040" stroke="#88c0e0" stroke-width="0.5" opacity="0.8"/>
  <!-- 王座 -->
  <rect x="440" y="55" width="80" height="65" fill="#243848" rx="3"/>
  <rect x="435" y="46" width="90" height="13" fill="#2e4a5c" rx="4"/>
  <rect x="450" y="30" width="60" height="20" fill="#243848" rx="3"/>
  <rect x="455" y="26" width="50" height="8" fill="#a8d4e8" rx="3" opacity="0.5"/>
  <circle cx="480" cy="40" r="5" fill="#a8d4e8" opacity="0.4"/>
  <ellipse cx="480" cy="85" rx="200" ry="100" fill="url(#zhaoGlow)"/>

  <!-- 後牆掛幅（趙國方勝紋，素青） -->
  <rect x="282" y="45" width="48" height="98" fill="#1c3444" rx="2" stroke="#88c0e0" stroke-width="0.7" opacity="0.7"/>
  <path d="M296,70 l10,-10 l10,10 l-10,10 z" fill="#88c0e0" opacity="0.2"/>
  <rect x="630" y="45" width="48" height="98" fill="#1c3444" rx="2" stroke="#88c0e0" stroke-width="0.7" opacity="0.7"/>
  <path d="M644,70 l10,-10 l10,10 l-10,10 z" fill="#88c0e0" opacity="0.2"/>

  <!-- 冷光燈 -->
  <circle cx="160" cy="85" r="48" fill="url(#zhaoLamp)"/>
  <rect x="155" y="60" width="10" height="30" fill="#3a5060" rx="2"/>
  <ellipse cx="160" cy="57" rx="6" ry="10" fill="#a0d8f0" opacity="0.7"/>
  <circle cx="800" cy="85" r="48" fill="url(#zhaoLamp)"/>
  <rect x="795" y="60" width="10" height="30" fill="#3a5060" rx="2"/>
  <ellipse cx="800" cy="57" rx="6" ry="10" fill="#a0d8f0" opacity="0.7"/>

  <!-- 地板 -->
  <rect x="0" y="180" width="960" height="360" fill="url(#zhaoFloor)"/>
  <g stroke="#2c4454" stroke-width="1" opacity="0.25">
    <line x1="0" y1="225" x2="960" y2="225"/><line x1="0" y1="278" x2="960" y2="278"/>
    <line x1="0" y1="335" x2="960" y2="335"/><line x1="0" y1="400" x2="960" y2="400"/><line x1="0" y1="470" x2="960" y2="470"/>
  </g>
  <g stroke="#2c4454" stroke-width="0.6" opacity="0.15">
    <line x1="160" y1="180" x2="160" y2="540"/><line x1="320" y1="180" x2="320" y2="540"/>
    <line x1="480" y1="180" x2="480" y2="540"/><line x1="640" y1="180" x2="640" y2="540"/><line x1="800" y1="180" x2="800" y2="540"/>
  </g>
  <!-- 青毯 -->
  <rect x="420" y="180" width="120" height="360" fill="#1c4058" opacity="0.4"/>
  <line x1="420" y1="180" x2="420" y2="540" stroke="#88c0e0" stroke-width="1" opacity="0.2"/>
  <line x1="540" y1="180" x2="540" y2="540" stroke="#88c0e0" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="180" x2="960" y2="180" stroke="#0e1620" stroke-width="3"/>

  <!-- 銀塵 -->
  <circle cx="300" cy="110" r="1" fill="#b8dcec" opacity="0.25"/>
  <circle cx="480" cy="50" r="1.3" fill="#d0ecf8" opacity="0.3"/>
  <circle cx="650" cy="100" r="1.2" fill="#b8dcec" opacity="0.22"/>
  <circle cx="200" cy="140" r="1.2" fill="#d0ecf8" opacity="0.2"/>
  <circle cx="750" cy="125" r="1" fill="#b8dcec" opacity="0.2"/>
  <rect width="960" height="540" fill="#2060a0" opacity="0.03"/>
</svg>
