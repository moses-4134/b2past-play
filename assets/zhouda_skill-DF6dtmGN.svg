<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 武師「鐵臂」周大 — 技能（鐵臂功蓄力，手臂發暗紅光） -->
  <defs>
    <radialGradient id="zhoudaFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </radialGradient>
    <linearGradient id="zhoudaCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a4038"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </linearGradient>
    <linearGradient id="zhoudaPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3428"/>
      <stop offset="100%" stop-color="#1e1a10"/>
    </linearGradient>
    <linearGradient id="zhoudaHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="zhoudaIronGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6040" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#aa3020" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#aa3020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="32" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（站穩蓄力馬步） ===== -->
      <!-- 後腿 -->
      <ellipse cx="14" cy="202" rx="11" ry="17" fill="url(#zhoudaPants)" transform="rotate(-5,14,202)"/>
      <ellipse cx="12" cy="218" rx="12" ry="7" fill="#3a2818"/>
      <!-- 前腿 -->
      <ellipse cx="-16" cy="200" rx="12" ry="18" fill="url(#zhoudaPants)" transform="rotate(5,-16,200)"/>
      <ellipse cx="-18" cy="218" rx="13" ry="7" fill="#3a2818"/>

      <!-- ===== 身體（挺直蓄力） ===== -->
      <ellipse cx="-2" cy="160" rx="28" ry="32" fill="url(#zhoudaCloth)" transform="rotate(-2,-2,160)"/>

      <!-- 束腰布帶 -->
      <path d="M-28,182 Q-2,190 24,182" fill="none" stroke="#5a4830" stroke-width="6" stroke-linecap="round"/>
      <rect x="-6" y="180" width="8" height="8" rx="1" fill="#6a5838" stroke="#4a3828" stroke-width="0.5"/>

      <!-- 領口 -->
      <path d="M-12,136 L-4,150 L6,136" fill="none" stroke="#5a5040" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- ===== 大頭（蓄力凝視） ===== -->
      <ellipse cx="0" cy="96" rx="40" ry="42" fill="url(#zhoudaHair)"/>

      <!-- 臉 -->
      <path d="M-30,88 C-34,100 -32,116 -26,126 C-20,134 -8,138 4,136 C14,134 22,128 26,118 C30,106 28,92 22,84 C16,78 4,74 -6,76 C-18,78 -28,82 -30,88Z" fill="url(#zhoudaFace)"/>

      <!-- 極短平頭 -->
      <path d="M-20,78 C-16,60 2,52 18,56 C28,60 32,72 28,82 C24,74 16,68 8,66 C0,64 -10,66 -16,72" fill="url(#zhoudaHair)"/>
      <path d="M-24,82 C-20,66 4,56 22,62 C30,66 32,76 28,84" fill="url(#zhoudaHair)" opacity="0.5"/>

      <!-- 耳朵 -->
      <path d="M20,104 C24,100 26,106 24,112 C22,116 20,114 20,108" fill="url(#zhoudaFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（蓄力凝視，高光稍大） ===== -->
      <ellipse cx="-10" cy="108" rx="6" ry="6.5" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="4" ry="4.5" fill="#2a1410"/>
      <ellipse cx="-11.5" cy="108" rx="2.2" ry="2.5" fill="#140a06"/>
      <circle cx="-13" cy="107" r="1.3" fill="#fff" opacity="0.6"/>

      <ellipse cx="6" cy="108" rx="6" ry="6.5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="4" ry="4.5" fill="#2a1410"/>
      <ellipse cx="4.5" cy="108" rx="2.2" ry="2.5" fill="#140a06"/>
      <circle cx="3" cy="107" r="1.3" fill="#fff" opacity="0.6"/>

      <!-- 粗眉毛 -->
      <path d="M-16,100 C-12,98 -8,100 -6,102" fill="none" stroke="#2a2018" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M8,102 C10,100 14,98 18,100" fill="none" stroke="#2a2018" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-16,116 C-18,122 -14,126" fill="none" stroke="#b09068" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 短鬍渣 -->
      <ellipse cx="-4" cy="134" rx="12" ry="5" fill="#3a3020" opacity="0.2"/>

      <!-- 嘴巴（凶狠一字線） -->
      <path d="M-12,130 C-6,130 0,130 6,130" fill="none" stroke="#704840" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-12,130 C-14,132 -15,133" fill="none" stroke="#704840" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M6,130 C7,132 8,133" fill="none" stroke="#704840" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- ===== 角色左手臂（蓄力外張） ===== -->
      <path d="M-22,146 Q-38,136 -42,120" fill="none" stroke="url(#zhoudaCloth)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
      <!-- 鐵環（左臂） -->
      <ellipse cx="-32" cy="138" rx="7" ry="3" fill="none" stroke="#888" stroke-width="2" transform="rotate(-20,-32,138)"/>
      <ellipse cx="-35" cy="133" rx="7" ry="3" fill="none" stroke="#999" stroke-width="2" transform="rotate(-20,-35,133)"/>
      <ellipse cx="-38" cy="128" rx="7" ry="3" fill="none" stroke="#888" stroke-width="2" transform="rotate(-20,-38,128)"/>
      <path d="M-34,130 Q-38,126 -40,122" fill="none" stroke="#3a2818" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-42" cy="118" r="24" fill="url(#zhoudaIronGlow)" opacity="0.1"/>
      <circle cx="-42" cy="118" r="18" fill="url(#zhoudaIronGlow)"/>
      <circle cx="-42" cy="118" r="7" fill="url(#zhoudaFace)" opacity="0.85"/>
      <path d="M-39,114 Q-42,112 -45,114" fill="none" stroke="#c8a070" stroke-width="1.2" stroke-linecap="round"/>

      <!-- ===== 角色右手臂（主手，蓄力外張） ===== -->
      <path d="M24,146 Q40,136 44,120" fill="none" stroke="url(#zhoudaCloth)" stroke-width="14" stroke-linecap="round"/>
      <!-- 鐵環（右臂） -->
      <ellipse cx="34" cy="138" rx="8" ry="3.5" fill="none" stroke="#888" stroke-width="2.5" transform="rotate(20,34,138)"/>
      <ellipse cx="37" cy="133" rx="8" ry="3.5" fill="none" stroke="#aaa" stroke-width="2.5" transform="rotate(20,37,133)"/>
      <ellipse cx="40" cy="128" rx="8" ry="3.5" fill="none" stroke="#888" stroke-width="2.5" transform="rotate(20,40,128)"/>
      <path d="M36,130 Q40,126 42,122" fill="none" stroke="#3a2818" stroke-width="4" stroke-linecap="round"/>
      <circle cx="44" cy="118" r="24" fill="url(#zhoudaIronGlow)" opacity="0.1"/>
      <circle cx="44" cy="118" r="18" fill="url(#zhoudaIronGlow)"/>
      <circle cx="44" cy="118" r="7.5" fill="url(#zhoudaFace)"/>
      <path d="M47,114 Q44,112 41,114" fill="none" stroke="#c8a070" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 鐵臂光效線條 -->
      <line x1="-34" y1="136" x2="-40" y2="122" stroke="#aa4030" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
      <line x1="-28" y1="140" x2="-36" y2="126" stroke="#aa4030" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
      <line x1="36" y1="136" x2="42" y2="122" stroke="#aa4030" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
      <line x1="30" y1="140" x2="38" y2="126" stroke="#aa4030" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
