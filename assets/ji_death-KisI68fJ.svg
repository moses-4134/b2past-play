<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 唐綺 — 吉卜力2頭身 側面朝左 倒地/戰敗 -->
  <defs>
    <radialGradient id="jiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f8ece0"/>
      <stop offset="100%" stop-color="#ecd8c0"/>
    </radialGradient>
    <linearGradient id="jiRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#384868"/>
      <stop offset="100%" stop-color="#283848"/>
    </linearGradient>
    <linearGradient id="jiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="jiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#18100a"/>
      <stop offset="100%" stop-color="#0c0604"/>
    </linearGradient>
    <linearGradient id="jiSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <g transform="translate(78, 10)">
    <!-- 陰影（倒地時拉長） -->
    <ellipse cx="-4" cy="222" rx="38" ry="4" fill="#000" opacity="0.08"/>

    <g transform="rotate(90, -4, 176)">
      <!-- ===== 腿（放鬆垂落） ===== -->
      <!-- 後腿 -->
      <ellipse cx="8" cy="196" rx="8" ry="15" fill="url(#jiPants)"/>
      <ellipse cx="6" cy="211" rx="9" ry="6" fill="#2a2028"/>
      <!-- 前腿 -->
      <ellipse cx="-12" cy="194" rx="9" ry="16" fill="url(#jiPants)"/>
      <ellipse cx="-14" cy="211" rx="10" ry="6" fill="#2a2028"/>

      <!-- ===== 身體（放鬆） ===== -->
      <ellipse cx="-2" cy="159" rx="24" ry="26" fill="url(#jiRobe)"/>

      <!-- 銀灰色腰帶 -->
      <path d="M-24,174 Q-2,182 20,174" fill="none" stroke="#909898" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-4" cy="178" r="2.5" fill="#b0b8b8"/>

      <!-- 領口 -->
      <path d="M-10,137 L-5,149 L2,137" fill="none" stroke="#506880" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- ===== 畫面右側手臂（角色左手，自然垂落） ===== -->
      <path d="M18,142 Q30,154 26,168" fill="none" stroke="url(#jiRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
      <circle cx="26" cy="168" r="4.5" fill="url(#jiFace)" opacity="0.85"/>

      <!-- ===== 畫面左側手臂（角色右手，自然垂落，劍脫手） ===== -->
      <path d="M-23,145 Q-36,154 -40,164" fill="none" stroke="url(#jiRobe)" stroke-width="10" stroke-linecap="round"/>
      <!-- 空手 -->
      <circle cx="-40" cy="168" r="5" fill="url(#jiFace)"/>

      <!-- ===== 劍（脫手掉落在身旁地上） ===== -->
      <line x1="-82" y1="190" x2="-32" y2="198" stroke="url(#jiSteel)" stroke-width="4" stroke-linecap="round"/>
      <line x1="-82" y1="190" x2="-32" y2="198" stroke="#eee" stroke-width="1.5" opacity="0.4"/>
      <!-- 劍尖 -->
      <line x1="-82" y1="190" x2="-88" y2="188" stroke="#ccc" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 護手 -->
      <line x1="-33" y1="195" x2="-30" y2="202" stroke="#c0a050" stroke-width="3" stroke-linecap="round"/>
      <!-- 劍柄 -->
      <line x1="-29" y1="199" x2="-24" y2="200" stroke="#5a4530" stroke-width="4" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="-22" cy="201" r="2.5" fill="#c0a050"/>

      <!-- ===== 大頭 ===== -->
      <!-- 後腦髮量 -->
      <ellipse cx="0" cy="94" rx="38" ry="40" fill="url(#jiHair)"/>

      <!-- 臉 -->
      <path d="M-24,86 C-28,96 -26,112 -20,122 C-14,130 -4,135 4,133 C10,131 16,124 20,114 C24,102 22,90 16,82 C10,76 2,74 -4,76 C-14,78 -22,80 -24,86Z" fill="url(#jiFace)"/>

      <!-- 腮紅（更淡） -->
      <ellipse cx="-20" cy="122" rx="7" ry="4" fill="#d8a0a0" opacity="0.15"/>

      <!-- 頭髮頂部 -->
      <path d="M-18,78 C-14,58 2,50 16,54 C26,58 30,70 26,82 C22,76 14,70 6,68 C-2,66 -10,68 -14,74" fill="url(#jiHair)"/>

      <!-- 髮髻（散落） -->
      <ellipse cx="2" cy="52" rx="14" ry="10" fill="url(#jiHair)"/>
      <ellipse cx="2" cy="50" rx="12" ry="8" fill="#18100a"/>
      <!-- 銀色小環髮飾（歪斜） -->
      <circle cx="4" cy="46" r="3" fill="none" stroke="#c0c8d0" stroke-width="1.5"/>
      <circle cx="4" cy="46" r="1" fill="#d8e0e8"/>

      <!-- 瀏海 -->
      <path d="M-28,88 C-34,76 -36,80 -38,88 C-36,94 -30,96 -28,92" fill="url(#jiHair)"/>
      <path d="M-24,82 C-28,70 -32,74 -32,84 C-30,90 -24,90 -24,86" fill="#18100a"/>
      <path d="M-20,78 C-22,68 -26,70 -26,80 C-24,86 -20,86 -20,82" fill="url(#jiHair)" opacity="0.9"/>

      <!-- 側髮（散落） -->
      <path d="M22,84 C28,78 30,86 28,94 C26,100 22,98 22,92" fill="url(#jiHair)"/>
      <path d="M24,92 C28,90 30,98 28,106 C26,112 22,108 22,102" fill="url(#jiHair)" opacity="0.8"/>
      <path d="M24,106 C28,104 30,112 28,120 C26,128 22,124 22,118" fill="url(#jiHair)" opacity="0.6"/>
      <!-- 左側散髮 -->
      <path d="M-30,92 C-32,104 -32,118 -30,132" fill="none" stroke="url(#jiHair)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

      <!-- 耳朵 -->
      <path d="M20,100 C24,96 26,102 24,108 C22,112 20,110 20,106" fill="url(#jiFace)" stroke="#e0d0c0" stroke-width="0.5"/>

      <!-- ===== 眼睛（閉眼，橫線） ===== -->
      <!-- 左眼睫毛 -->
      <path d="M-17,98 C-14,96 -8,96 -5,98" fill="none" stroke="#18100a" stroke-width="0.8" opacity="0.4"/>
      <!-- 左眼（閉眼橫線） -->
      <line x1="-14" y1="106" x2="-6" y2="106" stroke="#2a2830" stroke-width="2" stroke-linecap="round"/>
      <!-- 右眼睫毛 -->
      <path d="M-1,98 C2,96 8,96 11,98" fill="none" stroke="#18100a" stroke-width="0.8" opacity="0.4"/>
      <!-- 右眼（閉眼橫線） -->
      <line x1="2" y1="106" x2="10" y2="106" stroke="#2a2830" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-14.5,118 -13.5,119" fill="none" stroke="#e0d0c0" stroke-width="1" stroke-linecap="round"/>

      <!-- 嘴巴（一字線） -->
      <path d="M-8,128 C-5,128 -1,128 2,128" fill="none" stroke="#906050" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>