<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙國斥候 — 瀕死待機（HP <30%：半跪、弓當支撐、喘息） -->
  <defs>
    <radialGradient id="mobScoutCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc098"/>
      <stop offset="100%" stop-color="#c4a478"/>
    </radialGradient>
    <linearGradient id="mobScoutCArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a4830"/>
      <stop offset="100%" stop-color="#2a3820"/>
    </linearGradient>
    <linearGradient id="mobScoutCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4030"/>
      <stop offset="100%" stop-color="#2a2e20"/>
    </linearGradient>
    <linearGradient id="mobScoutCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2418"/>
      <stop offset="100%" stop-color="#1a1610"/>
    </linearGradient>
    <linearGradient id="mobScoutCBow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a20"/>
      <stop offset="100%" stop-color="#3a2410"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="196" rx="28" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪） ===== -->
      <ellipse cx="8" cy="178" rx="8" ry="12" fill="url(#mobScoutCPants)" transform="rotate(-20,8,178)"/>
      <ellipse cx="2" cy="188" rx="7" ry="5" fill="url(#mobScoutCPants)"/>
      <ellipse cx="0" cy="192" rx="9" ry="5" fill="#2a2418"/>
      <ellipse cx="-12" cy="174" rx="9" ry="16" fill="url(#mobScoutCPants)" transform="rotate(12,-12,174)"/>
      <ellipse cx="-16" cy="192" rx="10" ry="6" fill="#2a2418"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="144" rx="21" ry="22" fill="url(#mobScoutCArmor)" transform="rotate(-14,-4,144)"/>

      <!-- 領口 -->
      <path d="M-12,128 L-7,138 L-1,128" fill="none" stroke="#4a5838" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- 箭囊帶（鬆散） -->
      <path d="M-18,130 L10,162" fill="none" stroke="#4a3828" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

      <!-- 腰帶 -->
      <path d="M-24,162 Q-6,170 14,164" fill="none" stroke="#3a3020" stroke-width="3.5" stroke-linecap="round"/>

      <!-- ===== 大頭（低垂） ===== -->
      <ellipse cx="-2" cy="92" rx="34" ry="36" fill="url(#mobScoutCHair)"/>

      <!-- 臉 -->
      <path d="M-26,88 C-30,98 -28,112 -22,122 C-16,128 -8,132 0,130 C8,128 12,122 16,112 C20,100 18,88 12,80 C6,74 0,72 -6,74 C-14,76 -24,82 -26,88Z" fill="url(#mobScoutCFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-18,78 C-14,62 2,54 14,58 C22,62 26,72 22,82 C18,74 12,68 4,66 C-2,64 -10,66 -16,72" fill="url(#mobScoutCHair)"/>

      <!-- 頭帶（歪斜） -->
      <path d="M-28,80 C-24,72 -10,66 6,68 C16,70 24,76 22,80" fill="#3a4830" stroke="#2a3820" stroke-width="0.5" transform="rotate(-4,-2,74)"/>
      <path d="M-30,80 L26,80 L24,84 L-28,84 Z" fill="#3a4830" stroke="#2a3820" stroke-width="0.5" transform="rotate(-4,-2,82)"/>
      <path d="M22,82 C26,80 30,84 28,90" fill="none" stroke="#3a4830" stroke-width="3" stroke-linecap="round"/>

      <!-- 側髮（散亂） -->
      <path d="M-26,86 C-30,78 -32,82 -30,90 C-28,94 -26,92 -26,88" fill="url(#mobScoutCHair)"/>
      <path d="M-32,92 C-34,98 -32,102" fill="none" stroke="url(#mobScoutCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M16,84 C20,78 22,84 20,92 C18,94 16,92 16,88" fill="url(#mobScoutCHair)"/>

      <!-- 耳朵 -->
      <path d="M14,102 C18,98 20,104 18,110 C16,114 14,112 14,108" fill="url(#mobScoutCFace)" stroke="#b09068" stroke-width="0.5"/>

      <!-- 腮紅 -->
      <ellipse cx="-20" cy="120" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

      <!-- ===== 眼睛（幾乎閉上） ===== -->
      <ellipse cx="-10" cy="106" rx="5.5" ry="2" fill="#fff"/>
      <ellipse cx="-11" cy="106.5" rx="3.2" ry="1.5" fill="#303828"/>
      <ellipse cx="-11.5" cy="106" rx="1.8" ry="1" fill="#181c10"/>

      <ellipse cx="6" cy="106" rx="5.5" ry="2.5" fill="#fff"/>
      <ellipse cx="5" cy="106.5" rx="3.2" ry="2" fill="#303828"/>
      <ellipse cx="4.5" cy="106" rx="1.8" ry="1.2" fill="#181c10"/>
      <circle cx="3" cy="105" r="0.6" fill="#fff" opacity="0.5"/>

      <!-- 眉間皺紋 -->
      <path d="M-3,99 C-1,97 1,97 3,99" fill="none" stroke="#b09060" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-4,101 C-2,99.5 1,99.5 3,101" fill="none" stroke="#b09060" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 鼻子 -->
      <path d="M-16,114 C-18,118 -14,122" fill="none" stroke="#a88e68" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（喘息） -->
      <ellipse cx="-6" cy="127" rx="5" ry="4.5" fill="#703030"/>
      <path d="M-10,125 L-2,125" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴（多顆） -->
      <path d="M-22,84 C-23,88 -22,94 -21,97" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-21" cy="98" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M18,86 C19,90 18,94" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="18" cy="95" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <ellipse cx="-8" cy="74" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>

      <!-- ===== 右手臂（弓當支撐） ===== -->
      <path d="M14,132 Q24,144 26,160" fill="none" stroke="url(#mobScoutCArmor)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="26" cy="162" r="4.5" fill="url(#mobScoutCFace)" opacity="0.85"/>

      <!-- 弓（插地當支撐） -->
      <path d="M24,150 C16,160 14,176 22,196" fill="none" stroke="url(#mobScoutCBow)" stroke-width="3" stroke-linecap="round"/>
      <line x1="24" y1="150" x2="22" y2="196" stroke="#2a2018" stroke-width="1.5"/>
      <ellipse cx="22" cy="196" rx="3" ry="1.5" fill="#5a4a30" opacity="0.4"/>

      <!-- ===== 左手臂（撐在膝蓋上） ===== -->
      <path d="M-18,130 Q-28,146 -22,164" fill="none" stroke="url(#mobScoutCArmor)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
      <circle cx="-22" cy="166" r="5" fill="url(#mobScoutCFace)" opacity="0.85"/>
    </g>
  </g>
</svg>
