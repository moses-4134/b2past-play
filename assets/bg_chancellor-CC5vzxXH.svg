<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 秦丞相府書閣密室 — 吉卜力風格：冷峻墨綠、竹簡書架、燭下密議、權謀之地 -->
  <defs>
    <linearGradient id="chBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a18"/>
      <stop offset="55%" stop-color="#1c2622"/>
      <stop offset="100%" stop-color="#141c18"/>
    </linearGradient>
    <linearGradient id="chWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243028"/>
      <stop offset="100%" stop-color="#1a221c"/>
    </linearGradient>
    <linearGradient id="chFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2620"/>
      <stop offset="100%" stop-color="#181410"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3826"/>
      <stop offset="100%" stop-color="#33281a"/>
    </linearGradient>
    <radialGradient id="chLamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc70" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c08820" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#chBg)"/>
  <!-- 後牆 -->
  <rect x="0" y="0" width="960" height="210" fill="url(#chWall)" opacity="0.92"/>

  <!-- 竹簡書架（左右） -->
  <g fill="url(#shelf)">
    <rect x="30" y="30" width="230" height="180" rx="3"/>
    <rect x="700" y="30" width="230" height="180" rx="3"/>
  </g>
  <!-- 書架格與竹簡 -->
  <g>
    <g stroke="#22180e" stroke-width="2" opacity="0.6">
      <line x1="30" y1="75" x2="260" y2="75"/><line x1="30" y1="120" x2="260" y2="120"/><line x1="30" y1="165" x2="260" y2="165"/>
      <line x1="700" y1="75" x2="930" y2="75"/><line x1="700" y1="120" x2="930" y2="120"/><line x1="700" y1="165" x2="930" y2="165"/>
    </g>
    <!-- 竹簡捲(小圓卷) -->
    <g fill="#8a6a40" opacity="0.7">
      <rect x="42" y="42" width="8" height="28" rx="3"/><rect x="54" y="42" width="8" height="28" rx="3"/><rect x="66" y="44" width="8" height="26" rx="3"/><rect x="82" y="42" width="8" height="28" rx="3"/><rect x="98" y="45" width="8" height="25" rx="3"/><rect x="118" y="42" width="8" height="28" rx="3"/><rect x="132" y="44" width="8" height="26" rx="3"/>
      <rect x="712" y="42" width="8" height="28" rx="3"/><rect x="724" y="42" width="8" height="28" rx="3"/><rect x="736" y="44" width="8" height="26" rx="3"/><rect x="752" y="42" width="8" height="28" rx="3"/><rect x="768" y="45" width="8" height="25" rx="3"/><rect x="788" y="42" width="8" height="28" rx="3"/>
    </g>
    <g fill="#7a5a34" opacity="0.6">
      <rect x="44" y="88" width="8" height="27" rx="3"/><rect x="58" y="90" width="8" height="25" rx="3"/><rect x="74" y="88" width="8" height="27" rx="3"/><rect x="94" y="90" width="8" height="25" rx="3"/><rect x="150" y="88" width="8" height="27" rx="3"/>
      <rect x="716" y="88" width="8" height="27" rx="3"/><rect x="732" y="90" width="8" height="25" rx="3"/><rect x="800" y="88" width="8" height="27" rx="3"/>
    </g>
  </g>

  <!-- 中央書案 -->
  <rect x="400" y="150" width="160" height="18" fill="#3a2c1c" rx="2"/>
  <rect x="410" y="120" width="140" height="32" fill="#33281a" rx="2"/>
  <!-- 案上攤開的竹簡 -->
  <rect x="435" y="140" width="90" height="12" fill="#a88a58" rx="2" opacity="0.8"/>
  <g stroke="#3a2c1c" stroke-width="0.6" opacity="0.5"><line x1="445" y1="143" x2="445" y2="150"/><line x1="460" y1="143" x2="460" y2="150"/><line x1="475" y1="143" x2="475" y2="150"/><line x1="490" y1="143" x2="490" y2="150"/><line x1="505" y1="143" x2="505" y2="150"/></g>

  <!-- 案燈 -->
  <circle cx="480" cy="120" r="46" fill="url(#chLamp)"/>
  <rect x="475" y="98" width="10" height="26" fill="#5a4028" rx="2"/>
  <ellipse cx="480" cy="94" rx="5" ry="9" fill="#ffcc60" opacity="0.85"/>
  <ellipse cx="480" cy="91" rx="3" ry="6" fill="#fff0c0" opacity="0.6"/>
  <!-- 壁燈 -->
  <circle cx="320" cy="90" r="32" fill="url(#chLamp)"/>
  <ellipse cx="320" cy="88" rx="4" ry="7" fill="#ffcc60" opacity="0.7"/>
  <circle cx="640" cy="90" r="32" fill="url(#chLamp)"/>
  <ellipse cx="640" cy="88" rx="4" ry="7" fill="#ffcc60" opacity="0.7"/>

  <!-- 地板 -->
  <rect x="0" y="210" width="960" height="330" fill="url(#chFloor)"/>
  <g stroke="#33281c" stroke-width="1" opacity="0.25">
    <line x1="0" y1="260" x2="960" y2="260"/><line x1="0" y1="320" x2="960" y2="320"/><line x1="0" y1="390" x2="960" y2="390"/><line x1="0" y1="470" x2="960" y2="470"/>
  </g>
  <g stroke="#33281c" stroke-width="0.6" opacity="0.15">
    <line x1="200" y1="210" x2="200" y2="540"/><line x1="400" y1="210" x2="400" y2="540"/><line x1="560" y1="210" x2="560" y2="540"/><line x1="760" y1="210" x2="760" y2="540"/>
  </g>
  <line x1="0" y1="210" x2="960" y2="210" stroke="#0e1210" stroke-width="3"/>

  <!-- 墨塵 -->
  <circle cx="300" cy="110" r="1.1" fill="#d8c090" opacity="0.25"/>
  <circle cx="500" cy="80" r="1" fill="#e0cc98" opacity="0.28"/>
  <circle cx="640" cy="120" r="1.1" fill="#d8c090" opacity="0.22"/>
  <circle cx="420" cy="180" r="1" fill="#d8c090" opacity="0.18"/>
  <rect width="960" height="540" fill="#40a060" opacity="0.025"/>
</svg>
