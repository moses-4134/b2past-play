<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 呂安 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪、撐劍、喘息、雙眼近閉） -->
  <defs>
    <radialGradient id="laCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f8ece0"/>
      <stop offset="100%" stop-color="#e8d4bc"/>
    </radialGradient>
    <linearGradient id="laCRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#28385a"/>
      <stop offset="100%" stop-color="#182840"/>
    </linearGradient>
    <linearGradient id="laCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222838"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="laCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0404"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 28)">
    <!-- 陰影（半跪更寬） -->
    <ellipse cx="-4" cy="204" rx="30" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（半跪） ===== -->
    <!-- 後腿（膝蓋著地） -->
    <ellipse cx="8" cy="184" rx="9" ry="12" fill="url(#laCPants)" transform="rotate(-20,8,184)"/>
    <ellipse cx="2" cy="196" rx="7" ry="4.5" fill="url(#laCPants)"/>
    <ellipse cx="0" cy="200" rx="9" ry="5.5" fill="#1a1420"/>
    <!-- 前腿（彎曲撐住） -->
    <ellipse cx="-14" cy="180" rx="9" ry="16" fill="url(#laCPants)" transform="rotate(12,-14,180)"/>
    <ellipse cx="-18" cy="200" rx="10" ry="6" fill="#1a1420"/>

    <!-- ===== 身體（大幅前傾） ===== -->
    <ellipse cx="-4" cy="152" rx="24" ry="25" fill="url(#laCRobe)" transform="rotate(-14,-4,152)"/>

    <!-- 銀色腰帶 -->
    <path d="M-26,168 Q-4,176 18,170" fill="none" stroke="#8090a0" stroke-width="4" stroke-linecap="round"/>
    <rect x="-7" y="170" width="6" height="5" rx="1" fill="#a0b0c0"/>

    <!-- 白色交領 -->
    <path d="M-12,133 L-6,145 L2,133" fill="none" stroke="#e8e4e0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 右手（畫面右側，撐在膝蓋上） -->
    <path d="M16,140 Q24,154 16,174" fill="none" stroke="url(#laCRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="15" cy="176" r="4.5" fill="url(#laCFace)" opacity="0.85"/>

    <!-- 左手（畫面左側，撐劍） -->
    <path d="M-24,140 Q-42,146 -50,158" fill="none" stroke="url(#laCRobe)" stroke-width="10" stroke-linecap="round"/>

    <!-- 大頭（低垂） -->
    <ellipse cx="-2" cy="88" rx="36" ry="38" fill="url(#laCHair)"/>

    <!-- 臉（明顯低頭） -->
    <path d="M-26,84 C-30,94 -28,112 -22,122 C-16,130 -6,134 4,132 C12,130 18,124 22,114 C26,102 24,90 18,82 C12,76 4,74 -4,76 C-14,78 -24,80 -26,84Z" fill="url(#laCFace)"/>

    <!-- 腮紅（更明顯） -->
    <ellipse cx="-20" cy="118" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

    <!-- 髮頂（束髮略散） -->
    <path d="M-18,76 C-14,56 2,48 14,52 C24,56 28,68 24,78 C20,72 12,66 2,64 C-6,62 -12,66 -16,72" fill="url(#laCHair)"/>
    <!-- 髮髻（歪斜） -->
    <ellipse cx="0" cy="56" rx="10" ry="12" fill="url(#laCHair)" transform="rotate(-5,0,56)"/>
    <!-- 簪子（歪斜） -->
    <line x1="-10" y1="54" x2="12" y2="50" stroke="#a0b0c0" stroke-width="1.8" stroke-linecap="round" transform="rotate(-6,1,52)"/>
    <circle cx="13" cy="49" r="2" fill="#a0b0c0"/>

    <!-- 瀏海（散亂） -->
    <path d="M-10,76 C-12,68 -18,70 -20,78 C-20,84 -14,84 -12,80" fill="url(#laCHair)"/>
    <path d="M2,76 C4,68 10,70 12,78 C12,84 6,84 4,80" fill="url(#laCHair)"/>
    <!-- 散落髮絲 -->
    <path d="M-24,88 C-26,94 -24,98" fill="none" stroke="url(#laCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- 鬢角 -->
    <path d="M20,82 C24,76 26,84 24,94 C22,100 20,98 20,92" fill="url(#laCHair)"/>
    <path d="M-28,86 C-30,96 -30,108 -28,116" fill="none" stroke="url(#laCHair)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <!-- 耳朵 -->
    <path d="M20,98 C24,94 26,100 24,106 C22,110 20,108 20,104" fill="url(#laCFace)" stroke="#e0d0bc" stroke-width="0.5"/>

    <!-- ===== 眼睛（雙眼瞇成線） ===== -->
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-10" cy="104" rx="7" ry="2" fill="#fff"/>
    <ellipse cx="-11" cy="104.5" rx="4.5" ry="1.5" fill="#1a1020"/>
    <ellipse cx="-11.5" cy="104" rx="2.2" ry="1" fill="#080410"/>

    <!-- 右眼（勉強一線） -->
    <ellipse cx="6" cy="104" rx="7" ry="2.5" fill="#fff"/>
    <ellipse cx="5" cy="104.5" rx="4.5" ry="2" fill="#1a1020"/>
    <ellipse cx="4.5" cy="104" rx="2.2" ry="1.2" fill="#080410"/>
    <circle cx="3" cy="103.5" r="0.8" fill="#fff" opacity="0.6"/>

    <!-- 細眉（深皺） -->
    <path d="M-18,96 C-14,93 -8,94 -4,97" fill="none" stroke="#1a0c08" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M0,97 C4,94 10,93 14,96" fill="none" stroke="#1a0c08" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 眉間皺紋 -->
    <path d="M-5,99 C-3,97 -1,97 1,99" fill="none" stroke="#d0b098" stroke-width="1" opacity="0.6"/>
    <path d="M-6,101 C-4,99.5 -1,99.5 1,101" fill="none" stroke="#d0b098" stroke-width="0.7" opacity="0.4"/>

    <!-- 鼻子 -->
    <path d="M-14,114 C-14.5,117 -13,118" fill="none" stroke="#e0d0bc" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴（喘息張開） -->
    <ellipse cx="-4" cy="125" rx="4.5" ry="4" fill="#703030"/>
    <path d="M-8,123 L0,123" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 汗滴（多顆） -->
    <path d="M-22,84 C-23,88 -22,94 -21,97" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-21" cy="98" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M20,86 C21,90 20,94" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="20" cy="95" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <!-- 額頭汗 -->
    <ellipse cx="-8" cy="76" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>

    <!-- 劍（插地當支撐，最上層） -->
    <line x1="-52" y1="96" x2="-56" y2="204" stroke="#aab0b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-52" y1="96" x2="-56" y2="204" stroke="#dde0e4" stroke-width="1" opacity="0.4"/>
    <!-- 劍插入地面效果 -->
    <ellipse cx="-56" cy="204" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>
    <!-- 護手 -->
    <line x1="-58" y1="154" x2="-46" y2="152" stroke="#8090a0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-52" y1="152" x2="-50" y2="168" stroke="#4a3828" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-50" cy="170" r="2" fill="#a0b0c0"/>
    <!-- 握劍的手 -->
    <circle cx="-50" cy="158" r="5" fill="url(#laCFace)"/>
  </g>
</svg>