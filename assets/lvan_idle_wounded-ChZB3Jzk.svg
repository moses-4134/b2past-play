<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 呂安 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體微傾、劍下垂、單眼半瞇、咬牙、汗滴） -->
  <defs>
    <radialGradient id="laWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f8ece0"/>
      <stop offset="100%" stop-color="#e8d4bc"/>
    </radialGradient>
    <linearGradient id="laWRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#28385a"/>
      <stop offset="100%" stop-color="#182840"/>
    </linearGradient>
    <linearGradient id="laWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222838"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="laWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0404"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 14)">
    <ellipse cx="-4" cy="217" rx="28" ry="5" fill="#000" opacity="0.1"/>

    <!-- 腿（重心偏移） -->
    <ellipse cx="8" cy="196" rx="8" ry="15" fill="url(#laWPants)" transform="rotate(-3,8,196)"/>
    <ellipse cx="6" cy="211" rx="9" ry="6" fill="#1a1420"/>
    <ellipse cx="-12" cy="194" rx="9" ry="16" fill="url(#laWPants)" transform="rotate(8,-12,194)"/>
    <ellipse cx="-14" cy="211" rx="10" ry="6" fill="#1a1420"/>

    <!-- 身體（前傾） -->
    <ellipse cx="-2" cy="163" rx="24" ry="26" fill="url(#laWRobe)" transform="rotate(-8,-2,163)"/>

    <!-- 銀色腰帶 -->
    <path d="M-24,178 Q-2,186 20,178" fill="none" stroke="#8090a0" stroke-width="4" stroke-linecap="round"/>
    <rect x="-5" y="177" width="6" height="5" rx="1" fill="#a0b0c0"/>

    <!-- 白色交領 -->
    <path d="M-10,141 L-4,153 L4,141" fill="none" stroke="#e8e4e0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 右手（畫面右側，按住傷處） -->
    <path d="M18,148 Q24,158 16,172" fill="none" stroke="url(#laWRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="16" cy="174" r="4.5" fill="url(#laWFace)" opacity="0.85"/>

    <!-- 左手（畫面左側，持劍下垂） -->
    <path d="M-22,149 Q-36,152 -42,160" fill="none" stroke="url(#laWRobe)" stroke-width="10" stroke-linecap="round"/>

    <!-- 大頭 -->
    <ellipse cx="0" cy="92" rx="36" ry="38" fill="url(#laWHair)"/>

    <!-- 臉（低頭忍痛） -->
    <path d="M-24,88 C-28,98 -26,114 -20,124 C-14,132 -4,136 6,134 C14,132 20,126 24,116 C28,104 26,92 20,84 C14,78 6,76 -2,78 C-12,80 -22,82 -24,88Z" fill="url(#laWFace)"/>

    <!-- 腮紅（傷痛泛紅） -->
    <ellipse cx="-18" cy="120" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

    <!-- 髮頂（束髮） -->
    <path d="M-16,78 C-12,58 4,50 16,54 C26,58 30,70 26,80 C22,74 14,68 4,66 C-4,64 -10,68 -14,74" fill="url(#laWHair)"/>
    <!-- 髮髻 -->
    <ellipse cx="2" cy="58" rx="10" ry="12" fill="url(#laWHair)"/>
    <!-- 簪子 -->
    <line x1="-8" y1="56" x2="14" y2="52" stroke="#a0b0c0" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="15" cy="51" r="2" fill="#a0b0c0"/>

    <!-- 瀏海（微散亂） -->
    <path d="M-8,78 C-10,70 -16,72 -18,78 C-18,84 -12,84 -10,80" fill="url(#laWHair)"/>
    <path d="M4,78 C6,70 12,72 14,78 C14,84 8,84 6,80" fill="url(#laWHair)"/>

    <!-- 鬢角 -->
    <path d="M22,84 C26,78 28,86 26,96 C24,102 22,100 22,94" fill="url(#laWHair)"/>
    <path d="M-26,86 C-28,96 -28,106 -26,114" fill="none" stroke="url(#laWHair)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <!-- 耳朵 -->
    <path d="M22,100 C26,96 28,102 26,108 C24,112 22,110 22,106" fill="url(#laWFace)" stroke="#e0d0bc" stroke-width="0.5"/>

    <!-- 眼睛（左眼半瞇、右眼微睜） -->
    <!-- 左眼（半瞇） -->
    <ellipse cx="-8" cy="106" rx="7.5" ry="3.5" fill="#fff"/>
    <ellipse cx="-9" cy="107" rx="4.5" ry="3" fill="#1a1020"/>
    <ellipse cx="-9.5" cy="106.5" rx="2.2" ry="1.8" fill="#080410"/>
    <circle cx="-11" cy="105" r="1.2" fill="#fff" opacity="0.5"/>

    <!-- 右眼（微瞇） -->
    <ellipse cx="8" cy="106" rx="7.5" ry="5.5" fill="#fff"/>
    <ellipse cx="7" cy="107" rx="4.5" ry="4.5" fill="#1a1020"/>
    <ellipse cx="6.5" cy="106" rx="2.2" ry="2.5" fill="#080410"/>
    <circle cx="5" cy="104" r="1.5" fill="#fff" opacity="0.5"/>
    <circle cx="9" cy="108.5" r="0.6" fill="#fff" opacity="0.3"/>

    <!-- 細眉（皺起） -->
    <path d="M-16,98 C-12,95 -6,96 -2,98" fill="none" stroke="#1a0c08" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M2,98 C6,95 12,96 16,98" fill="none" stroke="#1a0c08" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 眉間皺紋 -->
    <path d="M-3,100 C-2,98 0,98 1,100" fill="none" stroke="#d0b098" stroke-width="0.8" opacity="0.5"/>

    <!-- 鼻子 -->
    <path d="M-12,114 C-12.5,117 -11,118" fill="none" stroke="#e0d0bc" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴（咬牙忍痛） -->
    <path d="M-5,124 C-2,125 2,125 5,124" fill="none" stroke="#906858" stroke-width="2" stroke-linecap="round"/>
    <path d="M-5,124 C-6,126 -7,127" fill="none" stroke="#906858" stroke-width="1" opacity="0.6"/>

    <!-- 汗滴 -->
    <path d="M-22,88 C-23,92 -22,96 -21,98" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-21" cy="99" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>

    <!-- 劍（傾斜下垂，最上層） -->
    <line x1="-44" y1="108" x2="-48" y2="216" stroke="#aab0b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-44" y1="108" x2="-48" y2="216" stroke="#dde0e4" stroke-width="1" opacity="0.4"/>
    <!-- 護手 -->
    <line x1="-50" y1="156" x2="-38" y2="154" stroke="#8090a0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-44" y1="154" x2="-42" y2="170" stroke="#4a3828" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-42" cy="172" r="2" fill="#a0b0c0"/>
    <!-- 握劍的手 -->
    <circle cx="-42" cy="160" r="5" fill="url(#laWFace)"/>
  </g>
</svg>