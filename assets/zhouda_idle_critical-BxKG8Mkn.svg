<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 武師「鐵臂」周大 — 瀕死待機（HP <30%：半跪、拳撐地、喘息） -->
  <defs>
    <radialGradient id="zhoudaCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </radialGradient>
    <linearGradient id="zhoudaCCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a4038"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </linearGradient>
    <linearGradient id="zhoudaCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3428"/>
      <stop offset="100%" stop-color="#1e1a10"/>
    </linearGradient>
    <linearGradient id="zhoudaCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="zhoudaCIronGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6040" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#aa3020" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#aa3020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="210" rx="36" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪姿態） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="12" cy="192" rx="11" ry="12" fill="url(#zhoudaCPants)" transform="rotate(-20,12,192)"/>
      <ellipse cx="6" cy="204" rx="9" ry="5" fill="url(#zhoudaCPants)"/>
      <ellipse cx="4" cy="208" rx="10" ry="5" fill="#3a2818"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-16" cy="188" rx="12" ry="16" fill="url(#zhoudaCPants)" transform="rotate(12,-16,188)"/>
      <ellipse cx="-20" cy="208" rx="13" ry="6" fill="#3a2818"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="156" rx="28" ry="30" fill="url(#zhoudaCCloth)" transform="rotate(-14,-4,156)"/>

      <!-- 束腰布帶 -->
      <path d="M-28,176 Q-4,184 22,178" fill="none" stroke="#5a4830" stroke-width="6" stroke-linecap="round"/>
      <rect x="-8" y="176" width="8" height="8" rx="1" fill="#6a5838" stroke="#4a3828" stroke-width="0.5"/>

      <!-- 領口 -->
      <path d="M-14,134 L-6,148 L4,134" fill="none" stroke="#5a5040" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- ===== 角色左手臂（撐在膝蓋上） ===== -->
      <path d="M-22,142 Q-30,160 -16,180" fill="none" stroke="url(#zhoudaCCloth)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
      <ellipse cx="-24" cy="150" rx="7" ry="3" fill="none" stroke="#888" stroke-width="2" transform="rotate(-5,-24,150)"/>
      <path d="M-22,152 Q-26,150 -20,158" fill="none" stroke="#3a2818" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-14" cy="182" r="6" fill="url(#zhoudaCFace)" opacity="0.85"/>

      <!-- ===== 角色右手臂（拳撐地面） ===== -->
      <path d="M24,142 Q40,156 44,178" fill="none" stroke="url(#zhoudaCCloth)" stroke-width="14" stroke-linecap="round"/>
      <!-- 鐵環 -->
      <ellipse cx="34" cy="152" rx="8" ry="3.5" fill="none" stroke="#888" stroke-width="2.5" transform="rotate(5,34,152)"/>
      <ellipse cx="36" cy="155" rx="8" ry="3.5" fill="none" stroke="#aaa" stroke-width="2.5" transform="rotate(5,36,155)"/>
      <ellipse cx="38" cy="158" rx="8" ry="3.5" fill="none" stroke="#888" stroke-width="2.5" transform="rotate(5,38,158)"/>
      <path d="M36,156 Q40,154 42,160" fill="none" stroke="#3a2818" stroke-width="4" stroke-linecap="round"/>
      <!-- 鐵臂功光暈（極弱） -->
      <circle cx="44" cy="180" r="10" fill="url(#zhoudaCIronGlow)"/>
      <!-- 拳撐地面 -->
      <circle cx="44" cy="180" r="7.5" fill="url(#zhoudaCFace)"/>
      <path d="M47,176 Q44,174 41,176" fill="none" stroke="#c8a070" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 拳地面效果 -->
      <ellipse cx="44" cy="188" rx="6" ry="2" fill="#5a4a30" opacity="0.3"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="92" rx="40" ry="42" fill="url(#zhoudaCHair)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-32,88 C-36,100 -34,118 -28,128 C-22,136 -8,140 4,138 C14,136 22,130 26,120 C30,108 28,94 22,86 C16,80 4,76 -6,78 C-18,80 -30,82 -32,88Z" fill="url(#zhoudaCFace)"/>

      <!-- 腮紅（痛苦更明顯） -->
      <ellipse cx="-22" cy="124" rx="8" ry="4.5" fill="#e0a0a0" opacity="0.45"/>

      <!-- 極短平頭 -->
      <path d="M-20,78 C-16,60 2,52 18,56 C28,60 32,72 28,82 C24,74 16,68 8,66 C0,64 -10,66 -16,72" fill="url(#zhoudaCHair)"/>
      <path d="M-24,82 C-20,66 4,56 22,62 C30,66 32,76 28,84" fill="url(#zhoudaCHair)" opacity="0.5"/>

      <!-- 耳朵 -->
      <path d="M20,104 C24,100 26,106 24,112 C22,116 20,114 20,108" fill="url(#zhoudaCFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼幾乎閉上） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-10" cy="108" rx="5.5" ry="2" fill="#fff"/>
      <ellipse cx="-11" cy="108.5" rx="3.5" ry="1.5" fill="#2a1410"/>
      <ellipse cx="-11.5" cy="108" rx="1.8" ry="1" fill="#140a06"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="108" rx="5.5" ry="2.5" fill="#fff"/>
      <ellipse cx="5" cy="108.5" rx="3.5" ry="2" fill="#2a1410"/>
      <ellipse cx="4.5" cy="108" rx="1.8" ry="1.2" fill="#140a06"/>
      <circle cx="3" cy="107" r="0.8" fill="#fff" opacity="0.7"/>

      <!-- 粗眉毛（深皺） -->
      <path d="M-16,100 C-12,97 -8,99 -6,101" fill="none" stroke="#2a2018" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M8,101 C10,99 14,97 18,99" fill="none" stroke="#2a2018" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 眉間皺紋（深刻） -->
      <path d="M-3,100 C-1,98 1,98 3,100" fill="none" stroke="#b09060" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-4,102 C-2,100.5 1,100.5 3,102" fill="none" stroke="#b09060" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 鼻子 -->
      <path d="M-18,116 C-20,122 -16,126" fill="none" stroke="#b09068" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 短鬍渣 -->
      <ellipse cx="-4" cy="134" rx="12" ry="5" fill="#3a3020" opacity="0.2"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-4" cy="131" rx="5" ry="4.5" fill="#703030"/>
      <path d="M-8,129 L0,129" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴（多顆） -->
      <path d="M-26,88 C-27,92 -26,98 -25,101" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-25" cy="102" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M22,90 C23,94 22,98" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="22" cy="99" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-6" cy="78" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>
