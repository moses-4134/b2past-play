<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 樓家堡護院 — 技能（棍蓄力下劈） -->
  <defs>
    <radialGradient id="mobGuardWuFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e4c8a0"/>
      <stop offset="100%" stop-color="#d0ac84"/>
    </radialGradient>
    <linearGradient id="mobGuardWuCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a5040"/>
      <stop offset="100%" stop-color="#3a3830"/>
    </linearGradient>
    <linearGradient id="mobGuardWuPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4038"/>
      <stop offset="100%" stop-color="#2e2820"/>
    </linearGradient>
    <linearGradient id="mobGuardWuHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="198" rx="22" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（站穩蓄力） ===== -->
      <!-- 後腿 -->
      <ellipse cx="8" cy="178" rx="9" ry="16" fill="url(#mobGuardWuPants)" transform="rotate(-3,8,178)"/>
      <ellipse cx="7" cy="192" rx="10" ry="6" fill="#3a2818"/>
      <!-- 前腿 -->
      <ellipse cx="-10" cy="176" rx="10" ry="17" fill="url(#mobGuardWuPants)" transform="rotate(3,-10,176)"/>
      <ellipse cx="-11" cy="192" rx="11" ry="6" fill="#3a2818"/>

      <!-- ===== 身體（挺直蓄力） ===== -->
      <ellipse cx="-2" cy="146" rx="22" ry="24" fill="url(#mobGuardWuCloth)" transform="rotate(-2,-2,146)"/>

      <!-- 領口 -->
      <path d="M-10,128 L-4,138 L4,128" fill="none" stroke="#4a4838" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-20,166 Q-2,172 18,166" fill="none" stroke="#4a3828" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 雙手舉棍過頭蓄力 ===== -->
      <!-- 右手臂（角色左手，舉起） -->
      <path d="M16,134 Q24,112 22,92" fill="none" stroke="url(#mobGuardWuCloth)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <circle cx="22" cy="90" r="5" fill="url(#mobGuardWuFace)" opacity="0.85"/>

      <!-- 左手臂（角色右手，舉起） -->
      <path d="M-18,134 Q-28,112 -26,92" fill="none" stroke="url(#mobGuardWuCloth)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-26" cy="90" r="5.5" fill="url(#mobGuardWuFace)"/>

      <!-- ===== 木棍（高舉過頭） ===== -->
      <line x1="-38" y1="56" x2="-22" y2="118" stroke="#6a5030" stroke-width="3.5" stroke-linecap="round"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="100" rx="34" ry="36" fill="url(#mobGuardWuHair)"/>

      <!-- 臉 -->
      <path d="M-22,90 C-26,100 -24,114 -18,122 C-12,130 -4,134 4,132 C12,130 18,124 22,114 C26,102 24,90 18,82 C12,76 2,74 -4,76 C-14,78 -20,84 -22,90Z" fill="url(#mobGuardWuFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,80 C-12,62 4,54 16,58 C24,62 28,74 24,84 C20,76 14,70 6,68 C0,66 -8,68 -14,74" fill="url(#mobGuardWuHair)"/>
      <ellipse cx="2" cy="62" rx="8" ry="6" fill="url(#mobGuardWuHair)"/>

      <!-- 耳朵 -->
      <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,108" fill="url(#mobGuardWuFace)" stroke="#b89868" stroke-width="0.5"/>

      <!-- ===== 眼睛（蓄力凝視） ===== -->
      <ellipse cx="-10" cy="108" rx="6.5" ry="6" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="4" ry="4.2" fill="#342818"/>
      <ellipse cx="-11.5" cy="108" rx="2.2" ry="2.4" fill="#1a1008"/>
      <circle cx="-13" cy="107" r="1.3" fill="#fff" opacity="0.65"/>

      <ellipse cx="6" cy="108" rx="6.5" ry="6" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="4" ry="4.2" fill="#342818"/>
      <ellipse cx="4.5" cy="108" rx="2.2" ry="2.4" fill="#1a1008"/>
      <circle cx="3" cy="107" r="1.3" fill="#fff" opacity="0.65"/>

      <!-- 眉毛 -->
      <path d="M-14,101 C-10,99 -8,100 -6,102" fill="none" stroke="#2a2018" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,102 C10,100 12,99 16,101" fill="none" stroke="#2a2018" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#b89868" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（凝重） -->
      <path d="M-10,128 C-6,128 0,128 4,128" fill="none" stroke="#704840" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
