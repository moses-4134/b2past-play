<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 龍陽君精兵 — 受傷待機（HP 30~60%：身體前傾、劍下垂、單眼瞇、汗滴） -->
  <defs>
    <radialGradient id="lyEliteWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8c0a0"/>
      <stop offset="100%" stop-color="#c0a880"/>
    </radialGradient>
    <linearGradient id="lyEliteWArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a3a28"/>
      <stop offset="100%" stop-color="#0a2a18"/>
    </linearGradient>
    <linearGradient id="lyEliteWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2018"/>
      <stop offset="100%" stop-color="#101810"/>
    </linearGradient>
    <linearGradient id="lyEliteWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="lyEliteWBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d8e0"/>
      <stop offset="100%" stop-color="#909898"/>
    </linearGradient>
    <linearGradient id="lyEliteWHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a28"/>
      <stop offset="100%" stop-color="#0e2e1a"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="198" rx="24" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（重心偏移） ===== -->
      <ellipse cx="8" cy="178" rx="8" ry="15" fill="url(#lyEliteWPants)" transform="rotate(-5,8,178)"/>
      <ellipse cx="6" cy="192" rx="9" ry="6" fill="#1a1810"/>
      <ellipse cx="-10" cy="176" rx="9" ry="16" fill="url(#lyEliteWPants)" transform="rotate(8,-10,176)"/>
      <ellipse cx="-13" cy="192" rx="10" ry="6" fill="#1a1810"/>

      <!-- ===== 身體（前傾） ===== -->
      <ellipse cx="-2" cy="148" rx="22" ry="26" fill="url(#lyEliteWArmor)" transform="rotate(-8,-2,148)"/>

      <!-- 胸甲紋路 -->
      <path d="M-12,138 L-2,150 L8,138" fill="none" stroke="#0a2a18" stroke-width="1.2" opacity="0.5"/>

      <!-- 領口 -->
      <path d="M-12,128 L-5,138 L2,128" fill="none" stroke="#0e2e1a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 青銅肩甲 -->
      <ellipse cx="-20" cy="134" rx="8" ry="5" fill="#8a7030" stroke="#6a5820" stroke-width="0.5" transform="rotate(-14,-20,134)"/>
      <ellipse cx="16" cy="134" rx="8" ry="5" fill="#8a7030" stroke="#6a5820" stroke-width="0.5" transform="rotate(6,16,134)" opacity="0.85"/>

      <!-- 腰帶 -->
      <path d="M-22,168 Q-4,176 16,170" fill="none" stroke="#4a3820" stroke-width="3" stroke-linecap="round"/>
      <rect x="-8" y="167" width="8" height="6" rx="1" fill="#8a7030" stroke="#6a5820" stroke-width="0.5"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="94" rx="32" ry="34" fill="url(#lyEliteWHair)"/>

      <!-- 臉 -->
      <path d="M-22,86 C-26,96 -24,108 -18,118 C-12,126 -4,130 2,128 C8,126 12,120 16,110 C20,98 18,86 12,78 C6,72 0,70 -6,72 C-14,74 -20,80 -22,86Z" fill="url(#lyEliteWFace)"/>

      <!-- 短髮頂部 -->
      <path d="M-14,76 C-10,60 4,52 14,56 C22,60 26,70 22,80 C18,72 12,66 6,64 C0,62 -6,64 -12,70" fill="url(#lyEliteWHair)"/>

      <!-- 頭盔 -->
      <path d="M-24,76 C-20,64 -6,58 8,60 C16,62 24,68 22,76" fill="url(#lyEliteWHelmet)" stroke="#0e2e1a" stroke-width="0.5"/>
      <path d="M-26,76 C-26,74 -24,72 -20,74 L24,74 C26,74 26,78 24,78 L-24,78 C-26,78 -26,76 -26,76Z" fill="#8a7030" stroke="#6a5820" stroke-width="0.5"/>
      <circle cx="0" cy="60" r="3" fill="#8a7030" stroke="#6a5820" stroke-width="0.5"/>

      <!-- 短瀏海 -->
      <path d="M-20,80 C-24,74 -26,78 -26,84 C-24,88 -20,86 -20,82" fill="url(#lyEliteWHair)"/>
      <path d="M-16,78 C-18,72 -22,74 -22,82 C-20,86 -16,84 -16,80" fill="url(#lyEliteWHair)" opacity="0.9"/>

      <!-- 側髮 -->
      <path d="M16,82 C22,76 24,84 22,92 C20,96 16,94 16,90" fill="url(#lyEliteWHair)"/>

      <!-- 耳朵 -->
      <path d="M14,100 C18,96 20,102 18,108 C16,112 14,110 14,106" fill="url(#lyEliteWFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- 腮紅 -->
      <ellipse cx="-16" cy="116" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- ===== 眼睛 ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-8" cy="104" rx="5.5" ry="3" fill="#fff"/>
      <ellipse cx="-9" cy="105" rx="3.2" ry="2.2" fill="#2a3028"/>
      <ellipse cx="-9.5" cy="104" rx="1.8" ry="1.2" fill="#1a1810"/>
      <circle cx="-11" cy="103" r="0.5" fill="#fff" opacity="0.4"/>

      <!-- 右眼（微睜） -->
      <ellipse cx="6" cy="104" rx="5.5" ry="4.5" fill="#fff"/>
      <ellipse cx="5" cy="105" rx="3.2" ry="3.5" fill="#2a3028"/>
      <ellipse cx="4.5" cy="104" rx="1.8" ry="1.8" fill="#1a1810"/>
      <circle cx="3" cy="103" r="0.6" fill="#fff" opacity="0.45"/>

      <!-- 眉間皺紋 -->
      <path d="M-1,98 C0,96 2,96 3,98" fill="none" stroke="#b09060" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 眉毛 -->
      <path d="M-12,98 C-8,96 -6,97 -4,99" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,99 C10,97 12,96 16,98" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-12,112 C-14,116 -10,120" fill="none" stroke="#a08858" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙） -->
      <path d="M-6,124 C-2,125.5 2,125.5 6,124" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-6,124 C-7,126 -8,127" fill="none" stroke="#704840" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴 -->
      <path d="M-18,82 C-19,86 -18,90 -17,92" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-17" cy="93" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>

      <!-- ===== 右手臂（身側垂下） ===== -->
      <path d="M16,136 Q24,148 22,164" fill="none" stroke="url(#lyEliteWArmor)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="22" cy="166" r="4.5" fill="url(#lyEliteWFace)" opacity="0.85"/>

      <!-- ===== 左手臂（劍下垂） ===== -->
      <path d="M-18,136 Q-34,142 -42,156" fill="none" stroke="url(#lyEliteWArmor)" stroke-width="9" stroke-linecap="round"/>

      <!-- 劍（下垂） -->
      <line x1="-44" y1="154" x2="-48" y2="204" stroke="url(#lyEliteWBlade)" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="-48" y1="155" x2="-40" y2="153" stroke="#8a7030" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-43" y1="156" x2="-41" y2="164" stroke="#4a3020" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-42" cy="158" r="5" fill="url(#lyEliteWFace)"/>
    </g>
  </g>
</svg>
