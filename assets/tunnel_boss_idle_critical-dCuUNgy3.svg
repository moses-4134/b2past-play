<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 密道守將 — 吉卜力2頭身 面朝右（敵方）瀕死待機（HP <30%） -->
  <defs>
    <radialGradient id="tunnelBossCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc098"/>
      <stop offset="100%" stop-color="#c4a478"/>
    </radialGradient>
    <linearGradient id="tunnelBossCArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a2020"/>
      <stop offset="100%" stop-color="#3a1414"/>
    </linearGradient>
    <linearGradient id="tunnelBossCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1818"/>
      <stop offset="100%" stop-color="#1e0e0e"/>
    </linearGradient>
    <linearGradient id="tunnelBossCHelmet" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#4a4040"/>
      <stop offset="100%" stop-color="#2a2424"/>
    </linearGradient>
    <linearGradient id="tunnelBossCBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aaa"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="202" rx="34" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪姿態） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="10" cy="180" rx="11" ry="12" fill="url(#tunnelBossCPants)" transform="rotate(-20,10,180)"/>
      <ellipse cx="4" cy="192" rx="8" ry="5" fill="url(#tunnelBossCPants)"/>
      <ellipse cx="2" cy="196" rx="10" ry="5" fill="#2a1210"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-14" cy="176" rx="12" ry="16" fill="url(#tunnelBossCPants)" transform="rotate(12,-14,176)"/>
      <ellipse cx="-18" cy="196" rx="13" ry="6" fill="#2a1210"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="146" rx="26" ry="26" fill="url(#tunnelBossCArmor)" transform="rotate(-14,-4,146)"/>

      <!-- 胸甲紋路 -->
      <path d="M-12,140 L-8,154" fill="none" stroke="#2a0e0e" stroke-width="1" opacity="0.4"/>
      <path d="M-4,130 L-4,160" fill="none" stroke="#6a2828" stroke-width="1" opacity="0.3"/>

      <!-- 護肩 -->
      <ellipse cx="-26" cy="134" rx="10" ry="7" fill="#4a4040" stroke="#3a3434" stroke-width="0.8"/>
      <ellipse cx="20" cy="134" rx="10" ry="7" fill="#4a4040" stroke="#3a3434" stroke-width="0.8"/>

      <!-- 領口 -->
      <path d="M-14,132 L-6,144 L2,132" fill="none" stroke="#6a2828" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-28,168 Q-4,176 22,168" fill="none" stroke="#3a1818" stroke-width="5" stroke-linecap="round"/>
      <rect x="-9" y="166" width="9" height="9" rx="1" fill="#8a6830" stroke="#6a4820" stroke-width="0.5"/>

      <!-- ===== 畫面左側手臂（角色左手，撐在膝蓋上） ===== -->
      <path d="M-22,140 Q-34,150 -26,172" fill="none" stroke="url(#tunnelBossCArmor)" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-24" cy="174" r="5.5" fill="url(#tunnelBossCFace)" opacity="0.85"/>

      <!-- ===== 大頭（低垂喘息） ===== -->
      <!-- 鐵盔 -->
      <ellipse cx="-2" cy="90" rx="36" ry="38" fill="url(#tunnelBossCHelmet)"/>
      <path d="M-4,54 L-4,76" fill="none" stroke="#5a5050" stroke-width="1.5" opacity="0.5"/>
      <path d="M-36,92 C-38,88 -34,84 -30,82 L24,82 C28,84 32,88 30,92" fill="url(#tunnelBossCHelmet)" stroke="#3a3434" stroke-width="0.5"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-30,86 C-34,98 -32,114 -26,124 C-20,132 -8,136 2,134 C12,132 18,124 22,114 C26,102 24,88 18,80 C12,74 2,72 -8,74 C-18,76 -28,80 -30,86Z" fill="url(#tunnelBossCFace)"/>

      <!-- 腮紅（痛苦更明顯） -->
      <ellipse cx="-22" cy="120" rx="7" ry="4" fill="#e0a0a0" opacity="0.4"/>

      <!-- 耳朵 -->
      <path d="M16,100 C20,96 22,102 20,108 C18,112 16,110 16,106" fill="url(#tunnelBossCFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼瞇成線） ===== -->
      <!-- 左眼（幾乎閉上） -->
      <ellipse cx="-12" cy="106" rx="6" ry="2" fill="#fff"/>
      <ellipse cx="-13" cy="106.5" rx="3.5" ry="1.5" fill="#301410"/>
      <ellipse cx="-13.5" cy="106" rx="2" ry="1" fill="#180808"/>

      <!-- 右眼（勉強睜一線） -->
      <ellipse cx="6" cy="106" rx="6" ry="2.5" fill="#fff"/>
      <ellipse cx="5" cy="106.5" rx="3.5" ry="2" fill="#301410"/>
      <ellipse cx="4.5" cy="106" rx="2" ry="1.2" fill="#180808"/>
      <circle cx="3" cy="105" r="0.8" fill="#fff" opacity="0.6"/>

      <!-- 眉間皺紋（深刻） -->
      <path d="M-5,99 C-3,97 0,97 2,99" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-6,101 C-4,99.5 -1,99.5 1,101" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 眉毛 -->
      <path d="M-18,99 C-14,96 -10,98 -6,101" fill="none" stroke="#2a1a10" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M8,101 C10,98 14,96 18,99" fill="none" stroke="#2a1a10" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-16,114 C-18,118 -14,122" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 短鬍渣 -->
      <path d="M-14,128 C-10,129 -4,129 0,129 C4,129 8,128 12,127" fill="none" stroke="#5a4a38" stroke-width="0.8" opacity="0.4" stroke-dasharray="1,1.5"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-4" cy="127" rx="5" ry="4.5" fill="#703030"/>
      <path d="M-8,125 L0,125" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- ===== 畫面右側手臂（角色右手，劍插地撐身體） ===== -->
      <path d="M22,140 Q42,132 52,140" fill="none" stroke="url(#tunnelBossCArmor)" stroke-width="12" stroke-linecap="round"/>

      <!-- ===== 劍（插入地面當支撐） ===== -->
      <circle cx="52" cy="142" r="5.5" fill="url(#tunnelBossCFace)"/>
      <line x1="58" y1="146" x2="48" y2="140" stroke="#8a6830" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="52" y1="140" x2="50" y2="134" stroke="#4a3018" stroke-width="4" stroke-linecap="round"/>
      <circle cx="49.5" cy="132" r="2.5" fill="#8a6830"/>
      <!-- 劍身（直插地面） -->
      <line x1="54" y1="148" x2="56" y2="198" stroke="#999" stroke-width="4" stroke-linecap="round"/>
      <line x1="55" y1="150" x2="57" y2="196" stroke="#ccc" stroke-width="0.8" opacity="0.3"/>
      <!-- 劍插入地面效果 -->
      <ellipse cx="56" cy="198" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>

      <!-- 汗滴（多顆） -->
      <path d="M-26,86 C-27,90 -26,96 -25,99" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-25" cy="100" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M20,88 C21,92 20,96" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="20" cy="97" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-10" cy="76" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>