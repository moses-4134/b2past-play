<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 鄧虎 — 吉卜力2頭身 面朝右（敵方）瀕死待機（HP <30%：半跪、撐斧、喘息） -->
  <defs>
    <radialGradient id="denghuCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d0a880"/>
      <stop offset="100%" stop-color="#b89068"/>
    </radialGradient>
    <linearGradient id="denghuCArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a4a30"/>
      <stop offset="100%" stop-color="#3a2a18"/>
    </linearGradient>
    <linearGradient id="denghuCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="denghuCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a1a08"/>
      <stop offset="100%" stop-color="#140a02"/>
    </linearGradient>
    <linearGradient id="denghuCHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5a68"/>
      <stop offset="100%" stop-color="#4a4a50"/>
    </linearGradient>
    <linearGradient id="denghuCAxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#999"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="210" rx="38" ry="7" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="12" cy="192" rx="12" ry="12" fill="url(#denghuCPants)" transform="rotate(-20,12,192)"/>
      <ellipse cx="6" cy="204" rx="10" ry="5" fill="url(#denghuCPants)"/>
      <ellipse cx="4" cy="208" rx="12" ry="5" fill="#3a2818"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-16" cy="188" rx="13" ry="16" fill="url(#denghuCPants)" transform="rotate(12,-16,188)"/>
      <ellipse cx="-16" cy="198" rx="11" ry="8" fill="#4a4a50" opacity="0.6"/>
      <ellipse cx="-20" cy="208" rx="14" ry="6" fill="#3a2818"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="154" rx="28" ry="30" fill="url(#denghuCArmor)" transform="rotate(-14,-4,154)"/>

      <!-- 肩甲 -->
      <ellipse cx="-28" cy="136" rx="12" ry="8" fill="#4a4a50" transform="rotate(-10,-28,136)"/>
      <ellipse cx="-28" cy="136" rx="10" ry="6" fill="#5a5a68" transform="rotate(-10,-28,136)"/>
      <ellipse cx="20" cy="136" rx="12" ry="8" fill="#4a4a50" transform="rotate(10,20,136)"/>
      <ellipse cx="20" cy="136" rx="10" ry="6" fill="#5a5a68" transform="rotate(10,20,136)"/>

      <!-- 紅色反叛軍綬帶（破損） -->
      <path d="M-20,136 L10,172" fill="none" stroke="#8a2020" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

      <!-- 腰帶 -->
      <path d="M-28,176 Q-4,184 22,176" fill="none" stroke="#4a3820" stroke-width="7" stroke-linecap="round"/>
      <rect x="-7" y="174" width="10" height="10" rx="1" fill="#a08030" stroke="#806020" stroke-width="0.5"/>

      <!-- ===== 畫面左側手臂（撐在膝蓋上） ===== -->
      <path d="M-24,142 Q-42,156 -34,176" fill="none" stroke="url(#denghuCArmor)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
      <path d="M-36,164 Q-38,168 -40,174" fill="none" stroke="#3a2818" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-34" cy="178" r="6.5" fill="url(#denghuCFace)" opacity="0.85"/>

      <!-- ===== 大頭（低垂、喘息） ===== -->
      <!-- 後腦亂髮 -->
      <ellipse cx="-2" cy="90" rx="40" ry="42" fill="url(#denghuCHair)"/>

      <!-- 鐵盔（歪斜） -->
      <path d="M-36,78 C-38,62 -22,44 2,42 C22,40 36,54 36,74 C36,80 32,84 26,86 L-32,86 C-36,84 -38,82 -36,78Z" fill="url(#denghuCHelmet)" stroke="#3a3a44" stroke-width="0.8" transform="rotate(-5,0,64)"/>
      <!-- 盔上凹痕 -->
      <path d="M-12,52 L-8,60" fill="none" stroke="#3a3a44" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <!-- 鼻甲 -->
      <path d="M-6,86 L-8,102 L-4,102 Z" fill="#4a4a50" stroke="#3a3a44" stroke-width="0.5"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-32,88 C-36,100 -34,116 -28,126 C-22,134 -8,138 4,136 C16,134 26,126 30,114 C34,102 32,88 28,84 L-32,88Z" fill="url(#denghuCFace)"/>

      <!-- 額頭傷疤 -->
      <path d="M-18,90 L-10,86" fill="none" stroke="#a08060" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

      <!-- 左臉傷疤 -->
      <path d="M-24,102 L-18,116" fill="none" stroke="#a08060" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

      <!-- 濃密大鬍 -->
      <ellipse cx="-6" cy="132" rx="16" ry="8" fill="#2a1a08" opacity="0.35"/>
      <path d="M-20,128 C-22,138 -18,146 -12,146 C-6,146 -2,142 0,136" fill="#2a1a08" opacity="0.2"/>

      <!-- 側髮（散落） -->
      <path d="M-34,88 C-40,94 -42,106 -38,114" fill="none" stroke="url(#denghuCHair)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <path d="M28,88 C34,94 36,106 32,114" fill="none" stroke="url(#denghuCHair)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <!-- 散落髮絲 -->
      <path d="M-38,108 C-40,114 -38,118" fill="none" stroke="url(#denghuCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 耳朵 -->
      <path d="M24,100 C28,96 30,102 28,110 C26,114 24,112 24,106" fill="url(#denghuCFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼瞇成線） ===== -->
      <!-- 左眼（幾乎閉上） -->
      <ellipse cx="-14" cy="106" rx="7" ry="2" fill="#fff"/>
      <ellipse cx="-15" cy="106.5" rx="4.5" ry="1.5" fill="#402010"/>
      <ellipse cx="-15.5" cy="106" rx="2.5" ry="0.8" fill="#1a0800"/>

      <!-- 右眼（勉強睜一線） -->
      <ellipse cx="6" cy="106" rx="7" ry="2.5" fill="#fff"/>
      <ellipse cx="5" cy="106.5" rx="4.5" ry="2" fill="#402010"/>
      <ellipse cx="4.5" cy="106" rx="2.5" ry="1.2" fill="#1a0800"/>
      <circle cx="3" cy="105.5" r="0.8" fill="#fff" opacity="0.4"/>

      <!-- 粗眉毛（深皺） -->
      <path d="M-18,100 C-14,98 -10,100 -6,102" fill="none" stroke="#2a1a08" stroke-width="3" stroke-linecap="round"/>
      <path d="M12,102 C14,100 18,98 22,100" fill="none" stroke="#2a1a08" stroke-width="3" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-8,112 C-10,118 -6,122" fill="none" stroke="#a08058" stroke-width="2" stroke-linecap="round"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-6" cy="129" rx="6" ry="5" fill="#703030"/>
      <path d="M-11,127 L-1,127" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴（多顆） -->
      <path d="M-28,90 C-29,94 -28,100 -27,103" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-27" cy="104" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M22,92 C23,96 22,100" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="22" cy="101" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <ellipse cx="-10" cy="78" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>

      <!-- ===== 武器手臂（撐斧） ===== -->
      <path d="M24,142 Q42,150 50,166" fill="none" stroke="url(#denghuCArmor)" stroke-width="14" stroke-linecap="round"/>

      <!-- ===== 大斧（插地當支撐） ===== -->
      <!-- 握斧的手 -->
      <circle cx="52" cy="168" r="6.5" fill="url(#denghuCFace)"/>
      <!-- 斧柄（插地） -->
      <line x1="54" y1="170" x2="58" y2="214" stroke="#5a3a20" stroke-width="5" stroke-linecap="round"/>
      <!-- 插地效果 -->
      <ellipse cx="58" cy="214" rx="5" ry="2" fill="#5a4a30" opacity="0.4"/>
      <!-- 斧頭（在上方靠近手） -->
      <path d="M46,162 C38,150 38,140 46,134 C50,130 58,130 62,136 C68,144 68,156 60,164 Z" fill="url(#denghuCAxe)" stroke="#666" stroke-width="0.5"/>
      <!-- 斧刃高光 -->
      <path d="M46,134 C50,130 58,130 62,136" fill="none" stroke="#ccc" stroke-width="0.8" opacity="0.4"/>
      <!-- 斧柄底端 -->
      <circle cx="55" cy="170" r="3" fill="#4a2a10"/>
    </g>
  </g>
</svg>