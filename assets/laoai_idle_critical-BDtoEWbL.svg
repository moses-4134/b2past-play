<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 嫪毐 — 吉卜力2頭身 面朝右（敵方）瀕死待機（HP <30%：半跪、撐刀、喘息） -->
  <defs>
    <radialGradient id="laoaiCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b080"/>
      <stop offset="100%" stop-color="#c09868"/>
    </radialGradient>
    <linearGradient id="laoaiCArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#4a2a18"/>
    </linearGradient>
    <linearGradient id="laoaiCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#221810"/>
    </linearGradient>
    <linearGradient id="laoaiCBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <linearGradient id="laoaiCHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a08838"/>
      <stop offset="100%" stop-color="#8a7030"/>
    </linearGradient>
    <linearGradient id="laoaiCGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8b848"/>
      <stop offset="100%" stop-color="#c8a840"/>
    </linearGradient>
    <linearGradient id="laoaiCShoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="210" rx="38" ry="7" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="16" cy="192" rx="12" ry="12" fill="url(#laoaiCPants)" transform="rotate(-20,16,192)"/>
      <ellipse cx="10" cy="204" rx="10" ry="5" fill="url(#laoaiCPants)"/>
      <ellipse cx="8" cy="208" rx="12" ry="5" fill="#3a2018"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-20" cy="188" rx="13" ry="16" fill="url(#laoaiCPants)" transform="rotate(12,-20,188)"/>
      <ellipse cx="-24" cy="208" rx="14" ry="6" fill="#3a2018"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="152" rx="30" ry="32" fill="url(#laoaiCArmor)" transform="rotate(-14,-4,152)"/>

      <!-- 金色鎧甲紋飾 -->
      <line x1="-22" y1="132" x2="-24" y2="176" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <line x1="18" y1="132" x2="20" y2="176" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <rect x="-18" y="142" width="28" height="18" rx="3" fill="none" stroke="#c8a840" stroke-width="1.2" opacity="0.6"/>

      <!-- 大肩甲 -->
      <ellipse cx="-36" cy="132" rx="14" ry="10" fill="url(#laoaiCShoulder)" stroke="#c8a840" stroke-width="1"/>
      <ellipse cx="26" cy="132" rx="14" ry="10" fill="url(#laoaiCShoulder)" stroke="#c8a840" stroke-width="1"/>

      <!-- 領口 -->
      <path d="M-16,130 L-8,146 L0,130" fill="none" stroke="#6a4828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 翡翠腰帶 -->
      <path d="M-30,174 Q-4,183 26,174" fill="none" stroke="#4a2a18" stroke-width="7" stroke-linecap="round"/>
      <rect x="-10" y="171" width="14" height="12" rx="2" fill="#4a8848" stroke="#c8a840" stroke-width="1"/>

      <!-- ===== 畫面左側手臂（按住膝蓋） ===== -->
      <path d="M-28,140 Q-44,156 -34,178" fill="none" stroke="url(#laoaiCArmor)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-34" cy="180" r="7" fill="url(#laoaiCFace)" opacity="0.85"/>

      <!-- ===== 大頭（低垂、喘息） ===== -->
      <!-- 頭盔底座 -->
      <ellipse cx="-2" cy="88" rx="42" ry="44" fill="url(#laoaiCHelmet)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-34,84 C-38,96 -36,116 -30,126 C-24,134 -10,140 2,138 C12,136 22,128 26,116 C30,104 28,90 22,82 C16,76 4,72 -6,74 C-18,76 -32,80 -34,84Z" fill="url(#laoaiCFace)"/>

      <!-- 腮紅（痛苦更明顯） -->
      <ellipse cx="-24" cy="122" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

      <!-- 鳳翼頭盔 -->
      <path d="M-36,78 C-30,58 -8,48 12,52 C28,56 36,70 32,82 C28,74 16,66 6,64 C-4,62 -16,64 -26,72" fill="url(#laoaiCHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M-36,82 C-26,76 -10,72 12,74 C26,76 34,80 32,84" fill="none" stroke="#c8a840" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 鳳翼（略歪斜） -->
      <path d="M-32,74 C-42,60 -48,50 -44,44 C-40,40 -36,46 -32,58" fill="url(#laoaiCHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M26,74 C34,60 40,50 36,44 C32,40 28,46 26,58" fill="url(#laoaiCHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <!-- 頭盔頂飾 -->
      <path d="M-6,56 L-2,40 L2,56" fill="url(#laoaiCGold)" stroke="#c8a840" stroke-width="0.8"/>

      <!-- 耳朵 -->
      <path d="M20,102 C24,98 26,104 24,112 C22,116 20,114 20,108" fill="url(#laoaiCFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼瞇成線） ===== -->
      <!-- 左眼（幾乎閉上） -->
      <ellipse cx="-14" cy="108" rx="5" ry="1.8" fill="#fff"/>
      <ellipse cx="-15" cy="108.5" rx="3.5" ry="1.2" fill="#3a1810"/>
      <ellipse cx="-15.5" cy="108" rx="2" ry="0.8" fill="#1a0800"/>

      <!-- 右眼（勉強睜一線） -->
      <ellipse cx="4" cy="108" rx="5" ry="2.2" fill="#fff"/>
      <ellipse cx="3" cy="108.5" rx="3.5" ry="1.5" fill="#3a1810"/>
      <ellipse cx="2.5" cy="108" rx="2" ry="1" fill="#1a0800"/>
      <circle cx="1" cy="107.5" r="0.8" fill="#fff" opacity="0.5"/>

      <!-- 粗眉毛（深皺） -->
      <path d="M-18,102 C-14,99 -10,100 -7,103" fill="none" stroke="#2a1808" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M10,103 C12,100 16,99 20,102" fill="none" stroke="#2a1808" stroke-width="3.5" stroke-linecap="round"/>

      <!-- 眉間皺紋 -->
      <path d="M-5,104 C-4,102 -2,102 -1,104" fill="none" stroke="#a08058" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-6,106 C-4,104 -2,104 0,106" fill="none" stroke="#a08058" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 鼻子 -->
      <path d="M-20,118 C-22,124 -18,128" fill="none" stroke="#a08058" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-6" cy="133" rx="6" ry="5" fill="#703030"/>
      <path d="M-11,131 L-1,131" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴（多顆） -->
      <path d="M-28,92 C-29,96 -28,102 -27,105" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-27" cy="106" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M20,94 C21,98 20,102" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="20" cy="103" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-10" cy="80" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>

      <!-- ===== 畫面右側手臂（撐刀） ===== -->
      <path d="M28,138 Q48,148 56,164" fill="none" stroke="url(#laoaiCArmor)" stroke-width="15" stroke-linecap="round"/>

      <!-- ===== 斬馬大刀（插地撐身） ===== -->
      <!-- 握刀的手 -->
      <circle cx="57" cy="166" r="7" fill="url(#laoaiCFace)"/>
      <!-- 刀身（插入地面） -->
      <path d="M60,170 L64,208 L66,214 L72,210 Q68,194 62,168 Z" fill="url(#laoaiCBlade)" stroke="#666" stroke-width="0.5"/>
      <line x1="60" y1="170" x2="64" y2="208" stroke="#888" stroke-width="2.8" stroke-linecap="round"/>
      <!-- 插地效果 -->
      <ellipse cx="66" cy="214" rx="5" ry="2" fill="#5a4a30" opacity="0.4"/>
      <!-- 刀護手 -->
      <line x1="52" y1="168" x2="64" y2="170" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
      <!-- 刀柄 -->
      <line x1="56" y1="166" x2="54" y2="158" stroke="#5a3a20" stroke-width="6" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="53" cy="155" r="4" fill="#c8a840"/>
    </g>
  </g>
</svg>