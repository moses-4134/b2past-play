<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 蔡璋（敵方） — 吉卜力2頭身 面朝右 瀕死待機（HP <30%：半跪、喘息、暗器散落） -->
  <defs>
    <radialGradient id="dubiCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0d0c0"/>
      <stop offset="100%" stop-color="#d0c0a8"/>
    </radialGradient>
    <linearGradient id="dubiCRobe" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0c0c18"/>
    </linearGradient>
    <linearGradient id="dubiCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="dubiCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="210" rx="30" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="8" cy="192" rx="9" ry="12" fill="url(#dubiCPants)" transform="rotate(-20,8,192)"/>
      <ellipse cx="2" cy="204" rx="8" ry="5" fill="url(#dubiCPants)"/>
      <ellipse cx="0" cy="208" rx="9" ry="5" fill="#1a1a20"/>
      <!-- 前腿（彎曲） -->
      <ellipse cx="-14" cy="188" rx="10" ry="16" fill="url(#dubiCPants)" transform="rotate(12,-14,188)"/>
      <ellipse cx="-18" cy="208" rx="11" ry="6" fill="#1a1a20"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="154" rx="26" ry="28" fill="url(#dubiCRobe)" transform="rotate(-14,-4,154)"/>

      <!-- 內袍 -->
      <path d="M-14,130 L-6,148 L4,130" fill="none" stroke="#4a1a1a" stroke-width="3" stroke-linejoin="round"/>

      <!-- 銅腰帶 -->
      <path d="M-26,174 Q-4,182 20,174" fill="none" stroke="#8a7030" stroke-width="5" stroke-linecap="round"/>
      <rect x="-6" y="172" width="7" height="7" rx="1" fill="#8a7030" stroke="#6a5020" stroke-width="0.5"/>

      <!-- ===== 畫面左側手臂（撐地） ===== -->
      <path d="M-22,140 Q-36,156 -28,174" fill="none" stroke="url(#dubiCRobe)" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="-28" cy="176" rx="8" ry="5" fill="#101020" transform="rotate(5,-28,176)"/>
      <circle cx="-30" cy="176" r="4.5" fill="url(#dubiCFace)" opacity="0.85"/>

      <!-- 散落暗器（地上） -->
      <line x1="-40" y1="210" x2="-34" y2="208" stroke="#a0a8b0" stroke-width="1" opacity="0.4"/>
      <line x1="-36" y1="212" x2="-30" y2="210" stroke="#a0a8b0" stroke-width="1" opacity="0.3"/>
      <line x1="-44" y1="208" x2="-38" y2="206" stroke="#a0a8b0" stroke-width="0.8" opacity="0.25"/>

      <!-- ===== 大頭（低垂、喘息） ===== -->
      <ellipse cx="-2" cy="90" rx="38" ry="40" fill="url(#dubiCHair)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-32,86 C-36,98 -34,116 -28,128 C-22,136 -8,140 2,138 C12,136 20,128 24,116 C28,104 26,90 20,82 C14,76 2,72 -6,74 C-18,76 -30,80 -32,86Z" fill="url(#dubiCFace)"/>

      <!-- 黑眼圈（非常深） -->
      <ellipse cx="-14" cy="110" rx="8" ry="5" fill="#c0b098" opacity="0.5"/>
      <ellipse cx="6" cy="110" rx="8" ry="5" fill="#c0b098" opacity="0.5"/>

      <!-- 腮紅（痛苦） -->
      <ellipse cx="-24" cy="122" rx="7" ry="4" fill="#e0a0a0" opacity="0.4"/>

      <!-- 官帽（嚴重歪斜） -->
      <rect x="-22" y="58" width="44" height="14" rx="2" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="0.5" transform="rotate(-8,0,65)"/>
      <rect x="-18" y="52" width="36" height="8" rx="1" fill="#0c0c0c" transform="rotate(-8,0,56)"/>
      <path d="M-22,64 L-36,60 L-34,66 Z" fill="#0a0a0a" transform="rotate(-8,0,65)"/>
      <path d="M22,64 L36,60 L34,66 Z" fill="#0a0a0a" transform="rotate(-8,0,65)"/>

      <!-- 頭髮（散亂） -->
      <path d="M-22,76 C-18,64 -2,58 12,62 C22,66 26,76 24,82 C20,76 12,72 4,70 C-4,68 -14,70 -20,74" fill="url(#dubiCHair)"/>
      <!-- 散落髮絲 -->
      <path d="M-28,92 C-30,98 -28,102" fill="none" stroke="url(#dubiCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M22,86 C26,82 28,90 26,98 C24,104 22,100 22,96" fill="url(#dubiCHair)"/>

      <!-- 耳朵 -->
      <path d="M20,100 C24,96 26,102 24,110 C22,114 20,112 20,106" fill="url(#dubiCFace)" stroke="#b0a088" stroke-width="0.5"/>

      <!-- ===== 眼（雙眼瞇成線） ===== -->
      <!-- 左眼（幾乎閉上） -->
      <ellipse cx="-14" cy="106" rx="6" ry="1.8" fill="#fff"/>
      <ellipse cx="-15" cy="106.5" rx="3.5" ry="1.2" fill="#2a1a10"/>
      <ellipse cx="-15.5" cy="106" rx="2" ry="0.8" fill="#0a0400"/>

      <!-- 右眼（勉強睜一線） -->
      <ellipse cx="6" cy="106" rx="6" ry="2.2" fill="#fff"/>
      <ellipse cx="5" cy="106.5" rx="3.5" ry="1.5" fill="#2a1a10"/>
      <ellipse cx="4.5" cy="106" rx="2" ry="1" fill="#0a0400"/>
      <circle cx="3" cy="105.5" r="0.6" fill="#fff" opacity="0.4"/>

      <!-- 薄眉（深皺） -->
      <path d="M-18,100 C-14,99 -10,100 -8,101" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M10,101 C12,100 16,99 18,100" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 眉間皺紋 -->
      <path d="M-5,102 C-3,100 -1,100 1,102" fill="none" stroke="#b0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-6,104 C-4,102.5 -1,102.5 1,104" fill="none" stroke="#b0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 鼻子 -->
      <path d="M-8,112 C-10,118 -6,122" fill="none" stroke="#b0a080" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-6" cy="131" rx="5" ry="4.5" fill="#703030"/>
      <path d="M-10,129 L-2,129" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 山羊鬍（散亂） -->
      <line x1="-4" y1="138" x2="-5" y2="144" stroke="#2a2a2a" stroke-width="0.8" opacity="0.4"/>
      <line x1="-2" y1="138" x2="-2" y2="145" stroke="#2a2a2a" stroke-width="0.8" opacity="0.5"/>
      <line x1="0" y1="138" x2="1" y2="144" stroke="#2a2a2a" stroke-width="0.8" opacity="0.4"/>

      <!-- 汗滴（多顆） -->
      <path d="M-26,90 C-27,94 -26,100 -25,103" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-25" cy="104" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M20,92 C21,96 20,100" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="20" cy="101" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <ellipse cx="-10" cy="76" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>

      <!-- ===== 畫面右側手臂（無力垂下） ===== -->
      <path d="M22,138 Q32,152 28,170" fill="none" stroke="url(#dubiCRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <ellipse cx="28" cy="172" rx="7" ry="5" fill="#101020" transform="rotate(-5,28,172)"/>
      <circle cx="30" cy="172" r="4" fill="url(#dubiCFace)" opacity="0.8"/>
    </g>
  </g>
</svg>