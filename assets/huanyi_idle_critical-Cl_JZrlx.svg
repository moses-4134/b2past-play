<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 桓齮 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪、槍撐地、喘息） -->
  <defs>
    <radialGradient id="huanyiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8c8a8"/>
      <stop offset="100%" stop-color="#d0b090"/>
    </radialGradient>
    <linearGradient id="huanyiJacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#3a2018"/>
    </linearGradient>
    <linearGradient id="huanyiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3530"/>
      <stop offset="100%" stop-color="#201c18"/>
    </linearGradient>
    <linearGradient id="huanyiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="huanyiSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 28)">
    <!-- 陰影（因半跪而更寬） -->
    <ellipse cx="-4" cy="210" rx="32" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（半跪姿態） ===== -->
    <!-- 後腿（右腿，膝蓋撐地） -->
    <ellipse cx="8" cy="192" rx="9" ry="12" fill="url(#huanyiPants)" transform="rotate(-20,8,192)"/>
    <ellipse cx="2" cy="204" rx="8" ry="5" fill="url(#huanyiPants)"/>
    <ellipse cx="0" cy="208" rx="9" ry="5" fill="#3a2818"/>
    <!-- 前腿（左腿，彎曲支撐） -->
    <ellipse cx="-16" cy="188" rx="9" ry="16" fill="url(#huanyiPants)" transform="rotate(12,-16,188)"/>
    <ellipse cx="-20" cy="208" rx="10" ry="6" fill="#3a2818"/>

    <!-- ===== 身體（大幅前傾） ===== -->
    <ellipse cx="-4" cy="160" rx="25" ry="27" fill="url(#huanyiJacket)" transform="rotate(-14,-4,160)"/>

    <!-- 肩甲護肩 -->
    <rect x="-28" y="138" width="9" height="7" rx="2" fill="#4a3020" stroke="#3a2010" stroke-width="0.5"/>
    <rect x="15" y="140" width="9" height="7" rx="2" fill="#4a3020" stroke="#3a2010" stroke-width="0.5"/>

    <!-- 領口 -->
    <path d="M-14,140 L-9,152 L-2,140" fill="none" stroke="#7a6048" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-27,178 Q-4,186 20,180" fill="none" stroke="#4a3020" stroke-width="5" stroke-linecap="round"/>
    <rect x="-7" y="178" width="7" height="7" rx="1" fill="#b89838" stroke="#907028" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手）撐在膝蓋上 ===== -->
    <path d="M16,148 Q24,162 16,180" fill="none" stroke="url(#huanyiJacket)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <circle cx="15" cy="182" r="5" fill="url(#huanyiFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手）槍插地撐住身體 ===== -->
    <path d="M-24,146 Q-44,154 -54,168" fill="none" stroke="url(#huanyiJacket)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-54" cy="170" r="5" fill="url(#huanyiFace)"/>

    <!-- ===== 槍（插入地面當支撐） ===== -->
    <line x1="-55" y1="172" x2="-58" y2="214" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
    <!-- 槍頭（朝上） -->
    <path d="M-53,126 L-55,140 L-59,138 Z" fill="url(#huanyiSteel)" stroke="#888" stroke-width="0.5"/>
    <!-- 槍纓 -->
    <line x1="-54" y1="140" x2="-52" y2="136" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-56" y1="142" x2="-54" y2="138" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 槍桿上段 -->
    <line x1="-55" y1="140" x2="-55" y2="172" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
    <!-- 插入地面效果 -->
    <ellipse cx="-58" cy="214" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>

    <!-- ===== 大頭（低垂、喘息） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="-2" cy="94" rx="39" ry="41" fill="url(#huanyiHair)"/>

    <!-- 臉（明顯低頭） -->
    <path d="M-30,90 C-34,102 -32,118 -26,128 C-20,136 -8,140 2,138 C12,136 20,130 24,120 C28,108 26,94 20,86 C14,80 4,76 -6,78 C-18,80 -28,82 -30,90Z" fill="url(#huanyiFace)"/>

    <!-- 腮紅（因痛苦更明顯） -->
    <ellipse cx="-22" cy="124" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

    <!-- 頭髮頂部 -->
    <path d="M-20,80 C-16,62 0,54 14,58 C26,62 32,74 28,84 C24,78 16,72 8,70 C0,68 -10,70 -16,76" fill="url(#huanyiHair)"/>

    <!-- 瀏海（略散亂） -->
    <path d="M-28,90 C-32,78 -34,82 -34,90 C-32,94 -28,94 -28,92" fill="url(#huanyiHair)"/>
    <path d="M-24,84 C-26,74 -30,76 -30,86 C-28,90 -24,90 -24,88" fill="#1a1410"/>
    <path d="M-20,82 C-22,72 -26,74 -26,82 C-24,86 -20,86 -20,84" fill="url(#huanyiHair)" opacity="0.9"/>
    <!-- 散落髮絲 -->
    <path d="M-32,94 C-34,100 -32,104" fill="none" stroke="url(#huanyiHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- 年輕武將頭巾（歪斜） -->
    <path d="M-26,78 C-18,71 0,67 18,71 C26,73 30,77 28,80" fill="none" stroke="#4a3828" stroke-width="4" stroke-linecap="round"/>
    <path d="M22,76 C28,72 34,74 36,80" fill="none" stroke="#4a3828" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22,76 C30,76 36,82 34,88" fill="none" stroke="#4a3828" stroke-width="2" stroke-linecap="round"/>

    <!-- 側髮 -->
    <path d="M20,86 C24,82 26,88 24,94 C22,98 20,96 20,92" fill="url(#huanyiHair)"/>

    <!-- 耳朵 -->
    <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,110" fill="url(#huanyiFace)" stroke="#c8a888" stroke-width="0.5"/>

    <!-- ===== 眼睛（雙眼瞇成線） ===== -->
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-10" cy="110" rx="6.5" ry="2" fill="#fff"/>
    <ellipse cx="-11" cy="110.5" rx="4.2" ry="1.5" fill="#241820"/>
    <ellipse cx="-11.5" cy="110" rx="2.2" ry="1" fill="#0c0808"/>

    <!-- 右眼（勉強睜一線） -->
    <ellipse cx="6" cy="110" rx="6.5" ry="2.5" fill="#fff"/>
    <ellipse cx="5" cy="110.5" rx="4.2" ry="2" fill="#241820"/>
    <ellipse cx="4.5" cy="110" rx="2.2" ry="1.2" fill="#0c0808"/>
    <circle cx="3" cy="109" r="0.8" fill="#fff" opacity="0.7"/>

    <!-- 眉間皺紋（深刻） -->
    <path d="M-3,103 C-2,101 0,101 1,103" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-4,105 C-2,103.5 1,103.5 2,105" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

    <!-- 眉毛（痛苦皺起） -->
    <path d="M-18,105 C-14,104 -8,104 -4,106" fill="none" stroke="#1a1410" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,106 C4,104 8,104 12,106" fill="none" stroke="#1a1410" stroke-width="2" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M-16,118 C-17,122 -15,126" fill="none" stroke="#c0a078" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（喘息張開） -->
    <ellipse cx="-4" cy="132" rx="5" ry="4.5" fill="#703030"/>
    <!-- 上排牙 -->
    <path d="M-8,130 L0,130" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 汗滴（多顆） -->
    <path d="M-24,90 C-25,94 -24,100 -23,103" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-23" cy="104" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M22,92 C23,96 22,100" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="22" cy="101" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <!-- 額頭汗 -->
    <ellipse cx="-6" cy="80" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
  </g>
</svg>