<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙蘅 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：跪地、雙手撐地、近乎淚目） -->
  <defs>
    <radialGradient id="zhaoFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fff4ec"/>
      <stop offset="100%" stop-color="#f2dcd0"/>
    </radialGradient>
    <linearGradient id="zhaoRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#c87888"/>
      <stop offset="100%" stop-color="#a85868"/>
    </linearGradient>
    <linearGradient id="zhaoSkirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b86878"/>
      <stop offset="100%" stop-color="#985060"/>
    </linearGradient>
    <linearGradient id="zhaoHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181010"/>
      <stop offset="100%" stop-color="#0c0808"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 28)">
    <!-- 陰影（跪地更寬） -->
    <ellipse cx="-4" cy="210" rx="32" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（跪地姿態） ===== -->
    <!-- 後腿（右腿，膝蓋著地） -->
    <ellipse cx="8" cy="190" rx="9" ry="12" fill="url(#zhaoSkirt)" transform="rotate(-18,8,190)"/>
    <ellipse cx="2" cy="200" rx="8" ry="5" fill="url(#zhaoSkirt)"/>
    <ellipse cx="0" cy="204" rx="9" ry="5" fill="#5a4040"/>
    <!-- 前腿（左腿，跪地） -->
    <ellipse cx="-14" cy="186" rx="10" ry="14" fill="url(#zhaoSkirt)" transform="rotate(10,-14,186)"/>
    <ellipse cx="-18" cy="204" rx="10" ry="5.5" fill="#5a4040"/>

    <!-- ===== 身體（大幅前傾，趴伏姿態） ===== -->
    <ellipse cx="-4" cy="156" rx="24" ry="25" fill="url(#zhaoRobe)" transform="rotate(-14,-4,156)"/>

    <!-- 金色腰帶 -->
    <path d="M-26,172 Q-4,180 18,174" fill="none" stroke="#c8a848" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-6" cy="177" r="3" fill="#dcc060"/>

    <!-- 淺色內襯領口 -->
    <path d="M-14,136 L-9,148 L-2,136" fill="none" stroke="#f0ddd8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 金色邊飾 -->
    <path d="M-28,164 Q-4,168 20,164" fill="none" stroke="#c8a848" stroke-width="1" opacity="0.5"/>

    <!-- ===== 後方垂髮（散落地面） ===== -->
    <path d="M-30,90 C-32,104 -34,124 -34,148 C-34,162 -32,174 -30,186" fill="none" stroke="url(#zhaoHair)" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
    <path d="M-28,86 C-30,100 -32,120 -32,144 C-32,158 -30,170 -28,180" fill="none" stroke="url(#zhaoHair)" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

    <!-- ===== 畫面右側手臂（角色左手）撐地 ===== -->
    <path d="M16,142 Q24,158 18,180" fill="none" stroke="url(#zhaoRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="17" cy="182" r="4.5" fill="url(#zhaoFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手）撐地 ===== -->
    <path d="M-24,142 Q-38,156 -40,178" fill="none" stroke="url(#zhaoRobe)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-40" cy="180" r="5" fill="url(#zhaoFace)"/>

    <!-- 袖口金邊 -->
    <path d="M-38,164 Q-40,172 -40,178" fill="none" stroke="#c8a848" stroke-width="1" opacity="0.6"/>
    <path d="M24,164 Q20,172 18,180" fill="none" stroke="#c8a848" stroke-width="1" opacity="0.6"/>

    <!-- ===== 大頭（明顯低垂） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="-2" cy="92" rx="38" ry="40" fill="url(#zhaoHair)"/>

    <!-- 臉（低頭） -->
    <path d="M-26,86 C-30,96 -28,110 -22,121 C-16,129 -7,133 3,131 C9,129 14,123 18,113 C22,101 20,89 14,81 C8,75 1,73 -5,75 C-15,77 -24,80 -26,86Z" fill="url(#zhaoFace)"/>

    <!-- 腮紅（痛苦泛紅更明顯） -->
    <ellipse cx="-20" cy="120" rx="7" ry="4" fill="#e8a0a0" opacity="0.5"/>

    <!-- 頭髮頂部 -->
    <path d="M-20,76 C-16,56 0,48 14,52 C24,56 28,68 24,80 C20,74 12,68 4,66 C-4,64 -12,66 -16,72" fill="url(#zhaoHair)"/>

    <!-- 瀏海（略散亂） -->
    <path d="M-28,86 C-34,74 -36,78 -38,86 C-36,92 -30,94 -28,90" fill="url(#zhaoHair)"/>
    <path d="M-24,80 C-28,68 -32,72 -32,82 C-30,88 -24,88 -24,84" fill="#181010"/>
    <path d="M-20,76 C-22,66 -26,68 -26,78 C-24,84 -20,84 -20,80" fill="url(#zhaoHair)" opacity="0.9"/>
    <!-- 散落髮絲 -->
    <path d="M-34,94 C-36,100 -34,104" fill="none" stroke="url(#zhaoHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- 金色髮冠（微歪） -->
    <g transform="rotate(-8, 3, 54)">
      <path d="M-8,58 C-4,50 4,48 10,52 C14,55 14,60 10,62 C6,64 0,62 -4,60 Z" fill="#dcc060" stroke="#c8a848" stroke-width="0.5"/>
      <circle cx="3" cy="54" r="2" fill="#f0e080"/>
      <circle cx="3" cy="54" r="1" fill="#fff" opacity="0.6"/>
      <path d="M1,50 L3,44 L5,50" fill="#dcc060" stroke="#c8a848" stroke-width="0.5"/>
    </g>

    <!-- 右側垂髮 -->
    <path d="M20,82 C26,76 28,84 26,94 C24,102 20,98 20,92" fill="url(#zhaoHair)"/>
    <path d="M22,92 C26,90 28,98 26,108 C24,116 20,112 20,106" fill="url(#zhaoHair)" opacity="0.8"/>
    <path d="M22,106 C26,104 28,112 26,122 C24,128 20,124 20,118" fill="url(#zhaoHair)" opacity="0.6"/>

    <!-- 後方長髮（散落） -->
    <path d="M22,78 C26,88 28,108 26,132" fill="none" stroke="url(#zhaoHair)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M26,132 C24,148 22,162 20,174" fill="none" stroke="url(#zhaoHair)" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

    <!-- 耳朵 -->
    <path d="M16,98 C20,94 22,100 20,106 C18,110 16,108 16,104" fill="url(#zhaoFace)" stroke="#f2dcd0" stroke-width="0.5"/>

    <!-- ===== 眼睛（雙眼近乎閉合，含淚） ===== -->
    <!-- 左眼睫毛暗示線 -->
    <path d="M-18,96 C-15,94 -9,94 -6,96" fill="none" stroke="#181010" stroke-width="0.8" opacity="0.4"/>
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-11" cy="104" rx="8" ry="2.2" fill="#fff"/>
    <ellipse cx="-12" cy="104.5" rx="5" ry="1.5" fill="#483828"/>
    <ellipse cx="-12.5" cy="104" rx="2.5" ry="1" fill="#1a0c08"/>

    <!-- 右眼睫毛暗示線 -->
    <path d="M-2,96 C1,94 7,94 10,96" fill="none" stroke="#181010" stroke-width="0.8" opacity="0.4"/>
    <!-- 右眼（幾乎閉上） -->
    <ellipse cx="5" cy="104" rx="8" ry="2.5" fill="#fff"/>
    <ellipse cx="4" cy="104.5" rx="5" ry="1.8" fill="#483828"/>
    <ellipse cx="3.5" cy="104" rx="2.5" ry="1.2" fill="#1a0c08"/>
    <circle cx="2" cy="103.5" r="0.8" fill="#fff" opacity="0.6"/>

    <!-- 淚滴暗示（眼角） -->
    <ellipse cx="-18" cy="106" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>

    <!-- 眉間皺紋 -->
    <path d="M-5,98 C-3,96 -1,96 1,98" fill="none" stroke="#e0c0b0" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    <path d="M-6,100 C-4,98.5 -1,98.5 0,100" fill="none" stroke="#e0c0b0" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>

    <!-- 鼻子 -->
    <path d="M-15,114 C-15.5,116 -14.5,117" fill="none" stroke="#f2dcd0" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴（張開喘息，公主的痛苦呼喊） -->
    <ellipse cx="-8" cy="124" rx="4.5" ry="3.5" fill="#905050"/>
    <!-- 上排牙齒暗示 -->
    <path d="M-12,122 L-4,122" fill="none" stroke="#eee" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- 汗滴（多顆） -->
    <path d="M-24,88 C-25,92 -24,96 -23,98" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-23" cy="99" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M20,90 C21,94 20,98" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="20" cy="99" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <!-- 額頭汗 -->
    <ellipse cx="-10" cy="76" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
  </g>
</svg>