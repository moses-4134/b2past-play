        <path d="M-16,80 C-12,62 4,54 16,58 C24,64 28,74 24,84 C20,76 14,70 6,68 C0,66 -8,68 -14,74" fill="url(#mobZMGuardHair)"/>
        <path d="M-24,90 C-28,78 -30,82 -30,92 C-28,96 -24,96 -24,92" fill="url(#mobZMGuardHair)"/>
        <path d="M-20,84 C-24,72 -26,76 -26,86 C-24,90 -20,90 -20,86" fill="#2a1a10"/>
        <path d="M18,86 C24,80 26,88 24,96 C22,100 18,98 18,94" fill="url(#mobZMGuardHair)"/>

        <path d="M16,102 C20,98 22,104 20,110 C18,114 16,112 16,108" fill="url(#mobZMGuardFace)" stroke="#b09060" stroke-width="0.5"/>

