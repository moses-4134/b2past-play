        <line x1="-84" y1="184" x2="-84" y2="190" stroke="#bbb" stroke-width="2" stroke-linecap="round"/>
        <line x1="-30" y1="193" x2="-28" y2="200" stroke="#8a6830" stroke-width="3" stroke-linecap="round"/>
        <line x1="-26" y1="198" x2="-22" y2="200" stroke="#4a3018" stroke-width="4" stroke-linecap="round"/>
