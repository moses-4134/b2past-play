        <path d="M8,103 C10,101 12,100 16,102" fill="none" stroke="#2a1a10" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

        <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

        <path d="M-10,128 C-6,128 0,128 4,128" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>
