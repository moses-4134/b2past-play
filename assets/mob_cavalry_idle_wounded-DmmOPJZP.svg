<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙國騎兵 — 受傷待機（HP 30~60%：身體前傾、劍下垂、單眼瞇、汗滴） -->
  <defs>
    <radialGradient id="mobCavalryWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c0a470"/>
    </radialGradient>
    <linearGradient id="mobCavalryWArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3030"/>
      <stop offset="100%" stop-color="#3a2020"/>
    </linearGradient>
    <linearGradient id="mobCavalryWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2828"/>
      <stop offset="100%" stop-color="#2a1818"/>
    </linearGradient>
    <linearGradient id="mobCavalryWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="mobCavalryWBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="198" rx="24" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（重心偏移） ===== -->
      <!-- 後腿 -->
      <ellipse cx="8" cy="178" rx="8" ry="15" fill="url(#mobCavalryWPants)" transform="rotate(-5,8,178)"/>
      <ellipse cx="6" cy="192" rx="9" ry="6" fill="#2a1818"/>
      <!-- 前腿（微彎） -->
      <ellipse cx="-10" cy="176" rx="9" ry="16" fill="url(#mobCavalryWPants)" transform="rotate(8,-10,176)"/>
      <ellipse cx="-13" cy="192" rx="10" ry="6" fill="#2a1818"/>

      <!-- ===== 身體（前傾） ===== -->
      <ellipse cx="-2" cy="146" rx="24" ry="26" fill="url(#mobCavalryWArmor)" transform="rotate(-8,-2,146)"/>

      <!-- 肩甲 -->
      <ellipse cx="-20" cy="130" rx="8" ry="5" fill="#4a2828" stroke="#3a1818" stroke-width="0.5" transform="rotate(-14,-20,130)"/>
      <ellipse cx="16" cy="130" rx="8" ry="5" fill="#4a2828" stroke="#3a1818" stroke-width="0.5" transform="rotate(6,16,130)"/>

      <!-- 領口 -->
      <path d="M-12,126 L-6,136 L2,126" fill="none" stroke="#3a2020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-22,166 Q-4,174 16,168" fill="none" stroke="#3a2818" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="100" rx="32" ry="34" fill="url(#mobCavalryWHair)"/>

      <!-- 臉（微低頭） -->
      <path d="M-24,92 C-28,102 -26,112 -20,122 C-14,130 -6,134 2,132 C8,130 14,124 18,114 C22,102 20,92 14,84 C8,78 2,76 -4,78 C-14,80 -22,86 -24,92Z" fill="url(#mobCavalryWFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-14,80 C-10,64 4,56 14,60 C22,64 26,74 22,84 C18,76 12,70 4,68 C0,66 -6,68 -12,74" fill="url(#mobCavalryWHair)"/>

      <!-- 束髮 -->
      <path d="M6,60 C10,54 16,56 14,64" fill="url(#mobCavalryWHair)" stroke="#2a2018" stroke-width="0.5"/>

      <!-- 瀏海 -->
      <path d="M-20,84 C-24,78 -26,82 -26,88 C-24,92 -20,90 -20,86" fill="url(#mobCavalryWHair)"/>
      <path d="M-16,82 C-18,76 -22,78 -22,86 C-20,90 -16,88 -16,84" fill="url(#mobCavalryWHair)" opacity="0.9"/>

      <!-- 側髮 -->
      <path d="M16,86 C22,80 24,88 22,96 C20,100 16,98 16,94" fill="url(#mobCavalryWHair)"/>

      <!-- 耳朵 -->
      <path d="M16,104 C20,100 22,106 20,112 C18,116 16,114 16,110" fill="url(#mobCavalryWFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- 腮紅（傷痛） -->
      <ellipse cx="-18" cy="120" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- ===== 眼睛 ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-10" cy="108" rx="6.5" ry="3.5" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="3.8" ry="2.5" fill="#2a1818"/>
      <ellipse cx="-11.5" cy="108" rx="2" ry="1.5" fill="#1a0808"/>
      <circle cx="-13" cy="107" r="0.8" fill="#fff" opacity="0.5"/>

      <!-- 右眼（微睜） -->
      <ellipse cx="6" cy="108" rx="6.5" ry="5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.8" ry="3.8" fill="#2a1818"/>
      <ellipse cx="4.5" cy="108" rx="2" ry="2" fill="#1a0808"/>
      <circle cx="3" cy="107" r="1" fill="#fff" opacity="0.55"/>

      <!-- 眉間皺紋 -->
      <path d="M-3,102 C-2,100 0,100 1,102" fill="none" stroke="#b09060" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 眉毛 -->
      <path d="M-14,102 C-10,100 -8,101 -6,103" fill="none" stroke="#2a2018" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,103 C10,101 12,100 16,102" fill="none" stroke="#2a2018" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#a08858" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-8,128 C-4,129 2,129 6,128" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-8,128 C-9,130 -10,131" fill="none" stroke="#704840" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴 -->
      <path d="M-20,88 C-21,92 -20,96 -19,98" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-19" cy="99" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>

      <!-- ===== 左手臂（負x，按住腹部傷口） ===== -->
      <path d="M-18,134 Q-28,142 -24,158" fill="none" stroke="url(#mobCavalryWArmor)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-24" cy="160" r="4.5" fill="url(#mobCavalryWFace)" opacity="0.85"/>

      <!-- ===== 右手臂（正x，劍下垂） ===== -->
      <path d="M16,134 Q28,140 32,152" fill="none" stroke="url(#mobCavalryWArmor)" stroke-width="10" stroke-linecap="round"/>

      <!-- ===== 劍（下垂） ===== -->
      <line x1="34" y1="148" x2="38" y2="198" stroke="url(#mobCavalryWBlade)" stroke-width="4" stroke-linecap="round"/>
      <line x1="35" y1="146" x2="39" y2="196" stroke="#ddd" stroke-width="1" opacity="0.3"/>
      <!-- 護手 -->
      <line x1="30" y1="150" x2="38" y2="148" stroke="#806030" stroke-width="3" stroke-linecap="round"/>
      <!-- 柄 -->
      <line x1="33" y1="150" x2="32" y2="142" stroke="#4a3520" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="31" cy="140" r="2" fill="#806030"/>
      <!-- 握劍手 -->
      <circle cx="33" cy="150" r="5" fill="url(#mobCavalryWFace)"/>
    </g>
  </g>
</svg>
