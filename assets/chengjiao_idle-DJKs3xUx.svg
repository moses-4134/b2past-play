<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 程蛟 — 吉卜力2頭身 面朝右（敵方）戰鬥待機 -->
  <defs>
    <radialGradient id="chengjiaoFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b090"/>
      <stop offset="100%" stop-color="#c09878"/>
    </radialGradient>
    <linearGradient id="chengjiaoArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a2828"/>
      <stop offset="100%" stop-color="#4a1818"/>
    </linearGradient>
    <linearGradient id="chengjiaoPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2020"/>
      <stop offset="100%" stop-color="#1e1010"/>
    </linearGradient>
    <linearGradient id="chengjiaoBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="34" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（微蹲防禦姿態） ===== -->
      <!-- 後腿 -->
      <ellipse cx="14" cy="202" rx="12" ry="17" fill="url(#chengjiaoPants)" transform="rotate(-5,14,202)"/>
      <ellipse cx="12" cy="218" rx="13" ry="7" fill="#3a2018"/>
      <!-- 前腿 -->
      <ellipse cx="-14" cy="200" rx="13" ry="18" fill="url(#chengjiaoPants)" transform="rotate(5,-14,200)"/>
      <ellipse cx="-16" cy="218" rx="14" ry="7" fill="#3a2018"/>

      <!-- ===== 身體（壯碩蠻力型） ===== -->
      <ellipse cx="-2" cy="158" rx="30" ry="32" fill="url(#chengjiaoArmor)" transform="rotate(-5,-2,160)"/>

      <!-- 肩甲（大片） -->
      <path d="M-30,138 Q-36,134 -38,140 Q-34,148 -28,148" fill="#5a2020" stroke="#4a1818" stroke-width="0.8"/>
      <path d="M22,138 Q28,134 30,140 Q26,148 20,148" fill="#5a2020" stroke="#4a1818" stroke-width="0.8"/>

      <!-- 甲片紋路 -->
      <path d="M-12,148 L-8,162" fill="none" stroke="#3a1010" stroke-width="1" opacity="0.4"/>
      <path d="M6,152 L10,166" fill="none" stroke="#3a1010" stroke-width="0.8" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-14,135 L-6,150 L4,135" fill="none" stroke="#7a3030" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-30,182 Q-2,191 28,182" fill="none" stroke="#4a2818" stroke-width="7" stroke-linecap="round"/>
      <rect x="-8" y="180" width="10" height="10" rx="1" fill="#a08030" stroke="#806020" stroke-width="0.5"/>

      <!-- ===== 大頭（圓臉橫肉） ===== -->
      <!-- 光頭 -->
      <ellipse cx="0" cy="94" rx="40" ry="42" fill="#c09070"/>
      <!-- 光頭高光 -->
      <ellipse cx="-6" cy="72" rx="18" ry="12" fill="#d0a080" opacity="0.4"/>

      <!-- 臉（圓臉橫肉，蠻力感） -->
      <path d="M-30,86 C-34,98 -32,116 -26,128 C-20,136 -6,142 4,140 C14,138 24,128 28,116 C32,104 30,92 24,84 C18,78 6,74 -4,76 C-16,78 -28,80 -30,86Z" fill="url(#chengjiaoFace)"/>

      <!-- 傷疤（額頭斜線） -->
      <path d="M-8,78 L6,90" fill="none" stroke="#a08060" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
      <path d="M-6,78 L8,90" fill="none" stroke="#c8a888" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>

      <!-- 耳朵 -->
      <path d="M22,100 C26,96 28,102 26,110 C24,114 22,112 22,106" fill="url(#chengjiaoFace)" stroke="#b08860" stroke-width="0.5"/>

      <!-- ===== 眼睛（橫寬兇狠） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-12" cy="106" rx="7" ry="5.5" fill="#fff"/>
      <ellipse cx="-13" cy="107" rx="4.5" ry="4.2" fill="#3a1810"/>
      <ellipse cx="-13.5" cy="106" rx="2.5" ry="2.5" fill="#1a0800"/>
      <circle cx="-15" cy="104.5" r="1.3" fill="#fff" opacity="0.55"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="106" rx="7" ry="5.5" fill="#fff"/>
      <ellipse cx="5" cy="107" rx="4.5" ry="4.2" fill="#3a1810"/>
      <ellipse cx="4.5" cy="106" rx="2.5" ry="2.5" fill="#1a0800"/>
      <circle cx="3" cy="104.5" r="1.3" fill="#fff" opacity="0.55"/>

      <!-- 粗眉毛（兇惡八字眉） -->
      <path d="M-18,98 C-14,96 -10,98 -8,100" fill="none" stroke="#5a3828" stroke-width="3" stroke-linecap="round"/>
      <path d="M10,100 C12,98 16,96 20,98" fill="none" stroke="#5a3828" stroke-width="3" stroke-linecap="round"/>

      <!-- 鼻子（粗大） -->
      <path d="M-18,114 C-20,120 -16,124" fill="none" stroke="#a08058" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 嘴巴（不屑的歪嘴） -->
      <path d="M-14,130 C-8,132 -2,132 4,129" fill="none" stroke="#704840" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-14,130 C-16,132 -17,133" fill="none" stroke="#704840" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- ===== 畫面左側手臂（角色左手，空手） ===== -->
      <path d="M-24,146 Q-44,150 -46,166" fill="none" stroke="url(#chengjiaoArmor)" stroke-width="13" stroke-linecap="round" opacity="0.8"/>
      <path d="M-36,154 Q-40,152 -42,158" fill="none" stroke="#4a1818" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-46" cy="168" r="6.5" fill="url(#chengjiaoFace)" opacity="0.85"/>

      <!-- ===== 畫面右側手臂（角色右手，持大刀） ===== -->
      <path d="M28,146 Q48,138 60,134" fill="none" stroke="url(#chengjiaoArmor)" stroke-width="14" stroke-linecap="round"/>
      <path d="M44,140 Q50,136 54,134" fill="none" stroke="#4a1818" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 大刀（斜舉，比普通刀更大） ===== -->
      <!-- 刀身（窄底寬頂，填充path） -->
      <path d="M60,128 L78,74 L82,66 L92,72 Q76,100 66,132 Z" fill="url(#chengjiaoBlade)" stroke="#666" stroke-width="0.5"/>
      <!-- 刀背厚線 -->
      <line x1="60" y1="128" x2="78" y2="74" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 刀尖斜角切面 -->
      <line x1="82" y1="66" x2="92" y2="72" stroke="#777" stroke-width="1.2"/>
      <!-- 刀刃弧線外彎亮線 -->
      <path d="M66,132 Q76,100 92,72" fill="none" stroke="#ddd" stroke-width="0.8" opacity="0.3"/>
      <!-- 刀護手 -->
      <line x1="66" y1="132" x2="54" y2="128" stroke="#806030" stroke-width="4.5" stroke-linecap="round"/>
      <!-- 刀柄 -->
      <line x1="58" y1="133" x2="56" y2="142" stroke="#4a3520" stroke-width="5.5" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="55" cy="145" r="3.5" fill="#806030"/>
      <!-- 握刀的手 -->
      <circle cx="57" cy="136" r="7" fill="url(#chengjiaoFace)"/>
    </g>
  </g>
</svg>
