<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙嵬 — 吉卜力2頭身 面朝右（敵方）受擊 -->
  <defs>
    <radialGradient id="zmFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e0d0"/>
      <stop offset="100%" stop-color="#d8c4a8"/>
    </radialGradient>
    <linearGradient id="zmRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a2858"/>
      <stop offset="100%" stop-color="#2a1838"/>
    </linearGradient>
    <linearGradient id="zmInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3828"/>
      <stop offset="100%" stop-color="#1a2818"/>
    </linearGradient>
    <linearGradient id="zmHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#201820"/>
      <stop offset="100%" stop-color="#100810"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 14)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="203.5" rx="24" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（後仰重心不穩） ===== -->
      <ellipse cx="12" cy="184" rx="7" ry="14" fill="url(#zmInner)" transform="rotate(-8,12,184)"/>
      <ellipse cx="10" cy="198" rx="8" ry="5.5" fill="#2a2020"/>
      <ellipse cx="-6" cy="183" rx="8" ry="15" fill="url(#zmInner)" transform="rotate(8,-6,183)"/>
      <ellipse cx="-8" cy="198" rx="9" ry="5.5" fill="#2a2020"/>

      <!-- ===== 身體（後仰受擊） ===== -->
      <ellipse cx="2" cy="154" rx="23" ry="25" fill="url(#zmRobe)" transform="rotate(12,2,154)"/>

      <path d="M-6,132 L-1,146 L6,132" fill="none" stroke="#2a3828" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <path d="M-18,170 Q2,178 22,170" fill="none" stroke="#c8a040" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 手臂（防禦姿態） ===== -->
      <!-- 右手護胸 -->
      <path d="M-16,142 Q-24,148 -20,158" fill="none" stroke="url(#zmRobe)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-20" cy="160" r="4.5" fill="url(#zmFace)"/>

      <!-- 左手向後甩 -->
      <path d="M20,140 Q36,150 40,164" fill="none" stroke="url(#zmRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="40" cy="166" r="4" fill="url(#zmFace)" opacity="0.85"/>

      <!-- ===== 大頭（後仰痛苦） ===== -->
      <ellipse cx="4" cy="92" rx="36" ry="38" fill="url(#zmHair)"/>

      <path d="M-18,86 C-22,96 -20,112 -14,122 C-8,130 0,134 8,132 C14,130 20,124 24,114 C28,102 26,90 20,82 C14,76 6,74 0,76 C-8,78 -16,82 -18,86Z" fill="url(#zmFace)"/>

      <path d="M-10,78 C-6,56 10,48 22,54 C30,60 32,72 28,82 C24,74 16,66 8,64 C0,62 -6,66 -10,74" fill="url(#zmHair)"/>

      <!-- 官帽（微歪） -->
      <path d="M-8,58 C-4,44 12,40 20,46 C24,50 22,56 18,58" fill="#201820" stroke="#c8a040" stroke-width="1" transform="rotate(8,6,50)"/>
      <rect x="2" y="40" width="8" height="6" rx="1" fill="#c8a040" transform="rotate(8,6,43)"/>

      <!-- 鬢角 -->
      <path d="M24,84 C30,80 32,88 30,96 C28,102 24,100 24,94" fill="url(#zmHair)"/>
      <path d="M-22,88 C-26,100 -26,112 -24,122" fill="none" stroke="url(#zmHair)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

      <path d="M22,100 C26,96 28,102 26,108 C24,112 22,110 22,106" fill="url(#zmFace)" stroke="#d0b498" stroke-width="0.5"/>

      <!-- ===== 眼睛（痛苦緊閉） ===== -->
      <path d="M-14,106 C-10,108 -6,106" fill="none" stroke="#201820" stroke-width="2" stroke-linecap="round"/>
      <path d="M4,106 C8,108 12,106" fill="none" stroke="#201820" stroke-width="2" stroke-linecap="round"/>

      <!-- 粗眉（皺起） -->
      <path d="M-14,100 C-10,98 -6,100 -2,102" fill="none" stroke="#201820" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M4,102 C8,100 12,98 16,100" fill="none" stroke="#201820" stroke-width="2.5" stroke-linecap="round"/>

      <path d="M-8,114 C-9,118 -7,120" fill="none" stroke="#c8b090" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 八字鬍 -->
      <path d="M-4,122 C-8,126 -12,127" fill="none" stroke="#302828" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M4,122 C8,126 12,127" fill="none" stroke="#302828" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 嘴巴（痛苦咬牙） -->
      <path d="M-4,128 C0,130 4,130 8,128" fill="none" stroke="#705040" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>