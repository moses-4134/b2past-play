<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 嫪毐 — 吉卜力2頭身 面朝右（敵方）受傷待機（HP 30~60%：身體微傾、單手按腹、眼睛半瞇、刀下垂） -->
  <defs>
    <radialGradient id="laoaiWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b080"/>
      <stop offset="100%" stop-color="#c09868"/>
    </radialGradient>
    <linearGradient id="laoaiWArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#4a2a18"/>
    </linearGradient>
    <linearGradient id="laoaiWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#221810"/>
    </linearGradient>
    <linearGradient id="laoaiWBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <linearGradient id="laoaiWHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a08838"/>
      <stop offset="100%" stop-color="#8a7030"/>
    </linearGradient>
    <linearGradient id="laoaiWGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8b848"/>
      <stop offset="100%" stop-color="#c8a840"/>
    </linearGradient>
    <linearGradient id="laoaiWShoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="36" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（重心偏移，前腿微彎） ===== -->
      <!-- 後腿 -->
      <ellipse cx="18" cy="202" rx="12" ry="18" fill="url(#laoaiWPants)" transform="rotate(-3,18,202)"/>
      <ellipse cx="16" cy="218" rx="14" ry="7.5" fill="#3a2018"/>
      <!-- 前腿（微彎支撐） -->
      <ellipse cx="-20" cy="200" rx="13" ry="19" fill="url(#laoaiWPants)" transform="rotate(8,-20,200)"/>
      <ellipse cx="-23" cy="218" rx="14" ry="7.5" fill="#3a2018"/>

      <!-- ===== 身體（前傾彎腰） ===== -->
      <ellipse cx="-2" cy="156" rx="30" ry="34" fill="url(#laoaiWArmor)" transform="rotate(-8,-2,156)"/>

      <!-- 金色鎧甲紋飾 -->
      <line x1="-22" y1="136" x2="-24" y2="182" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <line x1="18" y1="136" x2="20" y2="182" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <rect x="-18" y="148" width="28" height="18" rx="3" fill="none" stroke="#c8a840" stroke-width="1.2" opacity="0.6"/>
      <circle cx="-4" cy="157" r="4" fill="none" stroke="#c8a840" stroke-width="1" opacity="0.5"/>

      <!-- 大肩甲 -->
      <ellipse cx="-36" cy="138" rx="14" ry="10" fill="url(#laoaiWShoulder)" stroke="#c8a840" stroke-width="1"/>
      <line x1="-44" y1="134" x2="-28" y2="134" stroke="#c8a840" stroke-width="1.5" opacity="0.7"/>
      <ellipse cx="26" cy="138" rx="14" ry="10" fill="url(#laoaiWShoulder)" stroke="#c8a840" stroke-width="1"/>
      <line x1="18" y1="134" x2="34" y2="134" stroke="#c8a840" stroke-width="1.5" opacity="0.7"/>

      <!-- 領口 -->
      <path d="M-14,134 L-6,150 L4,134" fill="none" stroke="#6a4828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 翡翠腰帶 -->
      <path d="M-30,182 Q-2,191 28,182" fill="none" stroke="#4a2a18" stroke-width="7" stroke-linecap="round"/>
      <rect x="-10" y="179" width="14" height="12" rx="2" fill="#4a8848" stroke="#c8a840" stroke-width="1"/>

      <!-- ===== 畫面左側手臂（空拳，按住腹部傷口） ===== -->
      <path d="M-28,146 Q-42,158 -30,176" fill="none" stroke="url(#laoaiWArmor)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-30" cy="178" r="7" fill="url(#laoaiWFace)" opacity="0.85"/>

      <!-- ===== 大頭（低頭、微喘） ===== -->
      <!-- 頭盔底座 -->
      <ellipse cx="0" cy="92" rx="42" ry="44" fill="url(#laoaiWHelmet)"/>

      <!-- 臉（微低頭） -->
      <path d="M-32,86 C-36,98 -34,118 -28,128 C-22,136 -8,142 4,140 C14,138 24,130 28,118 C32,106 30,92 24,84 C18,78 6,74 -4,76 C-16,78 -30,82 -32,86Z" fill="url(#laoaiWFace)"/>

      <!-- 腮紅（傷痛泛紅） -->
      <ellipse cx="-22" cy="124" rx="7" ry="4" fill="#e0a0a0" opacity="0.35"/>

      <!-- 鳳翼頭盔造型 -->
      <path d="M-34,80 C-28,60 -6,50 14,54 C30,58 38,72 34,84 C30,76 18,68 8,66 C-2,64 -14,66 -24,74" fill="url(#laoaiWHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M-34,84 C-24,78 -8,74 14,76 C28,78 36,82 34,86" fill="none" stroke="#c8a840" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 鳳翼左翼 -->
      <path d="M-30,76 C-40,62 -46,52 -42,46 C-38,42 -34,48 -30,60" fill="url(#laoaiWHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M-42,46 C-48,40 -44,36 -38,42" fill="none" stroke="#c8a840" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 鳳翼右翼 -->
      <path d="M28,76 C36,62 42,52 38,46 C34,42 30,48 28,60" fill="url(#laoaiWHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M38,46 C44,40 40,36 34,42" fill="none" stroke="#c8a840" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 頭盔頂飾 -->
      <path d="M-4,58 L0,42 L4,58" fill="url(#laoaiWGold)" stroke="#c8a840" stroke-width="0.8"/>

      <!-- 耳朵 -->
      <path d="M22,104 C26,100 28,106 26,114 C24,118 22,116 22,110" fill="url(#laoaiWFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（左眼半瞇忍痛、右眼微睜） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-12" cy="110" rx="5.5" ry="3" fill="#fff"/>
      <ellipse cx="-13" cy="111" rx="3.5" ry="2.2" fill="#3a1810"/>
      <ellipse cx="-13.5" cy="110" rx="2" ry="1.5" fill="#1a0800"/>
      <circle cx="-15" cy="109" r="0.8" fill="#fff" opacity="0.6"/>

      <!-- 右眼（微瞇但還睜著） -->
      <ellipse cx="6" cy="110" rx="5.5" ry="4" fill="#fff"/>
      <ellipse cx="5" cy="111" rx="3.5" ry="3" fill="#3a1810"/>
      <ellipse cx="4.5" cy="110" rx="2" ry="2" fill="#1a0800"/>
      <circle cx="3" cy="108.5" r="1" fill="#fff" opacity="0.6"/>

      <!-- 粗眉毛（皺眉忍痛） -->
      <path d="M-18,102 C-14,99 -10,100 -7,103" fill="none" stroke="#2a1808" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M10,103 C12,100 16,99 20,102" fill="none" stroke="#2a1808" stroke-width="3.5" stroke-linecap="round"/>

      <!-- 眉間皺紋 -->
      <path d="M-5,104 C-4,102 -2,102 -1,104" fill="none" stroke="#a08058" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 鼻子 -->
      <path d="M-18,118 C-20,124 -16,128" fill="none" stroke="#a08058" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-14,134 C-8,132 -2,132 6,135" fill="none" stroke="#805040" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-14,134 C-15,136 -16,137" fill="none" stroke="#805040" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴 -->
      <path d="M-26,96 C-27,100 -26,104 -25,106" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-25" cy="107" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>

      <!-- ===== 畫面右側手臂（持刀手，刀下垂） ===== -->
      <path d="M28,144 Q46,152 54,170" fill="none" stroke="url(#laoaiWArmor)" stroke-width="15" stroke-linecap="round"/>

      <!-- ===== 斬馬大刀（下垂無力） ===== -->
      <!-- 握刀的手 -->
      <circle cx="55" cy="172" r="7" fill="url(#laoaiWFace)"/>
      <!-- 刀身（下垂） -->
      <path d="M58,178 L68,220 L72,228 L80,222 Q70,198 62,176 Z" fill="url(#laoaiWBlade)" stroke="#666" stroke-width="0.5"/>
      <!-- 刀背線 -->
      <line x1="58" y1="178" x2="68" y2="220" stroke="#888" stroke-width="2.8" stroke-linecap="round"/>
      <!-- 刀護手 -->
      <line x1="50" y1="174" x2="62" y2="176" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
      <!-- 刀柄 -->
      <line x1="54" y1="172" x2="52" y2="164" stroke="#5a3a20" stroke-width="6" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="51" cy="161" r="4" fill="#c8a840"/>
    </g>
  </g>
</svg>