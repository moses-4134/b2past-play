<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 李牧 — 吉卜力2頭身 面朝右（敵方）受擊 -->
  <defs>
    <radialGradient id="limuFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c4a0"/>
      <stop offset="100%" stop-color="#cca880"/>
    </radialGradient>
    <linearGradient id="limuArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a2838"/>
      <stop offset="100%" stop-color="#2a1828"/>
    </linearGradient>
    <linearGradient id="limuPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2028"/>
      <stop offset="100%" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="limuHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#484848"/>
      <stop offset="100%" stop-color="#303030"/>
    </linearGradient>
    <linearGradient id="limuSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="2" cy="222" rx="29" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（後退半步） ===== -->
      <ellipse cx="14" cy="199" rx="10" ry="17" fill="url(#limuPants)" transform="rotate(3,14,199)"/>
      <ellipse cx="14" cy="215" rx="11" ry="7" fill="#2a1818"/>
      <ellipse cx="-10" cy="197" rx="10" ry="17" fill="url(#limuPants)" transform="rotate(-3,-10,197)"/>
      <ellipse cx="-10" cy="215" rx="11" ry="7" fill="#2a1818"/>

      <!-- ===== 身體（微後仰） ===== -->
      <ellipse cx="2" cy="159" rx="27" ry="29" fill="url(#limuArmor)" transform="rotate(5,2,159)"/>

      <!-- 精良護肩 -->
      <rect x="-26" y="135" width="10" height="8" rx="2" fill="#3a2838" stroke="#8a7840" stroke-width="1"/>
      <rect x="22" y="135" width="10" height="8" rx="2" fill="#3a2838" stroke="#8a7840" stroke-width="1"/>

      <!-- 領口 -->
      <path d="M-8,137 L-2,151 L6,137" fill="none" stroke="#5a3848" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-23,179 Q2,187 27,179" fill="none" stroke="#3a2030" stroke-width="6" stroke-linecap="round"/>
      <rect x="-4" y="177" width="8" height="8" rx="1" fill="#8a7840" stroke="#6a5830" stroke-width="0.5"/>

      <!-- ===== 角色左手（正x） ===== -->
      <path d="M24,143 Q40,147 42,161" fill="none" stroke="url(#limuArmor)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
      <circle cx="42" cy="163" r="5.5" fill="url(#limuFace)" opacity="0.85"/>

      <!-- ===== 角色右手（負x） ===== -->
      <path d="M-22,145 Q-38,139 -46,137" fill="none" stroke="url(#limuArmor)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="-46" cy="139" r="5.5" fill="url(#limuFace)"/>

      <!-- ===== 槍（略歪斜，受擊偏移） ===== -->
      <line x1="-58" y1="105" x2="42" y2="163" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
      <path d="M-70.1,98.0 L-56.0,101.5 L-60.0,108.5 Z" fill="url(#limuSteel)" stroke="#888" stroke-width="0.5"/>
      <line x1="-55.4" y1="106.5" x2="-52.4" y2="101.3" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-58" y1="105" x2="-55" y2="99.8" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-60.6" y1="103.5" x2="-57.6" y2="98.3" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>

      <!-- ===== 大頭（微後仰） ===== -->
      <ellipse cx="4" cy="96" rx="40" ry="42" fill="url(#limuHair)"/>

      <!-- 臉 -->
      <path d="M-24,88 C-28,100 -26,116 -20,126 C-14,134 -2,138 8,136 C18,134 28,128 32,118 C36,106 34,92 28,84 C22,78 10,74 0,76 C-12,78 -22,82 -24,88Z" fill="url(#limuFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,78 C-12,60 4,52 18,56 C30,60 36,72 32,82 C28,76 20,70 12,68 C4,66 -6,68 -12,74" fill="url(#limuHair)"/>

      <!-- 短瀏海 -->
      <path d="M-22,88 C-26,78 -28,82 -28,88 C-26,92 -22,92 -22,90" fill="url(#limuHair)"/>
      <path d="M-18,82 C-20,74 -24,76 -24,84 C-22,88 -18,88 -18,86" fill="#303030"/>

      <!-- 將軍冠 -->
      <path d="M-20,76 C-12,68 6,64 24,68 C32,70 36,74 34,78" fill="none" stroke="#8a7840" stroke-width="4" stroke-linecap="round"/>
      <path d="M-2,66 C0,58 6,56 12,58 C14,60 14,64 12,66" fill="#8a7840" stroke="#6a5830" stroke-width="0.5"/>

      <!-- 側髮 -->
      <path d="M28,84 C32,80 34,86 32,92 C30,96 28,94 28,90" fill="url(#limuHair)"/>

      <!-- 耳朵 -->
      <path d="M26,102 C30,98 32,104 30,110 C28,114 26,112 26,108" fill="url(#limuFace)" stroke="#c0a070" stroke-width="0.5"/>

      <!-- ===== 眼睛（瞇眼忍痛） ===== -->
      <ellipse cx="-6" cy="108" rx="7" ry="2.5" fill="#fff"/>
      <ellipse cx="-7" cy="108.5" rx="4.5" ry="2" fill="#1a2018"/>
      <ellipse cx="-7.5" cy="108" rx="2.8" ry="1.5" fill="#0a1008"/>

      <ellipse cx="10" cy="108" rx="7" ry="2.5" fill="#fff"/>
      <ellipse cx="9" cy="108.5" rx="4.5" ry="2" fill="#1a2018"/>
      <ellipse cx="8.5" cy="108" rx="2.8" ry="1.5" fill="#0a1008"/>

      <!-- 眉毛（皺起） -->
      <path d="M-12,100 C-8,97 -4,99 0,101" fill="none" stroke="#303030" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M14,101 C18,99 22,97 26,100" fill="none" stroke="#303030" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-12,116 C-13,120 -11,124" fill="none" stroke="#b89870" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 八字鬍 -->
      <path d="M-10,128 C-8,130 -4,131 -2,130" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M2,128 C4,130 8,131 10,130" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙） -->
      <path d="M-8,131 C-4,131 2,131 6,131" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>
      <path d="M-6,131 L-6,133" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
      <path d="M-2,131 L-2,133" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
      <path d="M2,131 L2,133" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
    </g>
  </g>
</svg>
