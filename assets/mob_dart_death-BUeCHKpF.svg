<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 黑市暗器手 — 吉卜力2頭身 面朝右（敵方）倒地/戰敗 -->
  <defs>
    <radialGradient id="mobDartFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c4a470"/>
    </radialGradient>
    <linearGradient id="mobDartCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a3430"/>
      <stop offset="100%" stop-color="#2a2420"/>
    </linearGradient>
    <linearGradient id="mobDartPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3430"/>
      <stop offset="100%" stop-color="#221e1a"/>
    </linearGradient>
    <linearGradient id="mobDartHeadwrap" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1610"/>
    </linearGradient>
    <linearGradient id="mobDartBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0c8d0"/>
      <stop offset="100%" stop-color="#808890"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(78, 10)">
      <!-- 陰影（倒地拉長） -->
      <ellipse cx="-4" cy="228" rx="34" ry="4" fill="#000" opacity="0.08"/>

      <g transform="rotate(90, -4, 176)">
        <!-- ===== 腿（放鬆垂落） ===== -->
        <!-- 後腿 -->
        <ellipse cx="8" cy="172" rx="8" ry="13" fill="url(#mobDartPants)"/>
        <ellipse cx="6" cy="185" rx="9" ry="5" fill="#221e1a"/>
        <!-- 前腿 -->
        <ellipse cx="-10" cy="173" rx="8" ry="14" fill="url(#mobDartPants)"/>
        <ellipse cx="-12" cy="185" rx="9" ry="5" fill="#221e1a"/>

        <!-- ===== 身體（放鬆） ===== -->
        <ellipse cx="-2" cy="144" rx="20" ry="22" fill="url(#mobDartCloth)"/>

        <!-- 領口 -->
        <path d="M-8,128 L-2,138 L4,128" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- 腰帶 -->
        <path d="M-18,158 Q-2,164 16,158" fill="none" stroke="#1a1610" stroke-width="4" stroke-linecap="round"/>
        <rect x="-3" y="156" width="4" height="4" rx="1" fill="#2a2420" stroke="#1a1610" stroke-width="0.5"/>

        <!-- ===== 畫面右側手臂（自然垂落） ===== -->
        <path d="M14,132 Q24,142 20,156" fill="none" stroke="url(#mobDartCloth)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
        <circle cx="20" cy="158" r="4" fill="url(#mobDartFace)" opacity="0.85"/>

        <!-- ===== 畫面左側手臂（自然垂落） ===== -->
        <path d="M-18,132 Q-28,140 -32,150" fill="none" stroke="url(#mobDartCloth)" stroke-width="8" stroke-linecap="round"/>
        <circle cx="-32" cy="152" r="4" fill="url(#mobDartFace)"/>

        <!-- ===== 飛刀（脫手散落） ===== -->
        <line x1="-56" y1="188" x2="-42" y2="194" stroke="url(#mobDartBlade)" stroke-width="2" stroke-linecap="round"/>
        <line x1="-50" y1="196" x2="-36" y2="200" stroke="url(#mobDartBlade)" stroke-width="2" stroke-linecap="round"/>
        <line x1="-60" y1="180" x2="-48" y2="186" stroke="url(#mobDartBlade)" stroke-width="2" stroke-linecap="round"/>

        <!-- ===== 大頭 ===== -->
        <ellipse cx="0" cy="102" rx="32" ry="34" fill="url(#mobDartHeadwrap)"/>

        <!-- 臉 -->
        <path d="M-20,92 C-24,98 -22,112 -16,120 C-12,126 -4,130 2,128 C8,126 14,120 16,112 C20,102 18,92 14,86 C8,80 2,78 -2,80 C-12,82 -18,86 -20,92Z" fill="url(#mobDartFace)"/>

        <!-- 包頭巾頂部 -->
        <path d="M-14,82 C-10,64 2,58 12,62 C22,66 26,78 22,88 C18,80 10,72 4,70 C0,68 -8,70 -12,76" fill="url(#mobDartHeadwrap)"/>

        <!-- 頭巾側面 -->
        <path d="M14,86 C20,82 22,88 20,96 C18,100 16,98 16,94" fill="url(#mobDartHeadwrap)"/>
        <path d="M-20,88 C-26,84 -28,90 -26,98 C-24,102 -22,100 -22,96" fill="url(#mobDartHeadwrap)"/>

        <!-- 頭巾尾巴 -->
        <path d="M16,94 C22,98 26,106 24,114" fill="none" stroke="url(#mobDartHeadwrap)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

        <!-- 耳朵 -->
        <path d="M14,104 C18,100 20,106 18,112 C16,116 14,114 14,110" fill="url(#mobDartFace)" stroke="#b09870" stroke-width="0.5"/>

        <!-- ===== 眼睛（閉眼橫線） ===== -->
        <line x1="-12" y1="108" x2="-4" y2="108" stroke="#2a2020" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="0" y1="108" x2="8" y2="108" stroke="#2a2020" stroke-width="1.5" stroke-linecap="round"/>

        <!-- 眉毛（放鬆） -->
        <path d="M-12,104 C-10,102 -6,103 -4,105" fill="none" stroke="#1a1610" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
        <path d="M6,105 C8,103 12,102 14,104" fill="none" stroke="#1a1610" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

        <!-- 鼻子 -->
        <path d="M-10,114 C-12,118 -8,120" fill="none" stroke="#b09870" stroke-width="1" stroke-linecap="round"/>

        <!-- 嘴（微張） -->
        <path d="M-5,124 C-2,126 1,124" fill="none" stroke="#a08860" stroke-width="1" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
