<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 腐吏惡卒 — 防禦（蹲低，槍橫擋） -->
  <defs>
    <radialGradient id="mobSoldierFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c0a470"/>
    </radialGradient>
    <linearGradient id="mobSoldierCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a5048"/>
      <stop offset="100%" stop-color="#3a3830"/>
    </linearGradient>
    <linearGradient id="mobSoldierPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3830"/>
      <stop offset="100%" stop-color="#2a2820"/>
    </linearGradient>
    <linearGradient id="mobSoldierHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobSoldierSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <linearGradient id="mobSoldierShield" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b88830"/>
      <stop offset="100%" stop-color="#785018"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="201" rx="24" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（蹲低） ===== -->
      <!-- 後腿 -->
      <ellipse cx="10" cy="185" rx="9" ry="12" fill="url(#mobSoldierPants)" transform="rotate(-5,10,185)"/>
      <ellipse cx="8" cy="195" rx="10" ry="6" fill="#2a2418"/>
      <!-- 前腿 -->
      <ellipse cx="-10" cy="183" rx="10" ry="13" fill="url(#mobSoldierPants)" transform="rotate(8,-10,183)"/>
      <ellipse cx="-14" cy="195" rx="10" ry="6" fill="#2a2418"/>

      <!-- ===== 身體（蹲縮） ===== -->
      <ellipse cx="-2" cy="156" rx="23" ry="25" fill="url(#mobSoldierCloth)" transform="rotate(5,-2,156)"/>

      <!-- 破舊軍服裂痕 -->
      <path d="M-8,146 L-5,156" fill="none" stroke="#2a2820" stroke-width="0.8" opacity="0.4"/>
      <path d="M6,150 L9,158" fill="none" stroke="#2a2820" stroke-width="0.7" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-10,140 L-4,148 L4,140" fill="none" stroke="#4a4838" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-21,176 Q-2,182 19,176" fill="none" stroke="#3a3020" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 右手臂（角色左手，持盾前擋） ===== -->
      <path d="M16,146 Q26,154 28,160" fill="none" stroke="url(#mobSoldierCloth)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <!-- 盾牌（前方擋住） -->
      <ellipse cx="32" cy="158" rx="14" ry="16" fill="url(#mobSoldierShield)" stroke="#3a2818" stroke-width="1"/>
      <line x1="32" y1="142" x2="32" y2="174" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <line x1="20" y1="158" x2="44" y2="158" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <circle cx="32" cy="158" r="3.5" fill="#806040" opacity="0.4"/>
      
      <!-- ===== 左手臂（角色右手，持槍前段擋前） ===== -->
      <path d="M-18,144 Q-34,136 -42,130" fill="none" stroke="url(#mobSoldierCloth)" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== 槍（直立擋在身前） ===== -->
      <!-- 槍桿 -->
      <line x1="-42" y1="68" x2="-38" y2="138" stroke="#5a4028" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 槍頭 -->
      <path d="M-43.6,58 L-40.8,68.4 L-46.4,67.6 Z" fill="url(#mobSoldierSteel)" stroke="#888" stroke-width="0.5"/>
      <!-- 握槍的手 -->
      <circle cx="-40" cy="130" r="5" fill="url(#mobSoldierFace)"/>

      <!-- ===== 大頭（縮頭） ===== -->
      <ellipse cx="0" cy="110" rx="34" ry="36" fill="url(#mobSoldierHair)"/>

      <!-- 臉 -->
      <path d="M-22,100 C-26,110 -24,122 -18,132 C-12,140 -4,144 4,142 C10,140 14,134 18,124 C22,112 20,100 14,92 C8,86 2,84 -4,86 C-12,88 -20,94 -22,100Z" fill="url(#mobSoldierFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,90 C-12,72 4,64 16,68 C24,72 28,84 24,94 C20,86 14,80 6,78 C0,76 -8,78 -14,84" fill="url(#mobSoldierHair)"/>

      <!-- 布帽 -->
      <path d="M-26,90 C-22,80 -8,74 8,76 C18,78 26,84 24,90" fill="#4a4038" stroke="#3a3028" stroke-width="0.5"/>
      <path d="M-28,90 C-28,88 -26,86 -22,88 L26,88 C28,88 28,92 26,92 L-26,92 C-28,92 -28,90 -28,90Z" fill="#4a4038" stroke="#3a3028" stroke-width="0.5"/>

      <!-- 瀏海 -->
      <path d="M-22,96 C-26,88 -28,92 -28,100 C-26,104 -22,102 -22,98" fill="url(#mobSoldierHair)"/>

      <!-- 側髮 -->
      <path d="M18,98 C24,92 26,100 24,108 C22,112 18,110 18,106" fill="url(#mobSoldierHair)"/>

      <!-- 耳朵 -->
      <path d="M16,114 C20,110 22,116 20,122 C18,126 16,124 16,120" fill="url(#mobSoldierFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（害怕瞇眼） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-10" cy="118" rx="6" ry="4" fill="#fff"/>
      <ellipse cx="-11" cy="118" rx="3.5" ry="3" fill="#383830"/>
      <ellipse cx="-11.5" cy="118" rx="2" ry="1.8" fill="#1a1810"/>
      <circle cx="-13" cy="117" r="0.8" fill="#fff" opacity="0.45"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="118" rx="6" ry="4" fill="#fff"/>
      <ellipse cx="5" cy="118" rx="3.5" ry="3" fill="#383830"/>
      <ellipse cx="4.5" cy="118" rx="2" ry="1.8" fill="#1a1810"/>
      <circle cx="3" cy="117" r="0.8" fill="#fff" opacity="0.45"/>

      <!-- 眉毛（驚恐上揚） -->
      <path d="M-14,111 C-10,109 -8,111 -6,113" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,113 C10,111 12,109 16,111" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,126 C-16,130 -12,134" fill="none" stroke="#a08858" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（緊抿怕打） -->
      <path d="M-8,138 C-4,140 2,140 6,138" fill="none" stroke="#704840" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>