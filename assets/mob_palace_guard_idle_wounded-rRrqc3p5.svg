<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 宮廷侍衛 — 受傷待機（HP 30~60%：身體微傾、單手按腹、眼半瞇、槍下垂） -->
  <defs>
    <radialGradient id="mobPalaceGuardWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </radialGradient>
    <linearGradient id="mobPalaceGuardWArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a5a30"/>
      <stop offset="100%" stop-color="#4a3a20"/>
    </linearGradient>
    <linearGradient id="mobPalaceGuardWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a20"/>
      <stop offset="100%" stop-color="#2e2414"/>
    </linearGradient>
    <linearGradient id="mobPalaceGuardWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="mobPalaceGuardWShield" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b88830"/>
      <stop offset="100%" stop-color="#785018"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="202" rx="30" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前腿微彎） ===== -->
      <ellipse cx="10" cy="182" rx="11" ry="17" fill="url(#mobPalaceGuardWPants)" transform="rotate(-3,10,182)"/>
      <ellipse cx="8" cy="195" rx="12" ry="7" fill="#2e2010"/>
      <ellipse cx="-12" cy="180" rx="12" ry="18" fill="url(#mobPalaceGuardWPants)" transform="rotate(8,-12,180)"/>
      <ellipse cx="-15" cy="195" rx="13" ry="7" fill="#2e2010"/>

      <!-- ===== 身體（前傾） ===== -->
      <ellipse cx="-2" cy="148" rx="25" ry="27" fill="url(#mobPalaceGuardWArmor)" transform="rotate(-8,-2,148)"/>

      <!-- 甲片紋路 -->
      <path d="M-10,148 L-8,160" fill="none" stroke="#3a2a14" stroke-width="0.8" opacity="0.4"/>
      <path d="M6,150 L8,162" fill="none" stroke="#3a2a14" stroke-width="0.7" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-12,138 L-4,150 L4,138" fill="none" stroke="#7a6a38" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-24,180 Q-2,187 24,180" fill="none" stroke="#4a3a20" stroke-width="5" stroke-linecap="round"/>
      <rect x="-7" y="178" width="8" height="8" rx="1" fill="#a08830" stroke="#806820" stroke-width="0.5"/>

      <!-- ===== 畫面左側手臂（角色左手，持盾下垂） ===== -->
      <path d="M-22,146 Q-36,156 -32,168" fill="none" stroke="url(#mobPalaceGuardWArmor)" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-32" cy="168" r="5" fill="url(#mobPalaceGuardWFace)" opacity="0.85"/>
      <!-- 盾牌（下垂） -->
      <ellipse cx="-36" cy="168" rx="14" ry="16" fill="url(#mobPalaceGuardWShield)" stroke="#3a2818" stroke-width="1"/>
      <line x1="-36" y1="152" x2="-36" y2="184" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <line x1="-48" y1="168" x2="-24" y2="168" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <circle cx="-36" cy="168" r="3.5" fill="#806040" opacity="0.4"/>

      <!-- ===== 大頭（低頭） ===== -->
      <ellipse cx="0" cy="98" rx="35" ry="37" fill="url(#mobPalaceGuardWHair)"/>

      <!-- 臉 -->
      <path d="M-24,90 C-28,100 -26,114 -20,124 C-14,132 -4,136 4,134 C12,132 18,124 22,114 C26,102 24,90 18,82 C12,76 4,74 -2,76 C-12,78 -22,84 -24,90Z" fill="url(#mobPalaceGuardWFace)"/>

      <!-- 腮紅（傷痛） -->
      <ellipse cx="-18" cy="122" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,80 C-12,62 4,54 16,58 C24,64 28,74 24,84 C20,76 14,70 6,68 C0,66 -8,68 -14,74" fill="url(#mobPalaceGuardWHair)"/>

      <!-- 瀏海 -->
      <path d="M-24,90 C-28,78 -30,82 -30,92 C-28,96 -24,96 -24,92" fill="url(#mobPalaceGuardWHair)"/>
      <path d="M-20,84 C-24,72 -26,76 -26,86 C-24,90 -20,90 -20,86" fill="#2a1a10"/>

      <!-- 宮廷衛兵冠（金色，微歪） -->
      <path d="M-22,74 Q0,60 22,74 Q20,68 0,56 Q-20,68 -22,74Z" fill="#a08830" stroke="#806820" stroke-width="0.8" transform="rotate(-3,0,66)"/>
      <circle cx="0" cy="58" r="3" fill="#c0a040" stroke="#a08830" stroke-width="0.5"/>

      <!-- 側髮 -->
      <path d="M18,86 C24,80 26,88 24,96 C22,100 18,98 18,94" fill="url(#mobPalaceGuardWHair)"/>

      <!-- 耳朵 -->
      <path d="M16,102 C20,98 22,104 20,110 C18,114 16,112 16,108" fill="url(#mobPalaceGuardWFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（左眼半瞇、右眼微睜） ===== -->
      <ellipse cx="-10" cy="108" rx="6.5" ry="4" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="4" ry="3" fill="#2a2418"/>
      <ellipse cx="-11.5" cy="108" rx="2.2" ry="1.8" fill="#141208"/>
      <circle cx="-13" cy="107" r="0.8" fill="#fff" opacity="0.5"/>

      <ellipse cx="6" cy="108" rx="6.5" ry="5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="4" ry="3.8" fill="#2a2418"/>
      <ellipse cx="4.5" cy="108" rx="2.2" ry="2.2" fill="#141208"/>
      <circle cx="3" cy="107" r="1" fill="#fff" opacity="0.6"/>

      <!-- 眉間皺紋 -->
      <path d="M-3,101 C-1,99 1,99 3,101" fill="none" stroke="#b09060" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 眉毛 -->
      <path d="M-14,101 C-10,99 -8,101 -6,103" fill="none" stroke="#2a1a10" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,103 C10,101 12,99 16,101" fill="none" stroke="#2a1a10" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-10,128 C-6,129 0,129 4,128" fill="none" stroke="#704840" stroke-width="2" stroke-linecap="round"/>
      <path d="M-10,128 C-11,130 -12,131" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- ===== 畫面右側手臂（角色右手，按住腹部） ===== -->
      <path d="M22,146 Q28,160 12,170" fill="none" stroke="url(#mobPalaceGuardWArmor)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="12" cy="172" r="5.5" fill="url(#mobPalaceGuardWFace)" opacity="0.85"/>

      <!-- ===== 槍（下垂無力，靠在身後） ===== -->
      <line x1="36" y1="62" x2="40" y2="194" stroke="#5a4028" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <polygon points="39,50 33,50 36,36" fill="#aaa" stroke="#888" stroke-width="0.5" opacity="0.7"/>

      <!-- 汗滴 -->
      <path d="M-22,88 C-23,92 -22,96 -21,98" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-21" cy="99" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
    </g>
  </g>
</svg>