<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 邯鄲夜景 — 吉卜力風格：夜空星月、城牆剪影、燈火閃爍 地平線 y=180（33%） -->
  <defs>
    <!-- 夜空 -->
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="40%" stop-color="#1a2a48"/>
      <stop offset="100%" stop-color="#2a3a58"/>
    </linearGradient>
    <!-- 地面（夜色石板） -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a40"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <!-- 月光 -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fff8e0" stop-opacity="0"/>
    </radialGradient>
    <!-- 燈光 -->
    <radialGradient id="lampLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa40" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffaa40" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== 夜空 ===== -->
  <rect width="960" height="540" fill="url(#nightSky)"/>

  <!-- ===== 月亮 ===== -->
  <circle cx="780" cy="70" r="35" fill="#ffe8b0" opacity="0.9"/>
  <circle cx="792" cy="65" r="30" fill="url(#nightSky)" opacity="0.7"/>
  <circle cx="780" cy="70" r="80" fill="url(#moonGlow)"/>

  <!-- ===== 星星 ===== -->
  <circle cx="100" cy="30" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="200" cy="55" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="320" cy="20" r="1.2" fill="#fff" opacity="0.6"/>
  <circle cx="450" cy="45" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="550" cy="25" r="1.5" fill="#fff" opacity="0.65"/>
  <circle cx="650" cy="50" r="1" fill="#fff" opacity="0.45"/>
  <circle cx="880" cy="35" r="1.2" fill="#fff" opacity="0.55"/>
  <circle cx="50" cy="70" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="350" cy="70" r="1" fill="#fff" opacity="0.45"/>
  <circle cx="500" cy="65" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="920" cy="60" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="150" cy="95" r="0.8" fill="#fff" opacity="0.35"/>
  <circle cx="420" cy="85" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="700" cy="30" r="1.3" fill="#fff" opacity="0.5"/>

  <!-- ===== 遠處城牆剪影 ===== -->
  <path d="M0,95 L0,130 L100,130 L100,120 L120,120 L120,130 L250,130 L250,115 L270,115 L270,130 L400,130 L400,120 L420,120 L420,130 L500,130 L500,105 Q520,90 540,105 L540,130 L700,130 L700,115 L720,115 L720,130 L800,130 L800,120 L820,120 L820,130 L960,130 L960,95 Q880,75 800,90 Q700,65 600,85 Q500,60 400,80 Q300,55 200,75 Q100,60 0,95 Z" fill="#1a2038" opacity="0.8"/>
  <!-- 城垛 -->
  <rect x="100" y="110" width="12" height="10" fill="#1a2038" opacity="0.7"/>
  <rect x="130" y="110" width="12" height="10" fill="#1a2038" opacity="0.7"/>
  <rect x="250" y="105" width="12" height="10" fill="#1a2038" opacity="0.7"/>
  <rect x="500" y="95" width="14" height="10" fill="#1a2038" opacity="0.7"/>
  <rect x="530" y="95" width="14" height="10" fill="#1a2038" opacity="0.7"/>

  <!-- 城門塔 -->
  <rect x="490" y="75" width="60" height="55" fill="#1a2038" opacity="0.85"/>
  <polygon points="485,75 520,50 555,75" fill="#1a2038" opacity="0.85"/>

  <!-- ===== 近景建築（帶燈光的街道） ===== -->
  <!-- 左側建築 -->
  <rect x="0" y="95" width="150" height="85" fill="#1a1a28" opacity="0.8"/>
  <polygon points="0,95 75,65 150,95" fill="#181828" opacity="0.8"/>
  <!-- 窗戶（亮的） -->
  <rect x="20" y="120" width="22" height="25" fill="#ffaa40" opacity="0.5" rx="1"/>
  <rect x="60" y="120" width="22" height="25" fill="#ffaa40" opacity="0.4" rx="1"/>
  <rect x="100" y="123" width="20" height="22" fill="#ffaa40" opacity="0.35" rx="1"/>

  <!-- 右側建築 -->
  <rect x="810" y="90" width="150" height="90" fill="#1a1a28" opacity="0.8"/>
  <polygon points="810,90 885,63 960,90" fill="#181828" opacity="0.8"/>
  <rect x="835" y="115" width="22" height="25" fill="#ffaa40" opacity="0.45" rx="1"/>
  <rect x="880" y="118" width="20" height="22" fill="#ffaa40" opacity="0.4" rx="1"/>
  <rect x="920" y="115" width="22" height="25" fill="#ffaa40" opacity="0.35" rx="1"/>

  <!-- 中間建築 -->
  <rect x="200" y="110" width="120" height="70" fill="#1a1a28" opacity="0.7"/>
  <polygon points="200,110 260,85 320,110" fill="#181828" opacity="0.7"/>
  <rect x="220" y="130" width="18" height="20" fill="#ffaa40" opacity="0.4" rx="1"/>
  <rect x="260" y="130" width="18" height="20" fill="#ffaa40" opacity="0.35" rx="1"/>

  <rect x="650" y="105" width="110" height="75" fill="#1a1a28" opacity="0.7"/>
  <polygon points="650,105 705,80 760,105" fill="#181828" opacity="0.7"/>
  <rect x="670" y="125" width="18" height="22" fill="#ffaa40" opacity="0.4" rx="1"/>
  <rect x="710" y="127" width="18" height="20" fill="#ffaa40" opacity="0.35" rx="1"/>

  <!-- ===== 街道燈籠 ===== -->
  <!-- 左燈籠 -->
  <line x1="170" y1="115" x2="170" y2="145" stroke="#4a3a28" stroke-width="2"/>
  <ellipse cx="170" cy="155" rx="8" ry="12" fill="#e04030" opacity="0.7"/>
  <ellipse cx="170" cy="155" rx="5" ry="8" fill="#ff6050" opacity="0.5"/>
  <circle cx="170" cy="155" r="30" fill="url(#lampLight)"/>
  <!-- 右燈籠 -->
  <line x1="790" y1="110" x2="790" y2="140" stroke="#4a3a28" stroke-width="2"/>
  <ellipse cx="790" cy="150" rx="8" ry="12" fill="#e04030" opacity="0.7"/>
  <ellipse cx="790" cy="150" rx="5" ry="8" fill="#ff6050" opacity="0.5"/>
  <circle cx="790" cy="150" r="30" fill="url(#lampLight)"/>
  <!-- 中央燈籠 -->
  <line x1="480" y1="100" x2="480" y2="130" stroke="#4a3a28" stroke-width="2"/>
  <ellipse cx="480" cy="140" rx="9" ry="13" fill="#e04030" opacity="0.65"/>
  <ellipse cx="480" cy="140" rx="5" ry="9" fill="#ff6050" opacity="0.45"/>
  <circle cx="480" cy="140" r="35" fill="url(#lampLight)"/>

  <!-- ===== 地面（y=180 開始，佔下方 2/3） ===== -->
  <rect x="0" y="180" width="960" height="360" fill="url(#ground)"/>

  <!-- 石板紋理 -->
  <line x1="0" y1="215" x2="960" y2="215" stroke="#4a4a50" stroke-width="0.8" opacity="0.2"/>
  <line x1="0" y1="255" x2="960" y2="255" stroke="#4a4a50" stroke-width="0.8" opacity="0.18"/>
  <line x1="0" y1="295" x2="960" y2="295" stroke="#4a4a50" stroke-width="0.6" opacity="0.15"/>
  <line x1="0" y1="335" x2="960" y2="335" stroke="#4a4a50" stroke-width="0.6" opacity="0.12"/>
  <line x1="0" y1="375" x2="960" y2="375" stroke="#4a4a50" stroke-width="0.5" opacity="0.1"/>
  <line x1="120" y1="180" x2="120" y2="540" stroke="#4a4a50" stroke-width="0.4" opacity="0.1"/>
  <line x1="280" y1="180" x2="280" y2="540" stroke="#4a4a50" stroke-width="0.4" opacity="0.1"/>
  <line x1="440" y1="180" x2="440" y2="540" stroke="#4a4a50" stroke-width="0.4" opacity="0.1"/>
  <line x1="600" y1="180" x2="600" y2="540" stroke="#4a4a50" stroke-width="0.4" opacity="0.1"/>
  <line x1="760" y1="180" x2="760" y2="540" stroke="#4a4a50" stroke-width="0.4" opacity="0.1"/>
  <line x1="900" y1="180" x2="900" y2="540" stroke="#4a4a50" stroke-width="0.4" opacity="0.1"/>

  <!-- 地面交界 -->
  <line x1="0" y1="180" x2="960" y2="180" stroke="#2a2a30" stroke-width="2.5"/>

  <!-- ===== 地面燈光反射 ===== -->
  <ellipse cx="170" cy="195" rx="40" ry="8" fill="#ffaa40" opacity="0.08"/>
  <ellipse cx="480" cy="195" rx="45" ry="10" fill="#ffaa40" opacity="0.08"/>
  <ellipse cx="790" cy="195" rx="40" ry="8" fill="#ffaa40" opacity="0.07"/>

  <!-- ===== 空氣粒子（螢火蟲/夜塵） ===== -->
  <circle cx="120" cy="95" r="1.5" fill="#ffcc60" opacity="0.4"/>
  <circle cx="300" cy="115" r="1" fill="#ffcc60" opacity="0.3"/>
  <circle cx="450" cy="75" r="1.2" fill="#ffcc60" opacity="0.35"/>
  <circle cx="600" cy="105" r="1.5" fill="#ffcc60" opacity="0.3"/>
  <circle cx="720" cy="85" r="1" fill="#ffcc60" opacity="0.35"/>
  <circle cx="850" cy="125" r="1.2" fill="#ffcc60" opacity="0.3"/>
  <circle cx="50" cy="135" r="0.8" fill="#ffcc60" opacity="0.25"/>
  <circle cx="380" cy="155" r="1" fill="#ffcc60" opacity="0.25"/>
  <circle cx="550" cy="165" r="1.3" fill="#ffcc60" opacity="0.2"/>
  <circle cx="900" cy="155" r="0.8" fill="#ffcc60" opacity="0.25"/>

  <!-- ===== 整體氛圍覆蓋（深藍） ===== -->
  <rect width="960" height="540" fill="#1020a0" opacity="0.04"/>
</svg>