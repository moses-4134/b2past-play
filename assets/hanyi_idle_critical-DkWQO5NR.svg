<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 韓奕 — 吉卜力2頭身 面朝右（敵方）瀕死待機（HP <30%：半跪、撐劍、喘息） -->
  <defs>
    <radialGradient id="hanyiCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8dcd0"/>
      <stop offset="100%" stop-color="#d8c8b8"/>
    </radialGradient>
    <linearGradient id="hanyiCRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#101830"/>
    </linearGradient>
    <linearGradient id="hanyiCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="hanyiCBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0c8d0"/>
      <stop offset="100%" stop-color="#808890"/>
    </linearGradient>
    <linearGradient id="hanyiCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="210" rx="32" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪姿態） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="8" cy="192" rx="10" ry="12" fill="url(#hanyiCPants)" transform="rotate(-20,8,192)"/>
      <ellipse cx="2" cy="204" rx="8" ry="5" fill="url(#hanyiCPants)"/>
      <ellipse cx="0" cy="208" rx="10" ry="5" fill="#0e1828"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-14" cy="188" rx="10" ry="16" fill="url(#hanyiCPants)" transform="rotate(12,-14,188)"/>
      <ellipse cx="-18" cy="208" rx="11" ry="6" fill="#0e1828"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="156" rx="23" ry="28" fill="url(#hanyiCRobe)" transform="rotate(-14,-4,156)"/>

      <!-- 長袍暗紋 -->
      <path d="M-12,146 L-6,168" fill="none" stroke="#2a3a5a" stroke-width="0.8" opacity="0.25"/>
      <path d="M2,143 L8,166" fill="none" stroke="#2a3a5a" stroke-width="0.8" opacity="0.25"/>

      <!-- 內袍領口 -->
      <path d="M-14,136 L-6,152 L4,136" fill="none" stroke="#3a4a6a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-24,176 Q-2,184 20,176" fill="none" stroke="#2a3a5a" stroke-width="5" stroke-linecap="round"/>
      <rect x="-6" y="175" width="7" height="7" rx="1" fill="#b0b8c0" stroke="#8090a0" stroke-width="0.5"/>

      <!-- 文書袋（散落） -->
      <rect x="10" y="172" width="8" height="10" rx="2" fill="#2a1a10" stroke="#1a0a00" stroke-width="0.5" opacity="0.5"/>

      <!-- ===== 大頭（低垂喘息） ===== -->
      <!-- 後腦整齊黑髮 -->
      <ellipse cx="-2" cy="92" rx="38" ry="40" fill="url(#hanyiCHair)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-32,86 C-36,98 -34,114 -28,124 C-22,132 -10,136 0,134 C10,132 20,124 24,114 C28,102 26,90 20,82 C14,76 4,72 -6,74 C-18,76 -30,80 -32,86Z" fill="url(#hanyiCFace)"/>

      <!-- 腮紅（因痛苦更明顯） -->
      <ellipse cx="-24" cy="122" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

      <!-- 頭髮頂部 -->
      <path d="M-22,76 C-18,56 -2,48 12,52 C24,56 28,68 24,78 C20,72 12,66 4,64 C-4,62 -14,64 -18,70" fill="url(#hanyiCHair)"/>

      <!-- 髮髻（歪斜，快散） -->
      <ellipse cx="0" cy="52" rx="10" ry="8" fill="url(#hanyiCHair)" transform="rotate(-10,0,52)"/>
      <path d="M-8,52 C-6,44 6,44 8,52" fill="url(#hanyiCHair)"/>
      <!-- 散落髮絲 -->
      <path d="M-30,82 C-32,88 -30,92" fill="none" stroke="url(#hanyiCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 銀髮簪（歪斜） -->
      <line x1="-10" y1="50" x2="12" y2="46" stroke="#b0b8c0" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="46" r="2" fill="#c0c8d0" stroke="#8090a0" stroke-width="0.5"/>

      <!-- 瀏海 -->
      <path d="M-30,84 C-32,76 -30,72 -26,78" fill="url(#hanyiCHair)"/>
      <path d="M-26,80 C-28,72 -24,68 -20,76" fill="url(#hanyiCHair)" opacity="0.9"/>

      <!-- 側髮 -->
      <path d="M20,82 C24,78 26,84 24,92 C22,98 20,96 20,90" fill="url(#hanyiCHair)"/>

      <!-- 耳朵 -->
      <path d="M18,100 C22,96 24,102 22,110 C20,114 18,112 18,106" fill="url(#hanyiCFace)" stroke="#c8b8a8" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼瞇成線） ===== -->
      <!-- 左眼（幾乎閉上） -->
      <ellipse cx="-14" cy="106" rx="5.5" ry="2" fill="#fff"/>
      <ellipse cx="-15" cy="106.5" rx="3.5" ry="1.5" fill="#1a2030"/>
      <ellipse cx="-15.5" cy="106" rx="2" ry="1" fill="#0a0a14"/>

      <!-- 右眼（勉強睜一線） -->
      <ellipse cx="4" cy="106" rx="5.5" ry="2.5" fill="#fff"/>
      <ellipse cx="3" cy="106.5" rx="3.5" ry="2" fill="#1a2030"/>
      <ellipse cx="2.5" cy="106" rx="2" ry="1.2" fill="#0a0a14"/>
      <circle cx="1" cy="105.5" r="0.6" fill="#fff" opacity="0.5"/>

      <!-- 眉毛（深鎖） -->
      <path d="M-20,99 C-16,97 -12,98 -9,100" fill="none" stroke="#1a1a20" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,100 C10,98 14,97 18,99" fill="none" stroke="#1a1a20" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 眉間皺紋（深刻） -->
      <path d="M-7,101 C-5,99 -2,99 0,101" fill="none" stroke="#c8b8a0" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-8,103 C-6,101.5 -3,101.5 -1,103" fill="none" stroke="#c8b8a0" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 鼻子 -->
      <path d="M-16,114 C-18,118 -16,122" fill="none" stroke="#c8b8a0" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-6" cy="129" rx="5" ry="4.5" fill="#703030"/>
      <path d="M-10,127 L-2,127" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- ===== 空手臂（負x，撐在膝蓋上） ===== -->
      <path d="M-20,144 Q-34,158 -24,176" fill="none" stroke="url(#hanyiCRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <path d="M-28,168 Q-26,174 -22,176" fill="none" stroke="#2a3a5a" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
      <circle cx="-24" cy="178" r="5" fill="url(#hanyiCFace)" opacity="0.8"/>

      <!-- ===== 武器手臂（正x，劍插地撐身體） ===== -->
      <path d="M22,142 Q42,150 52,164" fill="none" stroke="url(#hanyiCRobe)" stroke-width="11" stroke-linecap="round"/>
      <path d="M42,156 Q48,160 50,164" fill="none" stroke="#2a3a5a" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

      <!-- ===== 劍（正x，插入地面當支撐） ===== -->
      <circle cx="52" cy="166" r="5.5" fill="url(#hanyiCFace)"/>
      <!-- 劍柄 -->
      <line x1="52" y1="162" x2="52" y2="156" stroke="#3a2a1a" stroke-width="4" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="52" cy="155" r="2.5" fill="#b0b8c0"/>
      <!-- 劍護手 -->
      <line x1="47" y1="162" x2="57" y2="160" stroke="#b0b8c0" stroke-width="3" stroke-linecap="round"/>
      <!-- 劍刃（插地） -->
      <line x1="53" y1="168" x2="56" y2="212" stroke="url(#hanyiCBlade)" stroke-width="3" stroke-linecap="round"/>
      <line x1="53" y1="168" x2="56" y2="212" stroke="#e0e8f0" stroke-width="0.8" opacity="0.4"/>
      <!-- 劍插入地面效果 -->
      <ellipse cx="56" cy="212" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>

      <!-- 汗滴（多顆） -->
      <path d="M-26,82 C-27,86 -26,92 -25,95" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-25" cy="96" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M22,84 C23,88 22,92" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="22" cy="93" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-8" cy="76" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>