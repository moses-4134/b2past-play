<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙國巡邏兵 — 瀕死待機（HP <30%：半跪、撐劍、喘息） -->
  <defs>
    <radialGradient id="mobPatrolCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c4a0"/>
      <stop offset="100%" stop-color="#cca880"/>
    </radialGradient>
    <linearGradient id="mobPatrolCArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a4038"/>
      <stop offset="100%" stop-color="#2a3028"/>
    </linearGradient>
    <linearGradient id="mobPatrolCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3028"/>
      <stop offset="100%" stop-color="#1a2018"/>
    </linearGradient>
    <linearGradient id="mobPatrolCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobPatrolCSteel" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="192" rx="28" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪） ===== -->
      <ellipse cx="8" cy="176" rx="9" ry="12" fill="url(#mobPatrolCPants)" transform="rotate(-20,8,176)"/>
      <ellipse cx="2" cy="186" rx="8" ry="5" fill="url(#mobPatrolCPants)"/>
      <ellipse cx="0" cy="190" rx="9" ry="5" fill="#1a2018"/>
      <ellipse cx="-12" cy="172" rx="9" ry="16" fill="url(#mobPatrolCPants)" transform="rotate(12,-12,172)"/>
      <ellipse cx="-16" cy="190" rx="10" ry="6" fill="#1a2018"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="142" rx="23" ry="24" fill="url(#mobPatrolCArmor)" transform="rotate(-14,-4,142)"/>

      <!-- 甲片紋理 -->
      <path d="M-8,134 L-5,144" fill="none" stroke="#1a2018" stroke-width="0.8" opacity="0.4"/>

      <!-- 領口 -->
      <path d="M-14,124 L-8,134 L-2,124" fill="none" stroke="#2a3028" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-25,162 Q-4,170 15,164" fill="none" stroke="#2a2418" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 大頭（低垂） ===== -->
      <ellipse cx="-2" cy="92" rx="34" ry="36" fill="url(#mobPatrolCHair)"/>

      <!-- 臉 -->
      <path d="M-26,88 C-30,98 -28,110 -22,120 C-16,128 -8,132 0,130 C8,128 12,122 16,112 C20,100 18,88 12,80 C6,74 0,72 -6,74 C-14,76 -24,82 -26,88Z" fill="url(#mobPatrolCFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-18,78 C-14,60 2,52 14,56 C22,60 26,72 22,82 C18,74 12,68 4,66 C-2,64 -10,66 -16,72" fill="url(#mobPatrolCHair)"/>

      <!-- 巡邏布帽（歪斜） -->
      <path d="M-28,78 C-24,68 -10,62 6,64 C16,66 24,72 22,78" fill="#3a4038" stroke="#2a3028" stroke-width="0.5" transform="rotate(-5,-2,70)"/>
      <path d="M-30,78 C-30,76 -28,74 -24,76 L24,76 C26,76 26,80 24,80 L-28,80 C-30,80 -30,78 -30,78Z" fill="#3a4038" stroke="#2a3028" stroke-width="0.5" transform="rotate(-5,-2,78)"/>

      <!-- 瀏海（散亂） -->
      <path d="M-24,82 C-28,76 -30,80 -30,86 C-28,90 -24,88 -24,84" fill="url(#mobPatrolCHair)"/>
      <path d="M-30,88 C-32,94 -30,98" fill="none" stroke="url(#mobPatrolCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 側髮 -->
      <path d="M16,84 C22,78 24,86 22,94 C20,98 16,96 16,92" fill="url(#mobPatrolCHair)"/>

      <!-- 耳朵 -->
      <path d="M14,102 C18,98 20,104 18,110 C16,114 14,112 14,108" fill="url(#mobPatrolCFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- 腮紅 -->
      <ellipse cx="-20" cy="118" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

      <!-- ===== 眼睛（幾乎閉上） ===== -->
      <ellipse cx="-10" cy="106" rx="6" ry="2" fill="#fff"/>
      <ellipse cx="-11" cy="106.5" rx="3.5" ry="1.5" fill="#2a2820"/>
      <ellipse cx="-11.5" cy="106" rx="2" ry="1" fill="#1a1810"/>

      <ellipse cx="6" cy="106" rx="6" ry="2.5" fill="#fff"/>
      <ellipse cx="5" cy="106.5" rx="3.5" ry="2" fill="#2a2820"/>
      <ellipse cx="4.5" cy="106" rx="2" ry="1.2" fill="#1a1810"/>
      <circle cx="3" cy="105" r="0.6" fill="#fff" opacity="0.5"/>

      <!-- 眉間皺紋 -->
      <path d="M-3,99 C-1,97 1,97 3,99" fill="none" stroke="#b09060" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-4,101 C-2,99.5 1,99.5 3,101" fill="none" stroke="#b09060" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 鼻子 -->
      <path d="M-16,114 C-18,118 -14,122" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（喘息） -->
      <ellipse cx="-6" cy="127" rx="5" ry="4.5" fill="#703030"/>
      <path d="M-10,125 L-2,125" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴 -->
      <path d="M-22,84 C-23,88 -22,94 -21,97" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-21" cy="98" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M18,86 C19,90 18,94" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="18" cy="95" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <ellipse cx="-8" cy="74" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>

      <!-- ===== 右手臂（撐在膝蓋上） ===== -->
      <path d="M14,132 Q22,148 14,166" fill="none" stroke="url(#mobPatrolCArmor)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
      <circle cx="13" cy="168" r="4.5" fill="url(#mobPatrolCFace)" opacity="0.85"/>

      <!-- ===== 左手臂（劍插地支撐） ===== -->
      <path d="M-20,130 Q-38,138 -46,152" fill="none" stroke="url(#mobPatrolCArmor)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-46" cy="154" r="5" fill="url(#mobPatrolCFace)"/>

      <!-- ===== 劍（插地支撐） ===== -->
      <line x1="-47" y1="156" x2="-50" y2="194" stroke="url(#mobPatrolCSteel)" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="-50" cy="194" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>
      <rect x="-52" y="153" width="10" height="3" rx="1" fill="#6a5a40"/>
      <rect x="-50" y="146" width="6" height="7" rx="1" fill="#4a3020"/>
    </g>
  </g>
</svg>
