<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 龍陽君 — 吉卜力2頭身 面朝右（敵方）受傷待機（HP 30~60%：身體微傾、劍下垂、眼半瞇、咬牙、汗滴） -->
  <defs>
    <radialGradient id="longyangWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e8e0"/>
      <stop offset="100%" stop-color="#e0d4c8"/>
    </radialGradient>
    <linearGradient id="longyangWRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a4a30"/>
      <stop offset="100%" stop-color="#0a3020"/>
    </linearGradient>
    <linearGradient id="longyangWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#143828"/>
      <stop offset="100%" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="longyangWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#101018"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="longyangWBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dde0e8"/>
      <stop offset="100%" stop-color="#8890a0"/>
    </linearGradient>
    <linearGradient id="longyangWInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a6a40"/>
      <stop offset="100%" stop-color="#1a5030"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="225" rx="30" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（重心偏移，前腿微彎） ===== -->
    <!-- 後腿 -->
    <ellipse cx="10" cy="202" rx="9" ry="16" fill="url(#longyangWPants)" transform="rotate(-2,10,202)"/>
    <ellipse cx="8" cy="218" rx="10" ry="7" fill="#0a2018"/>
    <!-- 前腿（微彎支撐） -->
    <ellipse cx="-12" cy="200" rx="10" ry="17" fill="url(#longyangWPants)" transform="rotate(8,-12,200)"/>
    <ellipse cx="-15" cy="218" rx="11" ry="7" fill="#0a2018"/>

    <!-- ===== 身體（前傾彎腰） ===== -->
    <ellipse cx="-2" cy="160" rx="22" ry="29" fill="url(#longyangWRobe)" transform="rotate(-8,-2,160)"/>

    <!-- 內衫領口 -->
    <path d="M-10,140 L-3,154 L4,140" fill="none" stroke="url(#longyangWInner)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 金邊裝飾 -->
    <path d="M-22,144 Q-22,164 -18,182" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.6"/>
    <path d="M18,144 Q20,164 18,182" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.6"/>

    <!-- 領口金邊 -->
    <path d="M-11,140 L-3,155 L5,140" fill="none" stroke="#c8a840" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-22,180 Q-2,188 20,180" fill="none" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
    <rect x="-6" y="178" width="8" height="8" rx="2" fill="#3a8a50" stroke="#c8a840" stroke-width="1"/>

    <!-- ===== 右手臂（正x，按住腹部傷口） ===== -->
    <path d="M18,148 Q28,158 18,176" fill="none" stroke="url(#longyangWRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <path d="M16,172 Q18,174 18,178" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.5"/>
    <circle cx="18" cy="178" r="5" fill="url(#longyangWFace)" opacity="0.9"/>

    <!-- ===== 頭部 ===== -->
    <!-- 長髮後方 -->
    <path d="M-4,70 C18,68 32,82 34,102 C36,122 32,150 28,170 C26,176 22,174 24,166 C28,142 30,112 28,92 C26,80 14,72 0,74" fill="url(#longyangWHair)" opacity="0.85"/>
    <path d="M4,72 C22,70 36,86 38,108 C40,128 36,154 32,174 C30,180 26,178 28,170 C32,146 34,116 32,96 C30,82 18,74 6,76" fill="url(#longyangWHair)" opacity="0.6"/>

    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="96" rx="36" ry="38" fill="url(#longyangWHair)"/>

    <!-- 臉（微低頭） -->
    <path d="M-28,88 C-32,100 -30,116 -24,126 C-18,134 -8,138 2,136 C12,134 20,126 24,116 C28,104 26,92 20,84 C14,78 4,74 -6,76 C-16,78 -26,82 -28,88Z" fill="url(#longyangWFace)"/>

    <!-- 腮紅（傷痛泛紅） -->
    <ellipse cx="-20" cy="122" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

    <!-- 頭髮頂部 -->
    <path d="M-18,78 C-14,60 0,52 14,56 C24,60 30,72 26,82 C22,76 14,70 6,68 C-2,66 -10,68 -14,74" fill="url(#longyangWHair)"/>

    <!-- 瀏海（略散亂） -->
    <path d="M-26,88 C-30,78 -34,80 -34,90 C-32,94 -28,94 -26,90" fill="url(#longyangWHair)"/>
    <path d="M-22,82 C-24,72 -28,74 -28,84 C-26,88 -22,88 -22,86" fill="#101018"/>
    <path d="M-18,80 C-20,70 -24,72 -22,82 C-20,86 -18,84 -18,82" fill="url(#longyangWHair)" opacity="0.7"/>

    <!-- 髮髻（略歪） -->
    <ellipse cx="2" cy="56" rx="10" ry="8" fill="url(#longyangWHair)" transform="rotate(-5,2,56)"/>
    <path d="M-6,54 C-4,44 8,44 10,54" fill="url(#longyangWHair)"/>
    <!-- 玉簪 -->
    <line x1="-6" y1="52" x2="14" y2="48" stroke="#c8a840" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="14" cy="48" r="3.5" fill="#3a8a50" stroke="#2a7a40" stroke-width="0.5"/>
    <circle cx="14" cy="48" r="1.5" fill="#5aba60" opacity="0.6"/>

    <!-- 飄逸髮絲 -->
    <path d="M18,80 C22,76 24,82 22,90 C20,96 18,94 18,88" fill="url(#longyangWHair)"/>
    <path d="M20,90 C24,88 26,96 24,104 C22,110 18,106 18,100" fill="url(#longyangWHair)" opacity="0.8"/>
    <path d="M22,102 C26,100 28,108 26,116 C24,120 20,116 20,110" fill="url(#longyangWHair)" opacity="0.5"/>

    <!-- 耳朵 -->
    <path d="M18,102 C22,98 24,104 22,110 C20,114 18,112 18,108" fill="url(#longyangWFace)" stroke="#d8c8b8" stroke-width="0.5"/>
    <!-- 翡翠耳環 -->
    <circle cx="21" cy="114" r="2" fill="#3a8a50" stroke="#2a7a40" stroke-width="0.5"/>

    <!-- ===== 眼睛（左眼半瞇忍痛、右眼微睜） ===== -->
    <!-- 睫毛（散亂） -->
    <line x1="-18" y1="104" x2="-16" y2="102" stroke="#101018" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="-14" y1="103" x2="-13" y2="101" stroke="#101018" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="0" y1="104" x2="1" y2="102" stroke="#101018" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="4" y1="103" x2="5" y2="101" stroke="#101018" stroke-width="0.8" stroke-linecap="round"/>

    <!-- 左眼（半瞇） -->
    <ellipse cx="-12" cy="108" rx="7" ry="4" fill="#fff"/>
    <ellipse cx="-13" cy="109" rx="4.2" ry="3" fill="#1a2830"/>
    <ellipse cx="-13.5" cy="108" rx="2.3" ry="1.8" fill="#0a1018"/>
    <circle cx="-15" cy="107" r="1" fill="#fff" opacity="0.6"/>

    <!-- 右眼（微睜） -->
    <ellipse cx="4" cy="108" rx="7" ry="5.5" fill="#fff"/>
    <ellipse cx="3" cy="109" rx="4.2" ry="4" fill="#1a2830"/>
    <ellipse cx="2.5" cy="108" rx="2.3" ry="2.3" fill="#0a1018"/>
    <circle cx="1" cy="106" r="1.2" fill="#fff" opacity="0.7"/>

    <!-- 眉毛（皺起） -->
    <path d="M-18,102 C-14,99 -8,99 -6,101" fill="none" stroke="#101018" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-2,102 C2,99 8,99 10,101" fill="none" stroke="#101018" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 眉間皺紋 -->
    <path d="M-5,104 C-4,102 -2,102 -1,104" fill="none" stroke="#d8c8b8" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- 鼻子 -->
    <path d="M-16,116 C-17,120 -15,124" fill="none" stroke="#d8c8b8" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（咬牙忍痛，失去冷笑） -->
    <path d="M-11,130 C-7,131 -2,131 2,130" fill="none" stroke="#906050" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-11,130 C-12,132 -13,133" fill="none" stroke="#906050" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- ===== 左手臂（負x，持劍下垂無力） ===== -->
    <path d="M-20,148 Q-36,156 -48,170" fill="none" stroke="url(#longyangWRobe)" stroke-width="10" stroke-linecap="round"/>
    <path d="M-42,166 Q-48,168 -48,172" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.5"/>

    <!-- ===== 劍（負x側，下垂無力） ===== -->
    <circle cx="-48" cy="172" r="5.5" fill="url(#longyangWFace)"/>
    <!-- 劍身（下垂向地面） -->
    <line x1="-47" y1="174" x2="-42" y2="226" stroke="url(#longyangWBlade)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-47" y1="174" x2="-42" y2="226" stroke="#eef0f8" stroke-width="1.2" opacity="0.4"/>
    <!-- 劍尖 -->
    <line x1="-42" y1="226" x2="-41.5" y2="232" stroke="#ccd0d8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 護手 -->
    <line x1="-54" y1="170" x2="-44" y2="168" stroke="#c8a840" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-47" y1="168" x2="-46" y2="162" stroke="#3a2028" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-46" cy="160" r="2.5" fill="#c8a840"/>

    <!-- 汗滴 -->
    <path d="M-22,84 C-23,88 -22,92 -21,94" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-21" cy="95" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
  </g>
  </g>
</svg>