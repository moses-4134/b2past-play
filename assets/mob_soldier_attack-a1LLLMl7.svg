<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 腐吏惡卒 — 攻擊（槍刺出，前跨步） -->
  <defs>
    <radialGradient id="mobSoldierFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c0a470"/>
    </radialGradient>
    <linearGradient id="mobSoldierCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a5048"/>
      <stop offset="100%" stop-color="#3a3830"/>
    </linearGradient>
    <linearGradient id="mobSoldierPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3830"/>
      <stop offset="100%" stop-color="#2a2820"/>
    </linearGradient>
    <linearGradient id="mobSoldierHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobSoldierSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <linearGradient id="mobSoldierShield" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b88830"/>
      <stop offset="100%" stop-color="#785018"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-8" cy="200" rx="24" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前跨步） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="180" rx="8" ry="15" fill="url(#mobSoldierPants)" transform="rotate(-8,12,180)"/>
      <ellipse cx="10" cy="194" rx="9" ry="6" fill="#2a2418"/>
      <!-- 前腿 -->
      <ellipse cx="-16" cy="176" rx="9" ry="16" fill="url(#mobSoldierPants)" transform="rotate(12,-16,176)"/>
      <ellipse cx="-20" cy="192" rx="10" ry="6" fill="#2a2418"/>

      <!-- ===== 身體（前傾攻擊） ===== -->
      <ellipse cx="-4" cy="146" rx="23" ry="25" fill="url(#mobSoldierCloth)" transform="rotate(-10,-4,146)"/>

      <!-- 破舊軍服裂痕 -->
      <path d="M-10,136 L-7,146" fill="none" stroke="#2a2820" stroke-width="0.8" opacity="0.4"/>
      <path d="M4,140 L7,150" fill="none" stroke="#2a2820" stroke-width="0.7" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-12,128 L-6,138 L2,128" fill="none" stroke="#4a4838" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-22,166 Q-4,172 16,166" fill="none" stroke="#3a3020" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 右手臂（角色左手，持盾後擺） ===== -->
      <path d="M14,134 Q28,128 34,118" fill="none" stroke="url(#mobSoldierCloth)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="34" cy="118" r="4.5" fill="url(#mobSoldierFace)" opacity="0.85"/>
      <!-- 盾牌 -->
      <ellipse cx="38" cy="116" rx="14" ry="16" fill="url(#mobSoldierShield)" stroke="#3a2818" stroke-width="1"/>
      <line x1="38" y1="100" x2="38" y2="132" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <line x1="26" y1="116" x2="50" y2="116" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <circle cx="38" cy="116" r="3.5" fill="#806040" opacity="0.4"/>
      
      <!-- ===== 左手臂（角色右手，槍刺出） ===== -->
      <path d="M-20,132 Q-44,118 -56,110" fill="none" stroke="url(#mobSoldierCloth)" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== 槍（水平刺出） ===== -->
      <!-- 槍桿 -->
      <line x1="-110" y1="103" x2="-40" y2="112" stroke="#5a4028" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 槍頭（三角形，中線和槍桿共線） -->
      <path d="M-120,101.7 L-110.3,99.5 L-109.7,104.5 Z" fill="url(#mobSoldierSteel)" stroke="#888" stroke-width="0.5"/>
      <!-- 握槍的手 -->
      <circle cx="-56" cy="112" r="5" fill="url(#mobSoldierFace)"/>

      <!-- ===== 大頭（前傾） ===== -->
      <ellipse cx="-2" cy="98" rx="34" ry="36" fill="url(#mobSoldierHair)" transform="rotate(-5,-2,98)"/>

      <!-- 臉 -->
      <path d="M-22,90 C-26,100 -24,112 -18,122 C-12,130 -4,134 4,132 C10,130 14,124 18,114 C22,102 20,90 14,82 C8,76 2,74 -4,76 C-12,78 -20,84 -22,90Z" fill="url(#mobSoldierFace)" transform="rotate(-5,-2,104)"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,78 C-12,60 4,52 16,56 C24,60 28,72 24,82 C20,74 14,68 6,66 C0,64 -8,66 -14,72" fill="url(#mobSoldierHair)"/>

      <!-- 布帽 -->
      <path d="M-26,78 C-22,68 -8,62 8,64 C18,66 26,72 24,78" fill="#4a4038" stroke="#3a3028" stroke-width="0.5"/>
      <path d="M-28,78 C-28,76 -26,74 -22,76 L26,76 C28,76 28,80 26,80 L-26,80 C-28,80 -28,78 -28,78Z" fill="#4a4038" stroke="#3a3028" stroke-width="0.5"/>

      <!-- 瀏海 -->
      <path d="M-22,84 C-26,76 -28,80 -28,88 C-26,92 -22,90 -22,86" fill="url(#mobSoldierHair)"/>

      <!-- 側髮 -->
      <path d="M18,84 C24,78 26,86 24,94 C22,98 18,96 18,92" fill="url(#mobSoldierHair)"/>

      <!-- 耳朵 -->
      <path d="M16,102 C20,98 22,104 20,110 C18,114 16,112 16,108" fill="url(#mobSoldierFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（用力瞪） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-10" cy="106" rx="6" ry="5.5" fill="#fff"/>
      <ellipse cx="-11" cy="107" rx="3.5" ry="4" fill="#383830"/>
      <ellipse cx="-11.5" cy="106" rx="2" ry="2.2" fill="#1a1810"/>
      <circle cx="-13" cy="105" r="0.8" fill="#fff" opacity="0.45"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="106" rx="6" ry="5.5" fill="#fff"/>
      <ellipse cx="5" cy="107" rx="3.5" ry="4" fill="#383830"/>
      <ellipse cx="4.5" cy="106" rx="2" ry="2.2" fill="#1a1810"/>
      <circle cx="3" cy="105" r="0.8" fill="#fff" opacity="0.45"/>

      <!-- 眉毛（皺眉用力） -->
      <path d="M-14,99 C-10,97 -8,99 -6,101" fill="none" stroke="#2a2420" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,101 C10,99 12,97 16,99" fill="none" stroke="#2a2420" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,114 C-16,118 -12,122" fill="none" stroke="#a08858" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（張嘴吼叫） -->
      <ellipse cx="-3" cy="128" rx="7" ry="5" fill="#4a2020"/>
      <path d="M-10,126 C-6,124 0,124 4,126" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>