<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙嵬 — 吉卜力2頭身 面朝右（敵方）受傷待機（HP 30~60%：身體微傾、武器下垂、單眼半瞇、咬牙、汗滴） -->
  <defs>
    <radialGradient id="zmWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e0d0"/>
      <stop offset="100%" stop-color="#d8c4a8"/>
    </radialGradient>
    <linearGradient id="zmWRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a2858"/>
      <stop offset="100%" stop-color="#2a1838"/>
    </linearGradient>
    <linearGradient id="zmWInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3828"/>
      <stop offset="100%" stop-color="#1a2818"/>
    </linearGradient>
    <linearGradient id="zmWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#201820"/>
      <stop offset="100%" stop-color="#100810"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 14)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="203.5" rx="26" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（重心偏移，前腿微彎） ===== -->
      <ellipse cx="8" cy="184" rx="7" ry="14" fill="url(#zmWInner)" transform="rotate(-3,8,184)"/>
      <ellipse cx="6" cy="198" rx="8" ry="5.5" fill="#2a2020"/>
      <ellipse cx="-10" cy="182" rx="8" ry="15" fill="url(#zmWInner)" transform="rotate(8,-10,182)"/>
      <ellipse cx="-12" cy="198" rx="9" ry="5.5" fill="#2a2020"/>

      <!-- ===== 身體（前傾，失去從容） ===== -->
      <ellipse cx="-2" cy="154" rx="23" ry="25" fill="url(#zmWRobe)" transform="rotate(-8,-2,154)"/>

      <!-- 墨綠內襯 -->
      <path d="M-10,132 L-5,146 L2,132" fill="none" stroke="#2a3828" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 金色腰帶 -->
      <path d="M-22,170 Q-2,178 18,170" fill="none" stroke="#c8a040" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-3" cy="174" r="3" fill="#d8b050"/>

      <!-- 紫色袍邊金線 -->
      <path d="M-23,140 Q-24,155 -23,170" fill="none" stroke="#c8a040" stroke-width="0.8" opacity="0.5"/>
      <path d="M19,140 Q20,155 19,170" fill="none" stroke="#c8a040" stroke-width="0.8" opacity="0.5"/>

      <!-- ===== 畫面右側手臂（角色左手，按住腹部） ===== -->
      <path d="M16,140 Q22,154 12,168" fill="none" stroke="url(#zmWRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="12" cy="170" r="4" fill="url(#zmWFace)" opacity="0.85"/>

      <!-- ===== 畫面左側手臂（角色右手，無力下垂） ===== -->
      <path d="M-20,142 Q-34,156 -32,172" fill="none" stroke="url(#zmWRobe)" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="-32" cy="174" rx="7" ry="5" fill="#3a1e48" transform="rotate(10,-32,174)"/>
      <circle cx="-34" cy="174" r="4.5" fill="url(#zmWFace)"/>

      <!-- ===== 大頭（低頭忍痛） ===== -->
      <ellipse cx="0" cy="94" rx="36" ry="38" fill="url(#zmWHair)"/>

      <!-- 臉（瘦長臉型，微低頭） -->
      <path d="M-24,88 C-28,98 -26,114 -20,124 C-14,132 -4,136 4,134 C10,132 16,126 20,116 C24,104 22,92 16,84 C10,78 2,76 -4,78 C-12,80 -22,84 -24,88Z" fill="url(#zmWFace)"/>

      <!-- 腮紅（傷痛泛紅） -->
      <ellipse cx="-18" cy="120" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- 頭髮頂部（梳起官帽式） -->
      <path d="M-14,78 C-10,56 6,48 18,54 C26,60 28,72 24,82 C20,74 12,66 4,64 C-4,62 -10,66 -14,74" fill="url(#zmWHair)"/>

      <!-- 官帽/髮冠 -->
      <path d="M-12,60 C-8,46 8,42 16,48 C20,52 18,58 14,60" fill="#201820" stroke="#c8a040" stroke-width="1"/>
      <rect x="-2" y="42" width="8" height="6" rx="1" fill="#c8a040"/>
      <circle cx="2" cy="45" r="2" fill="#e8c060"/>

      <!-- 鬢角 -->
      <path d="M20,84 C26,80 28,88 26,96 C24,102 20,100 20,94" fill="url(#zmWHair)"/>
      <path d="M22,96 C26,94 28,102 26,110" fill="none" stroke="#606060" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <path d="M-26,88 C-30,100 -30,112 -28,122" fill="none" stroke="url(#zmWHair)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <path d="M-28,98 C-30,108 -30,118" fill="none" stroke="#606060" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

      <!-- 耳朵 -->
      <path d="M18,100 C22,96 24,102 22,108 C20,112 18,110 18,106" fill="url(#zmWFace)" stroke="#d0b498" stroke-width="0.5"/>

      <!-- ===== 眼睛（左眼半瞇忍痛、右眼微睜） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-9" cy="106" rx="7" ry="3.5" fill="#fff" transform="rotate(-5,-9,106)"/>
      <ellipse cx="-10" cy="107" rx="4" ry="2.5" fill="#2a1818"/>
      <ellipse cx="-10.5" cy="106.5" rx="2" ry="1.5" fill="#0c0404"/>
      <circle cx="-12" cy="105.5" r="1" fill="#fff" opacity="0.6"/>

      <!-- 右眼（微瞇但還睜著） -->
      <ellipse cx="6" cy="106" rx="7" ry="4.5" fill="#fff" transform="rotate(-5,6,106)"/>
      <ellipse cx="5" cy="107" rx="4" ry="3" fill="#2a1818"/>
      <ellipse cx="4.5" cy="106.5" rx="2" ry="1.8" fill="#0c0404"/>
      <circle cx="3" cy="105" r="1" fill="#fff" opacity="0.6"/>

      <!-- 粗濃眉（皺起） -->
      <path d="M-16,98 C-12,96 -8,97 -4,100" fill="none" stroke="#201820" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M2,100 C6,97 10,96 14,98" fill="none" stroke="#201820" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 眉間皺紋 -->
      <path d="M-5,101 C-4,99 -2,99 -1,101" fill="none" stroke="#c0a080" stroke-width="0.8" opacity="0.5"/>

      <!-- 鼻子 -->
      <path d="M-12,114 C-13,118 -11,120" fill="none" stroke="#c8b090" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 八字鬍 -->
      <path d="M-8,122 C-12,126 -16,127" fill="none" stroke="#302828" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M0,122 C4,126 8,127" fill="none" stroke="#302828" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-6,128 C-2,130 2,130 6,128" fill="none" stroke="#705040" stroke-width="2" stroke-linecap="round"/>
      <path d="M-6,128 C-7,130 -8,131" fill="none" stroke="#705040" stroke-width="1" opacity="0.6"/>

      <!-- 汗滴 -->
      <path d="M-20,90 C-21,94 -20,98 -19,100" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-19" cy="101" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
    </g>
  </g>
</svg>