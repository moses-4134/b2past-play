<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙姬 — 吉卜力2頭身 側面朝左 倒地/戰敗 -->
  <defs>
    <radialGradient id="zjFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fff2e8"/>
      <stop offset="100%" stop-color="#f4dcc8"/>
    </radialGradient>
    <linearGradient id="zjRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#a83030"/>
      <stop offset="100%" stop-color="#7a1818"/>
    </linearGradient>
    <linearGradient id="zjSkirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#902828"/>
      <stop offset="100%" stop-color="#601010"/>
    </linearGradient>
    <linearGradient id="zjHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a0a04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
  </defs>

  <g transform="translate(78, 10)">
    <!-- 陰影（倒地拉長） -->
    <ellipse cx="-4" cy="222" rx="38" ry="4" fill="#000" opacity="0.08"/>

    <g transform="rotate(90, -4, 176)">
      <!-- 腿 -->
      <ellipse cx="8" cy="196" rx="8" ry="15" fill="url(#zjSkirt)"/>
      <ellipse cx="6" cy="211" rx="9" ry="6" fill="#4a2020"/>
      <ellipse cx="-12" cy="195" rx="9" ry="16" fill="url(#zjSkirt)"/>
      <ellipse cx="-14" cy="211" rx="10" ry="6" fill="#4a2020"/>

      <!-- 身體 -->
      <ellipse cx="-2" cy="163" rx="24" ry="26" fill="url(#zjRobe)"/>
      <path d="M-24,178 Q-2,186 20,178" fill="none" stroke="#d4a030" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-4" cy="182" r="3.5" fill="#e8c040"/>
      <path d="M-12,141 L-5,155 L4,141" fill="none" stroke="#f8f0e8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 後方髮帶（散落） -->
      <path d="M18,72 C22,82 24,100 22,120 C20,140 18,158 16,170" fill="none" stroke="url(#zjHair)" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

      <!-- 手臂（自然垂落） -->
      <path d="M18,148 Q30,158 28,172" fill="none" stroke="url(#zjRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
      <circle cx="28" cy="174" r="4.5" fill="url(#zjFace)" opacity="0.85"/>
      <path d="M-22,149 Q-34,158 -38,168" fill="none" stroke="url(#zjRobe)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-38" cy="170" r="5" fill="url(#zjFace)"/>

      <!-- 杖（脫手掉落） -->
      <line x1="-66" y1="188" x2="-28" y2="196" stroke="#8b5a2b" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="-68" cy="187" r="4" fill="#48a070" stroke="#d4a030" stroke-width="1" opacity="0.6"/>

      <!-- 大頭 -->
      <ellipse cx="0" cy="92" rx="36" ry="38" fill="url(#zjHair)"/>
      <path d="M-24,86 C-28,96 -26,112 -20,122 C-14,130 -4,134 6,132 C14,130 20,124 24,114 C28,102 26,90 20,82 C14,76 6,74 -2,76 C-12,78 -22,80 -24,86Z" fill="url(#zjFace)"/>
      <ellipse cx="-18" cy="120" rx="7" ry="4" fill="#e88888" opacity="0.3"/>

      <!-- 髮頂（散亂） -->
      <ellipse cx="0" cy="62" rx="20" ry="18" fill="url(#zjHair)"/>
      <path d="M-16,76 C-12,52 4,44 18,50 C28,56 30,68 26,78 C22,72 14,66 6,64 C-2,62 -10,64 -14,70" fill="url(#zjHair)"/>

      <!-- 瀏海（散亂） -->
      <path d="M-8,78 C-14,66 -22,68 -24,78 C-24,86 -14,88 -10,82" fill="url(#zjHair)"/>
      <path d="M4,78 C10,66 18,68 20,78 C20,86 10,88 6,82" fill="url(#zjHair)"/>

      <!-- 步搖（掉落歪斜） -->
      <circle cx="4" cy="54" r="3" fill="#e8c040" stroke="#d4a030" stroke-width="0.8" opacity="0.6"/>

      <!-- 側髮（散落） -->
      <path d="M22,82 C26,76 28,84 26,94" fill="url(#zjHair)" stroke="none"/>
      <path d="M24,94 C28,104 30,116 28,130" fill="none" stroke="url(#zjHair)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
      <path d="M-26,86 C-30,96 -32,110 -34,126" fill="none" stroke="url(#zjHair)" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
      <path d="M-24,82 C-28,94 -30,108 -32,122" fill="none" stroke="url(#zjHair)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

      <!-- 耳朵 -->
      <path d="M22,98 C26,94 28,100 26,106 C24,110 22,108 22,104" fill="url(#zjFace)" stroke="#f0d4c0" stroke-width="0.5"/>

      <!-- 眼睛（閉眼橫線） -->
      <line x1="-12" y1="104" x2="-4" y2="104" stroke="#3a2818" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="104" x2="12" y2="104" stroke="#3a2818" stroke-width="2" stroke-linecap="round"/>

      <path d="M-12,114 C-12.5,116 -11.5,117" fill="none" stroke="#f0d4c0" stroke-width="1" stroke-linecap="round"/>

      <!-- 嘴巴（一字線） -->
      <path d="M-6,126 C-3,126 0,126 3,126" fill="none" stroke="#905050" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
