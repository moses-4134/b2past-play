<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙國巡邏兵 — 勝利（劍扛肩，冷笑） -->
  <defs>
    <radialGradient id="mobPatrolFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c4a0"/>
      <stop offset="100%" stop-color="#cca880"/>
    </radialGradient>
    <linearGradient id="mobPatrolArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a4038"/>
      <stop offset="100%" stop-color="#2a3028"/>
    </linearGradient>
    <linearGradient id="mobPatrolPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3028"/>
      <stop offset="100%" stop-color="#1a2018"/>
    </linearGradient>
    <linearGradient id="mobPatrolHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobPatrolSteel" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="198" rx="22" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（輕鬆站姿） ===== -->
      <!-- 後腿 -->
      <ellipse cx="10" cy="178" rx="8" ry="15" fill="url(#mobPatrolPants)" transform="rotate(-2,10,178)"/>
      <ellipse cx="9" cy="192" rx="9" ry="6" fill="#1a2018"/>
      <!-- 前腿 -->
      <ellipse cx="-8" cy="176" rx="9" ry="16" fill="url(#mobPatrolPants)" transform="rotate(2,-8,176)"/>
      <ellipse cx="-9" cy="192" rx="10" ry="6" fill="#1a2018"/>

      <!-- ===== 身體（挺胸） ===== -->
      <ellipse cx="-2" cy="146" rx="23" ry="25" fill="url(#mobPatrolArmor)" transform="rotate(3,-2,146)"/>

      <!-- 甲片紋理 -->
      <path d="M-8,136 L-5,146" fill="none" stroke="#1a2018" stroke-width="0.8" opacity="0.4"/>
      <path d="M6,140 L9,150" fill="none" stroke="#1a2018" stroke-width="0.7" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-10,128 L-4,138 L4,128" fill="none" stroke="#2a3028" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-21,166 Q-2,172 19,166" fill="none" stroke="#2a2418" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 大頭（微仰得意） ===== -->
      <ellipse cx="0" cy="100" rx="34" ry="36" fill="url(#mobPatrolHair)"/>

      <!-- 臉 -->
      <path d="M-22,90 C-26,100 -24,112 -18,122 C-12,130 -4,134 4,132 C10,130 14,124 18,114 C22,102 20,90 14,82 C8,76 2,74 -4,76 C-12,78 -20,84 -22,90Z" fill="url(#mobPatrolFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,80 C-12,62 4,54 16,58 C24,62 28,74 24,84 C20,76 14,70 6,68 C0,66 -8,68 -14,74" fill="url(#mobPatrolHair)"/>

      <!-- 巡邏布帽 -->
      <path d="M-26,80 C-22,70 -8,64 8,66 C18,68 26,74 24,80" fill="#3a4038" stroke="#2a3028" stroke-width="0.5"/>
      <path d="M-28,80 C-28,78 -26,76 -22,78 L26,78 C28,78 28,82 26,82 L-26,82 C-28,82 -28,80 -28,80Z" fill="#3a4038" stroke="#2a3028" stroke-width="0.5"/>

      <!-- 瀏海 -->
      <path d="M-22,84 C-26,78 -28,82 -28,88 C-26,92 -22,90 -22,86" fill="url(#mobPatrolHair)"/>

      <!-- 側髮 -->
      <path d="M18,86 C24,80 26,88 24,96 C22,100 18,98 18,94" fill="url(#mobPatrolHair)"/>

      <!-- 耳朵 -->
      <path d="M16,104 C20,100 22,106 20,112 C18,116 16,114 16,110" fill="url(#mobPatrolFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（得意瞇眼） ===== -->
      <ellipse cx="-10" cy="108" rx="6" ry="4.5" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="3.5" ry="3" fill="#2a2820"/>
      <ellipse cx="-11.5" cy="108" rx="2" ry="1.8" fill="#1a1810"/>
      <circle cx="-13" cy="107" r="1.1" fill="#fff" opacity="0.6"/>

      <ellipse cx="6" cy="108" rx="6" ry="4.5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.5" ry="3" fill="#2a2820"/>
      <ellipse cx="4.5" cy="108" rx="2" ry="1.8" fill="#1a1810"/>
      <circle cx="3" cy="107" r="1.1" fill="#fff" opacity="0.6"/>

      <!-- 眉毛（輕鬆上揚） -->
      <path d="M-14,102 C-10,100 -8,102 -6,104" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,104 C10,102 12,100 16,102" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（冷笑露齒） -->
      <path d="M-10,128 C-4,136 4,136 8,130" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-6,130 C-2,134 2,134 6,130" fill="#4a2020"/>
      <path d="M-4,130 C-2,132 2,132 4,130" fill="#eee" opacity="0.7"/>

      <!-- ===== 左手臂（負x，叉腰） ===== -->
      <path d="M-18,134 Q-30,148 -24,162" fill="none" stroke="url(#mobPatrolArmor)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-24" cy="164" r="4.5" fill="url(#mobPatrolFace)" opacity="0.85"/>

      <!-- ===== 右手臂（正x，劍扛肩） ===== -->
      <path d="M16,134 Q26,120 28,106" fill="none" stroke="url(#mobPatrolArmor)" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== 劍（扛在肩上，斜向後，50.6px） ===== -->
      <line x1="32" y1="52.4" x2="26" y2="103" stroke="url(#mobPatrolSteel)" stroke-width="4" stroke-linecap="round"/>
      <!-- 劍格 -->
      <rect x="22" y="101" width="10" height="3" rx="1" fill="#6a5a40"/>
      <!-- 劍柄 -->
      <rect x="24" y="104" width="6" height="9" rx="1" fill="#4a3020"/>
      <!-- 握劍的手 -->
      <circle cx="28" cy="108" r="5" fill="url(#mobPatrolFace)"/>
    </g>
  </g>
</svg>