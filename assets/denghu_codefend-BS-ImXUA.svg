<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 鄧虎 — 吉卜力2頭身 面朝右（敵方）協防（挺身護人） -->
  <defs>
    <radialGradient id="denghuFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d0a880"/>
      <stop offset="100%" stop-color="#b89068"/>
    </radialGradient>
    <linearGradient id="denghuArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a4a30"/>
      <stop offset="100%" stop-color="#3a2a18"/>
    </linearGradient>
    <linearGradient id="denghuPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="denghuHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a1a08"/>
      <stop offset="100%" stop-color="#140a02"/>
    </linearGradient>
    <linearGradient id="denghuHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5a68"/>
      <stop offset="100%" stop-color="#4a4a50"/>
    </linearGradient>
    <linearGradient id="denghuAxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#999"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="221" rx="34" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（挺立站穩，前腿踏出護人） ===== -->
      <!-- 後腿 -->
      <ellipse cx="14" cy="190" rx="12" ry="17" fill="url(#denghuPants)" transform="rotate(-3,14,190)"/>
      <ellipse cx="14" cy="198" rx="10" ry="8" fill="#4a4a50" opacity="0.6"/>
      <ellipse cx="12" cy="214" rx="13" ry="7" fill="#3a2818"/>
      <!-- 前腿（向前踏出一步護人） -->
      <ellipse cx="-16" cy="188" rx="13" ry="18" fill="url(#denghuPants)" transform="rotate(8,-16,188)"/>
      <ellipse cx="-16" cy="196" rx="11" ry="8" fill="#4a4a50" opacity="0.6"/>
      <ellipse cx="-20" cy="214" rx="14" ry="7" fill="#3a2818"/>

      <!-- ===== 身體（挺立微前傾護人） ===== -->
      <ellipse cx="-2" cy="148" rx="28" ry="32" fill="url(#denghuArmor)" transform="rotate(-5,-2,148)"/>

      <!-- 肩甲 -->
      <ellipse cx="-26" cy="130" rx="12" ry="8" fill="#4a4a50" transform="rotate(-10,-26,130)"/>
      <ellipse cx="-26" cy="130" rx="10" ry="6" fill="#5a5a68" transform="rotate(-10,-26,130)"/>
      <ellipse cx="22" cy="130" rx="12" ry="8" fill="#4a4a50" transform="rotate(10,22,130)"/>
      <ellipse cx="22" cy="130" rx="10" ry="6" fill="#5a5a68" transform="rotate(10,22,130)"/>

      <!-- 紅色反叛軍綬帶 -->
      <path d="M-20,128 L12,166" fill="none" stroke="#8a2020" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
      <path d="M-20,128 L12,166" fill="none" stroke="#a03030" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

      <!-- 腰帶 -->
      <path d="M-28,170 Q-2,180 24,170" fill="none" stroke="#4a3820" stroke-width="7" stroke-linecap="round"/>
      <rect x="-7" y="168" width="10" height="10" rx="1" fill="#a08030" stroke="#806020" stroke-width="0.5"/>

      <!-- ===== 大頭（微前傾，堅毅護人） ===== -->
      <ellipse cx="0" cy="86" rx="40" ry="42" fill="url(#denghuHair)"/>

      <!-- 鐵盔 -->
      <path d="M-34,74 C-36,58 -20,40 4,38 C24,36 38,50 38,70 C38,76 34,80 28,82 L-30,82 C-34,80 -36,78 -34,74Z" fill="url(#denghuHelmet)" stroke="#3a3a44" stroke-width="0.8"/>
      <path d="M-10,48 L-6,56" fill="none" stroke="#3a3a44" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <path d="M12,44 L16,50" fill="none" stroke="#3a3a44" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <path d="M-4,80 L-6,96 L-2,96 Z" fill="#4a4a50" stroke="#3a3a44" stroke-width="0.5"/>

      <!-- 臉 -->
      <path d="M-30,82 C-34,94 -32,110 -26,120 C-20,128 -6,132 4,130 C16,128 26,120 30,108 C34,96 32,82 28,78 L-30,82Z" fill="url(#denghuFace)"/>

      <!-- 傷疤 -->
      <path d="M-16,84 L-8,80" fill="none" stroke="#a08060" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      <path d="M-22,96 L-16,110" fill="none" stroke="#a08060" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

      <!-- 鬍 -->
      <ellipse cx="-4" cy="126" rx="16" ry="8" fill="#2a1a08" opacity="0.35"/>

      <!-- 側髮 -->
      <path d="M-32,82 C-38,88 -40,100 -36,108" fill="none" stroke="url(#denghuHair)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <path d="M30,82 C36,88 38,100 34,108" fill="none" stroke="url(#denghuHair)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

      <!-- 耳朵 -->
      <path d="M26,94 C30,90 32,96 30,104 C28,108 26,106 26,100" fill="url(#denghuFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（堅毅前視，護人決心） ===== -->
      <ellipse cx="-12" cy="98" rx="7" ry="6" fill="#fff"/>
      <ellipse cx="-13" cy="99" rx="4.5" ry="5" fill="#402010"/>
      <ellipse cx="-13.5" cy="98" rx="2.5" ry="2.8" fill="#1a0800"/>
      <circle cx="-15" cy="96" r="1.7" fill="#fff" opacity="0.5"/>
      <line x1="-18" y1="96" x2="-16" y2="98" stroke="#a03020" stroke-width="0.6" opacity="0.4"/>

      <ellipse cx="8" cy="98" rx="7" ry="6" fill="#fff"/>
      <ellipse cx="7" cy="99" rx="4.5" ry="5" fill="#402010"/>
      <ellipse cx="6.5" cy="98" rx="2.5" ry="2.8" fill="#1a0800"/>
      <circle cx="5" cy="96" r="1.7" fill="#fff" opacity="0.5"/>

      <!-- 粗眉毛（堅毅皺眉） -->
      <path d="M-18,90 C-14,88 -10,90 -6,92" fill="none" stroke="#2a1a08" stroke-width="3" stroke-linecap="round"/>
      <path d="M12,92 C14,90 18,88 22,90" fill="none" stroke="#2a1a08" stroke-width="3" stroke-linecap="round"/>

      <!-- 粗鼻 -->
      <path d="M-6,104 C-8,110 -4,114" fill="none" stroke="#a08058" stroke-width="2" stroke-linecap="round"/>

      <!-- 嘴巴（緊閉堅定） -->
      <path d="M-14,122 C-8,121 0,121 6,122" fill="none" stroke="#704840" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 露齒 -->
      <line x1="-10" y1="122" x2="2" y2="122" stroke="#d8d0c0" stroke-width="1" opacity="0.3"/>

      <!-- ===== 空手臂（負x，張開護人手勢） ===== -->
      <path d="M-24,134 Q-40,142 -48,150 Q-54,156 -58,162" fill="none" stroke="url(#denghuArmor)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
      <path d="M-42,148 Q-46,144 -50,146" fill="none" stroke="#3a2818" stroke-width="5" stroke-linecap="round"/>
      <!-- 手掌（張開護人手勢） -->
      <g transform="translate(-58,162)">
        <circle cx="0" cy="0" r="6.5" fill="url(#denghuFace)" opacity="0.85"/>
        <line x1="-2" y1="-4" x2="-5" y2="-9" stroke="url(#denghuFace)" stroke-width="3" stroke-linecap="round"/>
        <line x1="-4" y1="-2" x2="-8" y2="-6" stroke="url(#denghuFace)" stroke-width="3" stroke-linecap="round"/>
        <line x1="-5" y1="0" x2="-9" y2="-2" stroke="url(#denghuFace)" stroke-width="3" stroke-linecap="round"/>
        <line x1="-4" y1="3" x2="-8" y2="2" stroke="url(#denghuFace)" stroke-width="2.4" stroke-linecap="round"/>
      </g>

      <!-- ===== 武器手臂（正x，持斧前伸護人） ===== -->
      <path d="M26,134 Q38,126 44,118" fill="none" stroke="url(#denghuArmor)" stroke-width="14" stroke-linecap="round"/>
      <path d="M36,124 Q38,120 42,118" fill="none" stroke="#3a2818" stroke-width="5" stroke-linecap="round"/>
      <!-- 握斧的手（主手） -->
      <circle cx="44" cy="118" r="6.5" fill="url(#denghuFace)"/>

      <!-- ===== 大斧（正x前伸護人） ===== -->
      <!-- 斧柄（斜向前伸） -->
      <line x1="16" y1="138" x2="72" y2="100" stroke="#5a3a20" stroke-width="5" stroke-linecap="round"/>
      <!-- 斧頭（月牙形，正x端） -->
      <path d="M64,100 C56,86 56,72 64,64 C68,60 76,60 80,66 C86,74 86,90 78,102 Z" fill="url(#denghuAxe)" stroke="#666" stroke-width="0.5"/>
      <!-- 斧刃高光 -->
      <path d="M64,64 C68,60 76,60 80,66" fill="none" stroke="#ccc" stroke-width="0.8" opacity="0.4"/>
    </g>
  </g>
</svg>