<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 賭坊打手 — 受傷待機（HP 30~60%：身體微傾、鐵棍下垂、單眼半瞇、咬牙、汗滴） -->
  <defs>
    <radialGradient id="mobEnforcerWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c4a0"/>
      <stop offset="100%" stop-color="#cca880"/>
    </radialGradient>
    <linearGradient id="mobEnforcerWCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a2a28"/>
      <stop offset="100%" stop-color="#1a1a18"/>
    </linearGradient>
    <linearGradient id="mobEnforcerWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222220"/>
      <stop offset="100%" stop-color="#121210"/>
    </linearGradient>
    <linearGradient id="mobEnforcerWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181810"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="213" rx="30" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（重心偏移） ===== -->
      <!-- 後腿 -->
      <ellipse cx="10" cy="191" rx="10" ry="16" fill="url(#mobEnforcerWPants)" transform="rotate(-5,10,191)"/>
      <ellipse cx="9" cy="207" rx="11" ry="6" fill="#1a1810"/>
      <!-- 前腿（微彎支撐） -->
      <ellipse cx="-14" cy="189" rx="11" ry="17" fill="url(#mobEnforcerWPants)" transform="rotate(8,-14,189)"/>
      <ellipse cx="-17" cy="207" rx="12" ry="6" fill="#1a1810"/>

      <!-- ===== 身體（前傾） ===== -->
      <ellipse cx="-2" cy="154" rx="24" ry="26" fill="url(#mobEnforcerWCloth)" transform="rotate(-8,-2,154)"/>

      <!-- 勁裝衣褶 -->
      <path d="M-8,138 L-5,150" fill="none" stroke="#0e0e0c" stroke-width="0.8" opacity="0.4"/>
      <path d="M8,142 L10,154" fill="none" stroke="#0e0e0c" stroke-width="0.7" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-12,132 L-4,140 L6,132" fill="none" stroke="#1a1a18" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-24,172 Q-2,178 22,172" fill="none" stroke="#1a1810" stroke-width="5" stroke-linecap="round"/>
      <rect x="-6" y="170" width="8" height="8" rx="1" fill="#404040" stroke="#303030" stroke-width="0.5"/>

      <!-- ===== 右手臂（按住腹部） ===== -->
      <path d="M20,140 Q28,156 18,172" fill="none" stroke="url(#mobEnforcerWCloth)" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
      <path d="M14,166 Q18,164 20,168" fill="none" stroke="#1a1810" stroke-width="3" stroke-linecap="round"/>
      <circle cx="18" cy="174" r="5.5" fill="url(#mobEnforcerWFace)" opacity="0.85"/>

      <!-- ===== 左手臂（持鐵棍下垂） ===== -->
      <path d="M-22,140 Q-42,148 -52,164" fill="none" stroke="url(#mobEnforcerWCloth)" stroke-width="11" stroke-linecap="round"/>
      <path d="M-40,148 Q-46,146 -48,150" fill="none" stroke="#1a1810" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 鐵棍（下垂無力） ===== -->
      <line x1="-51" y1="166" x2="-46" y2="216" stroke="#404040" stroke-width="4" stroke-linecap="round"/>
      <line x1="-50.5" y1="170" x2="-46.5" y2="212" stroke="#606060" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
      <!-- 握棍的手 -->
      <circle cx="-52" cy="168" r="5.5" fill="url(#mobEnforcerWFace)"/>

      <!-- ===== 大頭（低頭） ===== -->
      <!-- 後腦 -->
      <ellipse cx="0" cy="96" rx="36" ry="40" fill="url(#mobEnforcerWHair)"/>

      <!-- 臉（微低頭） -->
      <path d="M-26,86 C-30,96 -28,114 -24,126 C-18,134 -6,138 2,136 C12,134 20,126 24,114 C28,102 26,88 20,80 C14,74 4,72 -4,74 C-16,76 -24,80 -26,86Z" fill="url(#mobEnforcerWFace)"/>

      <!-- 腮紅 -->
      <ellipse cx="-20" cy="122" rx="5" ry="3" fill="#e0a0a0" opacity="0.3"/>

      <!-- 短髮 -->
      <path d="M-16,78 C-12,60 4,52 14,56 C22,60 26,72 22,82 C18,74 12,68 4,66 C-2,64 -8,66 -14,72" fill="url(#mobEnforcerWHair)"/>
      <path d="M-26,86 C-28,78 -30,80 -28,88 C-26,90 -26,88 -26,86" fill="url(#mobEnforcerWHair)"/>
      <path d="M20,80 C22,76 24,80 22,88 C20,90 20,88 20,86" fill="url(#mobEnforcerWHair)"/>

      <!-- 耳朵 -->
      <path d="M18,100 C22,96 24,102 22,110 C20,114 18,112 18,106" fill="url(#mobEnforcerWFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（左眼半瞇、右眼微睜） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-10" cy="106" rx="6.5" ry="3.2" fill="#fff"/>
      <ellipse cx="-11" cy="107" rx="4" ry="2.5" fill="#282020"/>
      <ellipse cx="-11.5" cy="106.5" rx="2.2" ry="1.5" fill="#100808"/>
      <circle cx="-13" cy="105.5" r="0.8" fill="#fff" opacity="0.5"/>

      <!-- 右眼（微睜） -->
      <ellipse cx="6" cy="106" rx="6.5" ry="4.5" fill="#fff"/>
      <ellipse cx="5" cy="107" rx="4" ry="3.2" fill="#282020"/>
      <ellipse cx="4.5" cy="106.5" rx="2.2" ry="2" fill="#100808"/>
      <circle cx="3" cy="105" r="1" fill="#fff" opacity="0.6"/>

      <!-- 眉毛（痛苦） -->
      <path d="M-16,99 C-12,98 -8,100 -6,102" fill="none" stroke="#181810" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M8,102 C10,100 14,98 18,100" fill="none" stroke="#181810" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 眉間皺紋 -->
      <path d="M-3,100 C-2,98 0,98 1,100" fill="none" stroke="#c0a080" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 鼻子 -->
      <path d="M-12,112 C-14,118 -10,122" fill="none" stroke="#b89868" stroke-width="1.3" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-10,128 C-4,129 2,129 6,128" fill="none" stroke="#704840" stroke-width="2" stroke-linecap="round"/>
      <path d="M-10,128 C-11,130 -12,131" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴 -->
      <path d="M-24,88 C-25,92 -24,98 -23,100" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-23" cy="101" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
    </g>
  </g>
</svg>
