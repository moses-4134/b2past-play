<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 王翦 — 吉卜力2頭身 側面朝左 協防（挺身護人） -->
  <defs>
    <radialGradient id="wangFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c0a0"/>
      <stop offset="100%" stop-color="#c8a888"/>
    </radialGradient>
    <linearGradient id="wangJacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a4030"/>
      <stop offset="100%" stop-color="#4a2820"/>
    </linearGradient>
    <linearGradient id="wangPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="100%" stop-color="#222220"/>
    </linearGradient>
    <linearGradient id="wangHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#484848"/>
    </linearGradient>
    <linearGradient id="wangSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-8" cy="224" rx="32" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（前跨一步，挺身護人） ===== -->
    <!-- 後腿（右腿，穩定支撐） -->
    <ellipse cx="16" cy="198" rx="10" ry="18" fill="url(#wangPants)" transform="rotate(-5,16,198)"/>
    <ellipse cx="14" cy="217" rx="11" ry="7" fill="#3a2818"/>
    <!-- 前腿（左腿，大步跨出） -->
    <ellipse cx="-18" cy="196" rx="10" ry="18" fill="url(#wangPants)" transform="rotate(12,-18,196)"/>
    <ellipse cx="-22" cy="217" rx="11" ry="7" fill="#3a2818"/>

    <!-- ===== 身體（挺直，如鐵壁般護人） ===== -->
    <ellipse cx="-2" cy="155" rx="27" ry="30" fill="url(#wangJacket)" transform="rotate(-3,-2,155)"/>

    <!-- 肩甲護肩 -->
    <rect x="-30" y="138" width="11" height="9" rx="2" fill="#5a3828" stroke="#4a2818" stroke-width="0.5"/>
    <rect x="18" y="138" width="11" height="9" rx="2" fill="#5a3828" stroke="#4a2818" stroke-width="0.5"/>

    <!-- 領口 -->
    <path d="M-12,139 L-6,153 L2,139" fill="none" stroke="#8a7058" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-27,180 Q-2,188 23,180" fill="none" stroke="#5a4030" stroke-width="6" stroke-linecap="round"/>
    <rect x="-8" y="178" width="8" height="8" rx="1" fill="#c8a848" stroke="#a08030" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手，握槍後段） ===== -->
    <path d="M20,144 Q36,148 40,155" fill="none" stroke="url(#wangJacket)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
    <circle cx="40" cy="157" r="5.5" fill="url(#wangFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，握槍前段，前伸護人） ===== -->
    <path d="M-26,144 Q-48,140 -56,143" fill="none" stroke="url(#wangJacket)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-56" cy="145" r="5.5" fill="url(#wangFace)"/>

    <!-- ===== 槍（前傾斜持，指向前方守護） ===== -->
    <!-- 槍桿 -->
    <line x1="-68" y1="140" x2="40" y2="155" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
    <!-- 槍頭 -->
    <path d="M-82,137 L-67.5,136 L-68.5,145 Z" fill="url(#wangSteel)" stroke="#888" stroke-width="0.5"/>
    <!-- 槍纓 -->
    <line x1="-65" y1="140" x2="-64" y2="134" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-68" y1="139.5" x2="-67" y2="133.5" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-71" y1="139" x2="-70" y2="133" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ===== 大頭（挺身護人，堅毅注視） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="95" rx="40" ry="42" fill="url(#wangHair)"/>

    <!-- 臉（國字臉） -->
    <path d="M-30,85 C-34,97 -32,113 -26,123 C-20,131 -8,135 2,133 C12,131 22,125 26,115 C30,103 28,89 22,81 C16,75 4,71 -6,73 C-18,75 -28,79 -30,85Z" fill="url(#wangFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-20,75 C-16,57 0,49 14,53 C26,57 32,69 28,79 C24,73 16,67 8,65 C0,63 -10,65 -16,71" fill="url(#wangHair)"/>

    <!-- 短瀏海 -->
    <path d="M-28,85 C-32,75 -34,79 -34,85 C-32,89 -28,89 -28,87" fill="url(#wangHair)"/>
    <path d="M-24,79 C-26,71 -30,73 -30,81 C-28,85 -24,85 -24,83" fill="#484848"/>

    <!-- 武將頭冠 -->
    <path d="M-26,73 C-18,65 0,61 18,65 C26,67 30,71 28,75" fill="none" stroke="#a07840" stroke-width="4" stroke-linecap="round"/>
    <path d="M-8,63 C-6,55 0,53 6,55 C8,57 8,61 6,63" fill="#a07840" stroke="#806030" stroke-width="0.5"/>

    <!-- 側髮 -->
    <path d="M22,81 C26,77 28,83 26,89 C24,93 22,91 22,87" fill="url(#wangHair)"/>

    <!-- 耳朵 -->
    <path d="M20,99 C24,95 26,101 24,107 C22,111 20,109 20,105" fill="url(#wangFace)" stroke="#c0a080" stroke-width="0.5"/>

    <!-- ===== 眉毛（皺眉，護人決心） ===== -->
    <path d="M-18,100 C-14,97 -8,97 -6,99" fill="none" stroke="#484848" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,100 C4,97 8,97 10,99" fill="none" stroke="#484848" stroke-width="2" stroke-linecap="round"/>

    <!-- ===== 眼睛（堅毅注視前方） ===== -->
    <!-- 左眼 -->
    <ellipse cx="-12" cy="105" rx="6" ry="5" fill="#fff"/>
    <ellipse cx="-14" cy="106" rx="4" ry="3.5" fill="#282018"/>
    <ellipse cx="-14.5" cy="105" rx="2.5" ry="2.5" fill="#100804"/>
    <circle cx="-16" cy="103.5" r="1" fill="#fff" opacity="0.6"/>

    <!-- 右眼 -->
    <ellipse cx="4" cy="105" rx="6" ry="5" fill="#fff"/>
    <ellipse cx="2" cy="106" rx="4" ry="3.5" fill="#282018"/>
    <ellipse cx="1.5" cy="105" rx="2.5" ry="2.5" fill="#100804"/>
    <circle cx="0" cy="103.5" r="1" fill="#fff" opacity="0.6"/>

    <!-- 鼻子 -->
    <path d="M-18,113 C-19,117 -17,121" fill="none" stroke="#b89870" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 八字鬍 -->
    <path d="M-16,125 C-14,127 -10,128 -8,127" fill="none" stroke="#606060" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-4,125 C-2,127 2,128 4,127" fill="none" stroke="#606060" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 下巴短鬚 -->
    <path d="M-10,131 C-8,135 -4,135 -2,131" fill="none" stroke="#606060" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-6" y1="131" x2="-6" y2="135" stroke="#606060" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

    <!-- 嘴巴（緊閉，決意守護） -->
    <path d="M-14,128 C-10,127.5 -4,127.5 0,128" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
