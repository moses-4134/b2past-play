<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 黃旗 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪、暗器撐地、喘息） -->
  <defs>
    <radialGradient id="hqcFace" cx="40%" cy="35%" r="55%"><stop offset="0%" stop-color="#e0c8a8"/><stop offset="100%" stop-color="#c8b088"/></radialGradient>
    <linearGradient id="hqcOutfit" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#4a4038"/><stop offset="100%" stop-color="#2a2420"/></linearGradient>
    <linearGradient id="hqcPants" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a3428"/><stop offset="100%" stop-color="#1a1810"/></linearGradient>
    <linearGradient id="hqcHair" x1="0.2" y1="0" x2="0.7" y2="1"><stop offset="0%" stop-color="#2a2018"/><stop offset="100%" stop-color="#141010"/></linearGradient>
  </defs>
  <g transform="translate(130, 28)">
    <ellipse cx="-4" cy="198" rx="26" ry="5.5" fill="#000" opacity="0.12"/>
    <!-- 腿（半跪） -->
    <ellipse cx="8" cy="178" rx="7.5" ry="10" fill="url(#hqcPants)" transform="rotate(-20,8,178)"/>
    <ellipse cx="2" cy="190" rx="6" ry="4" fill="url(#hqcPants)"/>
    <ellipse cx="0" cy="194" rx="7.5" ry="5" fill="#2a2018"/>
    <ellipse cx="-12" cy="174" rx="8.5" ry="14" fill="url(#hqcPants)" transform="rotate(12,-12,174)"/>
    <ellipse cx="-16" cy="194" rx="9" ry="5" fill="#2a2018"/>
    <!-- 身體（大幅前傾佝僂） -->
    <ellipse cx="-2" cy="142" rx="22" ry="23" fill="url(#hqcOutfit)" transform="rotate(-16,-2,150)"/>
    <!-- 破繩腰帶 -->
    <path d="M-20,156 Q-2,162 14,156" fill="none" stroke="#3a2818" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 破領口 -->
    <path d="M-10,122 L-5,132 L2,122" fill="none" stroke="#5a4838" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 角色左手（撐在膝蓋） -->
    <path d="M14,128 Q24,150 16,170" fill="none" stroke="url(#hqcOutfit)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <circle cx="15" cy="172" r="4" fill="url(#hqcFace)" opacity="0.85"/>
    <!-- 角色右手（撐地） -->
    <path d="M-20,128 Q-36,140 -44,156" fill="none" stroke="url(#hqcOutfit)" stroke-width="8" stroke-linecap="round"/>

    <!-- 大頭（低垂） -->
    <ellipse cx="0" cy="86" rx="34" ry="36" fill="url(#hqcHair)"/>
    <!-- 臉 -->
    <path d="M-24,82 C-28,90 -26,106 -20,116 C-14,124 -4,128 4,126 C10,124 14,118 18,108 C22,96 20,84 14,78 C8,72 2,70 -4,72 C-12,74 -22,78 -24,82Z" fill="url(#hqcFace)"/>
    <!-- 腮紅（痛苦更明顯） -->
    <ellipse cx="-18" cy="114" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.4"/>
    <!-- 髮頂 -->
    <path d="M-14,74 C-10,58 4,50 14,54 C22,58 26,66 22,74 C18,68 10,62 4,60 C-4,58 -10,62 -12,70" fill="url(#hqcHair)"/>
    <!-- 破頭巾（鬆散） -->
    <path d="M-26,78 C-20,70 -2,68 16,72 C20,74 22,76" fill="none" stroke="#4a3828" stroke-width="3" stroke-linecap="round"/>
    <path d="M22,76 C24,82 24,90 22,98" fill="none" stroke="#4a3828" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <!-- 碎髮（散亂） -->
    <path d="M-26,82 C-30,72 -32,76 -34,82 C-32,86 -28,86 -26,82" fill="url(#hqcHair)"/>
    <path d="M-22,78 C-24,70 -28,72 -28,80 C-26,84 -22,82 -22,78" fill="#2a2018"/>
    <!-- 散落髮絲 -->
    <path d="M-28,86 C-30,92 -28,96" fill="none" stroke="url(#hqcHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- 側髮 -->
    <path d="M18,78 C22,72 24,80 22,90 C20,94 18,92 18,86" fill="url(#hqcHair)"/>
    <!-- 耳朵 -->
    <path d="M18,94 C22,90 24,96 22,102 C20,106 18,104 18,100" fill="url(#hqcFace)" stroke="#c8b088" stroke-width="0.5"/>
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-10" cy="100" rx="6" ry="2" fill="#fff"/>
    <ellipse cx="-11" cy="100.5" rx="3" ry="1.5" fill="#2a1808"/>
    <ellipse cx="-11.5" cy="100" rx="1.5" ry="1" fill="#0a0404"/>
    <!-- 右眼（勉強一線） -->
    <ellipse cx="6" cy="100" rx="6" ry="2.5" fill="#fff"/>
    <ellipse cx="5" cy="100.5" rx="3" ry="2" fill="#2a1808"/>
    <ellipse cx="4.5" cy="100" rx="1.5" ry="1.2" fill="#0a0404"/>
    <circle cx="3" cy="99" r="0.8" fill="#fff" opacity="0.7"/>
    <!-- 眉間深皺 -->
    <path d="M-4,93 C-2,91 0,91 2,93" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-5,95 C-3,93.5 0,93.5 2,95" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
    <!-- 斜吊眉 -->
    <path d="M-14,93 C-11,90 -6,92 -2,94" fill="none" stroke="#2a2018" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M2,94 C6,90 12,92 15,93" fill="none" stroke="#2a2018" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 鼻子 -->
    <path d="M-12,108 C-14,112 -12,114 -10,113" fill="none" stroke="#c8b088" stroke-width="1" stroke-linecap="round"/>
    <!-- 嘴巴（喘息張開） -->
    <ellipse cx="-3" cy="119" rx="4.5" ry="4" fill="#703030"/>
    <path d="M-6.5,117 L0.5,117" fill="none" stroke="#eee" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <!-- 疤痕 -->
    <line x1="4" y1="92" x2="10" y2="106" stroke="#a08868" stroke-width="0.8" opacity="0.4"/>

    <!-- 汗滴（多顆） -->
    <path d="M-22,84 C-23,88 -22,92 -21,95" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-21" cy="96" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M18,86 C19,90 18,94" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="18" cy="95" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <ellipse cx="-6" cy="72" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>

    <!-- 手撐地 -->
    <circle cx="-44" cy="160" r="4" fill="url(#hqcFace)"/>
    <!-- 地面支撐痕跡 -->
    <ellipse cx="-44" cy="196" rx="3" ry="1.5" fill="#5a4a30" opacity="0.3"/>
  </g>
</svg>