<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 市集潑皮 — 瀕死待機（HP <30%：半跪、撐棍、喘息） -->
  <defs>
    <radialGradient id="mobThugCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c0a870"/>
    </radialGradient>
    <linearGradient id="mobThugCCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#7a6a50"/>
      <stop offset="100%" stop-color="#5a4a38"/>
    </linearGradient>
    <linearGradient id="mobThugCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4a38"/>
      <stop offset="100%" stop-color="#3a2a20"/>
    </linearGradient>
    <linearGradient id="mobThugCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#181008"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="204" rx="32" ry="5" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="8" cy="184" rx="11" ry="12" fill="url(#mobThugCPants)" transform="rotate(-20,8,184)"/>
      <ellipse cx="2" cy="196" rx="9" ry="5" fill="url(#mobThugCPants)"/>
      <ellipse cx="0" cy="200" rx="11" ry="5" fill="#3a2818"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-14" cy="178" rx="11" ry="17" fill="url(#mobThugCPants)" transform="rotate(12,-14,178)"/>
      <ellipse cx="-18" cy="200" rx="12" ry="5" fill="#3a2818"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="148" rx="22" ry="24" fill="url(#mobThugCCloth)" transform="rotate(-14,-4,148)"/>

      <!-- 敞胸 -->
      <path d="M-14,128 L-4,146 L8,128" fill="none" stroke="#5a4a38" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M-10,130 L-4,142 L4,130" fill="url(#mobThugCFace)" opacity="0.6"/>

      <!-- 刺青 -->
      <path d="M-6,134 C-4,132 -2,134 -4,136" fill="none" stroke="#3a4848" stroke-width="1" opacity="0.3"/>

      <!-- 破衣裂痕 -->
      <path d="M-10,140 L-7,150" fill="none" stroke="#3a2a20" stroke-width="0.8" opacity="0.4"/>

      <!-- 腰帶 -->
      <path d="M-24,164 Q-4,170 18,164" fill="none" stroke="#4a3820" stroke-width="5" stroke-linecap="round"/>

      <!-- ===== 右手臂（撐在膝蓋上） ===== -->
      <path d="M16,136 Q26,152 18,174" fill="none" stroke="url(#mobThugCCloth)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="17" cy="176" r="5.5" fill="url(#mobThugCFace)" opacity="0.85"/>

      <!-- ===== 左手臂（撐棍） ===== -->
      <path d="M-22,134 Q-44,142 -54,158" fill="none" stroke="url(#mobThugCCloth)" stroke-width="10" stroke-linecap="round"/>

      <!-- ===== 短棍（插地撐住身體） ===== -->
      <line x1="-56" y1="160" x2="-58" y2="204" stroke="#5a4028" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 棍插入地面效果 -->
      <ellipse cx="-58" cy="204" rx="3" ry="1.5" fill="#5a4a30" opacity="0.4"/>
      <!-- 握棍的手 -->
      <circle cx="-55" cy="162" r="5.5" fill="url(#mobThugCFace)"/>

      <!-- ===== 大頭（低垂喘息） ===== -->
      <!-- 後腦 -->
      <ellipse cx="-2" cy="94" rx="38" ry="40" fill="url(#mobThugCHair)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-30,86 C-34,96 -32,114 -28,126 C-22,134 -10,138 0,136 C12,134 20,126 24,114 C28,102 26,88 20,80 C14,74 2,70 -6,72 C-18,74 -28,80 -30,86Z" fill="url(#mobThugCFace)"/>

      <!-- 腮紅 -->
      <ellipse cx="-22" cy="122" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.4"/>

      <!-- 短髮（散亂） -->
      <path d="M-20,76 C-16,58 2,50 14,54 C22,58 26,70 22,80 C18,72 12,66 4,64 C-2,62 -10,64 -16,70" fill="url(#mobThugCHair)"/>
      <path d="M-28,84 C-32,74 -36,76 -34,86 C-32,90 -28,90 -28,86" fill="url(#mobThugCHair)"/>
      <path d="M-24,80 C-28,68 -32,72 -30,82 C-28,86 -24,86 -24,82" fill="#2a2018"/>
      <path d="M20,80 C24,74 26,80 24,88 C22,92 20,90 20,86" fill="url(#mobThugCHair)"/>
      <!-- 散落髮絲 -->
      <path d="M-32,90 C-34,96 -32,100" fill="none" stroke="url(#mobThugCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 耳朵 -->
      <path d="M18,100 C22,96 24,102 22,110 C20,114 18,112 18,106" fill="url(#mobThugCFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼瞇成線） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-12" cy="106" rx="5.5" ry="1.8" fill="#fff"/>
      <ellipse cx="-13" cy="106.5" rx="3.8" ry="1.2" fill="#3a3018"/>
      <ellipse cx="-13.5" cy="106" rx="2" ry="0.8" fill="#1a1008"/>

      <!-- 右眼 -->
      <ellipse cx="4" cy="106" rx="5.5" ry="2.2" fill="#fff"/>
      <ellipse cx="3" cy="106.5" rx="3.8" ry="1.5" fill="#3a3018"/>
      <ellipse cx="2.5" cy="106" rx="2" ry="1" fill="#1a1008"/>
      <circle cx="1" cy="105.5" r="0.7" fill="#fff" opacity="0.5"/>

      <!-- 粗眉毛（痛苦下壓） -->
      <path d="M-18,100 C-14,99 -10,101 -8,103" fill="none" stroke="#2a2018" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M6,103 C8,101 12,99 16,101" fill="none" stroke="#2a2018" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 眉間皺紋 -->
      <path d="M-5,100 C-3,98 0,98 2,100" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-6,102 C-4,100.5 -1,100.5 1,102" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 鼻子 -->
      <path d="M-16,112 C-18,116 -14,120" fill="none" stroke="#b09068" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-6" cy="127" rx="5.5" ry="4.5" fill="#703030"/>
      <path d="M-10,125 L-2,125" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

      <!-- 汗滴（多顆） -->
      <path d="M-26,88 C-27,92 -26,98 -25,101" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-25" cy="102" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M20,90 C21,94 20,98" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="20" cy="99" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-8" cy="76" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>
