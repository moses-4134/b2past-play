<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 相里衍 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪、劍撐地、忍痛維持尊嚴） -->
  <defs>
    <radialGradient id="yuanFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8d0b8"/>
      <stop offset="100%" stop-color="#d0b090"/>
    </radialGradient>
    <linearGradient id="yuanRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#283050"/>
      <stop offset="100%" stop-color="#182038"/>
    </linearGradient>
    <linearGradient id="yuanPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="yuanHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="yuanSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e8f0"/>
      <stop offset="100%" stop-color="#a0a8b0"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 28)">
    <!-- 陰影（半跪更寬） -->
    <ellipse cx="-4" cy="210" rx="32" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（半跪姿態） ===== -->
    <!-- 後腿（右腿，膝蓋撐地） -->
    <ellipse cx="8" cy="192" rx="10" ry="12" fill="url(#yuanPants)" transform="rotate(-20,8,192)"/>
    <!-- 膝蓋著地 -->
    <ellipse cx="2" cy="204" rx="8" ry="5" fill="url(#yuanPants)"/>
    <ellipse cx="0" cy="208" rx="10" ry="5" fill="#2a2018"/>
    <!-- 前腿（左腿，彎曲支撐） -->
    <ellipse cx="-16" cy="188" rx="10" ry="16" fill="url(#yuanPants)" transform="rotate(12,-16,188)"/>
    <ellipse cx="-20" cy="208" rx="11" ry="6" fill="#2a2018"/>

    <!-- ===== 身體（大幅前傾） ===== -->
    <ellipse cx="-4" cy="160" rx="27" ry="28" fill="url(#yuanRobe)" transform="rotate(-13,-4,160)"/>

    <!-- 衣襟交叉 -->
    <path d="M-16,140 L-8,156 L2,140" fill="none" stroke="#506080" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-28,178 Q-2,186 22,180" fill="none" stroke="#3a3050" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-4" cy="182" rx="3.5" ry="3" fill="#706050"/>

    <!-- ===== 畫面右側手臂（角色左手）撐在膝蓋上 ===== -->
    <path d="M18,146 Q26,162 18,182" fill="none" stroke="url(#yuanRobe)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
    <circle cx="17" cy="184" r="5.5" fill="url(#yuanFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手）劍插地撐住身體 ===== -->
    <path d="M-26,148 Q-46,156 -56,170" fill="none" stroke="url(#yuanRobe)" stroke-width="11" stroke-linecap="round"/>
    <!-- 握劍的手 -->
    <circle cx="-56" cy="172" r="5.5" fill="url(#yuanFace)"/>

    <!-- ===== 劍（插入地面當支撐，如拐杖） ===== -->
    <!-- 劍身（直插地面） -->
    <line x1="-57" y1="174" x2="-60" y2="214" stroke="url(#yuanSteel)" stroke-width="4" stroke-linecap="round"/>
    <!-- 劍身亮線 -->
    <line x1="-57" y1="174" x2="-60" y2="214" stroke="#f0f4f8" stroke-width="1.5" opacity="0.4"/>
    <!-- 劍插入地面效果 -->
    <ellipse cx="-60" cy="214" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>
    <!-- 護手 -->
    <line x1="-63" y1="172" x2="-53" y2="169" stroke="#8a7848" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-57" y1="169" x2="-58" y2="163" stroke="#4a3828" stroke-width="4" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-58" cy="161" r="2.5" fill="#8a7848"/>

    <!-- ===== 大頭（低垂，忍痛維持尊嚴） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="-2" cy="94" rx="40" ry="42" fill="url(#yuanHair)"/>

    <!-- 臉（瘦長臉，明顯低頭） -->
    <path d="M-32,88 C-36,100 -36,118 -30,130 C-24,140 -12,144 -2,142 C8,140 16,132 20,120 C24,108 22,94 16,86 C10,80 0,76 -8,78 C-20,80 -30,82 -32,88Z" fill="url(#yuanFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-22,80 C-18,60 -2,52 12,56 C24,60 30,72 26,84 C22,78 14,70 6,68 C-2,66 -12,68 -18,74" fill="url(#yuanHair)"/>

    <!-- 高髻 -->
    <ellipse cx="0" cy="52" rx="8" ry="10" fill="url(#yuanHair)"/>
    <path d="M-6,44 C-2,36 2,36 4,44" fill="url(#yuanHair)"/>
    <!-- 髻帶 -->
    <ellipse cx="0" cy="58" rx="9" ry="2.5" fill="#3a3050"/>

    <!-- 短瀏海（略散） -->
    <path d="M-30,88 C-34,78 -36,82 -36,88 C-34,92 -30,92 -30,90" fill="url(#yuanHair)"/>
    <path d="M-26,82 C-28,74 -32,76 -32,84 C-30,88 -26,88 -26,86" fill="#888888"/>
    <!-- 散落髮絲 -->
    <path d="M-34,94 C-36,100 -34,104" fill="none" stroke="url(#yuanHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- 側髮 -->
    <path d="M20,86 C24,82 26,88 24,94 C22,98 20,96 20,92" fill="url(#yuanHair)"/>

    <!-- 耳朵 -->
    <path d="M18,102 C22,98 24,104 22,110 C20,114 18,112 18,108" fill="url(#yuanFace)" stroke="#c0a880" stroke-width="0.5"/>

    <!-- ===== 眼睛（雙眼幾乎閉上，忍痛維持尊嚴） ===== -->
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-14" cy="110" rx="6.5" ry="2" fill="#fff"/>
    <ellipse cx="-15" cy="110.5" rx="4" ry="1.5" fill="#201828"/>
    <ellipse cx="-15.5" cy="110" rx="2" ry="1" fill="#0c0810"/>

    <!-- 右眼（勉強一線） -->
    <ellipse cx="2" cy="110" rx="6.5" ry="2.5" fill="#fff"/>
    <ellipse cx="1" cy="110.5" rx="4" ry="2" fill="#201828"/>
    <ellipse cx="0.5" cy="110" rx="2" ry="1.2" fill="#0c0810"/>
    <circle cx="-1" cy="109" r="0.8" fill="#fff" opacity="0.6"/>

    <!-- 眉間皺紋（深刻） -->
    <path d="M-7,103 C-5,101 -2,101 0,103" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-8,105 C-6,103.5 -3,103.5 -1,105" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

    <!-- 鼻子 -->
    <path d="M-20,118 C-21,122 -19,126" fill="none" stroke="#c0a080" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 長山羊鬚 -->
    <path d="M-12,136 C-10,142 -8,150 -9,156" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-8,136 C-6,142 -5,150 -6,156" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-4,136 C-2,142 -2,150 -3,156" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 嘴巴（緊閉一字，宗師忍痛不張嘴） -->
    <path d="M-16,133 C-12,132 -6,132 -2,133" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>

    <!-- 汗滴 -->
    <path d="M-26,92 C-27,96 -26,100 -25,103" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-25" cy="104" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <!-- 第二滴 -->
    <path d="M20,92 C21,96 20,100" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="20" cy="101" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
  </g>
</svg>