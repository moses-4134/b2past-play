<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 龍陽君 — 吉卜力2頭身 面朝右（敵方）瀕死待機（HP <30%：半跪、撐劍、喘息） -->
  <defs>
    <radialGradient id="longyangCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e8e0"/>
      <stop offset="100%" stop-color="#e0d4c8"/>
    </radialGradient>
    <linearGradient id="longyangCRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a4a30"/>
      <stop offset="100%" stop-color="#0a3020"/>
    </linearGradient>
    <linearGradient id="longyangCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#143828"/>
      <stop offset="100%" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="longyangCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#101018"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="longyangCBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dde0e8"/>
      <stop offset="100%" stop-color="#8890a0"/>
    </linearGradient>
    <linearGradient id="longyangCInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a6a40"/>
      <stop offset="100%" stop-color="#1a5030"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
  <g transform="translate(130, 28)">
    <!-- 陰影（半跪更寬） -->
    <ellipse cx="-4" cy="210" rx="34" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（半跪姿態） ===== -->
    <!-- 後腿（膝蓋撐地） -->
    <ellipse cx="8" cy="192" rx="10" ry="12" fill="url(#longyangCPants)" transform="rotate(-20,8,192)"/>
    <ellipse cx="2" cy="204" rx="8" ry="5" fill="url(#longyangCPants)"/>
    <ellipse cx="0" cy="208" rx="10" ry="5" fill="#0a2018"/>
    <!-- 前腿（彎曲支撐） -->
    <ellipse cx="-14" cy="188" rx="10" ry="16" fill="url(#longyangCPants)" transform="rotate(12,-14,188)"/>
    <ellipse cx="-18" cy="208" rx="11" ry="6" fill="#0a2018"/>

    <!-- ===== 身體（大幅前傾） ===== -->
    <ellipse cx="-4" cy="156" rx="21" ry="28" fill="url(#longyangCRobe)" transform="rotate(-14,-4,156)"/>

    <!-- 內衫領口 -->
    <path d="M-12,136 L-5,150 L2,136" fill="none" stroke="url(#longyangCInner)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 金邊裝飾（凌亂） -->
    <path d="M-22,140 Q-22,160 -18,176" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.5"/>
    <path d="M16,140 Q18,160 16,176" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.5"/>

    <!-- 領口金邊 -->
    <path d="M-13,136 L-5,151 L3,136" fill="none" stroke="#c8a840" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-22,174 Q-2,182 18,174" fill="none" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
    <rect x="-6" y="172" width="8" height="8" rx="2" fill="#3a8a50" stroke="#c8a840" stroke-width="1"/>

    <!-- ===== 右手臂（正x，撐在膝蓋上） ===== -->
    <path d="M16,144 Q26,156 18,174" fill="none" stroke="url(#longyangCRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <circle cx="17" cy="176" r="5" fill="url(#longyangCFace)" opacity="0.9"/>

    <!-- ===== 頭部（低垂喘息） ===== -->
    <!-- 長髮後方（散落） -->
    <path d="M-4,66 C18,64 32,78 34,98 C36,118 32,146 28,166 C26,172 22,170 24,162 C28,138 30,108 28,88 C26,76 14,68 0,70" fill="url(#longyangCHair)" opacity="0.85"/>
    <path d="M4,68 C22,66 36,82 38,104 C40,124 36,150 32,170 C30,176 26,174 28,166 C32,142 34,112 32,92 C30,78 18,70 6,72" fill="url(#longyangCHair)" opacity="0.6"/>

    <!-- 後腦髮量 -->
    <ellipse cx="-2" cy="92" rx="36" ry="38" fill="url(#longyangCHair)"/>

    <!-- 臉（明顯低頭） -->
    <path d="M-30,84 C-34,96 -32,112 -26,122 C-20,130 -8,134 2,132 C12,130 20,122 24,112 C28,100 26,88 20,80 C14,74 4,70 -6,72 C-16,74 -28,78 -30,84Z" fill="url(#longyangCFace)"/>

    <!-- 腮紅（因痛苦更明顯） -->
    <ellipse cx="-22" cy="120" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

    <!-- 頭髮頂部 -->
    <path d="M-20,74 C-16,56 -2,48 12,52 C22,56 28,68 24,78 C20,72 12,66 4,64 C-4,62 -12,64 -16,70" fill="url(#longyangCHair)"/>

    <!-- 瀏海（散亂） -->
    <path d="M-28,84 C-32,74 -36,76 -36,86 C-34,90 -30,90 -28,86" fill="url(#longyangCHair)"/>
    <path d="M-24,78 C-26,68 -30,70 -30,80 C-28,84 -24,84 -24,82" fill="#101018"/>
    <path d="M-20,76 C-22,66 -26,68 -24,78 C-22,82 -20,80 -20,78" fill="url(#longyangCHair)" opacity="0.7"/>
    <!-- 散落髮絲 -->
    <path d="M-32,90 C-34,96 -32,100" fill="none" stroke="url(#longyangCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- 髮髻（歪斜，快散） -->
    <ellipse cx="0" cy="52" rx="10" ry="8" fill="url(#longyangCHair)" transform="rotate(-12,0,52)"/>
    <path d="M-8,50 C-6,40 6,40 8,50" fill="url(#longyangCHair)"/>
    <!-- 玉簪（歪斜） -->
    <line x1="-8" y1="48" x2="12" y2="42" stroke="#c8a840" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="12" cy="42" r="3.5" fill="#3a8a50" stroke="#2a7a40" stroke-width="0.5"/>
    <circle cx="12" cy="42" r="1.5" fill="#5aba60" opacity="0.6"/>

    <!-- 飄逸髮絲 -->
    <path d="M16,76 C20,72 22,78 20,86 C18,92 16,90 16,84" fill="url(#longyangCHair)"/>
    <path d="M18,86 C22,84 24,92 22,100 C20,106 16,102 16,96" fill="url(#longyangCHair)" opacity="0.8"/>
    <path d="M20,98 C24,96 26,104 24,112 C22,116 18,112 18,106" fill="url(#longyangCHair)" opacity="0.5"/>

    <!-- 耳朵 -->
    <path d="M16,98 C20,94 22,100 20,106 C18,110 16,108 16,104" fill="url(#longyangCFace)" stroke="#d8c8b8" stroke-width="0.5"/>
    <!-- 翡翠耳環 -->
    <circle cx="19" cy="110" r="2" fill="#3a8a50" stroke="#2a7a40" stroke-width="0.5"/>

    <!-- ===== 眼睛（雙眼瞇成線） ===== -->
    <!-- 睫毛（散亂） -->
    <line x1="-18" y1="100" x2="-16" y2="98" stroke="#101018" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="-14" y1="99" x2="-13" y2="97" stroke="#101018" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="0" y1="100" x2="1" y2="98" stroke="#101018" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="4" y1="99" x2="5" y2="97" stroke="#101018" stroke-width="0.8" stroke-linecap="round"/>

    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-14" cy="104" rx="6.5" ry="2" fill="#fff"/>
    <ellipse cx="-15" cy="104.5" rx="3.8" ry="1.5" fill="#1a2830"/>
    <ellipse cx="-15.5" cy="104" rx="2" ry="1" fill="#0a1018"/>

    <!-- 右眼（勉強睜一線） -->
    <ellipse cx="2" cy="104" rx="6.5" ry="2.5" fill="#fff"/>
    <ellipse cx="1" cy="104.5" rx="3.8" ry="2" fill="#1a2830"/>
    <ellipse cx="0.5" cy="104" rx="2" ry="1.2" fill="#0a1018"/>
    <circle cx="-1" cy="103.5" r="0.6" fill="#fff" opacity="0.5"/>

    <!-- 眉毛（深鎖） -->
    <path d="M-20,98 C-16,95 -10,95 -8,97" fill="none" stroke="#101018" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-4,98 C0,95 6,95 8,97" fill="none" stroke="#101018" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 眉間皺紋（深刻） -->
    <path d="M-7,99 C-5,97 -2,97 0,99" fill="none" stroke="#d8c8b8" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-8,101 C-6,99.5 -3,99.5 -1,101" fill="none" stroke="#d8c8b8" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

    <!-- 鼻子 -->
    <path d="M-18,112 C-19,116 -17,120" fill="none" stroke="#d8c8b8" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（喘息張開） -->
    <ellipse cx="-6" cy="127" rx="5" ry="4.5" fill="#703030"/>
    <path d="M-10,125 L-2,125" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- ===== 左手臂（負x，劍插地撐住身體） ===== -->
    <path d="M-20,142 Q-38,150 -50,164" fill="none" stroke="url(#longyangCRobe)" stroke-width="10" stroke-linecap="round"/>
    <path d="M-44,160 Q-50,162 -50,166" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.5"/>

    <!-- ===== 劍（負x側，插入地面當支撐） ===== -->
    <circle cx="-50" cy="166" r="5.5" fill="url(#longyangCFace)"/>
    <!-- 劍身（直插地面） -->
    <line x1="-51" y1="168" x2="-54" y2="212" stroke="url(#longyangCBlade)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-51" y1="168" x2="-54" y2="212" stroke="#eef0f8" stroke-width="1.2" opacity="0.4"/>
    <!-- 劍插入地面效果 -->
    <ellipse cx="-54" cy="212" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>
    <!-- 護手 -->
    <line x1="-56" y1="165" x2="-46" y2="162" stroke="#c8a840" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-49" y1="163" x2="-48" y2="157" stroke="#3a2028" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-48" cy="155" r="2.5" fill="#c8a840"/>

    <!-- 汗滴（多顆） -->
    <path d="M-24,80 C-25,84 -24,90 -23,93" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-23" cy="94" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M20,82 C21,86 20,90" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="20" cy="91" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <!-- 額頭汗 -->
    <ellipse cx="-8" cy="74" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
  </g>
  </g>
</svg>