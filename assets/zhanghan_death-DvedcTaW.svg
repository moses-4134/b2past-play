<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 章邯 — 吉卜力2頭身 倒地（尊嚴倒下，仍握槍） -->
  <defs>
    <radialGradient id="zhanghanFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d0b090"/>
      <stop offset="100%" stop-color="#b89870"/>
    </radialGradient>
    <linearGradient id="zhanghanArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="zhanghanPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#18181e"/>
    </linearGradient>
    <linearGradient id="zhanghanHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <linearGradient id="zhanghanSpearhead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#999"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <linearGradient id="zhanghanShoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
  </defs>

  <g transform="translate(78, 10)">
    <!-- 陰影（倒地長橢圓） -->
    <ellipse cx="20" cy="226" rx="66" ry="4" fill="#000" opacity="0.08"/>

    <!-- 倒地的身體 -->
    <g transform="translate(130, 10) rotate(90,-4,176)">
      <!-- ===== 腿 ===== -->
      <!-- 後腿 -->
      <ellipse cx="14" cy="200" rx="11" ry="18" fill="url(#zhanghanPants)" transform="rotate(-3,14,200)"/>
      <ellipse cx="13" cy="218" rx="13" ry="7" fill="#222228"/>
      <rect x="6" y="206" width="14" height="10" rx="2" fill="#3a3a42" stroke="#8a7030" stroke-width="0.8" opacity="0.5"/>
      <!-- 前腿 -->
      <ellipse cx="-16" cy="200" rx="12" ry="18" fill="url(#zhanghanPants)" transform="rotate(3,-16,200)"/>
      <ellipse cx="-17" cy="218" rx="13" ry="7" fill="#222228"/>
      <rect x="-24" y="206" width="14" height="10" rx="2" fill="#3a3a42" stroke="#8a7030" stroke-width="0.8" opacity="0.6"/>

      <!-- ===== 身體 ===== -->
      <ellipse cx="-2" cy="156" rx="28" ry="32" fill="url(#zhanghanArmor)"/>

      <!-- 帝國禁衛軍徽章（暗淡） -->
      <path d="M-2,148 L4,155 L-2,162 L-8,155 Z" fill="#8a2020" stroke="#8a7030" stroke-width="0.6" opacity="0.5"/>
      <!-- 鎧甲線（褪色） -->
      <line x1="-20" y1="136" x2="-22" y2="180" stroke="#3a3a42" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
      <line x1="16" y1="136" x2="18" y2="180" stroke="#3a3a42" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

      <!-- 大肩甲 -->
      <ellipse cx="-34" cy="138" rx="13" ry="9" fill="url(#zhanghanShoulder)" stroke="#8a7030" stroke-width="0.8" opacity="0.6"/>
      <ellipse cx="24" cy="138" rx="13" ry="9" fill="url(#zhanghanShoulder)" stroke="#8a7030" stroke-width="0.8" opacity="0.6"/>

      <!-- 領口 -->
      <path d="M-12,132 L-4,148 L6,132" fill="none" stroke="#2a2a30" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>

      <!-- 紅色短披風（皺褶在身下） -->
      <path d="M-16,134 Q-20,156 -14,174" fill="none" stroke="#8a2020" stroke-width="6" stroke-linecap="round" opacity="0.3"/>

      <!-- 腰帶 -->
      <path d="M-28,180 Q-2,188 26,180" fill="none" stroke="#1a1a20" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <rect x="-8" y="177" width="12" height="10" rx="2" fill="#8a7030" stroke="#6a5020" stroke-width="0.8" opacity="0.6"/>

      <!-- ===== 手臂（仍握槍） ===== -->
      <!-- 畫面右側手臂 -->
      <path d="M26,144 Q38,156 40,172" fill="none" stroke="url(#zhanghanArmor)" stroke-width="13" stroke-linecap="round" opacity="0.8"/>
      <circle cx="40" cy="174" r="6.5" fill="url(#zhanghanFace)" opacity="0.8"/>

      <!-- 畫面左側手臂（仍握槍桿） -->
      <path d="M-26,144 Q-38,156 -40,172" fill="none" stroke="url(#zhanghanArmor)" stroke-width="13" stroke-linecap="round"/>
      <circle cx="-40" cy="174" r="6.5" fill="url(#zhanghanFace)"/>

      <!-- ===== 大頭（尊嚴，閉目） ===== -->
      <ellipse cx="0" cy="92" rx="40" ry="42" fill="url(#zhanghanHelmet)" opacity="0.85"/>

      <!-- 臉 -->
      <path d="M-30,86 C-34,96 -32,114 -26,124 C-20,132 -8,136 2,134 C12,132 22,126 26,116 C30,104 28,90 22,82 C16,76 4,72 -4,74 C-14,76 -28,80 -30,86Z" fill="url(#zhanghanFace)"/>

      <!-- 鐵盔（微歪但完整） -->
      <path d="M-32,78 C-26,60 -4,50 14,54 C28,58 36,70 32,82 C28,74 16,66 6,64 C-4,62 -16,64 -24,72" fill="url(#zhanghanHelmet)" stroke="#4a4a52" stroke-width="0.8" opacity="0.7"/>
      <path d="M-32,82 C-22,76 -6,72 14,74 C26,76 34,80 32,84" fill="none" stroke="#4a4a52" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <path d="M-28,78 C-20,64 -2,56 16,60" fill="none" stroke="#8a2020" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
      <!-- 鼻護甲 -->
      <line x1="-2" y1="78" x2="-4" y2="104" stroke="#4a4a52" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <!-- 頰甲 -->
      <path d="M-28,86 C-30,96 -28,108 -24,116" fill="none" stroke="#3a3a42" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
      <path d="M22,86 C24,96 22,108 18,116" fill="none" stroke="#3a3a42" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
      <!-- 盔頂飾（微歪） -->
      <path d="M-2,56 L0,40 L2,56" fill="#4a4a52" stroke="#3a3a42" stroke-width="0.8" opacity="0.5" transform="rotate(10,0,48)"/>

      <!-- 耳朵 -->
      <path d="M20,102 C24,98 26,104 24,110" fill="url(#zhanghanFace)" stroke="#a08860" stroke-width="0.5"/>

      <!-- ===== 眼睛（閉目，尊嚴） ===== -->
      <path d="M-17,108 C-14,111 -10,111 -7,108" fill="none" stroke="#2a2018" stroke-width="2" stroke-linecap="round"/>
      <path d="M5,108 C7,111 11,111 13,108" fill="none" stroke="#2a2018" stroke-width="2" stroke-linecap="round"/>

      <!-- 眉毛（平靜） -->
      <path d="M-18,102 C-14,100 -10,101 -7,103" fill="none" stroke="#2a1808" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M12,103 C14,101 18,100 22,102" fill="none" stroke="#2a1808" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-16,114 C-18,120 -14,124" fill="none" stroke="#a08860" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 嘴巴（緊閉，不留遺憾） -->
      <line x1="-12" y1="130" x2="6" y2="130" stroke="#805040" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- 槍（仍被握在手中，橫躺地面） -->
    <!-- 槍桿 -->
    <line x1="-50" y1="210" x2="70" y2="198" stroke="#4a4040" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- 槍頭 -->
    <path d="M-50,210 L-58,206 L-64,210 L-58,214 Z" fill="url(#zhanghanSpearhead)" stroke="#888" stroke-width="0.6" opacity="0.6"/>
    <!-- 紅纓 -->
    <circle cx="-48" cy="210" r="3" fill="#aa2020" opacity="0.5"/>
    <!-- 槍尾 -->
    <circle cx="70" cy="198" r="2.5" fill="#4a4040" opacity="0.5"/>
  </g>
</svg>