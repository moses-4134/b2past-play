<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 荒野流寇 — 受擊（後仰） -->
  <defs>
    <radialGradient id="mobRogueFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c4a470"/>
    </radialGradient>
    <linearGradient id="mobRogueArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a5040"/>
      <stop offset="100%" stop-color="#3a3830"/>
    </linearGradient>
    <linearGradient id="mobRoguePants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4030"/>
      <stop offset="100%" stop-color="#2e2820"/>
    </linearGradient>
    <linearGradient id="mobRogueHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#302820"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="mobRogueBlade" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="4" cy="205" rx="24" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（後仰踉蹌） ===== -->
      <!-- 後腿 -->
      <ellipse cx="14" cy="185" rx="9" ry="16" fill="url(#mobRoguePants)" transform="rotate(8,14,185)"/>
      <ellipse cx="16" cy="200" rx="10" ry="6" fill="#3a2818"/>
      <!-- 前腿（前滑） -->
      <ellipse cx="-8" cy="183" rx="10" ry="17" fill="url(#mobRoguePants)" transform="rotate(-10,-8,183)"/>
      <ellipse cx="-12" cy="200" rx="11" ry="6" fill="#3a2818"/>

      <!-- ===== 身體（大幅後仰） ===== -->
      <ellipse cx="2" cy="149" rx="23" ry="26" fill="url(#mobRogueArmor)" transform="rotate(15,2,149)"/>

      <!-- 皮甲細節 -->
      <path d="M-8,132 L0,144 L8,132" fill="none" stroke="#4a4030" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- 護肩片 -->
      <ellipse cx="-16" cy="130" rx="8" ry="4" fill="#4a4030" stroke="#3a3020" stroke-width="0.8" transform="rotate(10,-16,130)"/>
      <ellipse cx="20" cy="130" rx="8" ry="4" fill="#4a4030" stroke="#3a3020" stroke-width="0.8" transform="rotate(20,20,130)"/>

      <!-- 腰帶 -->
      <path d="M-18,168 Q2,174 24,168" fill="none" stroke="#4a3820" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 右手臂（角色左手，後甩） ===== -->
      <path d="M22,138 Q38,128 44,118" fill="none" stroke="url(#mobRogueArmor)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <circle cx="44" cy="116" r="5" fill="url(#mobRogueFace)" opacity="0.85"/>

      <!-- ===== 左手臂（角色右手，刀被打歪） ===== -->
      <path d="M-14,138 Q-28,130 -36,122" fill="none" stroke="url(#mobRogueArmor)" stroke-width="10" stroke-linecap="round"/>

      <!-- ===== 刀（斜飛） ===== -->
      <path d="M-58,80 Q-52,84 -48,92 Q-42,106 -40,118 L-44,120 Q-46,108 -50,94 Q-54,86 -60,82 Z" fill="url(#mobRogueBlade)" stroke="#666" stroke-width="0.5"/>
      <!-- 刀柄 -->
      <rect x="-45" y="118" width="8" height="10" rx="1" fill="#4a3020"/>
      <rect x="-46" y="117" width="10" height="3" rx="1" fill="#6a5a40"/>
      <!-- 握刀的手 -->
      <circle cx="-38" cy="124" r="5.5" fill="url(#mobRogueFace)"/>

      <!-- ===== 大頭（後仰） ===== -->
      <ellipse cx="4" cy="94" rx="36" ry="38" fill="url(#mobRogueHair)" transform="rotate(12,4,94)"/>

      <!-- 臉 -->
      <path d="M-24,88 C-28,98 -26,114 -20,126 C-14,134 -4,138 4,136 C12,134 18,126 22,116 C26,104 24,90 18,82 C12,76 2,72 -4,74 C-14,76 -22,82 -24,88Z" fill="url(#mobRogueFace)" transform="rotate(12,0,106)"/>

      <!-- 短髮 -->
      <path d="M-12,76 C-8,60 8,52 20,56 C28,60 32,70 28,80 C24,72 18,66 10,64 C4,62 -4,64 -10,70" fill="url(#mobRogueHair)" transform="rotate(12,4,66)"/>
      <path d="M-22,86 C-26,76 -28,80 -26,88 C-24,92 -22,90 -22,88" fill="url(#mobRogueHair)" transform="rotate(12,0,86)"/>
      <path d="M24,82 C28,76 30,82 28,90 C26,92 24,90 24,86" fill="url(#mobRogueHair)" transform="rotate(12,24,84)"/>

      <!-- 耳朵 -->
      <path d="M22,100 C26,96 28,102 26,108 C24,112 22,110 22,106" fill="url(#mobRogueFace)" stroke="#b09060" stroke-width="0.5" transform="rotate(12,22,104)"/>

      <!-- ===== 眼睛（瞇眼痛苦 ry=2.5） ===== -->
      <ellipse cx="-8" cy="108" rx="6" ry="2.5" fill="#fff" transform="rotate(12,0,106)"/>
      <ellipse cx="-9" cy="108" rx="3" ry="1.8" fill="#3a2818" transform="rotate(12,0,106)"/>

      <ellipse cx="8" cy="108" rx="6" ry="2.5" fill="#fff" transform="rotate(12,0,106)"/>
      <ellipse cx="7" cy="108" rx="3" ry="1.8" fill="#3a2818" transform="rotate(12,0,106)"/>

      <!-- 傷疤 -->
      <path d="M-14,100 L-4,108" fill="none" stroke="#a08060" stroke-width="1.2" opacity="0.5" stroke-linecap="round" transform="rotate(12,0,106)"/>

      <!-- 眉毛（皺成一團） -->
      <path d="M-16,102 C-12,100 -6,102 -4,104" fill="none" stroke="#302820" stroke-width="2.2" stroke-linecap="round" transform="rotate(12,0,106)"/>
      <path d="M6,104 C8,102 14,100 18,102" fill="none" stroke="#302820" stroke-width="2.2" stroke-linecap="round" transform="rotate(12,0,106)"/>

      <!-- 鼻子 -->
      <path d="M-12,116 C-14,120 -10,124" fill="none" stroke="#b09068" stroke-width="1.4" stroke-linecap="round" transform="rotate(12,0,106)"/>

      <!-- 嘴巴（痛苦張嘴） -->
      <ellipse cx="-1" cy="130" rx="5" ry="4" fill="#4a2020" transform="rotate(12,0,106)"/>
    </g>
  </g>
</svg>
