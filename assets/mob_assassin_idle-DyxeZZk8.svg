<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙嵬暗殺者 — 吉卜力2頭身 面朝右（敵方）戰鬥待機 -->
  <defs>
    <radialGradient id="mobAssassinFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8c8b8"/>
      <stop offset="100%" stop-color="#c4b4a0"/>
    </radialGradient>
    <linearGradient id="mobAssassinArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
    <linearGradient id="mobAssassinPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>
    <linearGradient id="mobAssassinHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="mobAssassinBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0a8b0"/>
      <stop offset="100%" stop-color="#606870"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="191" rx="24" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（微蹲潛伏） ===== -->
      <!-- 後腿 -->
      <ellipse cx="8" cy="170" rx="9" ry="14" fill="url(#mobAssassinPants)" transform="rotate(-5,8,170)"/>
      <ellipse cx="6" cy="185" rx="10" ry="6" fill="#0e0e14"/>
      <!-- 前腿 -->
      <ellipse cx="-10" cy="171" rx="9" ry="15" fill="url(#mobAssassinPants)" transform="rotate(5,-10,171)"/>
      <ellipse cx="-12" cy="185" rx="10" ry="6" fill="#0e0e14"/>

      <!-- ===== 身體（瘦小，微前傾） ===== -->
      <ellipse cx="-2" cy="142" rx="20" ry="22" fill="url(#mobAssassinArmor)" transform="rotate(-5,-2,142)"/>

      <!-- 夜行衣紋理 -->
      <path d="M-6,132 L-3,142" fill="none" stroke="#2a2a30" stroke-width="0.6" opacity="0.3"/>

      <!-- 領口（高領） -->
      <path d="M-8,124 L-3,132 L3,124" fill="none" stroke="#2a2a30" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶（細窄） -->
      <path d="M-18,156 Q-2,162 16,156" fill="none" stroke="#181820" stroke-width="4" stroke-linecap="round"/>
      <rect x="-4" y="154" width="5" height="5" rx="1" fill="#2a2a30" stroke="#1a1a20" stroke-width="0.5"/>

      <!-- ===== 畫面左側手臂（角色右手，握拳） ===== -->
      <path d="M-14,128 Q-28,132 -30,142" fill="none" stroke="url(#mobAssassinArmor)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
      <path d="M-24,134 Q-26,132 -28,136" fill="none" stroke="#181820" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-30" cy="144" r="4.5" fill="url(#mobAssassinFace)" opacity="0.85"/>

      <!-- ===== 畫面右側手臂（角色左手，持匕首） ===== -->
      <path d="M18,128 Q30,122 38,118" fill="none" stroke="url(#mobAssassinArmor)" stroke-width="9" stroke-linecap="round"/>
      <path d="M28,122 Q32,120 36,118" fill="none" stroke="#181820" stroke-width="2.5" stroke-linecap="round"/>

      <!-- ===== 匕首（短刃，待機） ===== -->
      <!-- 匕首刃 -->
      <line x1="42" y1="114" x2="58" y2="100" stroke="url(#mobAssassinBlade)" stroke-width="3" stroke-linecap="round"/>
      <!-- 匕首亮線 -->
      <line x1="43" y1="112" x2="59" y2="98" stroke="#c0c8d0" stroke-width="0.8" opacity="0.3"/>
      <!-- 匕首護手 -->
      <line x1="44" y1="116" x2="38" y2="114" stroke="#2a2a30" stroke-width="3" stroke-linecap="round"/>
      <!-- 匕首柄 -->
      <line x1="40" y1="116" x2="38" y2="120" stroke="#181820" stroke-width="3" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="37" cy="122" r="2" fill="#2a2a30"/>
      <!-- 握匕首的手 -->
      <circle cx="40" cy="116" r="4.5" fill="url(#mobAssassinFace)"/>

      <!-- ===== 大頭（警戒注視） ===== -->
      <!-- 後腦短髮 -->
      <ellipse cx="0" cy="102" rx="32" ry="34" fill="url(#mobAssassinHair)"/>

      <!-- 臉（較小） -->
      <path d="M-20,92 C-24,98 -22,112 -16,120 C-12,126 -4,130 2,128 C8,126 14,120 16,112 C20,102 18,92 14,86 C8,80 2,78 -2,80 C-12,82 -18,86 -20,92Z" fill="url(#mobAssassinFace)"/>

      <!-- 短髮頂部 -->
      <path d="M-14,82 C-10,66 2,60 12,64 C20,68 24,78 20,86 C16,80 10,74 4,72 C0,70 -8,72 -12,78" fill="url(#mobAssassinHair)"/>

      <!-- 側髮 -->
      <path d="M14,86 C18,82 20,88 18,94 C16,98 14,96 14,92" fill="url(#mobAssassinHair)"/>
      <path d="M-20,90 C-24,84 -26,88 -24,96 C-22,100 -20,98 -20,94" fill="url(#mobAssassinHair)"/>

      <!-- 耳朵 -->
      <path d="M14,104 C18,100 20,106 18,112 C16,116 14,114 14,110" fill="url(#mobAssassinFace)" stroke="#b0a490" stroke-width="0.5"/>

      <!-- ===== 眼睛（小而銳利） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-8" cy="108" rx="5.5" ry="5" fill="#fff"/>
      <ellipse cx="-9" cy="109" rx="3.5" ry="3.5" fill="#201820"/>
      <ellipse cx="-9.5" cy="108" rx="2" ry="2" fill="#100810"/>
      <circle cx="-11" cy="107" r="0.8" fill="#fff" opacity="0.5"/>

      <!-- 右眼 -->
      <ellipse cx="4" cy="108" rx="5.5" ry="5" fill="#fff"/>
      <ellipse cx="3" cy="109" rx="3.5" ry="3.5" fill="#201820"/>
      <ellipse cx="2.5" cy="108" rx="2" ry="2" fill="#100810"/>
      <circle cx="1" cy="107" r="0.8" fill="#fff" opacity="0.5"/>

      <!-- 眉毛 -->
      <path d="M-12,103 C-10,101 -6,102 -4,104" fill="none" stroke="#181818" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M6,104 C8,102 12,101 14,103" fill="none" stroke="#181818" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-10,114 C-12,118 -8,120" fill="none" stroke="#b0a490" stroke-width="1" stroke-linecap="round"/>

      <!-- ===== 面罩（黑色布罩遮下半臉） ===== -->
      <path d="M-18,114 C-20,118 -18,126 -14,130 C-8,134 0,136 4,134 C10,132 14,126 16,120 C18,116 16,112 14,110 L-16,110 Z" fill="#121218" opacity="0.9"/>
      <!-- 面罩布紋 -->
      <path d="M-10,118 L-7,126" fill="none" stroke="#1a1a20" stroke-width="0.6" opacity="0.4"/>
      <!-- 面罩綁帶 -->
      <path d="M-18,114 C-22,112 -24,110 -22,108" fill="none" stroke="#121218" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M16,112 C20,110 22,108 20,106" fill="none" stroke="#121218" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
