<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 韓奕 趙國密使 — 吉卜力2頭身 面朝右（敵方）防禦 -->
  <defs>
    <radialGradient id="hanyiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8dcd0"/>
      <stop offset="100%" stop-color="#d8c8b8"/>
    </radialGradient>
    <linearGradient id="hanyiRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#101830"/>
    </linearGradient>
    <linearGradient id="hanyiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="hanyiBlade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c0c8d0"/>
      <stop offset="100%" stop-color="#808890"/>
    </linearGradient>
    <linearGradient id="hanyiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="228" rx="28" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（微蹲） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="198" rx="9" ry="18" fill="url(#hanyiPants)" transform="rotate(-5,12,198)"/>
      <ellipse cx="10" cy="218" rx="10" ry="6" fill="#0e1828"/>
      <!-- 前腿 -->
      <ellipse cx="-12" cy="196" rx="10" ry="19" fill="url(#hanyiPants)" transform="rotate(5,-12,196)"/>
      <ellipse cx="-14" cy="218" rx="11" ry="6" fill="#0e1828"/>

      <!-- ===== 身體（微蹲防禦） ===== -->
      <ellipse cx="-2" cy="160" rx="24" ry="30" fill="url(#hanyiRobe)" transform="rotate(3,-2,160)"/>

      <!-- 長袍暗紋 -->
      <path d="M-12,150 L-6,172" fill="none" stroke="#2a3a5a" stroke-width="0.8" opacity="0.3"/>
      <path d="M2,147 L8,170" fill="none" stroke="#2a3a5a" stroke-width="0.8" opacity="0.3"/>
      <path d="M-20,162 L-14,182" fill="none" stroke="#2a3a5a" stroke-width="0.8" opacity="0.25"/>

      <!-- 內袍領口 -->
      <path d="M-12,140 L-4,157 L6,140" fill="none" stroke="#3a4a6a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 隱藏輕甲暗示 -->
      <path d="M-18,157 Q-2,160 16,157" fill="none" stroke="#4a5a7a" stroke-width="0.8" opacity="0.2"/>

      <!-- 腰帶 -->
      <path d="M-24,182 Q-2,190 22,182" fill="none" stroke="#2a3a5a" stroke-width="5" stroke-linecap="round"/>
      <rect x="-6" y="181" width="7" height="7" rx="1" fill="#b0b8c0" stroke="#8090a0" stroke-width="0.5"/>

      <!-- 文書袋 -->
      <rect x="10" y="178" width="8" height="10" rx="2" fill="#2a1a10" stroke="#1a0a00" stroke-width="0.5" opacity="0.7"/>

      <!-- ===== 大頭（警覺） ===== -->
      <!-- 後腦 -->
      <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#hanyiHair)"/>

      <!-- 臉 -->
      <path d="M-30,88 C-34,100 -32,116 -26,128 C-20,136 -8,140 2,138 C12,136 22,128 26,116 C30,104 28,92 22,84 C16,78 4,74 -4,76 C-18,78 -28,82 -30,88Z" fill="url(#hanyiFace)"/>

      <!-- 整齊頭髮頂部 -->
      <path d="M-20,78 C-16,58 0,50 14,54 C26,58 30,70 26,82 C22,74 14,68 6,66 C-2,64 -12,66 -16,72" fill="url(#hanyiHair)"/>

      <!-- 髮髻 -->
      <ellipse cx="2" cy="54" rx="10" ry="8" fill="url(#hanyiHair)"/>
      <path d="M-6,54 C-4,46 8,46 10,54" fill="url(#hanyiHair)"/>

      <!-- 銀髮簪 -->
      <line x1="-8" y1="52" x2="14" y2="50" stroke="#b0b8c0" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="14" cy="50" r="2" fill="#c0c8d0" stroke="#8090a0" stroke-width="0.5"/>

      <!-- 前額瀏海 -->
      <path d="M-28,86 C-30,78 -28,74 -24,80" fill="url(#hanyiHair)"/>
      <path d="M-24,82 C-26,74 -22,70 -18,78" fill="url(#hanyiHair)" opacity="0.9"/>

      <!-- 側髮 -->
      <path d="M22,84 C26,80 28,86 26,94 C24,100 22,98 22,92" fill="url(#hanyiHair)"/>

      <!-- 耳朵 -->
      <path d="M20,102 C24,98 26,104 24,112 C22,116 20,114 20,108" fill="url(#hanyiFace)" stroke="#c8b8a8" stroke-width="0.5"/>

      <!-- ===== 眼睛（警覺注視） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-12" cy="108" rx="6" ry="5.5" fill="#fff"/>
      <ellipse cx="-13" cy="109" rx="3.8" ry="4.5" fill="#1a2030"/>
      <ellipse cx="-13.5" cy="108" rx="2.2" ry="2.5" fill="#0a0a14"/>
      <circle cx="-15" cy="106.5" r="1.4" fill="#fff" opacity="0.5"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="108" rx="6" ry="5.5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.8" ry="4.5" fill="#1a2030"/>
      <ellipse cx="4.5" cy="108" rx="2.2" ry="2.5" fill="#0a0a14"/>
      <circle cx="3" cy="106.5" r="1.4" fill="#fff" opacity="0.5"/>

      <!-- 眉毛（微皺，集中） -->
      <path d="M-18,101 C-14,99 -10,100 -7,102" fill="none" stroke="#1a1a20" stroke-width="2" stroke-linecap="round"/>
      <path d="M10,102 C12,100 16,99 20,101" fill="none" stroke="#1a1a20" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -14,124" fill="none" stroke="#c8b8a0" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（緊抿） -->
      <path d="M-12,130 C-6,132 2,132 6,130" fill="none" stroke="#8a6860" stroke-width="1.8" stroke-linecap="round"/>

      <!-- ===== 空手臂（負x，護於身前） ===== -->
      <path d="M-20,150 Q-38,148 -40,160" fill="none" stroke="url(#hanyiRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <path d="M-36,154 Q-40,158 -40,162" fill="none" stroke="#2a3a5a" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <circle cx="-40" cy="162" r="5" fill="url(#hanyiFace)" opacity="0.8"/>

      <!-- ===== 武器手臂（正x，舉劍格擋） ===== -->
      <path d="M22,150 Q44,130 50,118" fill="none" stroke="url(#hanyiRobe)" stroke-width="11" stroke-linecap="round"/>
      <!-- 袖口 -->
      <path d="M40,128 Q46,122 50,118" fill="none" stroke="#2a3a5a" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

      <!-- ===== 劍（正x，舉起格擋，斜向上） ===== -->
      <!-- 握劍的手 -->
      <circle cx="50" cy="118" r="5.5" fill="url(#hanyiFace)"/>
      <!-- 劍柄 -->
      <line x1="48" y1="124" x2="52" y2="112" stroke="#3a2a1a" stroke-width="4" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="48" cy="125" r="2.5" fill="#b0b8c0"/>
      <!-- 劍護手 -->
      <line x1="48" y1="110" x2="56" y2="114" stroke="#b0b8c0" stroke-width="3" stroke-linecap="round"/>
      <!-- 劍刃（直線，~50.6px，斜向上） -->
      <line x1="52" y1="112" x2="71.5" y2="65.3" stroke="url(#hanyiBlade)" stroke-width="3" stroke-linecap="round"/>
      <!-- 劍刃亮線 -->
      <line x1="52" y1="112" x2="71.5" y2="65.3" stroke="#e0e8f0" stroke-width="0.8" opacity="0.4"/>
      <!-- 劍尖 -->
      <line x1="71.5" y1="65.3" x2="72.5" y2="62.3" stroke="#c0c8d0" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>