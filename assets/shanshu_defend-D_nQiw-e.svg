<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 山叔 — 吉卜力2頭身 側面朝左 防禦（弓橫擋） -->
  <defs>
    <radialGradient id="ssFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8d4b8"/>
