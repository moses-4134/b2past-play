    <ellipse cx="8" cy="213" rx="10" ry="6" fill="#3a2818"/>
    <ellipse cx="-10" cy="198" rx="10" ry="16" fill="url(#ssPants)" transform="rotate(4,-10,198)"/>
    <ellipse cx="-12" cy="213" rx="11" ry="6" fill="#3a2818"/>

