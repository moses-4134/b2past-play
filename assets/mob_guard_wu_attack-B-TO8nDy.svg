<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 樓家堡護院 — 攻擊（棍橫掃） -->
  <defs>
    <radialGradient id="mobGuardWuFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e4c8a0"/>
      <stop offset="100%" stop-color="#d0ac84"/>
    </radialGradient>
    <linearGradient id="mobGuardWuCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a5040"/>
      <stop offset="100%" stop-color="#3a3830"/>
    </linearGradient>
    <linearGradient id="mobGuardWuPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4038"/>
      <stop offset="100%" stop-color="#2e2820"/>
    </linearGradient>
    <linearGradient id="mobGuardWuHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-8" cy="200" rx="24" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前跨步） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="180" rx="9" ry="16" fill="url(#mobGuardWuPants)" transform="rotate(-8,12,180)"/>
      <ellipse cx="10" cy="194" rx="10" ry="6" fill="#3a2818"/>
      <!-- 前腿（前跨） -->
      <ellipse cx="-16" cy="176" rx="10" ry="17" fill="url(#mobGuardWuPants)" transform="rotate(10,-16,176)"/>
      <ellipse cx="-20" cy="192" rx="11" ry="6" fill="#3a2818"/>

      <!-- ===== 身體（前傾攻擊） ===== -->
      <ellipse cx="-4" cy="146" rx="22" ry="24" fill="url(#mobGuardWuCloth)" transform="rotate(-10,-4,146)"/>

      <!-- 領口 -->
      <path d="M-12,128 L-6,138 L2,128" fill="none" stroke="#4a4838" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-22,166 Q-4,172 16,166" fill="none" stroke="#4a3828" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 右手臂（角色左手，後擺） ===== -->
      <path d="M14,134 Q28,128 34,122" fill="none" stroke="url(#mobGuardWuCloth)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <circle cx="34" cy="120" r="5" fill="url(#mobGuardWuFace)" opacity="0.85"/>

      <!-- ===== 左手臂（角色右手，棍橫掃） ===== -->
      <path d="M-20,132 Q-38,118 -50,108" fill="none" stroke="url(#mobGuardWuCloth)" stroke-width="10" stroke-linecap="round"/>

      <!-- ===== 木棍（橫掃） ===== -->
      <line x1="-98" y1="100" x2="-46" y2="114" stroke="#6a5030" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 握棍的手 -->
      <circle cx="-50" cy="110" r="5.5" fill="url(#mobGuardWuFace)"/>

      <!-- ===== 大頭（前傾） ===== -->
      <ellipse cx="-2" cy="98" rx="34" ry="36" fill="url(#mobGuardWuHair)" transform="rotate(-5,-2,98)"/>

      <!-- 臉 -->
      <path d="M-22,90 C-26,100 -24,114 -18,122 C-12,130 -4,134 4,132 C12,130 18,124 22,114 C26,102 24,90 18,82 C12,76 2,74 -4,76 C-14,78 -20,84 -22,90Z" fill="url(#mobGuardWuFace)" transform="rotate(-5,-2,104)"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,78 C-12,60 4,52 16,56 C24,60 28,72 24,82 C20,74 14,68 6,66 C0,64 -8,66 -14,72" fill="url(#mobGuardWuHair)"/>
      <ellipse cx="2" cy="62" rx="8" ry="6" fill="url(#mobGuardWuHair)"/>

      <!-- 耳朵 -->
      <path d="M18,102 C22,98 24,104 22,110 C20,114 18,112 18,106" fill="url(#mobGuardWuFace)" stroke="#b89868" stroke-width="0.5"/>

      <!-- ===== 眼睛（用力） ===== -->
      <ellipse cx="-10" cy="106" rx="6.5" ry="6" fill="#fff"/>
      <ellipse cx="-11" cy="107" rx="4" ry="4.2" fill="#342818"/>
      <ellipse cx="-11.5" cy="106" rx="2.2" ry="2.4" fill="#1a1008"/>
      <circle cx="-13" cy="105" r="1.1" fill="#fff" opacity="0.6"/>

      <ellipse cx="6" cy="106" rx="6.5" ry="6" fill="#fff"/>
      <ellipse cx="5" cy="107" rx="4" ry="4.2" fill="#342818"/>
      <ellipse cx="4.5" cy="106" rx="2.2" ry="2.4" fill="#1a1008"/>
      <circle cx="3" cy="105" r="1.1" fill="#fff" opacity="0.6"/>

      <!-- 眉毛（皺眉用力） -->
      <path d="M-14,99 C-10,97 -8,99 -6,101" fill="none" stroke="#2a2018" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,101 C10,99 12,97 16,99" fill="none" stroke="#2a2018" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,114 C-16,118 -12,122" fill="none" stroke="#b89868" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（張嘴吼） -->
      <ellipse cx="-3" cy="128" rx="6" ry="4" fill="#4a2020"/>
      <path d="M-9,126 C-5,124 1,124 5,126" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
