<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 宮廷侍衛 — 吉卜力2頭身 面朝右（敵方）受擊 -->
  <defs>
    <radialGradient id="mobPalaceGuardFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </radialGradient>
    <linearGradient id="mobPalaceGuardArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a5a30"/>
      <stop offset="100%" stop-color="#4a3a20"/>
    </linearGradient>
    <linearGradient id="mobPalaceGuardPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a20"/>
      <stop offset="100%" stop-color="#2e2414"/>
    </linearGradient>
    <linearGradient id="mobPalaceGuardHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="mobPalaceGuardShield" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b88830"/>
      <stop offset="100%" stop-color="#785018"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <ellipse cx="-4" cy="202" rx="30" ry="5" fill="#000" opacity="0.1"/>

      <!-- 腿（受擊後退） -->
      <ellipse cx="16" cy="182" rx="11" ry="17" fill="url(#mobPalaceGuardPants)" transform="rotate(-4,16,182)"/>
      <ellipse cx="14" cy="195" rx="12" ry="7" fill="#2e2010"/>
      <ellipse cx="-8" cy="180" rx="12" ry="18" fill="url(#mobPalaceGuardPants)" transform="rotate(4,-8,180)"/>
      <ellipse cx="-10" cy="195" rx="13" ry="7" fill="#2e2010"/>

      <!-- 身體（微後仰受擊） -->
      <ellipse cx="-2" cy="148" rx="25" ry="27" fill="url(#mobPalaceGuardArmor)" transform="rotate(8,-2,148)"/>

      <path d="M-10,138 L-4,150 L4,138" fill="none" stroke="#7a6a38" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <path d="M-24,180 Q-2,187 24,180" fill="none" stroke="#4a3a20" stroke-width="5" stroke-linecap="round"/>
      <rect x="-7" y="178" width="8" height="8" rx="1" fill="#a08830" stroke="#806820" stroke-width="0.5"/>

      <!-- 畫面左側手臂（角色左手，持盾受擊後甩） -->
      <path d="M-22,146 Q-42,152 -44,160" fill="none" stroke="url(#mobPalaceGuardArmor)" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-44" cy="160" r="5" fill="url(#mobPalaceGuardFace)" opacity="0.85"/>
      <!-- 盾牌 -->
      <ellipse cx="-48" cy="158" rx="14" ry="16" fill="url(#mobPalaceGuardShield)" stroke="#3a2818" stroke-width="1"/>
      <line x1="-48" y1="142" x2="-48" y2="174" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <line x1="-60" y1="158" x2="-36" y2="158" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <circle cx="-48" cy="158" r="3.5" fill="#806040" opacity="0.4"/>
      
      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="98" rx="35" ry="37" fill="url(#mobPalaceGuardHair)"/>

      <path d="M-24,90 C-28,100 -26,114 -20,124 C-14,132 -4,136 4,134 C12,132 18,124 22,114 C26,102 24,90 18,82 C12,76 4,74 -2,76 C-12,78 -22,84 -24,90Z" fill="url(#mobPalaceGuardFace)"/>

      <path d="M-16,80 C-12,62 4,54 16,58 C24,64 28,74 24,84 C20,76 14,70 6,68 C0,66 -8,68 -14,74" fill="url(#mobPalaceGuardHair)"/>
      <path d="M-24,90 C-28,78 -30,82 -30,92 C-28,96 -24,96 -24,92" fill="url(#mobPalaceGuardHair)"/>
      <path d="M-20,84 C-24,72 -26,76 -26,86 C-24,90 -20,90 -20,86" fill="#2a1a10"/>

      <!-- 宮廷衛兵冠（微歪） -->
      <path d="M-20,75 Q2,62 24,75 Q22,69 2,58 Q-18,69 -20,75Z" fill="#a08830" stroke="#806820" stroke-width="0.8"/>
      <circle cx="2" cy="60" r="3" fill="#c0a040" stroke="#a08830" stroke-width="0.5"/>

      <path d="M18,86 C24,80 26,88 24,96 C22,100 18,98 18,94" fill="url(#mobPalaceGuardHair)"/>
      <path d="M16,102 C20,98 22,104 20,110 C18,114 16,112 16,108" fill="url(#mobPalaceGuardFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ���睛（受擊瞇眼） -->
      <ellipse cx="-10" cy="108" rx="6.5" ry="3" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="4" ry="2.2" fill="#2a2418"/>
      <ellipse cx="-11.5" cy="108" rx="2.2" ry="1.3" fill="#141208"/>
      <circle cx="-13" cy="107" r="0.7" fill="#fff" opacity="0.5"/>

      <ellipse cx="6" cy="108" rx="6.5" ry="3" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="4" ry="2.2" fill="#2a2418"/>
      <ellipse cx="4.5" cy="108" rx="2.2" ry="1.3" fill="#141208"/>
      <circle cx="3" cy="107" r="0.7" fill="#fff" opacity="0.5"/>

      <path d="M-14,100 C-10,97 -8,99 -6,101" fill="none" stroke="#2a1a10" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,101 C10,99 12,97 16,100" fill="none" stroke="#2a1a10" stroke-width="2" stroke-linecap="round"/>

      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <path d="M-10,128 C-6,127 0,127 4,128" fill="none" stroke="#704840" stroke-width="2" stroke-linecap="round"/>
      <path d="M-10,128 C-12,130 -13,131" fill="none" stroke="#704840" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

      <!-- 畫面右側手臂（角色右手，持槍，受擊偏移） -->
      <path d="M22,146 Q38,154 44,164" fill="none" stroke="url(#mobPalaceGuardArmor)" stroke-width="11" stroke-linecap="round"/>

      <!-- 槍（受擊偏移，指向下） -->
      <line x1="46" y1="166" x2="50" y2="236" stroke="#5a4028" stroke-width="4" stroke-linecap="round"/>
      <polygon points="53,242 47,242 50,252" fill="#aaa" stroke="#888" stroke-width="0.5"/>
      <circle cx="46" cy="166" r="5.5" fill="url(#mobPalaceGuardFace)"/>
    </g>
  </g>
</svg>
