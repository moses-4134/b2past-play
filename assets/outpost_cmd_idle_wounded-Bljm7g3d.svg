<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 前哨指揮官 — 吉卜力2頭身 面朝右（敵方）受傷待機（HP 30~60%） -->
  <defs>
    <radialGradient id="outpostCmdWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc0a0"/>
      <stop offset="100%" stop-color="#c4a480"/>
    </radialGradient>
    <linearGradient id="outpostCmdWArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a4030"/>
      <stop offset="100%" stop-color="#2a3020"/>
    </linearGradient>
    <linearGradient id="outpostCmdWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3020"/>
      <stop offset="100%" stop-color="#1a2010"/>
    </linearGradient>
    <linearGradient id="outpostCmdWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#383830"/>
      <stop offset="100%" stop-color="#282820"/>
    </linearGradient>
    <linearGradient id="outpostCmdWSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="220" rx="29" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（重心偏移） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="197" rx="10" ry="17" fill="url(#outpostCmdWPants)" transform="rotate(-3,12,197)"/>
      <ellipse cx="10" cy="213" rx="11" ry="7" fill="#1a2010"/>
      <!-- 前腿（微彎支撐） -->
      <ellipse cx="-12" cy="195" rx="10" ry="17" fill="url(#outpostCmdWPants)" transform="rotate(8,-12,195)"/>
      <ellipse cx="-14" cy="213" rx="11" ry="7" fill="#1a2010"/>

      <!-- ===== 身體（前傾彎腰） ===== -->
      <ellipse cx="-2" cy="157" rx="25" ry="27" fill="url(#outpostCmdWArmor)" transform="rotate(-8,-2,157)"/>

      <!-- 護臂裝飾 -->
      <path d="M-26,141 Q-28,138 -24,136" fill="none" stroke="#4a4a40" stroke-width="3" stroke-linecap="round"/>
      <path d="M20,141 Q22,138 18,136" fill="none" stroke="#4a4a40" stroke-width="3" stroke-linecap="round"/>

      <!-- 領口 -->
      <path d="M-10,137 L-4,149 L4,137" fill="none" stroke="#2a3020" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-25,176 Q-2,184 21,176" fill="none" stroke="#2a2818" stroke-width="5" stroke-linecap="round"/>
      <rect x="-6" y="174" width="7" height="7" rx="1" fill="#6a6050" stroke="#4a4030" stroke-width="0.5"/>

      <!-- ===== 角色左手（正x，按住腹部傷口） ===== -->
      <path d="M20,143 Q30,150 24,168" fill="none" stroke="url(#outpostCmdWArmor)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <path d="M26,156 Q28,154 26,160" fill="none" stroke="#4a4a40" stroke-width="3" stroke-linecap="round"/>
      <circle cx="24" cy="170" r="5" fill="url(#outpostCmdWFace)" opacity="0.85"/>

      <!-- ===== 大頭（微低頭） ===== -->
      <!-- 後腦髮量 -->
      <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#outpostCmdWHair)"/>

      <!-- 臉（微低頭） -->
      <path d="M-28,88 C-32,100 -30,116 -24,126 C-18,134 -6,138 4,136 C14,134 20,126 24,116 C28,104 26,90 20,82 C14,76 4,74 -6,76 C-16,78 -26,82 -28,88Z" fill="url(#outpostCmdWFace)"/>

      <!-- 腮紅（傷痛泛紅） -->
      <ellipse cx="-20" cy="122" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.3"/>

      <!-- 短髮頂部 -->
      <path d="M-18,78 C-14,62 2,54 16,58 C26,62 30,72 26,82 C22,76 14,70 6,68 C-2,66 -10,68 -14,74" fill="url(#outpostCmdWHair)"/>

      <!-- 短瀏海 -->
      <path d="M-24,88 C-28,78 -30,82 -30,88 C-28,92 -24,92 -24,90" fill="url(#outpostCmdWHair)"/>
      <path d="M-20,82 C-22,74 -26,76 -26,84 C-24,88 -20,88 -20,86" fill="#282820"/>

      <!-- 頭盔（暗灰） -->
      <path d="M-24,76 C-16,66 2,62 20,66 C28,68 32,72 30,76" fill="none" stroke="#4a4a40" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M-4,64 C-2,56 4,54 10,56 C12,58 12,62 10,64" fill="#4a4a40" stroke="#3a3a30" stroke-width="0.5"/>

      <!-- 側髮 -->
      <path d="M22,82 C26,78 28,84 26,90 C24,94 22,92 22,88" fill="url(#outpostCmdWHair)"/>

      <!-- 耳朵 -->
      <path d="M20,102 C24,98 26,104 24,110 C22,114 20,112 20,108" fill="url(#outpostCmdWFace)" stroke="#b09868" stroke-width="0.5"/>

      <!-- ===== 眼睛（左眼半瞇忍痛） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-12" cy="108" rx="6" ry="3.5" fill="#fff"/>
      <ellipse cx="-13" cy="109" rx="4" ry="2.8" fill="#2a2818"/>
      <ellipse cx="-13.5" cy="108" rx="2.5" ry="1.8" fill="#141008"/>
      <circle cx="-15" cy="107" r="1" fill="#fff" opacity="0.5"/>

      <!-- 右眼（微瞇但還睜著） -->
      <ellipse cx="4" cy="108" rx="6" ry="5" fill="#fff"/>
      <ellipse cx="3" cy="109" rx="4" ry="3.5" fill="#2a2818"/>
      <ellipse cx="2.5" cy="108" rx="2.5" ry="2.2" fill="#141008"/>
      <circle cx="1" cy="106.5" r="1" fill="#fff" opacity="0.5"/>

      <!-- 眉間皺紋 -->
      <path d="M-3,102 C-2,100 0,100 1,102" fill="none" stroke="#c0a080" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 眉毛（皺眉） -->
      <path d="M-18,101 C-14,99 -10,100 -6,102" fill="none" stroke="#282820" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M8,102 C12,100 16,99 20,101" fill="none" stroke="#282820" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-18,116 C-19,120 -17,124" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-14,131 C-10,131 -4,131 0,131" fill="none" stroke="#906050" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-14,131 C-15,133 -16,134" fill="none" stroke="#906050" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- ===== 角色右手（負x，持劍下垂） ===== -->
      <path d="M-24,143 Q-40,144 -48,154" fill="none" stroke="url(#outpostCmdWArmor)" stroke-width="11" stroke-linecap="round"/>
      <path d="M-36,146 Q-42,148 -46,152" fill="none" stroke="#4a4a40" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 劍（下垂無力） ===== -->
      <circle cx="-48" cy="156" r="5.5" fill="url(#outpostCmdWFace)"/>
      <!-- 劍格 -->
      <rect x="-54" y="158" width="12" height="3" rx="1" fill="#6a6050" stroke="#4a4030" stroke-width="0.5"/>
      <!-- 劍身（下垂） -->
      <line x1="-48" y1="161" x2="-46" y2="212" stroke="#aaa" stroke-width="4" stroke-linecap="round"/>
      <line x1="-47" y1="163" x2="-45" y2="210" stroke="#ddd" stroke-width="1" opacity="0.3"/>

      <!-- 汗滴 -->
      <path d="M-22,86 C-23,90 -22,94 -21,96" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-21" cy="97" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
    </g>
  </g>
</svg>