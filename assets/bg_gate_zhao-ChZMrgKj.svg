<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 邯鄲城門甕城 — 吉卜力風格：趙國灰石、陰翳肅殺、甕城重門、戰旗 地平線 y=180 -->
  <defs>
    <linearGradient id="zgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6472"/>
      <stop offset="45%" stop-color="#78828e"/>
      <stop offset="100%" stop-color="#98a0a8"/>
    </linearGradient>
    <linearGradient id="zgWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a6e72"/>
      <stop offset="100%" stop-color="#4a4e52"/>
    </linearGradient>
    <linearGradient id="zgGate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181a1c"/>
      <stop offset="100%" stop-color="#2a2c2e"/>
    </linearGradient>
    <linearGradient id="zgRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e6e70"/>
      <stop offset="100%" stop-color="#4e4e50"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#zgSky)"/>
  <!-- 陰雲 -->
  <g opacity="0.5" fill="#8a929a">
    <ellipse cx="220" cy="48" rx="90" ry="24"/><ellipse cx="170" cy="46" rx="55" ry="18"/>
    <ellipse cx="740" cy="38" rx="100" ry="22"/><ellipse cx="690" cy="36" rx="60" ry="16"/>
  </g>
  <!-- 遠飛的寒鴉 -->
  <g stroke="#3a3e42" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M300,60 q6,-6 12,0 q6,-6 12,0"/><path d="M360,80 q5,-5 10,0 q5,-5 10,0"/>
  </g>

  <!-- 城牆主體（灰石，較高厚重） -->
  <rect x="0" y="30" width="330" height="150" fill="url(#zgWall)"/>
  <rect x="630" y="30" width="330" height="150" fill="url(#zgWall)"/>
  <!-- 石塊紋理 -->
  <g stroke="#3a3e42" stroke-width="0.8" opacity="0.35">
    <line x1="0" y1="70" x2="330" y2="70"/><line x1="0" y1="105" x2="330" y2="105"/><line x1="0" y1="140" x2="330" y2="140"/><line x1="0" y1="165" x2="330" y2="165"/>
    <line x1="82" y1="30" x2="82" y2="180"/><line x1="165" y1="30" x2="165" y2="180"/><line x1="248" y1="30" x2="248" y2="180"/>
    <line x1="630" y1="70" x2="960" y2="70"/><line x1="630" y1="105" x2="960" y2="105"/><line x1="630" y1="140" x2="960" y2="140"/><line x1="630" y1="165" x2="960" y2="165"/>
    <line x1="712" y1="30" x2="712" y2="180"/><line x1="795" y1="30" x2="795" y2="180"/><line x1="878" y1="30" x2="878" y2="180"/>
  </g>
  <!-- 城垛 -->
  <g fill="#54585c">
    <rect x="0" y="18" width="42" height="18" rx="1"/><rect x="58" y="18" width="42" height="18" rx="1"/><rect x="116" y="18" width="42" height="18" rx="1"/><rect x="174" y="18" width="42" height="18" rx="1"/><rect x="232" y="18" width="42" height="18" rx="1"/><rect x="290" y="18" width="42" height="18" rx="1"/>
    <rect x="630" y="18" width="42" height="18" rx="1"/><rect x="688" y="18" width="42" height="18" rx="1"/><rect x="746" y="18" width="42" height="18" rx="1"/><rect x="804" y="18" width="42" height="18" rx="1"/><rect x="862" y="18" width="42" height="18" rx="1"/><rect x="920" y="18" width="40" height="18" rx="1"/>
  </g>

  <!-- 甕城拱洞（方額石拱，較窄壓迫） -->
  <path d="M330,180 L330,92 L390,60 L570,60 L630,92 L630,180 Z" fill="url(#zgGate)"/>
  <path d="M320,180 L320,88 L386,52 L574,52 L640,88 L640,180 L630,180 L630,92 L570,60 L390,60 L330,92 L330,180 Z" fill="#5a5e62"/>
  <!-- 門額匾 -->
  <rect x="430" y="66" width="100" height="22" fill="#3a2e22" rx="2"/>
  <rect x="434" y="69" width="92" height="16" fill="#4a3a28" rx="1"/>
  <line x1="452" y1="72" x2="452" y2="82" stroke="#9a8850" stroke-width="1.4" opacity="0.6"/>
  <line x1="480" y1="72" x2="480" y2="82" stroke="#9a8850" stroke-width="1.4" opacity="0.6"/>
  <line x1="508" y1="72" x2="508" y2="82" stroke="#9a8850" stroke-width="1.4" opacity="0.6"/>

  <!-- 門洞內甕城second gate（暗處） -->
  <rect x="360" y="100" width="240" height="80" fill="#141618" opacity="0.7"/>
  <rect x="440" y="120" width="80" height="60" fill="#0e1012" opacity="0.8"/>

  <!-- 厚重木門（半開，鐵箍） -->
  <rect x="338" y="102" width="58" height="78" fill="#3a2c20" transform="skewY(-2)"/>
  <g fill="#8a8078" opacity="0.7"><rect x="340" y="118" width="54" height="4"/><rect x="340" y="150" width="54" height="4"/></g>
  <rect x="564" y="100" width="58" height="80" fill="#3a2c20" transform="skewY(2)"/>
  <g fill="#8a8078" opacity="0.7"><rect x="566" y="118" width="54" height="4"/><rect x="566" y="150" width="54" height="4"/></g>

  <!-- 趙國戰旗（玄底，垂於門側） -->
  <rect x="292" y="70" width="5" height="80" fill="#2a2c2e"/>
  <path d="M297,74 h44 l-10,14 l10,14 h-44 z" fill="#3a2440" opacity="0.9"/>
  <circle cx="316" cy="88" r="6" fill="#8a6a9a" opacity="0.5"/>
  <rect x="663" y="70" width="5" height="80" fill="#2a2c2e"/>
  <path d="M663,74 h-44 l10,14 l-10,14 h44 z" fill="#3a2440" opacity="0.9"/>
  <circle cx="644" cy="88" r="6" fill="#8a6a9a" opacity="0.5"/>

  <!-- 石板路 -->
  <rect x="0" y="180" width="960" height="360" fill="url(#zgRoad)"/>
  <g stroke="#3e3e40" stroke-width="1" opacity="0.28">
    <line x1="0" y1="220" x2="960" y2="220"/><line x1="0" y1="265" x2="960" y2="265"/><line x1="0" y1="315" x2="960" y2="315"/><line x1="0" y1="370" x2="960" y2="370"/><line x1="0" y1="430" x2="960" y2="430"/>
  </g>
  <g stroke="#3e3e40" stroke-width="0.6" opacity="0.2">
    <line x1="120" y1="180" x2="120" y2="540"/><line x1="260" y1="180" x2="260" y2="540"/><line x1="400" y1="180" x2="400" y2="540"/><line x1="540" y1="180" x2="540" y2="540"/><line x1="680" y1="180" x2="680" y2="540"/><line x1="820" y1="180" x2="820" y2="540"/>
  </g>
  <line x1="0" y1="180" x2="960" y2="180" stroke="#34363a" stroke-width="3"/>

  <!-- 寒霧粒子 -->
  <circle cx="400" cy="150" r="1.4" fill="#c0c8d0" opacity="0.3"/>
  <circle cx="560" cy="175" r="1.2" fill="#c0c8d0" opacity="0.25"/>
  <circle cx="220" cy="200" r="1.3" fill="#c0c8d0" opacity="0.25"/>
  <circle cx="780" cy="185" r="1.4" fill="#c0c8d0" opacity="0.22"/>
  <rect width="960" height="540" fill="#40506a" opacity="0.06"/>
</svg>
