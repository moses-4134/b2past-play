<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 信陵君 — 吉卜力2頭身 側面朝左 倒地/戰敗 -->
  <defs>
    <radialGradient id="xinlingFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e0d0"/>
      <stop offset="100%" stop-color="#e0c8b0"/>
    </radialGradient>
    <linearGradient id="xinlingRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a1860"/>
      <stop offset="100%" stop-color="#2a1048"/>
    </linearGradient>
    <linearGradient id="xinlingPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1450"/>
      <stop offset="100%" stop-color="#1a0c30"/>
    </linearGradient>
    <linearGradient id="xinlingHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1020"/>
      <stop offset="100%" stop-color="#0c0610"/>
    </linearGradient>
    <linearGradient id="xinlingBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dde0e8"/>
      <stop offset="100%" stop-color="#8890a0"/>
    </linearGradient>
  </defs>

  <g transform="translate(78, 10)">
    <!-- 陰影（倒地拉長） -->
    <ellipse cx="-4" cy="228" rx="42" ry="4" fill="#000" opacity="0.08"/>

    <g transform="translate(130, 10) rotate(90,-4,176)">
      <!-- ===== 腿（放鬆垂落） ===== -->
      <!-- 後腿 -->
      <ellipse cx="10" cy="202" rx="9" ry="17" fill="url(#xinlingPants)"/>
      <ellipse cx="8" cy="218" rx="10" ry="7" fill="#1a0c30"/>
      <!-- 前腿 -->
      <ellipse cx="-12" cy="200" rx="10" ry="18" fill="url(#xinlingPants)"/>
      <ellipse cx="-14" cy="218" rx="11" ry="7" fill="#1a0c30"/>

      <!-- ===== 身體（放鬆） ===== -->
      <ellipse cx="-2" cy="162" rx="26" ry="32" fill="url(#xinlingRobe)"/>

      <!-- 金邊裝飾 -->
      <path d="M-26,145 Q-26,165 -22,185" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.5"/>
      <path d="M20,145 Q22,165 20,185" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.5"/>

      <!-- 領口 -->
      <path d="M-12,140 L-4,156 L4,140" fill="none" stroke="#c8a840" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-26,181 Q-2,189 22,181" fill="none" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
      <rect x="-7" y="179" width="8" height="8" rx="2" fill="#4a8a50" stroke="#c8a840" stroke-width="1"/>

      <!-- ===== 右側手臂（正x，自然垂落） ===== -->
      <path d="M18,150 Q30,160 28,172" fill="none" stroke="url(#xinlingRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="28" cy="174" r="5" fill="url(#xinlingFace)" opacity="0.85"/>

      <!-- ===== 左側手臂（負x，空手垂落） ===== -->
      <path d="M-24,150 Q-36,160 -40,170" fill="none" stroke="url(#xinlingRobe)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="-40" cy="172" r="5.5" fill="url(#xinlingFace)"/>

      <!-- ===== 劍（脫手掉落在身旁地上） ===== -->
      <!-- 劍身（橫躺地上） -->
      <line x1="-80" y1="192" x2="-32" y2="196" stroke="url(#xinlingBlade)" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 劍身亮線 -->
      <line x1="-80" y1="192" x2="-32" y2="196" stroke="#eef0f8" stroke-width="1.2" opacity="0.3"/>
      <!-- 劍尖 -->
      <line x1="-80" y1="192" x2="-85" y2="191" stroke="#ccd0d8" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 護手 -->
      <line x1="-34" y1="193" x2="-30" y2="200" stroke="#c8a840" stroke-width="3" stroke-linecap="round"/>
      <!-- 劍柄 -->
      <line x1="-28" y1="197" x2="-22" y2="198" stroke="#3a2028" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="-20" cy="199" r="2.5" fill="#c8a840"/>

      <!-- ===== 頭部 ===== -->
      <!-- 後腦髮量 -->
      <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#xinlingHair)"/>

      <!-- 臉 -->
      <path d="M-28,88 C-32,100 -30,116 -24,126 C-18,134 -8,138 2,136 C12,134 20,126 24,116 C28,104 26,92 20,84 C14,78 4,74 -6,76 C-16,78 -26,82 -28,88Z" fill="url(#xinlingFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-18,78 C-14,60 0,52 14,56 C24,60 30,72 26,82 C22,76 14,70 6,68 C-2,66 -10,68 -14,74" fill="url(#xinlingHair)"/>

      <!-- 瀏海（散亂） -->
      <path d="M-28,88 C-34,76 -36,80 -36,90 C-34,96 -28,96 -28,92" fill="url(#xinlingHair)"/>
      <path d="M-24,82 C-28,70 -32,74 -32,86 C-30,92 -24,92 -24,88" fill="#1a1020"/>

      <!-- 髮髻（散落） -->
      <ellipse cx="2" cy="56" rx="9" ry="7" fill="url(#xinlingHair)"/>
      <path d="M-4,54 C-2,46 6,46 8,54" fill="url(#xinlingHair)"/>
      <!-- 玉簪（歪斜） -->
      <circle cx="4" cy="52" r="3" fill="#4a8a50" stroke="#3a7a40" stroke-width="0.5" opacity="0.8"/>

      <!-- 飄逸髮絲（散落） -->
      <path d="M18,80 C24,76 26,84 24,92 C22,98 18,96 18,90" fill="url(#xinlingHair)"/>
      <path d="M20,90 C26,88 28,98 26,108 C24,114 18,110 18,102" fill="url(#xinlingHair)" opacity="0.7"/>

      <!-- 耳朵 -->
      <path d="M18,102 C22,98 24,104 22,110 C20,114 18,112 18,108" fill="url(#xinlingFace)" stroke="#d8c0a0" stroke-width="0.5"/>

      <!-- ===== 眼睛（閉眼） ===== -->
      <line x1="-16" y1="108" x2="-8" y2="108" stroke="#1a1830" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="108" x2="8" y2="108" stroke="#1a1830" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-16,116 C-17,120 -15,124" fill="none" stroke="#d8c0a0" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（一字線） -->
      <path d="M-11,132 C-7,132 -2,132 2,132" fill="none" stroke="#906050" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>