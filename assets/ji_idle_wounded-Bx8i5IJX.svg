<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 唐綺 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體前傾、劍下垂、單眼半瞇、冷酷忍痛） -->
  <defs>
    <radialGradient id="jiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f8ece0"/>
      <stop offset="100%" stop-color="#ecd8c0"/>
    </radialGradient>
    <linearGradient id="jiRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#384868"/>
      <stop offset="100%" stop-color="#283848"/>
    </linearGradient>
    <linearGradient id="jiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="jiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#18100a"/>
      <stop offset="100%" stop-color="#0c0604"/>
    </linearGradient>
    <linearGradient id="jiSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="221" rx="26" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（站穩但重心偏移） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="8" cy="198" rx="8" ry="15" fill="url(#jiPants)" transform="rotate(-3,8,198)"/>
    <ellipse cx="6" cy="213" rx="9" ry="6" fill="#2a2028"/>
    <!-- 前腿（左腿，微彎支撐） -->
    <ellipse cx="-12" cy="196" rx="9" ry="16" fill="url(#jiPants)" transform="rotate(8,-12,196)"/>
    <ellipse cx="-15" cy="213" rx="10" ry="6" fill="#2a2028"/>

    <!-- ===== 身體（前傾，忍痛） ===== -->
    <ellipse cx="-2" cy="163" rx="24" ry="26" fill="url(#jiRobe)" transform="rotate(-8,-2,163)"/>

    <!-- 銀灰色腰帶 -->
    <path d="M-24,178 Q-2,186 20,178" fill="none" stroke="#909898" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-4" cy="182" r="2.5" fill="#b0b8b8"/>

    <!-- 領口（V形，深藍邊） -->
    <path d="M-12,141 L-7,153 L0,141" fill="none" stroke="#506880" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- ===== 畫面右側手臂（角色左手，按住傷口） ===== -->
    <path d="M18,148 Q24,160 12,174" fill="none" stroke="url(#jiRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="12" cy="176" r="4.5" fill="url(#jiFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，持劍下垂） ===== -->
    <path d="M-23,149 Q-40,158 -48,172" fill="none" stroke="url(#jiRobe)" stroke-width="10" stroke-linecap="round"/>
    <!-- 握劍的手 -->
    <circle cx="-48" cy="174" r="5" fill="url(#jiFace)"/>

    <!-- ===== 劍（下垂無力） ===== -->
    <!-- 劍身 -->
    <line x1="-47" y1="176" x2="-42" y2="226" stroke="url(#jiSteel)" stroke-width="4" stroke-linecap="round"/>
    <!-- 劍身亮線 -->
    <line x1="-47" y1="176" x2="-42" y2="226" stroke="#eee" stroke-width="1.5" opacity="0.4"/>
    <!-- 劍尖 -->
    <line x1="-42" y1="226" x2="-41.5" y2="232" stroke="#ccc" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 護手 -->
    <line x1="-54" y1="173" x2="-44" y2="170" stroke="#c0a050" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-48" y1="170" x2="-50" y2="164" stroke="#5a4530" stroke-width="4" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-50" cy="162" r="2.5" fill="#c0a050"/>

    <!-- ===== 大頭（微低頭） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#jiHair)"/>

    <!-- 臉（微低頭） -->
    <path d="M-26,88 C-30,98 -28,114 -22,124 C-16,132 -6,137 4,135 C10,133 16,126 20,116 C24,104 22,92 16,84 C10,78 2,76 -4,78 C-14,80 -24,82 -26,88Z" fill="url(#jiFace)"/>

    <!-- 腮紅（冷美人泛紅） -->
    <ellipse cx="-20" cy="124" rx="7" ry="4" fill="#d8a0a0" opacity="0.35"/>

    <!-- 頭髮頂部（盤髻造型） -->
    <path d="M-18,80 C-14,60 2,52 16,56 C26,60 30,72 26,84 C22,78 14,72 6,70 C-2,68 -10,70 -14,76" fill="url(#jiHair)"/>

    <!-- 髮髻 -->
    <ellipse cx="2" cy="54" rx="14" ry="10" fill="url(#jiHair)"/>
    <ellipse cx="2" cy="52" rx="12" ry="8" fill="#18100a"/>
    <!-- 銀色小環髮飾 -->
    <circle cx="2" cy="46" r="3" fill="none" stroke="#c0c8d0" stroke-width="1.5"/>
    <circle cx="2" cy="46" r="1" fill="#d8e0e8"/>

    <!-- 瀏海 -->
    <path d="M-28,90 C-34,78 -36,82 -38,90 C-36,96 -30,98 -28,94" fill="url(#jiHair)"/>
    <path d="M-24,84 C-28,72 -32,76 -32,86 C-30,92 -24,92 -24,88" fill="#18100a"/>
    <path d="M-20,80 C-22,70 -26,72 -26,82 C-24,88 -20,88 -20,82" fill="url(#jiHair)" opacity="0.9"/>

    <!-- 側髮 -->
    <path d="M22,86 C28,80 30,88 28,96 C26,102 22,100 22,94" fill="url(#jiHair)"/>
    <path d="M24,94 C28,92 30,100 28,108 C26,114 22,110 22,104" fill="url(#jiHair)" opacity="0.8"/>
    <path d="M24,108 C28,106 30,114 28,122 C26,130 22,126 22,120" fill="url(#jiHair)" opacity="0.6"/>
    <!-- 左側散髮 -->
    <path d="M-30,94 C-32,106 -32,120 -30,134" fill="none" stroke="url(#jiHair)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M-28,90 C-30,102 -30,116 -28,130" fill="none" stroke="url(#jiHair)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- 耳朵 -->
    <path d="M20,102 C24,98 26,104 24,110 C22,114 20,112 20,108" fill="url(#jiFace)" stroke="#e0d0c0" stroke-width="0.5"/>

    <!-- ===== 眼睛（左眼半瞇忍痛、右眼微睜冷酷） ===== -->
    <!-- 左眼睫毛 -->
    <path d="M-17,100 C-14,98 -8,98 -5,100" fill="none" stroke="#18100a" stroke-width="0.8" opacity="0.4"/>
    <!-- 左眼（半瞇） -->
    <ellipse cx="-10" cy="108" rx="7.5" ry="4.5" fill="#fff"/>
    <ellipse cx="-11" cy="109" rx="5" ry="3.5" fill="#2a2830"/>
    <ellipse cx="-11.5" cy="108" rx="2.8" ry="2" fill="#101018"/>
    <circle cx="-13" cy="107" r="1.5" fill="#fff" opacity="0.7"/>

    <!-- 右眼睫毛 -->
    <path d="M-1,100 C2,98 8,98 11,100" fill="none" stroke="#18100a" stroke-width="0.8" opacity="0.4"/>
    <!-- 右眼（微睜，冷酷忍痛） -->
    <ellipse cx="6" cy="108" rx="7.5" ry="7" fill="#fff"/>
    <ellipse cx="5" cy="109" rx="5" ry="5.5" fill="#2a2830"/>
    <ellipse cx="4.5" cy="108" rx="2.8" ry="3" fill="#101018"/>
    <circle cx="3" cy="106" r="1.8" fill="#fff" opacity="0.9"/>
    <circle cx="7" cy="110" r="0.8" fill="#fff" opacity="0.5"/>

    <!-- 眉間皺紋（忍痛） -->
    <path d="M-5,104 C-4,102 -2,102 -1,104" fill="none" stroke="#c0a080" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- 鼻子 -->
    <path d="M-16,118 C-16.5,120 -15.5,121" fill="none" stroke="#e0d0c0" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴（緊咬忍痛，一字嘴下彎） -->
    <path d="M-8,128 C-5,128 -1,128 2,128" fill="none" stroke="#906050" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-8,128 C-9,129.5 -10,130.5" fill="none" stroke="#906050" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M2,128 C3,129.5 4,130.5" fill="none" stroke="#906050" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 汗滴（額頭） -->
    <path d="M-24,96 C-25,100 -24,104 -23,106" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-23" cy="107" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
  </g>
</svg>