<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 魏國貴族府邸 — 吉卜力風格：暖玉青緣、絲帳窗櫺、精緻華美（信陵君府／龍陽君府） -->
  <defs>
    <linearGradient id="wnBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20241e"/>
      <stop offset="55%" stop-color="#2c322a"/>
      <stop offset="100%" stop-color="#242820"/>
    </linearGradient>
    <linearGradient id="wnWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e0cc"/>
      <stop offset="100%" stop-color="#d0c8b0"/>
    </linearGradient>
    <linearGradient id="wnFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4436"/>
      <stop offset="100%" stop-color="#2c2820"/>
    </linearGradient>
    <linearGradient id="wnSilk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5aa090" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3a7868" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="wnGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff4d8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e8d090" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#wnBg)"/>
  <!-- 素牆 -->
  <rect x="0" y="0" width="960" height="210" fill="url(#wnWall)" opacity="0.94"/>
  <rect x="0" y="196" width="960" height="14" fill="#b8ac90" opacity="0.6"/>

  <!-- 窗櫺（月洞窗＋格柵，透青竹影） -->
  <circle cx="480" cy="95" r="72" fill="#c8d8c0" opacity="0.5"/>
  <circle cx="480" cy="95" r="72" fill="none" stroke="#8a7a58" stroke-width="4" opacity="0.7"/>
  <g stroke="#8a7a58" stroke-width="2" opacity="0.55">
    <line x1="480" y1="25" x2="480" y2="165"/><line x1="410" y1="95" x2="550" y2="95"/>
    <line x1="432" y1="47" x2="432" y2="143"/><line x1="528" y1="47" x2="528" y2="143"/>
  </g>
  <!-- 窗外竹影 -->
  <g stroke="#5a7850" stroke-width="3" opacity="0.35">
    <line x1="452" y1="40" x2="458" y2="150"/><line x1="500" y1="42" x2="506" y2="150"/>
  </g>

  <!-- 兩側絲帳（青綠垂幔） -->
  <path d="M120,0 h70 v150 q-35,30 -70,0 z" fill="url(#wnSilk)"/>
  <path d="M770,0 h70 v150 q-35,30 -70,0 z" fill="url(#wnSilk)"/>
  <g fill="#c8a850" opacity="0.5"><circle cx="155" cy="152" r="4"/><circle cx="805" cy="152" r="4"/></g>

  <!-- 立柱（朱漆） -->
  <rect x="240" y="0" width="30" height="210" fill="#9a4838" opacity="0.85"/>
  <rect x="236" y="0" width="38" height="9" fill="#7a3428"/>
  <rect x="690" y="0" width="30" height="210" fill="#9a4838" opacity="0.85"/>
  <rect x="686" y="0" width="38" height="9" fill="#7a3428"/>

  <!-- 中央長案＋香爐 -->
  <rect x="400" y="150" width="160" height="16" fill="#6a5236" rx="2"/>
  <rect x="412" y="128" width="136" height="24" fill="#5a4630" rx="2"/>
  <!-- 香爐 -->
  <ellipse cx="480" cy="128" rx="16" ry="7" fill="#b89858"/>
  <rect x="466" y="118" width="28" height="12" fill="#a88848" rx="3"/>
  <path d="M480,116 q-4,-14 2,-24 q6,10 -2,24" fill="#d8d8d0" opacity="0.3"/>
  <ellipse cx="480" cy="150" rx="180" ry="80" fill="url(#wnGlow)"/>

  <!-- 宮燈（暖玉） -->
  <circle cx="180" cy="150" r="40" fill="url(#wnGlow)"/>
  <path d="M170,120 h20 l-3,26 h-14 z" fill="#d8b850" opacity="0.6"/>
  <ellipse cx="180" cy="133" rx="4" ry="7" fill="#fff0c0" opacity="0.8"/>
  <circle cx="780" cy="150" r="40" fill="url(#wnGlow)"/>
  <path d="M770,120 h20 l-3,26 h-14 z" fill="#d8b850" opacity="0.6"/>
  <ellipse cx="780" cy="133" rx="4" ry="7" fill="#fff0c0" opacity="0.8"/>

  <!-- 地板 -->
  <rect x="0" y="210" width="960" height="330" fill="url(#wnFloor)"/>
  <g stroke="#5a5240" stroke-width="1" opacity="0.3">
    <line x1="0" y1="262" x2="960" y2="262"/><line x1="0" y1="322" x2="960" y2="322"/><line x1="0" y1="392" x2="960" y2="392"/><line x1="0" y1="470" x2="960" y2="470"/>
  </g>
  <g stroke="#5a5240" stroke-width="0.6" opacity="0.18">
    <line x1="200" y1="210" x2="200" y2="540"/><line x1="400" y1="210" x2="400" y2="540"/><line x1="560" y1="210" x2="560" y2="540"/><line x1="760" y1="210" x2="760" y2="540"/>
  </g>
  <!-- 青緣地毯 -->
  <rect x="390" y="210" width="180" height="330" fill="#3a6858" opacity="0.32"/>
  <line x1="390" y1="210" x2="390" y2="540" stroke="#c8a850" stroke-width="1" opacity="0.25"/>
  <line x1="570" y1="210" x2="570" y2="540" stroke="#c8a850" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="210" x2="960" y2="210" stroke="#1a160e" stroke-width="3"/>

  <!-- 暖塵 -->
  <circle cx="300" cy="120" r="1.2" fill="#f0e0a0" opacity="0.3"/>
  <circle cx="620" cy="100" r="1" fill="#f0e0a0" opacity="0.26"/>
  <circle cx="700" cy="140" r="1.2" fill="#f0e0a0" opacity="0.22"/>
  <rect width="960" height="540" fill="#d0b060" opacity="0.035"/>
</svg>
