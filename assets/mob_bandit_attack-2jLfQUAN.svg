<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 山野毛賊 — 攻擊（棍橫掃，嘴張開） -->
  <defs>
    <radialGradient id="mobBanditFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </radialGradient>
    <linearGradient id="mobBanditCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a5a48"/>
      <stop offset="100%" stop-color="#4a3a28"/>
    </linearGradient>
    <linearGradient id="mobBanditPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a28"/>
      <stop offset="100%" stop-color="#2e2218"/>
    </linearGradient>
    <linearGradient id="mobBanditHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#282018"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-8" cy="200" rx="24" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前跨步） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="180" rx="8" ry="15" fill="url(#mobBanditPants)" transform="rotate(-8,12,180)"/>
      <ellipse cx="10" cy="194" rx="9" ry="6" fill="#3a2818"/>
      <!-- 前腿（前跨） -->
      <ellipse cx="-16" cy="176" rx="9" ry="16" fill="url(#mobBanditPants)" transform="rotate(12,-16,176)"/>
      <ellipse cx="-20" cy="192" rx="10" ry="6" fill="#3a2818"/>

      <!-- ===== 身體（前傾攻擊） ===== -->
      <ellipse cx="-4" cy="146" rx="20" ry="22" fill="url(#mobBanditCloth)" transform="rotate(-10,-4,146)"/>

      <!-- 破衣裂痕 -->
      <path d="M-10,136 L-7,146" fill="none" stroke="#2e2218" stroke-width="0.8" opacity="0.4"/>
      <path d="M4,140 L7,150" fill="none" stroke="#2e2218" stroke-width="0.7" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-12,128 L-6,138 L2,128" fill="none" stroke="#5a4a38" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-22,164 Q-4,170 16,164" fill="none" stroke="#4a3820" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 左手臂（角色右手，後擺） ===== -->
      <path d="M14,134 Q28,128 34,122" fill="none" stroke="url(#mobBanditCloth)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="34" cy="120" r="4.5" fill="url(#mobBanditFace)" opacity="0.85"/>

      <!-- ===== 右手臂（角色右手，從右肩橫掃出棍到左側） ===== -->
      <path d="M14,134 Q-10,120 -52,108" fill="none" stroke="url(#mobBanditCloth)" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== 短棍（橫掃，近水平） ===== -->
      <line x1="-100" y1="100" x2="-48" y2="114" stroke="#5a4028" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 握棍的手 -->
      <circle cx="-52" cy="110" r="5" fill="url(#mobBanditFace)"/>

      <!-- ===== 大頭（前傾） ===== -->
      <!-- 後腦蓬亂髮 -->
      <ellipse cx="-2" cy="98" rx="34" ry="36" fill="url(#mobBanditHair)" transform="rotate(-5,-2,98)"/>

      <!-- 臉 -->
      <path d="M-22,90 C-26,100 -24,112 -18,122 C-12,130 -4,134 4,132 C10,130 14,124 18,114 C22,102 20,90 14,82 C8,76 2,74 -4,76 C-12,78 -20,84 -22,90Z" fill="url(#mobBanditFace)" transform="rotate(-5,-2,104)"/>

      <!-- 蓬亂頭髮頂部 -->
      <path d="M-16,78 C-12,60 4,52 16,56 C24,60 28,72 24,82 C20,74 14,68 6,66 C0,64 -8,66 -14,72" fill="url(#mobBanditHair)"/>

      <!-- 蓬亂瀏海 -->
      <path d="M-24,88 C-28,76 -32,80 -32,90 C-30,94 -24,94 -24,90" fill="url(#mobBanditHair)"/>
      <path d="M-20,82 C-24,70 -28,74 -28,84 C-26,88 -20,88 -20,84" fill="#3a3028"/>

      <!-- 側髮 -->
      <path d="M18,84 C24,78 26,86 24,94 C22,98 18,96 18,92" fill="url(#mobBanditHair)"/>

      <!-- 耳朵 -->
      <path d="M16,102 C20,98 22,104 20,110 C18,114 16,112 16,108" fill="url(#mobBanditFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（用力瞪） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-10" cy="106" rx="5.5" ry="6" fill="#fff"/>
      <ellipse cx="-11" cy="107" rx="3.5" ry="4" fill="#383028"/>
      <ellipse cx="-11.5" cy="106" rx="2" ry="2.2" fill="#1a1008"/>
      <circle cx="-13" cy="105" r="1" fill="#fff" opacity="0.6"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="106" rx="5.5" ry="6" fill="#fff"/>
      <ellipse cx="5" cy="107" rx="3.5" ry="4" fill="#383028"/>
      <ellipse cx="4.5" cy="106" rx="2" ry="2.2" fill="#1a1008"/>
      <circle cx="3" cy="105" r="1" fill="#fff" opacity="0.6"/>

      <!-- 眉毛（皺眉用力） -->
      <path d="M-14,99 C-10,97 -8,99 -6,101" fill="none" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,101 C10,99 12,97 16,99" fill="none" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,114 C-16,118 -12,122" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（張嘴吼叫） -->
      <ellipse cx="-3" cy="128" rx="7" ry="5" fill="#4a2020"/>
      <path d="M-10,126 C-6,124 0,124 4,126" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
