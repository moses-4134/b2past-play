<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 申魁 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體前傾、大刀下垂、右手按傷口、忍痛） -->
  <defs>
    <radialGradient id="tengFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8c8a0"/>
      <stop offset="100%" stop-color="#d0a880"/>
    </radialGradient>
    <linearGradient id="tengJacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="tengPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="100%" stop-color="#222220"/>
    </linearGradient>
    <linearGradient id="tengHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#201008"/>
      <stop offset="100%" stop-color="#100804"/>
    </linearGradient>
    <linearGradient id="tengBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="225" rx="30" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（重心偏移，前腿微彎支撐） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="12" cy="202" rx="10" ry="17" fill="url(#tengPants)" transform="rotate(-3,12,202)"/>
    <ellipse cx="10" cy="218" rx="11" ry="7" fill="#3a2818"/>
    <!-- 前腿（左腿，微彎支撐） -->
    <ellipse cx="-14" cy="200" rx="11" ry="18" fill="url(#tengPants)" transform="rotate(8,-14,200)"/>
    <ellipse cx="-17" cy="218" rx="12" ry="7" fill="#3a2818"/>

    <!-- ===== 身體（前傾彎腰，重心偏低） ===== -->
    <ellipse cx="-2" cy="162" rx="28" ry="30" fill="url(#tengJacket)" transform="rotate(-9,-2,162)"/>

    <!-- 護臂（畫面右側，角色左臂） -->
    <path d="M22,144 Q28,146 28,152" fill="none" stroke="#4a3020" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- 領口 -->
    <path d="M-14,137 L-8,151 L0,137" fill="none" stroke="#6a5838" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶（寬） -->
    <path d="M-28,183 Q-2,191 24,183" fill="none" stroke="#5a4030" stroke-width="6" stroke-linecap="round"/>
    <rect x="-8" y="181" width="8" height="8" rx="1" fill="#c8a848" stroke="#a08030" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手）按住腹部傷口 ===== -->
    <path d="M18,148 Q24,162 12,176" fill="none" stroke="url(#tengJacket)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
    <!-- 護臂 -->
    <path d="M20,154 Q24,152 24,158" fill="none" stroke="#4a3020" stroke-width="4" stroke-linecap="round"/>
    <!-- 按傷口的手 -->
    <circle cx="12" cy="178" r="5.5" fill="url(#tengFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，持大刀下垂無力） ===== -->
    <path d="M-24,150 Q-40,160 -50,174" fill="none" stroke="url(#tengJacket)" stroke-width="12" stroke-linecap="round"/>
    <!-- 護臂 -->
    <path d="M-36,156 Q-40,154 -44,156" fill="none" stroke="#4a3020" stroke-width="4" stroke-linecap="round"/>

    <!-- ===== 大刀（下垂，刀尖朝向地面） ===== -->
    <!-- 握刀的手（在柄中段） -->
    <circle cx="-50" cy="176" r="6" fill="url(#tengFace)"/>
    <!-- 刀柄 -->
    <line x1="-49" y1="170" x2="-48" y2="164" stroke="#5a4530" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-48" cy="162" r="3" fill="#a08040"/>
    <!-- 刀護手 -->
    <line x1="-56" y1="178" x2="-46" y2="174" stroke="#a08040" stroke-width="4" stroke-linecap="round"/>
    <!-- 刀身：下垂朝地面，窄底寬頂（刀尖朝下） -->
    <path d="M-50,180 L-48,220 L-46,228 L-40,224 Q-44,206 -48,182 Z" fill="url(#tengBlade)" stroke="#777" stroke-width="0.5"/>
    <!-- 刀背厚線 -->
    <line x1="-50" y1="180" x2="-48" y2="220" stroke="#999" stroke-width="2" stroke-linecap="round"/>
    <!-- 刀尖斜角切面線 -->
    <line x1="-46" y1="228" x2="-40" y2="224" stroke="#888" stroke-width="1"/>
    <!-- 刀刃亮線 -->
    <path d="M-48,182 Q-44,206 -40,224" fill="none" stroke="#ddd" stroke-width="0.8" opacity="0.3"/>

    <!-- ===== 大頭（微低頭，忍痛） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="96" rx="40" ry="42" fill="url(#tengHair)"/>

    <!-- 臉（方正寬臉，微低頭） -->
    <path d="M-30,90 C-34,102 -32,120 -26,130 C-20,138 -8,142 2,140 C12,138 22,130 26,120 C30,108 28,94 22,86 C16,80 4,76 -6,78 C-18,80 -28,84 -30,90Z" fill="url(#tengFace)"/>

    <!-- 鬍渣暗示 -->
    <ellipse cx="-8" cy="134" rx="12" ry="5" fill="#8a7060" opacity="0.15"/>

    <!-- 腮紅（傷痛泛紅） -->
    <ellipse cx="-22" cy="128" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.3"/>

    <!-- 頭髮頂部（短髮，簡潔） -->
    <path d="M-20,80 C-16,62 0,54 14,58 C26,62 32,74 28,84 C24,78 16,72 8,70 C0,68 -10,70 -16,76" fill="url(#tengHair)"/>

    <!-- 短瀏海 -->
    <path d="M-28,90 C-32,80 -34,84 -34,90 C-32,94 -28,94 -28,92" fill="url(#tengHair)"/>
    <path d="M-24,84 C-26,76 -30,78 -30,86 C-28,90 -24,90 -24,88" fill="#201008"/>

    <!-- 布巾紮帶（暗紅色，繞頭頂） -->
    <path d="M-30,82 C-20,74 0,70 20,74 C28,76 32,80 30,84" fill="none" stroke="#5a2020" stroke-width="4" stroke-linecap="round"/>
    <!-- 紮帶末端 -->
    <path d="M30,84 C32,88 34,94 32,98" fill="none" stroke="#5a2020" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- 髮髻（頭頂短束） -->
    <ellipse cx="4" cy="60" rx="8" ry="6" fill="url(#tengHair)"/>
    <path d="M-2,58 C0,50 8,50 10,58" fill="url(#tengHair)"/>

    <!-- 側髮（極短） -->
    <path d="M22,86 C26,82 28,88 26,94 C24,98 22,96 22,92" fill="url(#tengHair)"/>

    <!-- 耳朵 -->
    <path d="M20,104 C24,100 26,106 24,112 C22,116 20,114 20,110" fill="url(#tengFace)" stroke="#c8a880" stroke-width="0.5"/>

    <!-- ===== 眼睛（左眼半瞇忍痛、右眼微縮） ===== -->
    <!-- 左眼（半瞇） -->
    <ellipse cx="-12" cy="108" rx="6.5" ry="3.5" fill="#fff"/>
    <ellipse cx="-13" cy="109" rx="4" ry="2.8" fill="#2a1808"/>
    <ellipse cx="-13.5" cy="108" rx="2.2" ry="1.8" fill="#0c0400"/>
    <circle cx="-15" cy="107" r="1" fill="#fff" opacity="0.7"/>

    <!-- 右眼（微縮但還睜著） -->
    <ellipse cx="4" cy="108" rx="6.5" ry="5" fill="#fff"/>
    <ellipse cx="3" cy="109" rx="4" ry="3.8" fill="#2a1808"/>
    <ellipse cx="2.5" cy="108" rx="2.2" ry="2.2" fill="#0c0400"/>
    <circle cx="1" cy="107" r="1.2" fill="#fff" opacity="0.7"/>

    <!-- 眉間皺紋（忍痛） -->
    <path d="M-5,102 C-4,100 -2,100 -1,102" fill="none" stroke="#c0a078" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- 鼻子 -->
    <path d="M-18,118 C-19,122 -17,126" fill="none" stroke="#c0a078" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（咬牙忍痛，緊閉微下彎） -->
    <path d="M-13,132 C-9,133.5 -4,133.5 0,133" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>
    <path d="M-13,132 C-14,134 -15,135.5" fill="none" stroke="#906050" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 汗滴（額頭） -->
    <path d="M-24,92 C-25,96 -24,100 -23,103" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-23" cy="104" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
  </g>
</svg>