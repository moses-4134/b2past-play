<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 桓齮 — 吉卜力2頭身 側面朝左 攻擊（槍刺） -->
  <defs>
    <radialGradient id="huanyiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8c8a8"/>
      <stop offset="100%" stop-color="#d0b090"/>
    </radialGradient>
    <linearGradient id="huanyiJacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#3a2018"/>
    </linearGradient>
    <linearGradient id="huanyiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3530"/>
      <stop offset="100%" stop-color="#201c18"/>
    </linearGradient>
    <linearGradient id="huanyiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="huanyiSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-10" cy="222" rx="30" ry="5" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（前踏攻擊姿態） ===== -->
    <!-- 後腿（右腿，蹬地） -->
    <ellipse cx="14" cy="200" rx="9" ry="18" fill="url(#huanyiPants)" transform="rotate(-10,14,200)"/>
    <ellipse cx="12" cy="215" rx="10" ry="7" fill="#3a2818"/>
    <!-- 前腿（左腿，前踏） -->
    <ellipse cx="-20" cy="196" rx="9" ry="17" fill="url(#huanyiPants)" transform="rotate(12,-20,196)"/>
    <ellipse cx="-24" cy="215" rx="10" ry="7" fill="#3a2818"/>

    <!-- ===== 身體（前傾突刺） ===== -->
    <ellipse cx="-6" cy="157" rx="25" ry="31" fill="url(#huanyiJacket)" transform="rotate(-12,-6,157)"/>

    <!-- 肩甲護肩 -->
    <rect x="-32" y="134" width="9" height="7" rx="2" fill="#4a3020" stroke="#3a2010" stroke-width="0.5"/>
    <rect x="13" y="138" width="9" height="7" rx="2" fill="#4a3020" stroke="#3a2010" stroke-width="0.5"/>

    <!-- 領口 -->
    <path d="M-14,136 L-9,148 L-1,136" fill="none" stroke="#7a6048" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-28,178 Q-4,185 18,178" fill="none" stroke="#4a3020" stroke-width="5" stroke-linecap="round"/>
    <rect x="-10" y="176" width="7" height="7" rx="1" fill="#b89838" stroke="#907028" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手，握槍後段） ===== -->
    <path d="M14,144 Q26,152 22,166" fill="none" stroke="url(#huanyiJacket)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <circle cx="22" cy="168" r="5" fill="url(#huanyiFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，握槍前段，前伸） ===== -->
    <path d="M-28,142 Q-50,134 -62,132" fill="none" stroke="url(#huanyiJacket)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-62" cy="134" r="5" fill="url(#huanyiFace)"/>

    <!-- ===== 槍（水平前刺） ===== -->
    <!-- 槍桿 -->
    <line x1="-80" y1="127" x2="22" y2="168" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
    <!-- 槍頭 -->
    <path d="M-92.9,121.5 L-78.5,123.0 L-81.5,130.4 Z" fill="url(#huanyiSteel)" stroke="#888" stroke-width="0.5"/>
    <!-- 槍纓 -->
    <line x1="-77.2" y1="127.9" x2="-74.9" y2="122.3" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-80.0" y1="126.7" x2="-77.7" y2="121.2" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-82.7" y1="125.6" x2="-80.5" y2="120.0" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ===== 大頭（前傾攻擊） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="-4" cy="94" rx="39" ry="41" fill="url(#huanyiHair)"/>

    <!-- 臉 -->
    <path d="M-32,86 C-36,98 -34,112 -28,122 C-22,129 -12,133 -2,131 C8,129 16,124 20,114 C24,102 22,90 16,82 C10,76 0,72 -8,74 C-20,76 -30,80 -32,86Z" fill="url(#huanyiFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-22,76 C-18,58 0,50 14,54 C26,58 30,70 26,80 C22,74 14,68 6,66 C-2,64 -12,66 -18,72" fill="url(#huanyiHair)"/>

    <!-- 瀏海 -->
    <path d="M-30,86 C-34,76 -36,80 -36,86 C-34,90 -30,90 -30,88" fill="url(#huanyiHair)"/>
    <path d="M-26,80 C-28,70 -32,72 -32,82 C-30,86 -26,86 -26,84" fill="#1a1410"/>
    <path d="M-22,78 C-24,68 -28,70 -28,78 C-26,82 -22,82 -22,80" fill="url(#huanyiHair)"/>

    <!-- 年輕武將頭巾 -->
    <path d="M-28,74 C-20,67 -2,63 16,67 C24,69 26,73 24,76" fill="none" stroke="#4a3828" stroke-width="4" stroke-linecap="round"/>
    <path d="M18,72 C24,68 30,70 32,76" fill="none" stroke="#4a3828" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18,72 C26,72 32,78 30,84" fill="none" stroke="#4a3828" stroke-width="2" stroke-linecap="round"/>

    <!-- 側髮 -->
    <path d="M16,82 C20,78 22,84 20,90 C18,94 16,92 16,88" fill="url(#huanyiHair)"/>

    <!-- 耳朵 -->
    <path d="M14,100 C18,96 20,102 18,108 C16,112 14,110 14,106" fill="url(#huanyiFace)" stroke="#c8a888" stroke-width="0.5"/>

    <!-- ===== 眼睛（6.5x5.5 橫寬偏窄） ===== -->
    <!-- 左眼 -->
    <ellipse cx="-14" cy="106" rx="6.5" ry="5.5" fill="#fff"/>
    <ellipse cx="-15" cy="106.5" rx="4.2" ry="3.8" fill="#241820"/>
    <ellipse cx="-15.5" cy="106" rx="2.6" ry="2.4" fill="#0c0808"/>
    <circle cx="-17" cy="104.5" r="1.3" fill="#fff" opacity="0.7"/>

    <!-- 右眼 -->
    <ellipse cx="2" cy="106" rx="6.5" ry="5.5" fill="#fff"/>
    <ellipse cx="1" cy="106.5" rx="4.2" ry="3.8" fill="#241820"/>
    <ellipse cx="0.5" cy="106" rx="2.6" ry="2.4" fill="#0c0808"/>
    <circle cx="-1" cy="104.5" r="1.3" fill="#fff" opacity="0.7"/>

    <!-- 眉毛 -->
    <path d="M-22,100 C-18,98 -12,98 -8,100" fill="none" stroke="#1a1410" stroke-width="2" stroke-linecap="round"/>
    <path d="M-4,100 C0,98 4,98 8,100" fill="none" stroke="#1a1410" stroke-width="2" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M-20,112 C-21,116 -19,120" fill="none" stroke="#c0a078" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（微張，喝聲） -->
    <ellipse cx="-8" cy="128" rx="5" ry="2.5" fill="#704038" opacity="0.8"/>
  </g>
</svg>
