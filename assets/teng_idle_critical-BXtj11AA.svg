<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 申魁 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪、大刀插地撐身、喘息） -->
  <defs>
    <radialGradient id="tengFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8c8a0"/>
      <stop offset="100%" stop-color="#d0a880"/>
    </radialGradient>
    <linearGradient id="tengJacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="tengPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="100%" stop-color="#222220"/>
    </linearGradient>
    <linearGradient id="tengHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#201008"/>
      <stop offset="100%" stop-color="#100804"/>
    </linearGradient>
    <linearGradient id="tengBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 28)">
    <!-- 陰影（因半跪而更寬） -->
    <ellipse cx="-4" cy="210" rx="32" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（半跪姿態：後腿膝蓋著地、前腿彎曲撐住） ===== -->
    <!-- 後腿（右腿，膝蓋撐地） -->
    <ellipse cx="8" cy="192" rx="10" ry="12" fill="url(#tengPants)" transform="rotate(-20,8,192)"/>
    <!-- 膝蓋著地 -->
    <ellipse cx="2" cy="204" rx="8" ry="5" fill="url(#tengPants)"/>
    <ellipse cx="0" cy="208" rx="9" ry="5" fill="#3a2818"/>
    <!-- 前腿（左腿，彎曲支撐） -->
    <ellipse cx="-16" cy="188" rx="11" ry="16" fill="url(#tengPants)" transform="rotate(12,-16,188)"/>
    <ellipse cx="-20" cy="208" rx="12" ry="6" fill="#3a2818"/>

    <!-- ===== 身體（大幅前傾） ===== -->
    <ellipse cx="-4" cy="160" rx="28" ry="28" fill="url(#tengJacket)" transform="rotate(-15,-4,160)"/>

    <!-- 護臂（畫面右側） -->
    <path d="M20,142 Q26,144 26,150" fill="none" stroke="#4a3020" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- 領口 -->
    <path d="M-16,140 L-10,152 L-2,140" fill="none" stroke="#6a5838" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-28,178 Q-4,186 20,180" fill="none" stroke="#5a4030" stroke-width="6" stroke-linecap="round"/>
    <rect x="-8" y="176" width="8" height="8" rx="1" fill="#c8a848" stroke="#a08030" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手）撐在膝蓋上 ===== -->
    <path d="M16,146 Q24,160 16,180" fill="none" stroke="url(#tengJacket)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
    <!-- 護臂 -->
    <path d="M20,156 Q24,154 24,160" fill="none" stroke="#4a3020" stroke-width="4" stroke-linecap="round"/>
    <circle cx="15" cy="182" r="5.5" fill="url(#tengFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手）大刀插地撐住身體 ===== -->
    <path d="M-24,146 Q-44,154 -54,168" fill="none" stroke="url(#tengJacket)" stroke-width="12" stroke-linecap="round"/>
    <!-- 護臂 -->
    <path d="M-38,152 Q-42,150 -46,152" fill="none" stroke="#4a3020" stroke-width="4" stroke-linecap="round"/>
    <!-- 握刀的手（雙手握） -->
    <circle cx="-54" cy="170" r="6" fill="url(#tengFace)"/>

    <!-- ===== 大刀（插入地面當支撐） ===== -->
    <!-- 刀柄（朝上） -->
    <line x1="-55" y1="164" x2="-56" y2="156" stroke="#5a4530" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-56" cy="154" r="3" fill="#a08040"/>
    <!-- 刀護手 -->
    <line x1="-61" y1="172" x2="-49" y2="168" stroke="#a08040" stroke-width="4" stroke-linecap="round"/>
    <!-- 刀身：插入地面，窄底寬頂（刀尖插地） -->
    <path d="M-53,174 L-55,206 L-57,214 L-63,210 Q-59,194 -55,176 Z" fill="url(#tengBlade)" stroke="#777" stroke-width="0.5"/>
    <!-- 刀背厚線 -->
    <line x1="-53" y1="174" x2="-55" y2="206" stroke="#999" stroke-width="2" stroke-linecap="round"/>
    <!-- 刀尖斜角切面線 -->
    <line x1="-57" y1="214" x2="-63" y2="210" stroke="#888" stroke-width="1"/>
    <!-- 刀刃亮線 -->
    <path d="M-55,176 Q-59,194 -63,210" fill="none" stroke="#ddd" stroke-width="0.8" opacity="0.3"/>
    <!-- 刀插入地面的效果 -->
    <ellipse cx="-58" cy="214" rx="5" ry="2.5" fill="#5a4a30" opacity="0.4"/>

    <!-- ===== 大頭（低垂、喘息） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="-2" cy="94" rx="40" ry="42" fill="url(#tengHair)"/>

    <!-- 臉（方正寬臉，明顯低頭） -->
    <path d="M-32,90 C-36,102 -34,120 -28,130 C-22,138 -10,142 0,140 C10,138 18,130 22,120 C26,108 24,94 18,86 C12,80 2,76 -8,78 C-20,80 -30,82 -32,90Z" fill="url(#tengFace)"/>

    <!-- 鬍渣暗示 -->
    <ellipse cx="-10" cy="134" rx="12" ry="5" fill="#8a7060" opacity="0.15"/>

    <!-- 腮紅（因痛苦更明顯） -->
    <ellipse cx="-24" cy="126" rx="7" ry="4" fill="#e0a0a0" opacity="0.4"/>

    <!-- 頭髮頂部（短髮） -->
    <path d="M-22,80 C-18,60 -2,52 12,56 C24,60 30,72 26,84 C22,78 14,72 6,70 C-2,68 -12,70 -18,76" fill="url(#tengHair)"/>

    <!-- 短瀏海（略散亂） -->
    <path d="M-30,90 C-34,80 -36,84 -36,92 C-34,96 -30,96 -30,94" fill="url(#tengHair)"/>
    <path d="M-26,84 C-28,76 -32,78 -32,88 C-30,92 -26,92 -26,90" fill="#201008"/>
    <!-- 散落髮絲 -->
    <path d="M-34,96 C-36,102 -34,106" fill="none" stroke="url(#tengHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- 布巾紮帶（暗紅色，繞頭頂，略鬆散） -->
    <path d="M-30,82 C-20,74 0,70 20,74 C28,76 32,80 30,84" fill="none" stroke="#5a2020" stroke-width="4" stroke-linecap="round"/>
    <!-- 紮帶末端（鬆垂更長） -->
    <path d="M30,84 C32,90 34,98 32,104" fill="none" stroke="#5a2020" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- 髮髻（頭頂短束，略散） -->
    <ellipse cx="2" cy="60" rx="8" ry="6" fill="url(#tengHair)"/>
    <path d="M-4,58 C-2,50 6,50 8,58" fill="url(#tengHair)"/>

    <!-- 側髮（極短） -->
    <path d="M20,88 C24,84 26,90 24,96 C22,100 20,98 20,94" fill="url(#tengHair)"/>

    <!-- 耳朵 -->
    <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,110" fill="url(#tengFace)" stroke="#c8a880" stroke-width="0.5"/>

    <!-- ===== 眼睛（雙眼幾乎閉上，強忍痛苦） ===== -->
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-14" cy="110" rx="6.5" ry="2" fill="#fff"/>
    <ellipse cx="-15" cy="110.5" rx="4" ry="1.5" fill="#2a1808"/>
    <ellipse cx="-15.5" cy="110" rx="2" ry="1" fill="#0c0400"/>

    <!-- 右眼（勉強睜一線） -->
    <ellipse cx="2" cy="110" rx="6.5" ry="2.5" fill="#fff"/>
    <ellipse cx="1" cy="110.5" rx="4" ry="2" fill="#2a1808"/>
    <ellipse cx="0.5" cy="110" rx="2" ry="1.2" fill="#0c0400"/>
    <circle cx="-1" cy="109" r="0.8" fill="#fff" opacity="0.7"/>

    <!-- 眉間皺紋（深刻） -->
    <path d="M-7,101 C-5,99 -2,99 0,101" fill="none" stroke="#c0a078" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-8,103 C-6,101.5 -3,101.5 -1,103" fill="none" stroke="#c0a078" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

    <!-- 鼻子 -->
    <path d="M-20,118 C-21,122 -19,126" fill="none" stroke="#c0a078" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（喘息張開） -->
    <ellipse cx="-8" cy="133" rx="5.5" ry="4.5" fill="#703030"/>
    <!-- 上排牙（隱約） -->
    <path d="M-12,131 L-4,131" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <!-- 汗滴（多顆） -->
    <path d="M-26,90 C-27,94 -26,100 -25,103" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-25" cy="104" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M20,94 C21,98 20,102" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="20" cy="103" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <!-- 額頭汗 -->
    <ellipse cx="-10" cy="80" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
  </g>
</svg>