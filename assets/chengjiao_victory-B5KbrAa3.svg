<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 程蛟 — 吉卜力2頭身 面朝右（敵方）勝利（囂張大笑） -->
  <defs>
    <radialGradient id="chengjiaoFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b090"/>
      <stop offset="100%" stop-color="#c09878"/>
    </radialGradient>
    <linearGradient id="chengjiaoArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a2828"/>
      <stop offset="100%" stop-color="#4a1818"/>
    </linearGradient>
    <linearGradient id="chengjiaoPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2020"/>
      <stop offset="100%" stop-color="#1e1010"/>
    </linearGradient>
    <linearGradient id="chengjiaoBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="34" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（放鬆站立） ===== -->
      <ellipse cx="14" cy="202" rx="12" ry="17" fill="url(#chengjiaoPants)" transform="rotate(-3,14,202)"/>
      <ellipse cx="12" cy="218" rx="13" ry="7" fill="#3a2018"/>
      <ellipse cx="-14" cy="200" rx="13" ry="18" fill="url(#chengjiaoPants)" transform="rotate(3,-14,200)"/>
      <ellipse cx="-16" cy="218" rx="14" ry="7" fill="#3a2018"/>

      <!-- ===== 身體（微後仰放鬆，囂張） ===== -->
      <ellipse cx="-2" cy="158" rx="30" ry="32" fill="url(#chengjiaoArmor)" transform="rotate(5,-2,160)"/>

      <!-- 肩甲 -->
      <path d="M-28,138 Q-34,134 -36,140 Q-32,148 -26,148" fill="#5a2020" stroke="#4a1818" stroke-width="0.8"/>
      <path d="M24,138 Q30,134 32,140 Q28,148 22,148" fill="#5a2020" stroke="#4a1818" stroke-width="0.8"/>

      <!-- 領口 -->
      <path d="M-12,135 L-6,149 L4,135" fill="none" stroke="#7a3030" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-30,182 Q-2,191 28,182" fill="none" stroke="#4a2818" stroke-width="7" stroke-linecap="round"/>
      <rect x="-8" y="180" width="10" height="10" rx="1" fill="#a08030" stroke="#806020" stroke-width="0.5"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="94" rx="40" ry="42" fill="#c09070"/>
      <ellipse cx="-6" cy="72" rx="18" ry="12" fill="#d0a080" opacity="0.4"/>

      <!-- 臉 -->
      <path d="M-30,86 C-34,98 -32,116 -26,128 C-20,136 -6,142 4,140 C14,138 24,128 28,116 C32,104 30,92 24,84 C18,78 6,74 -4,76 C-16,78 -28,80 -30,86Z" fill="url(#chengjiaoFace)"/>

      <!-- 傷疤 -->
      <path d="M-8,78 L6,90" fill="none" stroke="#a08060" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 耳朵 -->
      <path d="M22,100 C26,96 28,102 26,110 C24,114 22,112 22,106" fill="url(#chengjiaoFace)" stroke="#b08860" stroke-width="0.5"/>

      <!-- ===== 眼睛（囂張得意） ===== -->
      <ellipse cx="-12" cy="106" rx="7" ry="5.5" fill="#fff"/>
      <ellipse cx="-13" cy="107" rx="4.5" ry="4.2" fill="#3a1810"/>
      <ellipse cx="-13.5" cy="106" rx="2.5" ry="2.5" fill="#1a0800"/>
      <circle cx="-15" cy="104.5" r="1.3" fill="#fff" opacity="0.55"/>

      <ellipse cx="6" cy="106" rx="7" ry="5.5" fill="#fff"/>
      <ellipse cx="5" cy="107" rx="4.5" ry="4.2" fill="#3a1810"/>
      <ellipse cx="4.5" cy="106" rx="2.5" ry="2.5" fill="#1a0800"/>
      <circle cx="3" cy="104.5" r="1.3" fill="#fff" opacity="0.55"/>

      <!-- 粗眉毛（微挑=得意） -->
      <path d="M-18,97 C-14,95 -10,97 -8,99" fill="none" stroke="#5a3828" stroke-width="3" stroke-linecap="round"/>
      <path d="M10,99 C12,97 16,95 20,97" fill="none" stroke="#5a3828" stroke-width="3" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-18,114 C-20,120 -16,124" fill="none" stroke="#a08058" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 嘴巴（囂張大笑，露齒） -->
      <path d="M-16,128 C-10,136 0,136 6,128" fill="none" stroke="#704840" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="-4" cy="132" rx="7" ry="4" fill="#502020"/>
      <line x1="-9" y1="131" x2="1" y2="131" stroke="#d8d0c0" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

      <!-- ===== 畫面左側手臂（角色左手，叉腰囂張） ===== -->
      <path d="M-24,146 Q-40,158 -36,174" fill="none" stroke="url(#chengjiaoArmor)" stroke-width="13" stroke-linecap="round" opacity="0.8"/>
      <circle cx="-36" cy="176" r="6.5" fill="url(#chengjiaoFace)" opacity="0.85"/>

      <!-- ===== 畫面右側手臂（角色右手，持大刀扛肩） ===== -->
      <path d="M26,142 Q38,120 42,94" fill="none" stroke="url(#chengjiaoArmor)" stroke-width="14" stroke-linecap="round"/>
      <path d="M36,112 Q38,104 40,98" fill="none" stroke="#4a1818" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 大刀（扛在肩上，刀在正x區域） ===== -->
      <path d="M38,90 L86,68 L90,66 L88,60 Q68,70 34,86 Z" fill="url(#chengjiaoBlade)" stroke="#666" stroke-width="0.5"/>
      <line x1="38" y1="90" x2="86" y2="68" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="90" y1="66" x2="88" y2="60" stroke="#777" stroke-width="1.2"/>
      <path d="M34,86 Q68,70 88,60" fill="none" stroke="#ddd" stroke-width="0.8" opacity="0.3"/>
      <line x1="44" y1="94" x2="36" y2="88" stroke="#806030" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="40" y1="96" x2="42" y2="104" stroke="#4a3520" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="42" cy="107" r="3.5" fill="#806030"/>
      <circle cx="40" cy="94" r="7" fill="url(#chengjiaoFace)"/>
    </g>
  </g>
</svg>
