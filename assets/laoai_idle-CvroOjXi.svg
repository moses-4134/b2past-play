<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 嫪毐 — 吉卜力2頭身 面朝右（敵方）戰鬥待機（斬馬大刀扛肩） -->
  <defs>
    <radialGradient id="laoaiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b080"/>
      <stop offset="100%" stop-color="#c09868"/>
    </radialGradient>
    <linearGradient id="laoaiArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#4a2a18"/>
    </linearGradient>
    <linearGradient id="laoaiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#221810"/>
    </linearGradient>
    <linearGradient id="laoaiBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <linearGradient id="laoaiHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a08838"/>
      <stop offset="100%" stop-color="#8a7030"/>
    </linearGradient>
    <linearGradient id="laoaiGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8b848"/>
      <stop offset="100%" stop-color="#c8a840"/>
    </linearGradient>
    <linearGradient id="laoaiShoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="36" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（寬站霸氣） ===== -->
      <!-- 後腿 -->
      <ellipse cx="18" cy="200" rx="12" ry="18" fill="url(#laoaiPants)" transform="rotate(-6,18,200)"/>
      <ellipse cx="16" cy="218" rx="14" ry="7.5" fill="#3a2018"/>
      <!-- 前腿 -->
      <ellipse cx="-20" cy="198" rx="13" ry="19" fill="url(#laoaiPants)" transform="rotate(6,-20,198)"/>
      <ellipse cx="-22" cy="218" rx="14" ry="7.5" fill="#3a2018"/>

      <!-- ===== 身體（最壯碩敵方） ===== -->
      <ellipse cx="-2" cy="154" rx="30" ry="34" fill="url(#laoaiArmor)" transform="rotate(-3,-2,154)"/>

      <!-- 金色鎧甲紋飾 -->
      <line x1="-22" y1="134" x2="-24" y2="180" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <line x1="18" y1="134" x2="20" y2="180" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <!-- 胸甲金邊 -->
      <rect x="-18" y="146" width="28" height="18" rx="3" fill="none" stroke="#c8a840" stroke-width="1.2" opacity="0.6"/>
      <!-- 胸甲中心裝飾 -->
      <circle cx="-4" cy="155" r="4" fill="none" stroke="#c8a840" stroke-width="1" opacity="0.5"/>

      <!-- 大肩甲（比龐煖更大） -->
      <ellipse cx="-36" cy="136" rx="14" ry="10" fill="url(#laoaiShoulder)" stroke="#c8a840" stroke-width="1"/>
      <line x1="-44" y1="132" x2="-28" y2="132" stroke="#c8a840" stroke-width="1.5" opacity="0.7"/>
      <ellipse cx="26" cy="136" rx="14" ry="10" fill="url(#laoaiShoulder)" stroke="#c8a840" stroke-width="1"/>
      <line x1="18" y1="132" x2="34" y2="132" stroke="#c8a840" stroke-width="1.5" opacity="0.7"/>

      <!-- 領口 -->
      <path d="M-14,132 L-6,148 L4,132" fill="none" stroke="#6a4828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 翡翠腰帶 -->
      <path d="M-30,180 Q-2,189 28,180" fill="none" stroke="#4a2a18" stroke-width="7" stroke-linecap="round"/>
      <!-- 玉帶扣 -->
      <rect x="-10" y="177" width="14" height="12" rx="2" fill="#4a8848" stroke="#c8a840" stroke-width="1"/>

      <!-- ===== 畫面左側手臂（空拳，握拳叉腰） ===== -->
      <path d="M-28,144 Q-46,150 -44,170" fill="none" stroke="url(#laoaiArmor)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-44" cy="172" r="7" fill="url(#laoaiFace)" opacity="0.85"/>

      <!-- ===== 大頭（鳳翼頭盔，傲慢） ===== -->
      <!-- 頭盔底座 -->
      <ellipse cx="0" cy="90" rx="42" ry="44" fill="url(#laoaiHelmet)"/>

      <!-- 臉（方闊，兇悍） -->
      <path d="M-32,84 C-36,96 -34,116 -28,126 C-22,134 -8,140 4,138 C14,136 24,128 28,116 C32,104 30,90 24,82 C18,76 6,72 -4,74 C-16,76 -30,80 -32,84Z" fill="url(#laoaiFace)"/>

      <!-- 鳳翼頭盔造型 -->
      <!-- 頭盔主體（金色覆蓋頭頂） -->
      <path d="M-34,78 C-28,58 -6,48 14,52 C30,56 38,70 34,82 C30,74 18,66 8,64 C-2,62 -14,64 -24,72" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <!-- 頭盔前沿 -->
      <path d="M-34,82 C-24,76 -8,72 14,74 C28,76 36,80 34,84" fill="none" stroke="#c8a840" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 鳳翼左翼（弧線向外延伸） -->
      <path d="M-30,74 C-40,60 -46,50 -42,44 C-38,40 -34,46 -30,58" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M-42,44 C-48,38 -44,34 -38,40" fill="none" stroke="#c8a840" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 鳳翼右翼 -->
      <path d="M28,74 C36,60 42,50 38,44 C34,40 30,46 28,58" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M38,44 C44,38 40,34 34,40" fill="none" stroke="#c8a840" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 頭盔頂飾（金色尖頂） -->
      <path d="M-4,56 L0,40 L4,56" fill="url(#laoaiGold)" stroke="#c8a840" stroke-width="0.8"/>

      <!-- 耳朵 -->
      <path d="M22,102 C26,98 28,104 26,112 C24,116 22,114 22,108" fill="url(#laoaiFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（小而兇狠，傲慢） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-12" cy="108" rx="5.5" ry="4.5" fill="#fff"/>
      <ellipse cx="-13" cy="109" rx="3.5" ry="3.5" fill="#3a1810"/>
      <ellipse cx="-13.5" cy="108" rx="2" ry="2.2" fill="#1a0800"/>
      <circle cx="-15" cy="106.5" r="1" fill="#fff" opacity="0.6"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="108" rx="5.5" ry="4.5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.5" ry="3.5" fill="#3a1810"/>
      <ellipse cx="4.5" cy="108" rx="2" ry="2.2" fill="#1a0800"/>
      <circle cx="3" cy="106.5" r="1" fill="#fff" opacity="0.6"/>

      <!-- 粗眉毛（極濃，壓眼） -->
      <path d="M-18,100 C-14,97 -10,98 -7,101" fill="none" stroke="#2a1808" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M10,101 C12,98 16,97 20,100" fill="none" stroke="#2a1808" stroke-width="3.5" stroke-linecap="round"/>

      <!-- 鼻子（寬大） -->
      <path d="M-18,116 C-20,122 -16,126" fill="none" stroke="#a08058" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 嘴巴（輕蔑冷笑） -->
      <path d="M-14,132 C-8,130 -2,130 6,133" fill="none" stroke="#805040" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M6,133 C8,132 9,131" fill="none" stroke="#805040" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- ===== 畫面右側手臂（持刀手，扛肩） ===== -->
      <path d="M28,142 Q50,132 62,126" fill="none" stroke="url(#laoaiArmor)" stroke-width="15" stroke-linecap="round"/>
      <path d="M46,134 Q52,130 56,128" fill="none" stroke="#4a2a18" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 斬馬大刀（正x，扛肩姿態） ===== -->
      <!-- 刀身（窄底寬頂，填充path，比申魁更大） -->
      <path d="M64,120 L82,62 L86,52 L98,58 Q80,90 70,124 Z" fill="url(#laoaiBlade)" stroke="#666" stroke-width="0.5"/>
      <!-- 刀背厚線 -->
      <line x1="64" y1="120" x2="82" y2="62" stroke="#888" stroke-width="2.8" stroke-linecap="round"/>
      <!-- 刀尖斜角切面 -->
      <line x1="86" y1="52" x2="98" y2="58" stroke="#777" stroke-width="1.5"/>
      <!-- 刀刃弧線亮線 -->
      <path d="M70,124 Q80,90 98,58" fill="none" stroke="#ddd" stroke-width="0.8" opacity="0.3"/>
      <!-- 刀護手 -->
      <line x1="70" y1="126" x2="58" y2="120" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
      <!-- 刀柄 -->
      <line x1="62" y1="124" x2="60" y2="136" stroke="#5a3a20" stroke-width="6" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="59" cy="139" r="4" fill="#c8a840"/>
      <!-- 握刀的手 -->
      <circle cx="61" cy="130" r="7" fill="url(#laoaiFace)"/>
    </g>
  </g>
</svg>