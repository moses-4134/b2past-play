<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 小七 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體微傾、武器下垂、單眼半瞇、咬牙、汗滴） -->
  <defs>
    <radialGradient id="xqwFace" cx="40%" cy="35%" r="55%"><stop offset="0%" stop-color="#f0dcc4"/><stop offset="100%" stop-color="#dcc4a4"/></radialGradient>
    <linearGradient id="xqwOutfit" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#6a6050"/><stop offset="100%" stop-color="#4a4030"/></linearGradient>
    <linearGradient id="xqwPants" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5a5040"/><stop offset="100%" stop-color="#3a3020"/></linearGradient>
    <linearGradient id="xqwHair" x1="0.2" y1="0" x2="0.7" y2="1"><stop offset="0%" stop-color="#201008"/><stop offset="100%" stop-color="#100804"/></linearGradient>
  </defs>
  <g transform="translate(130, 14)">
    <ellipse cx="-4" cy="192" rx="22" ry="4.5" fill="#000" opacity="0.1"/>
    <!-- 腿（重心偏移，前腿微彎） -->
    <ellipse cx="6" cy="176" rx="6.5" ry="12" fill="url(#xqwPants)" transform="rotate(-3,6,184)"/>
    <ellipse cx="4" cy="190" rx="7.5" ry="5" fill="#4a3828"/>
    <ellipse cx="-10" cy="174" rx="7" ry="13" fill="url(#xqwPants)" transform="rotate(12,-10,182)"/>
    <ellipse cx="-12" cy="190" rx="8" ry="5" fill="#4a3828"/>
    <!-- 身體（前傾彎腰） -->
    <ellipse cx="-2" cy="148" rx="20" ry="22" fill="url(#xqwOutfit)" transform="rotate(-10,-2,148)"/>
    <!-- 破布腰繩 -->
    <path d="M-18,160 Q-2,166 14,160" fill="none" stroke="#3a3020" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 領口 -->
    <path d="M-8,128 L-3,138 L4,128" fill="none" stroke="#8a7860" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 角色左手（按住腹部傷口） -->
    <path d="M14,132 Q22,148 14,160" fill="none" stroke="url(#xqwOutfit)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <circle cx="14" cy="162" r="3.5" fill="url(#xqwFace)" opacity="0.85"/>
    <!-- 角色右手（持飛刀下垂） -->
    <path d="M-18,134 Q-30,136 -36,142" fill="none" stroke="url(#xqwOutfit)" stroke-width="8" stroke-linecap="round"/>

    <!-- 大頭（微低頭） -->
    <ellipse cx="0" cy="96" rx="34" ry="36" fill="url(#xqwHair)"/>
    <!-- 臉 -->
    <path d="M-22,90 C-26,98 -24,112 -18,120 C-12,126 -4,130 4,128 C10,126 14,120 18,112 C22,100 20,90 14,84 C8,78 2,76 -4,78 C-12,80 -20,84 -22,90Z" fill="url(#xqwFace)"/>
    <!-- 髮頂 -->
    <path d="M-14,80 C-10,62 4,56 16,60 C24,64 28,74 24,82 C20,76 12,70 4,68 C-4,66 -10,70 -12,76" fill="url(#xqwHair)"/>
    <!-- 碎瀏海 -->
    <path d="M-24,90 C-28,78 -30,82 -32,90 C-30,94 -26,94 -24,90" fill="url(#xqwHair)"/>
    <path d="M-20,84 C-22,74 -26,76 -26,84 C-24,88 -20,88 -20,84" fill="#201008"/>
    <path d="M-16,80 C-18,72 -22,74 -22,82 C-20,86 -16,86 -16,82" fill="url(#xqwHair)" opacity="0.9"/>
    <path d="M-12,78 C-14,72 -16,74 -16,80" fill="url(#xqwHair)" opacity="0.7"/>
    <!-- 翹起的亂髮 -->
    <path d="M14,62 C18,56 22,58 20,66" fill="url(#xqwHair)"/>
    <path d="M8,60 C12,52 16,54 14,64" fill="url(#xqwHair)" opacity="0.8"/>
    <!-- 側髮 -->
    <path d="M20,86 C24,80 26,88 24,98 C22,102 20,100 20,94" fill="url(#xqwHair)"/>
    <path d="M-26,90 C-28,98 -28,106 -26,114" fill="none" stroke="url(#xqwHair)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    <!-- 耳朵 -->
    <path d="M20,102 C24,98 26,104 24,110 C22,114 20,112 20,108" fill="url(#xqwFace)" stroke="#dcc4a4" stroke-width="0.5"/>
    <!-- 左眼（半瞇忍痛） -->
    <ellipse cx="-7" cy="106" rx="7.5" ry="4" fill="#fff"/>
    <ellipse cx="-8" cy="107" rx="4.5" ry="3" fill="#2a1808"/>
    <ellipse cx="-8.5" cy="106" rx="2.2" ry="1.8" fill="#0a0404"/>
    <circle cx="-10" cy="105" r="1.2" fill="#fff" opacity="0.7"/>
    <!-- 右眼（微睜） -->
    <ellipse cx="9" cy="106" rx="7.5" ry="6" fill="#fff"/>
    <ellipse cx="8" cy="107" rx="4.5" ry="4.2" fill="#2a1808"/>
    <ellipse cx="7.5" cy="106" rx="2.2" ry="2.4" fill="#0a0404"/>
    <circle cx="6" cy="104" r="1.5" fill="#fff" opacity="0.7"/>
    <!-- 眉間皺紋 -->
    <path d="M-1,99 C0,97 2,97 3,99" fill="none" stroke="#c0a080" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    <!-- 粗眉（皺眉） -->
    <path d="M-14,98 C-10,95 -5,96 -1,99" fill="none" stroke="#201008" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M3,99 C7,95 12,96 16,99" fill="none" stroke="#201008" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 鼻子 -->
    <path d="M-10,114 C-10.5,116 -9.5,117" fill="none" stroke="#dcc4a4" stroke-width="1" stroke-linecap="round"/>
    <!-- 嘴巴（咬牙忍痛） -->
    <path d="M-5,122 C-2,123 2,123 5,122" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>
    <path d="M5,122 C6,123 7,124" fill="none" stroke="#906050" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <!-- 臉上泥痕 -->
    <ellipse cx="10" cy="116" rx="3" ry="1.5" fill="#b0a080" opacity="0.2" transform="rotate(-10,10,116)"/>
    <!-- 腮紅（傷痛） -->
    <ellipse cx="-16" cy="118" rx="5" ry="3" fill="#e0a0a0" opacity="0.3"/>

    <!-- 汗滴 -->
    <path d="M-20,92 C-21,96 -20,100 -19,102" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-19" cy="103" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>

    <!-- 小飛刀（下垂無力，最上層） -->
    <line x1="-38" y1="134" x2="-39" y2="142" stroke="#5a4830" stroke-width="2" stroke-linecap="round"/>
    <line x1="-40" y1="142" x2="-38" y2="143" stroke="#706058" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-39" y1="144" x2="-41" y2="156" stroke="#bbb" stroke-width="2" stroke-linecap="round"/>
    <line x1="-39" y1="144" x2="-41" y2="156" stroke="#eee" stroke-width="0.7" opacity="0.4"/>
    <circle cx="-36" cy="146" r="4" fill="url(#xqwFace)"/>
  </g>
</svg>