<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 密道守將 — 吉卜力2頭身 面朝右（敵方）倒地/戰敗 -->
  <defs>
    <radialGradient id="tunnelBossFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc098"/>
      <stop offset="100%" stop-color="#c4a478"/>
    </radialGradient>
    <linearGradient id="tunnelBossArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a2020"/>
      <stop offset="100%" stop-color="#3a1414"/>
    </linearGradient>
    <linearGradient id="tunnelBossPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1818"/>
      <stop offset="100%" stop-color="#1e0e0e"/>
    </linearGradient>
    <linearGradient id="tunnelBossHelmet" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#4a4040"/>
      <stop offset="100%" stop-color="#2a2424"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(78, 10)">
      <ellipse cx="-4" cy="229" rx="42" ry="4" fill="#000" opacity="0.08"/>

      <g transform="rotate(90, -4, 176)">
        <!-- ===== 腿 ===== -->
        <ellipse cx="12" cy="189" rx="11" ry="17" fill="url(#tunnelBossPants)"/>
        <ellipse cx="10" cy="211" rx="12" ry="6" fill="#2a1210"/>
        <ellipse cx="-14" cy="187" rx="12" ry="18" fill="url(#tunnelBossPants)"/>
        <ellipse cx="-16" cy="211" rx="13" ry="6" fill="#2a1210"/>

        <!-- ===== 身體 ===== -->
        <ellipse cx="-2" cy="150" rx="26" ry="28" fill="url(#tunnelBossArmor)"/>

        <!-- 護肩 -->
        <ellipse cx="-26" cy="140" rx="10" ry="7" fill="#4a4040" stroke="#3a3434" stroke-width="0.8" opacity="0.7"/>
        <ellipse cx="22" cy="140" rx="10" ry="7" fill="#4a4040" stroke="#3a3434" stroke-width="0.8" opacity="0.7"/>

        <path d="M-12,138 L-4,152 L4,138" fill="none" stroke="#6a2828" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

        <path d="M-26,184 Q-2,190 24,184" fill="none" stroke="#3a1818" stroke-width="5" stroke-linecap="round"/>
        <rect x="-7" y="182" width="9" height="9" rx="1" fill="#8a6830" stroke="#6a4820" stroke-width="0.5"/>

        <!-- ===== 大頭 ===== -->
        <ellipse cx="0" cy="94" rx="36" ry="38" fill="url(#tunnelBossHelmet)"/>
        <path d="M-2,56 L-2,80" fill="none" stroke="#5a5050" stroke-width="1.5" opacity="0.4"/>
        <path d="M-34,96 C-36,92 -32,88 -28,86 L26,86 C30,88 34,92 32,96" fill="url(#tunnelBossHelmet)" stroke="#3a3434" stroke-width="0.5"/>

        <path d="M-28,88 C-32,100 -30,116 -24,126 C-18,134 -6,138 4,136 C14,134 20,126 24,116 C28,104 26,90 20,82 C14,76 4,74 -6,76 C-16,78 -26,82 -28,88Z" fill="url(#tunnelBossFace)"/>

        <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,110" fill="url(#tunnelBossFace)" stroke="#b09060" stroke-width="0.5"/>

        <!-- 眼睛（閉眼橫線） -->
        <line x1="-14" y1="108" x2="-4" y2="108" stroke="#301410" stroke-width="2" stroke-linecap="round"/>
        <line x1="4" y1="108" x2="12" y2="108" stroke="#301410" stroke-width="2" stroke-linecap="round"/>

        <path d="M-16,102 C-12,100 -8,101 -4,103" fill="none" stroke="#2a1a10" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <path d="M10,103 C12,101 16,100 20,102" fill="none" stroke="#2a1a10" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

        <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

        <path d="M-14,130 C-10,131 -4,131 0,131 C4,131 8,130 12,129" fill="none" stroke="#5a4a38" stroke-width="0.8" opacity="0.3" stroke-dasharray="1,1.5"/>

        <path d="M-10,128 C-6,128 0,128 6,128" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>

        <!-- ===== 左手臂（負x，自然垂落） ===== -->
        <path d="M-24,146 Q-36,158 -42,168" fill="none" stroke="url(#tunnelBossArmor)" stroke-width="12" stroke-linecap="round"/>
        <circle cx="-42" cy="170" r="5.5" fill="url(#tunnelBossFace)"/>

        <!-- ===== 右手臂（正x，自然垂落） ===== -->
        <path d="M22,146 Q34,160 30,178" fill="none" stroke="url(#tunnelBossArmor)" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
        <circle cx="30" cy="170" r="5.5" fill="url(#tunnelBossFace)" opacity="0.85"/>

        <!-- 劍脫手掉落（正x側） -->
        <line x1="82" y1="190" x2="34" y2="200" stroke="#999" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="86" y1="188" x2="86" y2="194" stroke="#bbb" stroke-width="2" stroke-linecap="round"/>
        <line x1="32" y1="197" x2="30" y2="204" stroke="#8a6830" stroke-width="3" stroke-linecap="round"/>
        <line x1="28" y1="202" x2="24" y2="204" stroke="#4a3018" stroke-width="4" stroke-linecap="round"/>
        <circle cx="22" cy="205" r="2.5" fill="#8a6830"/>

        <!-- 火把掉落（負x側，火焰熄滅） -->
        <line x1="-40" y1="194" x2="-40" y2="210" stroke="#6a4420" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
        <ellipse cx="-40" cy="212" rx="3" ry="4" fill="#883300" opacity="0.3"/>
      </g>
    </g>
  </g>
</svg>