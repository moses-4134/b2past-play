<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 龐煖 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體微傾、槍下垂、眼半瞇、咬牙、汗滴） -->
  <defs>
    <radialGradient id="pangxuanWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc098"/>
      <stop offset="100%" stop-color="#c4a478"/>
    </radialGradient>
    <linearGradient id="pangxuanWArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="pangxuanWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="pangxuanWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#201018"/>
      <stop offset="100%" stop-color="#181018"/>
    </linearGradient>
    <linearGradient id="pangxuanWSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d0d8"/>
      <stop offset="100%" stop-color="#a0a0a8"/>
    </linearGradient>
    <linearGradient id="pangxuanWShoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#22222a"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="225" rx="32" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（重心偏移，前腿微彎） ===== -->
    <!-- 後腿 -->
    <ellipse cx="16" cy="202" rx="11" ry="17" fill="url(#pangxuanWPants)" transform="rotate(-5,16,202)"/>
    <ellipse cx="14" cy="218" rx="12" ry="7.5" fill="#2a2028"/>
    <!-- 前腿（微彎支撐） -->
    <ellipse cx="-18" cy="200" rx="11" ry="17" fill="url(#pangxuanWPants)" transform="rotate(8,-18,200)"/>
    <ellipse cx="-21" cy="218" rx="12" ry="7.5" fill="#2a2028"/>

    <!-- ===== 身體（前傾，重心偏低） ===== -->
    <ellipse cx="-2" cy="164" rx="28" ry="31" fill="url(#pangxuanWArmor)" transform="rotate(-8,-2,164)"/>

    <!-- 鎧甲紅色紋飾 -->
    <line x1="-20" y1="144" x2="-22" y2="188" stroke="#8a2020" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="144" x2="18" y2="188" stroke="#8a2020" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- 胸甲紋理 -->
    <rect x="-18" y="152" width="26" height="16" rx="3" fill="url(#pangxuanWShoulder)" stroke="#3a3a42" stroke-width="0.5" opacity="0.7"/>

    <!-- 大肩甲 -->
    <ellipse cx="-34" cy="142" rx="12" ry="8" fill="url(#pangxuanWShoulder)" stroke="#3a3a42" stroke-width="0.7"/>
    <line x1="-40" y1="138" x2="-28" y2="138" stroke="#8a2020" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="22" cy="142" rx="12" ry="8" fill="url(#pangxuanWShoulder)" stroke="#3a3a42" stroke-width="0.7"/>
    <line x1="16" y1="138" x2="28" y2="138" stroke="#8a2020" stroke-width="1.5" opacity="0.5"/>

    <!-- 領口 -->
    <path d="M-12,142 L-6,155 L2,142" fill="none" stroke="#4a4050" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-28,186 Q-2,194 24,186" fill="none" stroke="#5a1818" stroke-width="6" stroke-linecap="round"/>
    <rect x="-8" y="184" width="10" height="10" rx="2" fill="#4a4a52" stroke="#3a3a42" stroke-width="0.5"/>

    <!-- ===== 右側手臂（正x，按住腹部傷口） ===== -->
    <path d="M22,150 Q36,164 24,180" fill="none" stroke="url(#pangxuanWArmor)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
    <circle cx="24" cy="182" r="6" fill="url(#pangxuanWFace)" opacity="0.85"/>

    <!-- ===== 大頭（低頭） ===== -->
    <!-- 後腦蓬亂髮量 -->
    <ellipse cx="0" cy="98" rx="42" ry="44" fill="url(#pangxuanWHair)"/>

    <!-- 臉（微低頭） -->
    <path d="M-32,88 C-36,100 -34,118 -28,128 C-22,136 -10,141 0,139 C10,137 20,131 24,121 C28,109 26,95 20,87 C14,81 2,77 -8,79 C-20,81 -30,85 -32,88Z" fill="url(#pangxuanWFace)"/>

    <!-- 腮紅（傷痛） -->
    <ellipse cx="-24" cy="126" rx="6" ry="3.5" fill="#d09090" opacity="0.35"/>

    <!-- 散亂頭髮頂部 -->
    <path d="M-22,78 C-18,60 -2,50 14,54 C28,58 34,72 28,82 C24,74 14,68 6,66 C-2,64 -12,66 -18,74" fill="url(#pangxuanWHair)"/>

    <!-- 蓬亂髮絲（更散亂） -->
    <path d="M-24,74 C-30,62 -34,60 -32,70" fill="none" stroke="#181018" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-18,68 C-22,54 -26,52 -24,64" fill="none" stroke="#201018" stroke-width="3" stroke-linecap="round"/>
    <path d="M8,60 C12,48 16,46 14,58" fill="none" stroke="#181018" stroke-width="3" stroke-linecap="round"/>
    <path d="M18,64 C24,52 28,50 24,62" fill="none" stroke="#201018" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M26,72 C32,62 36,60 32,70" fill="none" stroke="#181018" stroke-width="3" stroke-linecap="round"/>

    <!-- 後方散亂長髮 -->
    <path d="M24,88 C30,94 34,110 32,122 C30,128 28,124 28,118" fill="none" stroke="#181018" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <path d="M28,84 C34,90 38,102 36,114" fill="none" stroke="#201018" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>

    <!-- 瀏海 -->
    <path d="M-30,88 C-36,78 -38,82 -36,90 C-34,94 -30,94 -30,92" fill="url(#pangxuanWHair)"/>
    <path d="M-26,82 C-30,72 -34,76 -32,86" fill="#181018"/>

    <!-- 側髮 -->
    <path d="M22,88 C28,82 30,90 28,98 C26,102 22,100 22,94" fill="url(#pangxuanWHair)"/>

    <!-- 耳朵 -->
    <path d="M20,106 C24,102 26,108 24,114 C22,118 20,116 20,112" fill="url(#pangxuanWFace)" stroke="#b09060" stroke-width="0.5"/>

    <!-- ===== 眼睛（左眼半瞇忍痛、右眼微睜） ===== -->
    <!-- 左眼（半瞇） -->
    <ellipse cx="-14" cy="110" rx="6.5" ry="3.5" fill="#fff"/>
    <ellipse cx="-15" cy="111" rx="4" ry="2.8" fill="#5a2818"/>
    <ellipse cx="-15.5" cy="110" rx="2.5" ry="1.8" fill="#2a0808"/>
    <circle cx="-17" cy="109" r="1" fill="#fff" opacity="0.5"/>

    <!-- 右眼（微睜） -->
    <ellipse cx="2" cy="110" rx="6.5" ry="5" fill="#fff"/>
    <ellipse cx="1" cy="111" rx="4" ry="4" fill="#5a2818"/>
    <ellipse cx="0.5" cy="110" rx="2.5" ry="2.5" fill="#2a0808"/>
    <circle cx="-1" cy="108" r="1" fill="#fff" opacity="0.5"/>

    <!-- 粗眉毛（皺起） -->
    <path d="M-21,102 C-17,98 -11,98 -7,101" fill="none" stroke="#181018" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M-4,102 C0,98 6,98 10,101" fill="none" stroke="#181018" stroke-width="2.8" stroke-linecap="round"/>

    <!-- 眉間皺紋 -->
    <path d="M-5,104 C-4,102 -2,102 -1,104" fill="none" stroke="#a08058" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- 鼻子 -->
    <path d="M-20,117 C-21,121 -19,126 -17,128" fill="none" stroke="#a08058" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 短鬍鬚 -->
    <path d="M-18,131 C-14,134 -8,135 -4,133" fill="none" stroke="#201018" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-4,131 C0,134 4,135 8,133" fill="none" stroke="#201018" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-14,137 C-10,140 -4,141 0,138" fill="none" stroke="#201018" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 臉部疤痕 -->
    <line x1="-8" y1="98" x2="-12" y2="108" stroke="#a08058" stroke-width="0.8" opacity="0.3"/>
    <line x1="10" y1="104" x2="14" y2="116" stroke="#a08058" stroke-width="0.8" opacity="0.3"/>

    <!-- 嘴巴（咬牙忍痛） -->
    <path d="M-16,134 C-12,135 -4,135 2,134" fill="none" stroke="#805040" stroke-width="2" stroke-linecap="round"/>
    <path d="M-16,134 C-17,136 -18,137" fill="none" stroke="#805040" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- ===== 左側手臂（負x，持槍下垂無力） ===== -->
    <path d="M-26,150 Q-44,156 -52,170" fill="none" stroke="url(#pangxuanWArmor)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="-52" cy="172" r="6" fill="url(#pangxuanWFace)"/>

    <!-- ===== 槍（下垂，槍頭低垂） ===== -->
    <!-- 槍桿 -->
    <line x1="-50" y1="174" x2="-66" y2="232" stroke="#6a4420" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 槍頭（朝下） -->
    <path d="M-70,240 L-64,232 L-68,224 Z" fill="url(#pangxuanWSteel)" stroke="#888" stroke-width="0.5"/>
    <!-- 槍纓 -->
    <line x1="-64" y1="230" x2="-60" y2="226" stroke="#aa2020" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-65" y1="226" x2="-61" y2="222" stroke="#aa2020" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 槍尾（上方） -->
    <circle cx="-50" cy="172" r="3" fill="#5a3a18" stroke="#4a2a10" stroke-width="0.5"/>

    <!-- 汗滴 -->
    <path d="M-26,84 C-27,88 -26,92 -25,94" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-25" cy="95" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
  </g>
</svg>