<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 秦國邊境雄關 — 吉卜力風格：冷峻鋼藍、巨石關城橫斷山口、玄旗肅殺、決戰終局 地平線 y=180 -->
  <defs>
    <linearGradient id="bqSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2436"/>
      <stop offset="45%" stop-color="#38445c"/>
      <stop offset="100%" stop-color="#6a7488"/>
    </linearGradient>
    <linearGradient id="bqMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3040"/>
      <stop offset="100%" stop-color="#1c2230"/>
    </linearGradient>
    <linearGradient id="bqWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4e56"/>
      <stop offset="100%" stop-color="#30343c"/>
    </linearGradient>
    <linearGradient id="bqGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e5260"/>
      <stop offset="100%" stop-color="#2e323c"/>
    </linearGradient>
    <radialGradient id="bqMoon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d0dcf0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8090b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#bqSky)"/>
  <!-- 冷月 -->
  <circle cx="760" cy="66" r="90" fill="url(#bqMoon)"/>
  <circle cx="760" cy="66" r="30" fill="#e0e8f4" opacity="0.55"/>
  <!-- 陰雲橫掃 -->
  <g opacity="0.4" fill="#2a3550">
    <ellipse cx="240" cy="50" rx="140" ry="18"/><ellipse cx="560" cy="40" rx="120" ry="14"/><ellipse cx="820" cy="100" rx="100" ry="12"/>
  </g>

  <!-- 遠山稜線（夾峙） -->
  <path d="M0,180 L0,70 L120,110 L230,50 L330,120 L330,180 Z" fill="url(#bqMtn)"/>
  <path d="M960,180 L960,60 L840,110 L720,44 L630,120 L630,180 Z" fill="url(#bqMtn)"/>
  <g stroke="#4a5468" stroke-width="1" opacity="0.3" fill="none">
    <path d="M120,110 L180,140 M230,50 L280,100 M720,44 L770,96 M840,110 L790,150"/>
  </g>

  <!-- 巨石關城（橫斷山口的雄關） -->
  <rect x="300" y="70" width="360" height="110" fill="url(#bqWall)"/>
  <!-- 城磚紋 -->
  <g stroke="#22262c" stroke-width="1" opacity="0.45">
    <line x1="300" y1="100" x2="660" y2="100"/><line x1="300" y1="130" x2="660" y2="130"/><line x1="300" y1="158" x2="660" y2="158"/>
    <line x1="360" y1="70" x2="360" y2="180"/><line x1="420" y1="70" x2="420" y2="180"/><line x1="540" y1="70" x2="540" y2="180"/><line x1="600" y1="70" x2="600" y2="180"/>
  </g>
  <!-- 關城城樓 -->
  <rect x="420" y="30" width="120" height="46" fill="#3a3e46"/>
  <path d="M408,30 h144 l-18,-20 h-108 z" fill="#5a1e1e"/>
  <path d="M414,10 h132 l-16,-14 h-100 z" fill="#4a1818"/>
  <rect x="440" y="44" width="24" height="24" fill="#12161c"/>
  <rect x="496" y="44" width="24" height="24" fill="#12161c"/>
  <!-- 城垛 -->
  <g fill="#3a3e46">
    <rect x="300" y="58" width="34" height="16"/><rect x="348" y="58" width="34" height="16"/><rect x="562" y="58" width="34" height="16"/><rect x="610" y="58" width="34" height="16"/>
  </g>
  <!-- 關門洞 -->
  <path d="M446,180 L446,120 Q480,92 514,120 L514,180 Z" fill="#0e1014"/>

  <!-- 秦玄旗（列於關牆，肅殺） -->
  <g>
    <rect x="330" y="80" width="4" height="50" fill="#141820"/>
    <path d="M334,84 h30 l-8,10 l8,10 h-30 z" fill="#1a1620"/><circle cx="348" cy="94" r="4" fill="#b83028" opacity="0.6"/>
    <rect x="626" y="80" width="4" height="50" fill="#141820"/>
    <path d="M626,84 h-30 l8,10 l-8,10 h30 z" fill="#1a1620"/><circle cx="612" cy="94" r="4" fill="#b83028" opacity="0.6"/>
    <rect x="478" y="6" width="4" height="26" fill="#141820"/>
    <path d="M482,8 h26 l-7,9 l7,9 h-26 z" fill="#1a1620"/><circle cx="494" cy="17" r="3.5" fill="#b83028" opacity="0.6"/>
  </g>

  <!-- 關前地面（碎石戰場） -->
  <rect x="0" y="180" width="960" height="360" fill="url(#bqGround)"/>
  <g stroke="#262a32" stroke-width="1" opacity="0.3">
    <line x1="0" y1="222" x2="960" y2="222"/><line x1="0" y1="270" x2="960" y2="270"/><line x1="0" y1="325" x2="960" y2="325"/><line x1="0" y1="390" x2="960" y2="390"/><line x1="0" y1="460" x2="960" y2="460"/>
  </g>
  <!-- 散落岩石 -->
  <g fill="#3a3e48" opacity="0.7">
    <path d="M120,300 l24,-10 l18,12 l-10,16 l-26,4 z"/><path d="M760,340 l30,-12 l22,14 l-12,20 l-32,4 z"/><path d="M420,430 l26,-10 l20,12 l-12,18 l-28,4 z"/>
  </g>
  <line x1="0" y1="180" x2="960" y2="180" stroke="#20242c" stroke-width="3"/>

  <!-- 寒氣粒子 -->
  <circle cx="380" cy="150" r="1.4" fill="#c8d4e8" opacity="0.3"/>
  <circle cx="580" cy="170" r="1.2" fill="#c8d4e8" opacity="0.25"/>
  <circle cx="240" cy="200" r="1.3" fill="#c8d4e8" opacity="0.22"/>
  <circle cx="700" cy="190" r="1.4" fill="#c8d4e8" opacity="0.22"/>
  <rect width="960" height="540" fill="#28405a" opacity="0.07"/>
</svg>
