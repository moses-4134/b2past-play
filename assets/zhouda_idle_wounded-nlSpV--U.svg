<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 武師「鐵臂」周大 — 受傷待機（HP 30~60%：身體前傾、拳下垂、單眼半瞇、手按傷口） -->
  <defs>
    <radialGradient id="zhoudaWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </radialGradient>
    <linearGradient id="zhoudaWCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a4038"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </linearGradient>
    <linearGradient id="zhoudaWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3428"/>
      <stop offset="100%" stop-color="#1e1a10"/>
    </linearGradient>
    <linearGradient id="zhoudaWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="zhoudaWIronGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6040" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#aa3020" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#aa3020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="32" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（重心偏移） ===== -->
      <!-- 後腿 -->
      <ellipse cx="14" cy="202" rx="11" ry="17" fill="url(#zhoudaWPants)" transform="rotate(-3,14,202)"/>
      <ellipse cx="12" cy="218" rx="12" ry="7" fill="#3a2818"/>
      <!-- 前腿（微彎支撐） -->
      <ellipse cx="-16" cy="200" rx="12" ry="18" fill="url(#zhoudaWPants)" transform="rotate(8,-16,200)"/>
      <ellipse cx="-19" cy="218" rx="13" ry="7" fill="#3a2818"/>

      <!-- ===== 身體（前傾彎腰） ===== -->
      <ellipse cx="-2" cy="160" rx="28" ry="32" fill="url(#zhoudaWCloth)" transform="rotate(-8,-2,160)"/>

      <!-- 束腰布帶 -->
      <path d="M-28,182 Q-2,190 24,182" fill="none" stroke="#5a4830" stroke-width="6" stroke-linecap="round"/>
      <rect x="-6" y="180" width="8" height="8" rx="1" fill="#6a5838" stroke="#4a3828" stroke-width="0.5"/>

      <!-- 領口 -->
      <path d="M-12,136 L-4,150 L6,136" fill="none" stroke="#5a5040" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- ===== 角色左手臂（畫面右側，按住腹部傷口） ===== -->
      <path d="M-22,146 Q-30,156 -14,172" fill="none" stroke="url(#zhoudaWCloth)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
      <!-- 鐵環（前臂，但光暈減弱） -->
      <ellipse cx="-24" cy="150" rx="7" ry="3" fill="none" stroke="#888" stroke-width="2" transform="rotate(-5,-24,150)"/>
      <ellipse cx="-22" cy="153" rx="7" ry="3" fill="none" stroke="#999" stroke-width="2" transform="rotate(-5,-22,153)"/>
      <!-- 護腕布條 -->
      <path d="M-22,152 Q-26,150 -20,158" fill="none" stroke="#3a2818" stroke-width="4" stroke-linecap="round"/>
      <!-- 鐵臂功光暈（減弱） -->
      <circle cx="-12" cy="174" r="10" fill="url(#zhoudaWIronGlow)"/>
      <!-- 按傷口的手 -->
      <circle cx="-12" cy="174" r="6" fill="url(#zhoudaWFace)" opacity="0.85"/>

      <!-- ===== 角色右手臂（畫面左側，拳下垂無力） ===== -->
      <path d="M24,146 Q38,156 42,172" fill="none" stroke="url(#zhoudaWCloth)" stroke-width="14" stroke-linecap="round"/>
      <!-- 鐵環 -->
      <ellipse cx="32" cy="152" rx="8" ry="3.5" fill="none" stroke="#888" stroke-width="2.5" transform="rotate(5,32,152)"/>
      <ellipse cx="34" cy="155" rx="8" ry="3.5" fill="none" stroke="#aaa" stroke-width="2.5" transform="rotate(5,34,155)"/>
      <ellipse cx="36" cy="158" rx="8" ry="3.5" fill="none" stroke="#888" stroke-width="2.5" transform="rotate(5,36,158)"/>
      <!-- 護腕布條 -->
      <path d="M34,154 Q38,152 40,158" fill="none" stroke="#3a2818" stroke-width="4" stroke-linecap="round"/>
      <!-- 鐵臂功光暈（減弱） -->
      <circle cx="42" cy="174" r="12" fill="url(#zhoudaWIronGlow)"/>
      <!-- 下垂握拳 -->
      <circle cx="42" cy="174" r="7" fill="url(#zhoudaWFace)"/>
      <path d="M45,170 Q42,168 39,170" fill="none" stroke="#c8a070" stroke-width="1.2" stroke-linecap="round"/>

      <!-- ===== 大頭 ===== -->
      <!-- 極短平頭髮底 -->
      <ellipse cx="0" cy="96" rx="40" ry="42" fill="url(#zhoudaWHair)"/>

      <!-- 臉（微低頭） -->
      <path d="M-30,90 C-34,102 -32,118 -26,128 C-20,136 -8,140 4,138 C14,136 22,130 26,120 C30,108 28,94 22,86 C16,80 4,76 -6,78 C-18,80 -28,84 -30,90Z" fill="url(#zhoudaWFace)"/>

      <!-- 腮紅（傷痛泛紅） -->
      <ellipse cx="-20" cy="124" rx="7" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- 極短平頭 -->
      <path d="M-20,78 C-16,60 2,52 18,56 C28,60 32,72 28,82 C24,74 16,68 8,66 C0,64 -10,66 -16,72" fill="url(#zhoudaWHair)"/>
      <path d="M-24,82 C-20,66 4,56 22,62 C30,66 32,76 28,84" fill="url(#zhoudaWHair)" opacity="0.5"/>

      <!-- 耳朵 -->
      <path d="M20,104 C24,100 26,106 24,112 C22,116 20,114 20,108" fill="url(#zhoudaWFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（左眼半瞇忍痛） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-10" cy="108" rx="6" ry="4" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="4" ry="3" fill="#2a1410"/>
      <ellipse cx="-11.5" cy="108" rx="2.2" ry="1.8" fill="#140a06"/>
      <circle cx="-13" cy="107" r="0.8" fill="#fff" opacity="0.5"/>

      <!-- 右眼（微瞇但還睜著） -->
      <ellipse cx="6" cy="108" rx="6" ry="5.5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="4" ry="4" fill="#2a1410"/>
      <ellipse cx="4.5" cy="108" rx="2.2" ry="2.2" fill="#140a06"/>
      <circle cx="3" cy="107" r="1" fill="#fff" opacity="0.55"/>

      <!-- 粗眉毛（皺眉忍痛） -->
      <path d="M-16,100 C-12,97 -8,99 -6,101" fill="none" stroke="#2a2018" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M8,101 C10,99 14,97 18,99" fill="none" stroke="#2a2018" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 眉間皺紋 -->
      <path d="M-3,101 C-2,99 0,99 1,101" fill="none" stroke="#b09060" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 鼻子 -->
      <path d="M-16,116 C-18,122 -14,126" fill="none" stroke="#b09068" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 短鬍渣 -->
      <ellipse cx="-4" cy="134" rx="12" ry="5" fill="#3a3020" opacity="0.2"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-12,130 C-6,132 0,132 6,130" fill="none" stroke="#704840" stroke-width="2" stroke-linecap="round"/>
      <path d="M-12,130 C-14,132 -15,133" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

      <!-- 汗滴 -->
      <path d="M-24,88 C-25,92 -24,98 -23,101" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-23" cy="102" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
    </g>
  </g>
</svg>
