<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 鐵面 — 吉卜力2頭身 面朝右（敵方）防禦：大刀橫擋 -->
  <defs>
    <radialGradient id="ironMaskFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b880"/>
      <stop offset="100%" stop-color="#c09868"/>
    </radialGradient>
    <linearGradient id="ironMaskArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#2a1c10"/>
    </linearGradient>
    <linearGradient id="ironMaskPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="ironMaskMask" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#5a5a62"/>
      <stop offset="100%" stop-color="#4a4a50"/>
    </linearGradient>
    <linearGradient id="ironMaskBlade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#aaa"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <linearGradient id="ironMaskHair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#3a2a18"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="215" rx="32" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（低蹲防禦） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="192" rx="12" ry="17" fill="url(#ironMaskPants)" transform="rotate(-4,12,192)"/>
      <ellipse cx="10" cy="208" rx="13" ry="7" fill="#2a1c10"/>
      <!-- 前腿（蹲低） -->
      <ellipse cx="-14" cy="190" rx="13" ry="18" fill="url(#ironMaskPants)" transform="rotate(4,-14,190)"/>
      <ellipse cx="-16" cy="208" rx="14" ry="7" fill="#2a1c10"/>

      <!-- ===== 身體（蹲低防禦） ===== -->
      <ellipse cx="-2" cy="155" rx="30" ry="30" fill="url(#ironMaskArmor)" transform="rotate(-3,-2,155)"/>

      <!-- 鉚釘 -->
      <circle cx="-14" cy="146" r="2" fill="#6a6a70" stroke="#4a4a50" stroke-width="0.5"/>
      <circle cx="-8" cy="154" r="2" fill="#6a6a70" stroke="#4a4a50" stroke-width="0.5"/>
      <circle cx="4" cy="146" r="2" fill="#6a6a70" stroke="#4a4a50" stroke-width="0.5"/>
      <circle cx="10" cy="154" r="2" fill="#6a6a70" stroke="#4a4a50" stroke-width="0.5"/>

      <!-- 毛皮護肩 -->
      <ellipse cx="-28" cy="134" rx="12" ry="8" fill="#5a4028" stroke="#4a3018" stroke-width="0.8"/>
      <path d="M-36,130 L-32,136 M-34,128 L-30,134 M-38,132 L-34,138" fill="none" stroke="#3a2818" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="24" cy="134" rx="12" ry="8" fill="#5a4028" stroke="#4a3018" stroke-width="0.8"/>
      <path d="M30,130 L26,136 M32,128 L28,134" fill="none" stroke="#3a2818" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

      <!-- 領口 -->
      <path d="M-14,133 L-4,147 L6,133" fill="none" stroke="#4a3820" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-30,180 Q-2,188 26,180" fill="none" stroke="#3a2818" stroke-width="6" stroke-linecap="round"/>
      <rect x="-8" y="178" width="10" height="10" rx="1.5" fill="#8a6830" stroke="#6a4820" stroke-width="0.5"/>

      <!-- ===== 大頭 ===== -->
      <!-- 蓬亂後髮 -->
      <ellipse cx="0" cy="90" rx="40" ry="42" fill="url(#ironMaskHair)"/>

      <!-- 髮突出 -->
      <path d="M-30,68 C-36,56 -40,62 -38,74" fill="url(#ironMaskHair)" opacity="0.9"/>
      <path d="M-24,62 C-28,50 -34,54 -30,68" fill="url(#ironMaskHair)" opacity="0.85"/>
      <path d="M26,72 C32,62 36,68 32,80" fill="url(#ironMaskHair)" opacity="0.85"/>
      <path d="M24,84 C30,78 34,86 30,96 C28,102 24,98 24,92" fill="url(#ironMaskHair)"/>

      <!-- 臉 -->
      <path d="M-28,86 C-32,98 -30,114 -24,124 C-18,132 -6,136 4,134 C14,132 22,124 26,114 C30,102 28,88 22,80 C16,74 4,72 -4,74 C-16,76 -26,80 -28,86Z" fill="url(#ironMaskFace)"/>

      <!-- 鐵面具 -->
      <path d="M-26,82 C-28,78 -22,72 -14,70 L10,70 C18,72 24,78 22,82 L22,104 C22,108 16,110 8,110 L-14,110 C-22,110 -26,108 -26,104 Z" fill="url(#ironMaskMask)" stroke="#3a3a40" stroke-width="1"/>
      <path d="M-16,92 L-4,92 L-4,102 L-16,102 Z" fill="#1a1a20"/>
      <path d="M2,92 L14,92 L14,102 L2,102 Z" fill="#1a1a20"/>
      <circle cx="-20" cy="86" r="1.5" fill="#7a7a82"/>
      <circle cx="16" cy="86" r="1.5" fill="#7a7a82"/>
      <circle cx="-20" cy="106" r="1.5" fill="#7a7a82"/>
      <circle cx="16" cy="106" r="1.5" fill="#7a7a82"/>
      <line x1="-2" y1="72" x2="-2" y2="110" stroke="#5a5a62" stroke-width="1.5" opacity="0.5"/>

      <!-- 耳朵 -->
      <path d="M20,98 C24,94 26,100 24,108 C22,112 20,110 20,104" fill="url(#ironMaskFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- 眼睛（警戒凝視） -->
      <ellipse cx="-10" cy="97" rx="5" ry="4" fill="#fff"/>
      <ellipse cx="-11" cy="98" rx="3" ry="3.5" fill="#301410"/>
      <ellipse cx="-11.5" cy="97" rx="1.8" ry="2" fill="#180808"/>
      <circle cx="-13" cy="96" r="1" fill="#fff" opacity="0.6"/>

      <ellipse cx="8" cy="97" rx="5" ry="4" fill="#fff"/>
      <ellipse cx="7" cy="98" rx="3" ry="3.5" fill="#301410"/>
      <ellipse cx="6.5" cy="97" rx="1.8" ry="2" fill="#180808"/>
      <circle cx="5" cy="96" r="1" fill="#fff" opacity="0.6"/>

      <!-- 鼻子 -->
      <path d="M-12,114 C-14,118 -10,122" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 下巴鬍渣 -->
      <path d="M-16,128 C-10,129 -4,129 0,129 C6,129 10,128 14,127" fill="none" stroke="#5a4a38" stroke-width="0.8" opacity="0.4" stroke-dasharray="1,1.5"/>

      <!-- 疤痕 -->
      <path d="M2,122 L6,130" fill="none" stroke="#a08060" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

      <!-- 嘴巴（緊閉） -->
      <path d="M-10,126 C-6,127 0,127 6,126" fill="none" stroke="#704840" stroke-width="2.2" stroke-linecap="round"/>

      <!-- ===== 左手臂（負x，輔助擋） ===== -->
      <path d="M-24,144 Q-34,138 -38,130" fill="none" stroke="url(#ironMaskArmor)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-38" cy="128" r="6" fill="url(#ironMaskFace)" opacity="0.85"/>

      <!-- ===== 右手臂（正x，大刀橫擋） ===== -->
      <path d="M26,144 Q38,134 44,126" fill="none" stroke="url(#ironMaskArmor)" stroke-width="13" stroke-linecap="round"/>

      <!-- ===== 大刀（橫擋，正x區域） ===== -->
      <!-- 刀身（填充形狀，橫向） -->
      <path d="M42,120 L90,108 L94,104 L90,100 Q66,114 40,122 Z" fill="url(#ironMaskBlade)" stroke="#666" stroke-width="0.5"/>
      <!-- 刀背厚線 -->
      <line x1="42" y1="120" x2="90" y2="108" stroke="#888" stroke-width="2" stroke-linecap="round"/>
      <!-- 刀尖斜角切面 -->
      <line x1="94" y1="104" x2="90" y2="100" stroke="#777" stroke-width="1"/>
      <!-- 刀刃弧線亮線 -->
      <path d="M40,122 Q66,114 90,100" fill="none" stroke="#ccc" stroke-width="0.8" opacity="0.3"/>
      <!-- 刀護手 -->
      <line x1="46" y1="124" x2="38" y2="118" stroke="#806030" stroke-width="4" stroke-linecap="round"/>
      <!-- 刀柄 -->
      <line x1="44" y1="122" x2="46" y2="130" stroke="#4a3520" stroke-width="5" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="47" cy="132" r="3" fill="#806030"/>
      <!-- 握刀的手 -->
      <circle cx="44" cy="124" r="6.5" fill="url(#ironMaskFace)"/>
    </g>
  </g>
</svg>