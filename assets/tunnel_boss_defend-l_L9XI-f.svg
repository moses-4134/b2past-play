<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 密道守將 — 吉卜力2頭身 面朝右（敵方）防禦：劍橫擋 -->
  <defs>
    <radialGradient id="tunnelBossFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc098"/>
      <stop offset="100%" stop-color="#c4a478"/>
    </radialGradient>
    <linearGradient id="tunnelBossArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a2020"/>
      <stop offset="100%" stop-color="#3a1414"/>
    </linearGradient>
    <linearGradient id="tunnelBossPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1818"/>
      <stop offset="100%" stop-color="#1e0e0e"/>
    </linearGradient>
    <linearGradient id="tunnelBossHelmet" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#4a4040"/>
      <stop offset="100%" stop-color="#2a2424"/>
    </linearGradient>
    <radialGradient id="tunnelBossFlame" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ff8820"/>
      <stop offset="100%" stop-color="#ff4400"/>
    </radialGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="207" rx="30" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（低蹲防禦） ===== -->
      <ellipse cx="12" cy="185" rx="11" ry="17" fill="url(#tunnelBossPants)" transform="rotate(-4,12,185)"/>
      <ellipse cx="10" cy="201" rx="12" ry="6" fill="#2a1210"/>
      <ellipse cx="-14" cy="183" rx="12" ry="18" fill="url(#tunnelBossPants)" transform="rotate(4,-14,183)"/>
      <ellipse cx="-16" cy="201" rx="13" ry="6" fill="#2a1210"/>

      <!-- ===== 身體（蹲低防禦） ===== -->
      <ellipse cx="-2" cy="150" rx="26" ry="28" fill="url(#tunnelBossArmor)" transform="rotate(-4,-2,150)"/>

      <!-- 護肩 -->
      <ellipse cx="-26" cy="138" rx="10" ry="7" fill="#4a4040" stroke="#3a3434" stroke-width="0.8"/>
      <ellipse cx="22" cy="138" rx="10" ry="7" fill="#4a4040" stroke="#3a3434" stroke-width="0.8"/>

      <!-- 領口 -->
      <path d="M-12,136 L-4,148 L4,136" fill="none" stroke="#6a2828" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-26,180 Q-2,186 24,180" fill="none" stroke="#3a1818" stroke-width="5" stroke-linecap="round"/>
      <rect x="-7" y="178" width="9" height="9" rx="1" fill="#8a6830" stroke="#6a4820" stroke-width="0.5"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="94" rx="36" ry="38" fill="url(#tunnelBossHelmet)"/>
      <path d="M-2,56 L-2,80" fill="none" stroke="#5a5050" stroke-width="1.5" opacity="0.5"/>
      <path d="M-34,96 C-36,92 -32,88 -28,86 L26,86 C30,88 34,92 32,96" fill="url(#tunnelBossHelmet)" stroke="#3a3434" stroke-width="0.5"/>

      <path d="M-28,88 C-32,100 -30,116 -24,126 C-18,134 -6,138 4,136 C14,134 20,126 24,116 C28,104 26,90 20,82 C14,76 4,74 -6,76 C-16,78 -26,82 -28,88Z" fill="url(#tunnelBossFace)"/>

      <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,110" fill="url(#tunnelBossFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- 眼睛 -->
      <ellipse cx="-10" cy="108" rx="6.5" ry="5.5" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="4" ry="4" fill="#301410"/>
      <ellipse cx="-11.5" cy="108" rx="2.2" ry="2.5" fill="#180808"/>
      <circle cx="-13" cy="106.5" r="1.2" fill="#fff" opacity="0.6"/>

      <ellipse cx="8" cy="108" rx="6.5" ry="5.5" fill="#fff"/>
      <ellipse cx="7" cy="109" rx="4" ry="4" fill="#301410"/>
      <ellipse cx="6.5" cy="108" rx="2.2" ry="2.5" fill="#180808"/>
      <circle cx="5" cy="106.5" r="1.2" fill="#fff" opacity="0.6"/>

      <path d="M-16,101 C-12,98 -8,100 -4,103" fill="none" stroke="#2a1a10" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M10,103 C12,100 16,98 20,101" fill="none" stroke="#2a1a10" stroke-width="2.5" stroke-linecap="round"/>

      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <path d="M-14,130 C-10,131 -4,131 0,131 C4,131 8,130 12,129" fill="none" stroke="#5a4a38" stroke-width="0.8" opacity="0.4" stroke-dasharray="1,1.5"/>

      <path d="M-10,128 C-6,127 0,127 6,128" fill="none" stroke="#704840" stroke-width="2" stroke-linecap="round"/>

      <!-- ===== 左手臂（負x，火把收後） ===== -->
      <path d="M-22,142 Q-34,148 -36,162" fill="none" stroke="url(#tunnelBossArmor)" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-36" cy="164" r="5.5" fill="url(#tunnelBossFace)" opacity="0.85"/>
      <line x1="-38" y1="162" x2="-38" y2="132" stroke="#6a4420" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="-38" cy="126" rx="7" ry="9" fill="url(#tunnelBossFlame)" opacity="0.9"/>
      <ellipse cx="-38" cy="124" rx="4" ry="6" fill="#ffcc44" opacity="0.6"/>

      <!-- ===== 右手臂（正x，劍橫擋） ===== -->
      <path d="M24,142 Q36,136 42,132" fill="none" stroke="url(#tunnelBossArmor)" stroke-width="12" stroke-linecap="round"/>

      <!-- 劍（橫擋50.6px，劍在正x區域） -->
      <line x1="44" y1="128" x2="94" y2="118" stroke="#999" stroke-width="4" stroke-linecap="round"/>
      <line x1="94" y1="118" x2="98" y2="116" stroke="#bbb" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="132" x2="40" y2="128" stroke="#8a6830" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="42" y1="132" x2="38" y2="134" stroke="#4a3018" stroke-width="4" stroke-linecap="round"/>
      <circle cx="36" cy="135" r="2.5" fill="#8a6830"/>
      <circle cx="42" cy="130" r="5.5" fill="url(#tunnelBossFace)"/>
    </g>
  </g>
</svg>