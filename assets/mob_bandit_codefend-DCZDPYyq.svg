<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 山野毛賊 — 吉卜力2頭身 面朝右（敵方）協防（挺身護人） -->
  <defs>
    <radialGradient id="mobBanditFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </radialGradient>
    <linearGradient id="mobBanditCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a5a48"/>
      <stop offset="100%" stop-color="#4a3a28"/>
    </linearGradient>
    <linearGradient id="mobBanditPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a28"/>
      <stop offset="100%" stop-color="#2e2218"/>
    </linearGradient>
    <linearGradient id="mobBanditHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#282018"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="201" rx="26" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（挺身站立，比防禦高8px） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="178" rx="9" ry="14" fill="url(#mobBanditPants)" transform="rotate(-3,12,178)"/>
      <ellipse cx="10" cy="195" rx="10" ry="6" fill="#3a2818"/>
      <!-- 前腿（前跨一步） -->
      <ellipse cx="-12" cy="176" rx="10" ry="15" fill="url(#mobBanditPants)" transform="rotate(10,-12,176)"/>
      <ellipse cx="-16" cy="195" rx="10" ry="6" fill="#3a2818"/>

      <!-- ===== 身體（挺直護人，比防禦高8px） ===== -->
      <ellipse cx="-2" cy="148" rx="20" ry="24" fill="url(#mobBanditCloth)" transform="rotate(-2,-2,148)"/>

      <!-- 破衣裂痕 -->
      <path d="M-8,138 L-5,148" fill="none" stroke="#2e2218" stroke-width="0.8" opacity="0.4"/>
      <path d="M6,142 L9,150" fill="none" stroke="#2e2218" stroke-width="0.7" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-10,132 L-4,140 L4,132" fill="none" stroke="#5a4a38" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-20,166 Q-2,172 18,166" fill="none" stroke="#4a3820" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 畫面右側手臂（角色左手，向負x伸出護人） ===== -->
      <path d="M16,138 Q30,132 40,128" fill="none" stroke="url(#mobBanditCloth)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="40" cy="128" r="4.5" fill="url(#mobBanditFace)" opacity="0.85"/>

      <!-- ===== 畫面左側手臂（角色右手，持棍向正x前伸） ===== -->
      <path d="M-18,136 Q-36,130 -46,126" fill="none" stroke="url(#mobBanditCloth)" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== 短棍（向正x方向前伸，攻擊者方向） ===== -->
      <line x1="-80" y1="120" x2="-30" y2="130" stroke="#5a4028" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 握棍的手 -->
      <circle cx="-46" cy="126" r="5" fill="url(#mobBanditFace)"/>

      <!-- ===== 大頭（挺身護人，比防禦高8px） ===== -->
      <!-- 後腦蓬亂髮 -->
      <ellipse cx="0" cy="102" rx="34" ry="36" fill="url(#mobBanditHair)"/>

      <!-- 臉 -->
      <path d="M-22,92 C-26,102 -24,114 -18,124 C-12,132 -4,136 4,134 C10,132 14,126 18,116 C22,104 20,92 14,84 C8,78 2,76 -4,78 C-12,80 -20,86 -22,92Z" fill="url(#mobBanditFace)"/>

      <!-- 蓬亂頭髮頂部 -->
      <path d="M-16,82 C-12,64 4,56 16,60 C24,64 28,76 24,86 C20,78 14,72 6,70 C0,68 -8,70 -14,76" fill="url(#mobBanditHair)"/>

      <!-- 蓬亂瀏海 -->
      <path d="M-24,92 C-28,80 -32,84 -32,94 C-30,98 -24,98 -24,94" fill="url(#mobBanditHair)"/>
      <path d="M-20,86 C-24,74 -28,78 -28,88 C-26,92 -20,92 -20,88" fill="#3a3028"/>

      <!-- 側髮 -->
      <path d="M18,88 C24,82 26,90 24,98 C22,102 18,100 18,96" fill="url(#mobBanditHair)"/>

      <!-- 耳朵 -->
      <path d="M16,106 C20,102 22,108 20,114 C18,118 16,116 16,112" fill="url(#mobBanditFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（緊張注視，護人決心） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-10" cy="110" rx="5.5" ry="4" fill="#fff"/>
      <ellipse cx="-11" cy="110" rx="3.5" ry="3" fill="#383028"/>
      <ellipse cx="-11.5" cy="110" rx="2" ry="1.8" fill="#1a1008"/>
      <circle cx="-13" cy="109" r="1" fill="#fff" opacity="0.6"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="110" rx="5.5" ry="4" fill="#fff"/>
      <ellipse cx="5" cy="110" rx="3.5" ry="3" fill="#383028"/>
      <ellipse cx="4.5" cy="110" rx="2" ry="1.8" fill="#1a1008"/>
      <circle cx="3" cy="109" r="1" fill="#fff" opacity="0.6"/>

      <!-- 眉毛（皺眉，緊張護人） -->
      <path d="M-14,103 C-10,101 -8,102 -6,104" fill="none" stroke="#3a3028" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,104 C10,102 12,101 16,103" fill="none" stroke="#3a3028" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,118 C-16,122 -12,126" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（緊抿，努力護人） -->
      <path d="M-8,130 C-4,131 2,131 6,130" fill="none" stroke="#704840" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
