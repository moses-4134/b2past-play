<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 嬴政 — 吉卜力2頭身 側面朝左 協防（挺身護人） -->
  <defs>
    <radialGradient id="yingFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f6ece0"/>
      <stop offset="100%" stop-color="#e8d4c0"/>
    </radialGradient>
    <linearGradient id="yingRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a2840"/>
      <stop offset="100%" stop-color="#2a1830"/>
    </linearGradient>
    <linearGradient id="yingPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1e2e"/>
      <stop offset="100%" stop-color="#1a101a"/>
    </linearGradient>
    <linearGradient id="yingHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181010"/>
      <stop offset="100%" stop-color="#0c0606"/>
    </linearGradient>
    <linearGradient id="yingSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-8" cy="222" rx="28" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（站立前踏，挺身護人） ===== -->
    <!-- 後腿（右腿，穩定支撐） -->
    <ellipse cx="12" cy="195" rx="8.5" ry="16" fill="url(#yingPants)" transform="rotate(-3,12,195)"/>
    <ellipse cx="10" cy="213" rx="9.5" ry="6.5" fill="#2a1820"/>
    <!-- 前腿（左腿，大步前踏護人） -->
    <ellipse cx="-18" cy="193" rx="9" ry="16" fill="url(#yingPants)" transform="rotate(8,-18,193)"/>
    <ellipse cx="-22" cy="213" rx="10" ry="6.5" fill="#2a1820"/>

    <!-- ===== 身體（挺立，略前傾護人） ===== -->
    <ellipse cx="-4" cy="160" rx="24" ry="28" fill="url(#yingRobe)" transform="rotate(-8,-4,160)"/>

    <!-- 領口（金邊） -->
    <path d="M-13,137 L-7,150 L-1,137" fill="none" stroke="#d4a840" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 金色邊飾（衣襟） -->
    <path d="M-7,150 L-7,176" fill="none" stroke="#d4a840" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- 腰帶（金色扣） -->
    <path d="M-26,178 Q-4,185 18,178" fill="none" stroke="#3a2030" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-5" cy="182" r="3" fill="#d4a840"/>

    <!-- ===== 畫面右側手臂（角色左手，向後伸展護人姿態） ===== -->
    <path d="M16,142 Q28,148 36,158 Q42,166 40,174" fill="none" stroke="url(#yingRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <!-- 手掌朝後展開（帝王護人手勢） -->
    <circle cx="40" cy="176" r="5" fill="url(#yingFace)" opacity="0.85"/>
    <!-- 手指張開暗示 -->
    <path d="M38,172 L36,168" fill="none" stroke="url(#yingFace)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M42,172 L44,168" fill="none" stroke="url(#yingFace)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- ===== 畫面左側手臂（角色右手，持劍前伸護擋） ===== -->
    <path d="M-22,145 Q-40,136 -54,130" fill="none" stroke="url(#yingRobe)" stroke-width="10" stroke-linecap="round"/>
    <!-- 握劍的手 -->
    <circle cx="-54" cy="130" r="5" fill="url(#yingFace)"/>

    <!-- ===== 劍（前伸護擋，劍身護手劍柄共線） ===== -->
    <!-- 劍身（向前方伸出，略斜下護擋） -->
    <line x1="-57" y1="128" x2="-105" y2="116" stroke="url(#yingSteel)" stroke-width="4" stroke-linecap="round"/>
    <!-- 劍身亮線 -->
    <line x1="-57" y1="128" x2="-105" y2="116" stroke="#eee" stroke-width="1.5" opacity="0.4"/>
    <!-- 劍尖 -->
    <line x1="-105" y1="116" x2="-111" y2="114.5" stroke="#ccc" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 護手（金色華麗，垂直於劍身） -->
    <line x1="-58" y1="124" x2="-54" y2="134" stroke="#d4a840" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 護手裝飾 -->
    <circle cx="-58" cy="124" r="1.5" fill="#ffd860"/>
    <circle cx="-54" cy="134" r="1.5" fill="#ffd860"/>
    <!-- 劍柄（與劍身共線） -->
    <line x1="-52" y1="131" x2="-48" y2="133" stroke="#3a2030" stroke-width="4" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-46" cy="134" r="2.5" fill="#d4a840"/>

    <!-- ===== 大頭（堅定護人表情） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="93" rx="38" ry="40" fill="url(#yingHair)"/>

    <!-- 臉（英俊端正方臉，少年帝王） -->
    <path d="M-28,88 C-32,100 -30,116 -24,126 C-18,134 -6,138 4,136 C14,134 20,126 24,116 C28,104 26,90 20,82 C14,76 4,72 -4,74 C-16,76 -26,80 -28,88Z" fill="url(#yingFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-18,78 C-14,58 2,50 16,54 C28,58 34,70 30,82 C26,76 18,70 10,68 C2,66 -8,68 -14,74" fill="url(#yingHair)"/>

    <!-- 瀏海（整齊，不遮額） -->
    <path d="M-28,88 C-34,76 -36,80 -38,88 C-36,94 -30,96 -28,92" fill="url(#yingHair)"/>
    <path d="M-24,82 C-28,70 -32,74 -32,84 C-30,90 -24,90 -24,86" fill="#181010"/>
    <path d="M-20,78 C-22,68 -26,70 -26,80 C-24,86 -20,86 -20,82" fill="url(#yingHair)" opacity="0.9"/>

    <!-- 高冠髮髻（帝王標誌） -->
    <ellipse cx="4" cy="56" rx="10" ry="14" fill="url(#yingHair)"/>
    <path d="M-6,68 C-4,52 4,44 12,48 C18,52 18,62 14,70" fill="url(#yingHair)"/>
    <!-- 髮髻底部束帶 -->
    <ellipse cx="4" cy="70" rx="8" ry="3" fill="#181010" stroke="#2a1820" stroke-width="0.5"/>
    <!-- 金色簪子（皇族身份） -->
    <line x1="-8" y1="54" x2="16" y2="54" stroke="#d4a840" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-8" cy="54" r="2.5" fill="#ffd860"/>
    <circle cx="16" cy="54" r="1.5" fill="#d4a840"/>

    <!-- 側髮（整齊貼服） -->
    <path d="M22,84 C26,80 28,86 26,94 C24,100 22,98 22,92" fill="url(#yingHair)"/>
    <path d="M24,92 C26,90 28,96 26,104 C24,110 22,108 22,102" fill="url(#yingHair)" opacity="0.8"/>

    <!-- 耳朵 -->
    <path d="M20,100 C24,96 26,102 24,108 C22,112 20,110 20,106" fill="url(#yingFace)" stroke="#e0ceb8" stroke-width="0.5"/>

    <!-- ===== 眼睛（堅定護人，銳利） ===== -->
    <!-- 左眼 -->
    <ellipse cx="-11" cy="106" rx="7.5" ry="7" fill="#fff"/>
    <ellipse cx="-13" cy="107" rx="5" ry="5.5" fill="#1a1018"/>
    <ellipse cx="-13.5" cy="106" rx="3" ry="3.2" fill="#080408"/>
    <circle cx="-15" cy="104" r="2" fill="#fff" opacity="0.95"/>

    <!-- 右眼（同大小） -->
    <ellipse cx="5" cy="106" rx="7.5" ry="7" fill="#fff"/>
    <ellipse cx="3" cy="107" rx="5" ry="5.5" fill="#1a1018"/>
    <ellipse cx="2.5" cy="106" rx="3" ry="3.2" fill="#080408"/>
    <circle cx="1" cy="104" r="2" fill="#fff" opacity="0.95"/>

    <!-- 眉毛（緊皺，堅毅護人） -->
    <path d="M-18,98 C-14,96 -8,97" fill="none" stroke="#181010" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,98 C4,97 8,98" fill="none" stroke="#181010" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M-17,114 C-18,118 -16,122" fill="none" stroke="#d8c0a8" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（堅定一字線，緊抿） -->
    <path d="M-12,128 C-8,127 -3,127 1,128" fill="none" stroke="#806050" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
