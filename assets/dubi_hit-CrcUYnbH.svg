<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 蔡璋 — 吉卜力2頭身 面朝右（敵方）受擊 -->
  <defs>
    <radialGradient id="dubiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0d0c0"/>
      <stop offset="100%" stop-color="#d0c0a8"/>
    </radialGradient>
    <linearGradient id="dubiRobe" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0c0c18"/>
    </linearGradient>
    <linearGradient id="dubiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="dubiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="2" cy="225" rx="28" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（後退踉蹌） ===== -->
      <ellipse cx="14" cy="200" rx="9" ry="16" fill="url(#dubiPants)" transform="rotate(8,14,200)"/>
      <ellipse cx="16" cy="216" rx="10" ry="6" fill="#1a1a20"/>
      <ellipse cx="-8" cy="202" rx="10" ry="16" fill="url(#dubiPants)" transform="rotate(-5,-8,202)"/>
      <ellipse cx="-9" cy="218" rx="11" ry="6" fill="#1a1a20"/>

      <!-- ===== 身體（後仰受擊） ===== -->
      <ellipse cx="0" cy="158" rx="26" ry="30" fill="url(#dubiRobe)" transform="rotate(8,0,158)"/>

      <!-- 內袍領口 -->
      <path d="M-10,136 L-2,152 L8,136" fill="none" stroke="#4a1a1a" stroke-width="3" stroke-linejoin="round"/>

      <!-- 銅腰帶 -->
      <path d="M-24,182 Q0,190 24,182" fill="none" stroke="#8a7030" stroke-width="5" stroke-linecap="round"/>
      <rect x="-4" y="180" width="7" height="7" rx="1" fill="#8a7030" stroke="#6a5020" stroke-width="0.5"/>

      <!-- ===== 大頭（後仰，帽歪） ===== -->
      <ellipse cx="2" cy="92" rx="38" ry="40" fill="url(#dubiHair)"/>

      <!-- 臉 -->
      <path d="M-28,86 C-32,98 -30,116 -24,128 C-18,136 -4,140 4,138 C14,136 24,128 28,116 C32,104 30,90 24,82 C18,76 6,72 -2,74 C-16,76 -26,80 -28,86Z" fill="url(#dubiFace)"/>

      <!-- 黑眼圈 -->
      <ellipse cx="-10" cy="110" rx="8" ry="4" fill="#c0b098" opacity="0.3"/>
      <ellipse cx="10" cy="110" rx="8" ry="4" fill="#c0b098" opacity="0.3"/>

      <!-- 官帽（歪斜） -->
      <g transform="rotate(12,-2,62)">
        <rect x="-24" y="58" width="44" height="14" rx="2" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="0.5"/>
        <rect x="-20" y="52" width="36" height="8" rx="1" fill="#0c0c0c"/>
        <path d="M-24,64 L-38,60 L-36,66 Z" fill="#0a0a0a"/>
        <path d="M20,64 L34,60 L32,66 Z" fill="#0a0a0a"/>
      </g>

      <!-- 頭髮 -->
      <path d="M-18,76 C-14,64 2,58 16,62 C26,66 30,76 28,82 C24,76 16,72 8,70 C0,68 -10,70 -16,74" fill="url(#dubiHair)"/>
      <path d="M24,84 C28,80 30,88 28,96 C26,102 24,98 24,94" fill="url(#dubiHair)"/>

      <!-- 耳朵 -->
      <path d="M24,100 C28,96 30,102 28,110 C26,114 24,112 24,106" fill="url(#dubiFace)" stroke="#b0a088" stroke-width="0.5"/>

      <!-- ===== 眼（驚怒，瞪大） ===== -->
      <ellipse cx="-10" cy="106" rx="7" ry="6" fill="#fff"/>
      <ellipse cx="-11" cy="107" rx="4" ry="4.5" fill="#2a1a10"/>
      <ellipse cx="-11.5" cy="106" rx="2.2" ry="2.5" fill="#0a0400"/>
      <circle cx="-13" cy="104" r="1.4" fill="#fff" opacity="0.5"/>

      <ellipse cx="10" cy="106" rx="7" ry="6" fill="#fff"/>
      <ellipse cx="9" cy="107" rx="4" ry="4.5" fill="#2a1a10"/>
      <ellipse cx="8.5" cy="106" rx="2.2" ry="2.5" fill="#0a0400"/>
      <circle cx="7" cy="104" r="1.4" fill="#fff" opacity="0.5"/>

      <!-- 薄眉（怒皺） -->
      <path d="M-16,99 C-12,97 -8,99 -6,101" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
      <path d="M14,101 C16,99 20,97 22,99" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-4,112 C-6,118 -2,122" fill="none" stroke="#b0a080" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（憤怒張口） -->
      <ellipse cx="-2" cy="131" rx="8" ry="4" fill="#3a1a18"/>
      <path d="M-10,130 C-6,128 0,128 6,130" fill="none" stroke="#705040" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 山羊鬍 -->
      <line x1="-2" y1="136" x2="-3" y2="142" stroke="#2a2a2a" stroke-width="0.8" opacity="0.5"/>
      <line x1="0" y1="136" x2="0" y2="143" stroke="#2a2a2a" stroke-width="0.8" opacity="0.6"/>
      <line x1="2" y1="136" x2="3" y2="142" stroke="#2a2a2a" stroke-width="0.8" opacity="0.5"/>

      <!-- 受擊效果線 -->
      <line x1="-40" y1="100" x2="-48" y2="96" stroke="#ff4444" stroke-width="1.5" opacity="0.4"/>
      <line x1="-38" y1="108" x2="-46" y2="108" stroke="#ff4444" stroke-width="1.5" opacity="0.3"/>
      <line x1="-38" y1="116" x2="-46" y2="120" stroke="#ff4444" stroke-width="1.5" opacity="0.4"/>

      <!-- ===== 空手臂（負x，後甩） ===== -->
      <path d="M-20,148 Q-36,156 -42,170" fill="none" stroke="url(#dubiRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-42" cy="172" r="5" fill="url(#dubiFace)" opacity="0.85"/>

      <!-- ===== 右手臂（正x，受擊後甩） ===== -->
      <path d="M26,148 Q38,160 36,174" fill="none" stroke="url(#dubiRobe)" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="36" cy="176" rx="7" ry="5" fill="#101020" transform="rotate(-8,36,176)"/>
      <circle cx="38" cy="176" r="4.5" fill="url(#dubiFace)"/>
      <!-- 袖中散落的暗針 -->
      <line x1="40" y1="178" x2="46" y2="196" stroke="#a0a8b0" stroke-width="1" opacity="0.35"/>
      <line x1="42" y1="180" x2="50" y2="194" stroke="#a0a8b0" stroke-width="0.8" opacity="0.25"/>
    </g>
  </g>
</svg>
