<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 王翦 — 吉卜力2頭身 側面朝左 技能（槍高舉蓄力） -->
  <defs>
    <radialGradient id="wangFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c0a0"/>
      <stop offset="100%" stop-color="#c8a888"/>
    </radialGradient>
    <linearGradient id="wangJacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a4030"/>
      <stop offset="100%" stop-color="#4a2820"/>
    </linearGradient>
    <linearGradient id="wangPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="100%" stop-color="#222220"/>
    </linearGradient>
    <linearGradient id="wangHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#484848"/>
    </linearGradient>
    <linearGradient id="wangSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="222" rx="29" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（穩健站姿） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="12" cy="199" rx="10" ry="17" fill="url(#wangPants)" transform="rotate(-5,12,199)"/>
    <ellipse cx="10" cy="215" rx="11" ry="7" fill="#3a2818"/>
    <!-- 前腿（左腿） -->
    <ellipse cx="-14" cy="197" rx="10" ry="17" fill="url(#wangPants)" transform="rotate(5,-14,197)"/>
    <ellipse cx="-16" cy="215" rx="11" ry="7" fill="#3a2818"/>

    <!-- ===== 身體（挺立蓄力） ===== -->
    <ellipse cx="-2" cy="159" rx="27" ry="29" fill="url(#wangJacket)" transform="rotate(-3,-2,159)"/>

    <!-- 肩甲護肩 -->
    <rect x="-30" y="135" width="10" height="8" rx="2" fill="#5a3828" stroke="#4a2818" stroke-width="0.5"/>
    <rect x="18" y="135" width="10" height="8" rx="2" fill="#5a3828" stroke="#4a2818" stroke-width="0.5"/>

    <!-- 領口 -->
    <path d="M-12,137 L-6,151 L2,137" fill="none" stroke="#8a7058" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-27,179 Q-2,187 23,179" fill="none" stroke="#5a4030" stroke-width="6" stroke-linecap="round"/>
    <rect x="-8" y="177" width="8" height="8" rx="1" fill="#c8a848" stroke="#a08030" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手，握槍後段） ===== -->
    <path d="M20,143 Q14,138 -4,140" fill="none" stroke="url(#wangJacket)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
    <circle cx="-6" cy="142" r="5.5" fill="url(#wangFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，握槍前段） ===== -->
    <path d="M-26,145 Q-40,130 -50,118" fill="none" stroke="url(#wangJacket)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-50" cy="116" r="5.5" fill="url(#wangFace)"/>

    <!-- ===== 槍（穿過兩手：右手(-50,116)、左手(-6,142)） ===== -->
    <!-- 槍桿 -->
    <line x1="-76" y1="101" x2="3" y2="147" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
    <!-- 槍頭 -->
    <path d="M-88,95 L-74,98 L-78,105 Z" fill="url(#wangSteel)" stroke="#888" stroke-width="0.5"/>
    <!-- 槍纓 -->
    <line x1="-74" y1="101" x2="-71" y2="96" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-76" y1="104" x2="-73" y2="99" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-78" y1="107" x2="-75" y2="102" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ===== 大頭（堅定注視） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="96" rx="40" ry="42" fill="url(#wangHair)"/>

    <!-- 臉（國字臉） -->
    <path d="M-30,88 C-34,100 -32,116 -26,126 C-20,134 -8,138 2,136 C12,134 22,128 26,118 C30,106 28,92 22,84 C16,78 4,74 -6,76 C-18,78 -28,82 -30,88Z" fill="url(#wangFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-20,78 C-16,60 0,52 14,56 C26,60 32,72 28,82 C24,76 16,70 8,68 C0,66 -10,68 -16,74" fill="url(#wangHair)"/>

    <!-- 短瀏海 -->
    <path d="M-28,88 C-32,78 -34,82 -34,88 C-32,92 -28,92 -28,90" fill="url(#wangHair)"/>
    <path d="M-24,82 C-26,74 -30,76 -30,84 C-28,88 -24,88 -24,86" fill="#484848"/>

    <!-- 武將頭冠 -->
    <path d="M-26,76 C-18,68 0,64 18,68 C26,70 30,74 28,78" fill="none" stroke="#a07840" stroke-width="4" stroke-linecap="round"/>
    <path d="M-8,66 C-6,58 0,56 6,58 C8,60 8,64 6,66" fill="#a07840" stroke="#806030" stroke-width="0.5"/>

    <!-- 側髮 -->
    <path d="M22,84 C26,80 28,86 26,92 C24,96 22,94 22,90" fill="url(#wangHair)"/>

    <!-- 耳朵 -->
    <path d="M20,102 C24,98 26,104 24,110 C22,114 20,112 20,108" fill="url(#wangFace)" stroke="#c0a080" stroke-width="0.5"/>

    <!-- ===== 眼睛（堅定蓄力） ===== -->
    <!-- 左眼 -->
    <ellipse cx="-12" cy="108" rx="6" ry="5.5" fill="#fff"/>
    <ellipse cx="-13" cy="109" rx="4" ry="4" fill="#282018"/>
    <ellipse cx="-13.5" cy="108" rx="2.5" ry="2.5" fill="#100804"/>
    <circle cx="-15" cy="106.5" r="1" fill="#fff" opacity="0.6"/>

    <!-- 右眼 -->
    <ellipse cx="4" cy="108" rx="6" ry="5.5" fill="#fff"/>
    <ellipse cx="3" cy="109" rx="4" ry="4" fill="#282018"/>
    <ellipse cx="2.5" cy="108" rx="2.5" ry="2.5" fill="#100804"/>
    <circle cx="1" cy="106.5" r="1" fill="#fff" opacity="0.6"/>

    <!-- 鼻子 -->
    <path d="M-18,116 C-19,120 -17,124" fill="none" stroke="#b89870" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 八字鬍 -->
    <path d="M-16,128 C-14,130 -10,131 -8,130" fill="none" stroke="#606060" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-4,128 C-2,130 2,131 4,130" fill="none" stroke="#606060" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 下巴短鬚 -->
    <path d="M-10,134 C-8,138 -4,138 -2,134" fill="none" stroke="#606060" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-6" y1="134" x2="-6" y2="138" stroke="#606060" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

    <!-- 嘴巴（嚴肅蓄力） -->
    <path d="M-14,131 C-10,131 -4,131 0,131" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
