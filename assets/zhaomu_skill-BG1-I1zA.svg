<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙嵬 — 吉卜力2頭身 面朝右（敵方）技能（暗術施放，紫綠毒氣） -->
  <defs>
    <radialGradient id="zmFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e0d0"/>
      <stop offset="100%" stop-color="#d8c4a8"/>
    </radialGradient>
    <linearGradient id="zmRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a2858"/>
      <stop offset="100%" stop-color="#2a1838"/>
    </linearGradient>
    <linearGradient id="zmInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3828"/>
      <stop offset="100%" stop-color="#1a2818"/>
    </linearGradient>
    <linearGradient id="zmHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#201820"/>
      <stop offset="100%" stop-color="#100810"/>
    </linearGradient>
    <radialGradient id="zmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80e080" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#40a060" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#208040" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 14)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="203.5" rx="24" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿 ===== -->
      <ellipse cx="8" cy="184" rx="7" ry="14" fill="url(#zmInner)" transform="rotate(-3,8,184)"/>
      <ellipse cx="6" cy="198" rx="8" ry="5.5" fill="#2a2020"/>
      <ellipse cx="-10" cy="182" rx="8" ry="15" fill="url(#zmInner)" transform="rotate(3,-10,182)"/>
      <ellipse cx="-12" cy="198" rx="9" ry="5.5" fill="#2a2020"/>

      <!-- ===== 身體 ===== -->
      <ellipse cx="-2" cy="154" rx="23" ry="25" fill="url(#zmRobe)" transform="rotate(-3,-2,154)"/>

      <path d="M-10,132 L-5,146 L2,132" fill="none" stroke="#2a3828" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <path d="M-22,170 Q-2,178 18,170" fill="none" stroke="#c8a040" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-3" cy="174" r="3" fill="#d8b050"/>

      <!-- ===== 畫面左側手臂（角色右手，前伸施術） ===== -->
      <path d="M-20,142 Q-38,130 -46,124" fill="none" stroke="url(#zmRobe)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-47" cy="126" r="5" fill="url(#zmFace)"/>

      <!-- ===== 畫面右側手臂（角色左手，同樣前伸） ===== -->
      <path d="M16,140 Q30,130 38,124" fill="none" stroke="url(#zmRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="39" cy="126" r="4.5" fill="url(#zmFace)" opacity="0.85"/>

      <!-- 袖口金邊 -->
      <path d="M-44,120 Q-47,124 -44,128" fill="none" stroke="#c8a040" stroke-width="1" opacity="0.5"/>
      <path d="M36,120 Q39,124 36,128" fill="none" stroke="#c8a040" stroke-width="1" opacity="0.5"/>

      <!-- ===== 毒氣光球（掌心之間） ===== -->
      <ellipse cx="-4" cy="124" rx="24" ry="20" fill="url(#zmGlow)"/>
      <ellipse cx="-4" cy="124" rx="12" ry="10" fill="#60c070" opacity="0.3"/>
      <ellipse cx="-4" cy="124" rx="5" ry="4" fill="#a0f0a0" opacity="0.25"/>
      <!-- 毒氣粒子 -->
      <circle cx="-16" cy="114" r="1.5" fill="#80e080" opacity="0.5"/>
      <circle cx="8" cy="116" r="1.2" fill="#60c060" opacity="0.4"/>
      <circle cx="-10" cy="136" r="1" fill="#80e080" opacity="0.35"/>
      <circle cx="4" cy="134" r="1.5" fill="#60c060" opacity="0.45"/>
      <circle cx="-20" cy="126" r="0.8" fill="#a0f0a0" opacity="0.3"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="94" rx="36" ry="38" fill="url(#zmHair)"/>

      <path d="M-22,86 C-26,96 -24,112 -18,122 C-12,130 -4,134 4,132 C10,130 16,124 20,114 C24,102 22,90 16,82 C10,76 2,74 -4,76 C-12,78 -20,82 -22,86Z" fill="url(#zmFace)"/>

      <path d="M-14,78 C-10,56 6,48 18,54 C26,60 28,72 24,82 C20,74 12,66 4,64 C-4,62 -10,66 -14,74" fill="url(#zmHair)"/>

      <path d="M-12,60 C-8,46 8,42 16,48 C20,52 18,58 14,60" fill="#201820" stroke="#c8a040" stroke-width="1"/>
      <rect x="-2" y="42" width="8" height="6" rx="1" fill="#c8a040"/>
      <circle cx="2" cy="45" r="2" fill="#e8c060"/>

      <path d="M20,84 C26,80 28,88 26,96 C24,102 20,100 20,94" fill="url(#zmHair)"/>
      <path d="M22,96 C26,94 28,102 26,110" fill="none" stroke="#606060" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <path d="M-26,88 C-30,100 -30,112 -28,122" fill="none" stroke="url(#zmHair)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

      <path d="M18,100 C22,96 24,102 22,108 C20,112 18,110 18,106" fill="url(#zmFace)" stroke="#d0b498" stroke-width="0.5"/>

      <!-- ===== 眼睛（施術專注，瞳孔微帶綠光） ===== -->
      <ellipse cx="-9" cy="106" rx="7" ry="5" fill="#fff" transform="rotate(-5,-9,106)"/>
      <ellipse cx="-10" cy="107" rx="4" ry="3.5" fill="#1a2818"/>
      <ellipse cx="-10.5" cy="106.5" rx="2" ry="2" fill="#0c0404"/>
      <circle cx="-12" cy="105" r="1.2" fill="#a0f0a0" opacity="0.6"/>

      <ellipse cx="6" cy="106" rx="7" ry="5" fill="#fff" transform="rotate(-5,6,106)"/>
      <ellipse cx="5" cy="107" rx="4" ry="3.5" fill="#1a2818"/>
      <ellipse cx="4.5" cy="106.5" rx="2" ry="2" fill="#0c0404"/>
      <circle cx="3" cy="105" r="1.2" fill="#a0f0a0" opacity="0.6"/>

      <path d="M-16,98 C-12,96 -8,97 -4,100" fill="none" stroke="#201820" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M2,100 C6,97 10,96 14,98" fill="none" stroke="#201820" stroke-width="2.5" stroke-linecap="round"/>

      <path d="M-12,114 C-13,118 -11,120" fill="none" stroke="#c8b090" stroke-width="1.2" stroke-linecap="round"/>

      <path d="M-8,122 C-12,126 -16,127" fill="none" stroke="#302828" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M0,122 C4,126 8,127" fill="none" stroke="#302828" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 嘴巴（陰狠笑容） -->
      <path d="M-6,128 C-2,131 2,131 6,128" fill="none" stroke="#705040" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M6,128 C8,126 10,125" fill="none" stroke="#705040" stroke-width="1" opacity="0.6"/>
    </g>
  </g>
</svg>