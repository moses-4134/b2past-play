<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙嵬暗殺者 — 吉卜力2頭身 面朝右（敵方）倒地/戰敗 -->
  <defs>
    <radialGradient id="mobAssassinFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8c8b8"/>
      <stop offset="100%" stop-color="#c4b4a0"/>
    </radialGradient>
    <linearGradient id="mobAssassinArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
    <linearGradient id="mobAssassinPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>
    <linearGradient id="mobAssassinHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="mobAssassinBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0a8b0"/>
      <stop offset="100%" stop-color="#606870"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(78, 10)">
      <!-- 陰影（倒地拉長） -->
      <ellipse cx="-4" cy="228" rx="36" ry="4" fill="#000" opacity="0.08"/>

      <g transform="rotate(90, -4, 176)">
        <!-- ===== 腿（放鬆垂落） ===== -->
        <!-- 後腿 -->
        <ellipse cx="8" cy="170" rx="9" ry="14" fill="url(#mobAssassinPants)"/>
        <ellipse cx="6" cy="185" rx="10" ry="6" fill="#0e0e14"/>
        <!-- 前腿 -->
        <ellipse cx="-10" cy="171" rx="9" ry="15" fill="url(#mobAssassinPants)"/>
        <ellipse cx="-12" cy="185" rx="10" ry="6" fill="#0e0e14"/>

        <!-- ===== 身體（放鬆） ===== -->
        <ellipse cx="-2" cy="142" rx="20" ry="22" fill="url(#mobAssassinArmor)"/>

        <!-- 領口 -->
        <path d="M-8,124 L-3,132 L3,124" fill="none" stroke="#2a2a30" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- 腰帶 -->
        <path d="M-18,156 Q-2,162 16,156" fill="none" stroke="#181820" stroke-width="4" stroke-linecap="round"/>
        <rect x="-4" y="154" width="5" height="5" rx="1" fill="#2a2a30" stroke="#1a1a20" stroke-width="0.5"/>

        <!-- ===== 畫面右側手臂（自然垂落） ===== -->
        <path d="M14,128 Q26,138 22,152" fill="none" stroke="url(#mobAssassinArmor)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
        <circle cx="22" cy="154" r="4.5" fill="url(#mobAssassinFace)" opacity="0.85"/>

        <!-- ===== 畫面左側手臂（自然垂落，匕首脫手） ===== -->
        <path d="M-18,128 Q-30,136 -34,146" fill="none" stroke="url(#mobAssassinArmor)" stroke-width="9" stroke-linecap="round"/>
        <circle cx="-34" cy="148" r="4.5" fill="url(#mobAssassinFace)"/>

        <!-- ===== 匕首（脫手掉落） ===== -->
        <line x1="-62" y1="190" x2="-42" y2="196" stroke="url(#mobAssassinBlade)" stroke-width="3" stroke-linecap="round"/>
        <line x1="-40" y1="193" x2="-38" y2="200" stroke="#2a2a30" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-36" y1="198" x2="-32" y2="200" stroke="#181820" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-30" cy="201" r="2" fill="#2a2a30"/>

        <!-- ===== 大頭 ===== -->
        <ellipse cx="0" cy="102" rx="32" ry="34" fill="url(#mobAssassinHair)"/>

        <!-- 臉 -->
        <path d="M-20,92 C-24,98 -22,112 -16,120 C-12,126 -4,130 2,128 C8,126 14,120 16,112 C20,102 18,92 14,86 C8,80 2,78 -2,80 C-12,82 -18,86 -20,92Z" fill="url(#mobAssassinFace)"/>

        <!-- 短髮頂部 -->
        <path d="M-14,82 C-10,66 2,60 12,64 C20,68 24,78 20,86 C16,80 10,74 4,72 C0,70 -8,72 -12,78" fill="url(#mobAssassinHair)"/>

        <!-- 側髮 -->
        <path d="M14,86 C18,82 20,88 18,94 C16,98 14,96 14,92" fill="url(#mobAssassinHair)"/>
        <path d="M-20,90 C-24,84 -26,88 -24,96 C-22,100 -20,98 -20,94" fill="url(#mobAssassinHair)"/>

        <!-- 耳朵 -->
        <path d="M14,104 C18,100 20,106 18,112 C16,116 14,114 14,110" fill="url(#mobAssassinFace)" stroke="#b0a490" stroke-width="0.5"/>

        <!-- ===== 眼睛（閉眼橫線） ===== -->
        <line x1="-12" y1="108" x2="-4" y2="108" stroke="#201820" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="0" y1="108" x2="8" y2="108" stroke="#201820" stroke-width="1.5" stroke-linecap="round"/>

        <!-- 眉毛（放鬆） -->
        <path d="M-12,104 C-10,102 -6,103 -4,105" fill="none" stroke="#181818" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
        <path d="M6,105 C8,103 12,102 14,104" fill="none" stroke="#181818" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

        <!-- 鼻子 -->
        <path d="M-10,114 C-12,118 -8,120" fill="none" stroke="#b0a490" stroke-width="1" stroke-linecap="round"/>

        <!-- ===== 面罩（倒地微歪） ===== -->
        <path d="M-18,114 C-20,118 -18,126 -14,130 C-8,134 0,136 4,134 C10,132 14,126 16,120 C18,116 16,112 14,110 L-16,110 Z" fill="#121218" opacity="0.82"/>
        <path d="M-10,118 L-7,126" fill="none" stroke="#1a1a20" stroke-width="0.6" opacity="0.3"/>
        <path d="M-18,114 C-22,112 -24,110 -22,108" fill="none" stroke="#121218" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M16,112 C20,110 22,108 20,106" fill="none" stroke="#121218" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
