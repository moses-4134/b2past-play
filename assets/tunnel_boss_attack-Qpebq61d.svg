<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 密道守將 — 吉卜力2頭身 面朝右（敵方）攻擊：劍向前劈砍 -->
  <defs>
    <radialGradient id="tunnelBossFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc098"/>
      <stop offset="100%" stop-color="#c4a478"/>
    </radialGradient>
    <linearGradient id="tunnelBossArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a2020"/>
      <stop offset="100%" stop-color="#3a1414"/>
    </linearGradient>
    <linearGradient id="tunnelBossPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1818"/>
      <stop offset="100%" stop-color="#1e0e0e"/>
    </linearGradient>
    <linearGradient id="tunnelBossHelmet" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#4a4040"/>
      <stop offset="100%" stop-color="#2a2424"/>
    </linearGradient>
    <radialGradient id="tunnelBossFlame" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ff8820"/>
      <stop offset="100%" stop-color="#ff4400"/>
    </radialGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="217" rx="30" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前踏攻擊） ===== -->
      <ellipse cx="12" cy="189" rx="11" ry="17" fill="url(#tunnelBossPants)" transform="rotate(-4,12,189)"/>
      <ellipse cx="10" cy="211" rx="12" ry="6" fill="#2a1210"/>
      <ellipse cx="-22" cy="187" rx="12" ry="18" fill="url(#tunnelBossPants)" transform="rotate(7,-22,187)"/>
      <ellipse cx="-24" cy="211" rx="13" ry="6" fill="#2a1210"/>

      <!-- ===== 身體（前傾劈砍） ===== -->
      <ellipse cx="-2" cy="150" rx="26" ry="28" fill="url(#tunnelBossArmor)" transform="rotate(-12,-2,150)"/>

      <!-- 護肩 -->
      <ellipse cx="-26" cy="138" rx="10" ry="7" fill="#4a4040" stroke="#3a3434" stroke-width="0.8"/>
      <ellipse cx="22" cy="140" rx="10" ry="7" fill="#4a4040" stroke="#3a3434" stroke-width="0.8"/>

      <!-- 領口 -->
      <path d="M-14,136 L-6,150 L2,136" fill="none" stroke="#6a2828" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-26,184 Q-2,190 24,184" fill="none" stroke="#3a1818" stroke-width="5" stroke-linecap="round"/>
      <rect x="-7" y="182" width="9" height="9" rx="1" fill="#8a6830" stroke="#6a4820" stroke-width="0.5"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="94" rx="36" ry="38" fill="url(#tunnelBossHelmet)"/>
      <path d="M-2,56 L-2,80" fill="none" stroke="#5a5050" stroke-width="1.5" opacity="0.5"/>
      <path d="M-34,96 C-36,92 -32,88 -28,86 L26,86 C30,88 34,92 32,96" fill="url(#tunnelBossHelmet)" stroke="#3a3434" stroke-width="0.5"/>

      <!-- 臉 -->
      <path d="M-28,88 C-32,100 -30,116 -24,126 C-18,134 -6,138 4,136 C14,134 20,126 24,116 C28,104 26,90 20,82 C14,76 4,74 -6,76 C-16,78 -26,82 -28,88Z" fill="url(#tunnelBossFace)"/>

      <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,110" fill="url(#tunnelBossFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- 眼睛 -->
      <ellipse cx="-10" cy="108" rx="6.5" ry="5.5" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="4" ry="4" fill="#301410"/>
      <ellipse cx="-11.5" cy="108" rx="2.2" ry="2.5" fill="#180808"/>
      <circle cx="-13" cy="106.5" r="1.2" fill="#fff" opacity="0.6"/>

      <ellipse cx="8" cy="108" rx="6.5" ry="5.5" fill="#fff"/>
      <ellipse cx="7" cy="109" rx="4" ry="4" fill="#301410"/>
      <ellipse cx="6.5" cy="108" rx="2.2" ry="2.5" fill="#180808"/>
      <circle cx="5" cy="106.5" r="1.2" fill="#fff" opacity="0.6"/>

      <path d="M-16,101 C-12,98 -8,100 -4,103" fill="none" stroke="#2a1a10" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M10,103 C12,100 16,98 20,101" fill="none" stroke="#2a1a10" stroke-width="2.5" stroke-linecap="round"/>

      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 短鬍渣 -->
      <path d="M-14,130 C-10,131 -4,131 0,131 C4,131 8,130 12,129" fill="none" stroke="#5a4a38" stroke-width="0.8" opacity="0.4" stroke-dasharray="1,1.5"/>

      <!-- 嘴巴（怒吼） -->
      <ellipse cx="-2" cy="130" rx="6" ry="4" fill="#502020"/>
      <line x1="-6" y1="129" x2="2" y2="129" stroke="#d8d0c0" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

      <!-- ===== 左手臂（負x，火把後收） ===== -->
      <path d="M-22,146 Q-36,154 -38,168" fill="none" stroke="url(#tunnelBossArmor)" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-38" cy="170" r="5.5" fill="url(#tunnelBossFace)" opacity="0.85"/>
      <!-- 火把 -->
      <line x1="-40" y1="168" x2="-40" y2="138" stroke="#6a4420" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="-40" cy="132" rx="7" ry="9" fill="url(#tunnelBossFlame)" opacity="0.9"/>
      <ellipse cx="-40" cy="130" rx="4" ry="6" fill="#ffcc44" opacity="0.6"/>

      <!-- ===== 右手臂（正x右肩，劍前劈到負x） ===== -->
      <path d="M22,146 Q-10,132 -58,124" fill="none" stroke="url(#tunnelBossArmor)" stroke-width="12" stroke-linecap="round"/>

      <!-- 劍（前劈50.6px） -->
      <line x1="-60" y1="120" x2="-72" y2="71" stroke="#999" stroke-width="4" stroke-linecap="round"/>
      <line x1="-72" y1="71" x2="-74" y2="65" stroke="#bbb" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-61" y1="118" x2="-73" y2="69" stroke="#ccc" stroke-width="0.8" opacity="0.3"/>
      <line x1="-64" y1="124" x2="-56" y2="120" stroke="#8a6830" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-58" y1="124" x2="-56.5" y2="130" stroke="#4a3018" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-56" cy="132" r="2.5" fill="#8a6830"/>
      <circle cx="-58" cy="124" r="5.5" fill="url(#tunnelBossFace)"/>
    </g>
  </g>
</svg>