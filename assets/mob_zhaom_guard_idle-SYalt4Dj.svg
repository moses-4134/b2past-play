<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙嵬府衛 — 吉卜力2頭身 面朝右（敵方）戰鬥待機 -->
  <defs>
    <radialGradient id="mobZMGuardFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </radialGradient>
    <linearGradient id="mobZMGuardArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a2020"/>
      <stop offset="100%" stop-color="#3a1414"/>
    </linearGradient>
    <linearGradient id="mobZMGuardPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1818"/>
      <stop offset="100%" stop-color="#1e0e0e"/>
    </linearGradient>
    <linearGradient id="mobZMGuardHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="mobZMGuardBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aaa"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="28" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿 ===== -->
      <ellipse cx="10" cy="186" rx="10" ry="16" fill="url(#mobZMGuardPants)" transform="rotate(-4,10,186)"/>
      <ellipse cx="8" cy="206" rx="11" ry="6" fill="#2a1210"/>
      <ellipse cx="-12" cy="183" rx="11" ry="17" fill="url(#mobZMGuardPants)" transform="rotate(4,-12,184)"/>
      <ellipse cx="-14" cy="206" rx="12" ry="6" fill="#2a1210"/>

      <!-- ===== 身體（正常體型） ===== -->
      <ellipse cx="-2" cy="148" rx="24" ry="26" fill="url(#mobZMGuardArmor)" transform="rotate(-4,-2,148)"/>

      <!-- 甲片紋路 -->
      <path d="M-10,148 L-7,160" fill="none" stroke="#2a0e0e" stroke-width="0.8" opacity="0.4"/>
      <path d="M6,152 L9,164" fill="none" stroke="#2a0e0e" stroke-width="0.7" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-12,138 L-4,150 L4,138" fill="none" stroke="#6a2828" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-24,180 Q-2,186 22,180" fill="none" stroke="#3a1818" stroke-width="5" stroke-linecap="round"/>
      <rect x="-7" y="178" width="8" height="8" rx="1" fill="#8a6830" stroke="#6a4820" stroke-width="0.5"/>

      <!-- ===== 畫面左側手臂（角色右手，持小盾） ===== -->
      <path d="M-20,146 Q-36,150 -38,162" fill="none" stroke="url(#mobZMGuardArmor)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-38" cy="164" r="5" fill="url(#mobZMGuardFace)" opacity="0.85"/>
      <!-- 小盾 -->
      <ellipse cx="-42" cy="144" rx="8" ry="10" fill="#5a2020" stroke="#3a1414" stroke-width="1"/>
      <line x1="-42" y1="148" x2="-42" y2="164" stroke="#6a3030" stroke-width="1" opacity="0.5"/>
      <line x1="-36" y1="156" x2="-48" y2="156" stroke="#6a3030" stroke-width="1" opacity="0.5"/>

      <!-- ===== 畫面右側手臂（角色左手，持劍） ===== -->
      <path d="M22,146 Q38,138 46,132" fill="none" stroke="url(#mobZMGuardArmor)" stroke-width="11" stroke-linecap="round"/>

      <!-- ===== 劍（50.6px長） ===== -->
      <line x1="48" y1="128" x2="54" y2="78" stroke="#999" stroke-width="4" stroke-linecap="round"/>
      <!-- 劍尖 -->
      <line x1="54" y1="78" x2="55" y2="72" stroke="#bbb" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 劍身亮線 -->
      <line x1="49" y1="126" x2="55" y2="76" stroke="#ccc" stroke-width="0.8" opacity="0.3"/>
      <!-- 劍護手 -->
      <line x1="52" y1="132" x2="44" y2="128" stroke="#8a6830" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 劍柄 -->
      <line x1="46" y1="132" x2="44" y2="138" stroke="#4a3018" stroke-width="4" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="43" cy="140" r="2.5" fill="#8a6830"/>
      <!-- 握劍的手 -->
      <circle cx="46" cy="132" r="5.5" fill="url(#mobZMGuardFace)"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="98" rx="34" ry="36" fill="url(#mobZMGuardHair)"/>

      <!-- 臉（正常臉型） -->
      <path d="M-24,90 C-28,100 -26,114 -20,124 C-14,132 -4,136 4,134 C12,132 18,124 22,114 C26,102 24,90 18,82 C12,76 4,74 -2,76 C-12,78 -22,84 -24,90Z" fill="url(#mobZMGuardFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,80 C-12,62 4,54 16,58 C24,64 28,74 24,84 C20,76 14,70 6,68 C0,66 -8,68 -14,74" fill="url(#mobZMGuardHair)"/>

      <!-- 瀏海 -->
      <path d="M-24,90 C-28,78 -30,82 -30,92 C-28,96 -24,96 -24,92" fill="url(#mobZMGuardHair)"/>
      <path d="M-20,84 C-24,72 -26,76 -26,86 C-24,90 -20,90 -20,86" fill="#2a1a10"/>

      <!-- 側髮 -->
      <path d="M18,86 C24,80 26,88 24,96 C22,100 18,98 18,94" fill="url(#mobZMGuardHair)"/>

      <!-- 耳朵 -->
      <path d="M16,102 C20,98 22,104 20,110 C18,114 16,112 16,108" fill="url(#mobZMGuardFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（正圓，嚴肅） ===== -->
      <ellipse cx="-10" cy="108" rx="6" ry="6" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="3.8" ry="4.2" fill="#302020"/>
      <ellipse cx="-11.5" cy="108" rx="2.2" ry="2.5" fill="#180808"/>
      <circle cx="-13" cy="106.5" r="1" fill="#fff" opacity="0.55"/>

      <ellipse cx="6" cy="108" rx="6" ry="6" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.8" ry="4.2" fill="#302020"/>
      <ellipse cx="4.5" cy="108" rx="2.2" ry="2.5" fill="#180808"/>
      <circle cx="3" cy="106.5" r="1" fill="#fff" opacity="0.55"/>

      <!-- 眉毛 -->
      <path d="M-14,101 C-10,99 -8,101 -6,103" fill="none" stroke="#2a1a10" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,103 C10,101 12,99 16,101" fill="none" stroke="#2a1a10" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（嚴肅一字） -->
      <path d="M-10,128 C-6,129 0,129 4,128" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
