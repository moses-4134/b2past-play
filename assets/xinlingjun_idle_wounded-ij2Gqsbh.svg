<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 信陵君 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體微傾、劍下垂、眼睛半瞇、咬牙、汗滴） -->
  <defs>
    <radialGradient id="xinlingWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e0d0"/>
      <stop offset="100%" stop-color="#e0c8b0"/>
    </radialGradient>
    <linearGradient id="xinlingWRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a1860"/>
      <stop offset="100%" stop-color="#2a1048"/>
    </linearGradient>
    <linearGradient id="xinlingWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1450"/>
      <stop offset="100%" stop-color="#1a0c30"/>
    </linearGradient>
    <linearGradient id="xinlingWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1020"/>
      <stop offset="100%" stop-color="#0c0610"/>
    </linearGradient>
    <linearGradient id="xinlingWBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dde0e8"/>
      <stop offset="100%" stop-color="#8890a0"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="225" rx="30" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（重心偏移，前腿微彎） ===== -->
    <!-- 後腿 -->
    <ellipse cx="10" cy="204" rx="9" ry="16" fill="url(#xinlingWPants)" transform="rotate(-3,10,204)"/>
    <ellipse cx="8" cy="218" rx="10" ry="7" fill="#1a0c30"/>
    <!-- 前腿（微彎支撐） -->
    <ellipse cx="-12" cy="202" rx="10" ry="17" fill="url(#xinlingWPants)" transform="rotate(8,-12,202)"/>
    <ellipse cx="-15" cy="218" rx="11" ry="7" fill="#1a0c30"/>

    <!-- ===== 身體（前傾彎腰） ===== -->
    <ellipse cx="-2" cy="164" rx="26" ry="31" fill="url(#xinlingWRobe)" transform="rotate(-8,-2,164)"/>

    <!-- 金邊裝飾 -->
    <path d="M-26,147 Q-26,167 -22,187" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.6"/>
    <path d="M20,147 Q22,167 20,187" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.6"/>

    <!-- 領口（V領，金邊） -->
    <path d="M-12,142 L-4,158 L4,142" fill="none" stroke="#c8a840" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶（金色玉扣） -->
    <path d="M-26,183 Q-2,191 22,183" fill="none" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
    <rect x="-7" y="181" width="8" height="8" rx="2" fill="#4a8a50" stroke="#c8a840" stroke-width="1"/>

    <!-- ===== 右側手臂（正x，按住腹部傷口） ===== -->
    <path d="M20,150 Q30,162 18,178" fill="none" stroke="url(#xinlingWRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <path d="M16,174 Q18,176 18,180" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.5"/>
    <circle cx="18" cy="180" r="5" fill="url(#xinlingWFace)" opacity="0.85"/>

    <!-- ===== 頭部 ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="98" rx="38" ry="40" fill="url(#xinlingWHair)"/>

    <!-- 臉（微低頭） -->
    <path d="M-28,90 C-32,102 -30,118 -24,128 C-18,136 -8,140 2,138 C12,136 20,128 24,118 C28,106 26,94 20,86 C14,80 4,76 -6,78 C-16,80 -26,84 -28,90Z" fill="url(#xinlingWFace)"/>

    <!-- 腮紅（傷痛泛紅） -->
    <ellipse cx="-20" cy="124" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

    <!-- 頭髮頂部 -->
    <path d="M-18,80 C-14,62 0,54 14,58 C24,62 30,74 26,84 C22,78 14,72 6,70 C-2,68 -10,70 -14,76" fill="url(#xinlingWHair)"/>

    <!-- 瀏海（略散亂） -->
    <path d="M-26,90 C-30,80 -32,82 -32,90 C-30,94 -26,94 -26,92" fill="url(#xinlingWHair)"/>
    <path d="M-22,84 C-24,74 -28,76 -28,86 C-26,90 -22,90 -22,88" fill="#1a1020"/>

    <!-- 髮髻（略歪） -->
    <ellipse cx="2" cy="58" rx="9" ry="7" fill="url(#xinlingWHair)" transform="rotate(-5,2,58)"/>
    <path d="M-4,56 C-2,48 6,48 8,56" fill="url(#xinlingWHair)"/>
    <!-- 玉簪飾品 -->
    <circle cx="2" cy="52" r="3" fill="#4a8a50" stroke="#3a7a40" stroke-width="0.5"/>
    <circle cx="2" cy="52" r="1.2" fill="#6aba60" opacity="0.6"/>

    <!-- 飄逸髮絲 -->
    <path d="M18,82 C22,78 24,84 22,92 C20,98 18,96 18,90" fill="url(#xinlingWHair)"/>
    <path d="M20,92 C24,90 26,98 24,106 C22,112 18,108 18,102" fill="url(#xinlingWHair)" opacity="0.8"/>

    <!-- 耳朵 -->
    <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,110" fill="url(#xinlingWFace)" stroke="#d8c0a0" stroke-width="0.5"/>

    <!-- ===== 眼睛（左眼半瞇忍痛、右眼微睜） ===== -->
    <!-- 左眼（半瞇） -->
    <ellipse cx="-12" cy="110" rx="6.5" ry="4" fill="#fff"/>
    <ellipse cx="-13" cy="111" rx="4" ry="3" fill="#1a1830"/>
    <ellipse cx="-13.5" cy="110" rx="2.2" ry="1.8" fill="#0a0818"/>
    <circle cx="-15" cy="109" r="1" fill="#fff" opacity="0.7"/>

    <!-- 右眼（微睜） -->
    <ellipse cx="4" cy="110" rx="6.5" ry="5.5" fill="#fff"/>
    <ellipse cx="3" cy="111" rx="4" ry="4" fill="#1a1830"/>
    <ellipse cx="2.5" cy="110" rx="2.2" ry="2.3" fill="#0a0818"/>
    <circle cx="1" cy="108" r="1.3" fill="#fff" opacity="0.7"/>

    <!-- 眉間皺紋 -->
    <path d="M-5,102 C-4,100 -2,100 -1,102" fill="none" stroke="#c0a080" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- 鼻子 -->
    <path d="M-16,118 C-17,122 -15,126" fill="none" stroke="#d8c0a0" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（咬牙忍痛） -->
    <path d="M-11,132 C-7,133 -2,133 2,132" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>
    <path d="M-11,132 C-12,134 -13,135" fill="none" stroke="#906050" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- ===== 左側手臂（負x，持劍下垂無力） ===== -->
    <path d="M-24,150 Q-40,158 -50,172" fill="none" stroke="url(#xinlingWRobe)" stroke-width="11" stroke-linecap="round"/>
    <path d="M-44,168 Q-50,170 -50,174" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.5"/>

    <!-- ===== 劍（下垂，指向地面） ===== -->
    <circle cx="-50" cy="174" r="5.5" fill="url(#xinlingWFace)"/>
    <!-- 劍身 -->
    <line x1="-49" y1="176" x2="-44" y2="226" stroke="url(#xinlingWBlade)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-49" y1="176" x2="-44" y2="226" stroke="#eef0f8" stroke-width="1.2" opacity="0.4"/>
    <!-- 劍尖 -->
    <line x1="-44" y1="226" x2="-43.5" y2="232" stroke="#ccd0d8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 護手 -->
    <line x1="-56" y1="172" x2="-46" y2="170" stroke="#c8a840" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-49" y1="170" x2="-48" y2="164" stroke="#3a2028" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-48" cy="162" r="2.5" fill="#c8a840"/>

    <!-- 汗滴 -->
    <path d="M-22,86 C-23,90 -22,94 -21,96" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-21" cy="97" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
  </g>
</svg>