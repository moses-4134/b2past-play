<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙三 — 攻擊（劍刺出，前傾） -->
  <defs>
    <radialGradient id="zhao3Face" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c498"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </radialGradient>
    <linearGradient id="zhao3Cloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3028"/>
      <stop offset="100%" stop-color="#3a2018"/>
    </linearGradient>
    <linearGradient id="zhao3Pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2018"/>
      <stop offset="100%" stop-color="#2a1410"/>
    </linearGradient>
    <linearGradient id="zhao3Hair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="zhao3Blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccc"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-8" cy="200" rx="24" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前跨步） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="180" rx="8" ry="15" fill="url(#zhao3Pants)" transform="rotate(-8,12,180)"/>
      <ellipse cx="10" cy="194" rx="9" ry="6" fill="#2a1810"/>
      <!-- 前腿 -->
      <ellipse cx="-16" cy="176" rx="9" ry="16" fill="url(#zhao3Pants)" transform="rotate(12,-16,176)"/>
      <ellipse cx="-20" cy="192" rx="10" ry="6" fill="#2a1810"/>

      <!-- ===== 身體（前傾攻擊） ===== -->
      <ellipse cx="-4" cy="146" rx="24" ry="26" fill="url(#zhao3Cloth)" transform="rotate(-10,-4,146)"/>

      <!-- 甲片 -->
      <rect x="-18" y="136" width="6" height="5" rx="1" fill="#4a2820" opacity="0.5"/>
      <rect x="-10" y="136" width="6" height="5" rx="1" fill="#4a2820" opacity="0.45"/>
      <rect x="-2" y="136" width="6" height="5" rx="1" fill="#4a2820" opacity="0.4"/>

      <!-- 領口 -->
      <path d="M-12,128 L-6,138 L2,128" fill="none" stroke="#4a2820" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-22,168 Q-4,174 18,168" fill="none" stroke="#3a2018" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 大頭（前傾） ===== -->
      <ellipse cx="-2" cy="98" rx="34" ry="36" fill="url(#zhao3Hair)" transform="rotate(-5,-2,98)"/>

      <!-- 臉 -->
      <path d="M-24,88 C-28,98 -26,112 -20,124 C-14,132 -4,136 4,134 C10,132 16,126 20,114 C24,102 22,90 16,82 C10,76 2,74 -4,76 C-14,78 -22,82 -24,88Z" fill="url(#zhao3Face)" transform="rotate(-5,-2,104)"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,78 C-12,60 4,52 16,56 C24,60 28,72 24,82 C20,74 14,68 6,66 C0,64 -8,66 -14,72" fill="url(#zhao3Hair)"/>

      <!-- 破舊軍帽 -->
      <path d="M-28,78 C-24,66 -10,60 8,62 C20,64 28,70 26,78" fill="#3a2820" stroke="#2a1810" stroke-width="0.5"/>
      <path d="M-30,78 C-30,76 -28,74 -24,76 L28,76 C30,76 30,80 28,80 L-28,80 C-30,80 -30,78 -30,78Z" fill="#3a2820" stroke="#2a1810" stroke-width="0.5"/>

      <!-- 瀏海 -->
      <path d="M-24,84 C-28,76 -30,80 -30,88 C-28,92 -24,90 -24,86" fill="url(#zhao3Hair)"/>

      <!-- 側髮 -->
      <path d="M18,84 C24,78 26,86 24,94 C22,98 18,96 18,92" fill="url(#zhao3Hair)"/>

      <!-- 耳朵 -->
      <path d="M16,102 C20,98 22,104 20,110 C18,114 16,112 16,108" fill="url(#zhao3Face)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 左手臂（角色左手，後擺） ===== -->
      <path d="M-14,134 Q-28,128 -34,122" fill="none" stroke="url(#zhao3Cloth)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-34" cy="120" r="4.5" fill="url(#zhao3Face)" opacity="0.85"/>

      <!-- ===== 右手臂（角色右手，刺劍出去） ===== -->
      <path d="M18,132 Q0,118 -22,110" fill="none" stroke="url(#zhao3Cloth)" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== 劍（水平刺出，劍尖延伸到負x） ===== -->
      <line x1="-72.6" y1="104" x2="-22" y2="110" stroke="url(#zhao3Blade)" stroke-width="4" stroke-linecap="round"/>
      <!-- 劍護手 -->
      <line x1="-26" y1="114" x2="-18" y2="108" stroke="#806030" stroke-width="3" stroke-linecap="round"/>
      <!-- 握劍的手 -->
      <circle cx="-22" cy="112" r="5" fill="url(#zhao3Face)"/>

      <!-- ===== 眼睛（用力瞪） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-10" cy="106" rx="5.5" ry="6.5" fill="#fff"/>
      <ellipse cx="-11" cy="107" rx="3.5" ry="4.5" fill="#2a1818"/>
      <ellipse cx="-11.5" cy="106" rx="2" ry="2.5" fill="#140808"/>
      <circle cx="-13" cy="105" r="0.9" fill="#fff" opacity="0.5"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="106" rx="5.5" ry="6.5" fill="#fff"/>
      <ellipse cx="5" cy="107" rx="3.5" ry="4.5" fill="#2a1818"/>
      <ellipse cx="4.5" cy="106" rx="2" ry="2.5" fill="#140808"/>
      <circle cx="3" cy="105" r="0.9" fill="#fff" opacity="0.5"/>

      <!-- 眉毛（皺眉攻擊） -->
      <path d="M-14,99 C-10,97 -8,99 -6,101" fill="none" stroke="#2a2018" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,101 C10,99 12,97 16,99" fill="none" stroke="#2a2018" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,114 C-16,118 -12,122" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 八字鬍 -->
      <path d="M-14,126 C-12,128 -8,129 -6,128" fill="none" stroke="#2a2018" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M-2,126 C0,128 4,129 6,128" fill="none" stroke="#2a2018" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（張嘴吼叫） -->
      <ellipse cx="-3" cy="130" rx="7" ry="5" fill="#4a2020"/>
      <path d="M-10,128 C-6,126 0,126 4,128" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>