<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 呂安 — 吉卜力2頭身 側面朝左 待機（溫文持劍） -->
  <defs>
    <radialGradient id="laFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f8ece0"/>
      <stop offset="100%" stop-color="#e8d4bc"/>
    </radialGradient>
    <linearGradient id="laRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#28385a"/>
      <stop offset="100%" stop-color="#182840"/>
    </linearGradient>
    <linearGradient id="laPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222838"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="laHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0404"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 14)">
    <ellipse cx="-4" cy="217" rx="26" ry="5" fill="#000" opacity="0.1"/>

    <!-- 腿 -->
    <ellipse cx="8" cy="196" rx="8" ry="15" fill="url(#laPants)" transform="rotate(-3,8,196)"/>
    <ellipse cx="6" cy="211" rx="9" ry="6" fill="#1a1420"/>
    <ellipse cx="-12" cy="194" rx="9" ry="16" fill="url(#laPants)" transform="rotate(4,-12,194)"/>
    <ellipse cx="-14" cy="211" rx="10" ry="6" fill="#1a1420"/>

    <!-- 身體 -->
    <ellipse cx="-2" cy="163" rx="24" ry="26" fill="url(#laRobe)" transform="rotate(-3,-2,163)"/>

    <!-- 銀色腰帶 -->
    <path d="M-24,178 Q-2,186 20,178" fill="none" stroke="#8090a0" stroke-width="4" stroke-linecap="round"/>
    <rect x="-5" y="177" width="6" height="5" rx="1" fill="#a0b0c0"/>

    <!-- 白色交領 -->
    <path d="M-10,141 L-4,153 L4,141" fill="none" stroke="#e8e4e0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 右手（畫面右側，自然垂放） -->
    <path d="M18,148 Q28,154 26,166" fill="none" stroke="url(#laRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="26" cy="168" r="4.5" fill="url(#laFace)" opacity="0.85"/>

    <!-- 左手（畫面左側，持劍） -->
    <path d="M-22,149 Q-34,146 -38,148" fill="none" stroke="url(#laRobe)" stroke-width="10" stroke-linecap="round"/>

    <!-- 大頭 -->
    <ellipse cx="0" cy="92" rx="36" ry="38" fill="url(#laHair)"/>

    <!-- 臉（清秀瘦長） -->
    <path d="M-24,86 C-28,96 -26,112 -20,122 C-14,130 -4,134 6,132 C14,130 20,124 24,114 C28,102 26,90 20,82 C14,76 6,74 -2,76 C-12,78 -22,80 -24,86Z" fill="url(#laFace)"/>

    <!-- 髮頂（官帽式束髮） -->
    <path d="M-16,78 C-12,58 4,50 16,54 C26,58 30,70 26,80 C22,74 14,68 4,66 C-4,64 -10,68 -14,74" fill="url(#laHair)"/>
    <!-- 髮髻（高束） -->
    <ellipse cx="2" cy="58" rx="10" ry="12" fill="url(#laHair)"/>
    <!-- 簪子 -->
    <line x1="-8" y1="56" x2="14" y2="52" stroke="#a0b0c0" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="15" cy="51" r="2" fill="#a0b0c0"/>

    <!-- 瀏海（整齊中分） -->
    <path d="M-8,78 C-10,70 -16,72 -18,78 C-18,84 -12,84 -10,80" fill="url(#laHair)"/>
    <path d="M4,78 C6,70 12,72 14,78 C14,84 8,84 6,80" fill="url(#laHair)"/>

    <!-- 鬢角（整齊垂到耳邊） -->
    <path d="M22,84 C26,78 28,86 26,96 C24,102 22,100 22,94" fill="url(#laHair)"/>
    <path d="M-26,86 C-28,96 -28,106 -26,114" fill="none" stroke="url(#laHair)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <!-- 耳朵 -->
    <path d="M22,100 C26,96 28,102 26,108 C24,112 22,110 22,106" fill="url(#laFace)" stroke="#e0d0bc" stroke-width="0.5"/>

    <!-- 眼睛（細長深邃） -->
    <ellipse cx="-8" cy="106" rx="7.5" ry="6.5" fill="#fff"/>
    <ellipse cx="-9" cy="107" rx="4.5" ry="5" fill="#1a1020"/>
    <ellipse cx="-9.5" cy="106" rx="2.2" ry="2.8" fill="#080410"/>
    <circle cx="-11" cy="104" r="1.8" fill="#fff" opacity="0.6"/>
    <circle cx="-7" cy="108.5" r="0.8" fill="#fff" opacity="0.4"/>

    <ellipse cx="8" cy="106" rx="7.5" ry="6.5" fill="#fff"/>
    <ellipse cx="7" cy="107" rx="4.5" ry="5" fill="#1a1020"/>
    <ellipse cx="6.5" cy="106" rx="2.2" ry="2.8" fill="#080410"/>
    <circle cx="5" cy="104" r="1.8" fill="#fff" opacity="0.6"/>
    <circle cx="9" cy="108.5" r="0.8" fill="#fff" opacity="0.4"/>

    <!-- 細眉 -->
    <path d="M-16,98 C-12,95 -6,96 -2,98" fill="none" stroke="#1a0c08" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M2,98 C6,95 12,96 16,98" fill="none" stroke="#1a0c08" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M-12,114 C-12.5,117 -11,118" fill="none" stroke="#e0d0bc" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴（溫和微笑） -->
    <path d="M-5,124 C-2,126 2,126 5,124" fill="none" stroke="#906858" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 劍（垂直持在身側，最上層） -->
    <line x1="-40" y1="98" x2="-40" y2="210" stroke="#aab0b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-40" y1="98" x2="-40" y2="210" stroke="#dde0e4" stroke-width="1" opacity="0.4"/>
    <!-- 護手 -->
    <line x1="-46" y1="146" x2="-34" y2="146" stroke="#8090a0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-40" y1="146" x2="-40" y2="164" stroke="#4a3828" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-40" cy="166" r="2" fill="#a0b0c0"/>
    <!-- 握劍的手 -->
    <circle cx="-38" cy="150" r="5" fill="url(#laFace)"/>
  </g>
</svg>
