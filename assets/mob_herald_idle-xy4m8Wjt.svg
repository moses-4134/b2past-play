<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 號令兵/戰鼓手 — 吉卜力2頭身 面朝右（敵方）待機：戰鼓＋鼓槌＋令旗 -->
  <defs>
    <radialGradient id="herFace" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#d8c4a4"/>
      <stop offset="100%" stop-color="#c0a880"/>
    </radialGradient>
    <linearGradient id="herTunic" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#a83a28"/>
      <stop offset="100%" stop-color="#601a12"/>
    </linearGradient>
    <linearGradient id="herArmor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a6238"/>
      <stop offset="100%" stop-color="#4a3820"/>
    </linearGradient>
    <linearGradient id="herPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2c22"/>
      <stop offset="100%" stop-color="#221812"/>
    </linearGradient>
    <radialGradient id="herDrum" cx="42%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#e8d0a0"/>
      <stop offset="100%" stop-color="#c0a068"/>
    </radialGradient>
    <linearGradient id="herDrumBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a85838"/>
      <stop offset="100%" stop-color="#6a3220"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <ellipse cx="-2" cy="192" rx="26" ry="5" fill="#000" opacity="0.12"/>

      <!-- ===== 腿 ===== -->
      <ellipse cx="9" cy="172" rx="9" ry="15" fill="url(#herPants)" transform="rotate(-4,9,172)"/>
      <ellipse cx="7" cy="187" rx="10" ry="6" fill="#1c140e"/>
      <ellipse cx="-11" cy="172" rx="9" ry="15" fill="url(#herPants)" transform="rotate(4,-11,172)"/>
      <ellipse cx="-13" cy="187" rx="10" ry="6" fill="#1c140e"/>
      <!-- 護膝 -->
      <ellipse cx="9" cy="164" rx="6" ry="4" fill="url(#herArmor)"/>
      <ellipse cx="-11" cy="164" rx="6" ry="4" fill="url(#herArmor)"/>

      <!-- ===== 身體（軍袍＋護甲） ===== -->
      <ellipse cx="-2" cy="140" rx="22" ry="23" fill="url(#herTunic)"/>
      <!-- 護心甲片 -->
      <path d="M-16,128 L14,128 L16,150 L-2,158 L-18,150 Z" fill="url(#herArmor)"/>
      <path d="M-2,130 L-2,156" stroke="#3a2c18" stroke-width="1" opacity="0.5"/>
      <circle cx="-2" cy="138" r="2.4" fill="#c9a24a"/>
      <!-- 腰帶 -->
      <path d="M-18,158 Q-2,164 18,158" fill="none" stroke="#3a2418" stroke-width="4" stroke-linecap="round"/>
      <rect x="-4" y="156" width="6" height="6" rx="1" fill="#c9a24a"/>

      <!-- ===== 戰鼓（掛腰前，斜挎） ===== -->
      <g transform="translate(-18,150) rotate(-8)">
        <ellipse cx="0" cy="0" rx="15" ry="16" fill="url(#herDrumBody)"/>
        <ellipse cx="-3" cy="-1" rx="11" ry="13" fill="url(#herDrum)"/>
        <!-- 鼓面十字綁繩 -->
        <path d="M-3,-13 L-3,11 M-13,-1 L9,-1" stroke="#8a5030" stroke-width="1" opacity="0.5"/>
        <circle cx="-3" cy="-1" r="2.4" fill="#a85838"/>
        <!-- 鼓釘 -->
        <circle cx="-3" cy="-11" r="1" fill="#c9a24a"/><circle cx="-3" cy="9" r="1" fill="#c9a24a"/>
        <circle cx="-12" cy="-1" r="1" fill="#c9a24a"/><circle cx="7" cy="-1" r="1" fill="#c9a24a"/>
      </g>
      <!-- 挎帶 -->
      <path d="M8,124 L-30,150" stroke="#6a3220" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

      <!-- ===== 左手臂（持鼓槌） ===== -->
      <path d="M-14,126 Q-26,134 -28,144" fill="none" stroke="url(#herTunic)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-29" cy="146" r="4.5" fill="url(#herFace)"/>
      <!-- 鼓槌 -->
      <line x1="-31" y1="146" x2="-40" y2="160" stroke="#7a5030" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-41" cy="162" r="3.5" fill="#8a5838"/>

      <!-- ===== 右手臂（持令旗桿） ===== -->
      <path d="M16,124 Q28,120 34,124" fill="none" stroke="url(#herTunic)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="36" cy="126" r="4.5" fill="url(#herFace)"/>
      <!-- 令旗桿 -->
      <line x1="38" y1="150" x2="40" y2="70" stroke="#6a4c30" stroke-width="3" stroke-linecap="round"/>
      <!-- 旗（三角令旗，飄向後） -->
      <path d="M40,72 L64,80 L40,90 Z" fill="url(#herTunic)" stroke="#601a12" stroke-width="1"/>
      <text x="46" y="85" font-size="9" fill="#e8d0a0" font-family="serif">令</text>
      <!-- 桿頂纓 -->
      <circle cx="40" cy="68" r="2.5" fill="#c9a24a"/>

      <!-- ===== 大頭＋頭盔 ===== -->
      <ellipse cx="0" cy="100" rx="30" ry="32" fill="url(#herFace)"/>
      <!-- 頭盔 -->
      <path d="M-24,96 C-26,70 -12,54 2,56 C18,58 28,74 26,96 C20,88 10,84 0,84 C-12,84 -20,88 -24,96 Z" fill="url(#herArmor)"/>
      <!-- 盔頂紅纓 -->
      <path d="M2,56 C0,44 4,38 8,42 C12,46 10,52 6,58" fill="url(#herTunic)"/>
      <circle cx="4" cy="44" r="3" fill="#c9302a"/>
      <!-- 盔緣 -->
      <path d="M-24,96 C-12,90 12,90 26,96" fill="none" stroke="#3a2c18" stroke-width="2" stroke-linecap="round"/>

      <!-- 臉（盔下） -->
      <path d="M-16,98 C-18,106 -14,118 -8,124 C-2,128 6,128 10,124 C14,120 16,110 14,100 C10,96 -12,96 -16,98 Z" fill="url(#herFace)"/>

      <!-- 眼（堅毅） -->
      <ellipse cx="-6" cy="108" rx="5" ry="4.5" fill="#fff"/>
      <ellipse cx="-6" cy="109" rx="2.8" ry="2.8" fill="#2a2018"/>
      <circle cx="-7" cy="108" r="0.9" fill="#fff" opacity="0.5"/>
      <ellipse cx="8" cy="108" rx="5" ry="4.5" fill="#fff"/>
      <ellipse cx="8" cy="109" rx="2.8" ry="2.8" fill="#2a2018"/>
      <circle cx="7" cy="108" r="0.9" fill="#fff" opacity="0.5"/>
      <path d="M-11,103 C-9,102 -4,103 -2,105" fill="none" stroke="#2a1c12" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M3,105 C5,103 10,102 12,103" fill="none" stroke="#2a1c12" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 鼻 -->
      <path d="M0,112 C-2,116 2,117" fill="none" stroke="#a89070" stroke-width="1" stroke-linecap="round"/>
      <!-- 嘴（抿） -->
      <path d="M-4,120 Q1,122 6,120" fill="none" stroke="#8a6850" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
