<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 孫武 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體微傾、飛刀下垂、單眼半瞇、咬牙、汗滴） -->
  <defs>
    <radialGradient id="swWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8d8c0"/>
      <stop offset="100%" stop-color="#d0c0a0"/>
    </radialGradient>
    <linearGradient id="swWOutfit" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2e2830"/>
      <stop offset="100%" stop-color="#1a1420"/>
    </linearGradient>
    <linearGradient id="swWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#28222a"/>
      <stop offset="100%" stop-color="#141018"/>
    </linearGradient>
    <linearGradient id="swWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1018"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 14)">
    <ellipse cx="-4" cy="207" rx="26" ry="5" fill="#000" opacity="0.1"/>

    <!-- 腿（重心偏移） -->
    <ellipse cx="8" cy="188" rx="7.5" ry="14" fill="url(#swWPants)" transform="rotate(-5,8,188)"/>
    <ellipse cx="6" cy="202" rx="8.5" ry="5.5" fill="#1a1018"/>
    <ellipse cx="-12" cy="186" rx="8" ry="15" fill="url(#swWPants)" transform="rotate(10,-12,186)"/>
    <ellipse cx="-14" cy="202" rx="9" ry="5.5" fill="#1a1018"/>

    <!-- 身體（前傾） -->
    <ellipse cx="-2" cy="158" rx="23" ry="25" fill="url(#swWOutfit)" transform="rotate(-8,-2,158)"/>

    <!-- 暗色腰繩 -->
    <path d="M-22,172 Q-2,179 18,172" fill="none" stroke="#3a2830" stroke-width="3" stroke-linecap="round"/>

    <!-- 領口 -->
    <path d="M-10,136 L-4,148 L4,136" fill="none" stroke="#2e2830" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 右手（畫面右側，按住傷處） -->
    <path d="M16,142 Q24,154 16,168" fill="none" stroke="url(#swWOutfit)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <circle cx="16" cy="170" r="4" fill="url(#swWFace)" opacity="0.85"/>

    <!-- 左手（畫面左側，持飛刀下垂） -->
    <path d="M-21,144 Q-34,146 -42,156" fill="none" stroke="url(#swWOutfit)" stroke-width="9" stroke-linecap="round"/>

    <!-- 大頭 -->
    <ellipse cx="0" cy="94" rx="35" ry="37" fill="url(#swWHair)"/>

    <!-- 臉（低頭忍痛） -->
    <path d="M-22,90 C-26,98 -24,112 -18,122 C-12,130 -4,134 4,132 C10,130 14,124 18,114 C22,102 20,92 14,84 C8,78 2,76 -4,78 C-12,80 -20,84 -22,90Z" fill="url(#swWFace)"/>

    <!-- 腮紅（傷痛泛紅） -->
    <ellipse cx="-16" cy="118" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

    <!-- 頭髮頂部 -->
    <path d="M-16,78 C-12,62 4,54 16,58 C24,62 28,72 24,80 C20,74 12,68 4,66 C-4,64 -10,68 -14,74" fill="url(#swWHair)"/>
    <path d="M-24,86 C-28,76 -30,80 -32,88 C-30,92 -26,92 -24,88" fill="url(#swWHair)"/>

    <!-- 側髮 -->
    <path d="M20,84 C24,78 26,86 24,96 C22,100 20,98 20,92" fill="url(#swWHair)"/>

    <!-- 頭巾（深紫色） -->
    <path d="M-20,74 C-16,62 0,56 14,60 C22,64 26,72 24,78" fill="none" stroke="#3a2840" stroke-width="4" stroke-linecap="round"/>
    <path d="M24,78 C28,84 30,96 28,110" fill="none" stroke="#3a2840" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- 耳朵 -->
    <path d="M20,100 C24,96 26,102 24,108 C22,112 20,110 20,106" fill="url(#swWFace)" stroke="#d0c0a0" stroke-width="0.5"/>

    <!-- 眼睛（左眼半瞇、右眼微睜） -->
    <!-- 左眼（半瞇） -->
    <ellipse cx="-8" cy="106" rx="7" ry="3.5" fill="#fff"/>
    <ellipse cx="-10" cy="107" rx="3.5" ry="2.5" fill="#1a1818"/>
    <ellipse cx="-10.5" cy="106.5" rx="1.8" ry="1.5" fill="#0a0404"/>
    <circle cx="-12" cy="105.5" r="1" fill="#fff" opacity="0.6"/>

    <!-- 右眼（微瞇） -->
    <ellipse cx="8" cy="106" rx="7" ry="5.5" fill="#fff"/>
    <ellipse cx="6" cy="107" rx="3.5" ry="4" fill="#1a1818"/>
    <ellipse cx="5.5" cy="106" rx="1.8" ry="2.2" fill="#0a0404"/>
    <circle cx="4" cy="104.5" r="1" fill="#fff" opacity="0.6"/>

    <!-- 細眉（皺起） -->
    <path d="M-15,98 C-12,94 -6,95 -2,97" fill="none" stroke="#1a1018" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M2,97 C6,94 12,95 15,98" fill="none" stroke="#1a1018" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 眉間皺紋 -->
    <path d="M-3,99 C-2,97 0,97 1,99" fill="none" stroke="#c0a080" stroke-width="0.8" opacity="0.5"/>

    <!-- 鼻子 -->
    <path d="M-10,114 C-12,118 -10,120 -8,119" fill="none" stroke="#d0c0a0" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴（咬牙忍痛） -->
    <path d="M-6,124 C-3,125 1,125 4,124" fill="none" stroke="#805848" stroke-width="2" stroke-linecap="round"/>
    <path d="M-6,124 C-7,126 -8,127" fill="none" stroke="#805848" stroke-width="1" opacity="0.6"/>

    <!-- 細鬍 -->
    <path d="M-4,128 C-8,130 -12,129" fill="none" stroke="#1a1018" stroke-width="0.8" opacity="0.4"/>
    <path d="M0,128 C4,130 8,129" fill="none" stroke="#1a1018" stroke-width="0.8" opacity="0.4"/>

    <!-- 汗滴 -->
    <path d="M-20,88 C-21,92 -20,96 -19,98" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-19" cy="99" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>

    <!-- 飛刀（下垂，最上層） -->
    <line x1="-44" y1="142" x2="-46" y2="156" stroke="#4a3828" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-47" y1="156" x2="-44" y2="157" stroke="#706058" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-46" y1="158" x2="-48" y2="176" stroke="#bbb" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-46" y1="158" x2="-48" y2="176" stroke="#eee" stroke-width="0.8" opacity="0.4"/>
    <circle cx="-42" cy="158" r="4.5" fill="url(#swWFace)"/>
  </g>
</svg>