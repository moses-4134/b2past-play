<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 衛承昭 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體微傾、單手按腹、眼睛半瞇、劍下垂） -->
  <defs>
    <radialGradient id="face" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fce8d0"/>
      <stop offset="100%" stop-color="#e8c4a0"/>
    </radialGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#506a6a"/>
      <stop offset="100%" stop-color="#304848"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="100%" stop-color="#222220"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#302010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="223" rx="28" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（站穩但重心偏移，前腿微彎） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="10" cy="200" rx="9" ry="16" fill="url(#pants)" transform="rotate(-3,10,200)"/>
    <ellipse cx="8" cy="216" rx="10" ry="7" fill="#3a2818"/>
    <!-- 前腿（左腿，微彎支撐） -->
    <ellipse cx="-14" cy="199" rx="10" ry="16" fill="url(#pants)" transform="rotate(8,-14,199)"/>
    <ellipse cx="-17" cy="216" rx="11" ry="7" fill="#3a2818"/>

    <!-- ===== 身體（前傾彎腰，重心偏低） ===== -->
    <ellipse cx="-2" cy="168" rx="26" ry="27" fill="url(#jacket)" transform="rotate(-8,-2,168)"/>

    <!-- 領口 -->
    <path d="M-14,145 L-8,158 L0,145" fill="none" stroke="#8a8068" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-26,185 Q-2,193 22,185" fill="none" stroke="#6a5838" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-4" cy="189" r="3" fill="#c8a848"/>

    <!-- ===== 畫面右側手臂（角色左手）按住腹部傷口 ===== -->
    <path d="M18,150 Q22,162 10,176" fill="none" stroke="url(#jacket)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <circle cx="10" cy="178" r="5" fill="url(#face)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，持劍）下垂無力 ===== -->
    <path d="M-24,153 Q-40,160 -48,175" fill="none" stroke="url(#jacket)" stroke-width="11" stroke-linecap="round"/>
    <!-- 握劍的手 -->
    <circle cx="-48" cy="177" r="5.5" fill="url(#face)"/>

    <!-- ===== 劍（下垂，指向地面方向） ===== -->
    <!-- 劍身 -->
    <line x1="-47" y1="179" x2="-42" y2="229" stroke="url(#steel)" stroke-width="4" stroke-linecap="round"/>
    <!-- 劍身亮線 -->
    <line x1="-47" y1="179" x2="-42" y2="229" stroke="#eee" stroke-width="1.5" opacity="0.4"/>
    <!-- 劍尖 -->
    <line x1="-42" y1="229" x2="-41.5" y2="235" stroke="#ccc" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 護手 -->
    <line x1="-54" y1="176" x2="-44" y2="174" stroke="#c0a050" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-48" y1="174" x2="-50" y2="168" stroke="#5a4530" stroke-width="4" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-50" cy="166" r="2.5" fill="#c0a050"/>

    <!-- ===== 大頭（低頭、微喘） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="98" rx="40" ry="42" fill="url(#hairG)"/>

    <!-- 臉（微低頭） -->
    <path d="M-30,92 C-34,104 -32,122 -26,132 C-20,140 -8,144 2,142 C12,140 20,132 24,122 C28,110 26,96 20,88 C14,82 4,78 -6,80 C-18,82 -28,84 -30,92Z" fill="url(#face)"/>

    <!-- 腮紅（傷痛泛紅） -->
    <ellipse cx="-22" cy="126" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

    <!-- 頭髮頂部 -->
    <path d="M-20,82 C-16,62 0,54 14,58 C26,62 32,74 28,86 C24,80 16,74 8,72 C0,70 -10,72 -16,78" fill="url(#hairG)"/>

    <!-- 瀏海 -->
    <path d="M-30,92 C-36,80 -38,84 -40,92 C-38,98 -32,100 -30,96" fill="url(#hairG)"/>
    <path d="M-26,86 C-30,74 -34,78 -34,88 C-32,94 -26,94 -26,90" fill="#302010"/>
    <path d="M-22,82 C-24,72 -28,74 -28,84 C-26,90 -22,90 -22,86" fill="url(#hairG)" opacity="0.9"/>

    <!-- 呆毛（略下垂） -->
    <path d="M-4,58 C-2,51 4,50 6,55" fill="none" stroke="url(#hairG)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 側髮 -->
    <path d="M22,88 C28,82 30,90 28,98 C26,104 22,102 22,96" fill="url(#hairG)"/>
    <path d="M24,96 C28,94 30,102 28,110 C26,116 22,112 22,106" fill="url(#hairG)" opacity="0.8"/>

    <!-- 馬尾 -->
    <path d="M24,82 C30,76 32,70 28,64" fill="none" stroke="url(#hairG)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="26" cy="82" rx="3" ry="2.5" fill="#6a5838"/>
    <path d="M26,84 C28,92 30,104 28,114" fill="none" stroke="url(#hairG)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <!-- 耳朵 -->
    <path d="M20,104 C24,100 26,106 24,112 C22,116 20,114 20,110" fill="url(#face)" stroke="#e0c0a0" stroke-width="0.5"/>

    <!-- ===== 眼睛（左眼半瞇忍痛、右眼微睜） ===== -->
    <!-- 左眼（半瞇） -->
    <ellipse cx="-12" cy="110" rx="7" ry="4" fill="#fff"/>
    <ellipse cx="-13" cy="111" rx="4.5" ry="3.2" fill="#3a2818"/>
    <ellipse cx="-13.5" cy="110" rx="2.5" ry="2" fill="#1a0c04"/>
    <circle cx="-15" cy="109" r="1.2" fill="#fff" opacity="0.9"/>

    <!-- 右眼（微瞇但還睜著） -->
    <ellipse cx="4" cy="110" rx="7" ry="5.5" fill="#fff"/>
    <ellipse cx="3" cy="111" rx="4.5" ry="4" fill="#3a2818"/>
    <ellipse cx="2.5" cy="110" rx="2.5" ry="2.3" fill="#1a0c04"/>
    <circle cx="1" cy="108" r="1.5" fill="#fff" opacity="0.9"/>

    <!-- 眉間皺紋（忍痛） -->
    <path d="M-5,102 C-4,100 -2,100 -1,102" fill="none" stroke="#c0a080" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- 鼻子 -->
    <path d="M-18,118 C-19,122 -17,126" fill="none" stroke="#d8b090" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（咬牙忍痛，一字緊閉微下彎） -->
    <path d="M-14,132 C-10,133 -4,133 0,132" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>
    <path d="M-14,132 C-15,134 -16,135" fill="none" stroke="#906050" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 汗滴（額頭） -->
    <path d="M-24,94 C-25,98 -24,102 -23,104" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-23" cy="105" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
  </g>
</svg>
