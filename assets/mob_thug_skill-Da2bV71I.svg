<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 市集潑皮 — 吉卜力2頭身 面朝右（敵方）技能（棍高舉蓄力） -->
  <defs>
    <radialGradient id="mobThugFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c0a870"/>
    </radialGradient>
    <linearGradient id="mobThugCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#7a6a50"/>
      <stop offset="100%" stop-color="#5a4a38"/>
    </linearGradient>
    <linearGradient id="mobThugPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4a38"/>
      <stop offset="100%" stop-color="#3a2a20"/>
    </linearGradient>
    <linearGradient id="mobThugHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#181008"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="211" rx="28" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（站穩蓄力） ===== -->
      <!-- 後腿 -->
      <ellipse cx="10" cy="189" rx="10" ry="16" fill="url(#mobThugPants)" transform="rotate(-4,10,189)"/>
      <ellipse cx="9" cy="205" rx="11" ry="6" fill="#3a2818"/>
      <!-- 前腿 -->
      <ellipse cx="-12" cy="187" rx="11" ry="17" fill="url(#mobThugPants)" transform="rotate(4,-12,187)"/>
      <ellipse cx="-13" cy="205" rx="12" ry="6" fill="#3a2818"/>

      <!-- ===== 身體（挺直蓄力） ===== -->
      <ellipse cx="-2" cy="154" rx="22" ry="24" fill="url(#mobThugCloth)" transform="rotate(-1,-2,154)"/>

      <!-- 敞胸 -->
      <path d="M-14,134 L-4,150 L8,134" fill="none" stroke="#5a4a38" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M-10,136 L-4,146 L4,136" fill="url(#mobThugFace)" opacity="0.6"/>

      <!-- 破衣裂痕 -->
      <path d="M-10,146 L-7,156" fill="none" stroke="#3a2a20" stroke-width="0.8" opacity="0.4"/>

      <!-- 腰帶 -->
      <path d="M-22,170 Q-2,176 20,170" fill="none" stroke="#4a3820" stroke-width="5" stroke-linecap="round"/>

      <!-- ===== 雙手持棍高舉過頭 ===== -->
      <!-- 右手臂（角色左手） -->
      <path d="M16,140 Q24,112 22,84" fill="none" stroke="url(#mobThugCloth)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="22" cy="82" r="5.5" fill="url(#mobThugFace)" opacity="0.85"/>

      <!-- 左手臂（角色右手） -->
      <path d="M-20,138 Q-32,106 -34,78" fill="none" stroke="url(#mobThugCloth)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-34" cy="76" r="5.5" fill="url(#mobThugFace)"/>

      <!-- ===== 短棍（高舉過頭蓄力） ===== -->
      <line x1="-38" y1="54" x2="-30" y2="104" stroke="#5a4028" stroke-width="3.5" stroke-linecap="round"/>

      <!-- ===== 大頭（挺直蓄力） ===== -->
      <!-- 後腦 -->
      <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#mobThugHair)"/>

      <!-- 臉 -->
      <path d="M-28,88 C-32,98 -30,116 -26,128 C-20,136 -8,140 2,138 C14,136 22,128 26,116 C30,104 28,90 22,82 C16,76 4,72 -4,74 C-16,76 -26,82 -28,88Z" fill="url(#mobThugFace)"/>

      <!-- 短髮 -->
      <path d="M-18,78 C-14,60 4,52 16,56 C24,60 28,72 24,82 C20,74 14,68 6,66 C0,64 -8,66 -14,72" fill="url(#mobThugHair)"/>
      <path d="M-26,86 C-30,76 -34,78 -32,88 C-30,92 -26,92 -26,88" fill="url(#mobThugHair)"/>
      <path d="M-22,82 C-26,70 -30,74 -28,84 C-26,88 -22,88 -22,84" fill="#2a2018"/>
      <path d="M22,82 C26,76 28,82 26,90 C24,94 22,92 22,88" fill="url(#mobThugHair)"/>

      <!-- 耳朵 -->
      <path d="M20,102 C24,98 26,104 24,112 C22,116 20,114 20,108" fill="url(#mobThugFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（蓄力凝視） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-10" cy="108" rx="6" ry="5" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="3.8" ry="3.5" fill="#3a3018"/>
      <ellipse cx="-11.5" cy="108.5" rx="2" ry="2" fill="#1a1008"/>
      <circle cx="-13" cy="107" r="1.1" fill="#fff" opacity="0.6"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="108" rx="6" ry="5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.8" ry="3.5" fill="#3a3018"/>
      <ellipse cx="4.5" cy="108.5" rx="2" ry="2" fill="#1a1008"/>
      <circle cx="3" cy="107" r="1.1" fill="#fff" opacity="0.6"/>

      <!-- 粗眉毛 -->
      <path d="M-16,101 C-12,99 -8,101 -6,103" fill="none" stroke="#2a2018" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M8,103 C10,101 14,99 18,101" fill="none" stroke="#2a2018" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,114 C-16,118 -12,122" fill="none" stroke="#b09068" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙蓄力） -->
      <path d="M-12,130 C-6,130 2,130 6,130" fill="none" stroke="#704840" stroke-width="2" stroke-linecap="round"/>
      <path d="M-12,130 C-14,132 -15,133" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <path d="M6,130 C7,132 8,133" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>
</svg>