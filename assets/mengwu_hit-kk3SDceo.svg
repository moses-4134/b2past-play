<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 蒙武 — 吉卜力2頭身 側面朝左 受擊（壯年武將抗性，微後仰） -->
  <defs>
    <radialGradient id="mengwuFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c4a0"/>
      <stop offset="100%" stop-color="#c8a480"/>
    </radialGradient>
    <linearGradient id="mengwuJacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a3020"/>
      <stop offset="100%" stop-color="#302010"/>
    </linearGradient>
    <linearGradient id="mengwuPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35322a"/>
      <stop offset="100%" stop-color="#1e1c16"/>
    </linearGradient>
    <linearGradient id="mengwuHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#181008"/>
    </linearGradient>
    <linearGradient id="mengwuSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
    <linearGradient id="mengwuArmor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#605040"/>
      <stop offset="100%" stop-color="#403020"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="2" cy="222" rx="30" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（後退半步） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="16" cy="199" rx="10.5" ry="17" fill="url(#mengwuPants)" transform="rotate(3,16,199)"/>
    <ellipse cx="16" cy="215" rx="11.5" ry="7" fill="#3a2818"/>
    <!-- 前腿（左腿） -->
    <ellipse cx="-10" cy="197" rx="10.5" ry="17" fill="url(#mengwuPants)" transform="rotate(-3,-10,197)"/>
    <ellipse cx="-10" cy="215" rx="11.5" ry="7" fill="#3a2818"/>

    <!-- ===== 身體（微後仰） ===== -->
    <ellipse cx="2" cy="160" rx="28" ry="30" fill="url(#mengwuJacket)" transform="rotate(5,2,160)"/>

    <!-- 輕甲護片 -->
    <rect x="-14" y="149" width="24" height="14" rx="3" fill="url(#mengwuArmor)" stroke="#3a2818" stroke-width="0.5" opacity="0.75" transform="rotate(5,0,156)"/>

    <!-- 肩甲護肩 -->
    <rect x="-26" y="136" width="12" height="9" rx="2.5" fill="url(#mengwuArmor)" stroke="#3a2818" stroke-width="0.7"/>
    <rect x="22" y="136" width="12" height="9" rx="2.5" fill="url(#mengwuArmor)" stroke="#3a2818" stroke-width="0.7"/>

    <!-- 領口 -->
    <path d="M-8,138 L-2,151 L6,138" fill="none" stroke="#7a6048" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-24,181 Q2,189 28,181" fill="none" stroke="#5a4030" stroke-width="6" stroke-linecap="round"/>
    <rect x="-4" y="179" width="9" height="9" rx="1.5" fill="#b09030" stroke="#8a7020" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手） ===== -->
    <path d="M24,144 Q41,148 43,162" fill="none" stroke="url(#mengwuJacket)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
    <circle cx="43" cy="164" r="5.5" fill="url(#mengwuFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手） ===== -->
    <path d="M-22,146 Q-38,140 -46,138" fill="none" stroke="url(#mengwuJacket)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-46" cy="140" r="5.5" fill="url(#mengwuFace)"/>

    <!-- ===== 大頭（微後仰） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="4" cy="96" rx="40" ry="42" fill="url(#mengwuHair)"/>

    <!-- 臉 -->
    <path d="M-26,88 C-30,100 -28,116 -22,126 C-16,134 -4,138 6,136 C16,134 26,128 30,118 C34,106 32,92 26,84 C20,78 8,72 -2,74 C-14,76 -24,80 -26,88Z" fill="url(#mengwuFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-16,78 C-12,60 4,52 18,56 C30,60 36,72 32,82 C28,76 20,70 12,68 C4,66 -6,68 -12,74" fill="url(#mengwuHair)"/>

    <!-- 後方短髮 -->
    <path d="M28,86 C32,92 34,104 32,114 C30,118 28,116 28,110" fill="none" stroke="#181008" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- 鐵盔 -->
    <path d="M-22,78 C-14,66 6,60 24,64 C34,68 38,74 34,80" fill="none" stroke="#786840" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M-22,78 C-24,82 -26,86 -24,88" fill="none" stroke="#786840" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M34,80 C36,84 36,88 34,90" fill="none" stroke="#786840" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M2,62 C4,56 8,54 11,57 C12,59 12,62 10,64" fill="#786840" stroke="#605030" stroke-width="0.5"/>

    <!-- 短瀏海 -->
    <path d="M-24,88 C-28,78 -30,82 -30,88 C-28,92 -24,92 -24,90" fill="url(#mengwuHair)"/>

    <!-- 側髮 -->
    <path d="M26,84 C30,80 32,86 30,92 C28,96 26,94 26,88" fill="url(#mengwuHair)"/>

    <!-- 耳朵 -->
    <path d="M24,102 C28,98 30,104 28,110 C26,114 24,112 24,108" fill="url(#mengwuFace)" stroke="#b89870" stroke-width="0.5"/>

    <!-- ===== 眼睛（瞇眼忍痛） ===== -->
    <!-- 左眼 -->
    <ellipse cx="-8" cy="108" rx="6.5" ry="2.5" fill="#fff"/>
    <ellipse cx="-9" cy="108.5" rx="4" ry="2" fill="#302818"/>
    <ellipse cx="-9.5" cy="108" rx="2.5" ry="1.5" fill="#100804"/>

    <!-- 右眼 -->
    <ellipse cx="8" cy="108" rx="6.5" ry="2.5" fill="#fff"/>
    <ellipse cx="7" cy="108.5" rx="4" ry="2" fill="#302818"/>
    <ellipse cx="6.5" cy="108" rx="2.5" ry="1.5" fill="#100804"/>

    <!-- 眉毛（皺眉） -->
    <path d="M-15,103 C-11,100 -5,100 -1,102" fill="none" stroke="#2a1808" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M2,103 C6,100 11,100 14,102" fill="none" stroke="#2a1808" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M-14,115 C-15,119 -13,123 -11,125" fill="none" stroke="#a88868" stroke-width="1.3" stroke-linecap="round"/>

    <!-- 短鬚 -->
    <path d="M-12,128 C-10,130 -6,131 -4,130" fill="none" stroke="#2a1808" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,128 C2,130 6,131 8,130" fill="none" stroke="#2a1808" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-6,134 C-4,137 0,137 2,134" fill="none" stroke="#2a1808" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（咬牙） -->
    <path d="M-10,131 C-6,131 0,131 4,131" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8,131 L-8,133" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
    <path d="M-4,131 L-4,133" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
    <path d="M0,131 L0,133" stroke="#fff" stroke-width="0.8" opacity="0.4"/>

    <!-- ===== 槍（最上層） ===== -->
    <line x1="-58" y1="105" x2="43" y2="164" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
    <path d="M-70.2,98.2 L-56.0,101.5 L-60.0,108.5 Z" fill="url(#mengwuSteel)" stroke="#888" stroke-width="0.5"/>
    <line x1="-55.4" y1="106.5" x2="-52.4" y2="101.3" stroke="#a03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-58" y1="105" x2="-55" y2="99.8" stroke="#a03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-60.6" y1="103.5" x2="-57.6" y2="98.3" stroke="#a03030" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
