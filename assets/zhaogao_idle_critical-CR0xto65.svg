<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙高 — 吉卜力2頭身 面朝右（敵方）瀕死待機（HP <30%：半跪、喘息、雙眼近閉） -->
  <defs>
    <radialGradient id="zgCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e4d8"/>
      <stop offset="100%" stop-color="#d8c8b0"/>
    </radialGradient>
    <linearGradient id="zgCRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a1028"/>
      <stop offset="100%" stop-color="#0c0818"/>
    </linearGradient>
    <linearGradient id="zgCInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1838"/>
      <stop offset="100%" stop-color="#180c28"/>
    </linearGradient>
    <linearGradient id="zgCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="200" rx="30" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪） ===== -->
      <!-- 後腿（膝蓋著地） -->
      <ellipse cx="6" cy="182" rx="8" ry="12" fill="url(#zgCInner)" transform="rotate(-20,6,182)"/>
      <ellipse cx="0" cy="194" rx="7" ry="4.5" fill="url(#zgCInner)"/>
      <ellipse cx="-2" cy="198" rx="8" ry="5" fill="#1a1020"/>
      <!-- 前腿（彎曲撐住） -->
      <ellipse cx="-12" cy="178" rx="7" ry="16" fill="url(#zgCInner)" transform="rotate(12,-12,178)"/>
      <ellipse cx="-16" cy="198" rx="8" ry="5.5" fill="#1a1020"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="150" rx="24" ry="25" fill="url(#zgCRobe)" transform="rotate(-14,-4,150)"/>

      <!-- 暗紫內襯 -->
      <path d="M-12,130 L-7,142 L0,130" fill="none" stroke="#2a1838" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 銀色腰帶 -->
      <path d="M-24,166 Q-4,174 16,168" fill="none" stroke="#808890" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-5" cy="171" r="3" fill="#9098a0"/>

      <!-- 暗袍紫邊 -->
      <path d="M-24,136 Q-25,150 -24,166" fill="none" stroke="#301848" stroke-width="0.8" opacity="0.5"/>
      <path d="M18,136 Q19,150 18,166" fill="none" stroke="#301848" stroke-width="0.8" opacity="0.5"/>

      <!-- ===== 畫面右側手臂（角色左手，撐在膝蓋上） ===== -->
      <path d="M14,138 Q22,152 14,172" fill="none" stroke="url(#zgCRobe)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
      <circle cx="13" cy="174" r="4" fill="url(#zgCFace)" opacity="0.85"/>

      <!-- ===== 畫面左側手臂（角色右手，撐地支撐） ===== -->
      <path d="M-22,136 Q-40,146 -48,160" fill="none" stroke="url(#zgCRobe)" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="-48" cy="162" rx="8" ry="5" fill="#100820" transform="rotate(5,-48,162)"/>
      <circle cx="-50" cy="162" r="4" fill="url(#zgCFace)"/>
      <!-- 手撐地效果 -->
      <ellipse cx="-52" cy="198" rx="4" ry="2" fill="#5a4a30" opacity="0.3"/>

      <!-- ===== 大頭（低垂喘息） ===== -->
      <ellipse cx="-2" cy="90" rx="36" ry="38" fill="url(#zgCHair)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-26,86 C-30,96 -28,114 -22,124 C-16,132 -6,136 2,134 C8,132 14,126 18,116 C22,104 20,92 14,84 C8,78 0,76 -6,78 C-14,80 -24,82 -26,86Z" fill="url(#zgCFace)"/>

      <!-- 腮紅（痛苦更明顯） -->
      <ellipse cx="-20" cy="120" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,78 C-12,58 4,50 16,56 C24,62 26,72 22,82 C18,74 10,66 2,64 C-6,62 -12,66 -16,74" fill="url(#zgCHair)"/>

      <!-- 宦官帽（歪斜） -->
      <ellipse cx="0" cy="56" rx="14" ry="8" fill="#101018" stroke="#303038" stroke-width="0.8" transform="rotate(-8,0,56)"/>
      <ellipse cx="0" cy="52" rx="10" ry="5" fill="#181820" transform="rotate(-8,0,52)"/>
      <line x1="-10" y1="56" x2="10" y2="54" stroke="#909898" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-10" cy="56" r="1.5" fill="#a0a8a8"/>
      <circle cx="10" cy="54" r="1.5" fill="#a0a8a8"/>

      <!-- 散落髮絲 -->
      <path d="M-30,96 C-32,102 -30,106" fill="none" stroke="url(#zgCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 鬢角 -->
      <path d="M18,84 C24,80 26,88 24,96 C22,102 18,98 18,92" fill="url(#zgCHair)"/>
      <path d="M-28,88 C-32,100 -30,114 -28,122" fill="none" stroke="url(#zgCHair)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

      <!-- 耳朵 -->
      <path d="M16,100 C20,96 22,102 20,108 C18,112 16,110 16,106" fill="url(#zgCFace)" stroke="#d0c0a8" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼瞇成線） ===== -->
      <!-- 左眼（幾乎閉上） -->
      <ellipse cx="-11" cy="108" rx="6.5" ry="2" fill="#fff"/>
      <ellipse cx="-12" cy="108.5" rx="4" ry="1.5" fill="#1a1020"/>
      <ellipse cx="-12.5" cy="108" rx="2" ry="1" fill="#080410"/>

      <!-- 右眼（勉強一線） -->
      <ellipse cx="4" cy="108" rx="6.5" ry="2.5" fill="#fff"/>
      <ellipse cx="3" cy="108.5" rx="4" ry="2" fill="#1a1020"/>
      <ellipse cx="2.5" cy="108" rx="2" ry="1.2" fill="#080410"/>
      <circle cx="1" cy="107.5" r="0.8" fill="#fff" opacity="0.6"/>

      <!-- 細長眉（深皺） -->
      <path d="M-18,100 C-14,97 -10,98 -6,101" fill="none" stroke="#181818" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M0,101 C4,98 8,97 12,100" fill="none" stroke="#181818" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 眉間皺紋 -->
      <path d="M-7,103 C-5,101 -2,101 0,103" fill="none" stroke="#c0a080" stroke-width="1" opacity="0.6"/>
      <path d="M-8,105 C-6,103.5 -3,103.5 -1,105" fill="none" stroke="#c0a080" stroke-width="0.7" opacity="0.4"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-15,120 -13,122" fill="none" stroke="#c8b898" stroke-width="1" stroke-linecap="round"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-6" cy="129" rx="5" ry="4.5" fill="#703030"/>
      <path d="M-10,127 L-2,127" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴（多顆） -->
      <path d="M-22,88 C-23,92 -22,98 -21,101" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-21" cy="102" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M20,92 C21,96 20,100" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="20" cy="101" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-8" cy="80" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>