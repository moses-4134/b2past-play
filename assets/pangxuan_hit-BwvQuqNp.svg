<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 龐煖 — 吉卜力2頭身 側面朝左 受擊（後仰） -->
  <defs>
    <radialGradient id="pangxuanFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc098"/>
      <stop offset="100%" stop-color="#c4a478"/>
    </radialGradient>
    <linearGradient id="pangxuanArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="pangxuanPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="pangxuanHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#201018"/>
      <stop offset="100%" stop-color="#181018"/>
    </linearGradient>
    <linearGradient id="pangxuanSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d0d8"/>
      <stop offset="100%" stop-color="#a0a0a8"/>
    </linearGradient>
    <linearGradient id="pangxuanShoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#22222a"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="2" cy="225" rx="32" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（後仰站立） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="18" cy="200" rx="11" ry="18" fill="url(#pangxuanPants)" transform="rotate(5,18,200)"/>
    <ellipse cx="20" cy="218" rx="12" ry="7.5" fill="#2a2028"/>
    <!-- 前腿（左腿，撐住） -->
    <ellipse cx="-14" cy="199" rx="11" ry="18" fill="url(#pangxuanPants)" transform="rotate(-5,-14,199)"/>
    <ellipse cx="-12" cy="218" rx="12" ry="7.5" fill="#2a2028"/>

    <!-- ===== 身體（後仰） ===== -->
    <ellipse cx="2" cy="162" rx="28" ry="32" fill="url(#pangxuanArmor)" transform="rotate(8,2,162)"/>

    <!-- 鎧甲紅色紋飾 -->
    <line x1="-16" y1="142" x2="-14" y2="186" stroke="#8a2020" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="20" y1="142" x2="22" y2="186" stroke="#8a2020" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- 胸甲紋理 -->
    <rect x="-14" y="150" width="26" height="16" rx="3" fill="url(#pangxuanShoulder)" stroke="#3a3a42" stroke-width="0.5" opacity="0.7" transform="rotate(8,0,158)"/>

    <!-- 大肩甲 -->
    <ellipse cx="-30" cy="142" rx="12" ry="8" fill="url(#pangxuanShoulder)" stroke="#3a3a42" stroke-width="0.7"/>
    <line x1="-36" y1="138" x2="-24" y2="138" stroke="#8a2020" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="28" cy="140" rx="12" ry="8" fill="url(#pangxuanShoulder)" stroke="#3a3a42" stroke-width="0.7"/>
    <line x1="22" y1="136" x2="34" y2="136" stroke="#8a2020" stroke-width="1.5" opacity="0.6"/>

    <!-- 領口 -->
    <path d="M-8,140 L-2,153 L6,140" fill="none" stroke="#4a4050" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-24,184 Q2,192 28,184" fill="none" stroke="#5a1818" stroke-width="6" stroke-linecap="round"/>
    <rect x="-4" y="182" width="10" height="10" rx="2" fill="#4a4a52" stroke="#3a3a42" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（正x，後仰甩手） ===== -->
    <path d="M26,148 Q42,158 40,172" fill="none" stroke="url(#pangxuanArmor)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
    <circle cx="40" cy="174" r="6" fill="url(#pangxuanFace)" opacity="0.85"/>

    <!-- ===== 大頭（後仰痛苦） ===== -->
    <!-- 後腦蓬亂髮量 -->
    <ellipse cx="4" cy="96" rx="42" ry="44" fill="url(#pangxuanHair)"/>

    <!-- 臉 -->
    <path d="M-28,88 C-32,100 -30,116 -24,126 C-18,134 -6,138 4,136 C14,134 24,128 28,118 C32,106 30,92 24,84 C18,78 6,74 -4,76 C-16,78 -26,82 -28,88Z" fill="url(#pangxuanFace)"/>

    <!-- 散亂頭髮頂部 -->
    <path d="M-18,78 C-14,60 2,50 18,54 C32,58 38,72 32,82 C28,74 18,68 10,66 C2,64 -8,66 -14,74" fill="url(#pangxuanHair)"/>

    <!-- 蓬亂髮絲（受擊飄散） -->
    <path d="M-20,74 C-26,62 -30,60 -28,70" fill="none" stroke="#181018" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-14,68 C-18,54 -22,52 -20,64" fill="none" stroke="#201018" stroke-width="3" stroke-linecap="round"/>
    <path d="M12,60 C16,48 20,46 18,58" fill="none" stroke="#181018" stroke-width="3" stroke-linecap="round"/>
    <path d="M22,64 C28,52 32,50 28,62" fill="none" stroke="#201018" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M30,72 C36,62 40,60 36,70" fill="none" stroke="#181018" stroke-width="3" stroke-linecap="round"/>

    <!-- 後方散亂長髮 -->
    <path d="M28,86 C34,92 38,108 36,120 C34,126 32,122 32,116" fill="none" stroke="#181018" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

    <!-- 前方散亂瀏海 -->
    <path d="M-26,88 C-32,78 -34,82 -32,90 C-30,94 -26,94 -26,92" fill="url(#pangxuanHair)"/>
    <path d="M-22,82 C-26,72 -30,76 -28,86" fill="#181018"/>

    <!-- 側髮 -->
    <path d="M26,86 C32,80 34,88 32,96 C30,100 26,98 26,92" fill="url(#pangxuanHair)"/>

    <!-- 耳朵 -->
    <path d="M24,104 C28,100 30,106 28,112 C26,116 24,114 24,110" fill="url(#pangxuanFace)" stroke="#b09060" stroke-width="0.5"/>

    <!-- ===== 眼睛（痛苦瞇眼） ===== -->
    <!-- 左眼（瞇起） -->
    <ellipse cx="-10" cy="108" rx="6.5" ry="4" fill="#fff"/>
    <ellipse cx="-11" cy="109" rx="4" ry="3" fill="#5a2818"/>
    <ellipse cx="-11.5" cy="108" rx="2.5" ry="2" fill="#2a0808"/>
    <circle cx="-13" cy="107" r="1" fill="#fff" opacity="0.5"/>

    <!-- 右眼（瞇起） -->
    <ellipse cx="6" cy="108" rx="6.5" ry="4" fill="#fff"/>
    <ellipse cx="5" cy="109" rx="4" ry="3" fill="#5a2818"/>
    <ellipse cx="4.5" cy="108" rx="2.5" ry="2" fill="#2a0808"/>
    <circle cx="3" cy="107" r="1" fill="#fff" opacity="0.5"/>

    <!-- 粗眉毛（痛苦皺眉） -->
    <path d="M-17,102 C-13,100 -7,100 -3,103" fill="none" stroke="#181018" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M0,102 C4,100 10,100 14,103" fill="none" stroke="#181018" stroke-width="2.8" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M-16,115 C-17,119 -15,124 -13,126" fill="none" stroke="#a08058" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 短鬍鬚 -->
    <path d="M-14,129 C-10,132 -4,133 0,131" fill="none" stroke="#201018" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M0,129 C4,132 8,133 12,131" fill="none" stroke="#201018" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-10,135 C-6,138 0,139 4,136" fill="none" stroke="#201018" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 臉部疤痕 -->
    <line x1="-4" y1="96" x2="-8" y2="106" stroke="#a08058" stroke-width="0.8" opacity="0.3"/>

    <!-- 嘴巴（咬牙忍痛） -->
    <path d="M-12,132 C-8,134 -2,134 4,132" fill="none" stroke="#805040" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-10,132 C-6,131 0,131 2,132" fill="none" stroke="#e0d0b0" stroke-width="0.8" opacity="0.4"/>

    <!-- ===== 畫面左側手臂（負x，武器手，槍向後傾斜） ===== -->
    <path d="M-22,148 Q-38,144 -44,148" fill="none" stroke="url(#pangxuanArmor)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="-44" cy="150" r="6" fill="url(#pangxuanFace)"/>

    <!-- ===== 槍（後傾，受擊偏移） ===== -->
    <!-- 槍桿 -->
    <line x1="-56" y1="86" x2="-32" y2="196" stroke="#6a4420" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 槍頭 -->
    <path d="M-60,74 L-54,82 L-58,90 Z" fill="url(#pangxuanSteel)" stroke="#888" stroke-width="0.5"/>
    <!-- 槍纓 -->
    <line x1="-54" y1="84" x2="-50" y2="80" stroke="#aa2020" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-55" y1="88" x2="-51" y2="84" stroke="#aa2020" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-56" y1="92" x2="-52" y2="88" stroke="#aa2020" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 槍尾 -->
    <circle cx="-32" cy="196" r="3" fill="#5a3a18" stroke="#4a2a10" stroke-width="0.5"/>
  </g>
</svg>