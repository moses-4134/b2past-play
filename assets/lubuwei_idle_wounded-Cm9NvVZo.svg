<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 呂不韋 — 吉卜力2頭身 面朝右（敵方）受傷待機（HP 30~60%：身體微傾、單手按腹、權杖下垂） -->
  <defs>
    <radialGradient id="lubuweiWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8dcd0"/>
      <stop offset="100%" stop-color="#d8c8b8"/>
    </radialGradient>
    <linearGradient id="lubuweiWRobe" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#3a1028"/>
      <stop offset="100%" stop-color="#2a0818"/>
    </linearGradient>
    <linearGradient id="lubuweiWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="lubuweiWStaff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2820"/>
      <stop offset="100%" stop-color="#3a2018"/>
    </linearGradient>
    <linearGradient id="lubuweiWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0818"/>
      <stop offset="100%" stop-color="#1a0410"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="30" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（重心偏移） ===== -->
      <!-- 後腿 -->
      <ellipse cx="10" cy="198" rx="10" ry="18" fill="url(#lubuweiWPants)" transform="rotate(-3,10,198)"/>
      <ellipse cx="9" cy="216" rx="11" ry="6" fill="#1a0810"/>
      <!-- 前腿（微彎） -->
      <ellipse cx="-12" cy="196" rx="11" ry="19" fill="url(#lubuweiWPants)" transform="rotate(8,-12,196)"/>
      <ellipse cx="-14" cy="216" rx="12" ry="6" fill="#1a0810"/>

      <!-- 長袍下擺 -->
      <path d="M-28,180 Q-30,202 -26,218 L22,218 Q26,202 24,180" fill="url(#lubuweiWRobe)" opacity="0.5"/>

      <!-- ===== 身體（前傾） ===== -->
      <ellipse cx="-2" cy="158" rx="26" ry="30" fill="url(#lubuweiWRobe)" transform="rotate(-8,-2,158)"/>

      <!-- 內袍 -->
      <path d="M-14,134 L-4,152 L8,134" fill="none" stroke="#5a2838" stroke-width="3" stroke-linejoin="round"/>

      <!-- 金色繡花紋 -->
      <path d="M-18,152 Q-14,160 -10,168" fill="none" stroke="#c8a840" stroke-width="0.8" opacity="0.4"/>
      <path d="M14,150 Q10,158 8,166" fill="none" stroke="#c8a840" stroke-width="0.8" opacity="0.4"/>

      <!-- 金腰帶 -->
      <path d="M-26,182 Q-2,190 22,182" fill="none" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
      <rect x="-6" y="180" width="8" height="8" rx="1" fill="#c8a840" stroke="#a08030" stroke-width="0.5"/>

      <!-- ===== 畫面左側手臂（按住傷口） ===== -->
      <path d="M-22,150 Q-36,164 -18,180" fill="none" stroke="url(#lubuweiWRobe)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
      <ellipse cx="-18" cy="180" rx="7" ry="4" fill="#3a1028" opacity="0.6"/>
      <circle cx="-18" cy="180" r="5" fill="url(#lubuweiWFace)" opacity="0.85"/>

      <!-- ===== 大頭（微低頭） ===== -->
      <!-- 後腦髮 -->
      <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#lubuweiWHair)"/>

      <!-- 臉（微低頭） -->
      <path d="M-30,90 C-34,102 -32,120 -26,132 C-20,140 -6,144 2,142 C12,140 22,132 26,120 C30,108 28,94 22,86 C16,80 4,76 -4,78 C-18,80 -28,84 -30,90Z" fill="url(#lubuweiWFace)"/>

      <!-- 腮紅（傷痛） -->
      <ellipse cx="-22" cy="126" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- 高冠（略歪） -->
      <rect x="-17" y="44" width="32" height="28" rx="2" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="0.5" transform="rotate(-3,-1,58)"/>
      <rect x="-17" y="58" width="32" height="3" fill="#c8a840" opacity="0.8" transform="rotate(-3,-1,58)"/>
      <rect x="-15" y="40" width="28" height="6" rx="1" fill="#0c0c0c" transform="rotate(-3,-1,43)"/>
      <line x1="-19" y1="54" x2="23" y2="54" stroke="#c8a840" stroke-width="1.5" stroke-linecap="round" transform="rotate(-3,2,54)"/>
      <circle cx="-19" cy="54" r="2" fill="#c8a840" transform="rotate(-3,2,54)"/>
      <circle cx="23" cy="54" r="2" fill="#c8a840" transform="rotate(-3,2,54)"/>

      <!-- 頭髮 -->
      <path d="M-20,80 C-16,68 0,62 14,66 C24,70 28,80 26,86 C22,80 14,76 6,74 C-2,72 -12,74 -18,78" fill="url(#lubuweiWHair)"/>
      <path d="M22,88 C26,84 28,92 26,100 C24,106 22,102 22,98" fill="url(#lubuweiWHair)"/>
      <path d="M24,90 C26,88 27,94 26,98" fill="none" stroke="#4a4a50" stroke-width="1" opacity="0.5"/>

      <!-- 耳朵 -->
      <path d="M22,104 C26,100 28,106 26,114 C24,118 22,116 22,110" fill="url(#lubuweiWFace)" stroke="#c0b0a0" stroke-width="0.5"/>

      <!-- ===== 眼（半閉忍痛） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-12" cy="110" rx="6" ry="2.5" fill="#fff"/>
      <ellipse cx="-13" cy="110.5" rx="3.5" ry="1.8" fill="#2a1a10"/>
      <ellipse cx="-13.5" cy="110" rx="2" ry="1.2" fill="#0a0400"/>
      <!-- 重眼瞼 -->
      <path d="M-18,107 C-14,105 -10,105 -6,107" fill="none" stroke="#8a7060" stroke-width="1.8" stroke-linecap="round"/>
      <!-- 右眼（微瞇） -->
      <ellipse cx="8" cy="110" rx="6" ry="3" fill="#fff"/>
      <ellipse cx="7" cy="110.5" rx="3.5" ry="2.2" fill="#2a1a10"/>
      <ellipse cx="6.5" cy="110" rx="2" ry="1.5" fill="#0a0400"/>
      <circle cx="5" cy="109.5" r="0.8" fill="#fff" opacity="0.4"/>
      <!-- 重眼瞼 -->
      <path d="M4,107 C8,105 12,105 14,107" fill="none" stroke="#8a7060" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 眉毛（皺眉） -->
      <path d="M-18,103 C-14,102 -10,102 -6,104" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
      <path d="M12,104 C14,102 18,102 20,103" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-6,116 C-8,122 -4,126 0,126" fill="none" stroke="#c0a890" stroke-width="1.4" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-10,134 C-6,135 0,135 6,134" fill="none" stroke="#705040" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-10,134 C-11,136 -12,137" fill="none" stroke="#705040" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

      <!-- 鬍子 -->
      <line x1="-8" y1="140" x2="-10" y2="150" stroke="#2a2a30" stroke-width="1" opacity="0.5"/>
      <line x1="-5" y1="140" x2="-6" y2="152" stroke="#2a2a30" stroke-width="1" opacity="0.6"/>
      <line x1="-2" y1="140" x2="-2" y2="153" stroke="#2a2a30" stroke-width="1" opacity="0.6"/>
      <line x1="1" y1="140" x2="2" y2="152" stroke="#4a4a50" stroke-width="1" opacity="0.5"/>
      <line x1="4" y1="139" x2="6" y2="150" stroke="#4a4a50" stroke-width="1" opacity="0.5"/>

      <!-- 汗滴 -->
      <path d="M-24,96 C-25,100 -24,104 -23,106" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-23" cy="107" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>

      <!-- ===== 權杖手臂（正x，下垂） ===== -->
      <path d="M24,150 Q38,164 28,180" fill="none" stroke="url(#lubuweiWRobe)" stroke-width="12" stroke-linecap="round"/>
      <ellipse cx="28" cy="180" rx="7" ry="4" fill="#3a1028" opacity="0.6"/>
      <circle cx="28" cy="180" r="5" fill="url(#lubuweiWFace)"/>

      <!-- ===== 權杖（下垂無力） ===== -->
      <line x1="30" y1="178" x2="38" y2="222" stroke="#3a2018" stroke-width="4" stroke-linecap="round"/>
      <line x1="31" y1="180" x2="39" y2="220" stroke="#5a3828" stroke-width="1" opacity="0.3"/>
      <!-- 玉環 -->
      <circle cx="38" cy="214" r="4" fill="none" stroke="#4a8a50" stroke-width="2.5"/>
      <!-- 金龍頭飾（杖頂，現在在下方） -->
      <circle cx="38" cy="222" r="5" fill="#c8a840"/>
      <circle cx="38" cy="222" r="3.5" fill="#a08030"/>
      <!-- 杖底（現在在上方） -->
      <circle cx="30" cy="178" r="2.5" fill="#c8a840"/>
    </g>
  </g>
</svg>