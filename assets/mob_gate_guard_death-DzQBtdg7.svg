<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 城門守卒 — 倒地/戰敗 -->
  <defs>
    <radialGradient id="mobGateGuardFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c0a470"/>
    </radialGradient>
    <linearGradient id="mobGateGuardArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a4a48"/>
      <stop offset="100%" stop-color="#3a3a38"/>
    </linearGradient>
    <linearGradient id="mobGateGuardPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="100%" stop-color="#2a2a28"/>
    </linearGradient>
    <linearGradient id="mobGateGuardHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobGateGuardSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <linearGradient id="mobGateGuardShield" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6a5030"/>
      <stop offset="100%" stop-color="#4a3420"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(78, 10)">
      <!-- 陰影（倒地拉長） -->
      <ellipse cx="-4" cy="204" rx="40" ry="4" fill="#000" opacity="0.08"/>

      <g transform="rotate(90, -4, 160)">
        <!-- ===== 腿 ===== -->
        <ellipse cx="10" cy="180" rx="9" ry="16" fill="url(#mobGateGuardPants)"/>
        <ellipse cx="9" cy="194" rx="10" ry="6" fill="#2a2820"/>
        <ellipse cx="-10" cy="178" rx="10" ry="17" fill="url(#mobGateGuardPants)"/>
        <ellipse cx="-11" cy="194" rx="11" ry="6" fill="#2a2820"/>

        <!-- ===== 身體 ===== -->
        <ellipse cx="-2" cy="148" rx="25" ry="27" fill="url(#mobGateGuardArmor)"/>

        <path d="M-10,128 L-4,138 L4,128" fill="none" stroke="#3a3a38" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

        <path d="M-22,168 Q-2,174 20,168" fill="none" stroke="#3a3020" stroke-width="4" stroke-linecap="round"/>

        <!-- ===== 大頭 ===== -->
        <ellipse cx="0" cy="100" rx="34" ry="36" fill="url(#mobGateGuardHair)"/>

        <path d="M-24,92 C-28,102 -26,114 -20,124 C-14,132 -4,136 4,134 C12,132 18,126 22,116 C26,104 24,92 18,84 C12,78 4,76 -2,78 C-14,80 -22,86 -24,92Z" fill="url(#mobGateGuardFace)"/>

        <path d="M-16,80 C-12,62 4,54 16,58 C24,62 28,74 24,84 C20,76 14,70 6,68 C0,66 -8,68 -14,74" fill="url(#mobGateGuardHair)"/>

        <!-- 頭盔（歪斜） -->
        <path d="M-28,82 C-24,68 -8,60 8,62 C20,64 28,72 26,82" fill="#4a4a48" stroke="#3a3a38" stroke-width="0.5" transform="rotate(5,0,72)"/>
        <path d="M-30,82 C-30,80 -28,78 -24,80 L28,80 C30,80 30,84 28,84 L-28,84 C-30,84 -30,82 -30,82Z" fill="#4a4a48" stroke="#3a3a38" stroke-width="0.5"/>

        <path d="M-22,84 C-26,78 -28,82 -28,88 C-26,92 -22,90 -22,86" fill="url(#mobGateGuardHair)"/>
        <path d="M18,86 C24,80 26,88 24,96 C22,100 18,98 18,94" fill="url(#mobGateGuardHair)"/>

        <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,110" fill="url(#mobGateGuardFace)" stroke="#b09060" stroke-width="0.5"/>

        <!-- 眼睛（閉眼） -->
        <line x1="-14" y1="108" x2="-6" y2="108" stroke="#2a2820" stroke-width="2" stroke-linecap="round"/>
        <line x1="2" y1="108" x2="10" y2="108" stroke="#2a2820" stroke-width="2" stroke-linecap="round"/>

        <path d="M-14,102 C-10,101 -8,102 -6,103" fill="none" stroke="#2a2420" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
        <path d="M8,103 C10,102 12,101 16,102" fill="none" stroke="#2a2420" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

        <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#a08858" stroke-width="1.2" stroke-linecap="round"/>

        <path d="M-8,128 C-4,128 2,128 6,128" fill="none" stroke="#704840" stroke-width="1.5" stroke-linecap="round"/>

        <!-- ===== 左手臂（負x，自然垂落） ===== -->
        <path d="M-18,136 Q-30,148 -28,162" fill="none" stroke="url(#mobGateGuardArmor)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
        <circle cx="-28" cy="164" r="4.5" fill="url(#mobGateGuardFace)" opacity="0.85"/>

        <!-- 盾牌（掉落地上） -->
        <ellipse cx="-36" cy="180" rx="14" ry="16" fill="url(#mobGateGuardShield)" stroke="#3a2818" stroke-width="1" opacity="0.8"/>

        <!-- ===== 右手臂（正x，自然垂落） ===== -->
        <path d="M16,136 Q30,148 34,160" fill="none" stroke="url(#mobGateGuardArmor)" stroke-width="10" stroke-linecap="round"/>
        <circle cx="34" cy="162" r="5" fill="url(#mobGateGuardFace)"/>

        <!-- 槍（脫手掉落） -->
        <line x1="30" y1="176" x2="76" y2="170" stroke="#5a4028" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M76.6,164 L79.4,170.4 L73.8,169.6 Z" fill="url(#mobGateGuardSteel)" stroke="#888" stroke-width="0.5"/>
      </g>
    </g>
  </g>
</svg>
