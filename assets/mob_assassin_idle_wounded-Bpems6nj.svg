<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙嵬暗殺者 — 受傷待機（HP 30~60%：身體微傾、匕首下垂、眼半瞇、面罩保留） -->
  <defs>
    <radialGradient id="mobAssassinWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8c8b8"/>
      <stop offset="100%" stop-color="#c4b4a0"/>
    </radialGradient>
    <linearGradient id="mobAssassinWArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
    <linearGradient id="mobAssassinWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>
    <linearGradient id="mobAssassinWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="mobAssassinWBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0a8b0"/>
      <stop offset="100%" stop-color="#606870"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="191" rx="24" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前腿微彎） ===== -->
      <!-- 後腿 -->
      <ellipse cx="8" cy="170" rx="9" ry="14" fill="url(#mobAssassinWPants)" transform="rotate(-3,8,170)"/>
      <ellipse cx="6" cy="185" rx="10" ry="6" fill="#0e0e14"/>
      <!-- 前腿 -->
      <ellipse cx="-10" cy="171" rx="9" ry="15" fill="url(#mobAssassinWPants)" transform="rotate(8,-10,171)"/>
      <ellipse cx="-13" cy="185" rx="10" ry="6" fill="#0e0e14"/>

      <!-- ===== 身體（前傾） ===== -->
      <ellipse cx="-2" cy="142" rx="20" ry="22" fill="url(#mobAssassinWArmor)" transform="rotate(-8,-2,142)"/>

      <!-- 夜行衣紋理 -->
      <path d="M-6,132 L-3,142" fill="none" stroke="#2a2a30" stroke-width="0.6" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-8,124 L-3,132 L3,124" fill="none" stroke="#2a2a30" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-18,156 Q-2,162 16,156" fill="none" stroke="#181820" stroke-width="4" stroke-linecap="round"/>
      <rect x="-4" y="154" width="5" height="5" rx="1" fill="#2a2a30" stroke="#1a1a20" stroke-width="0.5"/>

      <!-- ===== 畫面左側手臂（角色右手，按住傷口） ===== -->
      <path d="M-14,128 Q-22,142 -6,156" fill="none" stroke="url(#mobAssassinWArmor)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
      <circle cx="-6" cy="158" r="4.5" fill="url(#mobAssassinWFace)" opacity="0.85"/>

      <!-- ===== 畫面右側手臂（角色左手，持匕首下垂） ===== -->
      <path d="M18,128 Q28,138 34,150" fill="none" stroke="url(#mobAssassinWArmor)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="34" cy="152" r="4.5" fill="url(#mobAssassinWFace)"/>

      <!-- ===== 匕首（下垂無力） ===== -->
      <line x1="35" y1="154" x2="40" y2="174" stroke="url(#mobAssassinWBlade)" stroke-width="3" stroke-linecap="round"/>
      <line x1="36" y1="153" x2="41" y2="173" stroke="#c0c8d0" stroke-width="0.8" opacity="0.3"/>
      <line x1="37" y1="152" x2="31" y2="150" stroke="#2a2a30" stroke-width="3" stroke-linecap="round"/>
      <line x1="33" y1="152" x2="31" y2="156" stroke="#181820" stroke-width="3" stroke-linecap="round"/>
      <circle cx="30" cy="158" r="2" fill="#2a2a30"/>

      <!-- ===== 大頭（低頭） ===== -->
      <ellipse cx="0" cy="102" rx="32" ry="34" fill="url(#mobAssassinWHair)"/>

      <!-- 臉 -->
      <path d="M-20,92 C-24,98 -22,112 -16,120 C-12,126 -4,130 2,128 C8,126 14,120 16,112 C20,102 18,92 14,86 C8,80 2,78 -2,80 C-12,82 -18,86 -20,92Z" fill="url(#mobAssassinWFace)"/>

      <!-- 短髮頂部 -->
      <path d="M-14,82 C-10,66 2,60 12,64 C20,68 24,78 20,86 C16,80 10,74 4,72 C0,70 -8,72 -12,78" fill="url(#mobAssassinWHair)"/>

      <!-- 側髮 -->
      <path d="M14,86 C18,82 20,88 18,94 C16,98 14,96 14,92" fill="url(#mobAssassinWHair)"/>
      <path d="M-20,90 C-24,84 -26,88 -24,96 C-22,100 -20,98 -20,94" fill="url(#mobAssassinWHair)"/>

      <!-- 耳朵 -->
      <path d="M14,104 C18,100 20,106 18,112 C16,116 14,114 14,110" fill="url(#mobAssassinWFace)" stroke="#b0a490" stroke-width="0.5"/>

      <!-- ===== 眼睛（左眼半瞇、右眼微睜） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-8" cy="108" rx="5.5" ry="3.5" fill="#fff"/>
      <ellipse cx="-9" cy="108.5" rx="3.5" ry="2.5" fill="#201820"/>
      <ellipse cx="-9.5" cy="108" rx="2" ry="1.5" fill="#100810"/>
      <circle cx="-11" cy="107" r="0.6" fill="#fff" opacity="0.4"/>

      <!-- 右眼（微瞇） -->
      <ellipse cx="4" cy="108" rx="5.5" ry="4.5" fill="#fff"/>
      <ellipse cx="3" cy="109" rx="3.5" ry="3.2" fill="#201820"/>
      <ellipse cx="2.5" cy="108" rx="2" ry="1.8" fill="#100810"/>
      <circle cx="1" cy="107" r="0.8" fill="#fff" opacity="0.5"/>

      <!-- 眉間皺紋 -->
      <path d="M-2,103 C0,101 2,101 4,103" fill="none" stroke="#b0a490" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 眉毛（皺眉） -->
      <path d="M-12,103 C-10,101 -6,102 -4,104" fill="none" stroke="#181818" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M6,104 C8,102 12,101 14,103" fill="none" stroke="#181818" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-10,114 C-12,118 -8,120" fill="none" stroke="#b0a490" stroke-width="1" stroke-linecap="round"/>

      <!-- ===== 面罩（保留，微鬆） ===== -->
      <path d="M-18,114 C-20,118 -18,126 -14,130 C-8,134 0,136 4,134 C10,132 14,126 16,120 C18,116 16,112 14,110 L-16,110 Z" fill="#121218" opacity="0.85"/>
      <path d="M-10,118 L-7,126" fill="none" stroke="#1a1a20" stroke-width="0.6" opacity="0.4"/>
      <path d="M-18,114 C-22,112 -24,110 -22,108" fill="none" stroke="#121218" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M16,112 C20,110 22,108 20,106" fill="none" stroke="#121218" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 汗滴 -->
      <path d="M-18,90 C-19,94 -18,98 -17,100" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-17" cy="101" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
    </g>
  </g>
</svg>