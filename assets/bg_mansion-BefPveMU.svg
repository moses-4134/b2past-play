<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 豪門府邸庭院 — 吉卜力風格：大宅院、假山水池、迴廊、竹林 -->
  <defs>
    <!-- 天空（柔和午後） -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90b8d8"/>
      <stop offset="50%" stop-color="#b0d0e0"/>
      <stop offset="100%" stop-color="#d8e8e8"/>
    </linearGradient>
    <!-- 庭院地面 -->
    <linearGradient id="courtyard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a09878"/>
      <stop offset="100%" stop-color="#887858"/>
    </linearGradient>
    <!-- 廊柱 -->
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a5a38"/>
      <stop offset="50%" stop-color="#8a6a48"/>
      <stop offset="100%" stop-color="#6a4a28"/>
    </linearGradient>
    <!-- 水面 -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80b8c8"/>
      <stop offset="100%" stop-color="#60a0b0"/>
    </linearGradient>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- ===== 遠景竹林 ===== -->
  <!-- 竹竿 -->
  <line x1="720" y1="20" x2="720" y2="120" stroke="#5a8a40" stroke-width="4" opacity="0.5"/>
  <line x1="740" y1="12" x2="740" y2="125" stroke="#4a7a35" stroke-width="3.5" opacity="0.45"/>
  <line x1="758" y1="25" x2="758" y2="120" stroke="#5a8a40" stroke-width="4" opacity="0.48"/>
  <line x1="775" y1="15" x2="775" y2="125" stroke="#4a7a35" stroke-width="3.5" opacity="0.45"/>
  <line x1="795" y1="28" x2="795" y2="120" stroke="#5a8a40" stroke-width="4" opacity="0.42"/>
  <line x1="812" y1="18" x2="812" y2="125" stroke="#4a7a35" stroke-width="3.5" opacity="0.4"/>
  <line x1="830" y1="26" x2="830" y2="120" stroke="#5a8a40" stroke-width="3.5" opacity="0.38"/>
  <!-- 竹葉（橢圓簇） -->
  <ellipse cx="720" cy="16" rx="12" ry="5" fill="#5a9a40" opacity="0.5" transform="rotate(-20,720,16)"/>
  <ellipse cx="730" cy="10" rx="10" ry="4" fill="#4a8a35" opacity="0.45" transform="rotate(15,730,10)"/>
  <ellipse cx="740" cy="8" rx="12" ry="5" fill="#6aaa48" opacity="0.5" transform="rotate(-10,740,8)"/>
  <ellipse cx="755" cy="20" rx="11" ry="4" fill="#5a9a40" opacity="0.45" transform="rotate(20,755,20)"/>
  <ellipse cx="775" cy="12" rx="12" ry="5" fill="#4a8a35" opacity="0.48" transform="rotate(-15,775,12)"/>
  <ellipse cx="795" cy="24" rx="10" ry="4" fill="#6aaa48" opacity="0.42" transform="rotate(10,795,24)"/>
  <ellipse cx="812" cy="14" rx="12" ry="5" fill="#5a9a40" opacity="0.4" transform="rotate(-25,812,14)"/>
  <ellipse cx="830" cy="22" rx="11" ry="4" fill="#4a8a35" opacity="0.38" transform="rotate(15,830,22)"/>

  <!-- ===== 大宅建築背景 ===== -->
  <!-- 主屋 -->
  <rect x="50" y="40" width="600" height="90" fill="#c8b090" opacity="0.7"/>
  <!-- 屋頂 -->
  <polygon points="30,40 350,0 670,40" fill="#5a4a38" opacity="0.65"/>
  <polygon points="40,40 350,5 660,40" fill="#6a5a48" opacity="0.55"/>
  <!-- 屋脊飛簷 -->
  <path d="M30,40 Q20,36 15,40" fill="none" stroke="#5a4a38" stroke-width="2" opacity="0.5"/>
  <path d="M670,40 Q680,36 685,40" fill="none" stroke="#5a4a38" stroke-width="2" opacity="0.5"/>

  <!-- 門窗 -->
  <rect x="140" y="60" width="40" height="45" fill="#e8d8b0" opacity="0.5" rx="2" stroke="#7a5a38" stroke-width="1.5"/>
  <line x1="160" y1="60" x2="160" y2="105" stroke="#7a5a38" stroke-width="1" opacity="0.5"/>
  <rect x="280" y="56" width="50" height="50" fill="#e8d8b0" opacity="0.5" rx="2" stroke="#7a5a38" stroke-width="1.5"/>
  <line x1="305" y1="56" x2="305" y2="106" stroke="#7a5a38" stroke-width="1" opacity="0.5"/>
  <rect x="430" y="60" width="40" height="45" fill="#e8d8b0" opacity="0.5" rx="2" stroke="#7a5a38" stroke-width="1.5"/>
  <line x1="450" y1="60" x2="450" y2="105" stroke="#7a5a38" stroke-width="1" opacity="0.5"/>

  <!-- ===== 迴廊 ===== -->
  <!-- 廊頂 -->
  <rect x="0" y="118" width="680" height="10" fill="#6a5a48" opacity="0.5"/>
  <!-- 廊柱 -->
  <rect x="50" y="118" width="12" height="55" fill="url(#pillar)" rx="2"/>
  <rect x="150" y="118" width="12" height="55" fill="url(#pillar)" rx="2"/>
  <rect x="250" y="118" width="12" height="55" fill="url(#pillar)" rx="2"/>
  <rect x="350" y="118" width="12" height="55" fill="url(#pillar)" rx="2"/>
  <rect x="450" y="118" width="12" height="55" fill="url(#pillar)" rx="2"/>
  <rect x="550" y="118" width="12" height="55" fill="url(#pillar)" rx="2"/>
  <rect x="650" y="118" width="12" height="55" fill="url(#pillar)" rx="2"/>
  <!-- 柱礎 -->
  <rect x="47" y="170" width="18" height="5" fill="#8a7a60" rx="1" opacity="0.5"/>
  <rect x="147" y="170" width="18" height="5" fill="#8a7a60" rx="1" opacity="0.5"/>
  <rect x="247" y="170" width="18" height="5" fill="#8a7a60" rx="1" opacity="0.5"/>
  <rect x="347" y="170" width="18" height="5" fill="#8a7a60" rx="1" opacity="0.5"/>
  <rect x="447" y="170" width="18" height="5" fill="#8a7a60" rx="1" opacity="0.5"/>
  <rect x="547" y="170" width="18" height="5" fill="#8a7a60" rx="1" opacity="0.5"/>
  <rect x="647" y="170" width="18" height="5" fill="#8a7a60" rx="1" opacity="0.5"/>

  <!-- ===== 假山 ===== -->
  <path d="M850,150 Q860,120 880,132 Q890,105 910,122 Q920,112 930,132 Q940,120 950,150" fill="#7a7a6a" opacity="0.6"/>
  <path d="M855,150 Q870,128 885,136 Q900,118 915,130 Q925,120 945,150" fill="#8a8a78" opacity="0.5"/>
  <!-- 假山苔蘚 -->
  <ellipse cx="880" cy="132" rx="10" ry="5" fill="#5a8a38" opacity="0.35"/>
  <ellipse cx="910" cy="122" rx="8" ry="4" fill="#4a7a30" opacity="0.3"/>

  <!-- ===== 地面（起始 y=180） ===== -->
  <rect x="0" y="180" width="960" height="360" fill="url(#courtyard)"/>

  <!-- ===== 水池 ===== -->
  <ellipse cx="500" cy="265" rx="120" ry="40" fill="url(#water)" opacity="0.5"/>
  <ellipse cx="500" cy="265" rx="115" ry="37" fill="#90c0d0" opacity="0.3"/>
  <!-- 水面波紋 -->
  <ellipse cx="490" cy="260" rx="30" ry="6" fill="none" stroke="#a0d0e0" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="520" cy="270" rx="25" ry="5" fill="none" stroke="#a0d0e0" stroke-width="0.5" opacity="0.25"/>
  <!-- 池邊石 -->
  <ellipse cx="390" cy="255" rx="12" ry="7" fill="#8a8a78" opacity="0.4"/>
  <ellipse cx="610" cy="260" rx="10" ry="6" fill="#7a7a6a" opacity="0.4"/>
  <ellipse cx="480" cy="295" rx="11" ry="6" fill="#8a8a78" opacity="0.35"/>

  <!-- 石板紋理 -->
  <line x1="0" y1="220" x2="960" y2="220" stroke="#7a6a50" stroke-width="0.6" opacity="0.2"/>
  <line x1="0" y1="320" x2="960" y2="320" stroke="#7a6a50" stroke-width="0.6" opacity="0.18"/>
  <line x1="0" y1="380" x2="960" y2="380" stroke="#7a6a50" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="450" x2="960" y2="450" stroke="#7a6a50" stroke-width="0.5" opacity="0.12"/>

  <!-- 地面交界 -->
  <line x1="0" y1="180" x2="960" y2="180" stroke="#6a5a40" stroke-width="2.5"/>

  <!-- ===== 石燈籠 ===== -->
  <!-- 左石燈籠 -->
  <rect x="180" y="187" width="8" height="20" fill="#8a8a78" rx="1" opacity="0.6"/>
  <rect x="176" y="183" width="16" height="6" fill="#9a9a88" rx="2" opacity="0.6"/>
  <rect x="174" y="177" width="20" height="8" fill="#8a8a78" rx="2" opacity="0.6"/>
  <polygon points="174,177 184,167 194,177" fill="#9a9a88" opacity="0.55"/>
  <ellipse cx="184" cy="173" rx="3" ry="2" fill="#ffaa40" opacity="0.4"/>
  <!-- 右石燈籠 -->
  <rect x="700" y="187" width="8" height="20" fill="#8a8a78" rx="1" opacity="0.6"/>
  <rect x="696" y="183" width="16" height="6" fill="#9a9a88" rx="2" opacity="0.6"/>
  <rect x="694" y="177" width="20" height="8" fill="#8a8a78" rx="2" opacity="0.6"/>
  <polygon points="694,177 704,167 714,177" fill="#9a9a88" opacity="0.55"/>
  <ellipse cx="704" cy="173" rx="3" ry="2" fill="#ffaa40" opacity="0.4"/>

  <!-- ===== 庭院植物 ===== -->
  <!-- 小圓潤灌木 -->
  <circle cx="50" cy="190" r="12" fill="#5a9a38" opacity="0.4"/>
  <circle cx="70" cy="193" r="10" fill="#4a8a30" opacity="0.35"/>
  <circle cx="920" cy="187" r="14" fill="#5a9a38" opacity="0.4"/>
  <circle cx="940" cy="191" r="10" fill="#4a8a30" opacity="0.35"/>

  <!-- ===== 空氣粒子（花瓣/光塵） ===== -->
  <circle cx="100" cy="100" r="1.5" fill="#fff8e0" opacity="0.35"/>
  <circle cx="300" cy="80" r="1" fill="#fff8e0" opacity="0.3"/>
  <circle cx="480" cy="120" r="1.5" fill="#fff8e0" opacity="0.28"/>
  <circle cx="650" cy="90" r="1.2" fill="#fff8e0" opacity="0.3"/>
  <circle cx="800" cy="70" r="1" fill="#fff8e0" opacity="0.25"/>
  <circle cx="200" cy="155" r="1.3" fill="#fff8e0" opacity="0.25"/>
  <circle cx="400" cy="148" r="1" fill="#fff8e0" opacity="0.22"/>
  <circle cx="600" cy="165" r="1.2" fill="#fff8e0" opacity="0.22"/>
  <circle cx="750" cy="140" r="0.8" fill="#fff8e0" opacity="0.2"/>
  <circle cx="50" cy="140" r="1" fill="#fff8e0" opacity="0.25"/>
  <circle cx="900" cy="120" r="1.2" fill="#fff8e0" opacity="0.25"/>

  <!-- 飄落花瓣 -->
  <ellipse cx="250" cy="100" rx="3" ry="1.5" fill="#f0b0b0" opacity="0.3" transform="rotate(30,250,100)"/>
  <ellipse cx="550" cy="120" rx="2.5" ry="1.2" fill="#f0b0b0" opacity="0.25" transform="rotate(-20,550,120)"/>
  <ellipse cx="380" cy="155" rx="3" ry="1.5" fill="#f0b0b0" opacity="0.22" transform="rotate(45,380,155)"/>

  <!-- ===== 整體氛圍覆蓋 ===== -->
  <rect width="960" height="540" fill="#e8d8a0" opacity="0.05"/>
</svg>