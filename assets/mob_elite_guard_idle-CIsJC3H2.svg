<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙嵬親衛 — 吉卜力2頭身 面朝右（敵方）戰鬥待機 -->
  <defs>
    <radialGradient id="mobEliteGuardFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc098"/>
      <stop offset="100%" stop-color="#c4a478"/>
    </radialGradient>
    <linearGradient id="mobEliteGuardArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a2020"/>
      <stop offset="100%" stop-color="#3a1010"/>
    </linearGradient>
    <linearGradient id="mobEliteGuardPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1818"/>
      <stop offset="100%" stop-color="#1e0e0e"/>
    </linearGradient>
    <linearGradient id="mobEliteGuardHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="mobEliteGuardHelmet" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#4a4040"/>
      <stop offset="100%" stop-color="#3a3030"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="30" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿 ===== -->
      <ellipse cx="10" cy="186" rx="11" ry="17" fill="url(#mobEliteGuardPants)" transform="rotate(-4,10,186)"/>
      <ellipse cx="8" cy="206" rx="12" ry="6" fill="#2a1210"/>
      <ellipse cx="-12" cy="183" rx="12" ry="18" fill="url(#mobEliteGuardPants)" transform="rotate(4,-12,184)"/>
      <ellipse cx="-14" cy="206" rx="13" ry="6" fill="#2a1210"/>

      <!-- ===== 身體（壯碩） ===== -->
      <ellipse cx="-2" cy="148" rx="26" ry="28" fill="url(#mobEliteGuardArmor)" transform="rotate(-4,-2,148)"/>

      <!-- 甲片紋路（精良） -->
      <path d="M-12,144 L-9,158" fill="none" stroke="#2a0e0e" stroke-width="0.9" opacity="0.4"/>
      <path d="M6,148 L9,162" fill="none" stroke="#2a0e0e" stroke-width="0.8" opacity="0.35"/>
      <path d="M-2,146 L-2,162" fill="none" stroke="#2a0e0e" stroke-width="0.7" opacity="0.3"/>

      <!-- 護肩（大片） -->
      <ellipse cx="22" cy="136" rx="10" ry="6" fill="url(#mobEliteGuardArmor)" stroke="#4a1818" stroke-width="0.8"/>
      <ellipse cx="-22" cy="136" rx="10" ry="6" fill="url(#mobEliteGuardArmor)" stroke="#4a1818" stroke-width="0.8"/>

      <!-- 領口 -->
      <path d="M-12,138 L-4,150 L4,138" fill="none" stroke="#6a2828" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-26,180 Q-2,187 24,180" fill="none" stroke="#3a1818" stroke-width="5" stroke-linecap="round"/>
      <rect x="-7" y="178" width="8" height="8" rx="1" fill="#8a6830" stroke="#6a4820" stroke-width="0.5"/>

      <!-- ===== 右手臂（持劍，M起點正x）===== -->
      <path d="M22,146 Q38,138 46,132" fill="none" stroke="url(#mobEliteGuardArmor)" stroke-width="11" stroke-linecap="round"/>

      <!-- ===== 劍（50.6px） ===== -->
      <path d="M49.0,128.1 L55.0,78.1 L55.0,72.0 L50.0,77.5 L46.0,127.8 Z" fill="#9a9a9a" stroke="#7a7a7a" stroke-width="0.6" stroke-linejoin="round"/>
      <!-- 劍身亮線 -->
      <line x1="49" y1="126" x2="55" y2="76" stroke="#ccc" stroke-width="0.8" opacity="0.3"/>
      <!-- 劍護手 -->
      <line x1="52" y1="132" x2="44" y2="128" stroke="#8a6830" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 劍柄 -->
      <line x1="46" y1="132" x2="44" y2="138" stroke="#4a3018" stroke-width="4" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="43" cy="140" r="2.5" fill="#8a6830"/>
      <!-- 握劍的手 -->
      <circle cx="46" cy="132" r="5.5" fill="url(#mobEliteGuardFace)"/>

      <!-- ===== 左手臂（持盾，M起點負x）===== -->
      <path d="M-22,146 Q-36,150 -38,162" fill="none" stroke="url(#mobEliteGuardArmor)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-38" cy="164" r="5" fill="url(#mobEliteGuardFace)" opacity="0.85"/>
      <!-- 小盾 rx=7 ry=9 -->
      <ellipse cx="-42" cy="148" rx="7" ry="9" fill="#5a2020" stroke="#3a1010" stroke-width="1"/>
      <line x1="-42" y1="141" x2="-42" y2="155" stroke="#6a3030" stroke-width="1" opacity="0.5"/>
      <line x1="-36" y1="148" x2="-48" y2="148" stroke="#6a3030" stroke-width="1" opacity="0.5"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="98" rx="34" ry="36" fill="url(#mobEliteGuardHair)"/>

      <!-- 臉 -->
      <path d="M-24,90 C-28,100 -26,114 -20,124 C-14,132 -4,136 4,134 C12,132 18,124 22,114 C26,102 24,90 18,82 C12,76 4,74 -2,76 C-12,78 -22,84 -24,90Z" fill="url(#mobEliteGuardFace)"/>

      <!-- 短髮 -->
      <path d="M-16,80 C-12,66 4,58 16,62 C24,68 28,76 24,84 C20,78 14,72 6,70 C0,68 -8,70 -14,76" fill="url(#mobEliteGuardHair)"/>

      <!-- 鐵盔 -->
      <path d="M-28,82 C-26,60 0,48 26,60 C30,66 30,78 28,84 Q0,72 -28,82Z" fill="url(#mobEliteGuardHelmet)" stroke="#2a2020" stroke-width="0.8"/>
      <!-- 盔頂脊 -->
      <path d="M0,52 L0,78" fill="none" stroke="#4a3a3a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <!-- 盔沿 -->
      <path d="M-28,82 Q0,90 28,82" fill="none" stroke="#2a2020" stroke-width="2" stroke-linecap="round"/>

      <!-- 瀏海（盔下露出） -->
      <path d="M-24,90 C-28,82 -30,86 -30,92 C-28,96 -24,96 -24,92" fill="url(#mobEliteGuardHair)"/>

      <!-- 側髮 -->
      <path d="M18,86 C24,80 26,88 24,96 C22,100 18,98 18,94" fill="url(#mobEliteGuardHair)"/>

      <!-- 耳朵 -->
      <path d="M16,102 C20,98 22,104 20,110 C18,114 16,112 16,108" fill="url(#mobEliteGuardFace)" stroke="#a08058" stroke-width="0.5"/>

      <!-- ===== 眼睛（兇悍 rx=6 ry=5.5） ===== -->
      <ellipse cx="-10" cy="108" rx="6" ry="5.5" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="3.8" ry="4" fill="#2a1010"/>
      <ellipse cx="-11.5" cy="108" rx="2.2" ry="2.4" fill="#180808"/>
      <circle cx="-13" cy="106.5" r="1" fill="#fff" opacity="0.55"/>

      <ellipse cx="6" cy="108" rx="6" ry="5.5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.8" ry="4" fill="#2a1010"/>
      <ellipse cx="4.5" cy="108" rx="2.2" ry="2.4" fill="#180808"/>
      <circle cx="3" cy="106.5" r="1" fill="#fff" opacity="0.55"/>

      <!-- 眉毛（粗獷） -->
      <path d="M-14,100 C-10,98 -8,100 -6,102" fill="none" stroke="#2a1a10" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M8,102 C10,100 12,98 16,100" fill="none" stroke="#2a1a10" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#a08058" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（嚴肅一字） -->
      <path d="M-10,128 C-6,129 0,129 4,128" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
