<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 甯晏 — 吉卜力2頭身 面朝右（敵方）瀕死待機（HP <30%） -->
  <defs>
    <radialGradient id="lianjinCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ece0d4"/>
      <stop offset="100%" stop-color="#dcd0c0"/>
    </radialGradient>
    <linearGradient id="lianjinCArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="lianjinCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="lianjinCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="lianjinCBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0c8d0"/>
      <stop offset="100%" stop-color="#707880"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="196" rx="32" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪姿態） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="8" cy="174" rx="10" ry="12" fill="url(#lianjinCPants)" transform="rotate(-20,8,174)"/>
      <ellipse cx="2" cy="186" rx="8" ry="5" fill="url(#lianjinCPants)"/>
      <ellipse cx="0" cy="190" rx="9" ry="5" fill="#0a0a0a"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-16" cy="170" rx="10" ry="16" fill="url(#lianjinCPants)" transform="rotate(12,-16,170)"/>
      <ellipse cx="-20" cy="190" rx="11" ry="6" fill="#0a0a0a"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="142" rx="22" ry="24" fill="url(#lianjinCArmor)" transform="rotate(-14,-4,142)"/>

      <!-- 刺客裝束暗紋 -->
      <path d="M-10,130 L-6,142" fill="none" stroke="#222" stroke-width="0.8" opacity="0.4"/>

      <!-- 領口 -->
      <path d="M-12,124 L-6,134 L2,124" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-24,158 Q-4,165 18,158" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
      <rect x="-8" y="156" width="7" height="7" rx="1" fill="#333" stroke="#222" stroke-width="0.5"/>

      <!-- ===== 畫面左側手臂（角色左手，撐在膝蓋上） ===== -->
      <path d="M-18,128 Q-28,138 -20,160" fill="none" stroke="url(#lianjinCArmor)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
      <circle cx="-19" cy="162" r="5" fill="url(#lianjinCFace)" opacity="0.85"/>

      <!-- ===== 大頭（低垂喘息） ===== -->
      <!-- 後腦短髮 -->
      <ellipse cx="-2" cy="92" rx="36" ry="38" fill="url(#lianjinCHair)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-26,86 C-30,94 -28,110 -22,120 C-16,128 -6,132 2,130 C8,128 14,122 18,112 C22,100 20,88 14,80 C8,74 0,72 -6,74 C-16,76 -24,80 -26,86Z" fill="url(#lianjinCFace)"/>

      <!-- 腮紅（痛苦更明顯） -->
      <ellipse cx="-20" cy="118" rx="7" ry="4" fill="#e0a0a0" opacity="0.4"/>

      <!-- 短髮頂部 -->
      <path d="M-20,76 C-16,58 0,52 12,56 C22,60 26,72 22,80 C18,74 10,68 2,66 C-4,64 -12,66 -18,72" fill="url(#lianjinCHair)"/>

      <!-- 側髮 -->
      <path d="M16,80 C20,76 22,82 20,90 C18,94 16,92 16,88" fill="url(#lianjinCHair)"/>
      <path d="M-26,84 C-30,78 -32,82 -30,90 C-28,94 -26,92 -26,88" fill="url(#lianjinCHair)"/>
      <!-- 散落髮絲 -->
      <path d="M-30,94 C-32,100 -30,104" fill="none" stroke="url(#lianjinCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 耳朵 -->
      <path d="M16,100 C20,96 22,102 20,108 C18,112 16,110 16,106" fill="url(#lianjinCFace)" stroke="#c8bca8" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼瞇成線） ===== -->
      <!-- 左眼（幾乎閉上） -->
      <ellipse cx="-12" cy="104" rx="6.5" ry="2" fill="#fff"/>
      <ellipse cx="-13" cy="104.5" rx="4" ry="1.5" fill="#181018"/>
      <ellipse cx="-13.5" cy="104" rx="2" ry="1" fill="#0a0008"/>

      <!-- 右眼（勉強睜一線） -->
      <ellipse cx="4" cy="104" rx="6.5" ry="2.5" fill="#fff"/>
      <ellipse cx="3" cy="104.5" rx="4" ry="2" fill="#181018"/>
      <ellipse cx="2.5" cy="104" rx="2" ry="1.2" fill="#0a0008"/>
      <circle cx="1" cy="103" r="0.8" fill="#fff" opacity="0.7"/>

      <!-- 眉間皺紋（深刻） -->
      <path d="M-5,97 C-3,95 0,95 2,97" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-6,99 C-4,97.5 -1,97.5 1,99" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 銳利眉毛 -->
      <path d="M-18,98 C-14,96 -10,97 -8,99" fill="none" stroke="#101010" stroke-width="2" stroke-linecap="round"/>
      <path d="M6,99 C8,97 12,96 16,98" fill="none" stroke="#101010" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-16,110 C-18,116 -14,120" fill="none" stroke="#c8bca8" stroke-width="1.2" stroke-linecap="round"/>

      <!-- ===== 面罩（黑色布罩） ===== -->
      <path d="M-24,114 C-26,118 -24,128 -18,132 C-12,136 -2,138 4,136 C10,134 16,128 18,120 C20,116 18,112 16,110 L-22,110 Z" fill="#0a0a0a" opacity="0.92"/>
      <path d="M-16,118 L-12,128" fill="none" stroke="#1a1a1a" stroke-width="0.8" opacity="0.5"/>
      <path d="M0,116 L2,126" fill="none" stroke="#1a1a1a" stroke-width="0.6" opacity="0.4"/>
      <path d="M-24,114 C-28,112 -30,110 -28,108" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"/>
      <path d="M18,112 C22,110 24,108 22,106" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"/>

      <!-- ===== 畫面右側手臂（角色右手，劍插地撐住身體） ===== -->
      <path d="M18,128 Q38,122 48,130" fill="none" stroke="url(#lianjinCArmor)" stroke-width="11" stroke-linecap="round"/>
      <path d="M36,124 Q42,126 46,130" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 劍（插入地面當支撐） ===== -->
      <circle cx="48" cy="132" r="5.5" fill="url(#lianjinCFace)"/>
      <!-- 劍護手 -->
      <line x1="54" y1="136" x2="44" y2="132" stroke="#333" stroke-width="4" stroke-linecap="round"/>
      <!-- 劍柄 -->
      <line x1="48" y1="130" x2="46" y2="124" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="45" cy="122" r="2.5" fill="#333"/>
      <!-- 劍身（直插地面） -->
      <line x1="50" y1="138" x2="52" y2="192" stroke="url(#lianjinCBlade)" stroke-width="4" stroke-linecap="round"/>
      <line x1="51" y1="140" x2="53" y2="190" stroke="#e0e8f0" stroke-width="1" opacity="0.3"/>
      <!-- 劍插入地面效果 -->
      <ellipse cx="52" cy="192" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>

      <!-- 汗滴（多顆） -->
      <path d="M-22,86 C-23,90 -22,96 -21,99" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-21" cy="100" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M20,88 C21,92 20,96" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="20" cy="97" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-10" cy="78" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>