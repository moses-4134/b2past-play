<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 趙嵬府 — 吉卜力風格：紫黑漆金、奢靡陰森、權臣宅邸（別於中性 bgMansion） -->
  <defs>
    <linearGradient id="zmBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1424"/>
      <stop offset="55%" stop-color="#261a30"/>
      <stop offset="100%" stop-color="#1a1220"/>
    </linearGradient>
    <linearGradient id="zmWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2038"/>
      <stop offset="100%" stop-color="#221630"/>
    </linearGradient>
    <linearGradient id="zmFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2030"/>
      <stop offset="100%" stop-color="#140e1c"/>
    </linearGradient>
    <linearGradient id="zmPillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1c34"/>
      <stop offset="40%" stop-color="#4a3050"/>
      <stop offset="100%" stop-color="#2a1c34"/>
    </linearGradient>
    <radialGradient id="zmLamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0b040" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#a06020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#zmBg)"/>
  <!-- 後牆 -->
  <rect x="0" y="0" width="960" height="200" fill="url(#zmWall)" opacity="0.92"/>
  <!-- 牆上金雲雷紋 -->
  <g stroke="#c8a040" stroke-width="1.2" opacity="0.28" fill="none">
    <path d="M40,40 h30 v14 h-16 v-8 h-8"/><path d="M120,40 h30 v14 h-16 v-8 h-8"/>
    <path d="M810,40 h30 v14 h-16 v-8 h-8"/><path d="M890,40 h30 v14 h-16 v-8 h-8"/>
  </g>

  <!-- 立柱（紫漆描金） -->
  <g>
    <rect x="70" y="0" width="42" height="200" fill="url(#zmPillar)"/>
    <rect x="66" y="0" width="50" height="10" fill="#5a3c60"/>
    <line x1="91" y1="10" x2="91" y2="196" stroke="#c8a040" stroke-width="0.8" opacity="0.35"/>
    <rect x="848" y="0" width="42" height="200" fill="url(#zmPillar)"/>
    <rect x="844" y="0" width="50" height="10" fill="#5a3c60"/>
    <line x1="869" y1="10" x2="869" y2="196" stroke="#c8a040" stroke-width="0.8" opacity="0.35"/>
  </g>

  <!-- 中央主位（太師椅＋長案） -->
  <rect x="420" y="120" width="120" height="60" fill="#3a2842" rx="4"/>
  <rect x="412" y="110" width="136" height="16" fill="#4a3250" rx="4"/>
  <rect x="452" y="88" width="56" height="30" fill="#3a2842" rx="4"/>
  <rect x="458" y="84" width="44" height="8" fill="#c8a040" rx="3" opacity="0.5"/>
  <ellipse cx="480" cy="130" rx="170" ry="80" fill="url(#zmLamp)" opacity="0.6"/>

  <!-- 垂掛華幔（紫底金穗） -->
  <g fill="#4a2a52" opacity="0.85">
    <path d="M300,0 h80 v70 l-40,26 l-40,-26 z"/>
    <path d="M580,0 h80 v70 l-40,26 l-40,-26 z"/>
  </g>
  <g fill="#c8a040" opacity="0.5">
    <circle cx="340" cy="98" r="4"/><circle cx="620" cy="98" r="4"/>
  </g>

  <!-- 宮燈（奢靡雙燈） -->
  <circle cx="200" cy="140" r="46" fill="url(#zmLamp)"/>
  <rect x="192" y="96" width="16" height="14" fill="#5a3c1c" rx="2"/>
  <path d="M188,110 h24 l-4,30 h-16 z" fill="#a83838" opacity="0.55"/>
  <ellipse cx="200" cy="124" rx="5" ry="8" fill="#ffcc60" opacity="0.7"/>
  <circle cx="760" cy="140" r="46" fill="url(#zmLamp)"/>
  <rect x="752" y="96" width="16" height="14" fill="#5a3c1c" rx="2"/>
  <path d="M748,110 h24 l-4,30 h-16 z" fill="#a83838" opacity="0.55"/>
  <ellipse cx="760" cy="124" rx="5" ry="8" fill="#ffcc60" opacity="0.7"/>

  <!-- 地板 -->
  <rect x="0" y="200" width="960" height="340" fill="url(#zmFloor)"/>
  <g stroke="#3a2c44" stroke-width="1" opacity="0.25">
    <line x1="0" y1="250" x2="960" y2="250"/><line x1="0" y1="312" x2="960" y2="312"/><line x1="0" y1="388" x2="960" y2="388"/><line x1="0" y1="468" x2="960" y2="468"/>
  </g>
  <!-- 紫金地毯 -->
  <rect x="390" y="200" width="180" height="340" fill="#3a1c44" opacity="0.4"/>
  <line x1="390" y1="200" x2="390" y2="540" stroke="#c8a040" stroke-width="1" opacity="0.25"/>
  <line x1="570" y1="200" x2="570" y2="540" stroke="#c8a040" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="200" x2="960" y2="200" stroke="#0e0a14" stroke-width="3"/>

  <!-- 金塵（奢靡浮光） -->
  <circle cx="300" cy="110" r="1.2" fill="#e8c860" opacity="0.3"/>
  <circle cx="500" cy="80" r="1" fill="#f0d880" opacity="0.28"/>
  <circle cx="650" cy="130" r="1.2" fill="#e8c860" opacity="0.24"/>
  <circle cx="220" cy="180" r="1" fill="#e8c860" opacity="0.2"/>
  <rect width="960" height="540" fill="#6040a0" opacity="0.05"/>
</svg>
