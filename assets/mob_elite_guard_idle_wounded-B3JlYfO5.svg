<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙嵬親衛 — 受傷待機（HP 30~60%：身體前傾、劍下垂、單眼瞇、汗滴） -->
  <defs>
    <radialGradient id="mobEliteGuardWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc098"/>
      <stop offset="100%" stop-color="#c4a478"/>
    </radialGradient>
    <linearGradient id="mobEliteGuardWArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a2020"/>
      <stop offset="100%" stop-color="#3a1010"/>
    </linearGradient>
    <linearGradient id="mobEliteGuardWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1818"/>
      <stop offset="100%" stop-color="#1e0e0e"/>
    </linearGradient>
    <linearGradient id="mobEliteGuardWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="mobEliteGuardWHelmet" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#4a4040"/>
      <stop offset="100%" stop-color="#3a3030"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="32" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（重心偏移） ===== -->
      <ellipse cx="10" cy="186" rx="11" ry="17" fill="url(#mobEliteGuardWPants)" transform="rotate(-6,10,186)"/>
      <ellipse cx="7" cy="206" rx="12" ry="6" fill="#2a1210"/>
      <ellipse cx="-12" cy="183" rx="12" ry="18" fill="url(#mobEliteGuardWPants)" transform="rotate(8,-12,184)"/>
      <ellipse cx="-16" cy="206" rx="13" ry="6" fill="#2a1210"/>

      <!-- ===== 身體（前傾、壯碩） ===== -->
      <ellipse cx="-2" cy="148" rx="26" ry="28" fill="url(#mobEliteGuardWArmor)" transform="rotate(-8,-2,148)"/>

      <!-- 甲片紋路 -->
      <path d="M-12,144 L-9,158" fill="none" stroke="#2a0e0e" stroke-width="0.9" opacity="0.4"/>
      <path d="M6,148 L9,162" fill="none" stroke="#2a0e0e" stroke-width="0.8" opacity="0.35"/>

      <!-- 護肩 -->
      <ellipse cx="22" cy="136" rx="10" ry="6" fill="url(#mobEliteGuardWArmor)" stroke="#4a1818" stroke-width="0.8"/>
      <ellipse cx="-22" cy="136" rx="10" ry="6" fill="url(#mobEliteGuardWArmor)" stroke="#4a1818" stroke-width="0.8"/>

      <!-- 領口 -->
      <path d="M-14,136 L-6,148 L2,136" fill="none" stroke="#6a2828" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-28,180 Q-4,188 22,182" fill="none" stroke="#3a1818" stroke-width="5" stroke-linecap="round"/>
      <rect x="-7" y="178" width="8" height="8" rx="1" fill="#8a6830" stroke="#6a4820" stroke-width="0.5"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="98" rx="34" ry="36" fill="url(#mobEliteGuardWHair)"/>

      <!-- 臉 -->
      <path d="M-26,90 C-30,100 -28,114 -22,124 C-16,132 -6,136 2,134 C10,132 16,124 20,114 C24,102 22,90 16,82 C10,76 2,74 -4,76 C-14,78 -24,84 -26,90Z" fill="url(#mobEliteGuardWFace)"/>

      <!-- 短髮 -->
      <path d="M-16,80 C-12,66 4,58 16,62 C24,68 28,76 24,84 C20,78 14,72 6,70 C0,68 -8,70 -14,76" fill="url(#mobEliteGuardWHair)"/>

      <!-- 鐵盔 -->
      <path d="M-28,82 C-26,60 0,48 26,60 C30,66 30,78 28,84 Q0,72 -28,82Z" fill="url(#mobEliteGuardWHelmet)" stroke="#2a2020" stroke-width="0.8"/>
      <path d="M0,52 L0,78" fill="none" stroke="#4a3a3a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <path d="M-28,82 Q0,90 28,82" fill="none" stroke="#2a2020" stroke-width="2" stroke-linecap="round"/>

      <!-- 瀏海 -->
      <path d="M-24,90 C-28,82 -30,86 -30,92 C-28,96 -24,96 -24,92" fill="url(#mobEliteGuardWHair)"/>

      <!-- 側髮 -->
      <path d="M18,86 C24,80 26,88 24,96 C22,100 18,98 18,94" fill="url(#mobEliteGuardWHair)"/>

      <!-- 耳朵 -->
      <path d="M16,102 C20,98 22,104 20,110 C18,114 16,112 16,108" fill="url(#mobEliteGuardWFace)" stroke="#a08058" stroke-width="0.5"/>

      <!-- 腮紅 -->
      <ellipse cx="-20" cy="122" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- ===== 眼睛 ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-10" cy="108" rx="6" ry="3.5" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="3.8" ry="2.5" fill="#2a1010"/>
      <ellipse cx="-11.5" cy="108" rx="2.2" ry="1.5" fill="#180808"/>
      <circle cx="-13" cy="107" r="0.7" fill="#fff" opacity="0.45"/>

      <!-- 右眼（微睜） -->
      <ellipse cx="6" cy="108" rx="6" ry="5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.8" ry="3.5" fill="#2a1010"/>
      <ellipse cx="4.5" cy="108" rx="2.2" ry="2.2" fill="#180808"/>
      <circle cx="3" cy="106.5" r="0.8" fill="#fff" opacity="0.5"/>

      <!-- 眉間皺紋 -->
      <path d="M-3,100 C-1,98 1,98 3,100" fill="none" stroke="#a08058" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 眉毛 -->
      <path d="M-14,100 C-10,98 -8,100 -6,102" fill="none" stroke="#2a1a10" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M8,102 C10,100 12,98 16,100" fill="none" stroke="#2a1a10" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#a08058" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-10,128 C-6,129 0,129 4,128" fill="none" stroke="#704840" stroke-width="2" stroke-linecap="round"/>
      <path d="M-10,128 C-11,130 -12,131" fill="none" stroke="#704840" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴 -->
      <path d="M-22,88 C-23,92 -22,96 -21,98" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-21" cy="99" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>

      <!-- ===== 右手臂（持劍下垂） ===== -->
      <path d="M22,146 Q36,148 40,162" fill="none" stroke="url(#mobEliteGuardWArmor)" stroke-width="11" stroke-linecap="round"/>

      <!-- 劍（下垂） -->
      <path d="M41.0,158.1 L45.0,218.1 L47.0,224.0 L50.0,217.7 L44.0,157.9 Z" fill="#9a9a9a" stroke="#7a7a7a" stroke-width="0.6" stroke-linejoin="round"/>
      <line x1="43" y1="156" x2="47" y2="216" stroke="#ccc" stroke-width="0.8" opacity="0.3"/>
      <line x1="46" y1="162" x2="38" y2="158" stroke="#8a6830" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="40" y1="162" x2="38" y2="156" stroke="#4a3018" stroke-width="4" stroke-linecap="round"/>
      <circle cx="37" cy="154" r="2.5" fill="#8a6830"/>
      <circle cx="40" cy="162" r="5.5" fill="url(#mobEliteGuardWFace)"/>

      <!-- ===== 左手臂（按住傷口） ===== -->
      <path d="M-22,146 Q-34,154 -30,170" fill="none" stroke="url(#mobEliteGuardWArmor)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-30" cy="172" r="5" fill="url(#mobEliteGuardWFace)" opacity="0.85"/>

      <!-- 小盾（低垂） -->
      <ellipse cx="-36" cy="158" rx="7" ry="9" fill="#5a2020" stroke="#3a1010" stroke-width="1" transform="rotate(10,-36,158)"/>
    </g>
  </g>
</svg>
