<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 相里衍 — 吉卜力2頭身 側面朝左 協防（挺身護人） -->
  <defs>
    <radialGradient id="yuanFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8d0b8"/>
      <stop offset="100%" stop-color="#d0b090"/>
    </radialGradient>
    <linearGradient id="yuanRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#283050"/>
      <stop offset="100%" stop-color="#182038"/>
    </linearGradient>
    <linearGradient id="yuanPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="yuanHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="yuanSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e8f0"/>
      <stop offset="100%" stop-color="#a0a8b0"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="224" rx="30" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（挺身前踏，比防禦更直立） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="14" cy="196" rx="10" ry="18" fill="url(#yuanPants)" transform="rotate(-6,14,196)"/>
    <ellipse cx="12" cy="217" rx="11" ry="7" fill="#2a2018"/>
    <!-- 前腿（左腿，前踏護人） -->
    <ellipse cx="-16" cy="196" rx="10" ry="18" fill="url(#yuanPants)" transform="rotate(10,-16,196)"/>
    <ellipse cx="-20" cy="217" rx="11" ry="7" fill="#2a2018"/>

    <!-- ===== 身體（挺直，更直立的協防姿態） ===== -->
    <ellipse cx="-2" cy="157" rx="28" ry="30" fill="url(#yuanRobe)" transform="rotate(-2,-2,157)"/>

    <!-- 衣襟交叉 -->
    <path d="M-14,136 L-6,156 L4,136" fill="none" stroke="#506080" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-28,179 Q-2,187 24,179" fill="none" stroke="#3a3050" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-4" cy="183" rx="3.5" ry="3" fill="#706050"/>

    <!-- ===== 畫面右側手臂（角色左手，背在身後——宗師風範） ===== -->
    <path d="M20,144 Q32,150 28,164" fill="none" stroke="url(#yuanRobe)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
    <circle cx="28" cy="166" r="5.5" fill="url(#yuanFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，持劍前伸護人） ===== -->
    <path d="M-26,146 Q-48,136 -58,130" fill="none" stroke="url(#yuanRobe)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-58" cy="132" r="5.5" fill="url(#yuanFace)"/>

    <!-- ===== 劍（前伸橫擋，保護隊友，劍身50px） ===== -->
    <!-- 劍身（水平略斜向前） -->
    <line x1="-62" y1="124" x2="-110" y2="118" stroke="url(#yuanSteel)" stroke-width="4" stroke-linecap="round"/>
    <!-- 劍身亮線 -->
    <line x1="-62" y1="124" x2="-110" y2="118" stroke="#f0f4f8" stroke-width="1.5" opacity="0.4"/>
    <!-- 劍尖 -->
    <line x1="-110" y1="118" x2="-114" y2="117" stroke="#c8d0d8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 護手 -->
    <line x1="-60" y1="131" x2="-56" y2="123" stroke="#8a7848" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-56" y1="132" x2="-54" y2="138" stroke="#4a3828" stroke-width="4" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-53" cy="141" r="2.5" fill="#8a7848"/>

    <!-- ===== 大頭（沉穩注視，護人姿態） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="94" rx="40" ry="42" fill="url(#yuanHair)"/>

    <!-- 臉（瘦長臉） -->
    <path d="M-30,84 C-34,96 -34,114 -28,126 C-22,136 -10,140 0,138 C10,136 20,130 24,118 C28,106 26,90 20,82 C14,76 4,72 -6,74 C-18,76 -28,78 -30,84Z" fill="url(#yuanFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-20,76 C-16,56 0,48 14,52 C26,56 32,68 28,80 C24,74 16,66 8,64 C0,62 -10,64 -16,70" fill="url(#yuanHair)"/>

    <!-- 高髻 -->
    <ellipse cx="2" cy="50" rx="8" ry="10" fill="url(#yuanHair)"/>
    <path d="M-4,42 C0,34 4,34 6,42" fill="url(#yuanHair)"/>
    <!-- 髻帶 -->
    <ellipse cx="2" cy="56" rx="9" ry="2.5" fill="#3a3050"/>

    <!-- 短瀏海 -->
    <path d="M-28,84 C-32,74 -34,78 -34,84 C-32,88 -28,88 -28,86" fill="url(#yuanHair)"/>
    <path d="M-24,78 C-26,70 -30,72 -30,80 C-28,84 -24,84 -24,82" fill="#888888"/>

    <!-- 側髮 -->
    <path d="M22,82 C26,78 28,84 26,90 C24,94 22,92 22,88" fill="url(#yuanHair)"/>

    <!-- 耳朵 -->
    <path d="M20,100 C24,96 26,102 24,108 C22,112 20,110 20,106" fill="url(#yuanFace)" stroke="#c0a880" stroke-width="0.5"/>

    <!-- ===== 眼睛（堅定沉穩，護人決意） ===== -->
    <!-- 左眼 -->
    <ellipse cx="-12" cy="106" rx="7" ry="6" fill="#fff"/>
    <ellipse cx="-14" cy="107" rx="4.5" ry="4.5" fill="#201828"/>
    <ellipse cx="-14.5" cy="106" rx="2.5" ry="2.8" fill="#0c0810"/>
    <circle cx="-16" cy="104.5" r="1.4" fill="#fff" opacity="0.65"/>

    <!-- 右眼 -->
    <ellipse cx="4" cy="106" rx="7" ry="6" fill="#fff"/>
    <ellipse cx="2" cy="107" rx="4.5" ry="4.5" fill="#201828"/>
    <ellipse cx="1.5" cy="106" rx="2.5" ry="2.8" fill="#0c0810"/>
    <circle cx="0" cy="104.5" r="1.4" fill="#fff" opacity="0.65"/>

    <!-- 眉毛（微皺，堅定護人） -->
    <path d="M-19,100 C-15,98 -9,99" fill="none" stroke="#808080" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-2,100 C2,98 7,99" fill="none" stroke="#808080" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M-18,114 C-19,118 -17,122" fill="none" stroke="#c0a080" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 長山羊鬚 -->
    <path d="M-10,132 C-8,138 -6,146 -7,152" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-6,132 C-4,138 -3,146 -4,152" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-2,132 C0,138 0,146 -1,152" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 嘴巴（緊閉，沉穩） -->
    <path d="M-14,129 C-10,129 -4,129 0,129" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
