<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 腐吏惡卒 — 受傷待機（HP 30~60%：身體微傾、單手按腹、眼睛半瞇、槍下垂） -->
  <defs>
    <radialGradient id="mobSoldierWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c0a470"/>
    </radialGradient>
    <linearGradient id="mobSoldierWCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a5048"/>
      <stop offset="100%" stop-color="#3a3830"/>
    </linearGradient>
    <linearGradient id="mobSoldierWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3830"/>
      <stop offset="100%" stop-color="#2a2820"/>
    </linearGradient>
    <linearGradient id="mobSoldierWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobSoldierWSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <linearGradient id="mobSoldierWShield" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b88830"/>
      <stop offset="100%" stop-color="#785018"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="198" rx="24" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前腿微彎支撐） ===== -->
      <!-- 後腿 -->
      <ellipse cx="10" cy="178" rx="8" ry="15" fill="url(#mobSoldierWPants)" transform="rotate(-3,10,178)"/>
      <ellipse cx="8" cy="192" rx="9" ry="6" fill="#2a2418"/>
      <!-- 前腿（微彎） -->
      <ellipse cx="-10" cy="177" rx="9" ry="16" fill="url(#mobSoldierWPants)" transform="rotate(8,-10,177)"/>
      <ellipse cx="-13" cy="192" rx="10" ry="6" fill="#2a2418"/>

      <!-- ===== 身體（前傾） ===== -->
      <ellipse cx="-2" cy="146" rx="23" ry="25" fill="url(#mobSoldierWCloth)" transform="rotate(-8,-2,146)"/>

      <!-- 破舊軍服裂痕 -->
      <path d="M-8,136 L-5,146" fill="none" stroke="#2a2820" stroke-width="0.8" opacity="0.4"/>
      <path d="M6,140 L9,150" fill="none" stroke="#2a2820" stroke-width="0.7" opacity="0.3"/>
      <path d="M-14,150 L-10,158" fill="none" stroke="#2a2820" stroke-width="0.7" opacity="0.35"/>

      <!-- 領口 -->
      <path d="M-10,128 L-4,138 L4,128" fill="none" stroke="#4a4838" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-21,166 Q-2,172 19,166" fill="none" stroke="#3a3020" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 右手臂（角色左手，持盾下垂） ===== -->
      <path d="M16,134 Q28,146 24,158" fill="none" stroke="url(#mobSoldierWCloth)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="24" cy="158" r="4.5" fill="url(#mobSoldierWFace)" opacity="0.85"/>
      <!-- 盾牌（下垂） -->
      <ellipse cx="28" cy="158" rx="14" ry="16" fill="url(#mobSoldierWShield)" stroke="#3a2818" stroke-width="1"/>
      <line x1="28" y1="142" x2="28" y2="174" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <line x1="16" y1="158" x2="40" y2="158" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <circle cx="28" cy="158" r="3.5" fill="#806040" opacity="0.4"/>

      <!-- ===== 左手臂（角色右手，按住腹部傷口） ===== -->
      <path d="M-18,134 Q-26,148 -10,162" fill="none" stroke="url(#mobSoldierWCloth)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-10" cy="164" r="5" fill="url(#mobSoldierWFace)" opacity="0.85"/>

      <!-- ===== 槍（下垂無力，靠在身後） ===== -->
      <!-- 槍桿 -->
      <line x1="-36" y1="100" x2="-28" y2="180" stroke="#5a4028" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
      <!-- 槍頭 -->
      <path d="M-37.6,90 L-34.8,100.4 L-40.4,99.6 Z" fill="url(#mobSoldierWSteel)" stroke="#888" stroke-width="0.5" opacity="0.7"/>

      <!-- ===== 大頭（低頭） ===== -->
      <!-- 後腦髮 -->
      <ellipse cx="0" cy="100" rx="34" ry="36" fill="url(#mobSoldierWHair)"/>

      <!-- 臉 -->
      <path d="M-22,90 C-26,100 -24,112 -18,122 C-12,130 -4,134 4,132 C10,130 14,124 18,114 C22,102 20,90 14,82 C8,76 2,74 -4,76 C-12,78 -20,84 -22,90Z" fill="url(#mobSoldierWFace)"/>

      <!-- 腮紅（傷痛泛紅） -->
      <ellipse cx="-16" cy="122" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,80 C-12,62 4,54 16,58 C24,62 28,74 24,84 C20,76 14,70 6,68 C0,66 -8,68 -14,74" fill="url(#mobSoldierWHair)"/>

      <!-- 簡陋布帽 -->
      <path d="M-26,80 C-22,70 -8,64 8,66 C18,68 26,74 24,80" fill="#4a4038" stroke="#3a3028" stroke-width="0.5"/>
      <path d="M-28,80 C-28,78 -26,76 -22,78 L26,78 C28,78 28,82 26,82 L-26,82 C-28,82 -28,80 -28,80Z" fill="#4a4038" stroke="#3a3028" stroke-width="0.5"/>

      <!-- 瀏海 -->
      <path d="M-22,84 C-26,78 -28,82 -28,88 C-26,92 -22,90 -22,86" fill="url(#mobSoldierWHair)"/>
      <path d="M-18,82 C-20,76 -24,78 -24,86 C-22,90 -18,88 -18,84" fill="url(#mobSoldierWHair)" opacity="0.9"/>

      <!-- 側髮 -->
      <path d="M18,86 C24,80 26,88 24,96 C22,100 18,98 18,94" fill="url(#mobSoldierWHair)"/>

      <!-- 耳朵 -->
      <path d="M16,104 C20,100 22,106 20,112 C18,116 16,114 16,110" fill="url(#mobSoldierWFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（左眼半瞇忍痛、右眼微睜） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-10" cy="108" rx="6" ry="4" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="3.5" ry="2.8" fill="#383830"/>
      <ellipse cx="-11.5" cy="108" rx="2" ry="1.8" fill="#1a1810"/>
      <circle cx="-13" cy="107" r="0.8" fill="#fff" opacity="0.45"/>

      <!-- 右眼（微瞇但還睜著） -->
      <ellipse cx="6" cy="108" rx="6" ry="5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.5" ry="3.5" fill="#383830"/>
      <ellipse cx="4.5" cy="108" rx="2" ry="2" fill="#1a1810"/>
      <circle cx="3" cy="107" r="0.8" fill="#fff" opacity="0.45"/>

      <!-- 眉間皺紋（忍痛） -->
      <path d="M-3,102 C-2,100 0,100 1,102" fill="none" stroke="#b09060" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 眉毛（皺眉） -->
      <path d="M-14,102 C-10,100 -8,102 -6,104" fill="none" stroke="#2a2420" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M8,104 C10,102 12,100 16,102" fill="none" stroke="#2a2420" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#a08858" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-8,128 C-4,129 2,129 6,128" fill="none" stroke="#704840" stroke-width="2" stroke-linecap="round"/>
      <path d="M-8,128 C-9,130 -10,131" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴（額頭） -->
      <path d="M-20,88 C-21,92 -20,96 -19,98" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-19" cy="99" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
    </g>
  </g>
</svg>