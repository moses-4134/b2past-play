<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 蔡璋 — 吉卜力2頭身 面朝右（敵方）技能（心蛛暗術，操控暗氣） -->
  <defs>
    <radialGradient id="dubiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0d0c0"/>
      <stop offset="100%" stop-color="#d0c0a8"/>
    </radialGradient>
    <linearGradient id="dubiRobe" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0c0c18"/>
    </linearGradient>
    <linearGradient id="dubiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="dubiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
    <radialGradient id="dubiSkillGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6080a0" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#405870" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#304060" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-8" cy="225" rx="30" ry="6" fill="#000" opacity="0.15"/>

      <!-- ===== 腿（站穩施術） ===== -->
      <ellipse cx="10" cy="200" rx="9" ry="16" fill="url(#dubiPants)" transform="rotate(-5,10,200)"/>
      <ellipse cx="9" cy="216" rx="10" ry="6" fill="#1a1a20"/>
      <ellipse cx="-12" cy="198" rx="10" ry="17" fill="url(#dubiPants)" transform="rotate(3,-12,198)"/>
      <ellipse cx="-14" cy="216" rx="11" ry="6" fill="#1a1a20"/>

      <!-- ===== 身體（微前傾控制） ===== -->
      <ellipse cx="-4" cy="158" rx="26" ry="30" fill="url(#dubiRobe)" transform="rotate(-5,-4,158)"/>

      <!-- 內袍領口 -->
      <path d="M-14,134 L-6,150 L4,134" fill="none" stroke="#4a1a1a" stroke-width="3" stroke-linejoin="round"/>

      <!-- 衣褶 -->
      <path d="M-10,148 L-8,168" fill="none" stroke="#0a0a14" stroke-width="0.8" opacity="0.5"/>
      <path d="M4,146 L6,164" fill="none" stroke="#0a0a14" stroke-width="0.8" opacity="0.4"/>

      <!-- 銅腰帶 -->
      <path d="M-28,178 Q-4,186 20,178" fill="none" stroke="#8a7030" stroke-width="5" stroke-linecap="round"/>
      <rect x="-8" y="176" width="7" height="7" rx="1" fill="#8a7030" stroke="#6a5020" stroke-width="0.5"/>

      <!-- ===== 畫面左側手臂（角色右手，前伸操控暗氣） ===== -->
      <path d="M-22,144 Q-40,132 -50,126" fill="none" stroke="url(#dubiRobe)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-50" cy="128" r="5" fill="url(#dubiFace)"/>
      <!-- 手指伸出操控 -->
      <line x1="-50" y1="126" x2="-56" y2="120" stroke="url(#dubiFace)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <line x1="-50" y1="124" x2="-54" y2="118" stroke="url(#dubiFace)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- ===== 畫面右側手臂（角色左手，輔助施術） ===== -->
      <path d="M24,144 Q34,134 40,128" fill="none" stroke="url(#dubiRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="40" cy="130" r="4.5" fill="url(#dubiFace)" opacity="0.85"/>

      <!-- 袖口暗色 -->
      <path d="M-46,122 Q-50,126 -46,130" fill="none" stroke="#101020" stroke-width="1.5" opacity="0.5"/>
      <path d="M38,124 Q40,128 38,132" fill="none" stroke="#101020" stroke-width="1.5" opacity="0.5"/>

      <!-- ===== 暗氣光球（掌心前方，冷灰藍色操控能量） ===== -->
      <ellipse cx="-48" cy="110" rx="18" ry="16" fill="url(#dubiSkillGlow)"/>
      <ellipse cx="-48" cy="110" rx="8" ry="7" fill="#6080a0" opacity="0.2"/>
      <!-- 蛛網暗紋 -->
      <line x1="-58" y1="104" x2="-38" y2="116" stroke="#8090a0" stroke-width="0.5" opacity="0.3"/>
      <line x1="-56" y1="116" x2="-40" y2="104" stroke="#8090a0" stroke-width="0.5" opacity="0.3"/>
      <line x1="-48" y1="98" x2="-48" y2="122" stroke="#8090a0" stroke-width="0.4" opacity="0.25"/>
      <line x1="-60" y1="110" x2="-36" y2="110" stroke="#8090a0" stroke-width="0.4" opacity="0.25"/>
      <!-- 粒子 -->
      <circle cx="-56" cy="104" r="1.2" fill="#8090a0" opacity="0.4"/>
      <circle cx="-40" cy="106" r="1" fill="#6080a0" opacity="0.35"/>
      <circle cx="-52" cy="118" r="0.8" fill="#8090a0" opacity="0.3"/>

      <!-- ===== 大頭（殘忍微笑，施術表情） ===== -->
      <ellipse cx="0" cy="92" rx="38" ry="40" fill="url(#dubiHair)"/>

      <!-- 臉 -->
      <path d="M-30,86 C-34,98 -32,116 -26,128 C-20,136 -6,140 2,138 C12,136 22,128 26,116 C30,104 28,90 22,82 C16,76 4,72 -4,74 C-18,76 -28,80 -30,86Z" fill="url(#dubiFace)"/>

      <!-- 黑眼圈 -->
      <ellipse cx="-12" cy="110" rx="8" ry="4" fill="#c0b098" opacity="0.35"/>
      <ellipse cx="8" cy="110" rx="8" ry="4" fill="#c0b098" opacity="0.35"/>

      <!-- 官帽 -->
      <rect x="-24" y="58" width="44" height="14" rx="2" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="0.5"/>
      <rect x="-20" y="52" width="36" height="8" rx="1" fill="#0c0c0c"/>
      <path d="M-24,64 L-38,60 L-36,66 Z" fill="#0a0a0a"/>
      <path d="M20,64 L34,60 L32,66 Z" fill="#0a0a0a"/>

      <!-- 頭髮 -->
      <path d="M-20,76 C-16,64 0,58 14,62 C24,66 28,76 26,82 C22,76 14,72 6,70 C-2,68 -12,70 -18,74" fill="url(#dubiHair)"/>
      <path d="M22,84 C26,80 28,88 26,96 C24,102 22,98 22,94" fill="url(#dubiHair)"/>

      <!-- 耳朵 -->
      <path d="M22,100 C26,96 28,102 26,110 C24,114 22,112 22,106" fill="url(#dubiFace)" stroke="#b0a088" stroke-width="0.5"/>

      <!-- ===== 眼（極度瞇眼，殘忍操控） ===== -->
      <ellipse cx="-12" cy="107" rx="6" ry="2.5" fill="#fff"/>
      <ellipse cx="-13" cy="107" rx="3.5" ry="2" fill="#2a1a10"/>
      <ellipse cx="-13.5" cy="107" rx="2" ry="1.5" fill="#0a0400"/>
      <circle cx="-15" cy="106" r="1" fill="#fff" opacity="0.5"/>

      <ellipse cx="8" cy="107" rx="6" ry="2.5" fill="#fff"/>
      <ellipse cx="7" cy="107" rx="3.5" ry="2" fill="#2a1a10"/>
      <ellipse cx="6.5" cy="107" rx="2" ry="1.5" fill="#0a0400"/>
      <circle cx="5" cy="106" r="1" fill="#fff" opacity="0.5"/>

      <!-- 薄眉（下壓陰險） -->
      <path d="M-18,102 C-14,100 -10,101 -8,103" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M12,103 C14,101 18,100 20,102" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-6,112 C-8,118 -4,122" fill="none" stroke="#b0a080" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（殘忍微笑） -->
      <path d="M-10,130 C-6,134 0,135 6,132" fill="none" stroke="#705040" stroke-width="2" stroke-linecap="round"/>
      <path d="M-6,131 C-2,133 2,133 4,132" fill="none" stroke="#e8e0d0" stroke-width="1" opacity="0.5"/>

      <!-- 山羊鬍 -->
      <line x1="-4" y1="136" x2="-5" y2="142" stroke="#2a2a2a" stroke-width="0.8" opacity="0.5"/>
      <line x1="-2" y1="136" x2="-2" y2="143" stroke="#2a2a2a" stroke-width="0.8" opacity="0.6"/>
      <line x1="0" y1="136" x2="1" y2="142" stroke="#2a2a2a" stroke-width="0.8" opacity="0.5"/>
    </g>
  </g>
</svg>