<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 相里衍 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體微傾、劍下垂、半瞇眼、按傷口） -->
  <defs>
    <radialGradient id="yuanFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8d0b8"/>
      <stop offset="100%" stop-color="#d0b090"/>
    </radialGradient>
    <linearGradient id="yuanRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#283050"/>
      <stop offset="100%" stop-color="#182038"/>
    </linearGradient>
    <linearGradient id="yuanPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="yuanHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="yuanSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e8f0"/>
      <stop offset="100%" stop-color="#a0a8b0"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="224" rx="29" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（站穩但重心偏移） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="12" cy="202" rx="10" ry="17" fill="url(#yuanPants)" transform="rotate(-5,12,202)"/>
    <ellipse cx="10" cy="218" rx="11" ry="7" fill="#2a2018"/>
    <!-- 前腿（左腿，微彎支撐） -->
    <ellipse cx="-14" cy="200" rx="10" ry="17" fill="url(#yuanPants)" transform="rotate(7,-14,200)"/>
    <ellipse cx="-17" cy="218" rx="11" ry="7" fill="#2a2018"/>

    <!-- ===== 身體（前傾，但仍保持武者尊嚴） ===== -->
    <ellipse cx="-2" cy="164" rx="28" ry="30" fill="url(#yuanRobe)" transform="rotate(-8,-2,164)"/>

    <!-- 衣襟交叉 -->
    <path d="M-16,142 L-8,160 L2,142" fill="none" stroke="#506080" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-28,184 Q-2,192 24,185" fill="none" stroke="#3a3050" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-4" cy="188" rx="3.5" ry="3" fill="#706050"/>

    <!-- ===== 畫面右側手臂（角色左手）按住腹部傷口 ===== -->
    <path d="M20,150 Q26,164 14,178" fill="none" stroke="url(#yuanRobe)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
    <circle cx="14" cy="180" r="5.5" fill="url(#yuanFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，持劍下垂） ===== -->
    <path d="M-26,152 Q-44,162 -52,176" fill="none" stroke="url(#yuanRobe)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-52" cy="178" r="5.5" fill="url(#yuanFace)"/>

    <!-- ===== 劍（下垂，指向地面方向） ===== -->
    <!-- 劍身 -->
    <line x1="-51" y1="180" x2="-46" y2="230" stroke="url(#yuanSteel)" stroke-width="4" stroke-linecap="round"/>
    <!-- 劍身亮線 -->
    <line x1="-51" y1="180" x2="-46" y2="230" stroke="#f0f4f8" stroke-width="1.5" opacity="0.4"/>
    <!-- 劍尖 -->
    <line x1="-46" y1="230" x2="-45.5" y2="236" stroke="#c8d0d8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 護手 -->
    <line x1="-58" y1="177" x2="-48" y2="175" stroke="#8a7848" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-52" y1="175" x2="-54" y2="169" stroke="#4a3828" stroke-width="4" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-54" cy="167" r="2.5" fill="#8a7848"/>

    <!-- ===== 大頭（微低頭，仍威嚴） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="98" rx="40" ry="42" fill="url(#yuanHair)"/>

    <!-- 臉（瘦長臉，微低頭） -->
    <path d="M-30,88 C-34,100 -34,118 -28,130 C-22,140 -10,144 0,142 C10,140 20,134 24,122 C28,110 26,94 20,86 C14,80 4,76 -6,78 C-18,80 -28,82 -30,88Z" fill="url(#yuanFace)"/>

    <!-- 頭髮頂部（銀白短髮） -->
    <path d="M-20,80 C-16,60 0,52 14,56 C26,60 32,72 28,84 C24,78 16,70 8,68 C0,66 -10,68 -16,74" fill="url(#yuanHair)"/>

    <!-- 高髻 -->
    <ellipse cx="2" cy="54" rx="8" ry="10" fill="url(#yuanHair)"/>
    <path d="M-4,46 C0,38 4,38 6,46" fill="url(#yuanHair)"/>
    <!-- 髻帶 -->
    <ellipse cx="2" cy="60" rx="9" ry="2.5" fill="#3a3050"/>

    <!-- 短瀏海 -->
    <path d="M-28,88 C-32,78 -34,82 -34,88 C-32,92 -28,92 -28,90" fill="url(#yuanHair)"/>
    <path d="M-24,82 C-26,74 -30,76 -30,84 C-28,88 -24,88 -24,86" fill="#888888"/>

    <!-- 側髮 -->
    <path d="M22,86 C26,82 28,88 26,94 C24,98 22,96 22,92" fill="url(#yuanHair)"/>

    <!-- 耳朵 -->
    <path d="M20,104 C24,100 26,106 24,112 C22,116 20,114 20,110" fill="url(#yuanFace)" stroke="#c0a880" stroke-width="0.5"/>

    <!-- ===== 眼睛（左眼半瞇、右眼微睜，7x6尺寸調整） ===== -->
    <!-- 左眼（半瞇） -->
    <ellipse cx="-12" cy="110" rx="7" ry="3.5" fill="#fff"/>
    <ellipse cx="-13" cy="111" rx="4.5" ry="2.8" fill="#201828"/>
    <ellipse cx="-13.5" cy="110" rx="2.5" ry="1.8" fill="#0c0810"/>
    <circle cx="-15" cy="109" r="1.2" fill="#fff" opacity="0.6"/>

    <!-- 右眼（微瞇但還睜著） -->
    <ellipse cx="4" cy="110" rx="7" ry="5" fill="#fff"/>
    <ellipse cx="3" cy="111" rx="4.5" ry="3.8" fill="#201828"/>
    <ellipse cx="2.5" cy="110" rx="2.5" ry="2.3" fill="#0c0810"/>
    <circle cx="1" cy="108.5" r="1.4" fill="#fff" opacity="0.6"/>

    <!-- 眉間皺紋 -->
    <path d="M-5,104 C-4,102 -2,102 -1,104" fill="none" stroke="#c0a080" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- 鼻子 -->
    <path d="M-18,118 C-19,122 -17,126" fill="none" stroke="#c0a080" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 長山羊鬚 -->
    <path d="M-10,136 C-8,142 -6,150 -7,156" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-6,136 C-4,142 -3,150 -4,156" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-2,136 C0,142 0,150 -1,156" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 嘴巴（緊閉忍痛，微下彎） -->
    <path d="M-14,133 C-10,133 -4,133 0,133" fill="none" stroke="#906050" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-14,133 C-15,135 -16,136" fill="none" stroke="#906050" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- 汗滴（額頭） -->
    <path d="M-24,94 C-25,98 -24,102 -23,105" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-23" cy="106" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
  </g>
</svg>