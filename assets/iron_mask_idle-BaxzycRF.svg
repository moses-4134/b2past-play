<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 鐵面 — 吉卜力2頭身 面朝右（敵方）戰鬥待機：大刀扛肩 -->
  <defs>
    <radialGradient id="ironMaskFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b880"/>
      <stop offset="100%" stop-color="#c09868"/>
    </radialGradient>
    <linearGradient id="ironMaskArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#2a1c10"/>
    </linearGradient>
    <linearGradient id="ironMaskPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="ironMaskMask" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#5a5a62"/>
      <stop offset="100%" stop-color="#4a4a50"/>
    </linearGradient>
    <linearGradient id="ironMaskBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aaa"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <linearGradient id="ironMaskHair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#3a2a18"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="32" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿 ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="200" rx="12" ry="18" fill="url(#ironMaskPants)" transform="rotate(-3,12,200)"/>
      <ellipse cx="10" cy="218" rx="13" ry="7" fill="#2a1c10"/>
      <!-- 前腿 -->
      <ellipse cx="-14" cy="198" rx="13" ry="19" fill="url(#ironMaskPants)" transform="rotate(3,-14,198)"/>
      <ellipse cx="-16" cy="218" rx="14" ry="7" fill="#2a1c10"/>

      <!-- ===== 身體（壯碩） ===== -->
      <ellipse cx="-2" cy="160" rx="30" ry="32" fill="url(#ironMaskArmor)" transform="rotate(-2,-2,160)"/>

      <!-- 皮甲金屬鉚釘 -->
      <circle cx="-14" cy="150" r="2" fill="#6a6a70" stroke="#4a4a50" stroke-width="0.5"/>
      <circle cx="-8" cy="158" r="2" fill="#6a6a70" stroke="#4a4a50" stroke-width="0.5"/>
      <circle cx="4" cy="150" r="2" fill="#6a6a70" stroke="#4a4a50" stroke-width="0.5"/>
      <circle cx="10" cy="158" r="2" fill="#6a6a70" stroke="#4a4a50" stroke-width="0.5"/>
      <circle cx="-2" cy="145" r="2" fill="#6a6a70" stroke="#4a4a50" stroke-width="0.5"/>

      <!-- 皮甲裂痕紋路 -->
      <path d="M-10,152 L-6,166" fill="none" stroke="#1a1008" stroke-width="1" opacity="0.3"/>
      <path d="M8,155 L12,170" fill="none" stroke="#1a1008" stroke-width="0.8" opacity="0.25"/>

      <!-- 毛皮護肩（左） -->
      <ellipse cx="-28" cy="138" rx="12" ry="8" fill="#5a4028" stroke="#4a3018" stroke-width="0.8"/>
      <path d="M-36,134 L-32,140 M-34,132 L-30,138 M-38,136 L-34,142" fill="none" stroke="#3a2818" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <!-- 毛皮護肩（右） -->
      <ellipse cx="24" cy="138" rx="12" ry="8" fill="#5a4028" stroke="#4a3018" stroke-width="0.8"/>
      <path d="M30,134 L26,140 M32,132 L28,138 M34,136 L30,142" fill="none" stroke="#3a2818" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

      <!-- 領口 -->
      <path d="M-14,137 L-4,152 L6,137" fill="none" stroke="#4a3820" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-30,186 Q-2,194 26,186" fill="none" stroke="#3a2818" stroke-width="6" stroke-linecap="round"/>
      <rect x="-8" y="184" width="10" height="10" rx="1.5" fill="#8a6830" stroke="#6a4820" stroke-width="0.5"/>

      <!-- ===== 大頭 ===== -->
      <!-- 蓬亂後髮 -->
      <ellipse cx="0" cy="94" rx="40" ry="42" fill="url(#ironMaskHair)"/>

      <!-- 蓬亂頭髮突出 -->
      <path d="M-30,72 C-36,60 -40,66 -38,78" fill="url(#ironMaskHair)" opacity="0.9"/>
      <path d="M-24,66 C-28,54 -34,58 -30,72" fill="url(#ironMaskHair)" opacity="0.85"/>
      <path d="M-18,62 C-20,48 -26,52 -22,66" fill="url(#ironMaskHair)" opacity="0.8"/>
      <path d="M26,76 C32,66 36,72 32,84" fill="url(#ironMaskHair)" opacity="0.85"/>
      <path d="M30,70 C36,58 40,64 34,78" fill="url(#ironMaskHair)" opacity="0.8"/>
      <!-- 側髮 -->
      <path d="M24,88 C30,82 34,90 30,100 C28,106 24,102 24,96" fill="url(#ironMaskHair)"/>
      <path d="M28,98 C34,94 36,104 32,114 C30,118 26,114 26,108" fill="url(#ironMaskHair)" opacity="0.8"/>

      <!-- 臉（方正凶悍） -->
      <path d="M-28,90 C-32,102 -30,118 -24,128 C-18,136 -6,140 4,138 C14,136 22,128 26,118 C30,106 28,92 22,84 C16,78 4,76 -4,78 C-16,80 -26,84 -28,90Z" fill="url(#ironMaskFace)"/>

      <!-- 鐵面具（覆蓋上半臉） -->
      <path d="M-26,86 C-28,82 -22,76 -14,74 L10,74 C18,76 24,82 22,86 L22,108 C22,112 16,114 8,114 L-14,114 C-22,114 -26,112 -26,108 Z" fill="url(#ironMaskMask)" stroke="#3a3a40" stroke-width="1"/>
      <!-- 面具眼孔 -->
      <path d="M-16,96 L-4,96 L-4,106 L-16,106 Z" fill="#1a1a20" rx="1"/>
      <path d="M2,96 L14,96 L14,106 L2,106 Z" fill="#1a1a20" rx="1"/>
      <!-- 面具鉚釘裝飾 -->
      <circle cx="-20" cy="90" r="1.5" fill="#7a7a82"/>
      <circle cx="16" cy="90" r="1.5" fill="#7a7a82"/>
      <circle cx="-20" cy="110" r="1.5" fill="#7a7a82"/>
      <circle cx="16" cy="110" r="1.5" fill="#7a7a82"/>
      <!-- 面具中線 -->
      <line x1="-2" y1="76" x2="-2" y2="114" stroke="#5a5a62" stroke-width="1.5" opacity="0.5"/>

      <!-- 耳朵 -->
      <path d="M20,102 C24,98 26,104 24,112 C22,116 20,114 20,108" fill="url(#ironMaskFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- 眼睛（透過面具眼孔看出，凶狠） -->
      <ellipse cx="-10" cy="101" rx="5" ry="4" fill="#fff"/>
      <ellipse cx="-11" cy="102" rx="3" ry="3.5" fill="#301410"/>
      <ellipse cx="-11.5" cy="101" rx="1.8" ry="2" fill="#180808"/>
      <circle cx="-13" cy="100" r="1" fill="#fff" opacity="0.6"/>

      <ellipse cx="8" cy="101" rx="5" ry="4" fill="#fff"/>
      <ellipse cx="7" cy="102" rx="3" ry="3.5" fill="#301410"/>
      <ellipse cx="6.5" cy="101" rx="1.8" ry="2" fill="#180808"/>
      <circle cx="5" cy="100" r="1" fill="#fff" opacity="0.6"/>

      <!-- 鼻子（面具下方露出） -->
      <path d="M-12,118 C-14,122 -10,126" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 下巴鬍渣 -->
      <path d="M-16,132 C-10,133 -4,133 0,133 C6,133 10,132 14,131" fill="none" stroke="#5a4a38" stroke-width="0.8" opacity="0.4" stroke-dasharray="1,1.5"/>
      <path d="M-14,135 C-8,136 -2,136 4,136 C8,135 12,134" fill="none" stroke="#5a4a38" stroke-width="0.7" opacity="0.3" stroke-dasharray="1,1.5"/>

      <!-- 下巴疤痕 -->
      <path d="M2,126 L6,134" fill="none" stroke="#a08060" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

      <!-- 嘴巴（嚴肅） -->
      <path d="M-10,130 C-6,131 0,131 6,130" fill="none" stroke="#704840" stroke-width="2" stroke-linecap="round"/>

      <!-- ===== 左手臂（負x，空手握拳） ===== -->
      <path d="M-24,148 Q-38,156 -40,170" fill="none" stroke="url(#ironMaskArmor)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-40" cy="172" r="6" fill="url(#ironMaskFace)" opacity="0.85"/>

      <!-- ===== 右手臂（正x，大刀扛肩） ===== -->
      <path d="M26,148 Q40,140 46,130" fill="none" stroke="url(#ironMaskArmor)" stroke-width="13" stroke-linecap="round"/>

      <!-- ===== 大刀（扛在正x肩上） ===== -->
      <!-- 刀身（填充形狀：窄底寬頂斜角刀尖） -->
      <path d="M44,124 L38,76 L34,70 L28,74 Q36,94 42,126 Z" fill="url(#ironMaskBlade)" stroke="#666" stroke-width="0.5"/>
      <!-- 刀背厚線 -->
      <line x1="44" y1="124" x2="38" y2="76" stroke="#888" stroke-width="2" stroke-linecap="round"/>
      <!-- 刀尖斜角切面 -->
      <line x1="34" y1="70" x2="28" y2="74" stroke="#777" stroke-width="1"/>
      <!-- 刀刃弧線亮線 -->
      <path d="M42,126 Q36,94 28,74" fill="none" stroke="#ccc" stroke-width="0.8" opacity="0.3"/>
      <!-- 刀護手 -->
      <line x1="48" y1="128" x2="40" y2="124" stroke="#806030" stroke-width="4" stroke-linecap="round"/>
      <!-- 刀柄 -->
      <line x1="46" y1="128" x2="48" y2="136" stroke="#4a3520" stroke-width="5" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="49" cy="138" r="3" fill="#806030"/>
      <!-- 握刀的手 -->
      <circle cx="46" cy="130" r="6.5" fill="url(#ironMaskFace)"/>
    </g>
  </g>
</svg>