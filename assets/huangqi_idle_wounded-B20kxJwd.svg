<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 黃旗 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體微傾、暗器下垂、單眼半瞇、咬牙、汗滴） -->
  <defs>
    <radialGradient id="hqwFace" cx="40%" cy="35%" r="55%"><stop offset="0%" stop-color="#e0c8a8"/><stop offset="100%" stop-color="#c8b088"/></radialGradient>
    <linearGradient id="hqwOutfit" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#4a4038"/><stop offset="100%" stop-color="#2a2420"/></linearGradient>
    <linearGradient id="hqwPants" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a3428"/><stop offset="100%" stop-color="#1a1810"/></linearGradient>
    <linearGradient id="hqwHair" x1="0.2" y1="0" x2="0.7" y2="1"><stop offset="0%" stop-color="#2a2018"/><stop offset="100%" stop-color="#141010"/></linearGradient>
  </defs>
  <g transform="translate(130, 14)">
    <ellipse cx="-4" cy="202" rx="24" ry="5" fill="#000" opacity="0.1"/>
    <!-- 腿（重心偏移） -->
    <ellipse cx="8" cy="184" rx="7" ry="13" fill="url(#hqwPants)" transform="rotate(-3,8,192)"/>
    <ellipse cx="6" cy="196" rx="8" ry="5.5" fill="#2a2018"/>
    <ellipse cx="-12" cy="182" rx="8" ry="14" fill="url(#hqwPants)" transform="rotate(10,-12,190)"/>
    <ellipse cx="-14" cy="196" rx="9" ry="5.5" fill="#2a2018"/>
    <!-- 身體（前傾佝僂更深） -->
    <ellipse cx="-2" cy="150" rx="22" ry="24" fill="url(#hqwOutfit)" transform="rotate(-12,-2,160)"/>
    <!-- 破繩腰帶 -->
    <path d="M-20,164 Q-2,170 16,164" fill="none" stroke="#3a2818" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 破領口 -->
    <path d="M-8,128 L-3,138 L4,128" fill="none" stroke="#5a4838" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 角色左手（按住腹部） -->
    <path d="M16,134 Q24,156 16,168" fill="none" stroke="url(#hqwOutfit)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <circle cx="16" cy="170" r="4" fill="url(#hqwFace)" opacity="0.85"/>
    <!-- 角色右手（暗器下垂） -->
    <path d="M-20,136 Q-34,146 -38,156" fill="none" stroke="url(#hqwOutfit)" stroke-width="8" stroke-linecap="round"/>

    <!-- 大頭（微低頭） -->
    <ellipse cx="0" cy="94" rx="34" ry="36" fill="url(#hqwHair)"/>
    <!-- 臉 -->
    <path d="M-22,88 C-26,96 -24,112 -18,122 C-12,130 -4,134 4,132 C10,130 14,124 18,114 C22,102 20,90 14,84 C8,78 2,76 -4,78 C-12,80 -20,84 -22,88Z" fill="url(#hqwFace)"/>
    <!-- 腮紅（傷痛） -->
    <ellipse cx="-16" cy="120" rx="5" ry="3" fill="#e0a0a0" opacity="0.3"/>
    <!-- 髮頂 -->
    <path d="M-14,80 C-10,64 4,56 14,60 C22,64 26,72 22,80 C18,74 10,68 4,66 C-4,64 -10,68 -12,76" fill="url(#hqwHair)"/>
    <!-- 破頭巾 -->
    <path d="M-24,84 C-18,76 0,74 18,78 C22,80 24,82" fill="none" stroke="#4a3828" stroke-width="3" stroke-linecap="round"/>
    <path d="M24,82 C26,88 26,96 24,104" fill="none" stroke="#4a3828" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <!-- 碎髮 -->
    <path d="M-24,88 C-28,78 -30,82 -32,88 C-30,92 -26,92 -24,88" fill="url(#hqwHair)"/>
    <path d="M-20,84 C-22,76 -26,78 -26,86 C-24,90 -20,88 -20,84" fill="#2a2018"/>
    <!-- 側髮 -->
    <path d="M20,84 C24,78 26,86 24,96 C22,100 20,98 20,92" fill="url(#hqwHair)"/>
    <!-- 耳朵 -->
    <path d="M20,100 C24,96 26,102 24,108 C22,112 20,110 20,106" fill="url(#hqwFace)" stroke="#c8b088" stroke-width="0.5"/>
    <!-- 左眼（半瞇忍痛） -->
    <ellipse cx="-8" cy="106" rx="6.5" ry="3" fill="#fff"/>
    <ellipse cx="-9.5" cy="107" rx="3" ry="2.5" fill="#2a1808"/>
    <ellipse cx="-10" cy="106.5" rx="1.5" ry="1.5" fill="#0a0404"/>
    <circle cx="-11.5" cy="105.5" r="0.8" fill="#fff" opacity="0.6"/>
    <!-- 右眼（微睜） -->
    <ellipse cx="8" cy="106" rx="6.5" ry="5" fill="#fff"/>
    <ellipse cx="6.5" cy="107" rx="3" ry="3.5" fill="#2a1808"/>
    <ellipse cx="6" cy="106.5" rx="1.5" ry="2" fill="#0a0404"/>
    <circle cx="4.5" cy="105" r="1" fill="#fff" opacity="0.6"/>
    <!-- 眉間皺紋 -->
    <path d="M-2,100 C-1,98 1,98 2,100" fill="none" stroke="#c0a080" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    <!-- 斜吊眉（皺眉） -->
    <path d="M-14,99 C-11,95 -6,97 -2,100" fill="none" stroke="#2a2018" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M2,100 C6,95 12,97 15,99" fill="none" stroke="#2a2018" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 鼻子 -->
    <path d="M-10,114 C-12,118 -10,120 -8,119" fill="none" stroke="#c8b088" stroke-width="1" stroke-linecap="round"/>
    <!-- 嘴巴（咬牙忍痛） -->
    <path d="M-5,124 C-2,125 2,125 5,124" fill="none" stroke="#806048" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-5,124 C-6,126 -7,127" fill="none" stroke="#806048" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <!-- 疤痕 -->
    <line x1="6" y1="98" x2="12" y2="112" stroke="#a08868" stroke-width="0.8" opacity="0.4"/>

    <!-- 汗滴 -->
    <path d="M-20,90 C-21,94 -20,98 -19,100" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-19" cy="101" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>

    <!-- 暗器（下垂無力，最上層） -->
    <polygon points="-40,150 -44,156 -40,162 -36,156" fill="#999" stroke="#777" stroke-width="0.5"/>
    <circle cx="-40" cy="156" r="1.5" fill="#666"/>
    <circle cx="-38" cy="160" r="4" fill="url(#hqwFace)"/>
  </g>
</svg>