<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 「影子」孫五 — 吉卜力2頭身 側面朝左 技能（連環飛刀+煙霧） -->
  <defs>
    <radialGradient id="swFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8d8c0"/>
      <stop offset="100%" stop-color="#d0c0a0"/>
    </radialGradient>
    <linearGradient id="swOutfit" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2e2830"/>
      <stop offset="100%" stop-color="#1a1420"/>
    </linearGradient>
    <linearGradient id="swPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#28222a"/>
      <stop offset="100%" stop-color="#141018"/>
    </linearGradient>
    <linearGradient id="swHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1018"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <radialGradient id="swSmoke" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a898b0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#686078" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(130, 14)">
    <ellipse cx="-4" cy="207" rx="24" ry="5" fill="#000" opacity="0.1"/>

    <!-- 腿 -->
    <ellipse cx="8" cy="188" rx="7.5" ry="14" fill="url(#swPants)" transform="rotate(-5,8,188)"/>
    <ellipse cx="6" cy="202" rx="8.5" ry="5.5" fill="#1a1018"/>
    <ellipse cx="-12" cy="186" rx="8" ry="15" fill="url(#swPants)" transform="rotate(6,-12,186)"/>
    <ellipse cx="-14" cy="202" rx="9" ry="5.5" fill="#1a1018"/>

    <!-- 身體 -->
    <ellipse cx="-2" cy="158" rx="23" ry="25" fill="url(#swOutfit)" transform="rotate(-8,-2,158)"/>
    <path d="M-22,172 Q-2,179 18,172" fill="none" stroke="#3a2830" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10,136 L-4,148 L4,136" fill="none" stroke="#2e2830" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 右手（袖箭前伸） -->
    <path d="M16,142 Q32,128 40,122" fill="none" stroke="url(#swOutfit)" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
    <ellipse cx="40" cy="122" rx="5.5" ry="3.5" fill="#1a1420" transform="rotate(-10,40,122)"/>
    <circle cx="42" cy="122" r="4" fill="url(#swFace)" opacity="0.85"/>

    <!-- 左手（擲刀） -->
    <path d="M-22,140 Q-42,130 -52,126" fill="none" stroke="url(#swOutfit)" stroke-width="9" stroke-linecap="round"/>

    <!-- 大頭 -->
    <ellipse cx="0" cy="94" rx="35" ry="37" fill="url(#swHair)"/>
    <path d="M-22,88 C-26,96 -24,110 -18,120 C-12,128 -4,132 4,130 C10,128 14,122 18,112 C22,100 20,90 14,82 C8,76 2,74 -4,76 C-12,78 -20,82 -22,88Z" fill="url(#swFace)"/>
    <path d="M-16,78 C-12,62 4,54 16,58 C24,62 28,72 24,80 C20,74 12,68 4,66 C-4,64 -10,68 -14,74" fill="url(#swHair)"/>
    <path d="M-24,86 C-28,76 -30,80 -32,88 C-30,92 -26,92 -24,88" fill="url(#swHair)"/>
    <path d="M20,84 C24,78 26,86 24,96 C22,100 20,98 20,92" fill="url(#swHair)"/>
    <path d="M-20,74 C-16,62 0,56 14,60 C22,64 26,72 24,78" fill="none" stroke="#3a2840" stroke-width="4" stroke-linecap="round"/>
    <path d="M24,78 C28,84 30,96 28,110" fill="none" stroke="#3a2840" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M20,100 C24,96 26,102 24,108 C22,112 20,110 20,106" fill="url(#swFace)" stroke="#d0c0a0" stroke-width="0.5"/>

    <ellipse cx="-8" cy="106" rx="7" ry="5" fill="#fff"/>
    <ellipse cx="-10" cy="107" rx="3.5" ry="4" fill="#1a1818"/>
    <ellipse cx="-10.5" cy="106" rx="1.8" ry="2.2" fill="#0a0404"/>
    <circle cx="-12" cy="105" r="1.2" fill="#fff" opacity="0.8"/>
    <ellipse cx="8" cy="106" rx="7" ry="5" fill="#fff"/>
    <ellipse cx="6" cy="107" rx="3.5" ry="4" fill="#1a1818"/>
    <ellipse cx="5.5" cy="106" rx="1.8" ry="2.2" fill="#0a0404"/>
    <circle cx="4" cy="105" r="1.2" fill="#fff" opacity="0.8"/>
    <path d="M-15,98 C-12,94 -6,95 -2,97" fill="none" stroke="#1a1018" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M2,97 C6,94 12,95 15,98" fill="none" stroke="#1a1018" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-10,114 C-12,118 -10,120 -8,119" fill="none" stroke="#d0c0a0" stroke-width="1" stroke-linecap="round"/>
    <path d="M-6,124 C-3,125 1,125 4,124" fill="none" stroke="#805848" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-4,128 C-8,130 -12,129" fill="none" stroke="#1a1018" stroke-width="0.8" opacity="0.4"/>
    <path d="M0,128 C4,130 8,129" fill="none" stroke="#1a1018" stroke-width="0.8" opacity="0.4"/>

    <!-- 袖箭（射出3支，最上層） -->
    <line x1="46" y1="119" x2="80" y2="109" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="80" y1="109" x2="84" y2="108" stroke="#ccc" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="122" x2="82" y2="118" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="82" y1="118" x2="86" y2="117.5" stroke="#ccc" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="126" x2="78" y2="128" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="78" y1="128" x2="82" y2="128.5" stroke="#ccc" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="112" x2="68" y2="110" stroke="#ddd" stroke-width="0.8" opacity="0.3"/>
    <line x1="60" y1="120" x2="70" y2="119" stroke="#ddd" stroke-width="0.8" opacity="0.3"/>

    <!-- 飛刀（左手擲出） -->
    <line x1="-68" y1="122" x2="-78" y2="120" stroke="#bbb" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="-78,117.5 -84,120 -78,122.5" fill="#aaa"/>
    <circle cx="-53" cy="128" r="4.5" fill="url(#swFace)"/>

    <!-- 煙霧效果 -->
    <ellipse cx="-10" cy="190" rx="18" ry="10" fill="url(#swSmoke)"/>
    <ellipse cx="10" cy="194" rx="12" ry="8" fill="url(#swSmoke)" opacity="0.6"/>
  </g>
</svg>
