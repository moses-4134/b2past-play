<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 賭坊打手 — 吉卜力2頭身 面朝右（敵方）攻擊（鐵棍橫掃） -->
  <defs>
    <radialGradient id="mobEnforcerFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c4a0"/>
      <stop offset="100%" stop-color="#cca880"/>
    </radialGradient>
    <linearGradient id="mobEnforcerCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a2a28"/>
      <stop offset="100%" stop-color="#1a1a18"/>
    </linearGradient>
    <linearGradient id="mobEnforcerPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222220"/>
      <stop offset="100%" stop-color="#121210"/>
    </linearGradient>
    <linearGradient id="mobEnforcerHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181810"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="213" rx="28" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前踏攻擊） ===== -->
      <!-- 後腿 -->
      <ellipse cx="10" cy="191" rx="10" ry="16" fill="url(#mobEnforcerPants)" transform="rotate(-5,10,191)"/>
      <ellipse cx="9" cy="207" rx="11" ry="6" fill="#1a1810"/>
      <!-- 前腿（大幅前踏） -->
      <ellipse cx="-22" cy="189" rx="11" ry="17" fill="url(#mobEnforcerPants)" transform="rotate(8,-22,189)"/>
      <ellipse cx="-23" cy="207" rx="12" ry="6" fill="#1a1810"/>

      <!-- ===== 身體（前傾攻擊） ===== -->
      <ellipse cx="-2" cy="154" rx="24" ry="26" fill="url(#mobEnforcerCloth)" transform="rotate(-14,-2,154)"/>

      <!-- 勁裝衣褶 -->
      <path d="M-8,138 L-5,150" fill="none" stroke="#0e0e0c" stroke-width="0.8" opacity="0.4"/>

      <!-- 領口 -->
      <path d="M-14,132 L-6,140 L4,132" fill="none" stroke="#1a1a18" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-24,172 Q-2,178 22,172" fill="none" stroke="#1a1810" stroke-width="5" stroke-linecap="round"/>
      <rect x="-6" y="170" width="8" height="8" rx="1" fill="#404040" stroke="#303030" stroke-width="0.5"/>

      <!-- ===== 右手臂（角色左手，向後平衡） ===== -->
      <path d="M20,140 Q40,150 42,164" fill="none" stroke="url(#mobEnforcerCloth)" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
      <path d="M34,154 Q38,152 40,156" fill="none" stroke="#1a1810" stroke-width="3" stroke-linecap="round"/>
      <circle cx="42" cy="166" r="5.5" fill="url(#mobEnforcerFace)" opacity="0.85"/>

      <!-- ===== 左手臂（角色右手，持鐵棍前刺） ===== -->
      <path d="M-24,138 Q-48,132 -64,138" fill="none" stroke="url(#mobEnforcerCloth)" stroke-width="11" stroke-linecap="round"/>
      <path d="M-50,134 Q-56,132 -58,136" fill="none" stroke="#1a1810" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 鐵棍（前刺） ===== -->
      <line x1="-66" y1="106" x2="-60" y2="171" stroke="#404040" stroke-width="4" stroke-linecap="round"/>
      <line x1="-65" y1="111" x2="-61" y2="164" stroke="#606060" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
      <!-- 握棍的手 -->
      <circle cx="-63" cy="140" r="5.5" fill="url(#mobEnforcerFace)"/>

      <!-- ===== 大頭（前傾攻擊） ===== -->
      <!-- 後腦 -->
      <ellipse cx="0" cy="96" rx="36" ry="40" fill="url(#mobEnforcerHair)"/>

      <!-- 臉 -->
      <path d="M-26,86 C-30,96 -28,114 -24,126 C-18,134 -6,138 2,136 C12,134 20,126 24,114 C28,102 26,88 20,80 C14,74 4,72 -4,74 C-16,76 -24,80 -26,86Z" fill="url(#mobEnforcerFace)"/>

      <!-- 短髮 -->
      <path d="M-16,78 C-12,60 4,52 14,56 C22,60 26,72 22,82 C18,74 12,68 4,66 C-2,64 -8,66 -14,72" fill="url(#mobEnforcerHair)"/>
      <path d="M-26,86 C-28,78 -30,80 -28,88 C-26,90 -26,88 -26,86" fill="url(#mobEnforcerHair)"/>
      <path d="M20,80 C22,76 24,80 22,88 C20,90 20,88 20,86" fill="url(#mobEnforcerHair)"/>

      <!-- 耳朵 -->
      <path d="M18,100 C22,96 24,102 22,110 C20,114 18,112 18,106" fill="url(#mobEnforcerFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（攻擊銳利） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-10" cy="106" rx="6.5" ry="5.5" fill="#fff"/>
      <ellipse cx="-11" cy="107" rx="4" ry="3.8" fill="#282020"/>
      <ellipse cx="-11.5" cy="106.5" rx="2.2" ry="2.2" fill="#100808"/>
      <circle cx="-13" cy="105" r="1.1" fill="#fff" opacity="0.6"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="106" rx="6.5" ry="5.5" fill="#fff"/>
      <ellipse cx="5" cy="107" rx="4" ry="3.8" fill="#282020"/>
      <ellipse cx="4.5" cy="106.5" rx="2.2" ry="2.2" fill="#100808"/>
      <circle cx="3" cy="105" r="1.1" fill="#fff" opacity="0.6"/>

      <!-- 眉毛（攻擊下壓） -->
      <path d="M-16,98 C-12,96 -8,98 -6,100" fill="none" stroke="#181810" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M8,100 C10,98 14,96 18,98" fill="none" stroke="#181810" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-12,112 C-14,118 -10,122" fill="none" stroke="#b89868" stroke-width="1.3" stroke-linecap="round"/>

      <!-- 嘴巴（攻擊喝聲） -->
      <ellipse cx="-2" cy="130" rx="5" ry="3.5" fill="#502020"/>
      <line x1="-5" y1="129" x2="1" y2="129" stroke="#d8d0c0" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>
</svg>