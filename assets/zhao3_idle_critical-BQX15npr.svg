<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙三 — 瀕死待機（HP <30%：半跪、劍撐地、喘息） -->
  <defs>
    <radialGradient id="zhao3CFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c498"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </radialGradient>
    <linearGradient id="zhao3CCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3028"/>
      <stop offset="100%" stop-color="#3a2018"/>
    </linearGradient>
    <linearGradient id="zhao3CPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2018"/>
      <stop offset="100%" stop-color="#2a1410"/>
    </linearGradient>
    <linearGradient id="zhao3CHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="zhao3CBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccc"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="186" rx="26" ry="5" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪姿態） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="6" cy="164" rx="8" ry="11" fill="url(#zhao3CPants)" transform="rotate(-20,6,164)"/>
      <ellipse cx="0" cy="176" rx="7" ry="4" fill="url(#zhao3CPants)"/>
      <ellipse cx="-2" cy="180" rx="8" ry="5" fill="#2a1810"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-12" cy="160" rx="9" ry="14" fill="url(#zhao3CPants)" transform="rotate(12,-12,160)"/>
      <ellipse cx="-16" cy="180" rx="10" ry="5" fill="#2a1810"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="132" rx="24" ry="24" fill="url(#zhao3CCloth)" transform="rotate(-14,-4,132)"/>

      <!-- 甲片暗示 -->
      <rect x="-16" y="122" width="6" height="5" rx="1" fill="#4a2820" opacity="0.5"/>
      <rect x="-8" y="122" width="6" height="5" rx="1" fill="#4a2820" opacity="0.45"/>
      <rect x="0" y="122" width="6" height="5" rx="1" fill="#4a2820" opacity="0.4"/>

      <!-- 領口 -->
      <path d="M-12,116 L-6,128 L2,116" fill="none" stroke="#4a2820" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-22,154 Q-4,160 18,154" fill="none" stroke="#3a2018" stroke-width="4" stroke-linecap="round"/>
      <rect x="-6" y="153" width="5" height="5" rx="1" fill="#806030" opacity="0.6"/>

      <!-- ===== 左手臂（撐在膝蓋上） ===== -->
      <path d="M-16,122 Q-24,138 -12,156" fill="none" stroke="url(#zhao3CCloth)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-10" cy="158" r="4.5" fill="url(#zhao3CFace)" opacity="0.85"/>

      <!-- ===== 右手臂（劍插地撐身） ===== -->
      <path d="M18,122 Q34,132 40,146" fill="none" stroke="url(#zhao3CCloth)" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== 劍（插入地面當支撐） ===== -->
      <line x1="40" y1="148" x2="38" y2="186" stroke="url(#zhao3CBlade)" stroke-width="4" stroke-linecap="round"/>
      <!-- 劍插入地面效果 -->
      <ellipse cx="38" cy="186" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>
      <!-- 劍護手 -->
      <line x1="44" y1="148" x2="34" y2="146" stroke="#806030" stroke-width="3" stroke-linecap="round"/>
      <!-- 握劍的手 -->
      <circle cx="40" cy="146" r="5" fill="url(#zhao3CFace)"/>

      <!-- ===== 大頭（低垂喘息） ===== -->
      <ellipse cx="0" cy="86" rx="34" ry="36" fill="url(#zhao3CHair)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-26,84 C-30,94 -28,110 -22,122 C-16,130 -4,134 4,132 C10,130 16,124 20,112 C24,100 22,88 16,80 C10,74 2,72 -4,74 C-14,76 -24,78 -26,84Z" fill="url(#zhao3CFace)"/>

      <!-- 腮紅（痛苦更明顯） -->
      <ellipse cx="-18" cy="118" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,76 C-12,58 4,50 16,54 C24,58 28,70 24,80 C20,72 14,66 6,64 C0,62 -8,64 -14,70" fill="url(#zhao3CHair)"/>

      <!-- 破舊軍帽（歪斜快掉） -->
      <path d="M-28,76 C-24,64 -10,58 8,60 C20,62 28,68 26,76" fill="#3a2820" stroke="#2a1810" stroke-width="0.5"/>
      <path d="M-30,76 C-30,74 -28,72 -24,74 L28,74 C30,74 30,78 28,78 L-28,78 C-30,78 -30,76 -30,76Z" fill="#3a2820" stroke="#2a1810" stroke-width="0.5" transform="rotate(6,0,76)"/>

      <!-- 瀏海（更散亂） -->
      <path d="M-24,82 C-28,76 -30,80 -30,86 C-28,90 -24,88 -24,86" fill="url(#zhao3CHair)"/>
      <path d="M-20,80 C-22,74 -26,76 -26,84 C-24,88 -20,86 -20,82" fill="url(#zhao3CHair)" opacity="0.9"/>
      <!-- 散落髮絲 -->
      <path d="M-26,88 C-28,94 -26,98" fill="none" stroke="url(#zhao3CHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 側髮 -->
      <path d="M18,82 C24,76 26,84 24,92 C22,96 18,94 18,90" fill="url(#zhao3CHair)"/>

      <!-- 耳朵 -->
      <path d="M16,100 C20,96 22,102 20,108 C18,112 16,110 16,106" fill="url(#zhao3CFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼幾乎閉上） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-10" cy="104" rx="5" ry="2" fill="#fff"/>
      <ellipse cx="-11" cy="104.5" rx="3" ry="1.5" fill="#2a1818"/>
      <ellipse cx="-11.5" cy="104" rx="1.5" ry="1" fill="#140808"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="104" rx="5" ry="2.5" fill="#fff"/>
      <ellipse cx="5" cy="104.5" rx="3" ry="2" fill="#2a1818"/>
      <ellipse cx="4.5" cy="104" rx="1.5" ry="1.2" fill="#140808"/>
      <circle cx="3" cy="103.5" r="0.7" fill="#fff" opacity="0.7"/>

      <!-- 眉毛（深皺） -->
      <path d="M-14,97 C-10,94 -8,96 -6,98" fill="none" stroke="#2a2018" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,98 C10,96 12,94 16,96" fill="none" stroke="#2a2018" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 眉間皺紋（深刻） -->
      <path d="M-3,99 C-1,97 1,97 3,99" fill="none" stroke="#b09060" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-4,101 C-2,99.5 1,99.5 3,101" fill="none" stroke="#b09060" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 鼻子 -->
      <path d="M-16,112 C-18,118 -14,122" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 八字鬍 -->
      <path d="M-14,124 C-12,126 -8,127 -6,126" fill="none" stroke="#2a2018" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M-2,124 C0,126 4,127 6,126" fill="none" stroke="#2a2018" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-4" cy="127" rx="4" ry="3.5" fill="#703030"/>
      <path d="M-7,125 L-1,125" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴（多顆） -->
      <path d="M-20,80 C-21,84 -20,90 -19,93" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-19" cy="94" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M18,82 C19,86 18,90" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="18" cy="91" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-6" cy="72" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>
