<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙國斥候 — 受傷待機（HP 30~60%：身體前傾、弓下垂、單眼瞇、汗滴） -->
  <defs>
    <radialGradient id="mobScoutWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc098"/>
      <stop offset="100%" stop-color="#c4a478"/>
    </radialGradient>
    <linearGradient id="mobScoutWArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a4830"/>
      <stop offset="100%" stop-color="#2a3820"/>
    </linearGradient>
    <linearGradient id="mobScoutWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4030"/>
      <stop offset="100%" stop-color="#2a2e20"/>
    </linearGradient>
    <linearGradient id="mobScoutWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2418"/>
      <stop offset="100%" stop-color="#1a1610"/>
    </linearGradient>
    <linearGradient id="mobScoutWBow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a20"/>
      <stop offset="100%" stop-color="#3a2410"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="205" rx="24" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（重心偏移） ===== -->
      <ellipse cx="8" cy="184" rx="8" ry="15" fill="url(#mobScoutWPants)" transform="rotate(-5,8,184)"/>
      <ellipse cx="6" cy="198" rx="9" ry="6" fill="#2a2418"/>
      <ellipse cx="-10" cy="182" rx="9" ry="16" fill="url(#mobScoutWPants)" transform="rotate(8,-10,182)"/>
      <ellipse cx="-13" cy="198" rx="10" ry="6" fill="#2a2418"/>

      <!-- ===== 身體（前傾、偏瘦） ===== -->
      <ellipse cx="-2" cy="150" rx="21" ry="23" fill="url(#mobScoutWArmor)" transform="rotate(-8,-2,150)"/>

      <!-- 領口 -->
      <path d="M-10,132 L-5,142 L1,132" fill="none" stroke="#4a5838" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- 箭囊帶 -->
      <path d="M-16,134 L12,166" fill="none" stroke="#4a3828" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

      <!-- 腰帶 -->
      <path d="M-22,166 Q-4,174 16,168" fill="none" stroke="#3a3020" stroke-width="3.5" stroke-linecap="round"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="98" rx="34" ry="36" fill="url(#mobScoutWHair)"/>

      <!-- 臉 -->
      <path d="M-24,90 C-28,100 -26,114 -20,124 C-14,130 -6,134 2,132 C8,130 12,124 16,114 C20,102 18,90 12,82 C6,76 0,74 -6,76 C-14,78 -22,84 -24,90Z" fill="url(#mobScoutWFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,80 C-12,64 4,56 16,60 C24,64 28,74 24,84 C20,76 14,70 6,68 C0,66 -8,68 -14,74" fill="url(#mobScoutWHair)"/>

      <!-- 頭帶 -->
      <path d="M-26,82 C-22,74 -8,68 8,70 C18,72 26,78 24,82" fill="#3a4830" stroke="#2a3820" stroke-width="0.5"/>
      <path d="M-28,82 L28,82 L26,86 L-26,86 Z" fill="#3a4830" stroke="#2a3820" stroke-width="0.5"/>
      <path d="M24,84 C28,82 32,86 30,92" fill="none" stroke="#3a4830" stroke-width="3" stroke-linecap="round"/>

      <!-- 側髮 -->
      <path d="M-24,88 C-28,80 -30,84 -28,92 C-26,96 -24,94 -24,90" fill="url(#mobScoutWHair)"/>
      <path d="M18,86 C22,80 24,86 22,94 C20,96 18,94 18,90" fill="url(#mobScoutWHair)"/>

      <!-- 耳朵 -->
      <path d="M16,104 C20,100 22,106 20,112 C18,116 16,114 16,110" fill="url(#mobScoutWFace)" stroke="#b09068" stroke-width="0.5"/>

      <!-- 腮紅 -->
      <ellipse cx="-18" cy="122" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- ===== 眼睛 ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-10" cy="108" rx="5.5" ry="3.5" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="3.2" ry="2.5" fill="#303828"/>
      <ellipse cx="-11.5" cy="108.5" rx="1.8" ry="1.5" fill="#181c10"/>
      <circle cx="-13" cy="107.5" r="0.7" fill="#fff" opacity="0.5"/>

      <!-- 右眼（微睜） -->
      <ellipse cx="6" cy="108" rx="5.5" ry="5.5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.2" ry="3.2" fill="#303828"/>
      <ellipse cx="4.5" cy="108.5" rx="1.8" ry="1.8" fill="#181c10"/>
      <circle cx="3" cy="107.5" r="0.8" fill="#fff" opacity="0.5"/>

      <!-- 眉間皺紋 -->
      <path d="M-3,102 C-2,100 0,100 1,102" fill="none" stroke="#b09060" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 眉毛 -->
      <path d="M-14,102 C-10,100 -8,101 -6,103" fill="none" stroke="#2a2418" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,103 C10,101 12,100 16,102" fill="none" stroke="#2a2418" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#a88e68" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙） -->
      <path d="M-8,128 C-4,130 2,130 6,129" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-8,128 C-9,130 -10,131" fill="none" stroke="#704840" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴 -->
      <path d="M-20,88 C-21,92 -20,96 -19,98" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-19" cy="99" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>

      <!-- ===== 右手臂（持弓下垂） ===== -->
      <path d="M16,138 Q26,148 26,164" fill="none" stroke="url(#mobScoutWArmor)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="26" cy="166" r="4.5" fill="url(#mobScoutWFace)" opacity="0.85"/>

      <!-- 弓（下垂） -->
      <path d="M22,148 C14,156 12,172 20,188" fill="none" stroke="url(#mobScoutWBow)" stroke-width="3" stroke-linecap="round"/>
      <line x1="22" y1="148" x2="20" y2="188" stroke="#2a2018" stroke-width="1.5"/>

      <!-- ===== 左手臂（按住腹部） ===== -->
      <path d="M-18,138 Q-30,146 -28,162" fill="none" stroke="url(#mobScoutWArmor)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-28" cy="164" r="5" fill="url(#mobScoutWFace)"/>
    </g>
  </g>
</svg>
