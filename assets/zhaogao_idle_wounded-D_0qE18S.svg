<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙高 — 吉卜力2頭身 面朝右（敵方）受傷待機（HP 30~60%：身體微傾、單眼半瞇、咬牙、汗滴） -->
  <defs>
    <radialGradient id="zgWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e4d8"/>
      <stop offset="100%" stop-color="#d8c8b0"/>
    </radialGradient>
    <linearGradient id="zgWRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a1028"/>
      <stop offset="100%" stop-color="#0c0818"/>
    </linearGradient>
    <linearGradient id="zgWInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1838"/>
      <stop offset="100%" stop-color="#180c28"/>
    </linearGradient>
    <linearGradient id="zgWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 14)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="203.5" rx="26" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（重心偏移） ===== -->
      <ellipse cx="6" cy="184" rx="7" ry="14" fill="url(#zgWInner)"/>
      <ellipse cx="4" cy="198" rx="8" ry="5.5" fill="#1a1020"/>
      <ellipse cx="-8" cy="182" rx="7" ry="15" fill="url(#zgWInner)" transform="rotate(8,-8,182)"/>
      <ellipse cx="-10" cy="198" rx="8" ry="5.5" fill="#1a1020"/>

      <!-- ===== 身體（前傾，失去沉穩） ===== -->
      <ellipse cx="-2" cy="154" rx="24" ry="26" fill="url(#zgWRobe)" transform="rotate(-8,-2,154)"/>

      <!-- 暗紫內襯 -->
      <path d="M-10,132 L-5,146 L2,132" fill="none" stroke="#2a1838" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 銀色腰帶 -->
      <path d="M-22,170 Q-2,178 18,170" fill="none" stroke="#808890" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-3" cy="174" r="3" fill="#9098a0"/>
      <ellipse cx="-3" cy="180" rx="2" ry="3" fill="#90a8a0" opacity="0.6"/>

      <!-- 暗袍紫邊 -->
      <path d="M-24,140 Q-25,155 -24,170" fill="none" stroke="#301848" stroke-width="0.8" opacity="0.5"/>
      <path d="M20,140 Q21,155 20,170" fill="none" stroke="#301848" stroke-width="0.8" opacity="0.5"/>

      <!-- ===== 畫面左側手臂（角色右手，按住傷處） ===== -->
      <path d="M-20,142 Q-28,154 -20,168" fill="none" stroke="url(#zgWRobe)" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="-20" cy="170" rx="7" ry="5" fill="#100820" transform="rotate(5,-20,170)"/>
      <circle cx="-22" cy="170" r="4" fill="url(#zgWFace)" opacity="0.85"/>

      <!-- ===== 畫面右側手臂（角色左手，無力下垂） ===== -->
      <path d="M16,142 Q28,156 26,170" fill="none" stroke="url(#zgWRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <ellipse cx="26" cy="172" rx="7" ry="5" fill="#100820" transform="rotate(-5,26,172)"/>
      <circle cx="28" cy="172" r="4" fill="url(#zgWFace)" opacity="0.8"/>

      <!-- ===== 大頭（低頭忍痛） ===== -->
      <ellipse cx="0" cy="94" rx="36" ry="38" fill="url(#zgWHair)"/>

      <!-- 臉 -->
      <path d="M-24,88 C-28,98 -26,114 -20,124 C-14,132 -4,136 4,134 C10,132 16,126 20,116 C24,104 22,92 16,84 C10,78 2,76 -4,78 C-12,80 -22,84 -24,88Z" fill="url(#zgWFace)"/>

      <!-- 腮紅（傷痛泛紅） -->
      <ellipse cx="-18" cy="120" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- 頭髮頂部 -->
      <path d="M-14,78 C-10,58 6,50 18,56 C26,62 28,72 24,82 C20,74 12,66 4,64 C-4,62 -10,66 -14,74" fill="url(#zgWHair)"/>

      <!-- 宦官帽 -->
      <ellipse cx="2" cy="56" rx="14" ry="8" fill="#101018" stroke="#303038" stroke-width="0.8"/>
      <ellipse cx="2" cy="52" rx="10" ry="5" fill="#181820"/>
      <line x1="-8" y1="56" x2="12" y2="56" stroke="#909898" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-8" cy="56" r="1.5" fill="#a0a8a8"/>
      <circle cx="12" cy="56" r="1.5" fill="#a0a8a8"/>

      <!-- 鬢角 -->
      <path d="M20,84 C26,80 28,88 26,96 C24,102 20,98 20,92" fill="url(#zgWHair)"/>
      <path d="M-26,88 C-30,100 -28,112 -26,120" fill="none" stroke="url(#zgWHair)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

      <!-- 耳朵 -->
      <path d="M18,100 C22,96 24,102 22,108 C20,112 18,110 18,106" fill="url(#zgWFace)" stroke="#d0c0a8" stroke-width="0.5"/>

      <!-- ===== 眼睛（左眼半瞇、右眼微睜） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-9" cy="106" rx="7" ry="3" fill="#fff" transform="rotate(-3,-9,106)"/>
      <ellipse cx="-10" cy="107" rx="4" ry="2.5" fill="#1a1020"/>
      <ellipse cx="-10.5" cy="106.5" rx="2" ry="1.5" fill="#080410"/>
      <circle cx="-12" cy="105.5" r="1" fill="#fff" opacity="0.5"/>

      <!-- 右眼（微瞇） -->
      <ellipse cx="6" cy="106" rx="7" ry="4" fill="#fff" transform="rotate(-3,6,106)"/>
      <ellipse cx="5" cy="107" rx="4" ry="3" fill="#1a1020"/>
      <ellipse cx="4.5" cy="106.5" rx="2" ry="1.8" fill="#080410"/>
      <circle cx="3" cy="105" r="1" fill="#fff" opacity="0.5"/>

      <!-- 細長眉（皺起） -->
      <path d="M-16,99 C-12,96 -8,97 -4,100" fill="none" stroke="#181818" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M2,100 C6,97 10,96 14,99" fill="none" stroke="#181818" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 眉間皺紋 -->
      <path d="M-5,101 C-4,99 -2,99 -1,101" fill="none" stroke="#c0a080" stroke-width="0.8" opacity="0.5"/>

      <!-- 鼻子 -->
      <path d="M-12,114 C-13,118 -11,120" fill="none" stroke="#c8b898" stroke-width="1" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-6,126 C-2,128 2,128 6,126" fill="none" stroke="#806858" stroke-width="2" stroke-linecap="round"/>
      <path d="M-6,126 C-7,128 -8,129" fill="none" stroke="#806858" stroke-width="1" opacity="0.6"/>

      <!-- 汗滴 -->
      <path d="M-20,90 C-21,94 -20,98 -19,100" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-19" cy="101" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
    </g>
  </g>
</svg>