<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 程蛟 — 吉卜力2頭身 面朝右（敵方）倒地/戰敗 -->
  <defs>
    <radialGradient id="chengjiaoFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b090"/>
      <stop offset="100%" stop-color="#c09878"/>
    </radialGradient>
    <linearGradient id="chengjiaoArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a2828"/>
      <stop offset="100%" stop-color="#4a1818"/>
    </linearGradient>
    <linearGradient id="chengjiaoPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2020"/>
      <stop offset="100%" stop-color="#1e1010"/>
    </linearGradient>
    <linearGradient id="chengjiaoBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(78, 10)">
      <!-- 陰影（倒地時拉長） -->
      <ellipse cx="-4" cy="228" rx="46" ry="4" fill="#000" opacity="0.08"/>

      <g transform="rotate(90, -4, 176)">
        <!-- ===== 腿（放鬆垂落） ===== -->
        <ellipse cx="14" cy="202" rx="12" ry="17" fill="url(#chengjiaoPants)"/>
        <ellipse cx="12" cy="218" rx="13" ry="7" fill="#3a2018"/>
        <ellipse cx="-14" cy="200" rx="13" ry="18" fill="url(#chengjiaoPants)"/>
        <ellipse cx="-16" cy="218" rx="14" ry="7" fill="#3a2018"/>

        <!-- ===== 身體（放鬆） ===== -->
        <ellipse cx="-2" cy="158" rx="30" ry="32" fill="url(#chengjiaoArmor)"/>

        <!-- 肩甲 -->
        <path d="M-30,138 Q-36,134 -38,140 Q-34,148 -28,148" fill="#5a2020" stroke="#4a1818" stroke-width="0.8"/>
        <path d="M22,138 Q28,134 30,140 Q26,148 20,148" fill="#5a2020" stroke="#4a1818" stroke-width="0.8"/>

        <!-- 領口 -->
        <path d="M-14,135 L-6,149 L4,135" fill="none" stroke="#7a3030" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- 腰帶 -->
        <path d="M-30,182 Q-2,191 28,182" fill="none" stroke="#4a2818" stroke-width="7" stroke-linecap="round"/>
        <rect x="-8" y="180" width="10" height="10" rx="1" fill="#a08030" stroke="#806020" stroke-width="0.5"/>

        <!-- ===== 大頭 ===== -->
        <ellipse cx="0" cy="94" rx="40" ry="42" fill="#c09070"/>
        <ellipse cx="-6" cy="72" rx="18" ry="12" fill="#d0a080" opacity="0.3"/>

        <!-- 臉 -->
        <path d="M-30,86 C-34,98 -32,116 -26,128 C-20,136 -6,142 4,140 C14,138 24,128 28,116 C32,104 30,92 24,84 C18,78 6,74 -4,76 C-16,78 -28,80 -30,86Z" fill="url(#chengjiaoFace)"/>

        <!-- 傷疤 -->
        <path d="M-8,78 L6,90" fill="none" stroke="#a08060" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

        <!-- 耳朵 -->
        <path d="M22,100 C26,96 28,102 26,110 C24,114 22,112 22,106" fill="url(#chengjiaoFace)" stroke="#b08860" stroke-width="0.5"/>

        <!-- ===== 眼睛（閉眼橫線） ===== -->
        <line x1="-16" y1="106" x2="-8" y2="106" stroke="#3a1810" stroke-width="2" stroke-linecap="round"/>
        <line x1="2" y1="106" x2="10" y2="106" stroke="#3a1810" stroke-width="2" stroke-linecap="round"/>

        <!-- 粗眉毛（放鬆） -->
        <path d="M-18,100 C-14,98 -10,99 -8,101" fill="none" stroke="#5a3828" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <path d="M10,101 C12,99 16,98 20,100" fill="none" stroke="#5a3828" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

        <!-- 鼻子 -->
        <path d="M-18,114 C-20,120 -16,124" fill="none" stroke="#a08058" stroke-width="1.8" stroke-linecap="round"/>

        <!-- 嘴巴（倒地一字線） -->
        <path d="M-14,130 C-8,130 -2,130 4,130" fill="none" stroke="#704840" stroke-width="2" stroke-linecap="round"/>

        <!-- ===== 畫面左側手臂（角色左手，自然垂落） ===== -->
        <path d="M-28,146 Q-42,156 -48,166" fill="none" stroke="url(#chengjiaoArmor)" stroke-width="13" stroke-linecap="round" opacity="0.8"/>
        <circle cx="-48" cy="168" r="6.5" fill="url(#chengjiaoFace)" opacity="0.85"/>

        <!-- ===== 畫面右側手臂（角色右手，自然垂落） ===== -->
        <path d="M24,146 Q38,158 34,174" fill="none" stroke="url(#chengjiaoArmor)" stroke-width="14" stroke-linecap="round"/>
        <circle cx="34" cy="176" r="7" fill="url(#chengjiaoFace)"/>

        <!-- ===== 大刀（脫手掉落在身旁地上） ===== -->
        <path d="M-96,182 L-42,196 L-38,198 L-40,206 Q-66,196 -100,188 Z" fill="url(#chengjiaoBlade)" stroke="#666" stroke-width="0.5"/>
        <line x1="-96" y1="182" x2="-42" y2="196" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-100" y1="180" x2="-100" y2="188" stroke="#777" stroke-width="1.2"/>
        <line x1="-40" y1="193" x2="-38" y2="201" stroke="#806030" stroke-width="4" stroke-linecap="round"/>
        <line x1="-36" y1="198" x2="-30" y2="200" stroke="#4a3520" stroke-width="5.5" stroke-linecap="round"/>
        <circle cx="-28" cy="201" r="3.5" fill="#806030"/>
      </g>
    </g>
  </g>
</svg>
