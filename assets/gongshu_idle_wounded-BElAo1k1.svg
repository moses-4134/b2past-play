<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 公輸遠 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體微傾、弩下垂、單眼半瞇、咬牙、汗滴） -->
  <defs>
    <radialGradient id="gswFace" cx="40%" cy="35%" r="55%"><stop offset="0%" stop-color="#e8d4b8"/><stop offset="100%" stop-color="#d0b898"/></radialGradient>
    <linearGradient id="gswOutfit" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#485040"/><stop offset="100%" stop-color="#303828"/></linearGradient>
    <linearGradient id="gswPants" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a3830"/><stop offset="100%" stop-color="#222018"/></linearGradient>
    <linearGradient id="gswHair" x1="0.2" y1="0" x2="0.7" y2="1"><stop offset="0%" stop-color="#1a1410"/><stop offset="100%" stop-color="#0a0808"/></linearGradient>
  </defs>
  <g transform="translate(130, 14)">
    <ellipse cx="-4" cy="217" rx="26" ry="5" fill="#000" opacity="0.1"/>
    <!-- 腿（重心偏移） -->
    <ellipse cx="10" cy="196" rx="9" ry="15" fill="url(#gswPants)" transform="rotate(-3,10,196)"/>
    <ellipse cx="8" cy="211" rx="10" ry="6" fill="#2a2418"/>
    <ellipse cx="-10" cy="194" rx="10" ry="16" fill="url(#gswPants)" transform="rotate(8,-10,194)"/>
    <ellipse cx="-12" cy="211" rx="11" ry="6" fill="#2a2418"/>
    <!-- 身體（前傾） -->
    <ellipse cx="-2" cy="163" rx="26" ry="28" fill="url(#gswOutfit)" transform="rotate(-8,-2,163)"/>
    <!-- 皮革工具帶 -->
    <path d="M-26,180 Q-2,188 22,180" fill="none" stroke="#5a4028" stroke-width="4" stroke-linecap="round"/>
    <rect x="-6" y="179" width="8" height="6" rx="1" fill="#7a5a30"/>
    <!-- 小工具袋 -->
    <rect x="14" y="176" width="6" height="8" rx="2" fill="#5a4028" stroke="#4a3020" stroke-width="0.5"/>
    <!-- 粗布領口 -->
    <path d="M-10,139 L-4,152 L4,139" fill="none" stroke="#6a6050" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 角色左手（按住腹部） -->
    <path d="M20,148 Q30,164 18,178" fill="none" stroke="url(#gswOutfit)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <circle cx="18" cy="180" r="5" fill="url(#gswFace)" opacity="0.85"/>
    <!-- 角色右手（持弩下垂） -->
    <path d="M-24,150 Q-40,156 -48,168" fill="none" stroke="url(#gswOutfit)" stroke-width="10" stroke-linecap="round"/>

    <!-- 大頭（微低頭） -->
    <ellipse cx="0" cy="92" rx="36" ry="38" fill="url(#gswHair)"/>
    <!-- 臉 -->
    <path d="M-24,86 C-28,96 -26,112 -20,124 C-14,132 -4,136 6,134 C14,132 20,126 24,116 C28,104 26,92 20,84 C14,78 6,76 -2,78 C-12,80 -22,82 -24,86Z" fill="url(#gswFace)"/>
    <!-- 腮紅（傷痛） -->
    <ellipse cx="-18" cy="122" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>
    <!-- 皺紋 -->
    <path d="M-16,96 C-14,94 -8,94" fill="none" stroke="#c0a080" stroke-width="0.8" opacity="0.35"/>
    <!-- 髮頂 -->
    <path d="M-16,78 C-12,62 4,54 16,58 C24,62 28,72 24,80 C20,74 12,68 4,66 C-4,64 -10,68 -14,74" fill="url(#gswHair)"/>
    <!-- 墨家額帶 -->
    <path d="M-28,82 C-20,76 0,74 20,78 C24,80 26,82" fill="none" stroke="#5a5048" stroke-width="3" stroke-linecap="round"/>
    <!-- 短碎髮 -->
    <path d="M-26,86 C-30,76 -32,80 -34,88 C-32,92 -28,92 -26,88" fill="url(#gswHair)"/>
    <path d="M-22,82 C-24,74 -28,76 -28,84 C-26,88 -22,88 -22,84" fill="#1a1410"/>
    <!-- 側髮 -->
    <path d="M22,84 C26,78 28,86 26,96 C24,100 22,98 22,92" fill="url(#gswHair)"/>
    <!-- 耳朵 -->
    <path d="M22,100 C26,96 28,102 26,108 C24,112 22,110 22,106" fill="url(#gswFace)" stroke="#d0b898" stroke-width="0.5"/>
    <!-- 左眼（半瞇忍痛） -->
    <ellipse cx="-8" cy="106" rx="7" ry="3.5" fill="#fff"/>
    <ellipse cx="-9" cy="107" rx="4" ry="2.8" fill="#1a1408"/>
    <ellipse cx="-9.5" cy="106" rx="2" ry="1.8" fill="#0a0804"/>
    <circle cx="-11" cy="105" r="1.2" fill="#fff" opacity="0.6"/>
    <!-- 右眼（微睜） -->
    <ellipse cx="8" cy="106" rx="7" ry="5.5" fill="#fff"/>
    <ellipse cx="7" cy="107" rx="4" ry="4" fill="#1a1408"/>
    <ellipse cx="6.5" cy="106" rx="2" ry="2.2" fill="#0a0804"/>
    <circle cx="5" cy="104.5" r="1.5" fill="#fff" opacity="0.6"/>
    <!-- 眉間皺紋 -->
    <path d="M-3,100 C-2,98 0,98 1,100" fill="none" stroke="#c0a080" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
    <!-- 粗平眉 -->
    <path d="M-16,98 C-12,96 -6,96 -2,98" fill="none" stroke="#1a1410" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M2,98 C6,96 12,96 16,98" fill="none" stroke="#1a1410" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 鼻子 -->
    <path d="M-10,114 C-11,118 -9,120 -7,119" fill="none" stroke="#d0b898" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 嘴巴（咬牙忍痛） -->
    <path d="M-6,126 C-3,127 1,127 4,126" fill="none" stroke="#806050" stroke-width="2" stroke-linecap="round"/>
    <path d="M-6,126 C-7,128 -8,129" fill="none" stroke="#806050" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <!-- 短鬚 -->
    <path d="M-6,130 C-3,132 1,132 4,130" fill="none" stroke="#1a1410" stroke-width="1" opacity="0.3"/>

    <!-- 汗滴 -->
    <path d="M-22,88 C-23,92 -22,96 -21,98" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-21" cy="99" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>

    <!-- 機關弩（下垂無力，最上層） -->
    <rect x="-62" y="162" width="28" height="5" rx="2" fill="#6a4a28" stroke="#5a3a18" stroke-width="0.5" transform="rotate(20,-48,164)"/>
    <path d="M-64,160 C-68,154 -70,148 -66,144" fill="none" stroke="#5a4020" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-64,168 C-68,174 -70,178 -66,182" fill="none" stroke="#5a4020" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-66" y1="144" x2="-40" y2="162" stroke="#c0b090" stroke-width="1"/>
    <line x1="-66" y1="182" x2="-40" y2="168" stroke="#c0b090" stroke-width="1"/>
    <circle cx="-48" cy="170" r="5" fill="url(#gswFace)"/>
  </g>
</svg>