<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 晏霜 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪蹲伏、匕首幾乎掉落、喘息） -->
  <defs>
    <radialGradient id="shanFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f4e8dc"/>
      <stop offset="100%" stop-color="#e4d0b8"/>
    </radialGradient>
    <linearGradient id="shanOutfit" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="shanPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252528"/>
      <stop offset="100%" stop-color="#151518"/>
    </linearGradient>
    <linearGradient id="shanHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#201008"/>
      <stop offset="100%" stop-color="#100804"/>
    </linearGradient>
    <linearGradient id="shanSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 30)">
    <!-- 陰影（因半跪蹲伏更寬） -->
    <ellipse cx="-4" cy="206" rx="30" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（半跪：後腿膝蓋幾乎著地，前腿彎曲支撐） ===== -->
    <!-- 後腿（右腿，膝蓋接近著地） -->
    <ellipse cx="6" cy="188" rx="7" ry="11" fill="url(#shanPants)" transform="rotate(-18,6,188)"/>
    <!-- 膝蓋著地 -->
    <ellipse cx="1" cy="198" rx="7" ry="4.5" fill="url(#shanPants)"/>
    <ellipse cx="-1" cy="202" rx="8" ry="5" fill="#1a1418"/>
    <!-- 前腿（左腿，深蹲支撐） -->
    <ellipse cx="-16" cy="184" rx="8" ry="14" fill="url(#shanPants)" transform="rotate(15,-16,184)"/>
    <ellipse cx="-20" cy="202" rx="9" ry="5.5" fill="#1a1418"/>

    <!-- ===== 身體（大幅前傾蹲伏） ===== -->
    <ellipse cx="-5" cy="153" rx="21" ry="22" fill="url(#shanOutfit)" transform="rotate(-16,-5,153)"/>

    <!-- 暗紅內裡（領口露出） -->
    <path d="M-15,132 L-10,142 L-2,132" fill="none" stroke="#4a2028" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰間細繩束帶（鬆散） -->
    <path d="M-24,166 Q-5,174 14,168" fill="none" stroke="#3a2a28" stroke-width="3" stroke-linecap="round"/>
    <path d="M-9,170 L-14,182 L-12,184" fill="none" stroke="#3a2a28" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ===== 畫面右側手臂（角色左手，撐在膝蓋上） ===== -->
    <path d="M12,136 Q20,150 14,172" fill="none" stroke="url(#shanOutfit)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <circle cx="13" cy="174" r="4" fill="url(#shanFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，匕首幾乎掉落） ===== -->
    <path d="M-22,138 Q-40,146 -50,162" fill="none" stroke="url(#shanOutfit)" stroke-width="9" stroke-linecap="round"/>
    <!-- 手指鬆握 -->
    <circle cx="-51" cy="165" r="4.5" fill="url(#shanFace)"/>

    <!-- ===== 匕首（反握但幾乎脫手，指向地面） ===== -->
    <!-- 短柄（從手中滑出） -->
    <line x1="-49" y1="160" x2="-50.5" y2="166" stroke="#4a3828" stroke-width="3" stroke-linecap="round"/>
    <!-- 護手 -->
    <line x1="-54" y1="166" x2="-47" y2="168" stroke="#706058" stroke-width="2" stroke-linecap="round"/>
    <!-- 刀刃（垂直朝下） -->
    <line x1="-51" y1="169" x2="-52" y2="194" stroke="url(#shanSteel)" stroke-width="3" stroke-linecap="round"/>
    <!-- 刀刃亮線 -->
    <line x1="-51" y1="169" x2="-52" y2="194" stroke="#eee" stroke-width="1" opacity="0.3"/>

    <!-- ===== 大頭（明顯低垂） ===== -->
    <!-- 後腦髮量（短髮到肩膀，更散亂） -->
    <ellipse cx="-2" cy="94" rx="36" ry="38" fill="url(#shanHair)"/>

    <!-- 臉（明顯低頭，尖臉） -->
    <path d="M-26,88 C-30,96 -28,114 -22,124 C-16,132 -8,136 0,134 C6,132 10,126 14,116 C18,104 16,94 10,86 C4,80 -2,78 -8,80 C-16,82 -24,84 -26,88Z" fill="url(#shanFace)"/>

    <!-- 腮紅（因痛苦更明顯） -->
    <ellipse cx="-20" cy="122" rx="6" ry="3.5" fill="#d0a0a0" opacity="0.4"/>

    <!-- 頭髮頂部 -->
    <path d="M-20,78 C-16,60 0,52 12,56 C20,60 24,70 20,80 C16,74 8,68 0,66 C-8,64 -14,68 -18,74" fill="url(#shanHair)"/>

    <!-- 瀏海（非常凌亂，散落遮臉） -->
    <path d="M-30,88 C-36,76 -38,80 -40,90 C-38,96 -32,97 -30,92" fill="url(#shanHair)"/>
    <path d="M-26,82 C-30,70 -34,74 -34,86 C-32,92 -26,91 -26,86" fill="#201008"/>
    <path d="M-22,78 C-24,68 -28,70 -28,82 C-26,88 -22,87 -22,82" fill="url(#shanHair)" opacity="0.9"/>
    <!-- 額前碎髮（大量散落） -->
    <path d="M-18,76 C-20,70 -22,72 -22,78" fill="url(#shanHair)" opacity="0.7"/>
    <path d="M-14,78 C-16,72 -18,74 -18,80" fill="url(#shanHair)" opacity="0.6"/>
    <path d="M-10,80 C-12,74 -14,76 -14,82" fill="url(#shanHair)" opacity="0.4"/>
    <!-- 遮眼碎髮 -->
    <path d="M-20,94 C-22,98 -20,104" fill="none" stroke="url(#shanHair)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- 側髮（散亂） -->
    <path d="M16,84 C22,78 24,86 22,94 C20,100 16,98 16,92" fill="url(#shanHair)"/>
    <path d="M18,94 C22,92 24,100 22,110 C20,118 16,114 16,106" fill="url(#shanHair)" opacity="0.8"/>
    <path d="M18,110 C22,108 24,116 22,124 C20,130 16,126 16,120" fill="url(#shanHair)" opacity="0.6"/>

    <!-- 左側散髮（非常凌亂） -->
    <path d="M-32,90 C-34,100 -34,114 -32,128" fill="none" stroke="url(#shanHair)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M-30,86 C-32,96 -32,110 -30,124" fill="none" stroke="url(#shanHair)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <!-- 更多散落碎髮 -->
    <path d="M-34,96 C-36,104 -34,108" fill="none" stroke="url(#shanHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M-36,102 C-38,108 -36,112" fill="none" stroke="url(#shanHair)" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

    <!-- 耳朵 -->
    <path d="M14,100 C18,96 20,102 18,108 C16,112 14,110 14,106" fill="url(#shanFace)" stroke="#e0d0c0" stroke-width="0.5"/>

    <!-- ===== 眼睛（狐狸眼雙眼幾乎瞇成線） ===== -->
    <!-- 左眼睫毛暗示線 -->
    <path d="M-19,101 C-16,99 -11,99 -8,101" fill="none" stroke="#201008" stroke-width="0.8" opacity="0.4"/>
    <!-- 左眼（幾乎閉上，狐狸眼線條） -->
    <ellipse cx="-13" cy="108" rx="6.5" ry="2" fill="#fff" transform="rotate(-3,-13,108)"/>
    <ellipse cx="-14" cy="108.5" rx="4" ry="1.5" fill="#3a2028"/>
    <ellipse cx="-14.5" cy="108" rx="2" ry="1" fill="#0c0408"/>

    <!-- 右眼睫毛暗示線 -->
    <path d="M-4,100 C-1,98 4,98 7,101" fill="none" stroke="#201008" stroke-width="0.8" opacity="0.4"/>
    <!-- 右眼（勉強睜一線，保持狐狸眼上挑） -->
    <ellipse cx="2" cy="108" rx="6.5" ry="2.5" fill="#fff" transform="rotate(-3,2,108)"/>
    <ellipse cx="1" cy="108.5" rx="4" ry="2" fill="#3a2028"/>
    <ellipse cx="0.5" cy="108" rx="2" ry="1.2" fill="#0c0408"/>
    <circle cx="-1" cy="107" r="0.8" fill="#fff" opacity="0.7"/>

    <!-- 眉間皺紋（深刻） -->
    <path d="M-8,102 C-6,100 -3,100 -1,102" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-9,104 C-7,102.5 -4,102.5 -2,104" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

    <!-- 鼻子 -->
    <path d="M-16,118 C-16.5,120 -15.5,121" fill="none" stroke="#e0d0c0" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴（微張喘息） -->
    <ellipse cx="-8" cy="127" rx="4" ry="3.5" fill="#703030"/>
    <!-- 上排牙暗示 -->
    <path d="M-11,125 L-5,125" fill="none" stroke="#eee" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

    <!-- 汗滴（多顆） -->
    <!-- 左額汗滴 -->
    <path d="M-28,90 C-29,94 -28,98 -27,101" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-27" cy="102" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
    <!-- 右側汗滴 -->
    <path d="M18,94 C19,98 18,102" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="18" cy="103" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <!-- 額頭汗 -->
    <ellipse cx="-10" cy="80" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
  </g>
</svg>