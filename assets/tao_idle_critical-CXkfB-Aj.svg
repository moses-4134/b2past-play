<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 范平 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪、重倚棍、喘息） -->
  <defs>
    <radialGradient id="taoFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0dcc0"/>
      <stop offset="100%" stop-color="#d8b898"/>
    </radialGradient>
    <linearGradient id="taoRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a5a30"/>
      <stop offset="100%" stop-color="#4a3a20"/>
    </linearGradient>
    <linearGradient id="taoPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4030"/>
      <stop offset="100%" stop-color="#2a2418"/>
    </linearGradient>
    <linearGradient id="taoHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a1c10"/>
      <stop offset="100%" stop-color="#1a0e06"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 28)">
    <!-- 陰影（半跪更寬） -->
    <ellipse cx="-4" cy="208" rx="30" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（半跪姿態） ===== -->
    <!-- 後腿（右腿，膝蓋撐地） -->
    <ellipse cx="8" cy="190" rx="9.5" ry="12" fill="url(#taoPants)" transform="rotate(-18,8,190)"/>
    <!-- 膝蓋著地 -->
    <ellipse cx="2" cy="200" rx="8" ry="5" fill="url(#taoPants)"/>
    <ellipse cx="0" cy="204" rx="9" ry="5" fill="#3a2818"/>
    <!-- 前腿（左腿，彎曲支撐） -->
    <ellipse cx="-14" cy="186" rx="9.5" ry="16" fill="url(#taoPants)" transform="rotate(10,-14,186)"/>
    <ellipse cx="-18" cy="204" rx="10.5" ry="6" fill="#3a2818"/>

    <!-- ===== 身體（大幅前傾，倚靠棍子） ===== -->
    <ellipse cx="-4" cy="158" rx="24" ry="26" fill="url(#taoRobe)" transform="rotate(-13,-4,158)"/>

    <!-- 領口 -->
    <path d="M-15,140 L-9,152 L-3,140" fill="none" stroke="#8a7a50" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 衣襟斜線 -->
    <path d="M-9,152 L-12,174" fill="none" stroke="#8a7a50" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- 腰帶 -->
    <path d="M-26,174 Q-4,182 18,176" fill="none" stroke="#5a4a28" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-5" cy="179" rx="3" ry="2.5" fill="#b09040" stroke="#907030" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手）撐在膝蓋上 ===== -->
    <path d="M16,144 Q24,158 16,178" fill="none" stroke="url(#taoRobe)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <circle cx="15" cy="180" r="5" fill="url(#taoFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手）重握棍子支撐 ===== -->
    <path d="M-22,144 Q-42,150 -50,162" fill="none" stroke="url(#taoRobe)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-50" cy="164" r="5" fill="url(#taoFace)"/>

    <!-- ===== 管事木棍（傾斜插地，主要支撐點） ===== -->
    <!-- 棍身（明顯傾斜） -->
    <line x1="-44" y1="92" x2="-54" y2="210" stroke="#5a4028" stroke-width="4" stroke-linecap="round"/>
    <!-- 棍底插地效果 -->
    <ellipse cx="-54" cy="210" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>
    <!-- 頂端鐵環裝飾 -->
    <circle cx="-44" cy="92" r="3.5" fill="none" stroke="#707070" stroke-width="2.5"/>
    <circle cx="-44" cy="92" r="1.5" fill="#888"/>

    <!-- ===== 大頭（明顯低垂、喘息） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="-2" cy="94" rx="38" ry="40" fill="url(#taoHair)"/>

    <!-- 臉（圓潤飽滿，明顯低頭） -->
    <path d="M-30,88 C-34,100 -32,118 -26,128 C-20,136 -8,140 2,138 C12,136 18,128 22,118 C26,106 24,92 18,84 C12,78 2,74 -6,76 C-18,78 -28,80 -30,88Z" fill="url(#taoFace)"/>

    <!-- 腮紅（因痛苦更明顯） -->
    <ellipse cx="-22" cy="124" rx="6" ry="4" fill="#e0a0a0" opacity="0.45"/>

    <!-- 頭髮頂部 -->
    <path d="M-20,78 C-16,62 0,56 12,60 C22,64 28,74 24,84 C20,78 12,72 4,70 C-4,68 -12,70 -16,76" fill="url(#taoHair)"/>

    <!-- 瀏海（略散亂） -->
    <path d="M-28,88 C-32,78 -34,82 -34,90 C-32,94 -28,94 -28,92" fill="url(#taoHair)"/>
    <path d="M-24,82 C-26,74 -30,76 -30,86 C-28,90 -24,90 -24,88" fill="#2a1c10"/>
    <!-- 散落髮絲 -->
    <path d="M-32,94 C-34,100 -32,104" fill="none" stroke="url(#taoHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- 布巾束髮 -->
    <path d="M-22,74 C-14,68 4,66 18,70 C24,72 26,76 24,78" fill="none" stroke="#6a5a30" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 布巾結（略歪） -->
    <path d="M22,74 C26,70 28,66 26,62" fill="none" stroke="#6a5a30" stroke-width="3" stroke-linecap="round"/>
    <path d="M24,74 C28,72 30,68 28,64" fill="none" stroke="#4a3a20" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- 側髮 -->
    <path d="M20,86 C24,82 26,88 24,94 C22,98 20,96 20,92" fill="url(#taoHair)"/>

    <!-- 耳朵 -->
    <path d="M18,102 C22,98 24,104 22,110 C20,114 18,112 18,108" fill="url(#taoFace)" stroke="#d0b090" stroke-width="0.5"/>

    <!-- ===== 眼睛（雙眼幾乎閉上） ===== -->
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-10" cy="110" rx="6" ry="2" fill="#fff"/>
    <ellipse cx="-11" cy="110.5" rx="4" ry="1.5" fill="#2a2420"/>
    <ellipse cx="-11.5" cy="110" rx="2" ry="1" fill="#120c08"/>

    <!-- 右眼（勉強一線） -->
    <ellipse cx="4" cy="110" rx="6" ry="2.5" fill="#fff"/>
    <ellipse cx="3" cy="110.5" rx="4" ry="2" fill="#2a2420"/>
    <ellipse cx="2.5" cy="110" rx="2" ry="1.2" fill="#120c08"/>
    <circle cx="1" cy="109" r="0.8" fill="#fff" opacity="0.6"/>

    <!-- 眉間皺紋（深刻） -->
    <path d="M-3,103 C-2,101 0,101 1,103" fill="none" stroke="#c8a880" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-4,105 C-2,103.5 0,103.5 1,105" fill="none" stroke="#c8a880" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

    <!-- 鼻子 -->
    <path d="M-18,118 C-19,122 -17,126" fill="none" stroke="#c8a880" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 短鬚 -->
    <path d="M-12,134 C-10,136 -6,136 -4,134" fill="none" stroke="#2a1c10" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <!-- 嘴巴（喘息張開） -->
    <ellipse cx="-4" cy="132" rx="5" ry="4" fill="#703030"/>
    <!-- 上排牙 -->
    <path d="M-8,130 L0,130" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 汗滴（多顆） -->
    <path d="M-24,92 C-25,96 -24,100 -23,103" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-23" cy="104" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M20,92 C21,96 20,100" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="20" cy="101" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <!-- 額頭汗 -->
    <ellipse cx="-8" cy="78" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
  </g>
</svg>