<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 李斯 — 吉卜力2頭身 側面朝左 協防（挺身護人） -->
  <defs>
    <radialGradient id="lisiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f4e8d8"/>
      <stop offset="100%" stop-color="#e4d0bc"/>
    </radialGradient>
    <linearGradient id="lisiRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a3848"/>
      <stop offset="100%" stop-color="#2a2838"/>
    </linearGradient>
    <linearGradient id="lisiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2e3a"/>
      <stop offset="100%" stop-color="#1a1a24"/>
    </linearGradient>
    <linearGradient id="lisiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181010"/>
      <stop offset="100%" stop-color="#0c0606"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-8" cy="222" rx="28" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（挺身向前，前腿邁出） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="10" cy="195" rx="8" ry="16" fill="url(#lisiPants)" transform="rotate(-8,10,195)"/>
    <ellipse cx="8" cy="216" rx="9" ry="6.5" fill="#2a2030"/>
    <!-- 前腿（左腿，向前邁步） -->
    <ellipse cx="-16" cy="193" rx="8.5" ry="17" fill="url(#lisiPants)" transform="rotate(8,-16,193)"/>
    <ellipse cx="-20" cy="216" rx="9.5" ry="6.5" fill="#2a2030"/>

    <!-- ===== 身體（挺身，略前傾護人） ===== -->
    <ellipse cx="-4" cy="153" rx="22" ry="28" fill="url(#lisiRobe)" transform="rotate(-5,-4,153)"/>

    <!-- 領口 -->
    <path d="M-12,143 L-7,155 L-2,143" fill="none" stroke="#505060" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 衣襟線 -->
    <path d="M-7,155 L-7,176" fill="none" stroke="#505060" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

    <!-- 腰帶 -->
    <path d="M-24,178 Q-4,185 16,178" fill="none" stroke="#1a1a24" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-5" cy="182" r="2.5" fill="#88aa88" stroke="#6a8a6a" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手，握杖後段） ===== -->
    <path d="M14,146 Q22,140 10,148" fill="none" stroke="url(#lisiRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="10" cy="148" r="4.5" fill="url(#lisiFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，握杖前段，手臂向前伸出） ===== -->
    <path d="M-22,146 Q-40,136 -52,134" fill="none" stroke="url(#lisiRobe)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-52" cy="136" r="4.5" fill="url(#lisiFace)"/>

    <!-- ===== 文人杖（斜向前方，雙手持握，協防姿態） ===== -->
    <line x1="10" y1="148" x2="-70" y2="134" stroke="#4a3020" stroke-width="4" stroke-linecap="round"/>
    <!-- 頂端銅色裝飾圓球（前端，左側） -->
    <circle cx="-70" cy="134" r="4" fill="#b08040" stroke="#906830" stroke-width="0.5"/>
    <circle cx="-71" cy="132" r="1.2" fill="#d4a860" opacity="0.6"/>

    <!-- ===== 寬袖裝飾 ===== -->
    <path d="M-22,146 C-26,150 -30,154 -28,158" fill="url(#lisiRobe)" opacity="0.4"/>
    <path d="M14,146 C18,150 20,154 18,158" fill="url(#lisiRobe)" opacity="0.3"/>

    <!-- ===== 大頭（堅定護人表情） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="-2" cy="92" rx="38" ry="40" fill="url(#lisiHair)"/>

    <!-- 臉 -->
    <path d="M-26,86 C-30,96 -28,112 -22,122 C-16,130 -6,134 2,132 C10,130 14,122 18,112 C22,100 20,88 14,80 C8,74 0,72 -6,74 C-16,76 -24,80 -26,86Z" fill="url(#lisiFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-20,76 C-16,56 0,48 14,52 C26,56 32,68 28,80 C24,74 16,68 8,66 C0,64 -10,66 -16,72" fill="url(#lisiHair)"/>

    <!-- 瀏海 -->
    <path d="M-26,86 C-32,74 -34,78 -36,86 C-34,92 -28,94 -26,90" fill="url(#lisiHair)"/>
    <path d="M-22,80 C-26,68 -30,72 -30,82 C-28,88 -22,88 -22,84" fill="#181010"/>
    <path d="M-18,76 C-20,66 -24,68 -24,78 C-22,84 -18,84 -18,80" fill="url(#lisiHair)" opacity="0.9"/>

    <!-- 高冠 -->
    <rect x="-6" y="42" width="16" height="22" rx="2" fill="url(#lisiHair)" stroke="#181010" stroke-width="0.5"/>
    <path d="M-6,64 C-4,48 2,40 10,42 C16,46 16,56 14,64" fill="url(#lisiHair)"/>
    <ellipse cx="2" cy="66" rx="8" ry="3" fill="#181010" stroke="#0c0606" stroke-width="0.5"/>
    <path d="M10,66 C14,72 16,82 14,92" fill="none" stroke="#181010" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M12,66 C16,74 18,84 16,94" fill="none" stroke="#0c0606" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- 側髮 -->
    <path d="M18,82 C22,78 24,84 22,92 C20,98 18,96 18,90" fill="url(#lisiHair)"/>
    <path d="M20,90 C22,88 24,94 22,102 C20,108 18,106 18,100" fill="url(#lisiHair)" opacity="0.8"/>

    <!-- 耳朵 -->
    <path d="M16,100 C20,96 22,102 20,108 C18,112 16,110 16,106" fill="url(#lisiFace)" stroke="#dcc8b0" stroke-width="0.5"/>

    <!-- ===== 眼睛（堅定護人） ===== -->
    <!-- 左眼 -->
    <ellipse cx="-12" cy="106" rx="6.5" ry="7" fill="#fff"/>
    <ellipse cx="-13" cy="107" rx="4" ry="5" fill="#181820"/>
    <ellipse cx="-13.5" cy="106" rx="2.5" ry="3" fill="#080810"/>
    <circle cx="-15" cy="104" r="1.3" fill="#fff" opacity="0.7"/>

    <!-- 右眼 -->
    <ellipse cx="2" cy="106" rx="6.5" ry="7" fill="#fff"/>
    <ellipse cx="1" cy="107" rx="4" ry="5" fill="#181820"/>
    <ellipse cx="0.5" cy="106" rx="2.5" ry="3" fill="#080810"/>
    <circle cx="-1" cy="104" r="1.3" fill="#fff" opacity="0.7"/>

    <!-- 眉毛（堅定皺眉） -->
    <path d="M-18,100 C-14,97 -10,97 -6,99" fill="none" stroke="#181010" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-4,99 C0,97 4,97 8,100" fill="none" stroke="#181010" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M-18,114 C-19,118 -17,122" fill="none" stroke="#d8c0a8" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 八字鬍 -->
    <path d="M-16,126 C-14,129 -8,132 -4,131" fill="none" stroke="#181010" stroke-width="1" stroke-linecap="round"/>
    <path d="M-4,126 C-2,129 4,132 8,131" fill="none" stroke="#181010" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴（堅定一字線） -->
    <path d="M-12,126 C-8,126 -3,126 1,126" fill="none" stroke="#806050" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-12,126 C-13,127.5 -14,129" fill="none" stroke="#806050" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M1,126 C2,127.5 3,129" fill="none" stroke="#806050" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
