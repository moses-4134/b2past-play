<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 山賊頭目「鐵背狼」— 瀕死待機（HP <30%：半跪、刀撐地、喘息） -->
  <defs>
    <radialGradient id="banditBossCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b888"/>
      <stop offset="100%" stop-color="#b89868"/>
    </radialGradient>
    <linearGradient id="banditBossCArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a4828"/>
      <stop offset="100%" stop-color="#3a2c18"/>
    </linearGradient>
    <linearGradient id="banditBossCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3428"/>
      <stop offset="100%" stop-color="#1e1a10"/>
    </linearGradient>
    <linearGradient id="banditBossCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a1a08"/>
      <stop offset="100%" stop-color="#140a02"/>
    </linearGradient>
    <linearGradient id="banditBossCBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aaa"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="210" rx="36" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪姿態） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="10" cy="192" rx="11" ry="12" fill="url(#banditBossCPants)" transform="rotate(-20,10,192)"/>
      <ellipse cx="4" cy="204" rx="9" ry="5" fill="url(#banditBossCPants)"/>
      <ellipse cx="2" cy="208" rx="10" ry="5" fill="#3a2818"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-16" cy="188" rx="12" ry="16" fill="url(#banditBossCPants)" transform="rotate(12,-16,188)"/>
      <ellipse cx="-20" cy="208" rx="13" ry="6" fill="#3a2818"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="156" rx="30" ry="30" fill="url(#banditBossCArmor)" transform="rotate(-14,-4,156)"/>

      <!-- 破舊皮甲裂痕 -->
      <path d="M-10,146 L-6,158" fill="none" stroke="#2a1c0c" stroke-width="1" opacity="0.4"/>
      <path d="M8,150 L12,164" fill="none" stroke="#2a1c0c" stroke-width="0.8" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-16,136 L-8,150 L2,136" fill="none" stroke="#6a5030" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-30,176 Q-4,184 24,178" fill="none" stroke="#4a3820" stroke-width="7" stroke-linecap="round"/>
      <rect x="-10" y="176" width="9" height="9" rx="1" fill="#a08030" stroke="#806020" stroke-width="0.5"/>

      <!-- ===== 空手臂（撐在膝蓋上） ===== -->
      <path d="M-24,142 Q-32,158 -18,178" fill="none" stroke="url(#banditBossCArmor)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
      <path d="M-26,154 Q-30,152 -24,160" fill="none" stroke="#3a2818" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-16" cy="180" r="6" fill="url(#banditBossCFace)" opacity="0.85"/>

      <!-- ===== 武器手臂（刀插地撐身） ===== -->
      <path d="M28,142 Q48,148 56,162" fill="none" stroke="url(#banditBossCArmor)" stroke-width="13" stroke-linecap="round"/>
      <path d="M42,150 Q48,148 52,156" fill="none" stroke="#3a2818" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 刀（插入地面當支撐） ===== -->
      <path d="M58,164 L62,206 L64,212 L68,208 Q64,188 60,166 Z" fill="url(#banditBossCBlade)" stroke="#666" stroke-width="0.5"/>
      <line x1="58" y1="164" x2="62" y2="206" stroke="#888" stroke-width="2" stroke-linecap="round"/>
      <!-- 刀插入地面效果 -->
      <ellipse cx="63" cy="210" rx="5" ry="2" fill="#5a4a30" opacity="0.4"/>
      <!-- 刀護手 -->
      <line x1="64" y1="164" x2="52" y2="162" stroke="#806030" stroke-width="4" stroke-linecap="round"/>
      <!-- 刀柄 -->
      <line x1="56" y1="166" x2="54" y2="160" stroke="#4a3520" stroke-width="5" stroke-linecap="round"/>
      <circle cx="53" cy="158" r="3" fill="#806030"/>
      <!-- 握刀的手 -->
      <circle cx="56" cy="164" r="6.5" fill="url(#banditBossCFace)"/>

      <!-- ===== 大頭（低垂喘息） ===== -->
      <ellipse cx="0" cy="92" rx="42" ry="44" fill="url(#banditBossCHair)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-34,88 C-38,100 -36,118 -30,130 C-24,138 -10,142 2,140 C14,138 24,130 28,118 C32,106 30,92 24,84 C18,78 4,74 -6,76 C-20,78 -32,82 -34,88Z" fill="url(#banditBossCFace)"/>

      <!-- 傷疤 -->
      <path d="M-24,100 L-18,118" fill="none" stroke="#a08060" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      <path d="M-22,100 L-16,118" fill="none" stroke="#c8a888" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>

      <!-- 腮紅（痛苦更明顯） -->
      <ellipse cx="-24" cy="126" rx="8" ry="4.5" fill="#e0a0a0" opacity="0.45"/>

      <!-- 粗獷鬍渣 -->
      <ellipse cx="-8" cy="136" rx="14" ry="6" fill="#5a4030" opacity="0.25"/>

      <!-- 蓬亂頭髮頂部 -->
      <path d="M-22,78 C-18,56 0,48 16,52 C28,56 34,70 30,82 C26,74 18,68 8,66 C0,64 -12,66 -18,72" fill="url(#banditBossCHair)"/>

      <!-- 蓬亂瀏海（更散亂） -->
      <path d="M-32,88 C-36,76 -40,80 -40,90 C-38,96 -32,96 -32,92" fill="url(#banditBossCHair)"/>
      <path d="M-28,82 C-32,70 -36,74 -36,86 C-34,92 -28,90 -28,86" fill="#2a1a08"/>
      <path d="M-24,78 C-26,68 -30,70 -30,82 C-28,88 -24,86 -24,82" fill="url(#banditBossCHair)" opacity="0.9"/>
      <path d="M-36,84 C-42,76 -44,82 -40,92" fill="none" stroke="url(#banditBossCHair)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <!-- 散落髮絲 -->
      <path d="M-38,96 C-40,102 -38,106" fill="none" stroke="url(#banditBossCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 側髮 -->
      <path d="M24,84 C30,78 32,86 30,94 C28,100 24,98 24,92" fill="url(#banditBossCHair)"/>
      <path d="M26,94 C32,90 34,100 32,110 C30,116 26,112 26,106" fill="url(#banditBossCHair)" opacity="0.8"/>

      <!-- 耳朵 -->
      <path d="M22,102 C26,98 28,104 26,112 C24,116 22,114 22,108" fill="url(#banditBossCFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼幾乎閉上） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-12" cy="108" rx="6.5" ry="2" fill="#fff"/>
      <ellipse cx="-13" cy="108.5" rx="4" ry="1.5" fill="#402010"/>
      <ellipse cx="-13.5" cy="108" rx="2" ry="1" fill="#1a0800"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="108" rx="6.5" ry="2.5" fill="#fff"/>
      <ellipse cx="5" cy="108.5" rx="4" ry="2" fill="#402010"/>
      <ellipse cx="4.5" cy="108" rx="2" ry="1.2" fill="#1a0800"/>
      <circle cx="3" cy="107" r="0.8" fill="#fff" opacity="0.7"/>

      <!-- 粗眉毛（深皺） -->
      <path d="M-18,100 C-14,97 -10,99 -8,101" fill="none" stroke="#2a1a08" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M10,101 C12,99 16,97 20,99" fill="none" stroke="#2a1a08" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 眉間皺紋（深刻） -->
      <path d="M-5,101 C-3,99 -1,99 1,101" fill="none" stroke="#b09060" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-6,103 C-4,101.5 -1,101.5 1,103" fill="none" stroke="#b09060" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 鼻子 -->
      <path d="M-20,116 C-22,122 -18,126" fill="none" stroke="#a08058" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 嘴巴（喘息張嘴） -->
      <ellipse cx="-6" cy="133" rx="6" ry="5" fill="#703030"/>
      <path d="M-11,131 L-1,131" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴（多顆） -->
      <path d="M-28,90 C-29,94 -28,100 -27,103" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-27" cy="104" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M24,92 C25,96 24,100" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="24" cy="101" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-8" cy="78" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>
