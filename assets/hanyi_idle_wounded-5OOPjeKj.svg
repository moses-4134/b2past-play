<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 韓奕 — 吉卜力2頭身 面朝右（敵方）受傷待機（HP 30~60%：身體微傾、劍下垂、眼半瞇、咬牙、汗滴） -->
  <defs>
    <radialGradient id="hanyiWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8dcd0"/>
      <stop offset="100%" stop-color="#d8c8b8"/>
    </radialGradient>
    <linearGradient id="hanyiWRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#101830"/>
    </linearGradient>
    <linearGradient id="hanyiWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="hanyiWBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0c8d0"/>
      <stop offset="100%" stop-color="#808890"/>
    </linearGradient>
    <linearGradient id="hanyiWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="228" rx="28" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（重心偏移，前腿微彎） ===== -->
      <!-- 後腿 -->
      <ellipse cx="10" cy="198" rx="9" ry="17" fill="url(#hanyiWPants)" transform="rotate(-3,10,198)"/>
      <ellipse cx="8" cy="218" rx="10" ry="6" fill="#0e1828"/>
      <!-- 前腿（微彎支撐） -->
      <ellipse cx="-12" cy="196" rx="10" ry="18" fill="url(#hanyiWPants)" transform="rotate(8,-12,196)"/>
      <ellipse cx="-15" cy="218" rx="11" ry="6" fill="#0e1828"/>

      <!-- ===== 身體（前傾彎腰） ===== -->
      <ellipse cx="-2" cy="160" rx="24" ry="29" fill="url(#hanyiWRobe)" transform="rotate(-8,-2,160)"/>

      <!-- 長袍暗紋 -->
      <path d="M-12,150 L-6,172" fill="none" stroke="#2a3a5a" stroke-width="0.8" opacity="0.3"/>
      <path d="M2,147 L8,170" fill="none" stroke="#2a3a5a" stroke-width="0.8" opacity="0.3"/>

      <!-- 內袍領口 -->
      <path d="M-12,140 L-4,157 L6,140" fill="none" stroke="#3a4a6a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-24,182 Q-2,190 22,182" fill="none" stroke="#2a3a5a" stroke-width="5" stroke-linecap="round"/>
      <rect x="-6" y="181" width="7" height="7" rx="1" fill="#b0b8c0" stroke="#8090a0" stroke-width="0.5"/>

      <!-- 文書袋 -->
      <rect x="10" y="178" width="8" height="10" rx="2" fill="#2a1a10" stroke="#1a0a00" stroke-width="0.5" opacity="0.7"/>

      <!-- ===== 大頭（低頭） ===== -->
      <!-- 後腦整齊黑髮 -->
      <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#hanyiWHair)"/>

      <!-- 臉（微低頭） -->
      <path d="M-30,88 C-34,100 -32,116 -26,128 C-20,136 -8,140 2,138 C12,136 22,128 26,116 C30,104 28,92 22,84 C16,78 4,74 -4,76 C-18,78 -28,82 -30,88Z" fill="url(#hanyiWFace)"/>

      <!-- 腮紅（傷痛） -->
      <ellipse cx="-22" cy="124" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- 頭髮頂部 -->
      <path d="M-20,78 C-16,58 0,50 14,54 C26,58 30,70 26,82 C22,74 14,68 6,66 C-2,64 -12,66 -16,72" fill="url(#hanyiWHair)"/>

      <!-- 髮髻（略歪） -->
      <ellipse cx="2" cy="54" rx="10" ry="8" fill="url(#hanyiWHair)" transform="rotate(-5,2,54)"/>
      <path d="M-6,54 C-4,46 8,46 10,54" fill="url(#hanyiWHair)"/>

      <!-- 銀髮簪 -->
      <line x1="-8" y1="52" x2="14" y2="50" stroke="#b0b8c0" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="14" cy="50" r="2" fill="#c0c8d0" stroke="#8090a0" stroke-width="0.5"/>

      <!-- 瀏海 -->
      <path d="M-28,86 C-30,78 -28,74 -24,80" fill="url(#hanyiWHair)"/>
      <path d="M-24,82 C-26,74 -22,70 -18,78" fill="url(#hanyiWHair)" opacity="0.9"/>

      <!-- 側髮 -->
      <path d="M22,84 C26,80 28,86 26,94 C24,100 22,98 22,92" fill="url(#hanyiWHair)"/>

      <!-- 耳朵 -->
      <path d="M20,102 C24,98 26,104 24,112 C22,116 20,114 20,108" fill="url(#hanyiWFace)" stroke="#c8b8a8" stroke-width="0.5"/>

      <!-- ===== 眼睛（左眼半瞇忍痛、右眼微睜） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-12" cy="108" rx="6" ry="3.5" fill="#fff"/>
      <ellipse cx="-13" cy="108.5" rx="3.8" ry="2.8" fill="#1a2030"/>
      <ellipse cx="-13.5" cy="108" rx="2.2" ry="1.6" fill="#0a0a14"/>
      <circle cx="-15" cy="107" r="1" fill="#fff" opacity="0.4"/>

      <!-- 右眼（微睜） -->
      <ellipse cx="6" cy="108" rx="6" ry="4.5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.8" ry="3.8" fill="#1a2030"/>
      <ellipse cx="4.5" cy="108" rx="2.2" ry="2.2" fill="#0a0a14"/>
      <circle cx="3" cy="106.5" r="1.2" fill="#fff" opacity="0.4"/>

      <!-- 細長眉毛（皺起） -->
      <path d="M-18,101 C-14,99 -10,100 -7,102" fill="none" stroke="#1a1a20" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M10,102 C12,100 16,99 20,101" fill="none" stroke="#1a1a20" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 眉間皺紋 -->
      <path d="M-5,104 C-4,102 -2,102 -1,104" fill="none" stroke="#c8b8a0" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -14,124" fill="none" stroke="#c8b8a0" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-12,130 C-6,131 2,131 6,130" fill="none" stroke="#8a6860" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-12,130 C-13,132 -14,133" fill="none" stroke="#8a6860" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- ===== 空手臂（負x，按住腹部傷口） ===== -->
      <path d="M-20,150 Q-32,164 -20,178" fill="none" stroke="url(#hanyiWRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <path d="M-24,170 Q-22,176 -18,178" fill="none" stroke="#2a3a5a" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
      <circle cx="-20" cy="180" r="5" fill="url(#hanyiWFace)" opacity="0.8"/>

      <!-- ===== 武器手臂（正x，持劍下垂無力） ===== -->
      <path d="M22,150 Q38,158 48,172" fill="none" stroke="url(#hanyiWRobe)" stroke-width="11" stroke-linecap="round"/>
      <path d="M36,162 Q42,166 46,170" fill="none" stroke="#2a3a5a" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

      <!-- ===== 劍（正x，下垂無力） ===== -->
      <circle cx="48" cy="174" r="5.5" fill="url(#hanyiWFace)"/>
      <!-- 劍柄 -->
      <line x1="48" y1="170" x2="48" y2="166" stroke="#3a2a1a" stroke-width="4" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="48" cy="165" r="2.5" fill="#b0b8c0"/>
      <!-- 劍護手 -->
      <line x1="43" y1="170" x2="53" y2="168" stroke="#b0b8c0" stroke-width="3" stroke-linecap="round"/>
      <!-- 劍刃（下垂向地面） -->
      <line x1="47" y1="176" x2="42" y2="230" stroke="url(#hanyiWBlade)" stroke-width="3" stroke-linecap="round"/>
      <line x1="47" y1="176" x2="42" y2="230" stroke="#e0e8f0" stroke-width="0.8" opacity="0.4"/>
      <!-- 劍尖 -->
      <line x1="42" y1="230" x2="41.5" y2="236" stroke="#c0c8d0" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 汗滴 -->
      <path d="M-24,84 C-25,88 -24,92 -23,94" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-23" cy="95" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
    </g>
  </g>
</svg>