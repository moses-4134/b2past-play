<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 龍陽君精兵 — 瀕死待機（HP <30%：半跪、撐劍、喘息） -->
  <defs>
    <radialGradient id="lyEliteCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8c0a0"/>
      <stop offset="100%" stop-color="#c0a880"/>
    </radialGradient>
    <linearGradient id="lyEliteCArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a3a28"/>
      <stop offset="100%" stop-color="#0a2a18"/>
    </linearGradient>
    <linearGradient id="lyEliteCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2018"/>
      <stop offset="100%" stop-color="#101810"/>
    </linearGradient>
    <linearGradient id="lyEliteCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="lyEliteCBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d8e0"/>
      <stop offset="100%" stop-color="#909898"/>
    </linearGradient>
    <linearGradient id="lyEliteCHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a28"/>
      <stop offset="100%" stop-color="#0e2e1a"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="190" rx="28" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪） ===== -->
      <ellipse cx="8" cy="172" rx="8" ry="12" fill="url(#lyEliteCPants)" transform="rotate(-20,8,172)"/>
      <ellipse cx="2" cy="182" rx="7" ry="5" fill="url(#lyEliteCPants)"/>
      <ellipse cx="0" cy="186" rx="9" ry="5" fill="#1a1810"/>
      <ellipse cx="-12" cy="168" rx="9" ry="16" fill="url(#lyEliteCPants)" transform="rotate(12,-12,168)"/>
      <ellipse cx="-16" cy="186" rx="10" ry="6" fill="#1a1810"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="138" rx="22" ry="25" fill="url(#lyEliteCArmor)" transform="rotate(-14,-4,138)"/>

      <!-- 胸甲紋路 -->
      <path d="M-12,132 L-2,144 L8,132" fill="none" stroke="#0a2a18" stroke-width="1.2" opacity="0.5"/>

      <!-- 領口 -->
      <path d="M-14,122 L-7,132 L0,122" fill="none" stroke="#0e2e1a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 青銅肩甲（歪斜） -->
      <ellipse cx="-22" cy="126" rx="8" ry="5" fill="#8a7030" stroke="#6a5820" stroke-width="0.5" transform="rotate(-18,-22,126)"/>
      <ellipse cx="14" cy="128" rx="8" ry="5" fill="#8a7030" stroke="#6a5820" stroke-width="0.5" transform="rotate(4,14,128)" opacity="0.85"/>

      <!-- 腰帶 -->
      <path d="M-24,160 Q-4,168 16,162" fill="none" stroke="#4a3820" stroke-width="3" stroke-linecap="round"/>
      <rect x="-8" y="159" width="8" height="6" rx="1" fill="#8a7030" stroke="#6a5820" stroke-width="0.5"/>

      <!-- ===== 右手臂（撐在膝蓋上） ===== -->
      <path d="M14,128 Q22,144 14,162" fill="none" stroke="url(#lyEliteCArmor)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
      <circle cx="13" cy="164" r="4.5" fill="url(#lyEliteCFace)" opacity="0.85"/>

      <!-- ===== 左手臂（劍插地支撐） ===== -->
      <path d="M-20,126 Q-38,134 -46,148" fill="none" stroke="url(#lyEliteCArmor)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-46" cy="150" r="5" fill="url(#lyEliteCFace)"/>

      <!-- ===== 劍（插地支撐） ===== -->
      <line x1="-47" y1="152" x2="-50" y2="190" stroke="url(#lyEliteCBlade)" stroke-width="2.8" stroke-linecap="round"/>
      <ellipse cx="-50" cy="190" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>
      <line x1="-52" y1="151" x2="-42" y2="149" stroke="#8a7030" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-46" y1="149" x2="-44" y2="143" stroke="#4a3020" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 大頭（低垂） ===== -->
      <ellipse cx="-2" cy="86" rx="32" ry="34" fill="url(#lyEliteCHair)"/>

      <!-- 臉 -->
      <path d="M-24,82 C-28,92 -26,104 -20,114 C-14,122 -6,126 2,124 C8,122 12,116 16,106 C20,94 18,82 12,74 C6,68 0,66 -6,68 C-14,70 -22,76 -24,82Z" fill="url(#lyEliteCFace)"/>

      <!-- 短髮頂部 -->
      <path d="M-16,72 C-12,56 2,48 12,52 C20,56 24,66 20,76 C16,68 10,62 4,60 C-2,58 -8,60 -14,66" fill="url(#lyEliteCHair)"/>

      <!-- 頭盔（歪斜） -->
      <path d="M-26,72 C-22,60 -8,54 6,56 C14,58 22,64 20,72" fill="url(#lyEliteCHelmet)" stroke="#0e2e1a" stroke-width="0.5" transform="rotate(-4,-2,64)"/>
      <path d="M-28,72 C-28,70 -26,68 -22,70 L22,70 C24,70 24,74 22,74 L-26,74 C-28,74 -28,72 -28,72Z" fill="#8a7030" stroke="#6a5820" stroke-width="0.5" transform="rotate(-4,-2,72)"/>
      <circle cx="-2" cy="56" r="3" fill="#8a7030" stroke="#6a5820" stroke-width="0.5"/>

      <!-- 短瀏海（散亂） -->
      <path d="M-22,78 C-26,72 -28,76 -28,82 C-26,86 -22,84 -22,80" fill="url(#lyEliteCHair)"/>
      <path d="M-28,84 C-30,90 -28,94" fill="none" stroke="url(#lyEliteCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 側髮 -->
      <path d="M14,78 C20,72 22,80 20,88 C18,92 14,90 14,86" fill="url(#lyEliteCHair)"/>

      <!-- 耳朵 -->
      <path d="M12,96 C16,92 18,98 16,104 C14,108 12,106 12,102" fill="url(#lyEliteCFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- 腮紅 -->
      <ellipse cx="-18" cy="112" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

      <!-- ===== 眼睛（幾乎閉上） ===== -->
      <ellipse cx="-8" cy="100" rx="5.5" ry="2" fill="#fff"/>
      <ellipse cx="-9" cy="100.5" rx="3.2" ry="1.5" fill="#2a3028"/>
      <ellipse cx="-9.5" cy="100" rx="1.8" ry="1" fill="#1a1810"/>

      <ellipse cx="6" cy="100" rx="5.5" ry="2.5" fill="#fff"/>
      <ellipse cx="5" cy="100.5" rx="3.2" ry="2" fill="#2a3028"/>
      <ellipse cx="4.5" cy="100" rx="1.8" ry="1.2" fill="#1a1810"/>
      <circle cx="3" cy="99" r="0.5" fill="#fff" opacity="0.4"/>

      <!-- 眉間皺紋 -->
      <path d="M-1,94 C1,92 3,92 5,94" fill="none" stroke="#b09060" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-2,96 C0,94.5 3,94.5 5,96" fill="none" stroke="#b09060" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 眉毛 -->
      <path d="M-12,94 C-8,92 -6,93 -4,95" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,95 C10,93 12,92 16,94" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,108 C-16,112 -12,116" fill="none" stroke="#a08858" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（喘息） -->
      <ellipse cx="-4" cy="121" rx="5" ry="4.5" fill="#703030"/>
      <path d="M-8,119 L0,119" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴（多顆） -->
      <path d="M-20,78 C-21,82 -20,88 -19,91" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-19" cy="92" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M16,80 C17,84 16,88" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="16" cy="89" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <ellipse cx="-6" cy="68" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>
