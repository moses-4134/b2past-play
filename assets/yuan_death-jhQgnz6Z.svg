<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 相里衍 — 吉卜力2頭身 側面朝左 倒地 -->
  <defs>
    <radialGradient id="yuanFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8d0b8"/>
      <stop offset="100%" stop-color="#d0b090"/>
    </radialGradient>
    <linearGradient id="yuanRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#283050"/>
      <stop offset="100%" stop-color="#182038"/>
    </linearGradient>
    <linearGradient id="yuanPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="yuanHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="yuanSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e8f0"/>
      <stop offset="100%" stop-color="#a0a8b0"/>
    </linearGradient>
  </defs>

  <g transform="translate(78, 10)">
    <!-- 陰影（倒地用長橢圓） -->
    <ellipse cx="20" cy="222" rx="60" ry="4" fill="#000" opacity="0.08"/>

    <!-- 倒地的身體（rotate 90度） -->
    <g transform="rotate(90, -4, 176)">
      <!-- ===== 腿 ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="200" rx="10" ry="17" fill="url(#yuanPants)" transform="rotate(-5,12,200)"/>
      <ellipse cx="10" cy="217" rx="11" ry="7" fill="#2a2018"/>
      <!-- 前腿 -->
      <ellipse cx="-14" cy="198" rx="10" ry="17" fill="url(#yuanPants)" transform="rotate(5,-14,198)"/>
      <ellipse cx="-16" cy="217" rx="11" ry="7" fill="#2a2018"/>

      <!-- ===== 身體 ===== -->
      <ellipse cx="-2" cy="160" rx="28" ry="30" fill="url(#yuanRobe)"/>

      <!-- 衣襟交叉 -->
      <path d="M-14,138 L-6,158 L4,138" fill="none" stroke="#506080" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-28,181 Q-2,189 24,181" fill="none" stroke="#3a3050" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="-4" cy="185" rx="3.5" ry="3" fill="#706050"/>

      <!-- ===== 手臂（無力垂下） ===== -->
      <!-- 畫面右側手臂 -->
      <path d="M20,146 Q36,156 40,170" fill="none" stroke="url(#yuanRobe)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
      <circle cx="40" cy="172" r="5.5" fill="url(#yuanFace)" opacity="0.85"/>

      <!-- 畫面左側手臂 -->
      <path d="M-26,148 Q-38,156 -40,170" fill="none" stroke="url(#yuanRobe)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="-40" cy="172" r="5.5" fill="url(#yuanFace)"/>

      <!-- ===== 大頭 ===== -->
      <!-- 後腦髮量 -->
      <ellipse cx="0" cy="96" rx="40" ry="42" fill="url(#yuanHair)"/>

      <!-- 臉（瘦長臉） -->
      <path d="M-30,86 C-34,98 -34,116 -28,128 C-22,138 -10,142 0,140 C10,138 20,132 24,120 C28,108 26,92 20,84 C14,78 4,74 -6,76 C-18,78 -28,80 -30,86Z" fill="url(#yuanFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-20,78 C-16,58 0,50 14,54 C26,58 32,70 28,82 C24,76 16,68 8,66 C0,64 -10,66 -16,72" fill="url(#yuanHair)"/>

      <!-- 高髻（歪斜） -->
      <ellipse cx="2" cy="52" rx="8" ry="10" fill="url(#yuanHair)"/>
      <path d="M-4,44 C0,36 4,36 6,44" fill="url(#yuanHair)"/>
      <ellipse cx="2" cy="58" rx="9" ry="2.5" fill="#3a3050"/>

      <!-- 短瀏海 -->
      <path d="M-28,86 C-32,76 -34,80 -34,86 C-32,90 -28,90 -28,88" fill="url(#yuanHair)"/>
      <path d="M-24,80 C-26,72 -30,74 -30,82 C-28,86 -24,86 -24,84" fill="#888888"/>

      <!-- 側髮 -->
      <path d="M22,84 C26,80 28,86 26,92 C24,96 22,94 22,90" fill="url(#yuanHair)"/>

      <!-- 耳朵 -->
      <path d="M20,102 C24,98 26,104 24,110 C22,114 20,112 20,108" fill="url(#yuanFace)" stroke="#c0a880" stroke-width="0.5"/>

      <!-- ===== 眼睛（閉眼） ===== -->
      <!-- 左眼（閉眼，弧線） -->
      <path d="M-18,108 C-16,111 -10,111 -8,108" fill="none" stroke="#201828" stroke-width="2" stroke-linecap="round"/>

      <!-- 右眼（閉眼，弧線） -->
      <path d="M-2,108 C0,111 6,111 8,108" fill="none" stroke="#201828" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-18,116 C-19,120 -17,124" fill="none" stroke="#c0a080" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 長山羊鬚 -->
      <path d="M-10,134 C-8,140 -6,148 -7,154" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M-6,134 C-4,140 -3,148 -4,154" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M-2,134 C0,140 0,148 -1,154" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 嘴巴（微張無力） -->
      <ellipse cx="-6" cy="131" rx="4" ry="2" fill="#704038" opacity="0.6"/>
    </g>

    <!-- 掉落的劍（在身體旁邊，斜放地上） -->
    <line x1="-50" y1="205" x2="0" y2="198" stroke="url(#yuanSteel)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="-50" y1="205" x2="0" y2="198" stroke="#f0f4f8" stroke-width="1.5" opacity="0.3"/>
    <!-- 劍尖 -->
    <line x1="-50" y1="205" x2="-56" y2="206" stroke="#c8d0d8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <!-- 護手 -->
    <line x1="0" y1="195" x2="2" y2="202" stroke="#8a7848" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- 劍柄 -->
    <line x1="2" y1="199" x2="8" y2="198" stroke="#4a3828" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <!-- 柄底 -->
    <circle cx="10" cy="198" r="2.5" fill="#8a7848" opacity="0.7"/>
  </g>
</svg>
