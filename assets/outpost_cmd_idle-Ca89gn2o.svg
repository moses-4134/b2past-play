<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 前哨指揮官 — 吉卜力2頭身 面朝右（敵方）戰鬥待機（持劍） -->
  <defs>
    <radialGradient id="outpostCmdFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc0a0"/>
      <stop offset="100%" stop-color="#c4a480"/>
    </radialGradient>
    <linearGradient id="outpostCmdArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a4030"/>
      <stop offset="100%" stop-color="#2a3020"/>
    </linearGradient>
    <linearGradient id="outpostCmdPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3020"/>
      <stop offset="100%" stop-color="#1a2010"/>
    </linearGradient>
    <linearGradient id="outpostCmdHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#383830"/>
      <stop offset="100%" stop-color="#282820"/>
    </linearGradient>
    <linearGradient id="outpostCmdSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="220" rx="27" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（穩健站姿） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="197" rx="10" ry="17" fill="url(#outpostCmdPants)" transform="rotate(-5,12,197)"/>
      <ellipse cx="10" cy="213" rx="11" ry="7" fill="#1a2010"/>
      <!-- 前腿 -->
      <ellipse cx="-12" cy="195" rx="10" ry="17" fill="url(#outpostCmdPants)" transform="rotate(5,-12,195)"/>
      <ellipse cx="-14" cy="213" rx="11" ry="7" fill="#1a2010"/>

      <!-- ===== 身體（偏壯） ===== -->
      <ellipse cx="-2" cy="157" rx="25" ry="27" fill="url(#outpostCmdArmor)" transform="rotate(-3,-2,157)"/>

      <!-- 護臂裝飾 -->
      <path d="M-26,141 Q-28,138 -24,136" fill="none" stroke="#4a4a40" stroke-width="3" stroke-linecap="round"/>
      <path d="M20,141 Q22,138 18,136" fill="none" stroke="#4a4a40" stroke-width="3" stroke-linecap="round"/>

      <!-- 領口 -->
      <path d="M-10,137 L-4,149 L4,137" fill="none" stroke="#2a3020" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-25,176 Q-2,184 21,176" fill="none" stroke="#2a2818" stroke-width="5" stroke-linecap="round"/>
      <rect x="-6" y="174" width="7" height="7" rx="1" fill="#6a6050" stroke="#4a4030" stroke-width="0.5"/>

      <!-- ===== 角色左手（正x，空手護身） ===== -->
      <path d="M20,143 Q34,148 36,162" fill="none" stroke="url(#outpostCmdArmor)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <!-- 護腕 -->
      <path d="M30,152 Q34,150 36,156" fill="none" stroke="#4a4a40" stroke-width="3" stroke-linecap="round"/>
      <circle cx="36" cy="164" r="5" fill="url(#outpostCmdFace)" opacity="0.85"/>

      <!-- ===== 角色右手（負x，持劍身側） ===== -->
      <path d="M-24,143 Q-40,138 -48,134" fill="none" stroke="url(#outpostCmdArmor)" stroke-width="11" stroke-linecap="round"/>
      <!-- 護腕 -->
      <path d="M-36,140 Q-42,136 -46,134" fill="none" stroke="#4a4a40" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 劍（身側斜持，50.6px） ===== -->
      <line x1="-50" y1="128" x2="-50" y2="77.4" stroke="#aaa" stroke-width="4" stroke-linecap="round"/>
      <!-- 劍身反光 -->
      <line x1="-49" y1="126" x2="-49" y2="79" stroke="#ddd" stroke-width="1" opacity="0.3"/>
      <!-- 劍尖 -->
      <path d="M-54,77 L-50,67 L-46,77 Z" fill="url(#outpostCmdSteel)" stroke="#888" stroke-width="0.5"/>
      <!-- 劍格 -->
      <rect x="-56" y="128" width="12" height="3" rx="1" fill="#6a6050" stroke="#4a4030" stroke-width="0.5"/>
      <!-- 握劍的手 -->
      <circle cx="-50" cy="134" r="5.5" fill="url(#outpostCmdFace)"/>

      <!-- ===== 大頭（嚴厲冷靜） ===== -->
      <!-- 後腦髮量 -->
      <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#outpostCmdHair)"/>

      <!-- 臉（方正嚴厲） -->
      <path d="M-28,88 C-32,100 -30,116 -24,126 C-18,134 -6,138 4,136 C14,134 20,126 24,116 C28,104 26,90 20,82 C14,76 4,74 -6,76 C-16,78 -26,82 -28,88Z" fill="url(#outpostCmdFace)"/>

      <!-- 短髮頂部 -->
      <path d="M-18,78 C-14,62 2,54 16,58 C26,62 30,72 26,82 C22,76 14,70 6,68 C-2,66 -10,68 -14,74" fill="url(#outpostCmdHair)"/>

      <!-- 短瀏海 -->
      <path d="M-24,88 C-28,78 -30,82 -30,88 C-28,92 -24,92 -24,90" fill="url(#outpostCmdHair)"/>
      <path d="M-20,82 C-22,74 -26,76 -26,84 C-24,88 -20,88 -20,86" fill="#282820"/>

      <!-- 頭盔（暗灰） -->
      <path d="M-24,76 C-16,66 2,62 20,66 C28,68 32,72 30,76" fill="none" stroke="#4a4a40" stroke-width="4.5" stroke-linecap="round"/>
      <!-- 頭盔頂部片 -->
      <path d="M-4,64 C-2,56 4,54 10,56 C12,58 12,62 10,64" fill="#4a4a40" stroke="#3a3a30" stroke-width="0.5"/>

      <!-- 側髮 -->
      <path d="M22,82 C26,78 28,84 26,90 C24,94 22,92 22,88" fill="url(#outpostCmdHair)"/>

      <!-- 耳朵 -->
      <path d="M20,102 C24,98 26,104 24,110 C22,114 20,112 20,108" fill="url(#outpostCmdFace)" stroke="#b09868" stroke-width="0.5"/>

      <!-- ===== 眼睛（冷靜 rx=6 ry=6） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-12" cy="108" rx="6" ry="6" fill="#fff"/>
      <ellipse cx="-13" cy="109" rx="4" ry="4" fill="#2a2818"/>
      <ellipse cx="-13.5" cy="108" rx="2.5" ry="2.5" fill="#141008"/>
      <circle cx="-15" cy="106.5" r="1.2" fill="#fff" opacity="0.6"/>

      <!-- 右眼 -->
      <ellipse cx="4" cy="108" rx="6" ry="6" fill="#fff"/>
      <ellipse cx="3" cy="109" rx="4" ry="4" fill="#2a2818"/>
      <ellipse cx="2.5" cy="108" rx="2.5" ry="2.5" fill="#141008"/>
      <circle cx="1" cy="106.5" r="1.2" fill="#fff" opacity="0.6"/>

      <!-- 眉毛（嚴厲平直） -->
      <path d="M-18,101 C-14,99 -10,100 -6,102" fill="none" stroke="#282820" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M8,102 C12,100 16,99 20,101" fill="none" stroke="#282820" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-18,116 C-19,120 -17,124" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（緊閉嚴厲） -->
      <path d="M-14,131 C-10,131 -4,131 0,131" fill="none" stroke="#906050" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
