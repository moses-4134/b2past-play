<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 蒙驁 — 吉卜力2頭身 側面朝左 協防（挺身護人） -->
  <defs>
    <radialGradient id="mengaoFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dbb898"/>
      <stop offset="100%" stop-color="#c09878"/>
    </radialGradient>
    <linearGradient id="mengaoJacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a3828"/>
      <stop offset="100%" stop-color="#322018"/>
    </linearGradient>
    <linearGradient id="mengaoPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38352e"/>
      <stop offset="100%" stop-color="#201e18"/>
    </linearGradient>
    <linearGradient id="mengaoHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#d8d8d8"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <linearGradient id="mengaoSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
    <linearGradient id="mengaoArmor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#706050"/>
      <stop offset="100%" stop-color="#504030"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="225" rx="30" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（挺立站穩，前腿踏出護人） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="12" cy="198" rx="10" ry="18" fill="url(#mengaoPants)" transform="rotate(-3,12,198)"/>
    <ellipse cx="10" cy="216" rx="11" ry="7" fill="#3a2818"/>
    <!-- 前腿（左腿，向前踏出一步） -->
    <ellipse cx="-16" cy="196" rx="11" ry="19" fill="url(#mengaoPants)" transform="rotate(10,-16,196)"/>
    <ellipse cx="-20" cy="214" rx="12" ry="7" fill="#3a2818"/>

    <!-- ===== 身體（挺立微前傾，老將沉穩） ===== -->
    <ellipse cx="-2" cy="155" rx="30" ry="32" fill="url(#mengaoJacket)" transform="rotate(-5,-2,155)"/>

    <!-- 重甲護片 -->
    <rect x="-20" y="143" width="28" height="16" rx="3" fill="url(#mengaoArmor)" stroke="#3a2818" stroke-width="0.5" opacity="0.8"/>
    <line x1="-18" y1="151" x2="6" y2="151" stroke="#5a4838" stroke-width="0.8" opacity="0.5"/>

    <!-- 肩甲護肩 -->
    <rect x="-34" y="134" width="14" height="10" rx="3" fill="url(#mengaoArmor)" stroke="#3a2818" stroke-width="0.8"/>
    <rect x="18" y="134" width="14" height="10" rx="3" fill="url(#mengaoArmor)" stroke="#3a2818" stroke-width="0.8"/>

    <!-- 領口 -->
    <path d="M-12,137 L-6,151 L2,137" fill="none" stroke="#7a6048" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-30,180 Q-2,188 26,180" fill="none" stroke="#5a4030" stroke-width="7" stroke-linecap="round"/>
    <rect x="-9" y="177" width="10" height="10" rx="1.5" fill="#b09030" stroke="#8a7020" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手，張開護人手勢） ===== -->
    <path d="M20,144 Q36,150 44,158 Q50,164 54,170" fill="none" stroke="url(#mengaoJacket)" stroke-width="11" stroke-linecap="round"/>
    <!-- 護臂甲片 -->
    <path d="M36,152 Q40,150 42,156" fill="none" stroke="url(#mengaoArmor)" stroke-width="4" stroke-linecap="round"/>
    <!-- 手掌（張開護人手勢） -->
    <g transform="translate(54,170)">
      <circle cx="0" cy="0" r="6" fill="url(#mengaoFace)"/>
      <line x1="2" y1="-4" x2="5" y2="-9" stroke="url(#mengaoFace)" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="4" y1="-2" x2="8" y2="-6" stroke="url(#mengaoFace)" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="5" y1="0" x2="9" y2="-2" stroke="url(#mengaoFace)" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="4" y1="3" x2="8" y2="2" stroke="url(#mengaoFace)" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- ===== 畫面左側手臂（角色右手，握槍前段） ===== -->
    <path d="M-24,144 Q-42,136 -52,134" fill="none" stroke="url(#mengaoJacket)" stroke-width="12" stroke-linecap="round"/>
    <!-- 護臂甲片 -->
    <path d="M-38,138 Q-42,134 -48,134" fill="none" stroke="url(#mengaoArmor)" stroke-width="4" stroke-linecap="round"/>
    <!-- 握槍的手 -->
    <circle cx="-52" cy="136" r="6" fill="url(#mengaoFace)"/>

    <!-- ===== 槍（斜向前伸出護人） ===== -->
    <!-- 槍桿（從右後方到左前方，斜角保護） -->
    <line x1="30" y1="172" x2="-80" y2="124" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
    <!-- 槍頭（前方斜下指向敵方） -->
    <path d="M-93.5,118.5 L-79.5,120.5 L-80.5,128.0 Z" fill="url(#mengaoSteel)" stroke="#888" stroke-width="0.5"/>
    <!-- 槍纓 -->
    <line x1="-77" y1="124.5" x2="-76" y2="118.5" stroke="#a03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-80" y1="124" x2="-79" y2="118" stroke="#a03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-83" y1="123" x2="-82" y2="117" stroke="#a03030" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ===== 大頭（微前傾，堅毅護人） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="90" rx="42" ry="43" fill="url(#mengaoHair)"/>

    <!-- 臉 -->
    <path d="M-32,82 C-36,94 -34,110 -28,121 C-22,130 -10,134 0,132 C10,130 22,124 28,114 C32,102 30,86 24,78 C18,72 4,66 -6,68 C-20,70 -30,74 -32,82Z" fill="url(#mengaoFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-22,70 C-18,52 -2,44 12,48 C24,52 30,64 26,74 C22,68 14,62 6,60 C-2,58 -12,60 -18,66" fill="url(#mengaoHair)"/>

    <!-- 後方長髮垂下 -->
    <path d="M24,80 C30,88 32,102 30,114 C28,122 26,126 24,124" fill="none" stroke="#b0b0b0" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- 鐵盔 -->
    <path d="M-28,72 C-20,60 0,54 18,58 C28,62 34,68 30,74" fill="none" stroke="#707070" stroke-width="5" stroke-linecap="round"/>
    <path d="M-28,72 C-30,76 -32,80 -30,82" fill="none" stroke="#707070" stroke-width="4" stroke-linecap="round"/>
    <path d="M30,74 C32,78 32,82 30,84" fill="none" stroke="#707070" stroke-width="4" stroke-linecap="round"/>
    <path d="M-4,56 C-2,48 4,46 8,50 C10,52 10,56 8,58" fill="#707070" stroke="#505050" stroke-width="0.5"/>

    <!-- 短瀏海 -->
    <path d="M-30,80 C-34,70 -36,74 -36,80 C-34,84 -30,84 -30,82" fill="url(#mengaoHair)"/>

    <!-- 側髮 -->
    <path d="M22,78 C28,74 30,80 28,88 C26,94 24,92 22,86" fill="url(#mengaoHair)"/>

    <!-- 耳朵 -->
    <path d="M20,96 C24,92 26,98 24,104 C22,108 20,106 20,102" fill="url(#mengaoFace)" stroke="#b09070" stroke-width="0.5"/>

    <!-- ===== 眼睛（堅毅前視，護人決心） ===== -->
    <!-- 左眼 -->
    <ellipse cx="-12" cy="102" rx="5.5" ry="7" fill="#fff"/>
    <ellipse cx="-13" cy="103" rx="3.5" ry="4.5" fill="#383020"/>
    <ellipse cx="-13.5" cy="102" rx="2.2" ry="2.8" fill="#100804"/>
    <circle cx="-15" cy="100" r="1.2" fill="#fff" opacity="0.55"/>

    <!-- 右眼 -->
    <ellipse cx="4" cy="102" rx="5.5" ry="7" fill="#fff"/>
    <ellipse cx="3" cy="103" rx="3.5" ry="4.5" fill="#383020"/>
    <ellipse cx="2.5" cy="102" rx="2.2" ry="2.8" fill="#100804"/>
    <circle cx="1" cy="100" r="1.2" fill="#fff" opacity="0.55"/>

    <!-- 眉毛（堅毅皺眉） -->
    <path d="M-19,95 C-15,92 -9,92 -5,94" fill="none" stroke="#c0c0c0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-2,95 C2,92 7,92 10,94" fill="none" stroke="#c0c0c0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M-18,108 C-20,112 -19,118 -16,120" fill="none" stroke="#a88868" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 長白鬚（隨挺身略飄） -->
    <path d="M-16,124 C-18,130 -20,138 -22,148" fill="none" stroke="#c8c8c8" stroke-width="2" stroke-linecap="round"/>
    <path d="M-14,124 C-15,132 -16,142 -16,150" fill="none" stroke="#d0d0d0" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-8,126 C-8,134 -8,144 -8,154" fill="none" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round"/>
    <path d="M-4,126 C-4,134 -3,144 -2,152" fill="none" stroke="#c8c8c8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M0,124 C2,132 4,140 4,148" fill="none" stroke="#d0d0d0" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 嘴巴（緊閉，沉穩堅定） -->
    <path d="M-14,125 C-10,125 -4,125 0,125" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>