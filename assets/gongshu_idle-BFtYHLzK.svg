<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 公輸遠 — 吉卜力2頭身 側面朝左 待機（持機關弩警戒） -->
  <defs>
    <radialGradient id="gsFace" cx="40%" cy="35%" r="55%"><stop offset="0%" stop-color="#e8d4b8"/><stop offset="100%" stop-color="#d0b898"/></radialGradient>
    <linearGradient id="gsOutfit" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#485040"/><stop offset="100%" stop-color="#303828"/></linearGradient>
    <linearGradient id="gsPants" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a3830"/><stop offset="100%" stop-color="#222018"/></linearGradient>
    <linearGradient id="gsHair" x1="0.2" y1="0" x2="0.7" y2="1"><stop offset="0%" stop-color="#1a1410"/><stop offset="100%" stop-color="#0a0808"/></linearGradient>
  </defs>
  <g transform="translate(130, 14)">
    <ellipse cx="-4" cy="217" rx="26" ry="5" fill="#000" opacity="0.1"/>
    <!-- 腿 -->
    <ellipse cx="10" cy="196" rx="9" ry="15" fill="url(#gsPants)" transform="rotate(-3,10,196)"/>
    <ellipse cx="8" cy="211" rx="10" ry="6" fill="#2a2418"/>
    <ellipse cx="-10" cy="194" rx="10" ry="16" fill="url(#gsPants)" transform="rotate(4,-10,194)"/>
    <ellipse cx="-12" cy="211" rx="11" ry="6" fill="#2a2418"/>
    <!-- 身體（壯實工匠體型） -->
    <ellipse cx="-2" cy="163" rx="26" ry="28" fill="url(#gsOutfit)" transform="rotate(-3,-2,163)"/>
    <!-- 皮革工具帶 -->
    <path d="M-26,180 Q-2,188 22,180" fill="none" stroke="#5a4028" stroke-width="4" stroke-linecap="round"/>
    <rect x="-6" y="179" width="8" height="6" rx="1" fill="#7a5a30"/>
    <!-- 小工具袋（腰側） -->
    <rect x="14" y="176" width="6" height="8" rx="2" fill="#5a4028" stroke="#4a3020" stroke-width="0.5"/>
    <!-- 粗布領口 -->
    <path d="M-10,139 L-4,152 L4,139" fill="none" stroke="#6a6050" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 右手（垂放） -->
    <path d="M20,148 Q30,156 28,168" fill="none" stroke="url(#gsOutfit)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <circle cx="28" cy="170" r="5" fill="url(#gsFace)" opacity="0.85"/>
    <!-- 左手（持弩） -->
    <path d="M-24,150 Q-36,146 -40,148" fill="none" stroke="url(#gsOutfit)" stroke-width="10" stroke-linecap="round"/>
    <!-- 大頭 -->
    <ellipse cx="0" cy="92" rx="36" ry="38" fill="url(#gsHair)"/>
    <!-- 臉（方臉，老實敦厚） -->
    <path d="M-24,86 C-28,96 -26,112 -20,124 C-14,132 -4,136 6,134 C14,132 20,126 24,116 C28,104 26,92 20,84 C14,78 6,76 -2,78 C-12,80 -22,82 -24,86Z" fill="url(#gsFace)"/>
    <!-- 皺紋 -->
    <path d="M-16,96 C-14,94 -8,94" fill="none" stroke="#c0a080" stroke-width="0.8" opacity="0.35"/>
    <!-- 髮頂（粗獷短髮，束帶） -->
    <path d="M-16,78 C-12,62 4,54 16,58 C24,62 28,72 24,80 C20,74 12,68 4,66 C-4,64 -10,68 -14,74" fill="url(#gsHair)"/>
    <!-- 墨家額帶 -->
    <path d="M-28,82 C-20,76 0,74 20,78 C24,80 26,82" fill="none" stroke="#5a5048" stroke-width="3" stroke-linecap="round"/>
    <!-- 短碎髮 -->
    <path d="M-26,86 C-30,76 -32,80 -34,88 C-32,92 -28,92 -26,88" fill="url(#gsHair)"/>
    <path d="M-22,82 C-24,74 -28,76 -28,84 C-26,88 -22,88 -22,84" fill="#1a1410"/>
    <!-- 側髮 -->
    <path d="M22,84 C26,78 28,86 26,96 C24,100 22,98 22,92" fill="url(#gsHair)"/>
    <!-- 耳朵 -->
    <path d="M22,100 C26,96 28,102 26,108 C24,112 22,110 22,106" fill="url(#gsFace)" stroke="#d0b898" stroke-width="0.5"/>
    <!-- 眼睛（小而專注，工匠眼） -->
    <ellipse cx="-8" cy="106" rx="7" ry="6" fill="#fff"/>
    <ellipse cx="-9" cy="107" rx="4" ry="4.5" fill="#1a1408"/>
    <ellipse cx="-9.5" cy="106" rx="2" ry="2.5" fill="#0a0804"/>
    <circle cx="-11" cy="104.5" r="1.5" fill="#fff" opacity="0.6"/>
    <ellipse cx="8" cy="106" rx="7" ry="6" fill="#fff"/>
    <ellipse cx="7" cy="107" rx="4" ry="4.5" fill="#1a1408"/>
    <ellipse cx="6.5" cy="106" rx="2" ry="2.5" fill="#0a0804"/>
    <circle cx="5" cy="104.5" r="1.5" fill="#fff" opacity="0.6"/>
    <!-- 粗平眉 -->
    <path d="M-16,98 C-12,96 -6,96 -2,98" fill="none" stroke="#1a1410" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M2,98 C6,96 12,96 16,98" fill="none" stroke="#1a1410" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 鼻子 -->
    <path d="M-10,114 C-11,118 -9,120 -7,119" fill="none" stroke="#d0b898" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 嘴巴（緊閉木訥） -->
    <path d="M-6,126 C-3,127 1,127 4,126" fill="none" stroke="#806050" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 短鬚 -->
    <path d="M-6,130 C-3,132 1,132 4,130" fill="none" stroke="#1a1410" stroke-width="1" opacity="0.3"/>

    <!-- 機關弩（垂直持，最上層） -->
    <!-- 弩臂（橫向木架） -->
    <rect x="-56" y="142" width="28" height="5" rx="2" fill="#6a4a28" stroke="#5a3a18" stroke-width="0.5"/>
    <!-- 弩弓（左右對稱弧形） -->
    <path d="M-56,144 C-62,136 -64,130 -60,126" fill="none" stroke="#5a4020" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-56,144 C-62,152 -64,158 -60,162" fill="none" stroke="#5a4020" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 弩弦 -->
    <line x1="-60" y1="126" x2="-32" y2="144" stroke="#c0b090" stroke-width="1"/>
    <line x1="-60" y1="162" x2="-32" y2="144" stroke="#c0b090" stroke-width="1"/>
    <!-- 弩機（扳機處） -->
    <rect x="-32" y="142" width="6" height="8" rx="1" fill="#5a3a18"/>
    <!-- 握弩的手 -->
    <circle cx="-38" cy="150" r="5" fill="url(#gsFace)"/>
  </g>
</svg>
