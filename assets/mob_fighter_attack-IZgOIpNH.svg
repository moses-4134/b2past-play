<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 擂台武者 — 攻擊（劍斬出，前跨步） -->
  <defs>
    <radialGradient id="mobFighterFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e4c8a0"/>
      <stop offset="100%" stop-color="#d0ac84"/>
    </radialGradient>
    <linearGradient id="mobFighterCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a4048"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="mobFighterPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3038"/>
      <stop offset="100%" stop-color="#1a2028"/>
    </linearGradient>
    <linearGradient id="mobFighterHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobFighterSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccc"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-8" cy="202" rx="24" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前跨步） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="182" rx="9" ry="16" fill="url(#mobFighterPants)" transform="rotate(-8,12,182)"/>
      <ellipse cx="10" cy="196" rx="10" ry="6" fill="#2a2418"/>
      <!-- 前腿 -->
      <ellipse cx="-16" cy="178" rx="10" ry="17" fill="url(#mobFighterPants)" transform="rotate(12,-16,178)"/>
      <ellipse cx="-20" cy="194" rx="10" ry="6" fill="#2a2418"/>

      <!-- ===== 身體（前傾攻擊） ===== -->
      <ellipse cx="-4" cy="148" rx="25" ry="27" fill="url(#mobFighterCloth)" transform="rotate(-10,-4,148)"/>

      <!-- 護臂 -->
      <rect x="12" y="128" width="8" height="14" rx="3" fill="#2a3038" stroke="#1a2028" stroke-width="0.5" transform="rotate(-15,16,135)"/>
      <rect x="-24" y="128" width="8" height="14" rx="3" fill="#2a3038" stroke="#1a2028" stroke-width="0.5" transform="rotate(5,-20,135)"/>

      <!-- 領口 -->
      <path d="M-12,128 L-6,140 L2,128" fill="none" stroke="#4a5058" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 束腰 -->
      <path d="M-24,168 Q-4,174 18,168" fill="none" stroke="#1a2028" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 右手臂（角色左手，後擺） ===== -->
      <path d="M16,136 Q30,128 36,120" fill="none" stroke="url(#mobFighterCloth)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <circle cx="36" cy="118" r="5" fill="url(#mobFighterFace)" opacity="0.85"/>

      <!-- ===== 左手臂（角色右手，劍斬出） ===== -->
      <path d="M-22,134 Q-46,120 -58,112" fill="none" stroke="url(#mobFighterCloth)" stroke-width="10" stroke-linecap="round"/>

      <!-- ===== 劍（水平斬出，50.6px） ===== -->
      <!-- 劍身 -->
      <line x1="-112.1" y1="106.9" x2="-62" y2="114" stroke="url(#mobFighterSteel)" stroke-width="4" stroke-linecap="round"/>
      <!-- 劍格 -->
      <line x1="-66" y1="110" x2="-58" y2="118" stroke="#8a7a60" stroke-width="3" stroke-linecap="round"/>
      <!-- 握劍的手 -->
      <circle cx="-58" cy="114" r="5" fill="url(#mobFighterFace)"/>

      <!-- ===== 大頭（前傾） ===== -->
      <ellipse cx="-2" cy="98" rx="34" ry="36" fill="url(#mobFighterHair)" transform="rotate(-5,-2,98)"/>

      <!-- 臉 -->
      <path d="M-28,88 C-32,100 -30,116 -24,126 C-18,134 -6,138 4,136 C12,134 20,126 24,116 C28,104 26,90 20,82 C14,76 4,74 -6,76 C-16,78 -26,82 -28,88Z" fill="url(#mobFighterFace)" transform="rotate(-5,-2,104)"/>

      <!-- 短髮頂部 -->
      <path d="M-18,76 C-14,60 4,52 16,56 C24,60 28,70 24,80 C20,72 14,66 6,64 C0,62 -8,64 -16,70" fill="url(#mobFighterHair)"/>

      <!-- 頭帶 -->
      <path d="M-30,78 C-26,68 -8,62 10,64 C20,66 28,72 26,78" fill="#2a3038" stroke="#1a2028" stroke-width="0.5"/>
      <path d="M-32,78 C-32,76 -30,74 -26,76 L28,76 C30,76 30,80 28,80 L-30,80 C-32,80 -32,78 -32,78Z" fill="#2a3038" stroke="#1a2028" stroke-width="0.5"/>
      <path d="M26,78 Q34,82 38,90" fill="none" stroke="#2a3038" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 瀏海 -->
      <path d="M-24,84 C-28,76 -30,80 -30,88 C-28,92 -24,90 -24,86" fill="url(#mobFighterHair)"/>

      <!-- 側髮 -->
      <path d="M20,84 C26,78 28,86 26,94 C24,98 20,96 20,92" fill="url(#mobFighterHair)"/>

      <!-- 耳朵 -->
      <path d="M18,102 C22,98 24,104 22,110 C20,114 18,112 18,108" fill="url(#mobFighterFace)" stroke="#c09868" stroke-width="0.5"/>

      <!-- ===== 眼睛（用力瞪） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-10" cy="106" rx="6.5" ry="6" fill="#fff"/>
      <ellipse cx="-11" cy="107" rx="4" ry="4.2" fill="#2a2418"/>
      <ellipse cx="-11.5" cy="106" rx="2.2" ry="2.4" fill="#1a1810"/>
      <circle cx="-13" cy="105" r="1.2" fill="#fff" opacity="0.65"/>

      <!-- 右眼 -->
      <ellipse cx="8" cy="106" rx="6.5" ry="6" fill="#fff"/>
      <ellipse cx="7" cy="107" rx="4" ry="4.2" fill="#2a2418"/>
      <ellipse cx="6.5" cy="106" rx="2.2" ry="2.4" fill="#1a1810"/>
      <circle cx="5" cy="105" r="1.2" fill="#fff" opacity="0.65"/>

      <!-- 眉毛（皺眉用力） -->
      <path d="M-16,98 C-12,96 -8,97 -4,99" fill="none" stroke="#2a2420" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M10,99 C12,97 14,96 18,98" fill="none" stroke="#2a2420" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-16,114 C-18,118 -14,122" fill="none" stroke="#b8985c" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（張嘴喝） -->
      <ellipse cx="-3" cy="130" rx="7" ry="5" fill="#5a2828"/>
      <path d="M-10,128 C-6,126 0,126 4,128" fill="none" stroke="#805848" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
