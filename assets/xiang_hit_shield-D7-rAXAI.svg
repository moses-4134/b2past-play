<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 衛承昭 — 吉卜力2頭身 側面朝左 受擊 -->
  <defs>
    <radialGradient id="face" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fce8d0"/>
      <stop offset="100%" stop-color="#e8c4a0"/>
    </radialGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#506a6a"/>
      <stop offset="100%" stop-color="#304848"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="100%" stop-color="#222220"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#302010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b88830"/>
      <stop offset="100%" stop-color="#785018"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="223" rx="28" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（受擊後退） ===== -->
    <!-- 後腿（右腿，稍往後退） -->
    <ellipse cx="14" cy="200" rx="9" ry="16" fill="url(#pants)" transform="rotate(-5,14,200)"/>
    <ellipse cx="12" cy="216" rx="10" ry="7" fill="#3a2818"/>
    <!-- 前腿（左腿） -->
    <ellipse cx="-14" cy="198" rx="10" ry="17" fill="url(#pants)" transform="rotate(5,-14,198)"/>
    <ellipse cx="-16" cy="216" rx="11" ry="7" fill="#3a2818"/>

    <!-- ===== 身體（向後仰） ===== -->
    <ellipse cx="-2" cy="166" rx="26" ry="28" fill="url(#jacket)" transform="rotate(8,-2,166)"/>

    <!-- 領口 -->
    <path d="M-12,143 L-6,157 L2,143" fill="none" stroke="#8a8068" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-26,183 Q-2,191 22,183" fill="none" stroke="#6a5838" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-4" cy="187" r="3" fill="#c8a848"/>

    <!-- ===== 畫面右側手臂（角色左手，持盾被擊退） ===== -->
    <path d="M20,148 Q42,150 44,154" fill="none" stroke="url(#jacket)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <!-- 木質圓盾（被擊退後仰） -->
    <g transform="translate(44, 152) rotate(15)">
      <ellipse cx="0" cy="0" rx="22" ry="25" fill="url(#shield)"/>
      <path d="M-12,-18 Q0,-12 12,-18" fill="none" stroke="#8a6820" stroke-width="1.2" opacity="0.4"/>
      <path d="M-15,0 Q0,4 15,0" fill="none" stroke="#8a6820" stroke-width="1.2" opacity="0.4"/>
      <path d="M-12,14 Q0,19 12,14" fill="none" stroke="#8a6820" stroke-width="1.2" opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="22" ry="25" fill="none" stroke="#888" stroke-width="2"/>
      <circle cx="0" cy="0" r="5.5" fill="#aaa" stroke="#777" stroke-width="1.2"/>
      <circle cx="-1.5" cy="-1.5" r="2" fill="#ccc" opacity="0.5"/>
    </g>
    <circle cx="44" cy="156" r="5" fill="url(#face)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，持劍）被打甩開 ===== -->
    <path d="M-20,150 Q-38,155 -50,168" fill="none" stroke="url(#jacket)" stroke-width="11" stroke-linecap="round"/>
    <!-- 握劍的手 -->
    <circle cx="-50" cy="170" r="5.5" fill="url(#face)"/>

    <!-- ===== 劍（手臂甩開，劍指向下） ===== -->
    <!-- 劍身（從手掌向下延伸，共線） -->
    <line x1="-48" y1="172" x2="-41.5" y2="222.2" stroke="url(#steel)" stroke-width="4" stroke-linecap="round"/>
    <!-- 劍身亮線 -->
    <line x1="-48" y1="172" x2="-41.5" y2="222.2" stroke="#eee" stroke-width="1.5" opacity="0.4"/>
    <!-- 劍尖 -->
    <line x1="-41.5" y1="222.2" x2="-40.4" y2="228.4" stroke="#ccc" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 護手（垂直於劍身） -->
    <line x1="-55" y1="170" x2="-45" y2="168" stroke="#c0a050" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄（與劍身共線，柄在上方） -->
    <line x1="-49" y1="168" x2="-50" y2="162" stroke="#5a4530" stroke-width="4" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-50" cy="160" r="2.5" fill="#c0a050"/>

    <!-- ===== 大頭（受擊後仰） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="96" rx="40" ry="42" fill="url(#hairG)"/>

    <!-- 臉 -->
    <path d="M-30,90 C-34,102 -32,120 -26,130 C-20,138 -8,142 2,140 C12,138 20,130 24,120 C28,108 26,94 20,86 C14,80 4,76 -6,78 C-18,80 -28,82 -30,90Z" fill="url(#face)"/>

    <!-- 腮紅 -->
    <ellipse cx="-22" cy="124" rx="5" ry="3" fill="#e0a0a0" opacity="0.2"/>

    <!-- 頭髮頂部 -->
    <path d="M-20,80 C-16,60 0,52 14,56 C26,60 32,72 28,84 C24,78 16,72 8,70 C0,68 -10,70 -16,76" fill="url(#hairG)"/>

    <!-- 瀏海 -->
    <path d="M-30,90 C-36,78 -38,82 -40,90 C-38,96 -32,98 -30,94" fill="url(#hairG)"/>
    <path d="M-26,84 C-30,72 -34,76 -34,86 C-32,92 -26,92 -26,88" fill="#302010"/>
    <path d="M-22,80 C-24,70 -28,72 -28,82 C-26,88 -22,88 -22,84" fill="url(#hairG)" opacity="0.9"/>

    <!-- 呆毛 -->
    <path d="M-4,56 C-2,48 4,46 6,52" fill="none" stroke="url(#hairG)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 側髮 -->
    <path d="M22,86 C28,80 30,88 28,96 C26,102 22,100 22,94" fill="url(#hairG)"/>
    <path d="M24,94 C28,92 30,100 28,108 C26,114 22,110 22,104" fill="url(#hairG)" opacity="0.8"/>

    <!-- 馬尾 -->
    <path d="M24,80 C30,74 32,68 28,62" fill="none" stroke="url(#hairG)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="26" cy="80" rx="3" ry="2.5" fill="#6a5838"/>
    <path d="M26,82 C28,90 30,102 28,112" fill="none" stroke="url(#hairG)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <!-- 耳朵 -->
    <path d="M20,102 C24,98 26,104 24,110 C22,114 20,112 20,108" fill="url(#face)" stroke="#e0c0a0" stroke-width="0.5"/>

    <!-- ===== 眼睛（瞇眼痛苦，ry從7改為2.5） ===== -->
    <!-- 左眼 -->
    <ellipse cx="-12" cy="108" rx="7" ry="2.5" fill="#fff"/>
    <ellipse cx="-13" cy="109" rx="4.5" ry="2.2" fill="#3a2818"/>
    <ellipse cx="-13.5" cy="108" rx="2.5" ry="1.25" fill="#1a0c04"/>
    <circle cx="-15" cy="107" r="0.9" fill="#fff" opacity="0.9"/>

    <!-- 右眼（同大小） -->
    <ellipse cx="4" cy="108" rx="7" ry="2.5" fill="#fff"/>
    <ellipse cx="3" cy="109" rx="4.5" ry="2.2" fill="#3a2818"/>
    <ellipse cx="2.5" cy="108" rx="2.5" ry="1.25" fill="#1a0c04"/>
    <circle cx="1" cy="107" r="0.9" fill="#fff" opacity="0.9"/>

    <!-- 鼻子 -->
    <path d="M-18,116 C-19,120 -17,124" fill="none" stroke="#d8b090" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（痛苦張開） -->
    <ellipse cx="-4" cy="132" rx="3.5" ry="4" fill="#703030"/>
  </g>
</svg>
