<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 荒野流寇 — 攻擊（刀橫砍） -->
  <defs>
    <radialGradient id="mobRogueFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c4a470"/>
    </radialGradient>
    <linearGradient id="mobRogueArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a5040"/>
      <stop offset="100%" stop-color="#3a3830"/>
    </linearGradient>
    <linearGradient id="mobRoguePants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4030"/>
      <stop offset="100%" stop-color="#2e2820"/>
    </linearGradient>
    <linearGradient id="mobRogueHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#302820"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="mobRogueBlade" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-8" cy="207" rx="26" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前跨步） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="187" rx="9" ry="16" fill="url(#mobRoguePants)" transform="rotate(-8,12,187)"/>
      <ellipse cx="10" cy="202" rx="10" ry="6" fill="#3a2818"/>
      <!-- 前腿（前跨） -->
      <ellipse cx="-16" cy="183" rx="10" ry="17" fill="url(#mobRoguePants)" transform="rotate(12,-16,183)"/>
      <ellipse cx="-20" cy="200" rx="11" ry="6" fill="#3a2818"/>

      <!-- ===== 身體（前傾攻擊） ===== -->
      <ellipse cx="-4" cy="149" rx="23" ry="26" fill="url(#mobRogueArmor)" transform="rotate(-10,-4,149)"/>

      <!-- 皮甲細節 -->
      <path d="M-12,132 L-6,144 L2,132" fill="none" stroke="#4a4030" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- 護肩片 -->
      <ellipse cx="-22" cy="128" rx="8" ry="4" fill="#4a4030" stroke="#3a3020" stroke-width="0.8" transform="rotate(-15,-22,128)"/>
      <ellipse cx="14" cy="128" rx="8" ry="4" fill="#4a4030" stroke="#3a3020" stroke-width="0.8" transform="rotate(5,14,128)"/>
      <!-- 甲片縫線 -->
      <path d="M-18,140 L-15,156" fill="none" stroke="#2e2820" stroke-width="0.8" opacity="0.4"/>
      <path d="M12,140 L15,156" fill="none" stroke="#2e2820" stroke-width="0.8" opacity="0.4"/>

      <!-- 腰帶 -->
      <path d="M-24,168 Q-4,174 18,168" fill="none" stroke="#4a3820" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 右手臂（角色左手，後擺） ===== -->
      <path d="M16,138 Q30,130 36,124" fill="none" stroke="url(#mobRogueArmor)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <circle cx="36" cy="122" r="5" fill="url(#mobRogueFace)" opacity="0.85"/>

      <!-- ===== 左手臂（角色右手，刀橫砍） ===== -->
      <path d="M-22,136 Q-42,122 -56,112" fill="none" stroke="url(#mobRogueArmor)" stroke-width="10" stroke-linecap="round"/>

      <!-- ===== 刀（橫砍，近水平） ===== -->
      <path d="M-106,100 Q-96,102 -86,106 Q-74,110 -62,114 Q-56,116 -54,116 L-54,120 Q-58,120 -64,118 Q-76,114 -88,110 Q-98,106 -108,104 Z" fill="url(#mobRogueBlade)" stroke="#666" stroke-width="0.5"/>
      <!-- 刀脊 -->
      <path d="M-100,102 Q-80,108 -60,116" fill="none" stroke="#aaa" stroke-width="0.5" opacity="0.5"/>
      <!-- 刀柄 -->
      <rect x="-58" y="114" width="8" height="10" rx="1" fill="#4a3020"/>
      <rect x="-59" y="113" width="10" height="3" rx="1" fill="#6a5a40"/>
      <!-- 握刀的手 -->
      <circle cx="-54" cy="116" r="5.5" fill="url(#mobRogueFace)"/>

      <!-- ===== 大頭（前傾） ===== -->
      <ellipse cx="-2" cy="94" rx="36" ry="38" fill="url(#mobRogueHair)" transform="rotate(-5,-2,94)"/>

      <!-- 臉 -->
      <path d="M-24,88 C-28,98 -26,114 -20,126 C-14,134 -4,138 4,136 C12,134 18,126 22,116 C26,104 24,90 18,82 C12,76 2,72 -4,74 C-14,76 -22,82 -24,88Z" fill="url(#mobRogueFace)" transform="rotate(-5,-2,104)"/>

      <!-- 短髮 -->
      <path d="M-16,76 C-12,60 4,52 16,56 C24,60 28,70 24,80 C20,72 14,66 6,64 C0,62 -8,64 -14,70" fill="url(#mobRogueHair)"/>
      <path d="M-26,86 C-30,76 -32,80 -30,88 C-28,92 -26,90 -26,88" fill="url(#mobRogueHair)"/>
      <path d="M20,84 C24,78 26,84 24,92 C22,94 20,92 20,88" fill="url(#mobRogueHair)"/>

      <!-- 耳朵 -->
      <path d="M18,102 C22,98 24,104 22,110 C20,114 18,112 18,108" fill="url(#mobRogueFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（用力瞪） ===== -->
      <ellipse cx="-10" cy="106" rx="6" ry="6" fill="#fff"/>
      <ellipse cx="-11" cy="107" rx="3.5" ry="3.5" fill="#3a2818"/>
      <ellipse cx="-11.5" cy="106.5" rx="2" ry="2" fill="#1a1008"/>
      <circle cx="-13" cy="105.5" r="1.2" fill="#fff" opacity="0.6"/>

      <ellipse cx="6" cy="106" rx="6" ry="6" fill="#fff"/>
      <ellipse cx="5" cy="107" rx="3.5" ry="3.5" fill="#3a2818"/>
      <ellipse cx="4.5" cy="106.5" rx="2" ry="2" fill="#1a1008"/>
      <circle cx="3" cy="105.5" r="1.2" fill="#fff" opacity="0.6"/>

      <!-- 傷疤 -->
      <path d="M-16,98 L-6,106" fill="none" stroke="#a08060" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>

      <!-- 眉毛（皺眉用力） -->
      <path d="M-16,98 C-12,96 -8,98 -6,100" fill="none" stroke="#302820" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M8,100 C10,98 14,96 18,98" fill="none" stroke="#302820" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,114 C-16,118 -12,122" fill="none" stroke="#b09068" stroke-width="1.4" stroke-linecap="round"/>

      <!-- 鬍渣 -->
      <circle cx="-8" cy="128" r="0.5" fill="#4a3828" opacity="0.3"/>
      <circle cx="-4" cy="130" r="0.5" fill="#4a3828" opacity="0.3"/>
      <circle cx="0" cy="128" r="0.5" fill="#4a3828" opacity="0.3"/>
      <circle cx="4" cy="129" r="0.5" fill="#4a3828" opacity="0.3"/>

      <!-- 嘴巴（張嘴吼） -->
      <ellipse cx="-3" cy="130" rx="7" ry="5" fill="#4a2020"/>
      <path d="M-10,128 C-6,126 0,126 4,128" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
