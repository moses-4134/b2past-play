<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 李牧 — 吉卜力2頭身 面朝右（敵方）瀕死待機（HP <30%） -->
  <defs>
    <radialGradient id="limuCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c4a0"/>
      <stop offset="100%" stop-color="#cca880"/>
    </radialGradient>
    <linearGradient id="limuCArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a2838"/>
      <stop offset="100%" stop-color="#2a1828"/>
    </linearGradient>
    <linearGradient id="limuCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2028"/>
      <stop offset="100%" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="limuCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#484848"/>
      <stop offset="100%" stop-color="#303030"/>
    </linearGradient>
    <linearGradient id="limuCSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="208" rx="34" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪姿態） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="10" cy="186" rx="10" ry="12" fill="url(#limuCPants)" transform="rotate(-20,10,186)"/>
      <ellipse cx="4" cy="198" rx="8" ry="5" fill="url(#limuCPants)"/>
      <ellipse cx="2" cy="202" rx="10" ry="5" fill="#2a1818"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-14" cy="182" rx="10" ry="16" fill="url(#limuCPants)" transform="rotate(12,-14,182)"/>
      <ellipse cx="-18" cy="202" rx="11" ry="6" fill="#2a1818"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="150" rx="27" ry="27" fill="url(#limuCArmor)" transform="rotate(-14,-4,150)"/>

      <!-- 精良護肩 -->
      <rect x="-32" y="130" width="10" height="8" rx="2" fill="#3a2838" stroke="#8a7840" stroke-width="1"/>
      <rect x="16" y="130" width="10" height="8" rx="2" fill="#3a2838" stroke="#8a7840" stroke-width="1"/>

      <!-- 領口 -->
      <path d="M-14,132 L-8,144 L0,132" fill="none" stroke="#5a3848" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 金色飾邊 -->
      <path d="M-22,148 Q-4,151 14,148" fill="none" stroke="#8a7840" stroke-width="1" opacity="0.5"/>

      <!-- 腰帶 -->
      <path d="M-29,172 Q-4,180 21,172" fill="none" stroke="#3a2030" stroke-width="6" stroke-linecap="round"/>
      <rect x="-10" y="170" width="8" height="8" rx="1" fill="#8a7840" stroke="#6a5830" stroke-width="0.5"/>

      <!-- ===== 角色左手（正x，撐在膝蓋上） ===== -->
      <path d="M18,138 Q30,148 22,172" fill="none" stroke="url(#limuCArmor)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
      <circle cx="22" cy="174" r="5.5" fill="url(#limuCFace)" opacity="0.85"/>

      <!-- ===== 角色右手（負x，槍插地撐身體） ===== -->
      <path d="M-28,138 Q-46,132 -56,142" fill="none" stroke="url(#limuCArmor)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="-56" cy="144" r="5.5" fill="url(#limuCFace)"/>

      <!-- ===== 槍（插入地面當支撐） ===== -->
      <line x1="-56" y1="146" x2="-58" y2="204" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
      <!-- 槍插入地面效果 -->
      <ellipse cx="-58" cy="204" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>
      <!-- 槍頭（朝上，因為倒插） -->
      <path d="M-62,146 L-56,136 L-50,146 Z" fill="url(#limuCSteel)" stroke="#888" stroke-width="0.5"/>
      <!-- 槍纓（垂落） -->
      <line x1="-54" y1="146" x2="-52" y2="152" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-56" y1="148" x2="-54" y2="154" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>

      <!-- ===== 大頭（低垂喘息） ===== -->
      <!-- 後腦髮量 -->
      <ellipse cx="-2" cy="92" rx="40" ry="42" fill="url(#limuCHair)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-30,86 C-34,98 -32,114 -26,124 C-20,132 -8,136 2,134 C12,132 18,124 22,114 C26,102 24,88 18,80 C12,74 2,72 -8,74 C-18,76 -28,80 -30,86Z" fill="url(#limuCFace)"/>

      <!-- 腮紅（痛苦更明顯） -->
      <ellipse cx="-22" cy="120" rx="7" ry="4" fill="#e0a0a0" opacity="0.4"/>

      <!-- 頭髮頂部 -->
      <path d="M-22,76 C-18,58 -2,50 12,54 C24,58 30,70 26,80 C22,74 14,68 6,66 C-2,64 -12,66 -18,72" fill="url(#limuCHair)"/>

      <!-- 短瀏海（略散亂） -->
      <path d="M-28,86 C-32,76 -34,80 -34,86 C-32,90 -28,90 -28,88" fill="url(#limuCHair)"/>
      <path d="M-24,80 C-26,72 -30,74 -30,82 C-28,86 -24,86 -24,84" fill="#303030"/>
      <!-- 散落髮絲 -->
      <path d="M-32,90 C-34,96 -32,100" fill="none" stroke="url(#limuCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 將軍冠（略歪） -->
      <path d="M-26,74 C-18,66 0,62 18,66 C26,68 30,72 28,76" fill="none" stroke="#8a7840" stroke-width="4" stroke-linecap="round"/>
      <path d="M-8,64 C-6,56 0,54 6,56 C8,58 8,62 6,64" fill="#8a7840" stroke="#6a5830" stroke-width="0.5"/>

      <!-- 側髮 -->
      <path d="M20,82 C24,78 26,84 24,90 C22,94 20,92 20,88" fill="url(#limuCHair)"/>

      <!-- 耳朵 -->
      <path d="M18,100 C22,96 24,102 22,108 C20,112 18,110 18,106" fill="url(#limuCFace)" stroke="#c0a070" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼瞇成線） ===== -->
      <!-- 左眼（幾乎閉上） -->
      <ellipse cx="-14" cy="106" rx="6.5" ry="2" fill="#fff"/>
      <ellipse cx="-15" cy="106.5" rx="4" ry="1.5" fill="#1a2018"/>
      <ellipse cx="-15.5" cy="106" rx="2.5" ry="1" fill="#0a1008"/>

      <!-- 右眼（勉強睜一線） -->
      <ellipse cx="2" cy="106" rx="6.5" ry="2.5" fill="#fff"/>
      <ellipse cx="1" cy="106.5" rx="4" ry="2" fill="#1a2018"/>
      <ellipse cx="0.5" cy="106" rx="2.5" ry="1.2" fill="#0a1008"/>
      <circle cx="-1" cy="105" r="0.8" fill="#fff" opacity="0.6"/>

      <!-- 眉間皺紋（深刻） -->
      <path d="M-5,99 C-3,97 0,97 2,99" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-6,101 C-4,99.5 -1,99.5 1,101" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 眉毛 -->
      <path d="M-20,98 C-16,95 -12,97 -8,99" fill="none" stroke="#303030" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M6,99 C10,97 14,95 18,98" fill="none" stroke="#303030" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-20,114 C-21,118 -19,122" fill="none" stroke="#b89870" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 八字鬍 -->
      <path d="M-18,126 C-16,128 -12,129 -10,128" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-6,126 C-4,128 0,129 2,128" fill="none" stroke="#484848" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-8" cy="129" rx="5" ry="4.5" fill="#703030"/>
      <path d="M-12,127 L-4,127" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴（多顆） -->
      <path d="M-24,84 C-25,88 -24,94 -23,97" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-23" cy="98" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M18,86 C19,90 18,94" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="18" cy="95" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-10" cy="76" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>