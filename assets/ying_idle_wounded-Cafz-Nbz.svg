<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 嬴政 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體微傾、劍下垂但仍握、帝王隱忍） -->
  <defs>
    <radialGradient id="yingFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f6ece0"/>
      <stop offset="100%" stop-color="#e8d4c0"/>
    </radialGradient>
    <linearGradient id="yingRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a2840"/>
      <stop offset="100%" stop-color="#2a1830"/>
    </linearGradient>
    <linearGradient id="yingPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1e2e"/>
      <stop offset="100%" stop-color="#1a101a"/>
    </linearGradient>
    <linearGradient id="yingHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181010"/>
      <stop offset="100%" stop-color="#0c0606"/>
    </linearGradient>
    <linearGradient id="yingSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="220" rx="28" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（站穩但重心偏移） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="10" cy="198" rx="8.5" ry="15" fill="url(#yingPants)" transform="rotate(-3,10,198)"/>
    <ellipse cx="8" cy="214" rx="9.5" ry="6.5" fill="#2a1820"/>
    <!-- 前腿（左腿，微彎支撐） -->
    <ellipse cx="-14" cy="196" rx="9" ry="16" fill="url(#yingPants)" transform="rotate(7,-14,196)"/>
    <ellipse cx="-16" cy="214" rx="10" ry="6.5" fill="#2a1820"/>

    <!-- ===== 身體（前傾但仍保帝王氣勢） ===== -->
    <ellipse cx="-2" cy="160" rx="24" ry="28" fill="url(#yingRobe)" transform="rotate(-8,-2,160)"/>

    <!-- 領口（金邊） -->
    <path d="M-13,137 L-7,150 L-1,137" fill="none" stroke="#d4a840" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 金色邊飾（衣襟） -->
    <path d="M-7,150 L-7,176" fill="none" stroke="#d4a840" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- 腰帶 -->
    <path d="M-24,178 Q-2,185 20,178" fill="none" stroke="#3a2030" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-3" cy="182" r="3" fill="#d4a840"/>

    <!-- ===== 畫面右側手臂（角色左手，原本背在身後，現移到側面撐住） ===== -->
    <path d="M18,142 Q26,156 20,172" fill="none" stroke="url(#yingRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="20" cy="174" r="4.5" fill="url(#yingFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，持劍下垂但仍緊握） ===== -->
    <path d="M-23,145 Q-40,156 -50,170" fill="none" stroke="url(#yingRobe)" stroke-width="10" stroke-linecap="round"/>
    <!-- 握劍的手 -->
    <circle cx="-50" cy="172" r="5" fill="url(#yingFace)"/>

    <!-- ===== 劍（下垂，但仍緊握不放） ===== -->
    <!-- 劍身 -->
    <line x1="-49" y1="174" x2="-44" y2="224" stroke="url(#yingSteel)" stroke-width="4" stroke-linecap="round"/>
    <!-- 劍身亮線 -->
    <line x1="-49" y1="174" x2="-44" y2="224" stroke="#eee" stroke-width="1.5" opacity="0.4"/>
    <!-- 劍尖 -->
    <line x1="-44" y1="224" x2="-43.5" y2="230" stroke="#ccc" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 護手（金色華麗） -->
    <line x1="-56" y1="172" x2="-46" y2="169" stroke="#d4a840" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-56" cy="172" r="1.5" fill="#ffd860"/>
    <circle cx="-46" cy="169" r="1.5" fill="#ffd860"/>
    <!-- 劍柄 -->
    <line x1="-50" y1="169" x2="-52" y2="163" stroke="#3a2030" stroke-width="4" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-52" cy="161" r="2.5" fill="#d4a840"/>

    <!-- ===== 大頭（微低頭但仍昂然） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="95" rx="38" ry="40" fill="url(#yingHair)"/>

    <!-- 臉（微低頭） -->
    <path d="M-28,90 C-32,102 -30,118 -24,128 C-18,136 -6,140 4,138 C14,136 20,128 24,118 C28,106 26,92 20,84 C14,78 4,74 -4,76 C-16,78 -26,82 -28,90Z" fill="url(#yingFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-18,80 C-14,60 2,52 16,56 C28,60 34,72 30,84 C26,78 18,72 10,70 C2,68 -8,70 -14,76" fill="url(#yingHair)"/>

    <!-- 瀏海 -->
    <path d="M-28,90 C-34,78 -36,82 -38,90 C-36,96 -30,98 -28,94" fill="url(#yingHair)"/>
    <path d="M-24,84 C-28,72 -32,76 -32,86 C-30,92 -24,92 -24,88" fill="#181010"/>
    <path d="M-20,80 C-22,70 -26,72 -26,82 C-24,88 -20,88 -20,84" fill="url(#yingHair)" opacity="0.9"/>

    <!-- 高冠髮髻 -->
    <ellipse cx="4" cy="58" rx="10" ry="14" fill="url(#yingHair)"/>
    <path d="M-6,70 C-4,54 4,46 12,50 C18,54 18,64 14,72" fill="url(#yingHair)"/>
    <!-- 髮髻底部束帶 -->
    <ellipse cx="4" cy="72" rx="8" ry="3" fill="#181010" stroke="#2a1820" stroke-width="0.5"/>
    <!-- 金色簪子 -->
    <line x1="-8" y1="56" x2="16" y2="56" stroke="#d4a840" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-8" cy="56" r="2.5" fill="#ffd860"/>
    <circle cx="16" cy="56" r="1.5" fill="#d4a840"/>

    <!-- 側髮 -->
    <path d="M22,86 C26,82 28,88 26,96 C24,102 22,100 22,94" fill="url(#yingHair)"/>
    <path d="M24,94 C26,92 28,98 26,106 C24,112 22,110 22,104" fill="url(#yingHair)" opacity="0.8"/>

    <!-- 耳朵 -->
    <path d="M20,102 C24,98 26,104 24,110 C22,114 20,112 20,108" fill="url(#yingFace)" stroke="#e0ceb8" stroke-width="0.5"/>

    <!-- ===== 眼睛（左眼半瞇隱忍、右眼銳利微睜） ===== -->
    <!-- 左眼（半瞇） -->
    <ellipse cx="-11" cy="108" rx="7.5" ry="3.5" fill="#fff"/>
    <ellipse cx="-12" cy="109" rx="5" ry="3" fill="#1a1018"/>
    <ellipse cx="-12.5" cy="108.5" rx="3" ry="2" fill="#080408"/>
    <circle cx="-14" cy="107" r="1.2" fill="#fff" opacity="0.8"/>

    <!-- 右眼（微瞇但仍銳利） -->
    <ellipse cx="5" cy="108" rx="7.5" ry="5.5" fill="#fff"/>
    <ellipse cx="4" cy="109" rx="5" ry="4.5" fill="#1a1018"/>
    <ellipse cx="3.5" cy="108" rx="3" ry="2.8" fill="#080408"/>
    <circle cx="2" cy="106" r="1.8" fill="#fff" opacity="0.9"/>

    <!-- 眉間皺紋（帝王隱忍） -->
    <path d="M-5,102 C-4,100 -2,100 -1,102" fill="none" stroke="#d0b8a0" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- 鼻子 -->
    <path d="M-17,116 C-18,120 -16,124" fill="none" stroke="#d8c0a8" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（一字線更緊繃，帝王隱忍） -->
    <path d="M-12,130 C-8,130 -3,130 1,130" fill="none" stroke="#806050" stroke-width="2" stroke-linecap="round"/>
    <path d="M-12,130 C-13,131.5 -14,133" fill="none" stroke="#806050" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M1,130 C2,131.5 3,133" fill="none" stroke="#806050" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <!-- 汗滴（額頭） -->
    <path d="M-24,92 C-25,96 -24,100 -23,102" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-23" cy="103" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
  </g>
</svg>