<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 咸陽城門巨闕 — 吉卜力風格：秦帝都黑紅、雙闕高樓、落日肅殺 地平線 y=180 -->
  <defs>
    <linearGradient id="qgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2038"/>
      <stop offset="45%" stop-color="#8a3838"/>
      <stop offset="100%" stop-color="#d87848"/>
    </linearGradient>
    <linearGradient id="qgWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2622"/>
      <stop offset="100%" stop-color="#1a1614"/>
    </linearGradient>
    <linearGradient id="qgTower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2e28"/>
      <stop offset="100%" stop-color="#242018"/>
    </linearGradient>
    <linearGradient id="qgGate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0a08"/>
      <stop offset="100%" stop-color="#241612"/>
    </linearGradient>
    <linearGradient id="qgRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3830"/>
      <stop offset="100%" stop-color="#2a2018"/>
    </linearGradient>
    <radialGradient id="qgSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd090" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e08040" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#qgSky)"/>
  <!-- 落日 -->
  <circle cx="480" cy="150" r="120" fill="url(#qgSun)"/>
  <circle cx="480" cy="150" r="40" fill="#ffe0a0" opacity="0.5"/>
  <!-- 霞雲 -->
  <g opacity="0.4" fill="#c85838">
    <ellipse cx="200" cy="60" rx="100" ry="16"/><ellipse cx="760" cy="48" rx="110" ry="14"/>
  </g>

  <!-- 城牆主體（黑石） -->
  <rect x="0" y="60" width="300" height="120" fill="url(#qgWall)"/>
  <rect x="660" y="60" width="300" height="120" fill="url(#qgWall)"/>
  <g stroke="#0e0c0a" stroke-width="0.8" opacity="0.5">
    <line x1="0" y1="95" x2="300" y2="95"/><line x1="0" y1="130" x2="300" y2="130"/><line x1="0" y1="160" x2="300" y2="160"/>
    <line x1="660" y1="95" x2="960" y2="95"/><line x1="660" y1="130" x2="960" y2="130"/><line x1="660" y1="160" x2="960" y2="160"/>
  </g>

  <!-- 雙闕高樓（秦制標誌：門左右對稱高台闕樓） -->
  <g>
    <!-- 左闕 -->
    <rect x="215" y="0" width="90" height="180" fill="url(#qgTower)"/>
    <path d="M205,0 h110 l-16,-22 h-78 z" fill="#7a2828"/>
    <path d="M205,-22 h110 l-20,-20 h-70 z" fill="#5a1e1e"/>
    <rect x="230" y="30" width="60" height="26" fill="#1a1210"/>
    <rect x="230" y="72" width="60" height="26" fill="#1a1210"/>
    <line x1="260" y1="0" x2="260" y2="180" stroke="#c89040" stroke-width="0.8" opacity="0.3"/>
    <!-- 右闕 -->
    <rect x="655" y="0" width="90" height="180" fill="url(#qgTower)"/>
    <path d="M645,0 h110 l-16,-22 h-78 z" fill="#7a2828"/>
    <path d="M645,-22 h110 l-20,-20 h-70 z" fill="#5a1e1e"/>
    <rect x="670" y="30" width="60" height="26" fill="#1a1210"/>
    <rect x="670" y="72" width="60" height="26" fill="#1a1210"/>
    <line x1="700" y1="0" x2="700" y2="180" stroke="#c89040" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- 城門拱洞（高聳） -->
  <path d="M300,180 L300,86 Q480,4 660,86 L660,180 Z" fill="url(#qgGate)"/>
  <path d="M290,180 L290,80 Q480,-8 670,80 L670,180 L660,180 L660,86 Q480,4 300,86 L300,180 Z" fill="#3a2820"/>
  <!-- 拱頂金釘 -->
  <g fill="#c89040" opacity="0.55">
    <circle cx="480" cy="30" r="4"/><circle cx="440" cy="40" r="3.5"/><circle cx="520" cy="40" r="3.5"/><circle cx="405" cy="58" r="3"/><circle cx="555" cy="58" r="3"/>
  </g>
  <!-- 門洞內遠街（帝都燈火） -->
  <rect x="330" y="96" width="300" height="84" fill="#160e0a" opacity="0.7"/>
  <ellipse cx="480" cy="150" rx="70" ry="30" fill="#5a2818" opacity="0.6"/>

  <!-- 黑鐵大門（半開，朱釘） -->
  <rect x="308" y="96" width="66" height="84" fill="#1e1410" transform="skewY(-2)"/>
  <g fill="#a83828" opacity="0.7"><circle cx="326" cy="118" r="3"/><circle cx="350" cy="118" r="3"/><circle cx="326" cy="148" r="3"/><circle cx="350" cy="148" r="3"/></g>
  <rect x="586" y="96" width="66" height="86" fill="#1e1410" transform="skewY(2)"/>
  <g fill="#a83828" opacity="0.7"><circle cx="606" cy="118" r="3"/><circle cx="630" cy="118" r="3"/><circle cx="606" cy="148" r="3"/><circle cx="630" cy="148" r="3"/></g>

  <!-- 秦玄旗（黑底，垂於闕側） -->
  <rect x="196" y="70" width="6" height="90" fill="#141210"/>
  <path d="M202,74 h48 l-12,16 l12,16 h-48 z" fill="#1a1418" opacity="0.95"/>
  <circle cx="222" cy="90" r="7" fill="#c83828" opacity="0.6"/>
  <rect x="758" y="70" width="6" height="90" fill="#141210"/>
  <path d="M758,74 h-48 l12,16 l-12,16 h48 z" fill="#1a1418" opacity="0.95"/>
  <circle cx="738" cy="90" r="7" fill="#c83828" opacity="0.6"/>

  <!-- 石板路 -->
  <rect x="0" y="180" width="960" height="360" fill="url(#qgRoad)"/>
  <g stroke="#1a1410" stroke-width="1" opacity="0.35">
    <line x1="0" y1="222" x2="960" y2="222"/><line x1="0" y1="268" x2="960" y2="268"/><line x1="0" y1="318" x2="960" y2="318"/><line x1="0" y1="375" x2="960" y2="375"/><line x1="0" y1="440" x2="960" y2="440"/>
  </g>
  <g stroke="#1a1410" stroke-width="0.6" opacity="0.25">
    <line x1="120" y1="180" x2="120" y2="540"/><line x1="260" y1="180" x2="260" y2="540"/><line x1="400" y1="180" x2="400" y2="540"/><line x1="540" y1="180" x2="540" y2="540"/><line x1="680" y1="180" x2="680" y2="540"/><line x1="820" y1="180" x2="820" y2="540"/>
  </g>
  <!-- 落日在石板上的反光 -->
  <ellipse cx="480" cy="300" rx="140" ry="120" fill="#d87838" opacity="0.06"/>
  <line x1="0" y1="180" x2="960" y2="180" stroke="#120e0a" stroke-width="3"/>

  <!-- 餘燼粒子 -->
  <circle cx="400" cy="150" r="1.4" fill="#ffc070" opacity="0.4"/>
  <circle cx="560" cy="170" r="1.2" fill="#ffc070" opacity="0.32"/>
  <circle cx="300" cy="200" r="1.3" fill="#ff9850" opacity="0.3"/>
  <circle cx="700" cy="185" r="1.4" fill="#ff9850" opacity="0.28"/>
  <rect width="960" height="540" fill="#802020" opacity="0.06"/>
</svg>
