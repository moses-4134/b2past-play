<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 衛承昭 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪、撐劍、喘息） -->
  <defs>
    <radialGradient id="face" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fce8d0"/>
      <stop offset="100%" stop-color="#e8c4a0"/>
    </radialGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#506a6a"/>
      <stop offset="100%" stop-color="#304848"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="100%" stop-color="#222220"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#302010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 28)">
    <!-- 陰影（因半跪而更寬） -->
    <ellipse cx="-4" cy="210" rx="32" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（半跪姿態：前腿跪地、後腿撐住） ===== -->
    <!-- 後腿（右腿，膝蓋撐地） -->
    <ellipse cx="8" cy="192" rx="10" ry="12" fill="url(#pants)" transform="rotate(-20,8,192)"/>
    <!-- 膝蓋著地 -->
    <ellipse cx="2" cy="204" rx="8" ry="5" fill="url(#pants)"/>
    <ellipse cx="0" cy="208" rx="9" ry="5" fill="#3a2818"/>
    <!-- 前腿（左腿，彎曲支撐） -->
    <ellipse cx="-16" cy="188" rx="10" ry="16" fill="url(#pants)" transform="rotate(12,-16,188)"/>
    <ellipse cx="-20" cy="208" rx="11" ry="6" fill="#3a2818"/>

    <!-- ===== 身體（大幅前傾，接近彎腰） ===== -->
    <ellipse cx="-4" cy="160" rx="25" ry="26" fill="url(#jacket)" transform="rotate(-14,-4,160)"/>

    <!-- 領口 -->
    <path d="M-16,140 L-10,152 L-2,140" fill="none" stroke="#8a8068" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-28,176 Q-4,184 20,178" fill="none" stroke="#6a5838" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-6" cy="181" r="3" fill="#c8a848"/>

    <!-- ===== 畫面右側手臂（角色左手）撐在膝蓋上 ===== -->
    <path d="M16,146 Q24,160 16,180" fill="none" stroke="url(#jacket)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <circle cx="15" cy="182" r="5" fill="url(#face)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手）劍插地撐住身體 ===== -->
    <path d="M-24,146 Q-44,154 -54,168" fill="none" stroke="url(#jacket)" stroke-width="11" stroke-linecap="round"/>
    <!-- 握劍的手（雙手握） -->
    <circle cx="-54" cy="170" r="5.5" fill="url(#face)"/>

    <!-- ===== 劍（插入地面當支撐） ===== -->
    <!-- 劍身（直插地面） -->
    <line x1="-55" y1="172" x2="-58" y2="214" stroke="url(#steel)" stroke-width="4" stroke-linecap="round"/>
    <!-- 劍身亮線 -->
    <line x1="-55" y1="172" x2="-58" y2="214" stroke="#eee" stroke-width="1.5" opacity="0.4"/>
    <!-- 劍插入地面的效果 -->
    <ellipse cx="-58" cy="214" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>
    <!-- 護手 -->
    <line x1="-61" y1="170" x2="-51" y2="167" stroke="#c0a050" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-55" y1="167" x2="-56" y2="161" stroke="#5a4530" stroke-width="4" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-56" cy="159" r="2.5" fill="#c0a050"/>

    <!-- ===== 大頭（低垂、喘息） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="-2" cy="94" rx="40" ry="42" fill="url(#hairG)"/>

    <!-- 臉（明顯低頭） -->
    <path d="M-32,90 C-36,102 -34,120 -28,130 C-22,138 -10,142 0,140 C10,138 18,130 22,120 C26,108 24,94 18,86 C12,80 2,76 -8,78 C-20,80 -30,82 -32,90Z" fill="url(#face)"/>

    <!-- 腮紅（因痛苦更明顯） -->
    <ellipse cx="-24" cy="124" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

    <!-- 頭髮頂部 -->
    <path d="M-22,80 C-18,60 -2,52 12,56 C24,60 30,72 26,84 C22,78 14,72 6,70 C-2,68 -12,70 -18,76" fill="url(#hairG)"/>

    <!-- 瀏海（略散亂） -->
    <path d="M-32,90 C-38,78 -40,82 -42,92 C-40,98 -34,100 -32,96" fill="url(#hairG)"/>
    <path d="M-28,84 C-32,72 -36,76 -36,88 C-34,94 -28,94 -28,90" fill="#302010"/>
    <path d="M-24,82 C-26,70 -30,72 -30,84 C-28,90 -24,90 -24,86" fill="url(#hairG)" opacity="0.9"/>
    <!-- 散落髮絲 -->
    <path d="M-36,96 C-38,102 -36,106" fill="none" stroke="url(#hairG)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- 呆毛（下垂） -->
    <path d="M-6,58 C-5,53 2,54 3,57" fill="none" stroke="url(#hairG)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 側髮 -->
    <path d="M20,88 C26,82 28,90 26,98 C24,104 20,102 20,96" fill="url(#hairG)"/>
    <path d="M22,96 C26,94 28,102 26,110 C24,116 20,112 20,106" fill="url(#hairG)" opacity="0.8"/>

    <!-- 馬尾（散落） -->
    <path d="M22,82 C28,76 30,70 26,64" fill="none" stroke="url(#hairG)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="24" cy="82" rx="3" ry="2.5" fill="#6a5838"/>
    <path d="M24,84 C26,92 28,106 26,116" fill="none" stroke="url(#hairG)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <!-- 耳朵 -->
    <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,110" fill="url(#face)" stroke="#e0c0a0" stroke-width="0.5"/>

    <!-- ===== 眼睛（雙眼瞇成線，強忍痛苦） ===== -->
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-14" cy="110" rx="6.5" ry="2" fill="#fff"/>
    <ellipse cx="-15" cy="110.5" rx="4" ry="1.5" fill="#3a2818"/>
    <ellipse cx="-15.5" cy="110" rx="2" ry="1" fill="#1a0c04"/>

    <!-- 右眼（勉強睜一線） -->
    <ellipse cx="2" cy="110" rx="6.5" ry="2.5" fill="#fff"/>
    <ellipse cx="1" cy="110.5" rx="4" ry="2" fill="#3a2818"/>
    <ellipse cx="0.5" cy="110" rx="2" ry="1.2" fill="#1a0c04"/>
    <circle cx="-1" cy="109" r="0.8" fill="#fff" opacity="0.7"/>

    <!-- 眉間皺紋（深刻） -->
    <path d="M-7,101 C-5,99 -2,99 0,101" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-8,103 C-6,101.5 -3,101.5 -1,103" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

    <!-- 鼻子 -->
    <path d="M-20,118 C-21,122 -19,126" fill="none" stroke="#d8b090" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（喘息張開，露出牙齒） -->
    <ellipse cx="-6" cy="133" rx="5" ry="4.5" fill="#703030"/>
    <!-- 上排牙 -->
    <path d="M-10,131 L-2,131" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 汗滴（多顆） -->
    <path d="M-26,92 C-27,96 -26,102 -25,105" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-25" cy="106" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M22,94 C23,98 22,102" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="22" cy="103" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>

    <!-- 額頭汗 -->
    <ellipse cx="-8" cy="80" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
  </g>
</svg>
