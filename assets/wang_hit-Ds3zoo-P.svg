<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 王翦 — 吉卜力2頭身 側面朝左 受擊（將軍抗性強，微後仰） -->
  <defs>
    <radialGradient id="wangFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c0a0"/>
      <stop offset="100%" stop-color="#c8a888"/>
    </radialGradient>
    <linearGradient id="wangJacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a4030"/>
      <stop offset="100%" stop-color="#4a2820"/>
    </linearGradient>
    <linearGradient id="wangPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="100%" stop-color="#222220"/>
    </linearGradient>
    <linearGradient id="wangHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#484848"/>
    </linearGradient>
    <linearGradient id="wangSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="2" cy="222" rx="29" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（後退半步） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="14" cy="199" rx="10" ry="17" fill="url(#wangPants)" transform="rotate(3,14,199)"/>
    <ellipse cx="14" cy="215" rx="11" ry="7" fill="#3a2818"/>
    <!-- 前腿（左腿） -->
    <ellipse cx="-10" cy="197" rx="10" ry="17" fill="url(#wangPants)" transform="rotate(-3,-10,197)"/>
    <ellipse cx="-10" cy="215" rx="11" ry="7" fill="#3a2818"/>

    <!-- ===== 身體（微後仰） ===== -->
    <ellipse cx="2" cy="159" rx="27" ry="29" fill="url(#wangJacket)" transform="rotate(5,2,159)"/>

    <!-- 肩甲護肩 -->
    <rect x="-26" y="135" width="10" height="8" rx="2" fill="#5a3828" stroke="#4a2818" stroke-width="0.5"/>
    <rect x="22" y="135" width="10" height="8" rx="2" fill="#5a3828" stroke="#4a2818" stroke-width="0.5"/>

    <!-- 領口 -->
    <path d="M-8,137 L-2,151 L6,137" fill="none" stroke="#8a7058" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-23,179 Q2,187 27,179" fill="none" stroke="#5a4030" stroke-width="6" stroke-linecap="round"/>
    <rect x="-4" y="177" width="8" height="8" rx="1" fill="#c8a848" stroke="#a08030" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手） ===== -->
    <path d="M24,143 Q40,147 42,161" fill="none" stroke="url(#wangJacket)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
    <circle cx="42" cy="163" r="5.5" fill="url(#wangFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手） ===== -->
    <path d="M-22,145 Q-38,139 -46,137" fill="none" stroke="url(#wangJacket)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-46" cy="139" r="5.5" fill="url(#wangFace)"/>

    <!-- ===== 槍（略歪斜，受擊偏移） ===== -->
    <!-- 槍桿 -->
    <line x1="-58" y1="105" x2="42" y2="163" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
    <!-- 槍頭 -->
    <path d="M-70.1,98.0 L-56.0,101.5 L-60.0,108.5 Z" fill="url(#wangSteel)" stroke="#888" stroke-width="0.5"/>
    <!-- 槍纓 -->
    <line x1="-55.4" y1="106.5" x2="-52.4" y2="101.3" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-58" y1="105" x2="-55" y2="99.8" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-60.6" y1="103.5" x2="-57.6" y2="98.3" stroke="#c03030" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ===== 大頭（微後仰） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="4" cy="96" rx="40" ry="42" fill="url(#wangHair)"/>

    <!-- 臉（國字臉） -->
    <path d="M-26,88 C-30,100 -28,116 -22,126 C-16,134 -4,138 6,136 C16,134 26,128 30,118 C34,106 32,92 26,84 C20,78 8,74 -2,76 C-14,78 -24,82 -26,88Z" fill="url(#wangFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-16,78 C-12,60 4,52 18,56 C30,60 36,72 32,82 C28,76 20,70 12,68 C4,66 -6,68 -12,74" fill="url(#wangHair)"/>

    <!-- 短瀏海 -->
    <path d="M-24,88 C-28,78 -30,82 -30,88 C-28,92 -24,92 -24,90" fill="url(#wangHair)"/>
    <path d="M-20,82 C-22,74 -26,76 -26,84 C-24,88 -20,88 -20,86" fill="#484848"/>

    <!-- 武將頭冠 -->
    <path d="M-22,76 C-14,68 4,64 22,68 C30,70 34,74 32,78" fill="none" stroke="#a07840" stroke-width="4" stroke-linecap="round"/>
    <path d="M-4,66 C-2,58 4,56 10,58 C12,60 12,64 10,66" fill="#a07840" stroke="#806030" stroke-width="0.5"/>

    <!-- 側髮 -->
    <path d="M26,84 C30,80 32,86 30,92 C28,96 26,94 26,90" fill="url(#wangHair)"/>

    <!-- 耳朵 -->
    <path d="M24,102 C28,98 30,104 28,110 C26,114 24,112 24,108" fill="url(#wangFace)" stroke="#c0a080" stroke-width="0.5"/>

    <!-- ===== 眼睛（瞇眼忍痛） ===== -->
    <!-- 左眼（ry=2.5 瞇眼） -->
    <ellipse cx="-8" cy="108" rx="6" ry="2.5" fill="#fff"/>
    <ellipse cx="-9" cy="108.5" rx="4" ry="2" fill="#282018"/>
    <ellipse cx="-9.5" cy="108" rx="2.5" ry="1.5" fill="#100804"/>

    <!-- 右眼（同大小瞇眼） -->
    <ellipse cx="8" cy="108" rx="6" ry="2.5" fill="#fff"/>
    <ellipse cx="7" cy="108.5" rx="4" ry="2" fill="#282018"/>
    <ellipse cx="6.5" cy="108" rx="2.5" ry="1.5" fill="#100804"/>

    <!-- 鼻子 -->
    <path d="M-14,116 C-15,120 -13,124" fill="none" stroke="#b89870" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 八字鬍 -->
    <path d="M-12,128 C-10,130 -6,131 -4,130" fill="none" stroke="#606060" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,128 C2,130 6,131 8,130" fill="none" stroke="#606060" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 下巴短鬚 -->
    <path d="M-6,134 C-4,138 0,138 2,134" fill="none" stroke="#606060" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-2" y1="134" x2="-2" y2="138" stroke="#606060" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

    <!-- 嘴巴（咬牙） -->
    <path d="M-10,131 C-6,131 0,131 4,131" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8,131 L-8,133" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
    <path d="M-4,131 L-4,133" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
    <path d="M0,131 L0,133" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
  </g>
</svg>
