<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 巴清 — 吉卜力2頭身 側面朝左 勝利（扇子遮半臉，優雅嬌羞） -->
  <defs>
    <radialGradient id="qinFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fff2e8"/>
      <stop offset="100%" stop-color="#f4dcc8"/>
    </radialGradient>
    <linearGradient id="qinRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#8868a8"/>
      <stop offset="100%" stop-color="#6a4888"/>
    </linearGradient>
    <linearGradient id="qinSkirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7858a0"/>
      <stop offset="100%" stop-color="#5a3878"/>
    </linearGradient>
    <linearGradient id="qinHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a0a04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <linearGradient id="qinFanFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a8d8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9878b8" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 14)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="217" rx="26" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（放鬆站立） ===== -->
    <!-- 後腿 -->
    <ellipse cx="8" cy="196" rx="8" ry="15" fill="url(#qinSkirt)" transform="rotate(-3,8,196)"/>
    <ellipse cx="6" cy="211" rx="9" ry="6" fill="#5a4040"/>
    <!-- 前腿 -->
    <ellipse cx="-12" cy="194" rx="9" ry="16" fill="url(#qinSkirt)" transform="rotate(3,-12,194)"/>
    <ellipse cx="-14" cy="211" rx="10" ry="6" fill="#5a4040"/>

    <!-- ===== 身體（微後仰放鬆） ===== -->
    <ellipse cx="-2" cy="163" rx="24" ry="26" fill="url(#qinRobe)" transform="rotate(3,-2,163)"/>

    <!-- 金色腰帶 -->
    <path d="M-24,178 Q-2,186 20,178" fill="none" stroke="#c8a848" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-4" cy="182" r="3" fill="#dcc060"/>

    <!-- 白色領口 -->
    <path d="M-10,141 L-5,153 L2,141" fill="none" stroke="#f0ece8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- ===== 後方長髮（放鬆垂下） ===== -->
    <path d="M20,90 C22,110 24,140 22,168 C21,180 18,190 16,196" fill="none" stroke="url(#qinHair)" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
    <path d="M24,88 C28,108 30,138 28,168 C27,180 24,190 22,196" fill="none" stroke="url(#qinHair)" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手，自然垂放） ===== -->
    <path d="M18,146 Q30,156 28,170" fill="none" stroke="url(#qinRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="28" cy="172" r="4.5" fill="url(#qinFace)" opacity="0.85"/>

    <!-- ===== 大頭 ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="94" rx="38" ry="40" fill="url(#qinHair)"/>

    <!-- 臉（瓜子臉） -->
    <path d="M-26,88 C-30,98 -28,114 -22,124 C-16,132 -6,136 4,134 C12,132 18,126 22,116 C26,104 24,92 18,84 C12,78 4,76 -4,78 C-14,80 -24,82 -26,88Z" fill="url(#qinFace)"/>

    <!-- 腮紅（開心時更明顯） -->
    <ellipse cx="-20" cy="122" rx="7" ry="4" fill="#e89090" opacity="0.4"/>

    <!-- 頭髮頂部 -->
    <path d="M-18,78 C-14,58 2,50 16,54 C26,58 30,70 26,82 C22,76 14,70 6,68 C-2,66 -10,68 -14,74" fill="url(#qinHair)"/>

    <!-- 瀏海 -->
    <path d="M-28,88 C-34,76 -36,80 -38,88 C-36,94 -30,96 -28,92" fill="url(#qinHair)"/>
    <path d="M-24,82 C-28,70 -32,74 -32,84 C-30,90 -24,90 -24,86" fill="#1a0a04"/>
    <path d="M-20,78 C-22,68 -26,70 -26,80 C-24,86 -20,86 -20,82" fill="url(#qinHair)" opacity="0.9"/>

    <!-- 金色髮簪 -->
    <line x1="-6" y1="62" x2="14" y2="58" stroke="#dcc060" stroke-width="2" stroke-linecap="round"/>
    <circle cx="15" cy="57" r="2.5" fill="#dcc060"/>
    <circle cx="15" cy="57" r="1.2" fill="#f0e080"/>

    <!-- 側髮 -->
    <path d="M22,84 C28,78 30,86 28,96" fill="url(#qinHair)" stroke="none"/>
    <path d="M26,96 C28,106 28,118 26,130 C24,142 22,152 20,160" fill="none" stroke="url(#qinHair)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M20,160 C18,168 16,174 15,178" fill="none" stroke="url(#qinHair)" stroke-width="6" stroke-linecap="round" opacity="0.65"/>

    <!-- 前側髮絲 -->
    <path d="M-30,92 C-32,104 -32,118 -30,132" fill="none" stroke="url(#qinHair)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- 耳朵 -->
    <path d="M20,100 C24,96 26,102 24,108 C22,112 20,110 20,106" fill="url(#qinFace)" stroke="#f0d4c0" stroke-width="0.5"/>

    <!-- ===== 眼睛（開心彎彎眼） ===== -->
    <!-- 左眼睫毛 -->
    <path d="M-17,98 C-14,96 -8,96 -5,98" fill="none" stroke="#1a0a04" stroke-width="0.8" opacity="0.4"/>
    <!-- 左眼 -->
    <ellipse cx="-10" cy="106" rx="8" ry="8" fill="#fff"/>
    <ellipse cx="-11" cy="107" rx="5" ry="5.5" fill="#2a1810"/>
    <ellipse cx="-11.5" cy="106" rx="2.5" ry="3" fill="#0a0804"/>
    <circle cx="-13" cy="104" r="2.5" fill="#fff" opacity="0.7"/>
    <circle cx="-9" cy="109" r="1.2" fill="#fff" opacity="0.5"/>

    <!-- 右眼睫毛 -->
    <path d="M-1,98 C2,96 8,96 11,98" fill="none" stroke="#1a0a04" stroke-width="0.8" opacity="0.4"/>
    <!-- 右眼 -->
    <ellipse cx="6" cy="106" rx="8" ry="8" fill="#fff"/>
    <ellipse cx="5" cy="107" rx="5" ry="5.5" fill="#2a1810"/>
    <ellipse cx="4.5" cy="106" rx="2.5" ry="3" fill="#0a0804"/>
    <circle cx="3" cy="104" r="2.5" fill="#fff" opacity="0.7"/>
    <circle cx="7" cy="109" r="1.2" fill="#fff" opacity="0.5"/>

    <!-- 鼻子 -->
    <path d="M-14,116 C-14.5,118 -13.5,119" fill="none" stroke="#f0d4c0" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴（開心微笑，被扇子遮住下半所以只露眼睛上方的笑意） -->
    <path d="M-10,124 C-6,130 -1,130 3,124" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>

    <!-- ===== 畫面左側手臂（角色右手，持展開扇子遮半臉） ===== -->
    <path d="M-22,144 Q-30,128 -28,118" fill="none" stroke="url(#qinRobe)" stroke-width="10" stroke-linecap="round"/>
    <!-- 握扇的手 -->
    <circle cx="-28" cy="120" r="5" fill="url(#qinFace)"/>

    <!-- 扇子展開遮住下半臉（在臉前方） -->
    <path d="M-28,118 L-38,100 A30,30 0 0,1 -20,94 L-28,118Z" fill="url(#qinFanFace)" stroke="#c8a848" stroke-width="0.5"/>
    <path d="M-28,118 L-20,94 A28,28 0 0,1 -8,96 L-28,118Z" fill="url(#qinFanFace)" stroke="#c8a848" stroke-width="0.5" opacity="0.8"/>
    <path d="M-28,118 L-8,96 A26,26 0 0,1 0,100 L-28,118Z" fill="url(#qinFanFace)" stroke="#c8a848" stroke-width="0.5" opacity="0.6"/>
    <!-- 扇骨線 -->
    <line x1="-28" y1="118" x2="-38" y2="100" stroke="#c8a848" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-28" y1="118" x2="-30" y2="96" stroke="#c8a848" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-28" y1="118" x2="-20" y2="94" stroke="#c8a848" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-28" y1="118" x2="-12" y2="94" stroke="#c8a848" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-28" y1="118" x2="-4" y2="96" stroke="#c8a848" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-28" y1="118" x2="0" y2="100" stroke="#c8a848" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 扇緣弧線 -->
    <path d="M-38,100 A30,30 0 0,1 0,100" fill="none" stroke="#c8a848" stroke-width="1.5"/>
  </g>
</svg>
