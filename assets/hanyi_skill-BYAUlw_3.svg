<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 韓奕 趙國密使 — 吉卜力2頭身 面朝右（敵方）技能：優雅橫斬 -->
  <defs>
    <radialGradient id="hanyiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8dcd0"/>
      <stop offset="100%" stop-color="#d8c8b8"/>
    </radialGradient>
    <linearGradient id="hanyiRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#101830"/>
    </linearGradient>
    <linearGradient id="hanyiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="hanyiBlade" x1="1" y1="0" x2="0" y2="0.2">
      <stop offset="0%" stop-color="#c0c8d0"/>
      <stop offset="100%" stop-color="#808890"/>
    </linearGradient>
    <linearGradient id="hanyiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-8" cy="228" rx="32" ry="5" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（旋斬弓步，寬站） ===== -->
      <!-- 後腿 -->
      <ellipse cx="16" cy="196" rx="9" ry="18" fill="url(#hanyiPants)" transform="rotate(-10,16,196)"/>
      <ellipse cx="14" cy="218" rx="10" ry="6" fill="#0e1828"/>
      <!-- 前腿（大步前踏） -->
      <ellipse cx="-20" cy="194" rx="10" ry="19" fill="url(#hanyiPants)" transform="rotate(14,-20,194)"/>
      <ellipse cx="-24" cy="218" rx="11" ry="6" fill="#0e1828"/>

      <!-- ===== 身體（旋轉斬擊） ===== -->
      <ellipse cx="-4" cy="156" rx="24" ry="30" fill="url(#hanyiRobe)" transform="rotate(-12,-4,156)"/>

      <!-- 長袍暗紋 -->
      <path d="M-14,146 L-8,168" fill="none" stroke="#2a3a5a" stroke-width="0.8" opacity="0.3"/>
      <path d="M0,143 L6,166" fill="none" stroke="#2a3a5a" stroke-width="0.8" opacity="0.3"/>
      <path d="M-22,158 L-16,178" fill="none" stroke="#2a3a5a" stroke-width="0.8" opacity="0.25"/>
      <path d="M12,150 L16,170" fill="none" stroke="#2a3a5a" stroke-width="0.8" opacity="0.25"/>

      <!-- 袍擺飄動效果 -->
      <path d="M-24,178 Q-30,184 -28,190" fill="none" stroke="#1a2a4a" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
      <path d="M18,176 Q24,182 22,188" fill="none" stroke="#1a2a4a" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

      <!-- 內袍領口 -->
      <path d="M-14,136 L-6,153 L4,136" fill="none" stroke="#3a4a6a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 隱藏輕甲暗示 -->
      <path d="M-20,153 Q-4,156 14,153" fill="none" stroke="#4a5a7a" stroke-width="0.8" opacity="0.25"/>

      <!-- 腰帶 -->
      <path d="M-26,178 Q-4,186 20,178" fill="none" stroke="#2a3a5a" stroke-width="5" stroke-linecap="round"/>
      <rect x="-8" y="177" width="7" height="7" rx="1" fill="#b0b8c0" stroke="#8090a0" stroke-width="0.5"/>

      <!-- 文書袋（飄動） -->
      <rect x="10" y="174" width="8" height="10" rx="2" fill="#2a1a10" stroke="#1a0a00" stroke-width="0.5" opacity="0.7" transform="rotate(-8,14,179)"/>

      <!-- ===== 大頭（冷酷決斷） ===== -->
      <!-- 後腦 -->
      <ellipse cx="-2" cy="92" rx="38" ry="40" fill="url(#hanyiHair)" transform="rotate(-6,-2,92)"/>

      <!-- 臉 -->
      <path d="M-32,84 C-36,96 -34,112 -28,124 C-22,132 -10,136 0,134 C10,132 20,124 24,112 C28,100 26,88 20,80 C14,74 2,70 -6,72 C-20,74 -30,78 -32,84Z" fill="url(#hanyiFace)"/>

      <!-- 整齊頭髮頂部 -->
      <path d="M-22,74 C-18,54 -2,46 12,50 C24,54 28,66 24,78 C20,70 12,64 4,62 C-4,60 -14,62 -18,68" fill="url(#hanyiHair)"/>

      <!-- 髮髻 -->
      <ellipse cx="0" cy="50" rx="10" ry="8" fill="url(#hanyiHair)"/>
      <path d="M-8,50 C-6,42 6,42 8,50" fill="url(#hanyiHair)"/>

      <!-- 銀髮簪 -->
      <line x1="-10" y1="48" x2="12" y2="46" stroke="#b0b8c0" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="46" r="2" fill="#c0c8d0" stroke="#8090a0" stroke-width="0.5"/>

      <!-- 前額瀏海（微動） -->
      <path d="M-30,82 C-32,74 -30,70 -26,76" fill="url(#hanyiHair)"/>
      <path d="M-26,78 C-28,70 -24,66 -20,74" fill="url(#hanyiHair)" opacity="0.9"/>

      <!-- 側髮 -->
      <path d="M20,80 C24,76 26,82 24,90 C22,96 20,94 20,88" fill="url(#hanyiHair)"/>

      <!-- 耳朵 -->
      <path d="M18,98 C22,94 24,100 22,108 C20,112 18,110 18,104" fill="url(#hanyiFace)" stroke="#c8b8a8" stroke-width="0.5"/>

      <!-- ===== 眼睛（冷酷堅定） ===== -->
      <!-- 左眼（微瞇） -->
      <ellipse cx="-14" cy="104" rx="6" ry="4" fill="#fff"/>
      <ellipse cx="-15" cy="105" rx="3.8" ry="3.5" fill="#1a2030"/>
      <ellipse cx="-15.5" cy="104" rx="2.2" ry="2.2" fill="#0a0a14"/>
      <circle cx="-17" cy="103" r="1.4" fill="#fff" opacity="0.5"/>

      <!-- 右眼（微瞇） -->
      <ellipse cx="4" cy="104" rx="6" ry="4" fill="#fff"/>
      <ellipse cx="3" cy="105" rx="3.8" ry="3.5" fill="#1a2030"/>
      <ellipse cx="2.5" cy="104" rx="2.2" ry="2.2" fill="#0a0a14"/>
      <circle cx="1" cy="103" r="1.4" fill="#fff" opacity="0.5"/>

      <!-- 眉毛（凌厲下壓） -->
      <path d="M-20,97 C-16,95 -12,96 -9,98" fill="none" stroke="#1a1a20" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M8,98 C10,96 14,95 18,97" fill="none" stroke="#1a1a20" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-16,112 C-18,116 -16,120" fill="none" stroke="#c8b8a0" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（冷靜微張） -->
      <path d="M-14,126 C-8,128 0,128 4,126" fill="none" stroke="#8a6860" stroke-width="2" stroke-linecap="round"/>

      <!-- ===== 後手臂（正x，向後揮出平衡） ===== -->
      <path d="M20,146 Q38,140 44,150" fill="none" stroke="url(#hanyiRobe)" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
      <path d="M38,144 Q42,148 44,152" fill="none" stroke="#2a3a5a" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
      <circle cx="44" cy="152" r="5" fill="url(#hanyiFace)" opacity="0.8"/>

      <!-- ===== 武器手臂（從正x肩伸向負x橫斬） ===== -->
      <path d="M-18,144 Q-52,120 -70,116" fill="none" stroke="url(#hanyiRobe)" stroke-width="11" stroke-linecap="round"/>
      <!-- 袖口飄動 -->
      <path d="M-58,120 Q-66,116 -70,116" fill="none" stroke="#2a3a5a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

      <!-- ===== 劍（負x，優雅橫斬） ===== -->
      <!-- 握劍的手 -->
      <circle cx="-70" cy="116" r="5.5" fill="url(#hanyiFace)"/>
      <!-- 劍柄 -->
      <line x1="-64" y1="118" x2="-72" y2="114" stroke="#3a2a1a" stroke-width="4" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="-63" cy="119" r="2.5" fill="#b0b8c0"/>
      <!-- 劍護手 -->
      <line x1="-74" y1="110" x2="-72" y2="118" stroke="#b0b8c0" stroke-width="3" stroke-linecap="round"/>
      <!-- 劍刃（直線，~50.6px，向負x遠處斬出） -->
      <line x1="-74" y1="114" x2="-119.3" y2="91.4" stroke="url(#hanyiBlade)" stroke-width="3" stroke-linecap="round"/>
      <!-- 劍刃亮線 -->
      <line x1="-74" y1="114" x2="-119.3" y2="91.4" stroke="#e0e8f0" stroke-width="0.8" opacity="0.4"/>
      <!-- 劍尖 -->
      <line x1="-119.3" y1="91.4" x2="-120" y2="91" stroke="#c0c8d0" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 斬擊殘影 -->
      <path d="M-74,114 Q-100,100 -119.3,91.4" fill="none" stroke="#c0c8d0" stroke-width="1" opacity="0.15"/>
      <path d="M-74,118 Q-100,106 -117,97" fill="none" stroke="#c0c8d0" stroke-width="0.8" opacity="0.1"/>
    </g>
  </g>
</svg>