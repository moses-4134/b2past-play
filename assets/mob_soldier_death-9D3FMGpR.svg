<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 腐吏惡卒 — 死亡（倒地 rotate(90)） -->
  <defs>
    <radialGradient id="mobSoldierFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c0a470"/>
    </radialGradient>
    <linearGradient id="mobSoldierCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a5048"/>
      <stop offset="100%" stop-color="#3a3830"/>
    </linearGradient>
    <linearGradient id="mobSoldierPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3830"/>
      <stop offset="100%" stop-color="#2a2820"/>
    </linearGradient>
    <linearGradient id="mobSoldierHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobSoldierSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <linearGradient id="mobSoldierShield" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b88830"/>
      <stop offset="100%" stop-color="#785018"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(78, 10)">
      <g transform="rotate(90,-4,176)">
        <!-- 陰影 -->
        <ellipse cx="-4" cy="198" rx="22" ry="4" fill="#000" opacity="0.1"/>

        <!-- ===== 腿（癱軟） ===== -->
        <!-- 後腿 -->
        <ellipse cx="8" cy="178" rx="8" ry="15" fill="url(#mobSoldierPants)" transform="rotate(5,8,178)"/>
        <ellipse cx="10" cy="192" rx="9" ry="6" fill="#2a2418"/>
        <!-- 前腿 -->
        <ellipse cx="-10" cy="176" rx="9" ry="16" fill="url(#mobSoldierPants)" transform="rotate(-5,-10,176)"/>
        <ellipse cx="-12" cy="192" rx="10" ry="6" fill="#2a2418"/>

        <!-- ===== 身體 ===== -->
        <ellipse cx="-2" cy="146" rx="23" ry="25" fill="url(#mobSoldierCloth)"/>

        <!-- 破舊軍服裂痕 -->
        <path d="M-8,136 L-5,146" fill="none" stroke="#2a2820" stroke-width="0.8" opacity="0.4"/>
        <path d="M6,140 L9,150" fill="none" stroke="#2a2820" stroke-width="0.7" opacity="0.3"/>

        <!-- 領口 -->
        <path d="M-10,128 L-4,138 L4,128" fill="none" stroke="#4a4838" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- 腰帶 -->
        <path d="M-21,166 Q-2,172 19,166" fill="none" stroke="#3a3020" stroke-width="3" stroke-linecap="round"/>

        <!-- ===== 右手臂（癱下） ===== -->
        <path d="M16,134 Q30,146 34,160" fill="none" stroke="url(#mobSoldierCloth)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
        <circle cx="34" cy="162" r="4.5" fill="url(#mobSoldierFace)" opacity="0.85"/>

        <!-- ===== 左手臂（垂下） ===== -->
        <path d="M-18,134 Q-32,146 -36,160" fill="none" stroke="url(#mobSoldierCloth)" stroke-width="9" stroke-linecap="round"/>
        <circle cx="-36" cy="162" r="5" fill="url(#mobSoldierFace)"/>
        <!-- 盾牌（掉落地面） -->
        <ellipse cx="-40" cy="160" rx="14" ry="16" fill="url(#mobSoldierShield)" stroke="#3a2818" stroke-width="1" opacity="0.6"/>
        <line x1="-40" y1="144" x2="-40" y2="176" stroke="#806040" stroke-width="1" opacity="0.3"/>
        <line x1="-52" y1="160" x2="-28" y2="160" stroke="#806040" stroke-width="1" opacity="0.3"/>
        <circle cx="-40" cy="160" r="3.5" fill="#806040" opacity="0.25"/>

        <!-- ===== 槍（掉落在旁） ===== -->
        <line x1="-42" y1="164" x2="-52" y2="234" stroke="#5a4028" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
        <!-- 槍頭 -->
        <path d="M-42.6,154 L-40.8,164.4 L-46.4,163.6 Z" fill="url(#mobSoldierSteel)" stroke="#888" stroke-width="0.5" opacity="0.7"/>

        <!-- ===== 大頭 ===== -->
        <ellipse cx="0" cy="100" rx="34" ry="36" fill="url(#mobSoldierHair)"/>

        <!-- 臉 -->
        <path d="M-22,90 C-26,100 -24,112 -18,122 C-12,130 -4,134 4,132 C10,130 14,124 18,114 C22,102 20,90 14,82 C8,76 2,74 -4,76 C-12,78 -20,84 -22,90Z" fill="url(#mobSoldierFace)"/>

        <!-- 頭髮頂部 -->
        <path d="M-16,80 C-12,62 4,54 16,58 C24,62 28,74 24,84 C20,76 14,70 6,68 C0,66 -8,68 -14,74" fill="url(#mobSoldierHair)"/>

        <!-- 布帽（歪掉） -->
        <path d="M-26,80 C-22,70 -8,64 8,66 C18,68 26,74 24,80" fill="#4a4038" stroke="#3a3028" stroke-width="0.5" transform="rotate(8,0,74)"/>
        <path d="M-28,80 C-28,78 -26,76 -22,78 L26,78 C28,78 28,82 26,82 L-26,82 C-28,82 -28,80 -28,80Z" fill="#4a4038" stroke="#3a3028" stroke-width="0.5" transform="rotate(8,0,80)"/>

        <!-- 瀏海 -->
        <path d="M-22,84 C-26,78 -28,82 -28,88 C-26,92 -22,90 -22,86" fill="url(#mobSoldierHair)"/>

        <!-- 側髮 -->
        <path d="M18,86 C24,80 26,88 24,96 C22,100 18,98 18,94" fill="url(#mobSoldierHair)"/>

        <!-- 耳朵 -->
        <path d="M16,104 C20,100 22,106 20,112 C18,116 16,114 16,110" fill="url(#mobSoldierFace)" stroke="#b09060" stroke-width="0.5"/>

        <!-- ===== 眼睛（X_X 死亡眼） ===== -->
        <!-- 左眼 X -->
        <line x1="-14" y1="104" x2="-6" y2="112" stroke="#383830" stroke-width="2" stroke-linecap="round"/>
        <line x1="-6" y1="104" x2="-14" y2="112" stroke="#383830" stroke-width="2" stroke-linecap="round"/>

        <!-- 右眼 X -->
        <line x1="2" y1="104" x2="10" y2="112" stroke="#383830" stroke-width="2" stroke-linecap="round"/>
        <line x1="10" y1="104" x2="2" y2="112" stroke="#383830" stroke-width="2" stroke-linecap="round"/>

        <!-- 眉毛（下垂） -->
        <path d="M-14,100 C-10,102 -8,102 -6,102" fill="none" stroke="#2a2420" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M8,102 C10,102 12,102 16,100" fill="none" stroke="#2a2420" stroke-width="1.5" stroke-linecap="round"/>

        <!-- 鼻子 -->
        <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#a08858" stroke-width="1.2" stroke-linecap="round"/>

        <!-- 嘴巴（微張無力） -->
        <ellipse cx="-3" cy="128" rx="4" ry="3" fill="#4a2020" opacity="0.7"/>
      </g>
    </g>
  </g>
</svg>