<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 唐綺 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪、撐劍、喘息） -->
  <defs>
    <radialGradient id="jiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f8ece0"/>
      <stop offset="100%" stop-color="#ecd8c0"/>
    </radialGradient>
    <linearGradient id="jiRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#384868"/>
      <stop offset="100%" stop-color="#283848"/>
    </linearGradient>
    <linearGradient id="jiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="jiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#18100a"/>
      <stop offset="100%" stop-color="#0c0604"/>
    </linearGradient>
    <linearGradient id="jiSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 28)">
    <!-- 陰影（半跪更寬） -->
    <ellipse cx="-4" cy="208" rx="30" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（半跪姿態） ===== -->
    <!-- 後腿（右腿，膝蓋著地） -->
    <ellipse cx="8" cy="190" rx="9" ry="12" fill="url(#jiPants)" transform="rotate(-20,8,190)"/>
    <ellipse cx="2" cy="202" rx="8" ry="5" fill="url(#jiPants)"/>
    <ellipse cx="0" cy="206" rx="9" ry="5" fill="#2a2028"/>
    <!-- 前腿（左腿，彎曲支撐） -->
    <ellipse cx="-16" cy="186" rx="9" ry="16" fill="url(#jiPants)" transform="rotate(12,-16,186)"/>
    <ellipse cx="-20" cy="206" rx="10" ry="6" fill="#2a2028"/>

    <!-- ===== 身體（大幅前傾） ===== -->
    <ellipse cx="-4" cy="158" rx="24" ry="26" fill="url(#jiRobe)" transform="rotate(-14,-4,158)"/>

    <!-- 銀灰色腰帶 -->
    <path d="M-26,174 Q-4,182 18,176" fill="none" stroke="#909898" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-6" cy="179" r="2.5" fill="#b0b8b8"/>

    <!-- 領口 -->
    <path d="M-14,138 L-9,150 L-2,138" fill="none" stroke="#506880" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- ===== 畫面右側手臂（角色左手，撐在膝蓋上） ===== -->
    <path d="M16,144 Q24,158 16,178" fill="none" stroke="url(#jiRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="15" cy="180" r="4.5" fill="url(#jiFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，劍插地撐住身體） ===== -->
    <path d="M-22,144 Q-42,152 -52,166" fill="none" stroke="url(#jiRobe)" stroke-width="10" stroke-linecap="round"/>
    <!-- 握劍的手 -->
    <circle cx="-52" cy="168" r="5" fill="url(#jiFace)"/>

    <!-- ===== 劍（插入地面當支撐） ===== -->
    <!-- 劍身 -->
    <line x1="-53" y1="170" x2="-56" y2="212" stroke="url(#jiSteel)" stroke-width="4" stroke-linecap="round"/>
    <!-- 劍身亮線 -->
    <line x1="-53" y1="170" x2="-56" y2="212" stroke="#eee" stroke-width="1.5" opacity="0.4"/>
    <!-- 劍插入地面效果 -->
    <ellipse cx="-56" cy="212" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>
    <!-- 護手 -->
    <line x1="-59" y1="168" x2="-49" y2="165" stroke="#c0a050" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-53" y1="165" x2="-54" y2="159" stroke="#5a4530" stroke-width="4" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-54" cy="157" r="2.5" fill="#c0a050"/>

    <!-- ===== 大頭（低垂喘息） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="-2" cy="94" rx="38" ry="40" fill="url(#jiHair)"/>

    <!-- 臉（明顯低頭） -->
    <path d="M-28,90 C-32,100 -30,118 -24,128 C-18,136 -8,140 2,138 C10,136 16,128 20,118 C24,106 22,92 16,84 C10,78 2,76 -4,78 C-14,80 -26,82 -28,90Z" fill="url(#jiFace)"/>

    <!-- 腮紅（因痛苦更明顯） -->
    <ellipse cx="-22" cy="124" rx="7" ry="4" fill="#d8a0a0" opacity="0.4"/>

    <!-- 頭髮頂部（盤髻） -->
    <path d="M-20,80 C-16,60 0,52 14,56 C24,60 28,72 24,84 C20,78 12,72 4,70 C-4,68 -12,70 -16,76" fill="url(#jiHair)"/>

    <!-- 髮髻（略散亂但完整） -->
    <ellipse cx="0" cy="54" rx="14" ry="10" fill="url(#jiHair)"/>
    <ellipse cx="0" cy="52" rx="12" ry="8" fill="#18100a"/>
    <!-- 銀色小環髮飾 -->
    <circle cx="0" cy="46" r="3" fill="none" stroke="#c0c8d0" stroke-width="1.5"/>
    <circle cx="0" cy="46" r="1" fill="#d8e0e8"/>
    <!-- 散落的小髮絲（髻邊） -->
    <path d="M-10,58 C-12,62 -10,66" fill="none" stroke="url(#jiHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M12,56 C14,60 12,64" fill="none" stroke="url(#jiHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- 瀏海（略散亂） -->
    <path d="M-28,90 C-34,78 -36,82 -38,92 C-36,98 -30,100 -28,96" fill="url(#jiHair)"/>
    <path d="M-24,84 C-28,72 -32,76 -32,86 C-30,92 -24,92 -24,88" fill="#18100a"/>
    <path d="M-20,80 C-22,70 -26,72 -26,82 C-24,88 -20,88 -20,84" fill="url(#jiHair)" opacity="0.9"/>
    <!-- 散落髮絲 -->
    <path d="M-34,96 C-36,102 -34,106" fill="none" stroke="url(#jiHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- 側髮（略凌亂） -->
    <path d="M20,86 C26,80 28,88 26,96 C24,102 20,100 20,94" fill="url(#jiHair)"/>
    <path d="M22,94 C26,92 28,100 26,108 C24,114 20,110 20,104" fill="url(#jiHair)" opacity="0.8"/>
    <path d="M22,108 C26,106 28,114 26,122 C24,130 20,126 20,120" fill="url(#jiHair)" opacity="0.6"/>
    <!-- 左側散髮 -->
    <path d="M-30,94 C-32,106 -32,120 -30,134" fill="none" stroke="url(#jiHair)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M-28,90 C-30,102 -30,116 -28,130" fill="none" stroke="url(#jiHair)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- 耳朵 -->
    <path d="M18,102 C22,98 24,104 22,110 C20,114 18,112 18,108" fill="url(#jiFace)" stroke="#e0d0c0" stroke-width="0.5"/>

    <!-- ===== 眼睛（雙眼瞇成線） ===== -->
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-12" cy="110" rx="7" ry="2" fill="#fff"/>
    <ellipse cx="-13" cy="110.5" rx="4.5" ry="1.5" fill="#2a2830"/>
    <ellipse cx="-13.5" cy="110" rx="2" ry="1" fill="#101018"/>

    <!-- 右眼（勉強睜一線） -->
    <ellipse cx="4" cy="110" rx="7" ry="2.5" fill="#fff"/>
    <ellipse cx="3" cy="110.5" rx="4.5" ry="2" fill="#2a2830"/>
    <ellipse cx="2.5" cy="110" rx="2" ry="1.2" fill="#101018"/>
    <circle cx="1" cy="109.5" r="0.8" fill="#fff" opacity="0.7"/>

    <!-- 眉間皺紋（深刻） -->
    <path d="M-5,104 C-4,102 -2,102 -1,104" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-6,106 C-4,104.5 -2,104.5 0,106" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

    <!-- 鼻子 -->
    <path d="M-18,118 C-19,122 -17,124" fill="none" stroke="#e0d0c0" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴（喘息張開） -->
    <ellipse cx="-6" cy="132" rx="4.5" ry="4" fill="#703030"/>
    <!-- 上排牙 -->
    <path d="M-9.5,130 L-2.5,130" fill="none" stroke="#eee" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- 汗滴（多顆） -->
    <path d="M-26,92 C-27,96 -26,102 -25,105" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-25" cy="106" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M20,94 C21,98 20,102" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="20" cy="103" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <!-- 額頭汗 -->
    <ellipse cx="-8" cy="80" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
  </g>
</svg>