<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 草原 — 吉卜力風格：廣闊草原、遠山、清爽簡潔 地平線 y=180（33%） -->
  <defs>
    <!-- 天空漸層 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a9ad0"/>
      <stop offset="35%" stop-color="#80b8e8"/>
      <stop offset="100%" stop-color="#b0d8f0"/>
    </linearGradient>
    <!-- 草地 -->
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6aaa50"/>
      <stop offset="100%" stop-color="#508a38"/>
    </linearGradient>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- 雲朵（吉卜力風大朵圓潤雲） -->
  <g opacity="0.8">
    <ellipse cx="180" cy="55" rx="100" ry="35" fill="#ffffff"/>
    <ellipse cx="130" cy="50" rx="65" ry="30" fill="#ffffff"/>
    <ellipse cx="240" cy="52" rx="70" ry="28" fill="#ffffff"/>
    <ellipse cx="160" cy="40" rx="50" ry="22" fill="#ffffff"/>
  </g>
  <g opacity="0.6">
    <ellipse cx="650" cy="40" rx="110" ry="32" fill="#ffffff"/>
    <ellipse cx="590" cy="38" rx="70" ry="26" fill="#ffffff"/>
    <ellipse cx="720" cy="42" rx="65" ry="24" fill="#ffffff"/>
  </g>
  <g opacity="0.45">
    <ellipse cx="420" cy="75" rx="70" ry="20" fill="#ffffff"/>
    <ellipse cx="390" cy="73" rx="45" ry="16" fill="#ffffff"/>
  </g>
  <g opacity="0.35">
    <ellipse cx="850" cy="70" rx="55" ry="18" fill="#ffffff"/>
  </g>

  <!-- ===== 遠山 ===== -->
  <path d="M0,155 Q60,130 150,145 Q240,115 360,135 Q480,105 600,125 Q720,95 840,115 L960,105 L960,170 L0,170 Z" fill="#8aaa90" opacity="0.4"/>
  <path d="M0,162 Q100,142 220,158 Q370,135 500,152 Q640,128 780,148 L960,138 L960,175 L0,175 Z" fill="#78a080" opacity="0.38"/>
  <path d="M0,170 Q130,155 270,166 Q420,148 560,162 Q700,145 850,158 L960,150 L960,180 L0,180 Z" fill="#68906a" opacity="0.35"/>

  <!-- ===== 中景：點綴樹木（吉卜力風圓潤樹） ===== -->
  <!-- 左側小樹群 -->
  <circle cx="80" cy="165" r="20" fill="#5a8a40" opacity="0.5"/>
  <circle cx="105" cy="160" r="25" fill="#4a7a35" opacity="0.45"/>
  <circle cx="60" cy="170" r="16" fill="#6a9a48" opacity="0.4"/>
  <rect x="90" y="175" width="5" height="15" fill="#6a4a28" opacity="0.4"/>

  <!-- 右側獨立大樹 -->
  <rect x="828" y="165" width="8" height="30" fill="#6a4a28" opacity="0.5"/>
  <circle cx="832" cy="150" r="30" fill="#4a7a35" opacity="0.5"/>
  <circle cx="815" cy="155" r="22" fill="#5a8a40" opacity="0.45"/>
  <circle cx="850" cy="158" r="18" fill="#6a9a48" opacity="0.4"/>

  <!-- 中間小灌木 -->
  <ellipse cx="400" cy="178" rx="15" ry="10" fill="#5a8a40" opacity="0.35"/>
  <ellipse cx="580" cy="178" rx="12" ry="8" fill="#4a7a35" opacity="0.3"/>

  <!-- ===== 草地（y=180 開始，佔下方 2/3） ===== -->
  <rect x="0" y="180" width="960" height="360" fill="url(#grass)"/>

  <!-- 草地色調變化 -->
  <ellipse cx="200" cy="235" rx="120" ry="30" fill="#5aa048" opacity="0.2"/>
  <ellipse cx="600" cy="295" rx="150" ry="35" fill="#78b860" opacity="0.15"/>
  <ellipse cx="400" cy="365" rx="130" ry="30" fill="#5aa048" opacity="0.15"/>
  <ellipse cx="800" cy="255" rx="100" ry="25" fill="#78b860" opacity="0.12"/>
  <ellipse cx="150" cy="395" rx="110" ry="28" fill="#78b860" opacity="0.1"/>

  <!-- 草叢細節 -->
  <g stroke="#3a7a28" stroke-width="1.5" fill="none" opacity="0.25">
    <path d="M100,180 Q105,165 108,180"/>
    <path d="M115,180 Q118,163 122,180"/>
    <path d="M300,180 Q303,167 308,180"/>
    <path d="M315,180 Q320,161 323,180"/>
    <path d="M500,180 Q504,165 509,180"/>
    <path d="M520,180 Q525,163 528,180"/>
    <path d="M700,180 Q703,167 707,180"/>
    <path d="M720,180 Q725,160 728,180"/>
    <path d="M880,180 Q884,165 888,180"/>
  </g>

  <!-- 草地與遠景交界 -->
  <path d="M0,180 Q120,188 240,182 Q360,190 480,183 Q600,190 720,183 Q840,190 960,180 L960,195 L0,195 Z" fill="#5a9a42" opacity="0.5"/>

  <!-- ===== 小花點綴 ===== -->
  <circle cx="180" cy="205" r="2.5" fill="#f0e060" opacity="0.5"/>
  <circle cx="350" cy="225" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="450" cy="195" r="2.5" fill="#e880a0" opacity="0.4"/>
  <circle cx="620" cy="215" r="2" fill="#f0e060" opacity="0.45"/>
  <circle cx="780" cy="200" r="2.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="250" cy="255" r="2" fill="#e880a0" opacity="0.3"/>
  <circle cx="550" cy="265" r="2.5" fill="#f0e060" opacity="0.35"/>
  <circle cx="850" cy="235" r="2" fill="#ffffff" opacity="0.3"/>

  <!-- ===== 空氣粒子（花粉與光點） ===== -->
  <circle cx="150" cy="180" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="350" cy="150" r="1.2" fill="#f0f8ff" opacity="0.35"/>
  <circle cx="500" cy="200" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="700" cy="170" r="1.5" fill="#f0f8ff" opacity="0.35"/>
  <circle cx="850" cy="140" r="1.3" fill="#ffffff" opacity="0.3"/>
  <circle cx="250" cy="145" r="1" fill="#f0f8ff" opacity="0.25"/>
  <circle cx="480" cy="120" r="1.2" fill="#ffffff" opacity="0.3"/>
  <circle cx="600" cy="165" r="0.8" fill="#f0f8ff" opacity="0.2"/>
  <circle cx="400" cy="195" r="1" fill="#ffffff" opacity="0.2"/>
  <circle cx="300" cy="100" r="1.4" fill="#ffffff" opacity="0.25"/>

  <!-- ===== 整體氛圍覆蓋（清新光） ===== -->
  <rect width="960" height="540" fill="#e0f0ff" opacity="0.04"/>
</svg>