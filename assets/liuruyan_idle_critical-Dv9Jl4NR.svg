<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 柳如燕 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪、撐劍、喘息） -->
  <defs>
    <radialGradient id="lrcFace" cx="40%" cy="35%" r="55%"><stop offset="0%" stop-color="#f8ece0"/><stop offset="100%" stop-color="#e8d4bc"/></radialGradient>
    <linearGradient id="lrcRobe" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#8090a0"/><stop offset="100%" stop-color="#607080"/></linearGradient>
    <linearGradient id="lrcSkirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#708090"/><stop offset="100%" stop-color="#506070"/></linearGradient>
    <linearGradient id="lrcHair" x1="0.2" y1="0" x2="0.7" y2="1"><stop offset="0%" stop-color="#1a0c04"/><stop offset="100%" stop-color="#0a0402"/></linearGradient>
  </defs>
  <g transform="translate(130, 28)">
    <ellipse cx="-4" cy="210" rx="30" ry="6" fill="#000" opacity="0.12"/>
    <!-- 腿（半跪） -->
    <ellipse cx="8" cy="186" rx="8.5" ry="12" fill="url(#lrcSkirt)" transform="rotate(-20,8,186)"/>
    <ellipse cx="2" cy="198" rx="7" ry="5" fill="url(#lrcSkirt)"/>
    <ellipse cx="0" cy="202" rx="8.5" ry="5.5" fill="#506068"/>
    <ellipse cx="-14" cy="182" rx="9.5" ry="16" fill="url(#lrcSkirt)" transform="rotate(12,-14,182)"/>
    <ellipse cx="-18" cy="202" rx="10" ry="5.5" fill="#506068"/>
    <!-- 身體（大幅前傾） -->
    <ellipse cx="-2" cy="150" rx="24" ry="25" fill="url(#lrcRobe)" transform="rotate(-14,-2,158)"/>
    <!-- 素色腰帶 -->
    <path d="M-26,166 Q-2,174 18,168" fill="none" stroke="#607068" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-4" cy="170" r="3" fill="#708078"/>
    <!-- 白色交領 -->
    <path d="M-12,130 L-7,142 L2,130" fill="none" stroke="#e8e4e0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 角色左手（撐在膝蓋） -->
    <path d="M16,136 Q26,156 16,178" fill="none" stroke="url(#lrcRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="15" cy="180" r="4.5" fill="url(#lrcFace)" opacity="0.85"/>
    <!-- 角色右手（撐劍） -->
    <path d="M-22,136 Q-42,148 -52,162" fill="none" stroke="url(#lrcRobe)" stroke-width="10" stroke-linecap="round"/>

    <!-- 大頭（低垂） -->
    <ellipse cx="0" cy="86" rx="36" ry="38" fill="url(#lrcHair)"/>
    <!-- 臉 -->
    <path d="M-26,82 C-30,92 -28,108 -22,118 C-16,126 -6,130 4,128 C12,126 18,120 22,110 C26,98 24,86 18,78 C12,72 4,70 -4,72 C-14,74 -24,76 -26,82Z" fill="url(#lrcFace)"/>
    <!-- 腮紅（痛苦更明顯） -->
    <ellipse cx="-20" cy="116" rx="7" ry="4" fill="#d89090" opacity="0.45"/>
    <!-- 髮頂 -->
    <path d="M-18,74 C-14,54 2,46 14,50 C24,54 28,66 24,76 C20,70 12,64 4,62 C-4,60 -12,64 -16,70" fill="url(#lrcHair)"/>
    <!-- 低盤髮髻（鬆散） -->
    <ellipse cx="8" cy="64" rx="12" ry="10" fill="url(#lrcHair)" transform="rotate(-5,8,64)"/>
    <!-- 木簪（歪斜） -->
    <line x1="-4" y1="62" x2="18" y2="56" stroke="#8a7050" stroke-width="2" stroke-linecap="round"/>
    <!-- 瀏海（更散亂） -->
    <path d="M-28,84 C-34,72 -36,76 -38,84 C-36,90 -30,90 -28,86" fill="url(#lrcHair)"/>
    <path d="M-24,78 C-28,66 -32,70 -32,80 C-30,86 -24,84 -24,80" fill="#1a0c04"/>
    <!-- 散落髮絲 -->
    <path d="M-30,88 C-32,94 -30,98" fill="none" stroke="url(#lrcHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- 散髮（更凌亂） -->
    <path d="M20,80 C24,74 26,82 24,92" fill="url(#lrcHair)" stroke="none"/>
    <path d="M22,92 C24,102 24,112 22,124" fill="none" stroke="url(#lrcHair)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M-30,86 C-32,96 -32,108 -30,120" fill="none" stroke="url(#lrcHair)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <!-- 耳朵 -->
    <path d="M20,96 C24,92 26,98 24,104 C22,108 20,106 20,102" fill="url(#lrcFace)" stroke="#e0d0bc" stroke-width="0.5"/>
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-10" cy="102" rx="7" ry="2" fill="#fff"/>
    <ellipse cx="-11" cy="102.5" rx="4" ry="1.5" fill="#2a1810"/>
    <ellipse cx="-11.5" cy="102" rx="2" ry="1" fill="#0a0804"/>
    <!-- 右眼（勉強一線） -->
    <ellipse cx="6" cy="102" rx="7" ry="2.5" fill="#fff"/>
    <ellipse cx="5" cy="102.5" rx="4" ry="2" fill="#2a1810"/>
    <ellipse cx="4.5" cy="102" rx="2" ry="1.2" fill="#0a0804"/>
    <circle cx="3" cy="101" r="0.8" fill="#fff" opacity="0.7"/>
    <!-- 眉間深皺 -->
    <path d="M-5,95 C-3,93 -1,93 1,95" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-6,97 C-4,95.5 -1,95.5 1,97" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
    <!-- 細眉 -->
    <path d="M-15,94 C-12,91 -6,92 -3,94" fill="none" stroke="#1a0c04" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M1,94 C4,91 10,92 13,94" fill="none" stroke="#1a0c04" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 鼻子 -->
    <path d="M-14,110 C-14.5,113 -13,114" fill="none" stroke="#e0d0bc" stroke-width="1" stroke-linecap="round"/>
    <!-- 嘴巴（喘息張開） -->
    <ellipse cx="-4" cy="121" rx="4.5" ry="4" fill="#703030"/>
    <path d="M-7.5,119 L-0.5,119" fill="none" stroke="#eee" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

    <!-- 汗滴（多顆） -->
    <path d="M-24,84 C-25,88 -24,92 -23,95" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-23" cy="96" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M20,86 C21,90 20,94" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="20" cy="95" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <ellipse cx="-6" cy="74" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>

    <!-- 劍（插地撐身，最上層） -->
    <line x1="-53" y1="166" x2="-56" y2="206" stroke="#b8c0c8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-53" y1="166" x2="-56" y2="206" stroke="#e0e4e8" stroke-width="0.8" opacity="0.5"/>
    <ellipse cx="-56" cy="206" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>
    <line x1="-59" y1="164" x2="-49" y2="161" stroke="#708078" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-54" y1="161" x2="-55" y2="155" stroke="#6a5038" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-55" cy="153" r="2" fill="#708078"/>
    <circle cx="-52" cy="164" r="5" fill="url(#lrcFace)"/>
  </g>
</svg>