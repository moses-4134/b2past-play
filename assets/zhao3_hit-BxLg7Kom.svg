<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙三 — 受擊（大幅後仰，瞇眼） -->
  <defs>
    <radialGradient id="zhao3Face" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c498"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </radialGradient>
    <linearGradient id="zhao3Cloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3028"/>
      <stop offset="100%" stop-color="#3a2018"/>
    </linearGradient>
    <linearGradient id="zhao3Pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2018"/>
      <stop offset="100%" stop-color="#2a1410"/>
    </linearGradient>
    <linearGradient id="zhao3Hair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="zhao3Blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccc"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="4" cy="198" rx="22" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（後仰踉蹌） ===== -->
      <!-- 後腿 -->
      <ellipse cx="14" cy="178" rx="8" ry="15" fill="url(#zhao3Pants)" transform="rotate(8,14,178)"/>
      <ellipse cx="16" cy="192" rx="9" ry="6" fill="#2a1810"/>
      <!-- 前腿 -->
      <ellipse cx="-8" cy="176" rx="9" ry="16" fill="url(#zhao3Pants)" transform="rotate(-10,-8,176)"/>
      <ellipse cx="-12" cy="192" rx="10" ry="6" fill="#2a1810"/>

      <!-- ===== 身體（大幅後仰） ===== -->
      <ellipse cx="2" cy="146" rx="24" ry="26" fill="url(#zhao3Cloth)" transform="rotate(15,2,146)"/>

      <!-- 甲片 -->
      <rect x="-12" y="136" width="6" height="5" rx="1" fill="#4a2820" opacity="0.5" transform="rotate(15,2,146)"/>

      <!-- 領口 -->
      <path d="M-6,128 L0,138 L8,128" fill="none" stroke="#4a2820" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-16,164 Q2,170 22,164" fill="none" stroke="#3a2018" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 大頭（後仰） ===== -->
      <ellipse cx="4" cy="98" rx="34" ry="36" fill="url(#zhao3Hair)" transform="rotate(12,4,98)"/>

      <!-- 臉 -->
      <path d="M-24,88 C-28,98 -26,112 -20,124 C-14,132 -4,136 4,134 C10,132 16,126 20,114 C24,102 22,90 16,82 C10,76 2,74 -4,76 C-14,78 -22,82 -24,88Z" fill="url(#zhao3Face)" transform="rotate(12,0,106)"/>

      <!-- 頭髮頂部 -->
      <path d="M-12,78 C-8,60 8,52 20,56 C28,60 32,72 28,82 C24,74 18,68 10,66 C4,64 -4,66 -10,72" fill="url(#zhao3Hair)" transform="rotate(12,4,68)"/>

      <!-- 軍帽（歪斜） -->
      <path d="M-24,78 C-20,66 -6,60 12,62 C24,64 32,70 30,78" fill="#3a2820" stroke="#2a1810" stroke-width="0.5" transform="rotate(12,4,72)"/>
      <path d="M-26,78 C-26,76 -24,74 -20,76 L32,76 C34,76 34,80 32,80 L-24,80 C-26,80 -26,78 -26,78Z" fill="#3a2820" stroke="#2a1810" stroke-width="0.5" transform="rotate(12,4,78)"/>

      <!-- 瀏海 -->
      <path d="M-20,88 C-24,76 -28,80 -28,90 C-26,94 -20,94 -20,90" fill="url(#zhao3Hair)" transform="rotate(12,0,86)"/>

      <!-- 側髮 -->
      <path d="M22,84 C28,78 30,86 28,94 C26,98 22,96 22,92" fill="url(#zhao3Hair)" transform="rotate(12,22,88)"/>

      <!-- 耳朵 -->
      <path d="M20,102 C24,98 26,104 24,110 C22,114 20,112 20,108" fill="url(#zhao3Face)" stroke="#b09060" stroke-width="0.5" transform="rotate(12,20,106)"/>

      <!-- ===== 左手臂（角色左手，後甩） ===== -->
      <path d="M-20,134 Q-36,124 -42,114" fill="none" stroke="url(#zhao3Cloth)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-42" cy="112" r="4.5" fill="url(#zhao3Face)" opacity="0.85"/>

      <!-- ===== 右手臂（角色右手，劍被打歪） ===== -->
      <path d="M14,134 Q28,126 36,118" fill="none" stroke="url(#zhao3Cloth)" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== 劍（被打歪，斜飛，正x區域） ===== -->
      <line x1="55.1" y1="87.6" x2="32" y2="132.6" stroke="url(#zhao3Blade)" stroke-width="4" stroke-linecap="round"/>
      <!-- 劍護手 -->
      <line x1="38" y1="134" x2="28" y2="128" stroke="#806030" stroke-width="3" stroke-linecap="round"/>
      <!-- 握劍的手 -->
      <circle cx="36" cy="120" r="5" fill="url(#zhao3Face)"/>

      <!-- ===== 眼睛（瞇眼痛苦 ry=2.5） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-8" cy="108" rx="5.5" ry="2.5" fill="#fff" transform="rotate(12,0,106)"/>
      <ellipse cx="-9" cy="108" rx="3" ry="1.8" fill="#2a1818" transform="rotate(12,0,106)"/>

      <!-- 右眼 -->
      <ellipse cx="8" cy="108" rx="5.5" ry="2.5" fill="#fff" transform="rotate(12,0,106)"/>
      <ellipse cx="7" cy="108" rx="3" ry="1.8" fill="#2a1818" transform="rotate(12,0,106)"/>

      <!-- 眉毛（皺成一團） -->
      <path d="M-14,102 C-10,100 -6,102 -4,104" fill="none" stroke="#2a2018" stroke-width="2" stroke-linecap="round" transform="rotate(12,0,106)"/>
      <path d="M6,104 C8,102 12,100 16,102" fill="none" stroke="#2a2018" stroke-width="2" stroke-linecap="round" transform="rotate(12,0,106)"/>

      <!-- 鼻子 -->
      <path d="M-12,116 C-14,120 -10,124" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round" transform="rotate(12,0,106)"/>

      <!-- 八字鬍 -->
      <path d="M-12,126 C-10,128 -6,129 -4,128" fill="none" stroke="#2a2018" stroke-width="1.2" stroke-linecap="round" transform="rotate(12,0,106)"/>
      <path d="M0,126 C2,128 6,129 8,128" fill="none" stroke="#2a2018" stroke-width="1.2" stroke-linecap="round" transform="rotate(12,0,106)"/>

      <!-- 嘴巴（痛苦張嘴） -->
      <ellipse cx="-1" cy="130" rx="5" ry="4" fill="#4a2020" transform="rotate(12,0,106)"/>
    </g>
  </g>
</svg>