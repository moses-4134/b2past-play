<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 信陵君 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪、撐劍、喘息） -->
  <defs>
    <radialGradient id="xinlingCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e0d0"/>
      <stop offset="100%" stop-color="#e0c8b0"/>
    </radialGradient>
    <linearGradient id="xinlingCRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a1860"/>
      <stop offset="100%" stop-color="#2a1048"/>
    </linearGradient>
    <linearGradient id="xinlingCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1450"/>
      <stop offset="100%" stop-color="#1a0c30"/>
    </linearGradient>
    <linearGradient id="xinlingCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1020"/>
      <stop offset="100%" stop-color="#0c0610"/>
    </linearGradient>
    <linearGradient id="xinlingCBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dde0e8"/>
      <stop offset="100%" stop-color="#8890a0"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 28)">
    <!-- 陰影（半跪更寬） -->
    <ellipse cx="-4" cy="210" rx="34" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（半跪姿態） ===== -->
    <!-- 後腿（膝蓋撐地） -->
    <ellipse cx="8" cy="192" rx="10" ry="12" fill="url(#xinlingCPants)" transform="rotate(-20,8,192)"/>
    <ellipse cx="2" cy="204" rx="8" ry="5" fill="url(#xinlingCPants)"/>
    <ellipse cx="0" cy="208" rx="10" ry="5" fill="#1a0c30"/>
    <!-- 前腿（彎曲支撐） -->
    <ellipse cx="-14" cy="188" rx="10" ry="16" fill="url(#xinlingCPants)" transform="rotate(12,-14,188)"/>
    <ellipse cx="-18" cy="208" rx="11" ry="6" fill="#1a0c30"/>

    <!-- ===== 身體（大幅前傾） ===== -->
    <ellipse cx="-4" cy="158" rx="25" ry="29" fill="url(#xinlingCRobe)" transform="rotate(-14,-4,158)"/>

    <!-- 金邊裝飾（凌亂） -->
    <path d="M-26,143 Q-26,163 -22,181" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.5"/>
    <path d="M18,143 Q20,163 18,181" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.5"/>

    <!-- 領口 -->
    <path d="M-14,138 L-6,152 L2,138" fill="none" stroke="#c8a840" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-26,176 Q-2,184 20,176" fill="none" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
    <rect x="-7" y="174" width="8" height="8" rx="2" fill="#4a8a50" stroke="#c8a840" stroke-width="1"/>

    <!-- ===== 右側手臂（正x，撐在膝蓋上） ===== -->
    <path d="M18,146 Q28,160 20,178" fill="none" stroke="url(#xinlingCRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <circle cx="19" cy="180" r="5" fill="url(#xinlingCFace)" opacity="0.85"/>

    <!-- ===== 頭部（低垂喘息） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="-2" cy="94" rx="38" ry="40" fill="url(#xinlingCHair)"/>

    <!-- 臉（明顯低頭） -->
    <path d="M-30,88 C-34,100 -32,116 -26,126 C-20,134 -8,138 2,136 C12,134 20,126 24,116 C28,104 26,92 20,84 C14,78 4,74 -6,76 C-18,78 -28,82 -30,88Z" fill="url(#xinlingCFace)"/>

    <!-- 腮紅（因痛苦更明顯） -->
    <ellipse cx="-22" cy="122" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

    <!-- 頭髮頂部 -->
    <path d="M-20,78 C-16,60 -2,52 12,56 C22,60 28,72 24,82 C20,76 12,70 4,68 C-4,66 -12,68 -16,74" fill="url(#xinlingCHair)"/>

    <!-- 瀏海（散亂） -->
    <path d="M-28,88 C-32,78 -34,80 -34,90 C-32,94 -28,94 -28,92" fill="url(#xinlingCHair)"/>
    <path d="M-24,82 C-26,72 -30,74 -30,84 C-28,88 -24,88 -24,86" fill="#1a1020"/>
    <!-- 散落髮絲 -->
    <path d="M-32,94 C-34,100 -32,104" fill="none" stroke="url(#xinlingCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- 髮髻（歪斜、快散） -->
    <ellipse cx="2" cy="56" rx="9" ry="7" fill="url(#xinlingCHair)" transform="rotate(-10,2,56)"/>
    <path d="M-4,54 C-2,46 6,46 8,54" fill="url(#xinlingCHair)"/>
    <!-- 玉簪（歪斜） -->
    <circle cx="1" cy="50" r="3" fill="#4a8a50" stroke="#3a7a40" stroke-width="0.5"/>
    <circle cx="1" cy="50" r="1.2" fill="#6aba60" opacity="0.6"/>

    <!-- 飄逸髮絲 -->
    <path d="M16,80 C20,76 22,82 20,90 C18,96 16,94 16,88" fill="url(#xinlingCHair)"/>
    <path d="M18,90 C22,88 24,96 22,104 C20,110 16,106 16,100" fill="url(#xinlingCHair)" opacity="0.8"/>

    <!-- 耳朵 -->
    <path d="M16,102 C20,98 22,104 20,110 C18,114 16,112 16,108" fill="url(#xinlingCFace)" stroke="#d8c0a0" stroke-width="0.5"/>

    <!-- ===== 眼睛（雙眼瞇成線） ===== -->
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-14" cy="108" rx="6" ry="2" fill="#fff"/>
    <ellipse cx="-15" cy="108.5" rx="3.5" ry="1.5" fill="#1a1830"/>
    <ellipse cx="-15.5" cy="108" rx="2" ry="1" fill="#0a0818"/>

    <!-- 右眼（勉強睜一線） -->
    <ellipse cx="2" cy="108" rx="6" ry="2.5" fill="#fff"/>
    <ellipse cx="1" cy="108.5" rx="3.5" ry="2" fill="#1a1830"/>
    <ellipse cx="0.5" cy="108" rx="2" ry="1.2" fill="#0a0818"/>
    <circle cx="-1" cy="107" r="0.8" fill="#fff" opacity="0.6"/>

    <!-- 眉間皺紋（深刻） -->
    <path d="M-7,101 C-5,99 -2,99 0,101" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-8,103 C-6,101.5 -3,101.5 -1,103" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

    <!-- 鼻子 -->
    <path d="M-18,116 C-19,120 -17,124" fill="none" stroke="#d8c0a0" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（喘息張開） -->
    <ellipse cx="-6" cy="131" rx="5" ry="4.5" fill="#703030"/>
    <path d="M-10,129 L-2,129" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- ===== 左側手臂（負x，劍插地撐住身體） ===== -->
    <path d="M-24,144 Q-44,152 -54,166" fill="none" stroke="url(#xinlingCRobe)" stroke-width="11" stroke-linecap="round"/>
    <path d="M-48,162 Q-54,164 -54,168" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.5"/>

    <!-- ===== 劍（插入地面當支撐） ===== -->
    <circle cx="-54" cy="168" r="5.5" fill="url(#xinlingCFace)"/>
    <!-- 劍身（直插地面） -->
    <line x1="-55" y1="170" x2="-58" y2="212" stroke="url(#xinlingCBlade)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-55" y1="170" x2="-58" y2="212" stroke="#eef0f8" stroke-width="1.2" opacity="0.4"/>
    <!-- 劍插入地面效果 -->
    <ellipse cx="-58" cy="212" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>
    <!-- 護手 -->
    <line x1="-60" y1="168" x2="-50" y2="165" stroke="#c8a840" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-53" y1="165" x2="-52" y2="159" stroke="#3a2028" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-52" cy="157" r="2.5" fill="#c8a840"/>

    <!-- 汗滴（多顆） -->
    <path d="M-24,84 C-25,88 -24,94 -23,97" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-23" cy="98" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M20,86 C21,90 20,94" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="20" cy="95" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <!-- 額頭汗 -->
    <ellipse cx="-8" cy="78" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
  </g>
</svg>