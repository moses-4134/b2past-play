<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 山賊據點 — 吉卜力風格：山谷營地、岩壁、帳篷、篝火 地平線 y=180（33%） -->
  <defs>
    <!-- 天空（被山谷夾住的窄天） -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa8d0"/>
      <stop offset="60%" stop-color="#98c0e0"/>
      <stop offset="100%" stop-color="#b0d0e8"/>
    </linearGradient>
    <!-- 岩壁漸層（左） -->
    <linearGradient id="rockL" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#5a4a3e"/>
      <stop offset="100%" stop-color="#7a6a5e"/>
    </linearGradient>
    <!-- 岩壁漸層（右） -->
    <linearGradient id="rockR" x1="1" y1="0" x2="0" y2="0.3">
      <stop offset="0%" stop-color="#5a4a3e"/>
      <stop offset="100%" stop-color="#6b5b4f"/>
    </linearGradient>
    <!-- 地面 -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a878"/>
      <stop offset="100%" stop-color="#a89060"/>
    </linearGradient>
    <!-- 篝火光暈 -->
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff8040" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ff6020" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff6020" stop-opacity="0"/>
    </radialGradient>
    <!-- 帳篷布 -->
    <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6b4b"/>
      <stop offset="100%" stop-color="#6a5038"/>
    </linearGradient>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- ===== 雲朵（山谷上方的窄雲） ===== -->
  <g opacity="0.5">
    <ellipse cx="400" cy="25" rx="80" ry="20" fill="#ffffff"/>
    <ellipse cx="360" cy="22" rx="50" ry="15" fill="#ffffff"/>
    <ellipse cx="450" cy="24" rx="55" ry="16" fill="#ffffff"/>
  </g>
  <g opacity="0.35">
    <ellipse cx="620" cy="40" rx="60" ry="16" fill="#ffffff"/>
    <ellipse cx="590" cy="38" rx="40" ry="12" fill="#ffffff"/>
  </g>

  <!-- ===== 左側岩壁 ===== -->
  <path d="M0,0 L0,540 L180,540 L200,350 L230,250 L210,180 L170,120 L120,60 L80,20 L0,0 Z" fill="url(#rockL)"/>
  <!-- 岩壁紋理 -->
  <path d="M30,80 Q50,100 40,130 Q60,155 45,180" fill="none" stroke="#4a3a2e" stroke-width="1.5" opacity="0.3"/>
  <path d="M80,50 Q100,80 90,120 Q110,150 95,180" fill="none" stroke="#4a3a2e" stroke-width="1.2" opacity="0.25"/>
  <path d="M140,100 Q155,130 145,165 Q160,190 150,220" fill="none" stroke="#4a3a2e" stroke-width="1" opacity="0.2"/>
  <!-- 岩壁亮面 -->
  <path d="M60,40 L80,20 L120,60 L100,85 Z" fill="#8a7a6e" opacity="0.2"/>
  <path d="M100,85 L170,120 L150,165 L85,130 Z" fill="#8a7a6e" opacity="0.15"/>

  <!-- ===== 右側岩壁 ===== -->
  <path d="M960,0 L960,540 L780,540 L760,380 L730,270 L750,190 L790,130 L840,70 L890,25 L960,0 Z" fill="url(#rockR)"/>
  <path d="M920,70 Q900,95 910,125 Q890,155 905,180" fill="none" stroke="#4a3a2e" stroke-width="1.5" opacity="0.3"/>
  <path d="M860,55 Q845,85 855,115 Q840,145 850,180" fill="none" stroke="#4a3a2e" stroke-width="1.2" opacity="0.25"/>
  <path d="M800,110 Q785,140 795,170 Q780,200 790,230" fill="none" stroke="#4a3a2e" stroke-width="1" opacity="0.2"/>
  <!-- 岩壁亮面 -->
  <path d="M900,35 L890,25 L840,70 L860,90 Z" fill="#8a7a6e" opacity="0.18"/>

  <!-- ===== 地面 ===== -->
  <rect x="0" y="180" width="960" height="360" fill="url(#ground)"/>

  <!-- 踩踏痕跡（營地常被踩的地面偏暗） -->
  <ellipse cx="480" cy="280" rx="200" ry="60" fill="#9a8050" opacity="0.2"/>
  <ellipse cx="480" cy="350" rx="250" ry="80" fill="#9a8050" opacity="0.15"/>

  <!-- ===== 木柵欄（中景，營地入口） ===== -->
  <g opacity="0.6">
    <!-- 橫木 -->
    <line x1="280" y1="172" x2="680" y2="172" stroke="#6a5040" stroke-width="5" stroke-linecap="round"/>
    <line x1="285" y1="185" x2="675" y2="185" stroke="#6a5040" stroke-width="4" stroke-linecap="round"/>
    <!-- 柵欄木樁 -->
    <rect x="290" y="158" width="8" height="30" fill="#7a6050" rx="1"/>
    <rect x="340" y="155" width="8" height="33" fill="#6a5040" rx="1"/>
    <rect x="390" y="157" width="8" height="31" fill="#7a6050" rx="1"/>
    <rect x="560" y="156" width="8" height="32" fill="#7a6050" rx="1"/>
    <rect x="610" y="158" width="8" height="30" fill="#6a5040" rx="1"/>
    <rect x="660" y="155" width="8" height="33" fill="#7a6050" rx="1"/>
    <!-- 入口空隙（440-550之間無柵欄） -->
  </g>

  <!-- ===== 帳篷（左後方） ===== -->
  <g transform="translate(300,155)">
    <polygon points="0,30 30,-10 60,30" fill="url(#tent)" opacity="0.7"/>
    <line x1="30" y1="-10" x2="30" y2="30" stroke="#5a4028" stroke-width="1.5" opacity="0.4"/>
    <!-- 帳篷入口暗影 -->
    <polygon points="20,30 30,8 40,30" fill="#3a2818" opacity="0.4"/>
  </g>

  <!-- ===== 帳篷（右後方） ===== -->
  <g transform="translate(580,150)">
    <polygon points="0,35 35,-12 70,35" fill="url(#tent)" opacity="0.65"/>
    <line x1="35" y1="-12" x2="35" y2="35" stroke="#5a4028" stroke-width="1.5" opacity="0.4"/>
    <polygon points="24,35 35,6 46,35" fill="#3a2818" opacity="0.4"/>
  </g>

  <!-- ===== 篝火（營地中央） ===== -->
  <g transform="translate(480,210)">
    <circle cx="0" cy="0" r="120" fill="url(#fireGlow)"/>
    <!-- 火圈石 -->
    <ellipse cx="-12" cy="8" rx="5" ry="3" fill="#6a6a5a" opacity="0.5"/>
    <ellipse cx="12" cy="7" rx="4.5" ry="3" fill="#5a5a4a" opacity="0.5"/>
    <ellipse cx="0" cy="12" rx="4" ry="2.5" fill="#6a6a5a" opacity="0.45"/>
    <ellipse cx="-8" cy="3" rx="4" ry="2.5" fill="#5a5a4a" opacity="0.45"/>
    <ellipse cx="8" cy="4" rx="4.5" ry="2.5" fill="#6a6a5a" opacity="0.45"/>
    <!-- 柴 -->
    <line x1="-10" y1="6" x2="10" y2="3" stroke="#4a3420" stroke-width="3" stroke-linecap="round"/>
    <line x1="-8" y1="3" x2="8" y2="7" stroke="#3a2818" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 火焰 -->
    <path d="M0,0 Q-6,-10 -2,-18 Q0,-12 2,-20 Q6,-14 4,-8 Q8,-12 6,-4 Q3,0 0,0Z" fill="#ff8040" opacity="0.85"/>
    <path d="M0,-2 Q-3,-8 0,-14 Q3,-8 1,-3Z" fill="#ffb060" opacity="0.8"/>
    <path d="M0,-4 Q-1,-7 0,-10 Q1,-7 0,-4Z" fill="#ffe080" opacity="0.75"/>
    <!-- 火星 -->
    <circle cx="-5" cy="-25" r="0.8" fill="#ff8040" opacity="0.5"/>
    <circle cx="4" cy="-28" r="0.6" fill="#ffa050" opacity="0.4"/>
  </g>

  <!-- 篝火暖光在地面 -->
  <ellipse cx="480" cy="225" rx="100" ry="40" fill="#ff6020" opacity="0.05"/>

  <!-- ===== 武器架（左側） ===== -->
  <g transform="translate(240,192)" opacity="0.55">
    <!-- 架子支柱 -->
    <line x1="0" y1="0" x2="0" y2="35" stroke="#5a4028" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="0" x2="30" y2="35" stroke="#5a4028" stroke-width="4" stroke-linecap="round"/>
    <!-- 橫桿 -->
    <line x1="-3" y1="5" x2="33" y2="5" stroke="#5a4028" stroke-width="3" stroke-linecap="round"/>
    <!-- 掛著的武器 -->
    <line x1="8" y1="5" x2="8" y2="28" stroke="#7a7a7a" stroke-width="1.5"/>
    <line x1="15" y1="5" x2="15" y2="32" stroke="#8a8a8a" stroke-width="2"/>
    <line x1="22" y1="5" x2="22" y2="26" stroke="#7a7a7a" stroke-width="1.5"/>
  </g>

  <!-- ===== 木桶和麻袋（右側散落） ===== -->
  <!-- 木桶 -->
  <g transform="translate(660,210)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="14" ry="8" fill="#6a5038"/>
    <rect x="-14" y="0" width="28" height="20" fill="#7a6048" rx="2"/>
    <ellipse cx="0" cy="20" rx="14" ry="8" fill="#5a4028"/>
    <!-- 箍 -->
    <line x1="-13" y1="7" x2="13" y2="7" stroke="#4a3820" stroke-width="1.5"/>
    <line x1="-13" y1="14" x2="13" y2="14" stroke="#4a3820" stroke-width="1.5"/>
  </g>

  <!-- 麻袋 -->
  <ellipse cx="700" cy="235" rx="12" ry="9" fill="#b09868" opacity="0.5"/>
  <ellipse cx="715" cy="238" rx="10" ry="7" fill="#a08858" opacity="0.45"/>
  <path d="M695,228 Q700,222 705,228" fill="none" stroke="#8a7848" stroke-width="1" opacity="0.4"/>

  <!-- 另一組麻袋（左前方） -->
  <ellipse cx="280" cy="245" rx="11" ry="8" fill="#b09868" opacity="0.45"/>
  <ellipse cx="295" cy="248" rx="9" ry="6.5" fill="#a08858" opacity="0.4"/>

  <!-- ===== 倒在地上的木桶 ===== -->
  <g transform="translate(380,240) rotate(25)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="10" ry="6" fill="#6a5038"/>
    <rect x="-10" y="0" width="20" height="16" fill="#7a6048" rx="2"/>
  </g>

  <!-- ===== 岩壁底部的碎石 ===== -->
  <ellipse cx="195" cy="205" rx="10" ry="5" fill="#6a6050" opacity="0.4"/>
  <ellipse cx="210" cy="210" rx="7" ry="4" fill="#7a7060" opacity="0.35"/>
  <ellipse cx="760" cy="208" rx="9" ry="5" fill="#6a6050" opacity="0.38"/>
  <ellipse cx="745" cy="212" rx="6" ry="3.5" fill="#7a7060" opacity="0.3"/>

  <!-- ===== 空氣粒子（灰塵） ===== -->
  <circle cx="400" cy="160" r="1.2" fill="#d0c8b0" opacity="0.25"/>
  <circle cx="550" cy="145" r="1" fill="#d0c8b0" opacity="0.2"/>
  <circle cx="350" cy="200" r="0.8" fill="#d0c8b0" opacity="0.2"/>
  <circle cx="600" cy="190" r="1" fill="#d0c8b0" opacity="0.18"/>
  <circle cx="480" cy="170" r="1.3" fill="#d0c8b0" opacity="0.22"/>
  <circle cx="320" cy="140" r="0.9" fill="#d0c8b0" opacity="0.18"/>

  <!-- ===== 整體氛圍覆蓋（微暖泥土調） ===== -->
  <rect width="960" height="540" fill="#8a7050" opacity="0.04"/>
</svg>