<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 章邯 — 吉卜力2頭身 面朝右（敵方）戰鬥待機（軍姿立正持槍） -->
  <defs>
    <radialGradient id="zhanghanFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d0b090"/>
      <stop offset="100%" stop-color="#b89870"/>
    </radialGradient>
    <linearGradient id="zhanghanArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="zhanghanPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#18181e"/>
    </linearGradient>
    <linearGradient id="zhanghanHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <linearGradient id="zhanghanSpearhead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d0d8"/>
      <stop offset="100%" stop-color="#a0a0a8"/>
    </linearGradient>
    <linearGradient id="zhanghanShoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="34" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 紅色短披風（背後） ===== -->
      <path d="M-20,132 Q-24,160 -18,178" fill="none" stroke="#8a2020" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
      <path d="M20,132 Q24,160 18,178" fill="none" stroke="#8a2020" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

      <!-- ===== 腿（軍姿立正） ===== -->
      <!-- 後腿 -->
      <ellipse cx="14" cy="200" rx="11" ry="18" fill="url(#zhanghanPants)"/>
      <ellipse cx="13" cy="218" rx="13" ry="7" fill="#222228"/>
      <!-- 鐵脛甲 -->
      <rect x="6" y="206" width="14" height="10" rx="2" fill="#3a3a42" stroke="#8a7030" stroke-width="0.8" opacity="0.7"/>
      <!-- 前腿 -->
      <ellipse cx="-16" cy="199" rx="12" ry="18" fill="url(#zhanghanPants)"/>
      <ellipse cx="-17" cy="218" rx="13" ry="7" fill="#222228"/>
      <!-- 鐵脛甲 -->
      <rect x="-24" y="205" width="14" height="10" rx="2" fill="#3a3a42" stroke="#8a7030" stroke-width="0.8"/>

      <!-- ===== 身體（壯碩但紀律） ===== -->
      <ellipse cx="-2" cy="156" rx="28" ry="32" fill="url(#zhanghanArmor)"/>

      <!-- 鐵甲紋飾 -->
      <line x1="-20" y1="136" x2="-22" y2="180" stroke="#3a3a42" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      <line x1="16" y1="136" x2="18" y2="180" stroke="#3a3a42" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      <!-- 帝國禁衛軍徽章（紅色菱形） -->
      <path d="M-2,148 L4,155 L-2,162 L-8,155 Z" fill="#8a2020" stroke="#8a7030" stroke-width="0.8"/>
      <!-- 胸甲邊線 -->
      <rect x="-18" y="146" width="26" height="18" rx="3" fill="none" stroke="#3a3a42" stroke-width="1.2" opacity="0.5"/>

      <!-- 大肩甲（鐵色） -->
      <ellipse cx="-34" cy="136" rx="13" ry="9" fill="url(#zhanghanShoulder)" stroke="#8a7030" stroke-width="1"/>
      <line x1="-42" y1="133" x2="-26" y2="133" stroke="#8a2020" stroke-width="1.5" opacity="0.6"/>
      <ellipse cx="24" cy="136" rx="13" ry="9" fill="url(#zhanghanShoulder)" stroke="#8a7030" stroke-width="1"/>
      <line x1="16" y1="133" x2="32" y2="133" stroke="#8a2020" stroke-width="1.5" opacity="0.6"/>

      <!-- 領口（厚頸） -->
      <path d="M-12,130 L-4,146 L6,130" fill="none" stroke="#2a2a30" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-28,180 Q-2,188 26,180" fill="none" stroke="#1a1a20" stroke-width="7" stroke-linecap="round"/>
      <!-- 銅帶扣 -->
      <rect x="-8" y="177" width="12" height="10" rx="2" fill="#8a7030" stroke="#6a5020" stroke-width="0.8"/>

      <!-- ===== 畫面左側手臂（左手握槍後段） ===== -->
      <path d="M-26,142 Q-40,152 -36,168" fill="none" stroke="url(#zhanghanArmor)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
      <!-- 鐵臂甲 -->
      <rect x="-42" y="146" width="12" height="8" rx="2" fill="#3a3a42" stroke="#8a7030" stroke-width="0.6" opacity="0.7" transform="rotate(-10,-36,150)"/>

      <!-- ===== 大頭（鐵盔，嚴肅） ===== -->
      <!-- 頭盔底座 -->
      <ellipse cx="0" cy="90" rx="40" ry="42" fill="url(#zhanghanHelmet)"/>

      <!-- 臉（方正，堅毅） -->
      <path d="M-30,86 C-34,96 -32,114 -26,124 C-20,132 -8,136 2,134 C12,132 22,126 26,116 C30,104 28,90 22,82 C16,76 4,72 -4,74 C-14,76 -28,80 -30,86Z" fill="url(#zhanghanFace)"/>

      <!-- 鐵盔主體 -->
      <path d="M-32,78 C-26,60 -4,50 14,54 C28,58 36,70 32,82 C28,74 16,66 6,64 C-4,62 -16,64 -24,72" fill="url(#zhanghanHelmet)" stroke="#4a4a52" stroke-width="0.8"/>
      <!-- 盔前沿 -->
      <path d="M-32,82 C-22,76 -6,72 14,74 C26,76 34,80 32,84" fill="none" stroke="#4a4a52" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 紅色盔飾條 -->
      <path d="M-28,78 C-20,64 -2,56 16,60" fill="none" stroke="#8a2020" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <!-- 鼻護甲 -->
      <line x1="-2" y1="78" x2="-4" y2="104" stroke="#4a4a52" stroke-width="3" stroke-linecap="round"/>
      <!-- 頰甲（左） -->
      <path d="M-28,86 C-30,96 -28,108 -24,116" fill="none" stroke="#3a3a42" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <!-- 頰甲（右） -->
      <path d="M22,86 C24,96 22,108 18,116" fill="none" stroke="#3a3a42" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <!-- 盔頂飾（鐵尖） -->
      <path d="M-2,56 L0,40 L2,56" fill="#4a4a52" stroke="#3a3a42" stroke-width="0.8"/>

      <!-- 耳朵（被頰甲遮蔽大半） -->
      <path d="M20,102 C24,98 26,104 24,110" fill="url(#zhanghanFace)" stroke="#a08860" stroke-width="0.5"/>

      <!-- ===== 眼睛（堅定不移） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-12" cy="106" rx="5" ry="4" fill="#fff"/>
      <ellipse cx="-13" cy="107" rx="3.2" ry="3.2" fill="#2a2018"/>
      <ellipse cx="-13.5" cy="106" rx="1.8" ry="2" fill="#1a0800"/>
      <circle cx="-15" cy="105" r="0.8" fill="#fff" opacity="0.6"/>

      <!-- 右眼 -->
      <ellipse cx="8" cy="106" rx="5" ry="4" fill="#fff"/>
      <ellipse cx="7" cy="107" rx="3.2" ry="3.2" fill="#2a2018"/>
      <ellipse cx="6.5" cy="106" rx="1.8" ry="2" fill="#1a0800"/>
      <circle cx="5" cy="105" r="0.8" fill="#fff" opacity="0.6"/>

      <!-- 粗眉（剛直） -->
      <path d="M-18,100 C-14,98 -10,99 -7,101" fill="none" stroke="#2a1808" stroke-width="3" stroke-linecap="round"/>
      <path d="M12,101 C14,99 18,98 22,100" fill="none" stroke="#2a1808" stroke-width="3" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-16,114 C-18,120 -14,124" fill="none" stroke="#a08860" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 嘴巴（緊閉一字，堅毅） -->
      <line x1="-12" y1="130" x2="6" y2="130" stroke="#805040" stroke-width="2" stroke-linecap="round"/>

      <!-- ===== 畫面右側手臂（右手握槍前段） ===== -->
      <path d="M26,140 Q42,136 46,128" fill="none" stroke="url(#zhanghanArmor)" stroke-width="13" stroke-linecap="round"/>
      <!-- 鐵臂甲 -->
      <rect x="32" y="130" width="12" height="8" rx="2" fill="#3a3a42" stroke="#8a7030" stroke-width="0.6" transform="rotate(10,38,134)"/>

      <!-- ===== 槍（一條直線貫穿兩手） ===== -->
      <!-- 槍桿：從槍頭(64,112)穿過右手(43,126)到左手(-36,170)延伸 -->
      <line x1="64" y1="112" x2="-44" y2="175" stroke="#4a4040" stroke-width="5" stroke-linecap="round"/>
      <!-- 槍頭（沿槍桿方向，指向右上） -->
      <path d="M76,105 L67,116 L61,108 Z" fill="url(#zhanghanSpearhead)" stroke="#888" stroke-width="0.8"/>
      <!-- 紅纓 -->
      <circle cx="64" cy="112" r="3" fill="#aa2020"/>
      <path d="M62,115 Q58,120 56,116 M66,114 Q62,120 60,118" fill="none" stroke="#aa2020" stroke-width="2" stroke-linecap="round"/>

      <!-- 右手（正x，握槍桿前段） -->
      <circle cx="43" cy="126" r="6.5" fill="url(#zhanghanFace)"/>
      <!-- 左手（握槍桿後段） -->
      <circle cx="-36" cy="170" r="6.5" fill="url(#zhanghanFace)" opacity="0.85"/>
    </g>
  </g>
</svg>