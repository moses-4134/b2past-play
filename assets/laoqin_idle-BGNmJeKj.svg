<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 老秦 — 吉卜力2頭身 側面朝左 待機（持弓警戒） -->
  <defs>
    <radialGradient id="lqFace" cx="40%" cy="35%" r="55%"><stop offset="0%" stop-color="#e0c8a8"/><stop offset="100%" stop-color="#c8a888"/></radialGradient>
    <linearGradient id="lqOutfit" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#3a3830"/><stop offset="100%" stop-color="#242220"/></linearGradient>
    <linearGradient id="lqPants" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4a3828"/><stop offset="100%" stop-color="#2a1a10"/></linearGradient>
    <linearGradient id="lqHair" x1="0.2" y1="0" x2="0.7" y2="1"><stop offset="0%" stop-color="#808080"/><stop offset="100%" stop-color="#505050"/></linearGradient>
  </defs>
  <g transform="translate(130, 14)">
    <ellipse cx="-4" cy="217" rx="26" ry="5" fill="#000" opacity="0.1"/>
    <ellipse cx="10" cy="196" rx="9" ry="15" fill="url(#lqPants)" transform="rotate(-3,10,196)"/>
    <ellipse cx="8" cy="211" rx="10" ry="6" fill="#3a2818"/>
    <ellipse cx="-10" cy="194" rx="10" ry="16" fill="url(#lqPants)" transform="rotate(5,-10,194)"/>
    <ellipse cx="-12" cy="211" rx="11" ry="6" fill="#3a2818"/>
    <!-- 身體（壯實老兵） -->
    <ellipse cx="-2" cy="163" rx="26" ry="28" fill="url(#lqOutfit)" transform="rotate(-3,-2,163)"/>
    <!-- 舊皮帶 -->
    <path d="M-26,180 Q-2,188 22,180" fill="none" stroke="#5a3818" stroke-width="4" stroke-linecap="round"/>
    <rect x="-6" y="179" width="8" height="6" rx="1" fill="#6a4820"/>
    <!-- 舊軍服領口 -->
    <path d="M-10,139 L-4,152 L4,139" fill="none" stroke="#4a4038" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 肩甲殘痕 -->
    <ellipse cx="18" cy="146" rx="6" ry="4" fill="#3a3830" stroke="#2a2820" stroke-width="0.5" opacity="0.6"/>
    <!-- 角色左手垂放 -->
    <path d="M20,148 Q30,156 28,168" fill="none" stroke="url(#lqOutfit)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <circle cx="28" cy="170" r="5" fill="url(#lqFace)" opacity="0.85"/>
    <!-- 角色右手持弓 -->
    <path d="M-24,150 Q-40,140 -52,130" fill="none" stroke="url(#lqOutfit)" stroke-width="10" stroke-linecap="round"/>
    <!-- 大頭 -->
    <ellipse cx="0" cy="92" rx="36" ry="38" fill="url(#lqHair)"/>
    <!-- 臉（方正剛毅，風霜深刻） -->
    <path d="M-24,86 C-28,96 -26,112 -20,124 C-14,132 -4,136 6,134 C14,132 20,126 24,116 C28,104 26,92 20,84 C14,78 6,76 -2,78 C-12,80 -22,82 -24,86Z" fill="url(#lqFace)"/>
    <!-- 深刻皺紋 -->
    <path d="M-16,96 C-14,94 -8,94" fill="none" stroke="#b89878" stroke-width="1" opacity="0.4"/>
    <path d="M4,94 C8,92 14,94" fill="none" stroke="#b89878" stroke-width="1" opacity="0.4"/>
    <path d="M-18,120 C-16,124 -14,126" fill="none" stroke="#b89878" stroke-width="0.8" opacity="0.35"/>
    <!-- 短髮（灰白，軍人式） -->
    <path d="M-16,78 C-12,62 4,54 16,58 C24,62 28,72 24,80 C20,74 12,68 4,66 C-4,64 -10,68 -14,74" fill="url(#lqHair)"/>
    <!-- 極短碎髮 -->
    <path d="M-26,86 C-30,76 -32,80 -34,88 C-32,92 -28,92 -26,88" fill="url(#lqHair)"/>
    <path d="M-22,82 C-24,74 -28,76 -28,84 C-26,88 -22,88 -22,84" fill="#707070"/>
    <!-- 側面 -->
    <path d="M22,84 C26,78 28,86 26,96 C24,100 22,98 22,92" fill="url(#lqHair)"/>
    <!-- 耳朵 -->
    <path d="M22,100 C26,96 28,102 26,108 C24,112 22,110 22,106" fill="url(#lqFace)" stroke="#c8a888" stroke-width="0.5"/>
    <!-- 眼睛（細長銳利，老兵眼） -->
    <ellipse cx="-8" cy="106" rx="7" ry="5.5" fill="#fff"/>
    <ellipse cx="-9" cy="107" rx="4" ry="4" fill="#2a1808"/>
    <ellipse cx="-9.5" cy="106" rx="2" ry="2.2" fill="#0a0804"/>
    <circle cx="-11" cy="104.5" r="1.3" fill="#fff" opacity="0.6"/>
    <ellipse cx="8" cy="106" rx="7" ry="5.5" fill="#fff"/>
    <ellipse cx="7" cy="107" rx="4" ry="4" fill="#2a1808"/>
    <ellipse cx="6.5" cy="106" rx="2" ry="2.2" fill="#0a0804"/>
    <circle cx="5" cy="104.5" r="1.3" fill="#fff" opacity="0.6"/>
    <!-- 粗眉 -->
    <path d="M-16,98 C-12,95 -6,96 -2,98" fill="none" stroke="#606060" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M2,98 C6,95 12,96 16,98" fill="none" stroke="#606060" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 鼻子 -->
    <path d="M-10,114 C-11,118 -9,120 -7,119" fill="none" stroke="#c8a888" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 嘴巴（緊閉剛毅） -->
    <path d="M-6,126 C-3,127 1,127 4,126" fill="none" stroke="#806050" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 鬍碴（灰白粗短） -->
    <path d="M-8,130 C-5,132 0,132 3,130" fill="none" stroke="#808080" stroke-width="1.2" opacity="0.35"/>
    <path d="M-6,133 C-3,135 0,135 3,133" fill="none" stroke="#808080" stroke-width="0.8" opacity="0.25"/>
    <!-- 額疤 -->
    <line x1="-12" y1="82" x2="-4" y2="88" stroke="#b89878" stroke-width="0.8" opacity="0.4"/>

    <!-- 弓（垂直持，最上層）：弦在後，弓身在前，手握弓身 -->
    <line x1="-44" y1="80" x2="-44" y2="180" stroke="#b0a080" stroke-width="1.2"/>
    <path d="M-44,80 C-54,110 -54,150 -44,180" fill="none" stroke="#5a3818" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-54" cy="130" r="5" fill="url(#lqFace)"/>
  </g>
</svg>
