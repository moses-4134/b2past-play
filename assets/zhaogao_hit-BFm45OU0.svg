<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙高 — 吉卜力2頭身 面朝右（敵方）受擊 -->
  <defs>
    <radialGradient id="zgFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e4d8"/>
      <stop offset="100%" stop-color="#d8c8b0"/>
    </radialGradient>
    <linearGradient id="zgRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a1028"/>
      <stop offset="100%" stop-color="#0c0818"/>
    </linearGradient>
    <linearGradient id="zgInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1838"/>
      <stop offset="100%" stop-color="#180c28"/>
    </linearGradient>
    <linearGradient id="zgHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 14)">
      <!-- 陰影 -->
      <ellipse cx="2" cy="203.5" rx="24" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（後退踉蹌） ===== -->
      <ellipse cx="12" cy="184" rx="7" ry="14" fill="url(#zgInner)" transform="rotate(-8,12,184)"/>
      <ellipse cx="10" cy="198" rx="8" ry="5.5" fill="#1a1020"/>
      <ellipse cx="-4" cy="183" rx="7" ry="15" fill="url(#zgInner)" transform="rotate(8,-4,183)"/>
      <ellipse cx="-6" cy="198" rx="8" ry="5.5" fill="#1a1020"/>

      <!-- ===== 身體（後仰） ===== -->
      <ellipse cx="2" cy="154" rx="24" ry="26" fill="url(#zgRobe)" transform="rotate(12,2,154)"/>
      <path d="M-6,132 L-1,146 L6,132" fill="none" stroke="#2a1838" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M-18,170 Q2,178 22,170" fill="none" stroke="#808890" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 手臂（防護姿態） ===== -->
      <path d="M-16,142 Q-24,148 -20,158" fill="none" stroke="url(#zgRobe)" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="-20" cy="160" rx="7" ry="5" fill="#100820"/>
      <circle cx="-22" cy="160" r="4" fill="url(#zgFace)"/>

      <path d="M20,140 Q34,150 38,164" fill="none" stroke="url(#zgRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="38" cy="166" r="4" fill="url(#zgFace)" opacity="0.85"/>

      <!-- ===== 大頭（後仰痛苦） ===== -->
      <ellipse cx="4" cy="92" rx="36" ry="38" fill="url(#zgHair)"/>
      <path d="M-20,86 C-24,96 -22,112 -16,122 C-10,130 0,134 8,132 C14,130 20,124 24,114 C28,102 26,90 20,82 C14,76 4,74 0,76 C-8,78 -18,82 -20,86Z" fill="url(#zgFace)"/>
      <path d="M-10,78 C-6,58 10,50 22,56 C30,62 32,72 28,82 C24,74 16,66 8,64 C0,62 -6,66 -10,74" fill="url(#zgHair)"/>

      <!-- 宦官帽（歪斜） -->
      <g transform="rotate(10,4,54)">
        <ellipse cx="2" cy="56" rx="14" ry="8" fill="#101018" stroke="#303038" stroke-width="0.8"/>
        <ellipse cx="2" cy="52" rx="10" ry="5" fill="#181820"/>
        <line x1="-8" y1="56" x2="12" y2="56" stroke="#909898" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="-8" cy="56" r="1.5" fill="#a0a8a8"/>
        <circle cx="12" cy="56" r="1.5" fill="#a0a8a8"/>
      </g>

      <path d="M24,84 C30,80 32,88 30,96 C28,102 24,98 24,92" fill="url(#zgHair)"/>
      <path d="M-22,88 C-26,100 -24,112 -22,120" fill="none" stroke="url(#zgHair)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <path d="M22,100 C26,96 28,102 26,108 C24,112 22,110 22,106" fill="url(#zgFace)" stroke="#d0c0a8" stroke-width="0.5"/>

      <!-- 眼（緊閉痛苦） -->
      <path d="M-14,106 C-10,108 -6,106" fill="none" stroke="#181818" stroke-width="2" stroke-linecap="round"/>
      <path d="M4,106 C8,108 12,106" fill="none" stroke="#181818" stroke-width="2" stroke-linecap="round"/>

      <path d="M-14,100 C-10,98 -6,100 -2,102" fill="none" stroke="#181818" stroke-width="2" stroke-linecap="round"/>
      <path d="M4,102 C8,100 12,98 16,100" fill="none" stroke="#181818" stroke-width="2" stroke-linecap="round"/>

      <path d="M-8,114 C-9,118 -7,120" fill="none" stroke="#c8b898" stroke-width="1" stroke-linecap="round"/>

      <!-- 嘴（痛苦呻吟） -->
      <ellipse cx="0" cy="127" rx="4" ry="2.5" fill="#604040"/>
    </g>
  </g>
</svg>