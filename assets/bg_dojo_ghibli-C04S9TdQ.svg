<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 樓家堡道場 — 吉卜力風格：柔和色調、溫暖光影、手繪質感 -->
  <defs>
    <!-- 天空漸層（黃昏暖色） -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c490"/>
      <stop offset="40%" stop-color="#f0d8a8"/>
      <stop offset="100%" stop-color="#fce8c0"/>
    </linearGradient>
    <!-- 木地板 -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9e7e58"/>
      <stop offset="100%" stop-color="#7a5e3e"/>
    </linearGradient>
    <!-- 牆壁（溫暖土色） -->
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="100%" stop-color="#c0a47a"/>
    </linearGradient>
    <!-- 屋頂木梁 -->
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#4a3020"/>
    </linearGradient>
    <!-- 窗外光暈 -->
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffe8b0" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰塵光束 -->
    <linearGradient id="dustBeam" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fff8e0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ===== 背景天空（窗外可見） ===== -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- ===== 遠景：窗外的山丘與樹木（吉卜力風柔和剪影） ===== -->
  <!-- 遠山 -->
  <path d="M0,120 Q120,70 240,100 Q360,50 480,80 Q600,30 720,70 Q840,40 960,90 L960,180 L0,180 Z" fill="#a0b878" opacity="0.4"/>
  <path d="M0,135 Q100,100 200,125 Q350,80 500,115 Q650,75 800,105 Q900,90 960,115 L960,180 L0,180 Z" fill="#88a060" opacity="0.35"/>
  <!-- 遠景樹叢（圓潤吉卜力風） -->
  <circle cx="80" cy="110" r="25" fill="#7a9a50" opacity="0.4"/>
  <circle cx="120" cy="105" r="30" fill="#6a8a45" opacity="0.35"/>
  <circle cx="160" cy="112" r="22" fill="#8aaa58" opacity="0.38"/>
  <circle cx="380" cy="90" r="28" fill="#7a9a50" opacity="0.35"/>
  <circle cx="420" cy="85" r="35" fill="#6a8a45" opacity="0.3"/>
  <circle cx="750" cy="80" r="32" fill="#7a9a50" opacity="0.35"/>
  <circle cx="800" cy="75" r="26" fill="#8aaa58" opacity="0.3"/>

  <!-- ===== 道場建築主體 ===== -->
  <!-- 後牆（y=40 到 y=180） -->
  <rect x="0" y="40" width="960" height="140" fill="url(#wall)"/>
  <!-- 牆上木紋理線條 -->
  <line x1="0" y1="80" x2="960" y2="80" stroke="#b89870" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="120" x2="960" y2="120" stroke="#b89870" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="155" x2="960" y2="155" stroke="#b89870" stroke-width="0.5" opacity="0.25"/>

  <!-- ===== 屋頂/天花板 ===== -->
  <rect x="0" y="0" width="960" height="40" fill="url(#beam)"/>
  <!-- 天花板橫梁 -->
  <rect x="0" y="36" width="960" height="8" fill="#5a4030" opacity="0.6"/>
  <!-- 直梁 -->
  <rect x="80" y="0" width="12" height="44" fill="#4a3020" opacity="0.5" rx="2"/>
  <rect x="300" y="0" width="12" height="44" fill="#4a3020" opacity="0.5" rx="2"/>
  <rect x="500" y="0" width="12" height="44" fill="#4a3020" opacity="0.5" rx="2"/>
  <rect x="700" y="0" width="12" height="44" fill="#4a3020" opacity="0.5" rx="2"/>
  <rect x="880" y="0" width="12" height="44" fill="#4a3020" opacity="0.5" rx="2"/>

  <!-- ===== 窗戶（吉卜力風格的大窗，溫暖光線灑入） ===== -->
  <!-- 左窗 -->
  <rect x="100" y="60" width="80" height="110" fill="#e8d8b0" rx="4" stroke="#7a5a38" stroke-width="3"/>
  <line x1="140" y1="60" x2="140" y2="170" stroke="#7a5a38" stroke-width="2"/>
  <line x1="100" y1="115" x2="180" y2="115" stroke="#7a5a38" stroke-width="2"/>
  <rect x="100" y="60" width="80" height="110" fill="url(#windowGlow)" rx="4"/>

  <!-- 中窗 -->
  <rect x="420" y="50" width="120" height="125" fill="#e8d8b0" rx="4" stroke="#7a5a38" stroke-width="3"/>
  <line x1="480" y1="50" x2="480" y2="175" stroke="#7a5a38" stroke-width="2"/>
  <line x1="420" y1="112" x2="540" y2="112" stroke="#7a5a38" stroke-width="2"/>
  <rect x="420" y="50" width="120" height="125" fill="url(#windowGlow)" rx="4"/>

  <!-- 右窗 -->
  <rect x="760" y="60" width="80" height="110" fill="#e8d8b0" rx="4" stroke="#7a5a38" stroke-width="3"/>
  <line x1="800" y1="60" x2="800" y2="170" stroke="#7a5a38" stroke-width="2"/>
  <line x1="760" y1="115" x2="840" y2="115" stroke="#7a5a38" stroke-width="2"/>
  <rect x="760" y="60" width="80" height="110" fill="url(#windowGlow)" rx="4"/>

  <!-- ===== 窗外光束（灰塵中的斜光） ===== -->
  <polygon points="140,60 200,255 120,255" fill="url(#dustBeam)"/>
  <polygon points="480,50 560,255 440,255" fill="url(#dustBeam)"/>
  <polygon points="800,60 860,255 740,255" fill="url(#dustBeam)"/>

  <!-- ===== 牆上裝飾 ===== -->
  <!-- 掛軸（左） -->
  <rect x="240" y="70" width="30" height="80" fill="#c8a870" rx="2" stroke="#8a6840" stroke-width="1.5"/>
  <rect x="244" y="74" width="22" height="72" fill="#e8d8c0" rx="1"/>
  <text x="255" y="115" fill="#4a3020" font-size="14" font-family="serif" text-anchor="middle">武</text>
  <circle cx="255" cy="68" r="3" fill="#8a6840"/>

  <!-- 掛軸（右） -->
  <rect x="660" y="70" width="30" height="80" fill="#c8a870" rx="2" stroke="#8a6840" stroke-width="1.5"/>
  <rect x="664" y="74" width="22" height="72" fill="#e8d8c0" rx="1"/>
  <text x="675" y="115" fill="#4a3020" font-size="14" font-family="serif" text-anchor="middle">道</text>
  <circle cx="675" cy="68" r="3" fill="#8a6840"/>

  <!-- 武器架 -->
  <rect x="580" y="95" width="50" height="6" fill="#6a4a28" rx="2"/>
  <rect x="578" y="85" width="4" height="70" fill="#5a3a20" rx="1"/>
  <rect x="628" y="85" width="4" height="70" fill="#5a3a20" rx="1"/>
  <!-- 架上的劍 -->
  <line x1="584" y1="93" x2="624" y2="91" stroke="#aaa" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="584" y1="87" x2="620" y2="85" stroke="#bbb" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== 地板（起始 y=180） ===== -->
  <rect x="0" y="180" width="960" height="360" fill="url(#floor)"/>
  <!-- 地板木紋 -->
  <line x1="0" y1="220" x2="960" y2="220" stroke="#8a6a48" stroke-width="0.8" opacity="0.3"/>
  <line x1="0" y1="265" x2="960" y2="265" stroke="#8a6a48" stroke-width="0.8" opacity="0.25"/>
  <line x1="0" y1="310" x2="960" y2="310" stroke="#8a6a48" stroke-width="0.8" opacity="0.2"/>
  <line x1="0" y1="360" x2="960" y2="360" stroke="#8a6a48" stroke-width="0.8" opacity="0.18"/>
  <line x1="0" y1="410" x2="960" y2="410" stroke="#8a6a48" stroke-width="0.8" opacity="0.15"/>
  <line x1="0" y1="470" x2="960" y2="470" stroke="#8a6a48" stroke-width="0.8" opacity="0.12"/>
  <!-- 地板直紋 -->
  <line x1="120" y1="180" x2="120" y2="540" stroke="#8a6a48" stroke-width="0.5" opacity="0.15"/>
  <line x1="240" y1="180" x2="240" y2="540" stroke="#8a6a48" stroke-width="0.5" opacity="0.15"/>
  <line x1="360" y1="180" x2="360" y2="540" stroke="#8a6a48" stroke-width="0.5" opacity="0.15"/>
  <line x1="480" y1="180" x2="480" y2="540" stroke="#8a6a48" stroke-width="0.5" opacity="0.15"/>
  <line x1="600" y1="180" x2="600" y2="540" stroke="#8a6a48" stroke-width="0.5" opacity="0.15"/>
  <line x1="720" y1="180" x2="720" y2="540" stroke="#8a6a48" stroke-width="0.5" opacity="0.15"/>
  <line x1="840" y1="180" x2="840" y2="540" stroke="#8a6a48" stroke-width="0.5" opacity="0.15"/>

  <!-- 地板與牆壁交界線 -->
  <line x1="0" y1="180" x2="960" y2="180" stroke="#6a4a28" stroke-width="3"/>

  <!-- ===== 地板上的物件 ===== -->
  <!-- 蠟燭台（左） -->
  <rect x="30" y="160" width="8" height="24" fill="#6a4a28" rx="1"/>
  <ellipse cx="34" cy="158" rx="4" ry="2" fill="#d4a030"/>
  <ellipse cx="34" cy="155" rx="2" ry="4" fill="#ff8820" opacity="0.7"/>
  <ellipse cx="34" cy="152" rx="1.5" ry="3" fill="#ffcc44" opacity="0.5"/>

  <!-- 蠟燭台（右） -->
  <rect x="912" y="160" width="8" height="24" fill="#6a4a28" rx="1"/>
  <ellipse cx="916" cy="158" rx="4" ry="2" fill="#d4a030"/>
  <ellipse cx="916" cy="155" rx="2" ry="4" fill="#ff8820" opacity="0.7"/>
  <ellipse cx="916" cy="152" rx="1.5" ry="3" fill="#ffcc44" opacity="0.5"/>

  <!-- ===== 空氣中的灰塵粒子（吉卜力特色） ===== -->
  <circle cx="180" cy="120" r="1.5" fill="#fff8d0" opacity="0.4"/>
  <circle cx="320" cy="165" r="1" fill="#fff8d0" opacity="0.3"/>
  <circle cx="450" cy="100" r="1.8" fill="#fff8d0" opacity="0.35"/>
  <circle cx="520" cy="215" r="1.2" fill="#fff8d0" opacity="0.3"/>
  <circle cx="650" cy="140" r="1.5" fill="#fff8d0" opacity="0.35"/>
  <circle cx="780" cy="175" r="1" fill="#fff8d0" opacity="0.3"/>
  <circle cx="200" cy="265" r="1.3" fill="#fff8d0" opacity="0.25"/>
  <circle cx="400" cy="235" r="1" fill="#fff8d0" opacity="0.2"/>
  <circle cx="600" cy="295" r="1.5" fill="#fff8d0" opacity="0.2"/>
  <circle cx="850" cy="255" r="1.2" fill="#fff8d0" opacity="0.25"/>
  <circle cx="140" cy="205" r="0.8" fill="#fff8d0" opacity="0.3"/>
  <circle cx="700" cy="110" r="1.4" fill="#fff8d0" opacity="0.35"/>

  <!-- ===== 整體氛圍覆蓋（暖色調） ===== -->
  <rect width="960" height="540" fill="#f0c870" opacity="0.06"/>
</svg>