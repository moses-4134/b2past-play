<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 申魁 — 吉卜力2頭身 側面朝左 協防（挺身護人） -->
  <defs>
    <radialGradient id="tengFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8c8a0"/>
      <stop offset="100%" stop-color="#d0a880"/>
    </radialGradient>
    <linearGradient id="tengJacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="tengPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="100%" stop-color="#222220"/>
    </linearGradient>
    <linearGradient id="tengHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#201008"/>
      <stop offset="100%" stop-color="#100804"/>
    </linearGradient>
    <linearGradient id="tengBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="225" rx="30" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（挺立站穩，前腿踏出護人） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="12" cy="198" rx="10" ry="18" fill="url(#tengPants)" transform="rotate(-3,12,198)"/>
    <ellipse cx="10" cy="216" rx="11" ry="7" fill="#3a2818"/>
    <!-- 前腿（左腿，向前踏出一步） -->
    <ellipse cx="-16" cy="196" rx="11" ry="19" fill="url(#tengPants)" transform="rotate(10,-16,196)"/>
    <ellipse cx="-20" cy="214" rx="12" ry="7" fill="#3a2818"/>

    <!-- ===== 身體（挺立微前傾，壯碩鐵壁） ===== -->
    <ellipse cx="-2" cy="158" rx="28" ry="30" fill="url(#tengJacket)" transform="rotate(-8,-2,158)"/>

    <!-- 領口 -->
    <path d="M-12,137 L-6,151 L2,137" fill="none" stroke="#6a5838" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-28,178 Q-2,186 24,178" fill="none" stroke="#5a4030" stroke-width="6" stroke-linecap="round"/>
    <rect x="-8" y="176" width="8" height="8" rx="1" fill="#c8a848" stroke="#a08030" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手，握拳向後護人） ===== -->
    <path d="M20,146 Q36,152 44,160 Q50,166 54,172" fill="none" stroke="url(#tengJacket)" stroke-width="11" stroke-linecap="round"/>
    <!-- 護臂 -->
    <path d="M36,154 Q40,152 42,158" fill="none" stroke="#4a3020" stroke-width="4" stroke-linecap="round"/>
    <!-- 手掌（張開護人手勢） -->
    <g transform="translate(54,172)">
      <circle cx="0" cy="0" r="6" fill="url(#tengFace)"/>
      <line x1="2" y1="-4" x2="5" y2="-9" stroke="url(#tengFace)" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="4" y1="-2" x2="8" y2="-6" stroke="url(#tengFace)" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="5" y1="0" x2="9" y2="-2" stroke="url(#tengFace)" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="4" y1="3" x2="8" y2="2" stroke="url(#tengFace)" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- ===== 畫面左側手臂（角色右手，持大刀向前擋敵） ===== -->
    <path d="M-24,146 Q-42,138 -52,140" fill="none" stroke="url(#tengJacket)" stroke-width="12" stroke-linecap="round"/>
    <!-- 護臂 -->
    <path d="M-38,140 Q-42,136 -48,138" fill="none" stroke="#4a3020" stroke-width="4" stroke-linecap="round"/>

    <!-- ===== 大刀（向前伸出如鐵壁擋格） ===== -->
    <!-- 刀身（近水平前伸，刀刃朝外） -->
    <path d="M-52,140 L-100,128 L-104,126 L-108,132 Q-88,136 -56,144 Z" fill="url(#tengBlade)" stroke="#777" stroke-width="0.5"/>
    <!-- 刀背厚線 -->
    <line x1="-52" y1="140" x2="-100" y2="128" stroke="#999" stroke-width="2" stroke-linecap="round"/>
    <!-- 刀尖斜角切面線 -->
    <line x1="-104" y1="126" x2="-108" y2="132" stroke="#888" stroke-width="1"/>
    <!-- 刀刃亮線 -->
    <path d="M-56,144 Q-88,136 -108,132" fill="none" stroke="#ddd" stroke-width="0.8" opacity="0.3"/>
    <!-- 刀護手 -->
    <line x1="-54" y1="136" x2="-50" y2="146" stroke="#a08040" stroke-width="4" stroke-linecap="round"/>
    <!-- 刀柄 -->
    <line x1="-48" y1="144" x2="-42" y2="146" stroke="#5a4530" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-40" cy="147" r="3" fill="#a08040"/>
    <!-- 握刀的手（在柄中段） -->
    <circle cx="-49" cy="142" r="6" fill="url(#tengFace)"/>

    <!-- ===== 大頭（微前傾，堅毅護人表情） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="90" rx="40" ry="42" fill="url(#tengHair)"/>

    <!-- 臉（方正寬臉，前傾） -->
    <path d="M-30,84 C-34,96 -32,114 -26,124 C-20,132 -8,136 2,134 C12,132 22,124 26,114 C30,102 28,88 22,80 C16,74 4,70 -6,72 C-18,74 -28,78 -30,84Z" fill="url(#tengFace)"/>

    <!-- 鬍渣暗示 -->
    <ellipse cx="-8" cy="130" rx="12" ry="5" fill="#8a7060" opacity="0.15"/>

    <!-- 頭髮頂部 -->
    <path d="M-20,74 C-16,56 0,48 14,52 C26,56 32,68 28,78 C24,72 16,66 8,64 C0,62 -10,64 -16,70" fill="url(#tengHair)"/>

    <!-- 短瀏海 -->
    <path d="M-28,84 C-32,74 -34,78 -34,84 C-32,88 -28,88 -28,86" fill="url(#tengHair)"/>
    <path d="M-24,78 C-26,70 -30,72 -30,80 C-28,84 -24,84 -24,82" fill="#201008"/>

    <!-- 布巾紮帶 -->
    <path d="M-30,76 C-20,68 0,64 20,68 C28,70 32,74 30,78" fill="none" stroke="#5a2020" stroke-width="4" stroke-linecap="round"/>
    <!-- 紮帶末端 -->
    <path d="M30,78 C32,82 34,88 32,92" fill="none" stroke="#5a2020" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- 髮髻 -->
    <ellipse cx="4" cy="54" rx="8" ry="6" fill="url(#tengHair)"/>
    <path d="M-2,52 C0,44 8,44 10,52" fill="url(#tengHair)"/>

    <!-- 側髮 -->
    <path d="M22,80 C26,76 28,82 26,88 C24,92 22,90 22,86" fill="url(#tengHair)"/>

    <!-- 耳朵 -->
    <path d="M20,98 C24,94 26,100 24,106 C22,110 20,108 20,104" fill="url(#tengFace)" stroke="#c8a880" stroke-width="0.5"/>

    <!-- ===== 眼睛（堅毅前視，護人決心） ===== -->
    <!-- 左眼 -->
    <ellipse cx="-12" cy="104" rx="6.5" ry="6" fill="#fff"/>
    <ellipse cx="-13" cy="105" rx="4" ry="4.5" fill="#2a1808"/>
    <ellipse cx="-13.5" cy="104" rx="2.2" ry="2.5" fill="#0c0400"/>
    <circle cx="-15" cy="102" r="1.2" fill="#fff" opacity="0.7"/>

    <!-- 右眼（同大小） -->
    <ellipse cx="4" cy="104" rx="6.5" ry="6" fill="#fff"/>
    <ellipse cx="3" cy="105" rx="4" ry="4.5" fill="#2a1808"/>
    <ellipse cx="2.5" cy="104" rx="2.2" ry="2.5" fill="#0c0400"/>
    <circle cx="1" cy="102" r="1.2" fill="#fff" opacity="0.7"/>

    <!-- 鼻子 -->
    <path d="M-18,112 C-19,116 -17,120" fill="none" stroke="#c0a078" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（緊閉一字線，堅毅護人） -->
    <path d="M-13,128 C-9,127 -4,127 0,128" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>
    <path d="M-13,128 C-14,129.5 -15,130" fill="none" stroke="#906050" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M0,128 C1,129.5 2,130" fill="none" stroke="#906050" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>