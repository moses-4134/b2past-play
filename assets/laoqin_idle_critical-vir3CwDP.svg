<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 老秦 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪、弓撐地、喘息） -->
  <defs>
    <radialGradient id="lqcFace" cx="40%" cy="35%" r="55%"><stop offset="0%" stop-color="#e0c8a8"/><stop offset="100%" stop-color="#c8a888"/></radialGradient>
    <linearGradient id="lqcOutfit" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#3a3830"/><stop offset="100%" stop-color="#242220"/></linearGradient>
    <linearGradient id="lqcPants" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4a3828"/><stop offset="100%" stop-color="#2a1a10"/></linearGradient>
    <linearGradient id="lqcHair" x1="0.2" y1="0" x2="0.7" y2="1"><stop offset="0%" stop-color="#808080"/><stop offset="100%" stop-color="#505050"/></linearGradient>
  </defs>
  <g transform="translate(130, 28)">
    <ellipse cx="-4" cy="210" rx="30" ry="6" fill="#000" opacity="0.12"/>
    <!-- 腿（半跪） -->
    <ellipse cx="8" cy="190" rx="10" ry="12" fill="url(#lqcPants)" transform="rotate(-20,8,190)"/>
    <ellipse cx="2" cy="202" rx="8" ry="5" fill="url(#lqcPants)"/>
    <ellipse cx="0" cy="206" rx="9.5" ry="5.5" fill="#3a2818"/>
    <ellipse cx="-12" cy="186" rx="10.5" ry="16" fill="url(#lqcPants)" transform="rotate(12,-12,186)"/>
    <ellipse cx="-16" cy="206" rx="11" ry="5.5" fill="#3a2818"/>
    <!-- 身體（大幅前傾） -->
    <ellipse cx="-2" cy="156" rx="26" ry="27" fill="url(#lqcOutfit)" transform="rotate(-14,-2,156)"/>
    <!-- 舊皮帶 -->
    <path d="M-28,172 Q-2,180 20,174" fill="none" stroke="#5a3818" stroke-width="4" stroke-linecap="round"/>
    <rect x="-6" y="174" width="8" height="6" rx="1" fill="#6a4820"/>
    <!-- 舊軍服領口 -->
    <path d="M-12,135 L-6,148 L2,135" fill="none" stroke="#4a4038" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 肩甲殘痕 -->
    <ellipse cx="16" cy="140" rx="6" ry="4" fill="#3a3830" stroke="#2a2820" stroke-width="0.5" opacity="0.6"/>
    <!-- 角色左手（撐在膝蓋） -->
    <path d="M18,142 Q28,160 18,180" fill="none" stroke="url(#lqcOutfit)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <circle cx="17" cy="182" r="5" fill="url(#lqcFace)" opacity="0.85"/>
    <!-- 角色右手（弓撐地） -->
    <path d="M-24,144 Q-46,150 -56,164" fill="none" stroke="url(#lqcOutfit)" stroke-width="10" stroke-linecap="round"/>

    <!-- 大頭（低垂） -->
    <ellipse cx="0" cy="88" rx="36" ry="38" fill="url(#lqcHair)"/>
    <!-- 臉 -->
    <path d="M-26,84 C-30,94 -28,110 -22,122 C-16,130 -6,134 4,132 C12,130 18,124 22,114 C26,102 24,90 18,82 C12,76 4,74 -4,76 C-14,78 -24,80 -26,84Z" fill="url(#lqcFace)"/>
    <!-- 腮紅（痛苦更明顯） -->
    <ellipse cx="-20" cy="120" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>
    <!-- 深刻皺紋 -->
    <path d="M-16,94 C-14,92 -8,92" fill="none" stroke="#b89878" stroke-width="1" opacity="0.4"/>
    <path d="M4,92 C8,90 14,92" fill="none" stroke="#b89878" stroke-width="1" opacity="0.4"/>
    <path d="M-18,118 C-16,122 -14,124" fill="none" stroke="#b89878" stroke-width="0.8" opacity="0.35"/>
    <!-- 短髮 -->
    <path d="M-18,76 C-14,60 2,52 14,56 C22,60 26,70 22,78 C18,72 10,66 4,64 C-4,62 -12,66 -16,72" fill="url(#lqcHair)"/>
    <!-- 極短碎髮（散亂） -->
    <path d="M-28,84 C-32,74 -34,78 -36,86 C-34,90 -30,90 -28,86" fill="url(#lqcHair)"/>
    <path d="M-24,80 C-26,72 -30,74 -30,82 C-28,86 -24,86 -24,82" fill="#707070"/>
    <!-- 散落髮絲 -->
    <path d="M-30,88 C-32,94 -30,98" fill="none" stroke="url(#lqcHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- 側面 -->
    <path d="M20,82 C24,76 26,84 24,94 C22,98 20,96 20,90" fill="url(#lqcHair)"/>
    <!-- 耳朵 -->
    <path d="M20,98 C24,94 26,100 24,106 C22,110 20,108 20,104" fill="url(#lqcFace)" stroke="#c8a888" stroke-width="0.5"/>
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-10" cy="104" rx="6.5" ry="2" fill="#fff"/>
    <ellipse cx="-11" cy="104.5" rx="3.5" ry="1.5" fill="#2a1808"/>
    <ellipse cx="-11.5" cy="104" rx="1.8" ry="1" fill="#0a0804"/>
    <!-- 右眼（勉強一線） -->
    <ellipse cx="6" cy="104" rx="6.5" ry="2.5" fill="#fff"/>
    <ellipse cx="5" cy="104.5" rx="3.5" ry="2" fill="#2a1808"/>
    <ellipse cx="4.5" cy="104" rx="1.8" ry="1.2" fill="#0a0804"/>
    <circle cx="3" cy="103" r="0.8" fill="#fff" opacity="0.7"/>
    <!-- 眉間深皺 -->
    <path d="M-5,97 C-3,95 -1,95 1,97" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-6,99 C-4,97.5 -1,97.5 1,99" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
    <!-- 粗眉 -->
    <path d="M-16,96 C-12,93 -6,94 -2,96" fill="none" stroke="#606060" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M2,96 C6,93 12,94 16,96" fill="none" stroke="#606060" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 鼻子 -->
    <path d="M-12,112 C-13,116 -11,118 -9,117" fill="none" stroke="#c8a888" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 嘴巴（喘息張開） -->
    <ellipse cx="-4" cy="125" rx="5" ry="4.5" fill="#703030"/>
    <path d="M-8,123 L0,123" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <!-- 鬍碴 -->
    <path d="M-8,130 C-5,132 0,132 3,130" fill="none" stroke="#808080" stroke-width="1" opacity="0.3"/>
    <!-- 額疤 -->
    <line x1="-14" y1="80" x2="-6" y2="86" stroke="#b89878" stroke-width="0.8" opacity="0.4"/>

    <!-- 汗滴（多顆） -->
    <path d="M-24,86 C-25,90 -24,94 -23,97" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-23" cy="98" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M20,88 C21,92 20,96" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="20" cy="97" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <ellipse cx="-6" cy="76" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>

    <!-- 弓（撐地支撐，最上層） -->
    <line x1="-58" y1="110" x2="-58" y2="208" stroke="#b0a080" stroke-width="1.2"/>
    <path d="M-58,110 C-66,140 -66,180 -58,208" fill="none" stroke="#5a3818" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="-58" cy="208" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>
    <circle cx="-58" cy="168" r="5" fill="url(#lqcFace)"/>
  </g>
</svg>