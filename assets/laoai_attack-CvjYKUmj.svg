<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 嫪毐 — 吉卜力2頭身 面朝右（敵方）攻擊（猛力劈斬） -->
  <defs>
    <radialGradient id="laoaiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b080"/>
      <stop offset="100%" stop-color="#c09868"/>
    </radialGradient>
    <linearGradient id="laoaiArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#4a2a18"/>
    </linearGradient>
    <linearGradient id="laoaiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#221810"/>
    </linearGradient>
    <linearGradient id="laoaiBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <linearGradient id="laoaiHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a08838"/>
      <stop offset="100%" stop-color="#8a7030"/>
    </linearGradient>
    <linearGradient id="laoaiGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8b848"/>
      <stop offset="100%" stop-color="#c8a840"/>
    </linearGradient>
    <linearGradient id="laoaiShoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-10" cy="225" rx="38" ry="6" fill="#000" opacity="0.14"/>

      <!-- ===== 腿（前衝弓步猛攻） ===== -->
      <!-- 後腿（蹬地） -->
      <ellipse cx="22" cy="201" rx="12" ry="18" fill="url(#laoaiPants)" transform="rotate(-14,22,201)"/>
      <ellipse cx="20" cy="218" rx="14" ry="7.5" fill="#3a2018"/>
      <!-- 前腿（大步前踏） -->
      <ellipse cx="-30" cy="197" rx="13" ry="19" fill="url(#laoaiPants)" transform="rotate(16,-30,197)"/>
      <ellipse cx="-34" cy="218" rx="14" ry="7.5" fill="#3a2018"/>

      <!-- ===== 身體（前傾猛撲） ===== -->
      <ellipse cx="-6" cy="152" rx="30" ry="34" fill="url(#laoaiArmor)" transform="rotate(-16,-6,152)"/>

      <!-- 金色鎧甲紋飾 -->
      <line x1="-24" y1="130" x2="-28" y2="178" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <line x1="14" y1="130" x2="16" y2="178" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <rect x="-22" y="142" width="28" height="18" rx="3" fill="none" stroke="#c8a840" stroke-width="1.2" opacity="0.5" transform="rotate(-16,-8,151)"/>

      <!-- 大肩甲 -->
      <ellipse cx="-40" cy="130" rx="14" ry="10" fill="url(#laoaiShoulder)" stroke="#c8a840" stroke-width="1"/>
      <ellipse cx="20" cy="138" rx="14" ry="10" fill="url(#laoaiShoulder)" stroke="#c8a840" stroke-width="1"/>

      <!-- 領口 -->
      <path d="M-18,128 L-10,144 L0,128" fill="none" stroke="#6a4828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 翡翠腰帶 -->
      <path d="M-32,178 Q-6,187 26,178" fill="none" stroke="#4a2a18" stroke-width="7" stroke-linecap="round"/>
      <rect x="-12" y="175" width="14" height="12" rx="2" fill="#4a8848" stroke="#c8a840" stroke-width="1"/>

      <!-- ===== 畫面右側手臂（後手輔助） ===== -->
      <path d="M22,144 Q34,152 30,170" fill="none" stroke="url(#laoaiArmor)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
      <circle cx="30" cy="172" r="7" fill="url(#laoaiFace)" opacity="0.85"/>

      <!-- ===== 大頭（前傾怒吼） ===== -->
      <!-- 頭盔底座 -->
      <ellipse cx="-4" cy="88" rx="42" ry="44" fill="url(#laoaiHelmet)"/>

      <!-- 臉 -->
      <path d="M-36,82 C-40,94 -38,114 -32,124 C-26,132 -12,138 0,136 C10,134 20,126 24,114 C28,102 26,88 20,80 C14,74 2,70 -8,72 C-20,74 -34,78 -36,82Z" fill="url(#laoaiFace)"/>

      <!-- 鳳翼頭盔 -->
      <path d="M-38,76 C-32,56 -10,46 10,50 C26,54 34,68 30,80 C26,72 14,64 4,62 C-6,60 -18,62 -28,70" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M-38,80 C-28,74 -12,70 10,72 C24,74 32,78 30,82" fill="none" stroke="#c8a840" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 鳳翼左翼 -->
      <path d="M-34,72 C-44,58 -50,48 -46,42 C-42,38 -38,44 -34,56" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M-46,42 C-52,36 -48,32 -42,38" fill="none" stroke="#c8a840" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 鳳翼右翼 -->
      <path d="M24,72 C32,58 38,48 34,42 C30,38 26,44 24,56" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M34,42 C40,36 36,32 30,38" fill="none" stroke="#c8a840" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 頭盔頂飾 -->
      <path d="M-8,54 L-4,38 L0,54" fill="url(#laoaiGold)" stroke="#c8a840" stroke-width="0.8"/>

      <!-- 耳朵 -->
      <path d="M18,100 C22,96 24,102 22,110 C20,114 18,112 18,106" fill="url(#laoaiFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（圓睜怒目） ===== -->
      <ellipse cx="-16" cy="106" rx="6" ry="5.5" fill="#fff"/>
      <ellipse cx="-17" cy="107" rx="4" ry="4" fill="#3a1810"/>
      <ellipse cx="-17.5" cy="106" rx="2.3" ry="2.5" fill="#1a0800"/>
      <circle cx="-19" cy="104.5" r="1" fill="#fff" opacity="0.6"/>

      <ellipse cx="2" cy="106" rx="6" ry="5.5" fill="#fff"/>
      <ellipse cx="1" cy="107" rx="4" ry="4" fill="#3a1810"/>
      <ellipse cx="0.5" cy="106" rx="2.3" ry="2.5" fill="#1a0800"/>
      <circle cx="-1" cy="104.5" r="1" fill="#fff" opacity="0.6"/>

      <!-- 粗眉毛（怒皺） -->
      <path d="M-22,98 C-18,94 -14,95 -10,99" fill="none" stroke="#2a1808" stroke-width="3.8" stroke-linecap="round"/>
      <path d="M6,99 C8,95 12,94 16,98" fill="none" stroke="#2a1808" stroke-width="3.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-22,114 C-24,120 -20,124" fill="none" stroke="#a08058" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 嘴巴（張嘴怒吼） -->
      <ellipse cx="-10" cy="130" rx="8" ry="4" fill="#603028"/>
      <path d="M-16,129 C-12,127 -8,127 -4,129" fill="none" stroke="#c09868" stroke-width="0.8"/>

      <!-- ===== 畫面左側手臂（武器手，劈向負x） ===== -->
      <path d="M-32,138 Q-58,124 -72,118" fill="none" stroke="url(#laoaiArmor)" stroke-width="15" stroke-linecap="round"/>
      <path d="M-52,128 Q-58,124 -64,120" fill="none" stroke="#4a2a18" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 斬馬大刀（負x，下劈攻擊） ===== -->
      <!-- 刀身 -->
      <path d="M-72,112 L-92,60 L-96,50 L-108,56 Q-90,86 -78,116 Z" fill="url(#laoaiBlade)" stroke="#666" stroke-width="0.5"/>
      <!-- 刀背厚線 -->
      <line x1="-72" y1="112" x2="-92" y2="60" stroke="#888" stroke-width="2.8" stroke-linecap="round"/>
      <!-- 刀尖斜角 -->
      <line x1="-96" y1="50" x2="-108" y2="56" stroke="#777" stroke-width="1.5"/>
      <!-- 刀刃亮線 -->
      <path d="M-78,116 Q-90,86 -108,56" fill="none" stroke="#ddd" stroke-width="0.8" opacity="0.3"/>
      <!-- 刀護手 -->
      <line x1="-78" y1="118" x2="-66" y2="112" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
      <!-- 刀柄 -->
      <line x1="-70" y1="116" x2="-68" y2="128" stroke="#5a3a20" stroke-width="6" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="-67" cy="131" r="4" fill="#c8a840"/>
      <!-- 握刀的手 -->
      <circle cx="-69" cy="122" r="7" fill="url(#laoaiFace)"/>
    </g>
  </g>
</svg>