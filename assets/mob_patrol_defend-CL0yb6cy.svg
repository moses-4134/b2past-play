<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙國巡邏兵 — 防禦（劍擋身前，蹲低） -->
  <defs>
    <radialGradient id="mobPatrolFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c4a0"/>
      <stop offset="100%" stop-color="#cca880"/>
    </radialGradient>
    <linearGradient id="mobPatrolArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a4038"/>
      <stop offset="100%" stop-color="#2a3028"/>
    </linearGradient>
    <linearGradient id="mobPatrolPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3028"/>
      <stop offset="100%" stop-color="#1a2018"/>
    </linearGradient>
    <linearGradient id="mobPatrolHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobPatrolSteel" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="200" rx="24" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（蹲低） ===== -->
      <!-- 後腿 -->
      <ellipse cx="10" cy="184" rx="9" ry="13" fill="url(#mobPatrolPants)" transform="rotate(-5,10,184)"/>
      <ellipse cx="8" cy="196" rx="10" ry="6" fill="#1a2018"/>
      <!-- 前腿 -->
      <ellipse cx="-10" cy="182" rx="10" ry="14" fill="url(#mobPatrolPants)" transform="rotate(8,-10,182)"/>
      <ellipse cx="-14" cy="196" rx="10" ry="6" fill="#1a2018"/>

      <!-- ===== 身體（蹲縮） ===== -->
      <ellipse cx="-2" cy="154" rx="23" ry="25" fill="url(#mobPatrolArmor)" transform="rotate(5,-2,154)"/>

      <!-- 甲片紋理 -->
      <path d="M-8,144 L-5,154" fill="none" stroke="#1a2018" stroke-width="0.8" opacity="0.4"/>
      <path d="M6,148 L9,158" fill="none" stroke="#1a2018" stroke-width="0.7" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-10,136 L-4,146 L4,136" fill="none" stroke="#2a3028" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-21,174 Q-2,180 19,174" fill="none" stroke="#2a2418" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 大頭（縮頭） ===== -->
      <ellipse cx="0" cy="106" rx="34" ry="36" fill="url(#mobPatrolHair)"/>

      <!-- 臉 -->
      <path d="M-22,98 C-26,108 -24,120 -18,130 C-12,138 -4,142 4,140 C10,138 14,132 18,122 C22,110 20,98 14,90 C8,84 2,82 -4,84 C-12,86 -20,92 -22,98Z" fill="url(#mobPatrolFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,88 C-12,72 4,64 16,68 C24,72 28,82 24,92 C20,84 14,78 6,76 C0,74 -8,76 -14,82" fill="url(#mobPatrolHair)"/>

      <!-- 巡邏布帽 -->
      <path d="M-26,88 C-22,78 -8,72 8,74 C18,76 26,82 24,88" fill="#3a4038" stroke="#2a3028" stroke-width="0.5"/>
      <path d="M-28,88 C-28,86 -26,84 -22,86 L26,86 C28,86 28,90 26,90 L-26,90 C-28,90 -28,88 -28,88Z" fill="#3a4038" stroke="#2a3028" stroke-width="0.5"/>

      <!-- 瀏海 -->
      <path d="M-22,92 C-26,86 -28,90 -28,96 C-26,100 -22,98 -22,94" fill="url(#mobPatrolHair)"/>

      <!-- 側髮 -->
      <path d="M18,94 C24,88 26,94 24,102 C22,106 18,104 18,100" fill="url(#mobPatrolHair)"/>

      <!-- 耳朵 -->
      <path d="M16,112 C20,108 22,114 20,120 C18,124 16,122 16,118" fill="url(#mobPatrolFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（瞇眼戒備） ===== -->
      <ellipse cx="-10" cy="116" rx="6" ry="4.5" fill="#fff"/>
      <ellipse cx="-11" cy="116" rx="3.5" ry="3" fill="#2a2820"/>
      <ellipse cx="-11.5" cy="116" rx="2" ry="1.8" fill="#1a1810"/>
      <circle cx="-13" cy="115" r="1.1" fill="#fff" opacity="0.6"/>

      <ellipse cx="6" cy="116" rx="6" ry="4.5" fill="#fff"/>
      <ellipse cx="5" cy="116" rx="3.5" ry="3" fill="#2a2820"/>
      <ellipse cx="4.5" cy="116" rx="2" ry="1.8" fill="#1a1810"/>
      <circle cx="3" cy="115" r="1.1" fill="#fff" opacity="0.6"/>

      <!-- 眉毛 -->
      <path d="M-14,110 C-10,108 -8,109 -6,111" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,111 C10,109 12,108 16,110" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,124 C-16,128 -12,132" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙） -->
      <path d="M-8,138 C-4,140 2,140 6,138" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>

      <!-- ===== 左手臂（負x，輔助擋） ===== -->
      <path d="M-18,144 Q-28,152 -26,164" fill="none" stroke="url(#mobPatrolArmor)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-26" cy="166" r="4.5" fill="url(#mobPatrolFace)" opacity="0.85"/>

      <!-- ===== 右手臂（正x，劍直擋身前） ===== -->
      <path d="M16,144 Q28,138 34,132" fill="none" stroke="url(#mobPatrolArmor)" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== 劍（直立擋身前，50.6px） ===== -->
      <line x1="36" y1="78.4" x2="32" y2="129" stroke="url(#mobPatrolSteel)" stroke-width="4" stroke-linecap="round"/>
      <!-- 劍格 -->
      <rect x="28" y="127" width="10" height="3" rx="1" fill="#6a5a40"/>
      <!-- 劍柄 -->
      <rect x="30" y="130" width="6" height="9" rx="1" fill="#4a3020"/>
      <!-- 握劍的手 -->
      <circle cx="34" cy="134" r="5" fill="url(#mobPatrolFace)"/>
    </g>
  </g>
</svg>