<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 相里衍 — 吉卜力2頭身 側面朝左 攻擊（劍橫斬） -->
  <defs>
    <radialGradient id="yuanFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8d0b8"/>
      <stop offset="100%" stop-color="#d0b090"/>
    </radialGradient>
    <linearGradient id="yuanRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#283050"/>
      <stop offset="100%" stop-color="#182038"/>
    </linearGradient>
    <linearGradient id="yuanPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="yuanHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="yuanSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e8f0"/>
      <stop offset="100%" stop-color="#a0a8b0"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-10" cy="224" rx="32" ry="5" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（前踏攻擊弓步） ===== -->
    <!-- 後腿（右腿，蹬地） -->
    <ellipse cx="16" cy="201" rx="10" ry="18" fill="url(#yuanPants)" transform="rotate(-10,16,201)"/>
    <ellipse cx="14" cy="217" rx="11" ry="7" fill="#2a2018"/>
    <!-- 前腿（左腿，前踏） -->
    <ellipse cx="-22" cy="197" rx="10" ry="17" fill="url(#yuanPants)" transform="rotate(12,-22,197)"/>
    <ellipse cx="-26" cy="217" rx="11" ry="7" fill="#2a2018"/>

    <!-- ===== 身體（前傾橫斬） ===== -->
    <ellipse cx="-6" cy="160" rx="28" ry="32" fill="url(#yuanRobe)" transform="rotate(-12,-6,160)"/>

    <!-- 衣襟交叉 -->
    <path d="M-18,136 L-10,156 L0,136" fill="none" stroke="#506080" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-32,179 Q-6,187 20,179" fill="none" stroke="#3a3050" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-8" cy="183" rx="3.5" ry="3" fill="#706050"/>

    <!-- ===== 畫面右側手臂（角色左手，空手後擺） ===== -->
    <path d="M16,146 Q32,156 34,172" fill="none" stroke="url(#yuanRobe)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
    <circle cx="34" cy="174" r="5.5" fill="url(#yuanFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，持劍前伸橫斬） ===== -->
    <path d="M-30,144 Q-52,140 -64,148" fill="none" stroke="url(#yuanRobe)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-64" cy="150" r="5.5" fill="url(#yuanFace)"/>

    <!-- ===== 劍（橫斬，劍身50.6px） ===== -->
    <!-- 劍身 -->
    <line x1="-68" y1="142" x2="-114" y2="121" stroke="url(#yuanSteel)" stroke-width="4" stroke-linecap="round"/>
    <!-- 劍身亮線 -->
    <line x1="-68" y1="142" x2="-114" y2="121" stroke="#f0f4f8" stroke-width="1.5" opacity="0.4"/>
    <!-- 劍尖 -->
    <line x1="-114" y1="121" x2="-118" y2="119" stroke="#c8d0d8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 護手 -->
    <line x1="-66" y1="148" x2="-62" y2="140" stroke="#8a7848" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-62" y1="152" x2="-60" y2="156" stroke="#4a3828" stroke-width="4" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-59" cy="158" r="2.5" fill="#8a7848"/>

    <!-- ===== 大頭（前傾攻擊） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="-4" cy="94" rx="40" ry="42" fill="url(#yuanHair)"/>

    <!-- 臉（瘦長臉） -->
    <path d="M-34,84 C-38,96 -38,114 -32,126 C-26,136 -14,140 -4,138 C6,136 16,130 20,118 C24,106 22,90 16,82 C10,76 0,72 -10,74 C-22,76 -32,78 -34,84Z" fill="url(#yuanFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-24,76 C-20,56 -4,48 10,52 C22,56 28,68 24,80 C20,74 12,66 4,64 C-4,62 -14,64 -20,70" fill="url(#yuanHair)"/>

    <!-- 高髻 -->
    <ellipse cx="-2" cy="50" rx="8" ry="10" fill="url(#yuanHair)"/>
    <path d="M-8,42 C-4,34 0,34 2,42" fill="url(#yuanHair)"/>
    <ellipse cx="-2" cy="56" rx="9" ry="2.5" fill="#3a3050"/>

    <!-- 短瀏海 -->
    <path d="M-32,84 C-36,74 -38,78 -38,84 C-36,88 -32,88 -32,86" fill="url(#yuanHair)"/>
    <path d="M-28,78 C-30,70 -34,72 -34,80 C-32,84 -28,84 -28,82" fill="#888888"/>

    <!-- 側髮 -->
    <path d="M18,82 C22,78 24,84 22,90 C20,94 18,92 18,88" fill="url(#yuanHair)"/>

    <!-- 耳朵 -->
    <path d="M16,100 C20,96 22,102 20,108 C18,112 16,110 16,106" fill="url(#yuanFace)" stroke="#c0a880" stroke-width="0.5"/>

    <!-- ===== 眼睛 ===== -->
    <!-- 左眼 -->
    <ellipse cx="-16" cy="106" rx="7" ry="6" fill="#fff"/>
    <ellipse cx="-17" cy="107" rx="4.5" ry="4.5" fill="#201828"/>
    <ellipse cx="-17.5" cy="106" rx="2.5" ry="2.8" fill="#0c0810"/>
    <circle cx="-19" cy="104.5" r="1.4" fill="#fff" opacity="0.65"/>

    <!-- 右眼 -->
    <ellipse cx="0" cy="106" rx="7" ry="6" fill="#fff"/>
    <ellipse cx="-1" cy="107" rx="4.5" ry="4.5" fill="#201828"/>
    <ellipse cx="-1.5" cy="106" rx="2.5" ry="2.8" fill="#0c0810"/>
    <circle cx="-3" cy="104.5" r="1.4" fill="#fff" opacity="0.65"/>

    <!-- 鼻子 -->
    <path d="M-22,114 C-23,118 -21,122" fill="none" stroke="#c0a080" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 長山羊鬚 -->
    <path d="M-14,132 C-12,138 -10,146 -11,152" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-10,132 C-8,138 -7,146 -8,152" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-6,132 C-4,138 -4,146 -5,152" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 嘴巴（微張，喝聲） -->
    <ellipse cx="-10" cy="129" rx="5" ry="2.5" fill="#704038" opacity="0.8"/>
  </g>
</svg>
