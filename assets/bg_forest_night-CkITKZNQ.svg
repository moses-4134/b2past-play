<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 森林夜間 — 吉卜力風格：月光森林、篝火照明、火攻氛圍 地平線 y=180（33%） -->
  <defs>
    <!-- 夜空漸層 -->
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1a30"/>
      <stop offset="40%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#2a3a5a"/>
    </linearGradient>
    <!-- 地面（夜間暗色） -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3428"/>
      <stop offset="100%" stop-color="#2a2418"/>
    </linearGradient>
    <!-- 篝火光暈 -->
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff8040" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ff6020" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff6020" stop-opacity="0"/>
    </radialGradient>
    <!-- 月光 -->
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e0e8f0" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#c8d8e8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c8d8e8" stop-opacity="0"/>
    </radialGradient>
    <!-- 樹幹（暗色） -->
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1210"/>
      <stop offset="50%" stop-color="#2a1e18"/>
      <stop offset="100%" stop-color="#141010"/>
    </linearGradient>
  </defs>

  <!-- ===== 夜空 ===== -->
  <rect width="960" height="540" fill="url(#nightSky)"/>

  <!-- ===== 星星 ===== -->
  <circle cx="120" cy="20" r="1.2" fill="#ffffff" opacity="0.7"/>
  <circle cx="250" cy="35" r="0.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="380" cy="15" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="520" cy="28" r="0.7" fill="#ffffff" opacity="0.45"/>
  <circle cx="650" cy="10" r="1.1" fill="#ffffff" opacity="0.65"/>
  <circle cx="780" cy="32" r="0.9" fill="#ffffff" opacity="0.55"/>
  <circle cx="900" cy="18" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="180" cy="55" r="0.6" fill="#ffffff" opacity="0.4"/>
  <circle cx="440" cy="48" r="0.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="580" cy="55" r="0.7" fill="#ffffff" opacity="0.45"/>
  <circle cx="720" cy="50" r="0.9" fill="#ffffff" opacity="0.5"/>
  <circle cx="340" cy="65" r="0.6" fill="#ffffff" opacity="0.35"/>
  <circle cx="850" cy="58" r="0.7" fill="#ffffff" opacity="0.4"/>
  <circle cx="60" cy="42" r="0.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="480" cy="5" r="1.3" fill="#ffffff" opacity="0.7"/>

  <!-- ===== 月亮（右上方） ===== -->
  <circle cx="780" cy="60" r="100" fill="url(#moonGlow)"/>
  <circle cx="790" cy="50" r="22" fill="#e0e8f0" opacity="0.85"/>
  <circle cx="785" cy="46" r="20" fill="#c8d8e8" opacity="0.4"/>

  <!-- ===== 遠景樹冠剪影（暗色） ===== -->
  <circle cx="50" cy="50" r="65" fill="#0e1a10" opacity="0.85"/>
  <circle cx="140" cy="35" r="70" fill="#0a150c" opacity="0.8"/>
  <circle cx="240" cy="55" r="55" fill="#0e1a10" opacity="0.82"/>
  <circle cx="330" cy="28" r="68" fill="#0a150c" opacity="0.85"/>
  <circle cx="430" cy="45" r="60" fill="#0e1a10" opacity="0.8"/>
  <circle cx="530" cy="25" r="72" fill="#0a150c" opacity="0.82"/>
  <circle cx="630" cy="40" r="58" fill="#0e1a10" opacity="0.85"/>
  <circle cx="720" cy="50" r="65" fill="#0a150c" opacity="0.78"/>
  <circle cx="830" cy="30" r="62" fill="#0e1a10" opacity="0.75"/>
  <circle cx="930" cy="45" r="58" fill="#0a150c" opacity="0.8"/>

  <!-- 中層樹冠 -->
  <circle cx="80" cy="90" r="48" fill="#121e12" opacity="0.7"/>
  <circle cx="300" cy="95" r="42" fill="#0e1a10" opacity="0.65"/>
  <circle cx="600" cy="85" r="50" fill="#121e12" opacity="0.7"/>
  <circle cx="900" cy="90" r="45" fill="#0e1a10" opacity="0.65"/>

  <!-- ===== 樹幹剪影 ===== -->
  <!-- 左側大樹 -->
  <rect x="40" y="30" width="50" height="190" fill="url(#trunk)" rx="5"/>
  <path d="M40,110 Q10,85 -10,65" fill="none" stroke="#1a1210" stroke-width="9" stroke-linecap="round"/>
  <path d="M65,70 Q40,40 20,20" fill="none" stroke="#1a1210" stroke-width="7" stroke-linecap="round"/>

  <!-- 右側大樹 -->
  <rect x="870" y="20" width="55" height="200" fill="url(#trunk)" rx="5"/>
  <path d="M870,95 Q840,70 820,50" fill="none" stroke="#1a1210" stroke-width="8" stroke-linecap="round"/>
  <path d="M925,75 Q950,50 970,30" fill="none" stroke="#1a1210" stroke-width="7" stroke-linecap="round"/>

  <!-- 中景樹幹剪影 -->
  <rect x="250" y="75" width="22" height="105" fill="#1a1210" opacity="0.7" rx="3"/>
  <rect x="650" y="60" width="26" height="120" fill="#1a1210" opacity="0.65" rx="3"/>

  <!-- ===== 月光光束透過樹枝 ===== -->
  <polygon points="700,0 740,180 680,180" fill="#c8d8e8" opacity="0.05"/>
  <polygon points="770,0 800,160 750,160" fill="#c8d8e8" opacity="0.04"/>

  <!-- ===== 地面 ===== -->
  <rect x="0" y="180" width="960" height="360" fill="url(#ground)"/>

  <!-- 路面（勉強可見的暗色土路） -->
  <path d="M320,180 Q360,250 400,330 Q430,400 460,540" fill="none" stroke="#4a3e30" stroke-width="90" opacity="0.3" stroke-linecap="round"/>
  <path d="M630,180 Q600,250 570,330 Q550,400 530,540" fill="none" stroke="#4a3e30" stroke-width="70" opacity="0.25" stroke-linecap="round"/>

  <!-- ===== 篝火（前景偏左） ===== -->
  <g transform="translate(350,195)">
    <!-- 光暈 -->
    <circle cx="0" cy="0" r="150" fill="url(#fireGlow)"/>
    <!-- 柴堆 -->
    <line x1="-12" y1="8" x2="12" y2="3" stroke="#3a2818" stroke-width="4" stroke-linecap="round"/>
    <line x1="-10" y1="5" x2="10" y2="8" stroke="#4a3420" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-5" y1="9" x2="8" y2="6" stroke="#3a2818" stroke-width="3" stroke-linecap="round"/>
    <!-- 火焰 -->
    <path d="M0,2 Q-8,-12 -3,-22 Q0,-15 3,-25 Q8,-18 5,-10 Q10,-16 8,-5 Q4,2 0,2Z" fill="#ff8040" opacity="0.9"/>
    <path d="M0,0 Q-4,-8 -1,-16 Q1,-10 3,-18 Q5,-12 3,-6 Q1,0 0,0Z" fill="#ffb060" opacity="0.85"/>
    <path d="M0,-2 Q-2,-7 0,-12 Q2,-7 1,-3Z" fill="#ffe080" opacity="0.8"/>
    <!-- 火星 -->
    <circle cx="-8" cy="-30" r="1" fill="#ff8040" opacity="0.6"/>
    <circle cx="5" cy="-35" r="0.8" fill="#ffa050" opacity="0.5"/>
    <circle cx="-3" cy="-40" r="0.7" fill="#ff8040" opacity="0.4"/>
    <circle cx="8" cy="-28" r="0.6" fill="#ffa050" opacity="0.5"/>
  </g>

  <!-- ===== 篝火對周圍環境的暖色照明 ===== -->
  <ellipse cx="350" cy="210" rx="200" ry="80" fill="#ff6020" opacity="0.06"/>
  <ellipse cx="350" cy="195" rx="120" ry="50" fill="#ff8040" opacity="0.08"/>

  <!-- ===== 遠處山賊火箭（右後方數點火光） ===== -->
  <circle cx="700" cy="155" r="3" fill="#ff6020" opacity="0.5"/>
  <circle cx="700" cy="155" r="8" fill="#ff6020" opacity="0.15"/>
  <circle cx="750" cy="162" r="2.5" fill="#ff8040" opacity="0.45"/>
  <circle cx="750" cy="162" r="6" fill="#ff8040" opacity="0.12"/>
  <circle cx="820" cy="158" r="2" fill="#ff6020" opacity="0.4"/>
  <circle cx="820" cy="158" r="5" fill="#ff6020" opacity="0.1"/>
  <circle cx="680" cy="148" r="1.8" fill="#ffa050" opacity="0.35"/>
  <circle cx="680" cy="148" r="5" fill="#ffa050" opacity="0.08"/>
  <!-- 火箭軌跡 -->
  <line x1="700" y1="155" x2="685" y2="170" stroke="#ff6020" stroke-width="1" opacity="0.2"/>
  <line x1="750" y1="162" x2="738" y2="175" stroke="#ff8040" stroke-width="0.8" opacity="0.18"/>

  <!-- ===== 灌木剪影 ===== -->
  <ellipse cx="130" cy="192" rx="38" ry="16" fill="#0e1a10" opacity="0.6"/>
  <ellipse cx="95" cy="188" rx="25" ry="12" fill="#121e12" opacity="0.55"/>
  <ellipse cx="820" cy="195" rx="32" ry="14" fill="#0e1a10" opacity="0.55"/>
  <ellipse cx="855" cy="190" rx="22" ry="11" fill="#121e12" opacity="0.5"/>

  <!-- ===== 前景草叢剪影 ===== -->
  <path d="M0,180 Q8,160 16,180 Q24,155 32,180 Q40,162 48,180" fill="none" stroke="#0e1a10" stroke-width="2.5" opacity="0.6"/>
  <path d="M910,180 Q918,157 926,180 Q932,160 938,180 Q946,162 954,180" fill="none" stroke="#0e1a10" stroke-width="2.5" opacity="0.55"/>

  <!-- ===== 螢火蟲般的光點 ===== -->
  <circle cx="200" cy="160" r="1.5" fill="#90c870" opacity="0.4"/>
  <circle cx="450" cy="145" r="1.2" fill="#90c870" opacity="0.35"/>
  <circle cx="550" cy="170" r="1" fill="#90c870" opacity="0.3"/>
  <circle cx="300" cy="130" r="1.3" fill="#a0d880" opacity="0.3"/>
  <circle cx="500" cy="155" r="0.8" fill="#90c870" opacity="0.25"/>

  <!-- ===== 整體氛圍覆蓋（深藍夜色） ===== -->
  <rect width="960" height="540" fill="#1a2a4a" opacity="0.08"/>
</svg>