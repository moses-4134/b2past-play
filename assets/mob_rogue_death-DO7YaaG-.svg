<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 荒野流寇 — 死亡（倒地 rotate(90)） -->
  <defs>
    <radialGradient id="mobRogueFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c4a470"/>
    </radialGradient>
    <linearGradient id="mobRogueArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a5040"/>
      <stop offset="100%" stop-color="#3a3830"/>
    </linearGradient>
    <linearGradient id="mobRoguePants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4030"/>
      <stop offset="100%" stop-color="#2e2820"/>
    </linearGradient>
    <linearGradient id="mobRogueHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#302820"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="mobRogueBlade" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(78, 10)">
      <g transform="rotate(90,-4,176)">
        <!-- 陰影 -->
        <ellipse cx="-4" cy="205" rx="24" ry="4" fill="#000" opacity="0.1"/>

        <!-- ===== 腿（癱軟） ===== -->
        <!-- 後腿 -->
        <ellipse cx="8" cy="185" rx="9" ry="16" fill="url(#mobRoguePants)" transform="rotate(5,8,185)"/>
        <ellipse cx="10" cy="200" rx="10" ry="6" fill="#3a2818"/>
        <!-- 前腿 -->
        <ellipse cx="-10" cy="183" rx="10" ry="17" fill="url(#mobRoguePants)" transform="rotate(-5,-10,183)"/>
        <ellipse cx="-12" cy="200" rx="11" ry="6" fill="#3a2818"/>

        <!-- ===== 身體 ===== -->
        <ellipse cx="-2" cy="149" rx="23" ry="26" fill="url(#mobRogueArmor)"/>

        <!-- 皮甲細節 -->
        <path d="M-10,132 L-4,144 L4,132" fill="none" stroke="#4a4030" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- 護肩片 -->
        <ellipse cx="-20" cy="130" rx="8" ry="4" fill="#4a4030" stroke="#3a3020" stroke-width="0.8"/>
        <ellipse cx="16" cy="130" rx="8" ry="4" fill="#4a4030" stroke="#3a3020" stroke-width="0.8"/>

        <!-- 腰帶 -->
        <path d="M-22,168 Q-2,174 20,168" fill="none" stroke="#4a3820" stroke-width="4" stroke-linecap="round"/>

        <!-- ===== 右手臂（癱下） ===== -->
        <path d="M18,138 Q32,150 36,164" fill="none" stroke="url(#mobRogueArmor)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
        <circle cx="36" cy="166" r="5" fill="url(#mobRogueFace)" opacity="0.85"/>

        <!-- ===== 左手臂（垂下） ===== -->
        <path d="M-20,138 Q-34,150 -38,164" fill="none" stroke="url(#mobRogueArmor)" stroke-width="10" stroke-linecap="round"/>
        <circle cx="-38" cy="166" r="5.5" fill="url(#mobRogueFace)"/>

        <!-- ===== 刀（掉落在旁） ===== -->
        <path d="M-44,168 Q-40,172 -40,182 Q-42,196 -46,210 L-50,208 Q-46,194 -44,180 Q-46,172 -48,168 Z" fill="url(#mobRogueBlade)" stroke="#666" stroke-width="0.5" opacity="0.7"/>
        <!-- 刀柄 -->
        <rect x="-49" y="164" width="8" height="8" rx="1" fill="#4a3020" opacity="0.7"/>

        <!-- ===== 大頭 ===== -->
        <ellipse cx="0" cy="96" rx="36" ry="38" fill="url(#mobRogueHair)"/>

        <!-- 臉 -->
        <path d="M-24,88 C-28,98 -26,114 -20,126 C-14,134 -4,138 4,136 C12,134 18,126 22,116 C26,104 24,90 18,82 C12,76 2,72 -4,74 C-14,76 -22,82 -24,88Z" fill="url(#mobRogueFace)"/>

        <!-- 短髮 -->
        <path d="M-16,78 C-12,62 4,54 16,58 C24,62 28,72 24,82 C20,74 14,68 6,66 C0,64 -8,66 -14,72" fill="url(#mobRogueHair)"/>
        <path d="M-26,88 C-30,78 -32,82 -30,90 C-28,94 -26,92 -26,90" fill="url(#mobRogueHair)"/>

        <!-- 側髮 -->
        <path d="M20,86 C24,80 26,86 24,94 C22,96 20,94 20,90" fill="url(#mobRogueHair)"/>

        <!-- 耳朵 -->
        <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,110" fill="url(#mobRogueFace)" stroke="#b09060" stroke-width="0.5"/>

        <!-- ===== 眼睛（X_X 死亡眼） ===== -->
        <!-- 左眼 X -->
        <line x1="-14" y1="104" x2="-6" y2="112" stroke="#3a2818" stroke-width="2" stroke-linecap="round"/>
        <line x1="-6" y1="104" x2="-14" y2="112" stroke="#3a2818" stroke-width="2" stroke-linecap="round"/>

        <!-- 右眼 X -->
        <line x1="2" y1="104" x2="10" y2="112" stroke="#3a2818" stroke-width="2" stroke-linecap="round"/>
        <line x1="10" y1="104" x2="2" y2="112" stroke="#3a2818" stroke-width="2" stroke-linecap="round"/>

        <!-- 眉毛（下垂） -->
        <path d="M-14,100 C-10,102 -8,102 -6,102" fill="none" stroke="#302820" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M8,102 C10,102 12,102 16,100" fill="none" stroke="#302820" stroke-width="1.8" stroke-linecap="round"/>

        <!-- 傷疤 -->
        <path d="M-16,100 L-6,108" fill="none" stroke="#a08060" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>

        <!-- 鼻子 -->
        <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#b09068" stroke-width="1.4" stroke-linecap="round"/>

        <!-- 嘴巴（微張無力） -->
        <ellipse cx="-3" cy="130" rx="4" ry="3" fill="#4a2020" opacity="0.7"/>
      </g>
    </g>
  </g>
</svg>
