<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 小七 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪、飛刀撐地、喘息） -->
  <defs>
    <radialGradient id="xqcFace" cx="40%" cy="35%" r="55%"><stop offset="0%" stop-color="#f0dcc4"/><stop offset="100%" stop-color="#dcc4a4"/></radialGradient>
    <linearGradient id="xqcOutfit" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#6a6050"/><stop offset="100%" stop-color="#4a4030"/></linearGradient>
    <linearGradient id="xqcPants" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5a5040"/><stop offset="100%" stop-color="#3a3020"/></linearGradient>
    <linearGradient id="xqcHair" x1="0.2" y1="0" x2="0.7" y2="1"><stop offset="0%" stop-color="#201008"/><stop offset="100%" stop-color="#100804"/></linearGradient>
  </defs>
  <g transform="translate(130, 28)">
    <ellipse cx="-4" cy="198" rx="24" ry="5" fill="#000" opacity="0.12"/>
    <!-- 腿（半跪：後腿跪地、前腿撐住） -->
    <ellipse cx="8" cy="180" rx="7" ry="10" fill="url(#xqcPants)" transform="rotate(-20,8,180)"/>
    <ellipse cx="2" cy="192" rx="6" ry="4" fill="url(#xqcPants)"/>
    <ellipse cx="0" cy="196" rx="7" ry="4.5" fill="#4a3828"/>
    <ellipse cx="-12" cy="176" rx="7.5" ry="14" fill="url(#xqcPants)" transform="rotate(12,-12,176)"/>
    <ellipse cx="-16" cy="196" rx="8.5" ry="5" fill="#4a3828"/>
    <!-- 身體（大幅前傾） -->
    <ellipse cx="-2" cy="144" rx="20" ry="22" fill="url(#xqcOutfit)" transform="rotate(-14,-2,144)"/>
    <!-- 破布腰繩 -->
    <path d="M-18,156 Q-2,162 14,156" fill="none" stroke="#3a3020" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 領口 -->
    <path d="M-8,124 L-3,134 L4,124" fill="none" stroke="#8a7860" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 角色左手（撐在膝蓋上） -->
    <path d="M14,128 Q22,146 16,168" fill="none" stroke="url(#xqcOutfit)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <circle cx="15" cy="170" r="3.5" fill="url(#xqcFace)" opacity="0.85"/>
    <!-- 角色右手（飛刀插地撐身） -->
    <path d="M-18,130 Q-34,138 -40,150" fill="none" stroke="url(#xqcOutfit)" stroke-width="8" stroke-linecap="round"/>

    <!-- 大頭（低垂喘息） -->
    <ellipse cx="0" cy="90" rx="34" ry="36" fill="url(#xqcHair)"/>
    <!-- 臉 -->
    <path d="M-22,86 C-26,94 -24,108 -18,116 C-12,122 -4,126 4,124 C10,122 14,116 18,108 C22,96 20,86 14,80 C8,74 2,72 -4,74 C-12,76 -20,80 -22,86Z" fill="url(#xqcFace)"/>
    <!-- 腮紅（痛苦泛紅） -->
    <ellipse cx="-16" cy="114" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.4"/>
    <!-- 髮頂 -->
    <path d="M-14,76 C-10,58 4,52 16,56 C24,60 28,70 24,78 C20,72 12,66 4,64 C-4,62 -10,66 -12,72" fill="url(#xqcHair)"/>
    <!-- 碎瀏海（更凌亂） -->
    <path d="M-24,86 C-28,74 -30,78 -32,86 C-30,90 -26,90 -24,86" fill="url(#xqcHair)"/>
    <path d="M-20,80 C-22,70 -26,72 -26,80 C-24,84 -20,84 -20,80" fill="#201008"/>
    <path d="M-16,76 C-18,68 -22,70 -22,78 C-20,82 -16,82 -16,78" fill="url(#xqcHair)" opacity="0.9"/>
    <path d="M-12,74 C-14,68 -16,70 -16,76" fill="url(#xqcHair)" opacity="0.7"/>
    <!-- 散落髮絲 -->
    <path d="M-28,90 C-30,96 -28,100" fill="none" stroke="url(#xqcHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- 翹起的亂髮（下垂） -->
    <path d="M14,58 C17,54 20,56 19,62" fill="url(#xqcHair)"/>
    <path d="M8,56 C11,50 14,52 13,60" fill="url(#xqcHair)" opacity="0.8"/>
    <!-- 側髮 -->
    <path d="M20,82 C24,76 26,84 24,94 C22,98 20,96 20,90" fill="url(#xqcHair)"/>
    <path d="M-26,86 C-28,94 -28,102 -26,110" fill="none" stroke="url(#xqcHair)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    <!-- 耳朵 -->
    <path d="M20,98 C24,94 26,100 24,106 C22,110 20,108 20,104" fill="url(#xqcFace)" stroke="#dcc4a4" stroke-width="0.5"/>
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-7" cy="102" rx="7" ry="2" fill="#fff"/>
    <ellipse cx="-8" cy="102.5" rx="4" ry="1.5" fill="#2a1808"/>
    <ellipse cx="-8.5" cy="102" rx="2" ry="1" fill="#0a0404"/>
    <!-- 右眼（勉強睜一線） -->
    <ellipse cx="9" cy="102" rx="7" ry="2.5" fill="#fff"/>
    <ellipse cx="8" cy="102.5" rx="4" ry="2" fill="#2a1808"/>
    <ellipse cx="7.5" cy="102" rx="2" ry="1.2" fill="#0a0404"/>
    <circle cx="6" cy="101" r="0.8" fill="#fff" opacity="0.7"/>
    <!-- 眉間皺紋（深刻） -->
    <path d="M-1,95 C0,93 2,93 3,95" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-2,97 C0,95.5 3,95.5 4,97" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
    <!-- 粗眉 -->
    <path d="M-14,94 C-10,92 -5,93 -1,95" fill="none" stroke="#201008" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M3,95 C7,92 12,93 16,95" fill="none" stroke="#201008" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 鼻子 -->
    <path d="M-10,110 C-10.5,112 -9.5,113" fill="none" stroke="#dcc4a4" stroke-width="1" stroke-linecap="round"/>
    <!-- 嘴巴（喘息張開） -->
    <ellipse cx="-2" cy="119" rx="4.5" ry="4" fill="#703030"/>
    <path d="M-5.5,117 L1.5,117" fill="none" stroke="#eee" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <!-- 臉上泥痕 -->
    <ellipse cx="10" cy="112" rx="3" ry="1.5" fill="#b0a080" opacity="0.2" transform="rotate(-10,10,112)"/>

    <!-- 汗滴（多顆） -->
    <path d="M-20,88 C-21,92 -20,96 -19,98" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-19" cy="99" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M20,90 C21,94 20,98" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="20" cy="99" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <!-- 額頭汗 -->
    <ellipse cx="-4" cy="76" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>

    <!-- 小飛刀（插地撐身，最上層） -->
    <line x1="-42" y1="142" x2="-43" y2="150" stroke="#5a4830" stroke-width="2" stroke-linecap="round"/>
    <line x1="-44" y1="150" x2="-42" y2="151" stroke="#706058" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-43" y1="152" x2="-45" y2="198" stroke="#bbb" stroke-width="2" stroke-linecap="round"/>
    <line x1="-43" y1="152" x2="-45" y2="198" stroke="#eee" stroke-width="0.7" opacity="0.4"/>
    <ellipse cx="-45" cy="198" rx="3" ry="1.5" fill="#5a4a30" opacity="0.4"/>
    <circle cx="-40" cy="154" r="4" fill="url(#xqcFace)"/>
  </g>
</svg>