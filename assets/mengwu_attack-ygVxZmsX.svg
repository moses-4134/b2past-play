<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 蒙武 — 吉卜力2頭身 側面朝左 攻擊（槍刺） -->
  <defs>
    <radialGradient id="mengwuFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c4a0"/>
      <stop offset="100%" stop-color="#c8a480"/>
    </radialGradient>
    <linearGradient id="mengwuJacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a3020"/>
      <stop offset="100%" stop-color="#302010"/>
    </linearGradient>
    <linearGradient id="mengwuPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35322a"/>
      <stop offset="100%" stop-color="#1e1c16"/>
    </linearGradient>
    <linearGradient id="mengwuHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#181008"/>
    </linearGradient>
    <linearGradient id="mengwuSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
    <linearGradient id="mengwuArmor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#605040"/>
      <stop offset="100%" stop-color="#403020"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-10" cy="222" rx="32" ry="5" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（前踏攻擊） ===== -->
    <!-- 後腿（右腿，蹬地） -->
    <ellipse cx="18" cy="200" rx="10.5" ry="17" fill="url(#mengwuPants)" transform="rotate(-10,18,200)"/>
    <ellipse cx="16" cy="215" rx="11.5" ry="7" fill="#3a2818"/>
    <!-- 前腿（左腿，前踏） -->
    <ellipse cx="-24" cy="196" rx="10.5" ry="17" fill="url(#mengwuPants)" transform="rotate(12,-24,196)"/>
    <ellipse cx="-28" cy="215" rx="11.5" ry="7" fill="#3a2818"/>

    <!-- ===== 身體（前傾突刺） ===== -->
    <ellipse cx="-6" cy="160" rx="28" ry="31" fill="url(#mengwuJacket)" transform="rotate(-12,-6,160)"/>

    <!-- 輕甲護片 -->
    <rect x="-22" y="147" width="24" height="14" rx="3" fill="url(#mengwuArmor)" stroke="#3a2818" stroke-width="0.5" opacity="0.75" transform="rotate(-12,-10,154)"/>

    <!-- 肩甲護肩 -->
    <rect x="-36" y="132" width="12" height="9" rx="2.5" fill="url(#mengwuArmor)" stroke="#3a2818" stroke-width="0.7"/>
    <rect x="14" y="138" width="12" height="9" rx="2.5" fill="url(#mengwuArmor)" stroke="#3a2818" stroke-width="0.7"/>

    <!-- 領口 -->
    <path d="M-18,136 L-12,150 L-4,136" fill="none" stroke="#7a6048" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-30,178 Q-6,186 20,178" fill="none" stroke="#5a4030" stroke-width="6" stroke-linecap="round"/>
    <rect x="-12" y="176" width="9" height="9" rx="1.5" fill="#b09030" stroke="#8a7020" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手，握槍後段） ===== -->
    <path d="M16,144 Q27,152 25,166" fill="none" stroke="url(#mengwuJacket)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
    <circle cx="25" cy="168" r="5.5" fill="url(#mengwuFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，握槍前段，前伸） ===== -->
    <path d="M-30,141 Q-52,133 -64,131" fill="none" stroke="url(#mengwuJacket)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-64" cy="133" r="5.5" fill="url(#mengwuFace)"/>

    <!-- ===== 槍（水平前刺） ===== -->
    <!-- 槍桿 -->
    <line x1="-80" y1="133" x2="25" y2="168" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
    <!-- 槍頭 -->
    <path d="M-93.4,128.6 L-78.8,129.2 L-81.2,136.8 Z" fill="url(#mengwuSteel)" stroke="#888" stroke-width="0.5"/>
    <!-- 槍纓 -->
    <line x1="-77.1" y1="133.9" x2="-75.3" y2="128.2" stroke="#a03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-80" y1="133" x2="-78.1" y2="127.3" stroke="#a03030" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-82.9" y1="132.1" x2="-81" y2="126.4" stroke="#a03030" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ===== 大頭（前傾攻擊） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="-4" cy="95" rx="40" ry="43" fill="url(#mengwuHair)"/>

    <!-- 臉 -->
    <path d="M-34,85 C-38,97 -36,115 -30,125 C-24,133 -12,137 -2,135 C8,133 18,127 22,117 C26,105 24,91 18,83 C12,77 0,73 -10,75 C-22,77 -32,81 -34,85Z" fill="url(#mengwuFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-24,75 C-20,57 -4,49 10,53 C22,57 28,69 24,79 C20,73 12,67 4,65 C-4,63 -14,65 -20,71" fill="url(#mengwuHair)"/>

    <!-- 後方短髮 -->
    <path d="M20,85 C24,91 26,103 24,113 C22,117 20,115 20,109" fill="none" stroke="#181008" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- 鐵盔 -->
    <path d="M-30,77 C-22,65 -2,59 16,63 C26,67 32,73 28,79" fill="none" stroke="#786840" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M-30,77 C-32,81 -34,85 -32,87" fill="none" stroke="#786840" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M28,79 C30,83 30,87 28,89" fill="none" stroke="#786840" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-6,61 C-4,55 2,53 5,56 C6,58 6,61 4,63" fill="#786840" stroke="#605030" stroke-width="0.5"/>

    <!-- 短瀏海 -->
    <path d="M-32,85 C-36,75 -38,79 -38,85 C-36,89 -32,89 -32,87" fill="url(#mengwuHair)"/>

    <!-- 側髮 -->
    <path d="M18,83 C22,79 24,85 22,93 C20,97 18,95 18,89" fill="url(#mengwuHair)"/>

    <!-- 耳朵 -->
    <path d="M16,101 C20,97 22,103 20,109 C18,113 16,111 16,107" fill="url(#mengwuFace)" stroke="#b89870" stroke-width="0.5"/>

    <!-- ===== 眼睛（攻擊怒目） ===== -->
    <!-- 左眼 -->
    <ellipse cx="-16" cy="107" rx="6.5" ry="6.5" fill="#fff"/>
    <ellipse cx="-17" cy="108" rx="4" ry="4.5" fill="#302818"/>
    <ellipse cx="-17.5" cy="107" rx="2.5" ry="2.8" fill="#100804"/>
    <circle cx="-19" cy="105" r="1.3" fill="#fff" opacity="0.7"/>

    <!-- 右眼 -->
    <ellipse cx="0" cy="107" rx="6.5" ry="6.5" fill="#fff"/>
    <ellipse cx="-1" cy="108" rx="4" ry="4.5" fill="#302818"/>
    <ellipse cx="-1.5" cy="107" rx="2.5" ry="2.8" fill="#100804"/>
    <circle cx="-3" cy="105" r="1.3" fill="#fff" opacity="0.7"/>

    <!-- 眉毛（皺眉攻擊） -->
    <path d="M-23,100 C-19,97 -13,97 -9,99" fill="none" stroke="#2a1808" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-6,100 C-2,97 3,97 6,99" fill="none" stroke="#2a1808" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M-22,114 C-23,118 -21,122 -19,124" fill="none" stroke="#a88868" stroke-width="1.3" stroke-linecap="round"/>

    <!-- 短鬚 -->
    <path d="M-20,127 C-18,129 -14,130 -12,129" fill="none" stroke="#2a1808" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-8,127 C-6,129 -2,130 0,129" fill="none" stroke="#2a1808" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-14,133 C-12,136 -8,136 -6,133" fill="none" stroke="#2a1808" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（微張，喝聲） -->
    <ellipse cx="-10" cy="130" rx="5" ry="2.5" fill="#704038" opacity="0.8"/>
  </g>
</svg>
