<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 蔡璋（我方） — 吉卜力2頭身 面朝左（我方）攻擊：投擲暗器 -->
  <defs>
    <radialGradient id="dubiAllyFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0d0c0"/>
      <stop offset="100%" stop-color="#d0c0a8"/>
    </radialGradient>
    <linearGradient id="dubiAllyRobe" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0c0c18"/>
    </linearGradient>
    <linearGradient id="dubiAllyInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a1a1a"/>
      <stop offset="100%" stop-color="#2a0a0a"/>
    </linearGradient>
    <linearGradient id="dubiAllyHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="dubiAllyBlade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0c0c8"/>
      <stop offset="100%" stop-color="#808088"/>
    </linearGradient>
    <linearGradient id="dubiAllyPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-10" cy="225" rx="30" ry="5" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（前弓步投擲） ===== -->
    <!-- 後腿（正x側） -->
    <ellipse cx="14" cy="202" rx="9" ry="16" fill="url(#dubiAllyPants)" transform="rotate(-10,14,202)"/>
    <ellipse cx="16" cy="218" rx="10" ry="6" fill="#1a1a20"/>
    <!-- 前腿（負x側，大步前踏） -->
    <ellipse cx="-18" cy="198" rx="10" ry="17" fill="url(#dubiAllyPants)" transform="rotate(12,-18,198)"/>
    <ellipse cx="-22" cy="216" rx="11" ry="6" fill="#1a1a20"/>

    <!-- ===== 身體（前傾投擲） ===== -->
    <ellipse cx="-4" cy="158" rx="26" ry="30" fill="url(#dubiAllyRobe)" transform="rotate(-8,-4,158)"/>

    <!-- 內袍領口 -->
    <path d="M-14,134 L-6,150 L4,134" fill="none" stroke="#4a1a1a" stroke-width="3" stroke-linejoin="round"/>

    <!-- 衣褶 -->
    <path d="M-10,148 L-8,168" fill="none" stroke="#0a0a14" stroke-width="0.8" opacity="0.4"/>
    <path d="M4,146 L6,164" fill="none" stroke="#0a0a14" stroke-width="0.8" opacity="0.3"/>

    <!-- 銅腰帶 -->
    <path d="M-28,178 Q-4,186 20,178" fill="none" stroke="#8a7030" stroke-width="5" stroke-linecap="round"/>
    <rect x="-8" y="176" width="7" height="7" rx="1" fill="#8a7030" stroke="#6a5020" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（正x，空手輔助平衡） ===== -->
    <path d="M22,146 Q40,148 42,164" fill="none" stroke="url(#dubiAllyRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <circle cx="42" cy="166" r="5" fill="url(#dubiAllyFace)" opacity="0.85"/>

    <!-- ===== 大頭（冷酷投擲表情） ===== -->
    <!-- 後腦短髮 -->
    <ellipse cx="0" cy="92" rx="38" ry="40" fill="url(#dubiAllyHair)"/>

    <!-- 臉 -->
    <path d="M-30,86 C-34,98 -32,116 -26,128 C-20,136 -6,140 2,138 C12,136 22,128 26,116 C30,104 28,90 22,82 C16,76 4,72 -4,74 C-18,76 -28,80 -30,86Z" fill="url(#dubiAllyFace)"/>

    <!-- 黑眼圈 -->
    <ellipse cx="-12" cy="110" rx="8" ry="4" fill="#c0b098" opacity="0.3"/>
    <ellipse cx="8" cy="110" rx="8" ry="4" fill="#c0b098" opacity="0.3"/>

    <!-- 官帽 -->
    <rect x="-24" y="58" width="44" height="14" rx="2" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="0.5"/>
    <rect x="-20" y="52" width="36" height="8" rx="1" fill="#0c0c0c"/>
    <path d="M-24,64 L-38,60 L-36,66 Z" fill="#0a0a0a"/>
    <path d="M20,64 L34,60 L32,66 Z" fill="#0a0a0a"/>

    <!-- 頭髮 -->
    <path d="M-20,76 C-16,64 0,58 14,62 C24,66 28,76 26,82 C22,76 14,72 6,70 C-2,68 -12,70 -18,74" fill="url(#dubiAllyHair)"/>
    <path d="M22,84 C26,80 28,88 26,96 C24,102 22,98 22,94" fill="url(#dubiAllyHair)"/>

    <!-- 耳朵 -->
    <path d="M22,100 C26,96 28,102 26,110 C24,114 22,112 22,106" fill="url(#dubiAllyFace)" stroke="#b0a088" stroke-width="0.5"/>

    <!-- ===== 眼（瞇眼冷酷） ===== -->
    <ellipse cx="-12" cy="106" rx="6" ry="3.5" fill="#fff"/>
    <ellipse cx="-13" cy="106.5" rx="3.5" ry="3" fill="#2a1a10"/>
    <ellipse cx="-13.5" cy="106" rx="2" ry="2" fill="#0a0400"/>
    <circle cx="-15" cy="105" r="1.2" fill="#fff" opacity="0.5"/>

    <ellipse cx="8" cy="106" rx="6" ry="3.5" fill="#fff"/>
    <ellipse cx="7" cy="106.5" rx="3.5" ry="3" fill="#2a1a10"/>
    <ellipse cx="6.5" cy="106" rx="2" ry="2" fill="#0a0400"/>
    <circle cx="5" cy="105" r="1.2" fill="#fff" opacity="0.5"/>

    <!-- 薄眉（怒） -->
    <path d="M-18,100 C-14,98 -10,100 -8,102" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M12,102 C14,100 18,98 20,100" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M-6,112 C-8,118 -4,122" fill="none" stroke="#b0a080" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（冷酷抿嘴） -->
    <path d="M-10,130 C-4,128 2,128 6,130" fill="none" stroke="#705040" stroke-width="2" stroke-linecap="round"/>

    <!-- 山羊鬍 -->
    <line x1="-4" y1="134" x2="-5" y2="140" stroke="#2a2a2a" stroke-width="0.8" opacity="0.5"/>
    <line x1="-2" y1="134" x2="-2" y2="141" stroke="#2a2a2a" stroke-width="0.8" opacity="0.6"/>
    <line x1="0" y1="134" x2="1" y2="140" stroke="#2a2a2a" stroke-width="0.8" opacity="0.5"/>

    <!-- ===== 武器手臂（負x肩出發，向負x投擲） ===== -->
    <path d="M-24,146 Q-10,140 -48,128" fill="none" stroke="url(#dubiAllyRobe)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-48" cy="128" r="5.5" fill="url(#dubiAllyFace)"/>

    <!-- ===== 投擲暗器（從手向更負x飛出） ===== -->
    <!-- 飛鏢1（最遠） -->
    <line x1="-80" y1="116" x2="-86" y2="114" stroke="#c0c0c8" stroke-width="2" stroke-linecap="round"/>
    <line x1="-83" y1="113" x2="-83" y2="117" stroke="#c0c0c8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 飛鏢尾跡 -->
    <line x1="-78" y1="116" x2="-60" y2="120" stroke="#a0a0a8" stroke-width="0.8" opacity="0.3"/>

    <!-- 飛鏢2（中距離） -->
    <line x1="-68" y1="124" x2="-74" y2="122" stroke="#c0c0c8" stroke-width="2" stroke-linecap="round"/>
    <line x1="-71" y1="121" x2="-71" y2="125" stroke="#c0c0c8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 飛鏢尾跡 -->
    <line x1="-66" y1="124" x2="-54" y2="126" stroke="#a0a0a8" stroke-width="0.8" opacity="0.25"/>

    <!-- 飛鏢3（剛出手） -->
    <line x1="-56" y1="128" x2="-62" y2="126" stroke="#c0c0c8" stroke-width="2" stroke-linecap="round"/>
    <line x1="-59" y1="125" x2="-59" y2="129" stroke="#c0c0c8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 手中準備的飛鏢 -->
    <line x1="-50" y1="126" x2="-53" y2="124" stroke="#c0c0c8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>