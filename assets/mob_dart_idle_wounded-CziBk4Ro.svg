<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 黑市暗器手 — 受傷待機（HP 30~60%：身體微傾、飛刀下垂、眼半瞇、頭巾保留） -->
  <defs>
    <radialGradient id="mobDartWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c4a470"/>
    </radialGradient>
    <linearGradient id="mobDartWCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a3430"/>
      <stop offset="100%" stop-color="#2a2420"/>
    </linearGradient>
    <linearGradient id="mobDartWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3430"/>
      <stop offset="100%" stop-color="#221e1a"/>
    </linearGradient>
    <linearGradient id="mobDartWHeadwrap" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1610"/>
    </linearGradient>
    <linearGradient id="mobDartWBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0c8d0"/>
      <stop offset="100%" stop-color="#808890"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="187" rx="24" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前腿微彎） ===== -->
      <!-- 後腿 -->
      <ellipse cx="8" cy="168" rx="8" ry="13" fill="url(#mobDartWPants)" transform="rotate(-3,8,168)"/>
      <ellipse cx="6" cy="181" rx="9" ry="5" fill="#221e1a"/>
      <!-- 前腿 -->
      <ellipse cx="-10" cy="169" rx="8" ry="14" fill="url(#mobDartWPants)" transform="rotate(8,-10,169)"/>
      <ellipse cx="-13" cy="181" rx="9" ry="5" fill="#221e1a"/>

      <!-- ===== 身體（前傾） ===== -->
      <ellipse cx="-2" cy="142" rx="20" ry="22" fill="url(#mobDartWCloth)" transform="rotate(-8,-2,142)"/>

      <!-- 衣紋 -->
      <path d="M-6,136 L-3,146" fill="none" stroke="#2a2420" stroke-width="0.6" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-8,128 L-2,138 L4,128" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-18,158 Q-2,164 16,158" fill="none" stroke="#1a1610" stroke-width="4" stroke-linecap="round"/>
      <rect x="-3" y="156" width="4" height="4" rx="1" fill="#2a2420" stroke="#1a1610" stroke-width="0.5"/>

      <!-- ===== 畫面左側手臂（角色右手，按住傷口） ===== -->
      <path d="M-14,132 Q-20,146 -4,156" fill="none" stroke="url(#mobDartWCloth)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <circle cx="-4" cy="158" r="4" fill="url(#mobDartWFace)" opacity="0.85"/>

      <!-- ===== 畫面右側手臂（角色左手，飛刀下垂） ===== -->
      <path d="M18,132 Q26,140 32,150" fill="none" stroke="url(#mobDartWCloth)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="32" cy="152" r="4" fill="url(#mobDartWFace)"/>

      <!-- ===== 飛刀（只剩1把，下垂） ===== -->
      <line x1="34" y1="154" x2="40" y2="170" stroke="url(#mobDartWBlade)" stroke-width="2" stroke-linecap="round"/>
      <line x1="35" y1="153" x2="41" y2="169" stroke="#e0e8f0" stroke-width="0.6" opacity="0.3"/>

      <!-- ===== 大頭（低頭） ===== -->
      <!-- 包頭巾底層 -->
      <ellipse cx="0" cy="102" rx="32" ry="34" fill="url(#mobDartWHeadwrap)"/>

      <!-- 臉 -->
      <path d="M-20,92 C-24,98 -22,112 -16,120 C-12,126 -4,130 2,128 C8,126 14,120 16,112 C20,102 18,92 14,86 C8,80 2,78 -2,80 C-12,82 -18,86 -20,92Z" fill="url(#mobDartWFace)"/>

      <!-- 包頭巾頂部 -->
      <path d="M-14,82 C-10,64 2,58 12,62 C22,66 26,78 22,88 C18,80 10,72 4,70 C0,68 -8,70 -12,76" fill="url(#mobDartWHeadwrap)"/>
      <path d="M-8,68 C-4,64 2,62 8,64" fill="none" stroke="#1a1610" stroke-width="0.8" opacity="0.4"/>
      <path d="M-6,72 C-2,70 4,68 10,70" fill="none" stroke="#1a1610" stroke-width="0.6" opacity="0.3"/>

      <!-- 頭巾側面 -->
      <path d="M14,86 C20,82 22,88 20,96 C18,100 16,98 16,94" fill="url(#mobDartWHeadwrap)"/>
      <path d="M-20,88 C-26,84 -28,90 -26,98 C-24,102 -22,100 -22,96" fill="url(#mobDartWHeadwrap)"/>

      <!-- 頭巾下垂尾巴 -->
      <path d="M16,94 C22,98 26,106 24,114" fill="none" stroke="url(#mobDartWHeadwrap)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

      <!-- 耳朵 -->
      <path d="M14,104 C18,100 20,106 18,112 C16,116 14,114 14,110" fill="url(#mobDartWFace)" stroke="#b09870" stroke-width="0.5"/>

      <!-- ===== 眼睛（左眼半瞇、右眼微睜） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-8" cy="108" rx="5" ry="4" fill="#fff"/>
      <ellipse cx="-9" cy="108.5" rx="3.2" ry="2.5" fill="#2a2020"/>
      <ellipse cx="-9.5" cy="108" rx="1.8" ry="1.5" fill="#1a1010"/>
      <circle cx="-11" cy="107" r="0.6" fill="#fff" opacity="0.4"/>

      <!-- 右眼（微瞇） -->
      <ellipse cx="4" cy="108" rx="5" ry="5" fill="#fff"/>
      <ellipse cx="3" cy="109" rx="3.2" ry="3.5" fill="#2a2020"/>
      <ellipse cx="2.5" cy="108" rx="1.8" ry="2" fill="#1a1010"/>
      <circle cx="1" cy="107" r="0.8" fill="#fff" opacity="0.5"/>

      <!-- 眉間皺紋 -->
      <path d="M-2,103 C0,101 2,101 4,103" fill="none" stroke="#b09870" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 眉毛 -->
      <path d="M-12,103 C-10,101 -6,102 -4,104" fill="none" stroke="#1a1610" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M6,104 C8,102 12,101 14,103" fill="none" stroke="#1a1610" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-10,114 C-12,118 -8,120" fill="none" stroke="#b09870" stroke-width="1" stroke-linecap="round"/>

      <!-- 嘴（咬牙忍痛） -->
      <path d="M-6,124 C-2,125 2,124" fill="none" stroke="#a08860" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-6,124 C-7,126 -8,127" fill="none" stroke="#a08860" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴 -->
      <path d="M-18,90 C-19,94 -18,98 -17,100" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-17" cy="101" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
    </g>
  </g>
</svg>