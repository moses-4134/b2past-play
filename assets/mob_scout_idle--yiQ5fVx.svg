<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙國斥候 — 待機（持弓搭箭警戒） -->
  <defs>
    <radialGradient id="mobScoutFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc098"/>
      <stop offset="100%" stop-color="#c4a478"/>
    </radialGradient>
    <linearGradient id="mobScoutArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a4830"/>
      <stop offset="100%" stop-color="#2a3820"/>
    </linearGradient>
    <linearGradient id="mobScoutPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4030"/>
      <stop offset="100%" stop-color="#2a2e20"/>
    </linearGradient>
    <linearGradient id="mobScoutHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2418"/>
      <stop offset="100%" stop-color="#1a1610"/>
    </linearGradient>
    <linearGradient id="mobScoutBow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a20"/>
      <stop offset="100%" stop-color="#3a2410"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="205" rx="22" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿 ===== -->
      <!-- 後腿 -->
      <ellipse cx="8" cy="184" rx="8" ry="15" fill="url(#mobScoutPants)" transform="rotate(-3,8,184)"/>
      <ellipse cx="7" cy="198" rx="9" ry="6" fill="#2a2418"/>
      <!-- 前腿 -->
      <ellipse cx="-10" cy="182" rx="9" ry="16" fill="url(#mobScoutPants)" transform="rotate(3,-10,182)"/>
      <ellipse cx="-11" cy="198" rx="10" ry="6" fill="#2a2418"/>

      <!-- ===== 身體（偏瘦 rx=21 ry=23） ===== -->
      <ellipse cx="-2" cy="150" rx="21" ry="23" fill="url(#mobScoutArmor)" transform="rotate(-2,-2,150)"/>

      <!-- 領口 -->
      <path d="M-8,132 L-3,142 L3,132" fill="none" stroke="#4a5838" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- 簡陋綁帶 -->
      <path d="M-16,144 L-13,156" fill="none" stroke="#2a3020" stroke-width="0.8" opacity="0.4"/>
      <path d="M12,144 L15,156" fill="none" stroke="#2a3020" stroke-width="0.8" opacity="0.4"/>

      <!-- 腰帶 -->
      <path d="M-20,166 Q-2,172 18,166" fill="none" stroke="#3a3020" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 箭囊帶（斜跨） -->
      <path d="M-16,134 L12,166" fill="none" stroke="#4a3828" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

      <!-- ===== 右手臂（角色左手，持弓） ===== -->
      <path d="M16,138 Q28,144 30,156" fill="none" stroke="url(#mobScoutArmor)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="30" cy="158" r="4.5" fill="url(#mobScoutFace)" opacity="0.85"/>

      <!-- ===== 弓（右手持，身前） ===== -->
      <!-- 弓身（C形弧線） -->
      <path d="M26,118 C16,128 14,148 22,168" fill="none" stroke="url(#mobScoutBow)" stroke-width="3" stroke-linecap="round"/>
      <!-- 弓弦 -->
      <line x1="26" y1="118" x2="22" y2="168" stroke="#2a2018" stroke-width="1.5"/>

      <!-- ===== 左手臂（角色右手，拉弦搭箭） ===== -->
      <path d="M-18,138 Q-32,132 -38,128" fill="none" stroke="url(#mobScoutArmor)" stroke-width="9" stroke-linecap="round"/>
      <!-- 拉弦的手 -->
      <circle cx="-38" cy="130" r="5" fill="url(#mobScoutFace)"/>

      <!-- 箭（搭在弦上） -->
      <line x1="-38" y1="130" x2="-10" y2="142" stroke="#888" stroke-width="2" stroke-linecap="round"/>
      <!-- 箭頭 -->
      <path d="M-10,142 L-14,138 L-12,144 Z" fill="#666"/>

      <!-- ===== 大頭 ===== -->
      <!-- 後腦 -->
      <ellipse cx="0" cy="98" rx="34" ry="36" fill="url(#mobScoutHair)"/>

      <!-- 臉（偏瘦） -->
      <path d="M-22,90 C-26,100 -24,114 -18,124 C-12,130 -4,134 4,132 C10,130 14,124 18,114 C22,102 20,90 14,82 C8,76 2,74 -4,76 C-12,78 -20,84 -22,90Z" fill="url(#mobScoutFace)"/>

      <!-- 頭髮頂部（短髮） -->
      <path d="M-16,80 C-12,64 4,56 16,60 C24,64 28,74 24,84 C20,76 14,70 6,68 C0,66 -8,68 -14,74" fill="url(#mobScoutHair)"/>

      <!-- 頭帶（暗綠） -->
      <path d="M-26,82 C-22,74 -8,68 8,70 C18,72 26,78 24,82" fill="#3a4830" stroke="#2a3820" stroke-width="0.5"/>
      <path d="M-28,82 L28,82 L26,86 L-26,86 Z" fill="#3a4830" stroke="#2a3820" stroke-width="0.5"/>
      <!-- 頭帶尾巴 -->
      <path d="M24,84 C28,82 32,86 30,92" fill="none" stroke="#3a4830" stroke-width="3" stroke-linecap="round"/>

      <!-- 側髮 -->
      <path d="M-24,88 C-28,80 -30,84 -28,92 C-26,96 -24,94 -24,90" fill="url(#mobScoutHair)"/>
      <path d="M18,86 C22,80 24,86 22,94 C20,96 18,94 18,90" fill="url(#mobScoutHair)"/>

      <!-- 耳朵 -->
      <path d="M16,104 C20,100 22,106 20,112 C18,116 16,114 16,110" fill="url(#mobScoutFace)" stroke="#b09068" stroke-width="0.5"/>

      <!-- ===== 眼睛（rx=5.5 ry=6 警覺細眼） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-10" cy="108" rx="5.5" ry="6" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="3.2" ry="3.5" fill="#303828"/>
      <ellipse cx="-11.5" cy="108.5" rx="1.8" ry="2" fill="#181c10"/>
      <circle cx="-13" cy="107.5" r="0.9" fill="#fff" opacity="0.55"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="108" rx="5.5" ry="6" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.2" ry="3.5" fill="#303828"/>
      <ellipse cx="4.5" cy="108.5" rx="1.8" ry="2" fill="#181c10"/>
      <circle cx="3" cy="107.5" r="0.9" fill="#fff" opacity="0.55"/>

      <!-- 眉毛（警覺微皺） -->
      <path d="M-14,102 C-10,100 -8,101 -6,103" fill="none" stroke="#2a2418" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,103 C10,101 12,100 16,102" fill="none" stroke="#2a2418" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#a88e68" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（抿嘴警戒） -->
      <path d="M-8,128 C-4,130 2,130 6,128" fill="none" stroke="#704840" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
