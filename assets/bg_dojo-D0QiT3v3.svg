<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <!-- 木地板漸層 -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="100%" stop-color="#6B5335"/>
    </linearGradient>
    <!-- 牆壁漸層 -->
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D2B48C"/>
      <stop offset="100%" stop-color="#A0895C"/>
    </linearGradient>
    <!-- 天花板 -->
    <linearGradient id="ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2b1a"/>
      <stop offset="100%" stop-color="#5a4030"/>
    </linearGradient>
    <!-- 燈光暈染 -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc44" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#ff9922" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <!-- 窗光 -->
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffeecc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 整體背景色 -->
  <rect width="2560" height="1440" fill="#4a3520"/>

  <!-- 天花板 -->
  <rect x="0" y="0" width="2560" height="200" fill="url(#ceiling)"/>
  <!-- 天花板橫樑 -->
  <rect x="0" y="190" width="2560" height="20" fill="#3d2510" rx="3"/>
  <rect x="400" y="50" width="30" height="160" fill="#4a3018"/>
  <rect x="850" y="50" width="30" height="160" fill="#4a3018"/>
  <rect x="1280" y="30" width="35" height="180" fill="#4a3018"/>
  <rect x="1710" y="50" width="30" height="160" fill="#4a3018"/>
  <rect x="2130" y="50" width="30" height="160" fill="#4a3018"/>

  <!-- 後牆（y=200 到 y=480） -->
  <rect x="0" y="200" width="2560" height="280" fill="url(#wall)"/>

  <!-- 窗戶（左） -->
  <rect x="300" y="230" width="180" height="200" fill="#1a3050" rx="4"/>
  <rect x="310" y="238" width="75" height="90" fill="#4488aa" opacity="0.6"/>
  <rect x="395" y="238" width="75" height="90" fill="#3377aa" opacity="0.5"/>
  <rect x="310" y="336" width="75" height="90" fill="#3377aa" opacity="0.5"/>
  <rect x="395" y="336" width="75" height="90" fill="#4488aa" opacity="0.6"/>
  <line x1="390" y1="238" x2="390" y2="426" stroke="#5a4030" stroke-width="8"/>
  <line x1="310" y1="332" x2="470" y2="332" stroke="#5a4030" stroke-width="8"/>
  <!-- 窗框 -->
  <rect x="296" y="226" width="188" height="208" fill="none" stroke="#5a4030" stroke-width="8" rx="4"/>
  <!-- 窗光投射 -->
  <polygon points="310,430 480,430 600,700 200,700" fill="url(#windowLight)"/>

  <!-- 窗戶（右） -->
  <rect x="2080" y="230" width="180" height="200" fill="#1a3050" rx="4"/>
  <rect x="2090" y="238" width="75" height="90" fill="#4488aa" opacity="0.6"/>
  <rect x="2175" y="238" width="75" height="90" fill="#3377aa" opacity="0.5"/>
  <rect x="2090" y="336" width="75" height="90" fill="#3377aa" opacity="0.5"/>
  <rect x="2175" y="336" width="75" height="90" fill="#4488aa" opacity="0.6"/>
  <line x1="2170" y1="238" x2="2170" y2="426" stroke="#5a4030" stroke-width="8"/>
  <line x1="2090" y1="332" x2="2250" y2="332" stroke="#5a4030" stroke-width="8"/>
  <rect x="2076" y="226" width="188" height="208" fill="none" stroke="#5a4030" stroke-width="8" rx="4"/>
  <polygon points="2090,430 2260,430 2370,700 1980,700" fill="url(#windowLight)"/>

  <!-- 武器架（左牆） -->
  <rect x="600" y="260" width="200" height="20" fill="#5a3a20"/>
  <rect x="600" y="350" width="200" height="20" fill="#5a3a20"/>
  <!-- 架上武器 -->
  <line x1="640" y1="280" x2="640" y2="350" stroke="#888" stroke-width="4"/>
  <line x1="700" y1="270" x2="700" y2="350" stroke="#777" stroke-width="5"/>
  <line x1="760" y1="280" x2="760" y2="350" stroke="#999" stroke-width="3"/>

  <!-- 武器架（右牆） -->
  <rect x="1760" y="260" width="200" height="20" fill="#5a3a20"/>
  <rect x="1760" y="350" width="200" height="20" fill="#5a3a20"/>
  <line x1="1800" y1="280" x2="1800" y2="350" stroke="#888" stroke-width="4"/>
  <line x1="1860" y1="270" x2="1860" y2="350" stroke="#777" stroke-width="5"/>
  <line x1="1920" y1="280" x2="1920" y2="350" stroke="#999" stroke-width="3"/>

  <!-- 中央匾額 -->
  <rect x="1080" y="240" width="400" height="100" fill="#6a2020" rx="6"/>
  <rect x="1090" y="248" width="380" height="84" fill="#8a3030" rx="4"/>
  <text x="1280" y="305" text-anchor="middle" font-family="serif" font-size="60" fill="#ffdd88" font-weight="bold">樓家堡</text>

  <!-- 木地板（y=480 到 y=1440） -->
  <rect x="0" y="480" width="2560" height="960" fill="url(#floor)"/>
  <!-- 地板紋理線 -->
  <line x1="0" y1="540" x2="2560" y2="540" stroke="#7a6345" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="650" x2="2560" y2="650" stroke="#7a6345" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="760" x2="2560" y2="760" stroke="#7a6345" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="870" x2="2560" y2="870" stroke="#7a6345" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="980" x2="2560" y2="980" stroke="#7a6345" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="1100" x2="2560" y2="1100" stroke="#7a6345" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="1250" x2="2560" y2="1250" stroke="#7a6345" stroke-width="1" opacity="0.1"/>
  <!-- 縱向木板縫 -->
  <line x1="320" y1="480" x2="320" y2="1440" stroke="#6a5335" stroke-width="1" opacity="0.3"/>
  <line x1="640" y1="480" x2="640" y2="1440" stroke="#6a5335" stroke-width="1" opacity="0.3"/>
  <line x1="960" y1="480" x2="960" y2="1440" stroke="#6a5335" stroke-width="1" opacity="0.3"/>
  <line x1="1280" y1="480" x2="1280" y2="1440" stroke="#6a5335" stroke-width="1" opacity="0.3"/>
  <line x1="1600" y1="480" x2="1600" y2="1440" stroke="#6a5335" stroke-width="1" opacity="0.3"/>
  <line x1="1920" y1="480" x2="1920" y2="1440" stroke="#6a5335" stroke-width="1" opacity="0.3"/>
  <line x1="2240" y1="480" x2="2240" y2="1440" stroke="#6a5335" stroke-width="1" opacity="0.3"/>

  <!-- 木柱（紅色，y=200 到 y=480） -->
  <rect x="140" y="200" width="40" height="280" fill="#8B2020" rx="4"/>
  <rect x="560" y="200" width="40" height="280" fill="#8B2020" rx="4"/>
  <rect x="960" y="200" width="40" height="280" fill="#8B2020" rx="4"/>
  <rect x="1560" y="200" width="40" height="280" fill="#8B2020" rx="4"/>
  <rect x="1960" y="200" width="40" height="280" fill="#8B2020" rx="4"/>
  <rect x="2380" y="200" width="40" height="280" fill="#8B2020" rx="4"/>

  <!-- 柱礎 -->
  <rect x="130" y="470" width="60" height="20" fill="#777" rx="3"/>
  <rect x="550" y="470" width="60" height="20" fill="#777" rx="3"/>
  <rect x="950" y="470" width="60" height="20" fill="#777" rx="3"/>
  <rect x="1550" y="470" width="60" height="20" fill="#777" rx="3"/>
  <rect x="1950" y="470" width="60" height="20" fill="#777" rx="3"/>
  <rect x="2370" y="470" width="60" height="20" fill="#777" rx="3"/>

  <!-- 懸掛燈籠 -->
  <!-- 左燈 -->
  <line x1="415" y1="190" x2="415" y2="240" stroke="#5a4030" stroke-width="2"/>
  <ellipse cx="415" cy="270" rx="25" ry="35" fill="#cc4400" opacity="0.9"/>
  <ellipse cx="415" cy="270" rx="20" ry="30" fill="#ff6622" opacity="0.7"/>
  <circle cx="415" cy="270" r="60" fill="url(#lanternGlow)"/>

  <!-- 中燈 -->
  <line x1="1280" y1="190" x2="1280" y2="230" stroke="#5a4030" stroke-width="2"/>
  <ellipse cx="1280" cy="258" rx="28" ry="38" fill="#cc4400" opacity="0.9"/>
  <ellipse cx="1280" cy="258" rx="23" ry="33" fill="#ff6622" opacity="0.7"/>
  <circle cx="1280" cy="258" r="70" fill="url(#lanternGlow)"/>

  <!-- 右燈 -->
  <line x1="2145" y1="190" x2="2145" y2="240" stroke="#5a4030" stroke-width="2"/>
  <ellipse cx="2145" cy="270" rx="25" ry="35" fill="#cc4400" opacity="0.9"/>
  <ellipse cx="2145" cy="270" rx="20" ry="30" fill="#ff6622" opacity="0.7"/>
  <circle cx="2145" cy="270" r="60" fill="url(#lanternGlow)"/>

  <!-- 練武場中央圓圈（比武區域標記） -->
  <ellipse cx="1280" cy="800" rx="400" ry="120" fill="none" stroke="#aa8855" stroke-width="4" stroke-dasharray="20,10" opacity="0.4"/>

  <!-- 牆角裝飾：練功木人樁 -->
  <rect x="100" y="370" width="20" height="110" fill="#6a4a2a"/>
  <line x1="110" y1="410" x2="60" y2="390" stroke="#6a4a2a" stroke-width="8" stroke-linecap="round"/>
  <line x1="110" y1="430" x2="160" y2="410" stroke="#6a4a2a" stroke-width="8" stroke-linecap="round"/>

  <rect x="2440" y="370" width="20" height="110" fill="#6a4a2a"/>
  <line x1="2450" y1="410" x2="2500" y2="390" stroke="#6a4a2a" stroke-width="8" stroke-linecap="round"/>
  <line x1="2450" y1="430" x2="2400" y2="410" stroke="#6a4a2a" stroke-width="8" stroke-linecap="round"/>

  <!-- 整體暖光疊加 -->
  <rect width="2560" height="1440" fill="#ffaa44" opacity="0.05"/>
</svg>