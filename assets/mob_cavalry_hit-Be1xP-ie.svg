<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙國騎兵 — 受擊 -->
  <defs>
    <radialGradient id="mobCavalryFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c0a470"/>
    </radialGradient>
    <linearGradient id="mobCavalryArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3030"/>
      <stop offset="100%" stop-color="#3a2020"/>
    </linearGradient>
    <linearGradient id="mobCavalryPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2828"/>
      <stop offset="100%" stop-color="#2a1818"/>
    </linearGradient>
    <linearGradient id="mobCavalryHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="mobCavalryBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="198" rx="22" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（受擊後退） ===== -->
      <ellipse cx="14" cy="178" rx="8" ry="15" fill="url(#mobCavalryPants)" transform="rotate(-3,14,178)"/>
      <ellipse cx="13" cy="192" rx="9" ry="6" fill="#2a1818"/>
      <ellipse cx="-6" cy="176" rx="9" ry="16" fill="url(#mobCavalryPants)" transform="rotate(3,-6,176)"/>
      <ellipse cx="-7" cy="192" rx="10" ry="6" fill="#2a1818"/>

      <!-- ===== 身體（微後仰） ===== -->
      <ellipse cx="-2" cy="146" rx="24" ry="26" fill="url(#mobCavalryArmor)" transform="rotate(8,-2,146)"/>

      <!-- 肩甲 -->
      <ellipse cx="-20" cy="130" rx="8" ry="5" fill="#4a2828" stroke="#3a1818" stroke-width="0.5" transform="rotate(-5,-20,130)"/>
      <ellipse cx="16" cy="130" rx="8" ry="5" fill="#4a2828" stroke="#3a1818" stroke-width="0.5" transform="rotate(15,16,130)"/>

      <path d="M-8,128 L-4,136 L4,128" fill="none" stroke="#3a2020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <path d="M-20,166 Q-2,172 18,166" fill="none" stroke="#3a2818" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="100" rx="32" ry="34" fill="url(#mobCavalryHair)"/>

      <path d="M-22,92 C-26,102 -24,112 -18,122 C-12,130 -4,134 4,132 C10,130 16,124 20,114 C24,102 22,92 16,84 C10,78 4,76 -2,78 C-12,80 -20,86 -22,92Z" fill="url(#mobCavalryFace)"/>

      <path d="M-14,80 C-10,64 4,56 14,60 C22,64 26,74 22,84 C18,76 12,70 4,68 C0,66 -6,68 -12,74" fill="url(#mobCavalryHair)"/>

      <path d="M6,60 C10,54 16,56 14,64" fill="url(#mobCavalryHair)" stroke="#2a2018" stroke-width="0.5"/>

      <path d="M-20,84 C-24,78 -26,82 -26,88 C-24,92 -20,90 -20,86" fill="url(#mobCavalryHair)"/>
      <path d="M16,86 C22,80 24,88 22,96 C20,100 16,98 16,94" fill="url(#mobCavalryHair)"/>

      <path d="M16,104 C20,100 22,106 20,112 C18,116 16,114 16,110" fill="url(#mobCavalryFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- 眼睛（受擊瞇眼） -->
      <ellipse cx="-10" cy="108" rx="6.5" ry="2.5" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="3.8" ry="2" fill="#2a1818"/>
      <ellipse cx="-11.5" cy="108" rx="2" ry="1.2" fill="#1a0808"/>
      <circle cx="-13" cy="107" r="0.8" fill="#fff" opacity="0.5"/>

      <ellipse cx="6" cy="108" rx="6.5" ry="2.5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.8" ry="2" fill="#2a1818"/>
      <ellipse cx="4.5" cy="108" rx="2" ry="1.2" fill="#1a0808"/>
      <circle cx="3" cy="107" r="0.8" fill="#fff" opacity="0.5"/>

      <path d="M-14,101 C-10,99 -8,100 -6,102" fill="none" stroke="#2a2018" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,102 C10,100 12,99 16,101" fill="none" stroke="#2a2018" stroke-width="1.8" stroke-linecap="round"/>

      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#a08858" stroke-width="1.2" stroke-linecap="round"/>

      <path d="M-8,128 C-4,129 2,129 6,128" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>

      <!-- ===== 左手臂（負x，受擊後甩） ===== -->
      <path d="M-18,134 Q-28,138 -32,146" fill="none" stroke="url(#mobCavalryArmor)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-32" cy="148" r="4.5" fill="url(#mobCavalryFace)" opacity="0.85"/>

      <!-- ===== 右手臂（正x，持劍偏移） ===== -->
      <path d="M16,134 Q28,138 32,146" fill="none" stroke="url(#mobCavalryArmor)" stroke-width="10" stroke-linecap="round"/>

      <!-- 劍（受擊下垂，正x區域） -->
      <line x1="34" y1="150" x2="36" y2="200" stroke="url(#mobCavalryBlade)" stroke-width="4" stroke-linecap="round"/>
      <line x1="35" y1="152" x2="37" y2="198" stroke="#ddd" stroke-width="1" opacity="0.3"/>
      <line x1="30" y1="148" x2="38" y2="150" stroke="#806030" stroke-width="3" stroke-linecap="round"/>
      <line x1="33" y1="148" x2="31" y2="142" stroke="#4a3520" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="30" cy="140" r="2" fill="#806030"/>
      <circle cx="33" cy="150" r="5" fill="url(#mobCavalryFace)"/>
    </g>
  </g>
</svg>
