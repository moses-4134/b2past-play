<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 官道 — 吉卜力風格：寬闊古道、路旁大樹、里程碑、遠山綿延 地平線 y=180（33%） -->
  <defs>
    <!-- 天空（清澈午後） -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78aad0"/>
      <stop offset="50%" stop-color="#a0c8e0"/>
      <stop offset="100%" stop-color="#d0e0e8"/>
    </linearGradient>
    <!-- 道路 -->
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0a080"/>
      <stop offset="100%" stop-color="#908060"/>
    </linearGradient>
    <!-- 草地 -->
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6aaa48"/>
      <stop offset="100%" stop-color="#508a30"/>
    </linearGradient>
    <!-- 樹幹 -->
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a3820"/>
      <stop offset="50%" stop-color="#5a4828"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- ===== 雲朵 ===== -->
  <ellipse cx="200" cy="60" rx="70" ry="25" fill="#fff" opacity="0.7"/>
  <ellipse cx="170" cy="55" rx="45" ry="20" fill="#fff" opacity="0.75"/>
  <ellipse cx="240" cy="58" rx="40" ry="18" fill="#fff" opacity="0.72"/>
  <ellipse cx="700" cy="45" rx="60" ry="22" fill="#fff" opacity="0.6"/>
  <ellipse cx="670" cy="42" rx="40" ry="18" fill="#fff" opacity="0.65"/>
  <ellipse cx="740" cy="44" rx="35" ry="16" fill="#fff" opacity="0.6"/>
  <ellipse cx="450" cy="80" rx="40" ry="15" fill="#fff" opacity="0.45"/>

  <!-- ===== 遠山 ===== -->
  <path d="M0,150 Q80,120 180,140 Q280,105 400,132 Q520,95 640,125 Q740,85 860,115 Q920,105 960,120 L960,168 L0,168 Z" fill="#8ab0c0" opacity="0.4"/>
  <path d="M0,160 Q120,140 240,155 Q360,130 480,150 Q600,125 720,148 Q840,130 960,145 L960,175 L0,175 Z" fill="#80a898" opacity="0.35"/>
  <path d="M0,168 Q100,155 220,165 Q340,148 460,162 Q580,145 700,160 Q820,150 960,160 L960,180 L0,180 Z" fill="#78a078" opacity="0.3"/>

  <!-- ===== 中景綠丘 ===== -->
  <path d="M0,172 Q200,160 400,170 Q600,158 800,168 Q900,162 960,168 L960,180 L0,180 Z" fill="#6a9a48" opacity="0.45"/>

  <!-- ===== 路旁大樹（左） ===== -->
  <!-- 樹幹 -->
  <rect x="100" y="90" width="35" height="100" fill="url(#trunk)" rx="4"/>
  <path d="M110,110 Q115,130 112,150 Q118,165 116,178" fill="none" stroke="#3a2818" stroke-width="0.8" opacity="0.3"/>
  <!-- 樹根 -->
  <path d="M100,180 Q80,183 70,190" fill="none" stroke="#4a3820" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <path d="M135,180 Q150,185 160,193" fill="none" stroke="#4a3820" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <!-- 樹冠（圓潤吉卜力風） -->
  <circle cx="85" cy="80" r="30" fill="#4a8a30" opacity="0.7"/>
  <circle cx="118" cy="60" r="38" fill="#3a7a25" opacity="0.75"/>
  <circle cx="150" cy="75" r="32" fill="#5a9a38" opacity="0.7"/>
  <circle cx="118" cy="40" r="35" fill="#4a8a30" opacity="0.65"/>
  <circle cx="90" cy="55" r="28" fill="#3a7a25" opacity="0.6"/>
  <circle cx="145" cy="50" r="28" fill="#5a9a38" opacity="0.6"/>

  <!-- ===== 路旁大樹（右遠） ===== -->
  <rect x="780" y="130" width="22" height="55" fill="url(#trunk)" rx="3" opacity="0.6"/>
  <circle cx="770" cy="120" r="22" fill="#4a8a30" opacity="0.5"/>
  <circle cx="792" cy="108" r="28" fill="#3a7a25" opacity="0.55"/>
  <circle cx="810" cy="118" r="20" fill="#5a9a38" opacity="0.5"/>
  <circle cx="792" cy="98" r="24" fill="#4a8a30" opacity="0.48"/>

  <!-- ===== 官道（寬闊路面） ===== -->
  <!-- 左側草地 -->
  <rect x="0" y="180" width="200" height="360" fill="url(#grass)"/>
  <!-- 右側草地 -->
  <rect x="700" y="180" width="260" height="360" fill="url(#grass)"/>
  <!-- 道路主體 -->
  <path d="M200,180 L700,180 L800,540 L100,540 Z" fill="url(#road)"/>
  <!-- 路面紋理 -->
  <path d="M250,215 Q400,210 550,215 Q650,210 700,215" fill="none" stroke="#8a7a58" stroke-width="0.8" opacity="0.2"/>
  <path d="M220,265 Q400,259 580,265 Q700,259 740,265" fill="none" stroke="#8a7a58" stroke-width="0.7" opacity="0.18"/>
  <path d="M180,315 Q400,307 620,315 Q750,309 780,315" fill="none" stroke="#8a7a58" stroke-width="0.7" opacity="0.15"/>
  <path d="M150,365 Q400,357 650,365 Q770,359 800,365" fill="none" stroke="#8a7a58" stroke-width="0.6" opacity="0.12"/>

  <!-- 道路邊線 -->
  <line x1="200" y1="180" x2="100" y2="540" stroke="#7a6a48" stroke-width="2" opacity="0.3"/>
  <line x1="700" y1="180" x2="800" y2="540" stroke="#7a6a48" stroke-width="2" opacity="0.3"/>

  <!-- 草地紋理 -->
  <path d="M20,205 Q40,200 60,205 Q80,197 100,203" fill="none" stroke="#408a28" stroke-width="0.6" opacity="0.2"/>
  <path d="M760,210 Q800,203 840,209 Q880,201 920,207" fill="none" stroke="#408a28" stroke-width="0.6" opacity="0.2"/>

  <!-- ===== 里程碑 ===== -->
  <rect x="680" y="163" width="14" height="22" fill="#9a9a8a" rx="2" opacity="0.7"/>
  <rect x="682" y="165" width="10" height="8" fill="#8a8a7a" rx="1" opacity="0.5"/>

  <!-- ===== 路旁小草叢 ===== -->
  <path d="M195,180 Q198,165 201,180 Q204,163 207,180" fill="none" stroke="#5a9a38" stroke-width="1.5" opacity="0.5"/>
  <path d="M695,180 Q698,167 701,180 Q704,163 707,180" fill="none" stroke="#5a9a38" stroke-width="1.5" opacity="0.45"/>
  <path d="M50,180 Q53,167 56,180 Q59,163 62,180 Q64,169 66,180" fill="none" stroke="#4a8a30" stroke-width="1.5" opacity="0.45"/>
  <path d="M880,180 Q883,165 886,180 Q889,163 892,180" fill="none" stroke="#4a8a30" stroke-width="1.5" opacity="0.4"/>

  <!-- ===== 空氣粒子（微塵花粉） ===== -->
  <circle cx="120" cy="160" r="1.5" fill="#fff" opacity="0.35"/>
  <circle cx="300" cy="130" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="500" cy="180" r="1.5" fill="#fff" opacity="0.28"/>
  <circle cx="650" cy="150" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="820" cy="200" r="1.2" fill="#fff" opacity="0.25"/>
  <circle cx="200" cy="230" r="1" fill="#fff8e0" opacity="0.25"/>
  <circle cx="400" cy="220" r="1.3" fill="#fff8e0" opacity="0.22"/>
  <circle cx="700" cy="240" r="1" fill="#fff8e0" opacity="0.2"/>
  <circle cx="50" cy="200" r="1.2" fill="#fff" opacity="0.28"/>
  <circle cx="900" cy="180" r="0.8" fill="#fff" opacity="0.25"/>

  <!-- ===== 整體氛圍覆蓋 ===== -->
  <rect width="960" height="540" fill="#f0e0a0" opacity="0.05"/>
</svg>