<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙嵬 — 吉卜力2頭身 面朝右（敵方）瀕死待機（HP <30%：半跪、喘息、雙眼近閉） -->
  <defs>
    <radialGradient id="zmCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e0d0"/>
      <stop offset="100%" stop-color="#d8c4a8"/>
    </radialGradient>
    <linearGradient id="zmCRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a2858"/>
      <stop offset="100%" stop-color="#2a1838"/>
    </linearGradient>
    <linearGradient id="zmCInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3828"/>
      <stop offset="100%" stop-color="#1a2818"/>
    </linearGradient>
    <linearGradient id="zmCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#201820"/>
      <stop offset="100%" stop-color="#100810"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="200" rx="30" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪：後腿跪地、前腿撐住） ===== -->
      <!-- 後腿（膝蓋著地） -->
      <ellipse cx="8" cy="182" rx="8" ry="12" fill="url(#zmCInner)" transform="rotate(-20,8,182)"/>
      <ellipse cx="2" cy="194" rx="7" ry="4.5" fill="url(#zmCInner)"/>
      <ellipse cx="0" cy="198" rx="8" ry="5" fill="#2a2020"/>
      <!-- 前腿（彎曲撐住） -->
      <ellipse cx="-14" cy="178" rx="8" ry="16" fill="url(#zmCInner)" transform="rotate(12,-14,178)"/>
      <ellipse cx="-18" cy="198" rx="9" ry="5.5" fill="#2a2020"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="150" rx="23" ry="24" fill="url(#zmCRobe)" transform="rotate(-14,-4,150)"/>

      <!-- 墨綠內襯 -->
      <path d="M-12,130 L-7,142 L0,130" fill="none" stroke="#2a3828" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 金色腰帶 -->
      <path d="M-24,166 Q-4,174 18,168" fill="none" stroke="#c8a040" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-5" cy="171" r="3" fill="#d8b050"/>

      <!-- 紫色袍邊金線 -->
      <path d="M-23,136 Q-24,150 -23,166" fill="none" stroke="#c8a040" stroke-width="0.8" opacity="0.5"/>
      <path d="M17,136 Q18,150 17,166" fill="none" stroke="#c8a040" stroke-width="0.8" opacity="0.5"/>

      <!-- ===== 畫面右側手臂（角色左手，撐在膝蓋上） ===== -->
      <path d="M14,138 Q22,152 14,172" fill="none" stroke="url(#zmCRobe)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
      <circle cx="13" cy="174" r="4" fill="url(#zmCFace)" opacity="0.85"/>

      <!-- ===== 畫面左側手臂（角色右手，撐地） ===== -->
      <path d="M-22,138 Q-40,148 -48,162" fill="none" stroke="url(#zmCRobe)" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="-48" cy="164" rx="7" ry="5" fill="#3a1e48" transform="rotate(10,-48,164)"/>
      <circle cx="-50" cy="164" r="4.5" fill="url(#zmCFace)"/>
      <!-- 手撐地 -->
      <ellipse cx="-52" cy="198" rx="4" ry="2" fill="#5a4a30" opacity="0.3"/>

      <!-- ===== 大頭（低垂喘息） ===== -->
      <ellipse cx="-2" cy="90" rx="36" ry="38" fill="url(#zmCHair)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-26,86 C-30,96 -28,114 -22,124 C-16,132 -6,136 2,134 C8,132 14,126 18,116 C22,104 20,92 14,84 C8,78 0,76 -6,78 C-14,80 -24,82 -26,86Z" fill="url(#zmCFace)"/>

      <!-- 腮紅（更明顯） -->
      <ellipse cx="-20" cy="120" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,78 C-12,58 4,48 16,54 C24,60 26,72 22,82 C18,74 10,66 2,64 C-6,62 -12,66 -16,74" fill="url(#zmCHair)"/>

      <!-- 官帽/髮冠（歪斜） -->
      <path d="M-14,60 C-10,46 6,42 14,48 C18,52 16,58 12,60" fill="#201820" stroke="#c8a040" stroke-width="1" transform="rotate(-6,2,52)"/>
      <rect x="-4" y="42" width="8" height="6" rx="1" fill="#c8a040" transform="rotate(-6,2,52)"/>
      <circle cx="0" cy="45" r="2" fill="#e8c060" transform="rotate(-6,2,52)"/>

      <!-- 散落髮絲 -->
      <path d="M-30,96 C-32,102 -30,106" fill="none" stroke="url(#zmCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 鬢角 -->
      <path d="M18,84 C24,80 26,88 24,96 C22,102 18,100 18,94" fill="url(#zmCHair)"/>
      <path d="M20,96 C24,94 26,102 24,110" fill="none" stroke="#606060" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <path d="M-28,88 C-32,100 -32,114 -30,124" fill="none" stroke="url(#zmCHair)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

      <!-- 耳朵 -->
      <path d="M16,100 C20,96 22,102 20,108 C18,112 16,110 16,106" fill="url(#zmCFace)" stroke="#d0b498" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼瞇成線） ===== -->
      <!-- 左眼（幾乎閉上） -->
      <ellipse cx="-11" cy="108" rx="6.5" ry="2" fill="#fff"/>
      <ellipse cx="-12" cy="108.5" rx="4" ry="1.5" fill="#2a1818"/>
      <ellipse cx="-12.5" cy="108" rx="2" ry="1" fill="#0c0404"/>

      <!-- 右眼（勉強一線） -->
      <ellipse cx="4" cy="108" rx="6.5" ry="2.5" fill="#fff"/>
      <ellipse cx="3" cy="108.5" rx="4" ry="2" fill="#2a1818"/>
      <ellipse cx="2.5" cy="108" rx="2" ry="1.2" fill="#0c0404"/>
      <circle cx="1" cy="107.5" r="0.8" fill="#fff" opacity="0.6"/>

      <!-- 粗濃眉（深皺） -->
      <path d="M-18,100 C-14,98 -10,99 -6,102" fill="none" stroke="#201820" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M0,102 C4,99 8,98 12,100" fill="none" stroke="#201820" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 眉間皺紋 -->
      <path d="M-7,103 C-5,101 -2,101 0,103" fill="none" stroke="#c0a080" stroke-width="1" opacity="0.6"/>
      <path d="M-8,105 C-6,103.5 -3,103.5 -1,105" fill="none" stroke="#c0a080" stroke-width="0.7" opacity="0.4"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-15,120 -13,122" fill="none" stroke="#c8b090" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 八字鬍（散亂） -->
      <path d="M-10,124 C-14,128 -18,129" fill="none" stroke="#302828" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-2,124 C2,128 6,129" fill="none" stroke="#302828" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-6" cy="131" rx="5" ry="4.5" fill="#703030"/>
      <path d="M-10,129 L-2,129" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴（多顆） -->
      <path d="M-22,88 C-23,92 -22,98 -21,101" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-21" cy="102" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M20,92 C21,96 20,100" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="20" cy="101" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-8" cy="80" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>