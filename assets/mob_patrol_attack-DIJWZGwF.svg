<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙國巡邏兵 — 攻擊（劍前刺，前跨步） -->
  <defs>
    <radialGradient id="mobPatrolFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c4a0"/>
      <stop offset="100%" stop-color="#cca880"/>
    </radialGradient>
    <linearGradient id="mobPatrolArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a4038"/>
      <stop offset="100%" stop-color="#2a3028"/>
    </linearGradient>
    <linearGradient id="mobPatrolPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3028"/>
      <stop offset="100%" stop-color="#1a2018"/>
    </linearGradient>
    <linearGradient id="mobPatrolHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobPatrolSteel" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-8" cy="200" rx="24" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前跨步） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="180" rx="8" ry="15" fill="url(#mobPatrolPants)" transform="rotate(-8,12,180)"/>
      <ellipse cx="10" cy="194" rx="9" ry="6" fill="#1a2018"/>
      <!-- 前腿 -->
      <ellipse cx="-16" cy="176" rx="9" ry="16" fill="url(#mobPatrolPants)" transform="rotate(12,-16,176)"/>
      <ellipse cx="-20" cy="192" rx="10" ry="6" fill="#1a2018"/>

      <!-- ===== 身體（前傾攻擊） ===== -->
      <ellipse cx="-4" cy="146" rx="23" ry="25" fill="url(#mobPatrolArmor)" transform="rotate(-10,-4,146)"/>

      <!-- 甲片紋理 -->
      <path d="M-10,136 L-7,146" fill="none" stroke="#1a2018" stroke-width="0.8" opacity="0.4"/>
      <path d="M4,140 L7,150" fill="none" stroke="#1a2018" stroke-width="0.7" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-12,128 L-6,138 L2,128" fill="none" stroke="#2a3028" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-22,166 Q-4,172 16,166" fill="none" stroke="#2a2418" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 大頭（前傾） ===== -->
      <ellipse cx="-2" cy="98" rx="34" ry="36" fill="url(#mobPatrolHair)" transform="rotate(-5,-2,98)"/>

      <!-- 臉 -->
      <path d="M-22,90 C-26,100 -24,112 -18,122 C-12,130 -4,134 4,132 C10,130 14,124 18,114 C22,102 20,90 14,82 C8,76 2,74 -4,76 C-12,78 -20,84 -22,90Z" fill="url(#mobPatrolFace)" transform="rotate(-5,-2,104)"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,78 C-12,60 4,52 16,56 C24,60 28,72 24,82 C20,74 14,68 6,66 C0,64 -8,66 -14,72" fill="url(#mobPatrolHair)"/>

      <!-- 巡邏布帽 -->
      <path d="M-26,78 C-22,68 -8,62 8,64 C18,66 26,72 24,78" fill="#3a4038" stroke="#2a3028" stroke-width="0.5"/>
      <path d="M-28,78 C-28,76 -26,74 -22,76 L26,76 C28,76 28,80 26,80 L-26,80 C-28,80 -28,78 -28,78Z" fill="#3a4038" stroke="#2a3028" stroke-width="0.5"/>

      <!-- 瀏海 -->
      <path d="M-22,84 C-26,76 -28,80 -28,88 C-26,92 -22,90 -22,86" fill="url(#mobPatrolHair)"/>

      <!-- 側髮 -->
      <path d="M18,84 C24,78 26,86 24,94 C22,98 18,96 18,92" fill="url(#mobPatrolHair)"/>

      <!-- 耳朵 -->
      <path d="M16,102 C20,98 22,104 20,110 C18,114 16,112 16,108" fill="url(#mobPatrolFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（用力瞪） ===== -->
      <ellipse cx="-10" cy="106" rx="6" ry="6" fill="#fff"/>
      <ellipse cx="-11" cy="107" rx="3.5" ry="3.5" fill="#2a2820"/>
      <ellipse cx="-11.5" cy="106" rx="2" ry="2" fill="#1a1810"/>
      <circle cx="-13" cy="105" r="1.1" fill="#fff" opacity="0.6"/>

      <ellipse cx="6" cy="106" rx="6" ry="6" fill="#fff"/>
      <ellipse cx="5" cy="107" rx="3.5" ry="3.5" fill="#2a2820"/>
      <ellipse cx="4.5" cy="106" rx="2" ry="2" fill="#1a1810"/>
      <circle cx="3" cy="105" r="1.1" fill="#fff" opacity="0.6"/>

      <!-- 眉毛（皺眉用力） -->
      <path d="M-14,99 C-10,97 -8,99 -6,101" fill="none" stroke="#2a2420" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,101 C10,99 12,97 16,99" fill="none" stroke="#2a2420" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,114 C-16,118 -12,122" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（張嘴吼叫） -->
      <ellipse cx="-3" cy="128" rx="7" ry="5" fill="#4a2020"/>
      <path d="M-10,126 C-6,124 0,124 4,126" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round"/>

      <!-- ===== 左手臂（負x，後擺） ===== -->
      <path d="M-18,134 Q-30,128 -36,122" fill="none" stroke="url(#mobPatrolArmor)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-36" cy="120" r="4.5" fill="url(#mobPatrolFace)" opacity="0.85"/>

      <!-- ===== 右手臂（正x，劍前刺到負x） ===== -->
      <path d="M14,134 Q0,128 -18,120" fill="none" stroke="url(#mobPatrolArmor)" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== 劍（前刺，從正x到負x，50.6px） ===== -->
      <!-- 劍身 -->
      <line x1="-70.6" y1="112" x2="-20" y2="118" stroke="url(#mobPatrolSteel)" stroke-width="4" stroke-linecap="round"/>
      <!-- 劍格 -->
      <rect x="-24" y="116" width="10" height="3" rx="1" fill="#6a5a40"/>
      <!-- 劍柄 -->
      <rect x="-22" y="119" width="6" height="9" rx="1" fill="#4a3020"/>
      <!-- 握劍的手 -->
      <circle cx="-19" cy="122" r="5" fill="url(#mobPatrolFace)"/>
    </g>
  </g>
</svg>