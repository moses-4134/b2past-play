<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 城門守卒 — 防禦（盾牌擋格） -->
  <defs>
    <radialGradient id="mobGateGuardFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c0a470"/>
    </radialGradient>
    <linearGradient id="mobGateGuardArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a4a48"/>
      <stop offset="100%" stop-color="#3a3a38"/>
    </linearGradient>
    <linearGradient id="mobGateGuardPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="100%" stop-color="#2a2a28"/>
    </linearGradient>
    <linearGradient id="mobGateGuardHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobGateGuardSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <linearGradient id="mobGateGuardShield" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6a5030"/>
      <stop offset="100%" stop-color="#4a3420"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="196" rx="24" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（低蹲防禦） ===== -->
      <ellipse cx="10" cy="176" rx="9" ry="16" fill="url(#mobGateGuardPants)" transform="rotate(-3,10,176)"/>
      <ellipse cx="9" cy="190" rx="10" ry="6" fill="#2a2820"/>
      <ellipse cx="-10" cy="174" rx="10" ry="17" fill="url(#mobGateGuardPants)" transform="rotate(3,-10,174)"/>
      <ellipse cx="-11" cy="190" rx="11" ry="6" fill="#2a2820"/>

      <!-- ===== 身體（蹲低） ===== -->
      <ellipse cx="-2" cy="144" rx="25" ry="27" fill="url(#mobGateGuardArmor)" transform="rotate(-3,-2,144)"/>

      <path d="M-10,128 L-4,136 L4,128" fill="none" stroke="#3a3a38" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <path d="M-22,164 Q-2,170 20,164" fill="none" stroke="#3a3020" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="100" rx="34" ry="36" fill="url(#mobGateGuardHair)"/>

      <path d="M-24,92 C-28,102 -26,114 -20,124 C-14,132 -4,136 4,134 C12,132 18,126 22,116 C26,104 24,92 18,84 C12,78 4,76 -2,78 C-14,80 -22,86 -24,92Z" fill="url(#mobGateGuardFace)"/>

      <path d="M-16,80 C-12,62 4,54 16,58 C24,62 28,74 24,84 C20,76 14,70 6,68 C0,66 -8,68 -14,74" fill="url(#mobGateGuardHair)"/>

      <!-- 頭盔 -->
      <path d="M-28,82 C-24,68 -8,60 8,62 C20,64 28,72 26,82" fill="#4a4a48" stroke="#3a3a38" stroke-width="0.5"/>
      <path d="M-30,82 C-30,80 -28,78 -24,80 L28,80 C30,80 30,84 28,84 L-28,84 C-30,84 -30,82 -30,82Z" fill="#4a4a48" stroke="#3a3a38" stroke-width="0.5"/>
      <line x1="0" y1="62" x2="0" y2="54" stroke="#4a4a48" stroke-width="2" stroke-linecap="round"/>

      <path d="M-22,84 C-26,78 -28,82 -28,88 C-26,92 -22,90 -22,86" fill="url(#mobGateGuardHair)"/>
      <path d="M18,86 C24,80 26,88 24,96 C22,100 18,98 18,94" fill="url(#mobGateGuardHair)"/>

      <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,110" fill="url(#mobGateGuardFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- 眼睛 -->
      <ellipse cx="-10" cy="108" rx="6" ry="5.5" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="3.5" ry="4" fill="#2a2820"/>
      <ellipse cx="-11.5" cy="108" rx="2" ry="2.2" fill="#1a1810"/>
      <circle cx="-13" cy="107" r="1" fill="#fff" opacity="0.55"/>

      <ellipse cx="6" cy="108" rx="6" ry="5.5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.5" ry="4" fill="#2a2820"/>
      <ellipse cx="4.5" cy="108" rx="2" ry="2.2" fill="#1a1810"/>
      <circle cx="3" cy="107" r="1" fill="#fff" opacity="0.55"/>

      <path d="M-14,102 C-10,101 -8,102 -6,103" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,103 C10,102 12,101 16,102" fill="none" stroke="#2a2420" stroke-width="1.8" stroke-linecap="round"/>

      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#a08858" stroke-width="1.2" stroke-linecap="round"/>

      <path d="M-8,128 C-4,129 2,129 6,128" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>

      <!-- ===== 左手臂（負x，盾牌前舉擋格） ===== -->
      <path d="M-18,134 Q-28,128 -30,122" fill="none" stroke="url(#mobGateGuardArmor)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-30" cy="122" r="4.5" fill="url(#mobGateGuardFace)" opacity="0.85"/>
      <ellipse cx="-34" cy="120" rx="14" ry="16" fill="url(#mobGateGuardShield)" stroke="#3a2818" stroke-width="1"/>
      <line x1="-34" y1="106" x2="-34" y2="134" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <line x1="-46" y1="120" x2="-22" y2="120" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <circle cx="-34" cy="120" r="3.5" fill="#806040" opacity="0.4"/>

      <!-- ===== 右手臂（正x，槍收身側） ===== -->
      <path d="M16,134 Q28,130 30,122" fill="none" stroke="url(#mobGateGuardArmor)" stroke-width="10" stroke-linecap="round"/>

      <!-- 槍（身側斜持，正x區域） -->
      <line x1="26" y1="56" x2="34" y2="134" stroke="#5a4028" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M24.6,46 L27.4,56.4 L21.8,55.6 Z" fill="url(#mobGateGuardSteel)" stroke="#888" stroke-width="0.5"/>
      <circle cx="30" cy="124" r="5" fill="url(#mobGateGuardFace)"/>
    </g>
  </g>
</svg>
