<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 擂台武者 — 受傷待機（HP 30~60%：身體微傾、劍下垂、眼半瞇、頭帶保留） -->
  <defs>
    <radialGradient id="mobFighterWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e4c8a0"/>
      <stop offset="100%" stop-color="#d0ac84"/>
    </radialGradient>
    <linearGradient id="mobFighterWCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a4048"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="mobFighterWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3038"/>
      <stop offset="100%" stop-color="#1a2028"/>
    </linearGradient>
    <linearGradient id="mobFighterWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobFighterWSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccc"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="200" rx="24" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（前腿微彎） ===== -->
      <!-- 後腿 -->
      <ellipse cx="8" cy="180" rx="9" ry="16" fill="url(#mobFighterWPants)" transform="rotate(-3,8,180)"/>
      <ellipse cx="7" cy="194" rx="10" ry="6" fill="#2a2418"/>
      <!-- 前腿 -->
      <ellipse cx="-10" cy="178" rx="10" ry="17" fill="url(#mobFighterWPants)" transform="rotate(8,-10,178)"/>
      <ellipse cx="-13" cy="194" rx="10" ry="6" fill="#2a2418"/>

      <!-- ===== 身體（前傾） ===== -->
      <ellipse cx="-2" cy="148" rx="25" ry="27" fill="url(#mobFighterWCloth)" transform="rotate(-8,-2,148)"/>

      <!-- 護臂 -->
      <rect x="14" y="130" width="8" height="14" rx="3" fill="#2a3038" stroke="#1a2028" stroke-width="0.5" transform="rotate(-5,18,137)"/>
      <rect x="-22" y="130" width="8" height="14" rx="3" fill="#2a3038" stroke="#1a2028" stroke-width="0.5" transform="rotate(5,-18,137)"/>

      <!-- 領口 -->
      <path d="M-10,128 L-4,140 L4,128" fill="none" stroke="#4a5058" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 束腰 -->
      <path d="M-22,168 Q-2,174 20,168" fill="none" stroke="#1a2028" stroke-width="4" stroke-linecap="round"/>
      <path d="M-22,168 Q-2,174 20,168" fill="none" stroke="#3a4048" stroke-width="2" stroke-linecap="round"/>

      <!-- ===== 右手臂（角色左手，按住傷口） ===== -->
      <path d="M18,136 Q26,150 12,164" fill="none" stroke="url(#mobFighterWCloth)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <circle cx="12" cy="166" r="5" fill="url(#mobFighterWFace)" opacity="0.85"/>

      <!-- ===== 左手臂（角色右手，持劍下垂） ===== -->
      <path d="M-20,136 Q-38,144 -46,160" fill="none" stroke="url(#mobFighterWCloth)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-46" cy="162" r="5" fill="url(#mobFighterWFace)"/>

      <!-- ===== 劍（下垂無力） ===== -->
      <line x1="-47" y1="164" x2="-42" y2="214" stroke="url(#mobFighterWSteel)" stroke-width="4" stroke-linecap="round"/>
      <line x1="-47" y1="164" x2="-42" y2="214" stroke="#eee" stroke-width="1.5" opacity="0.4"/>
      <line x1="-42" y1="214" x2="-41.5" y2="220" stroke="#ccc" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 劍格 -->
      <line x1="-52" y1="162" x2="-42" y2="160" stroke="#8a7a60" stroke-width="3" stroke-linecap="round"/>

      <!-- ===== 大頭（低頭） ===== -->
      <ellipse cx="0" cy="100" rx="34" ry="36" fill="url(#mobFighterWHair)"/>

      <!-- 臉 -->
      <path d="M-28,88 C-32,100 -30,116 -24,126 C-18,134 -6,138 4,136 C12,134 20,126 24,116 C28,104 26,90 20,82 C14,76 4,74 -6,76 C-16,78 -26,82 -28,88Z" fill="url(#mobFighterWFace)"/>

      <!-- 腮紅（傷痛） -->
      <ellipse cx="-20" cy="124" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- 短髮頂部 -->
      <path d="M-18,78 C-14,62 4,54 16,58 C24,62 28,72 24,82 C20,74 14,68 6,66 C0,64 -8,66 -16,72" fill="url(#mobFighterWHair)"/>

      <!-- 頭帶（微歪） -->
      <path d="M-30,80 C-26,70 -8,64 10,66 C20,68 28,74 26,80" fill="#2a3038" stroke="#1a2028" stroke-width="0.5" transform="rotate(-3,0,74)"/>
      <path d="M-32,80 C-32,78 -30,76 -26,78 L28,78 C30,78 30,82 28,82 L-30,82 C-32,82 -32,80 -32,80Z" fill="#2a3038" stroke="#1a2028" stroke-width="0.5" transform="rotate(-3,0,80)"/>
      <!-- 頭帶飄帶 -->
      <path d="M26,80 Q34,84 38,92" fill="none" stroke="#2a3038" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 瀏海 -->
      <path d="M-24,84 C-28,76 -30,80 -30,88 C-28,92 -24,90 -24,86" fill="url(#mobFighterWHair)"/>
      <path d="M-20,82 C-22,76 -26,78 -26,86 C-24,90 -20,88 -20,84" fill="url(#mobFighterWHair)" opacity="0.9"/>

      <!-- 側髮 -->
      <path d="M20,86 C26,80 28,88 26,96 C24,100 20,98 20,94" fill="url(#mobFighterWHair)"/>

      <!-- 耳朵 -->
      <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,110" fill="url(#mobFighterWFace)" stroke="#c09868" stroke-width="0.5"/>

      <!-- ===== 眼睛（左眼半瞇、右眼微睜） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-10" cy="108" rx="6.5" ry="4" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="4" ry="3" fill="#2a2418"/>
      <ellipse cx="-11.5" cy="108" rx="2.2" ry="1.8" fill="#1a1810"/>
      <circle cx="-13" cy="107" r="0.8" fill="#fff" opacity="0.5"/>

      <!-- 右眼（微瞇） -->
      <ellipse cx="8" cy="108" rx="6.5" ry="5" fill="#fff"/>
      <ellipse cx="7" cy="109" rx="4" ry="3.8" fill="#2a2418"/>
      <ellipse cx="6.5" cy="108" rx="2.2" ry="2.2" fill="#1a1810"/>
      <circle cx="5" cy="107" r="1.2" fill="#fff" opacity="0.65"/>

      <!-- 眉間皺紋 -->
      <path d="M-3,101 C-1,99 1,99 3,101" fill="none" stroke="#c09868" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 眉毛（皺眉忍痛） -->
      <path d="M-16,100 C-12,98 -8,99 -4,101" fill="none" stroke="#2a2420" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M10,101 C12,99 14,98 18,100" fill="none" stroke="#2a2420" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-16,116 C-18,120 -14,124" fill="none" stroke="#b8985c" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-10,130 C-4,131 4,131 8,130" fill="none" stroke="#805848" stroke-width="2" stroke-linecap="round"/>
      <path d="M-10,130 C-11,132 -12,133" fill="none" stroke="#805848" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴 -->
      <path d="M-22,86 C-23,90 -22,94 -21,96" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-21" cy="97" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
    </g>
  </g>
</svg>