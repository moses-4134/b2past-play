<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 嫪毐 — 吉卜力2頭身 面朝右（敵方）受擊（怒不可遏） -->
  <defs>
    <radialGradient id="laoaiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b080"/>
      <stop offset="100%" stop-color="#c09868"/>
    </radialGradient>
    <linearGradient id="laoaiArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#4a2a18"/>
    </linearGradient>
    <linearGradient id="laoaiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#221810"/>
    </linearGradient>
    <linearGradient id="laoaiBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <linearGradient id="laoaiHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a08838"/>
      <stop offset="100%" stop-color="#8a7030"/>
    </linearGradient>
    <linearGradient id="laoaiGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8b848"/>
      <stop offset="100%" stop-color="#c8a840"/>
    </linearGradient>
    <linearGradient id="laoaiShoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-2" cy="225" rx="36" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（微後退但穩住） ===== -->
      <!-- 後腿 -->
      <ellipse cx="16" cy="201" rx="12" ry="18" fill="url(#laoaiPants)" transform="rotate(-4,16,201)"/>
      <ellipse cx="14" cy="218" rx="14" ry="7.5" fill="#3a2018"/>
      <!-- 前腿 -->
      <ellipse cx="-16" cy="199" rx="13" ry="19" fill="url(#laoaiPants)" transform="rotate(4,-16,199)"/>
      <ellipse cx="-18" cy="218" rx="14" ry="7.5" fill="#3a2018"/>

      <!-- ===== 身體（微微後仰，受衝擊） ===== -->
      <ellipse cx="0" cy="156" rx="30" ry="34" fill="url(#laoaiArmor)" transform="rotate(4,0,156)"/>

      <!-- 金色鎧甲紋飾 -->
      <line x1="-20" y1="136" x2="-22" y2="182" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <line x1="20" y1="136" x2="22" y2="182" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <rect x="-16" y="148" width="28" height="18" rx="3" fill="none" stroke="#c8a840" stroke-width="1.2" opacity="0.5"/>

      <!-- 大肩甲 -->
      <ellipse cx="-34" cy="138" rx="14" ry="10" fill="url(#laoaiShoulder)" stroke="#c8a840" stroke-width="1"/>
      <ellipse cx="28" cy="138" rx="14" ry="10" fill="url(#laoaiShoulder)" stroke="#c8a840" stroke-width="1"/>

      <!-- 領口 -->
      <path d="M-12,134 L-4,150 L6,134" fill="none" stroke="#6a4828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 翡翠腰帶 -->
      <path d="M-28,182 Q0,191 30,182" fill="none" stroke="#4a2a18" stroke-width="7" stroke-linecap="round"/>
      <rect x="-8" y="179" width="14" height="12" rx="2" fill="#4a8848" stroke="#c8a840" stroke-width="1"/>

      <!-- ===== 畫面左側手臂（空手，撐住） ===== -->
      <path d="M-26,146 Q-42,154 -40,170" fill="none" stroke="url(#laoaiArmor)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-40" cy="172" r="7" fill="url(#laoaiFace)" opacity="0.85"/>

      <!-- ===== 大頭（微後仰咬牙切齒） ===== -->
      <!-- 頭盔底座 -->
      <ellipse cx="2" cy="92" rx="42" ry="44" fill="url(#laoaiHelmet)"/>

      <!-- 臉 -->
      <path d="M-30,86 C-34,98 -32,116 -26,126 C-20,134 -6,140 6,138 C16,136 26,128 30,118 C34,106 32,92 26,84 C20,78 8,74 -2,76 C-14,78 -28,82 -30,86Z" fill="url(#laoaiFace)"/>

      <!-- 鳳翼頭盔 -->
      <path d="M-32,80 C-26,60 -4,50 16,54 C32,58 40,72 36,84 C32,76 20,68 10,66 C0,64 -12,66 -22,74" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M-32,84 C-22,78 -6,74 16,76 C30,78 38,82 36,86" fill="none" stroke="#c8a840" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 鳳翼左翼 -->
      <path d="M-28,76 C-38,62 -44,52 -40,46 C-36,42 -32,48 -28,60" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <!-- 鳳翼右翼 -->
      <path d="M30,76 C38,62 44,52 40,46 C36,42 32,48 30,60" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <!-- 頭盔頂飾 -->
      <path d="M-2,58 L2,42 L6,58" fill="url(#laoaiGold)" stroke="#c8a840" stroke-width="0.8"/>

      <!-- 耳朵 -->
      <path d="M24,104 C28,100 30,106 28,114 C26,118 24,116 24,110" fill="url(#laoaiFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（怒火中燒，更兇惡） ===== -->
      <ellipse cx="-10" cy="110" rx="5.5" ry="5" fill="#fff"/>
      <ellipse cx="-11" cy="111" rx="3.8" ry="3.8" fill="#3a1810"/>
      <ellipse cx="-11.5" cy="110" rx="2.2" ry="2.3" fill="#1a0800"/>
      <circle cx="-13" cy="108.5" r="1" fill="#fff" opacity="0.6"/>

      <ellipse cx="8" cy="110" rx="5.5" ry="5" fill="#fff"/>
      <ellipse cx="7" cy="111" rx="3.8" ry="3.8" fill="#3a1810"/>
      <ellipse cx="6.5" cy="110" rx="2.2" ry="2.3" fill="#1a0800"/>
      <circle cx="5" cy="108.5" r="1" fill="#fff" opacity="0.6"/>

      <!-- 粗眉毛（極怒） -->
      <path d="M-16,102 C-12,99 -8,100 -5,103" fill="none" stroke="#2a1808" stroke-width="3.8" stroke-linecap="round"/>
      <path d="M12,103 C14,100 18,99 22,102" fill="none" stroke="#2a1808" stroke-width="3.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-16,118 C-18,124 -14,128" fill="none" stroke="#a08058" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙切齒，露齒） -->
      <path d="M-12,134 C-6,132 0,132 6,134" fill="none" stroke="#805040" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 牙齒 -->
      <line x1="-8" y1="133" x2="-8" y2="135" stroke="#e8e0d0" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-4" y1="132.5" x2="-4" y2="134.5" stroke="#e8e0d0" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="132.5" x2="0" y2="134.5" stroke="#e8e0d0" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="133" x2="4" y2="135" stroke="#e8e0d0" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 受擊痕跡 -->
      <line x1="-20" y1="146" x2="-14" y2="152" stroke="#aa3030" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      <line x1="-18" y1="148" x2="-12" y2="154" stroke="#aa3030" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

      <!-- ===== 畫面右側手臂（武器手，正x持刀） ===== -->
      <path d="M30,144 Q48,140 58,138" fill="none" stroke="url(#laoaiArmor)" stroke-width="15" stroke-linecap="round"/>
      <path d="M44,142 Q50,140 54,138" fill="none" stroke="#4a2a18" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 斬馬大刀（正x，保持持握） ===== -->
      <!-- 刀身 -->
      <path d="M56,132 L72,78 L76,68 L88,74 Q74,100 62,136 Z" fill="url(#laoaiBlade)" stroke="#666" stroke-width="0.5"/>
      <!-- 刀背厚線 -->
      <line x1="56" y1="132" x2="72" y2="78" stroke="#888" stroke-width="2.8" stroke-linecap="round"/>
      <!-- 刀尖斜角 -->
      <line x1="76" y1="68" x2="88" y2="74" stroke="#777" stroke-width="1.5"/>
      <!-- 刀刃亮線 -->
      <path d="M62,136 Q74,100 88,74" fill="none" stroke="#ddd" stroke-width="0.8" opacity="0.3"/>
      <!-- 刀護手 -->
      <line x1="62" y1="138" x2="50" y2="130" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
      <!-- 刀柄 -->
      <line x1="54" y1="134" x2="52" y2="146" stroke="#5a3a20" stroke-width="6" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="51" cy="149" r="4" fill="#c8a840"/>
      <!-- 握刀的手 -->
      <circle cx="55" cy="140" r="7" fill="url(#laoaiFace)"/>
    </g>
  </g>
</svg>