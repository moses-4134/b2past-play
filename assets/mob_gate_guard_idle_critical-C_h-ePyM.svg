<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 城門守卒 — 瀕死待機（HP <30%：半跪、撐槍、喘息） -->
  <defs>
    <radialGradient id="mobGateGuardCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c0a470"/>
    </radialGradient>
    <linearGradient id="mobGateGuardCArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a4a48"/>
      <stop offset="100%" stop-color="#3a3a38"/>
    </linearGradient>
    <linearGradient id="mobGateGuardCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="100%" stop-color="#2a2a28"/>
    </linearGradient>
    <linearGradient id="mobGateGuardCHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="mobGateGuardCSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <linearGradient id="mobGateGuardCShield" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6a5030"/>
      <stop offset="100%" stop-color="#4a3420"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="196" rx="30" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪） ===== -->
      <!-- 後腿（膝蓋著地） -->
      <ellipse cx="8" cy="178" rx="10" ry="12" fill="url(#mobGateGuardCPants)" transform="rotate(-20,8,178)"/>
      <ellipse cx="2" cy="190" rx="8" ry="5" fill="url(#mobGateGuardCPants)"/>
      <ellipse cx="0" cy="194" rx="9" ry="5" fill="#2a2820"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-12" cy="174" rx="10" ry="16" fill="url(#mobGateGuardCPants)" transform="rotate(12,-12,174)"/>
      <ellipse cx="-16" cy="194" rx="11" ry="6" fill="#2a2820"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="146" rx="25" ry="26" fill="url(#mobGateGuardCArmor)" transform="rotate(-14,-4,146)"/>

      <!-- 甲片紋理 -->
      <path d="M-12,138 L-8,148" fill="none" stroke="#2a2a28" stroke-width="0.8" opacity="0.4"/>

      <!-- 領口 -->
      <path d="M-14,128 L-8,138 L0,128" fill="none" stroke="#3a3a38" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-26,164 Q-4,172 18,166" fill="none" stroke="#3a3020" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 盾牌（掉落在地） ===== -->
      <ellipse cx="-44" cy="196" rx="14" ry="8" fill="url(#mobGateGuardCShield)" stroke="#3a2818" stroke-width="1" transform="rotate(-15,-44,196)"/>
      <circle cx="-44" cy="196" r="3" fill="#806040" opacity="0.4"/>

      <!-- ===== 右手臂（正x，撐在膝蓋上） ===== -->
      <path d="M16,138 Q24,152 16,170" fill="none" stroke="url(#mobGateGuardCArmor)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
      <circle cx="15" cy="172" r="5" fill="url(#mobGateGuardCFace)" opacity="0.85"/>

      <!-- ===== 左手臂（負x，撐槍） ===== -->
      <path d="M-18,136 Q-36,144 -42,156" fill="none" stroke="url(#mobGateGuardCArmor)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-42" cy="158" r="4.5" fill="url(#mobGateGuardCFace)"/>

      <!-- ===== 槍（插地當支撐） ===== -->
      <line x1="-44" y1="100" x2="-46" y2="198" stroke="#5a4028" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 槍頭 -->
      <path d="M-45.4,90 L-42.6,100.4 L-48.2,99.6 Z" fill="url(#mobGateGuardCSteel)" stroke="#888" stroke-width="0.5"/>
      <!-- 槍插入地面效果 -->
      <ellipse cx="-46" cy="198" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>

      <!-- ===== 大頭（低垂喘息） ===== -->
      <!-- 後腦髮 -->
      <ellipse cx="-2" cy="94" rx="34" ry="36" fill="url(#mobGateGuardCHair)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-28,90 C-32,100 -30,114 -24,124 C-18,132 -8,136 0,134 C8,132 14,126 18,116 C22,104 20,90 14,82 C8,76 0,74 -6,76 C-18,78 -26,84 -28,90Z" fill="url(#mobGateGuardCFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-18,80 C-14,62 2,54 14,58 C22,62 26,74 22,84 C18,76 12,70 4,68 C-2,66 -10,68 -16,74" fill="url(#mobGateGuardCHair)"/>

      <!-- 頭盔（歪斜） -->
      <path d="M-30,82 C-26,68 -10,60 6,62 C18,64 26,72 24,82" fill="#4a4a48" stroke="#3a3a38" stroke-width="0.5" transform="rotate(-5,-2,72)"/>
      <path d="M-32,82 C-32,80 -30,78 -26,80 L26,80 C28,80 28,84 26,84 L-30,84 C-32,84 -32,82 -32,82Z" fill="#4a4a48" stroke="#3a3a38" stroke-width="0.5" transform="rotate(-5,-2,82)"/>
      <line x1="-2" y1="60" x2="-3" y2="52" stroke="#4a4a48" stroke-width="2" stroke-linecap="round"/>

      <!-- 瀏海（散亂） -->
      <path d="M-24,84 C-28,78 -30,82 -30,88 C-28,92 -24,90 -24,86" fill="url(#mobGateGuardCHair)"/>
      <path d="M-30,92 C-32,98 -30,102" fill="none" stroke="url(#mobGateGuardCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 側髮 -->
      <path d="M16,86 C22,80 24,88 22,96 C20,100 16,98 16,94" fill="url(#mobGateGuardCHair)"/>

      <!-- 耳朵 -->
      <path d="M16,104 C20,100 22,106 20,112 C18,116 16,114 16,110" fill="url(#mobGateGuardCFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- 腮紅（傷痛明顯） -->
      <ellipse cx="-20" cy="122" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

      <!-- ===== 眼睛（雙眼幾乎閉上） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-10" cy="108" rx="6" ry="2" fill="#fff"/>
      <ellipse cx="-11" cy="108.5" rx="3.5" ry="1.5" fill="#2a2820"/>
      <ellipse cx="-11.5" cy="108" rx="2" ry="1" fill="#1a1810"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="108" rx="6" ry="2.5" fill="#fff"/>
      <ellipse cx="5" cy="108.5" rx="3.5" ry="2" fill="#2a2820"/>
      <ellipse cx="4.5" cy="108" rx="2" ry="1.2" fill="#1a1810"/>
      <circle cx="3" cy="107" r="0.6" fill="#fff" opacity="0.5"/>

      <!-- 眉間皺紋 -->
      <path d="M-3,101 C-1,99 1,99 3,101" fill="none" stroke="#b09060" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-4,103 C-2,101.5 1,101.5 3,103" fill="none" stroke="#b09060" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 鼻子 -->
      <path d="M-16,116 C-18,120 -14,124" fill="none" stroke="#a08858" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-4" cy="129" rx="5" ry="4.5" fill="#703030"/>
      <path d="M-8,127 L0,127" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴（多顆） -->
      <path d="M-22,88 C-23,92 -22,98 -21,101" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-21" cy="102" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M20,92 C21,96 20,100" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="20" cy="101" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <ellipse cx="-6" cy="78" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>
