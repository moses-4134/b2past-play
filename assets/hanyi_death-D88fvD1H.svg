<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 韓奕 趙國密使 — 吉卜力2頭身 面朝右（敵方）死亡：倒地 -->
  <defs>
    <radialGradient id="hanyiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8dcd0"/>
      <stop offset="100%" stop-color="#d8c8b8"/>
    </radialGradient>
    <linearGradient id="hanyiRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#101830"/>
    </linearGradient>
    <linearGradient id="hanyiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="hanyiBlade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0c8d0"/>
      <stop offset="100%" stop-color="#808890"/>
    </linearGradient>
    <linearGradient id="hanyiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>
  </defs>

  <!-- 死亡：不翻轉，特殊transform -->
  <g transform="translate(78,10)">
    <g transform="translate(130, 10) rotate(90,-4,176)">
      <!-- 陰影（倒地後較長） -->
      <ellipse cx="-4" cy="228" rx="32" ry="5" fill="#000" opacity="0.08"/>

      <!-- ===== 腿（癱軟） ===== -->
      <!-- 後腿 -->
      <ellipse cx="10" cy="196" rx="9" ry="18" fill="url(#hanyiPants)" transform="rotate(10,10,196)"/>
      <ellipse cx="12" cy="218" rx="10" ry="6" fill="#0e1828"/>
      <!-- 前腿 -->
      <ellipse cx="-10" cy="194" rx="10" ry="19" fill="url(#hanyiPants)" transform="rotate(-8,-10,194)"/>
      <ellipse cx="-14" cy="218" rx="11" ry="6" fill="#0e1828"/>

      <!-- ===== 身體（倒地） ===== -->
      <ellipse cx="-2" cy="162" rx="24" ry="28" fill="url(#hanyiRobe)"/>

      <!-- 長袍暗紋 -->
      <path d="M-12,150 L-6,172" fill="none" stroke="#2a3a5a" stroke-width="0.8" opacity="0.2"/>
      <path d="M2,147 L8,170" fill="none" stroke="#2a3a5a" stroke-width="0.8" opacity="0.2"/>

      <!-- 內袍領口 -->
      <path d="M-12,140 L-4,155 L6,140" fill="none" stroke="#3a4a6a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶（歪斜） -->
      <path d="M-24,182 Q-2,190 22,182" fill="none" stroke="#2a3a5a" stroke-width="5" stroke-linecap="round"/>
      <rect x="-6" y="181" width="7" height="7" rx="1" fill="#b0b8c0" stroke="#8090a0" stroke-width="0.5" opacity="0.7"/>

      <!-- 文書袋（散落） -->
      <rect x="18" y="184" width="8" height="10" rx="2" fill="#2a1a10" stroke="#1a0a00" stroke-width="0.5" opacity="0.5" transform="rotate(25,22,189)"/>

      <!-- ===== 大頭（倒地失神） ===== -->
      <!-- 後腦 -->
      <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#hanyiHair)"/>

      <!-- 臉 -->
      <path d="M-30,88 C-34,100 -32,116 -26,128 C-20,136 -8,140 2,138 C12,136 22,128 26,116 C30,104 28,92 22,84 C16,78 4,74 -4,76 C-18,78 -28,82 -30,88Z" fill="url(#hanyiFace)"/>

      <!-- 頭髮頂部（散亂） -->
      <path d="M-20,78 C-16,58 0,50 14,54 C26,58 30,70 26,82 C22,74 14,68 6,66 C-2,64 -12,66 -16,72" fill="url(#hanyiHair)"/>

      <!-- 髮髻（散開） -->
      <ellipse cx="2" cy="54" rx="10" ry="8" fill="url(#hanyiHair)" transform="rotate(15,2,54)"/>
      <path d="M-6,54 C-4,46 8,46 10,54" fill="url(#hanyiHair)" opacity="0.8"/>
      <!-- 散落的髮絲 -->
      <path d="M-8,56 Q-14,50 -18,54" fill="none" stroke="#1a1a20" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <path d="M10,52 Q16,46 20,50" fill="none" stroke="#1a1a20" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

      <!-- 銀髮簪（掉落，在頭旁邊） -->
      <line x1="-20" y1="72" x2="-8" y2="68" stroke="#b0b8c0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <circle cx="-20" cy="72" r="2" fill="#c0c8d0" stroke="#8090a0" stroke-width="0.5" opacity="0.6"/>

      <!-- 前額瀏海（亂） -->
      <path d="M-28,86 C-30,78 -28,74 -24,80" fill="url(#hanyiHair)"/>
      <path d="M-24,82 C-26,74 -22,70 -18,78" fill="url(#hanyiHair)" opacity="0.9"/>
      <path d="M-32,90 C-36,82 -34,78 -30,84" fill="url(#hanyiHair)" opacity="0.7"/>

      <!-- 側髮 -->
      <path d="M22,84 C26,80 28,86 26,94 C24,100 22,98 22,92" fill="url(#hanyiHair)"/>

      <!-- 耳朵 -->
      <path d="M20,102 C24,98 26,104 24,112 C22,116 20,114 20,108" fill="url(#hanyiFace)" stroke="#c8b8a8" stroke-width="0.5"/>

      <!-- ===== 眼睛（閉眼失神） ===== -->
      <!-- 左眼（閉合） -->
      <path d="M-17,106 C-14,108 -10,108 -7,106" fill="none" stroke="#1a1a20" stroke-width="1.8" stroke-linecap="round"/>
      <!-- 右眼（閉合） -->
      <path d="M1,106 C4,108 8,108 11,106" fill="none" stroke="#1a1a20" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 眉毛（鬆弛） -->
      <path d="M-18,101 C-14,100 -10,101 -7,103" fill="none" stroke="#1a1a20" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M10,103 C12,101 16,100 20,101" fill="none" stroke="#1a1a20" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,116 C-16,120 -14,124" fill="none" stroke="#c8b8a0" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（微張，失神） -->
      <path d="M-10,130 C-6,132 0,132 4,130" fill="none" stroke="#8a6860" stroke-width="1.5" stroke-linecap="round"/>

      <!-- ===== 手臂（癱軟攤開） ===== -->
      <!-- 左臂（負x，攤在地上） -->
      <path d="M-20,150 Q-40,158 -46,170" fill="none" stroke="url(#hanyiRobe)" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
      <circle cx="-46" cy="172" r="5" fill="url(#hanyiFace)" opacity="0.7"/>

      <!-- 右臂（正x，無力攤開） -->
      <path d="M22,150 Q40,160 44,174" fill="none" stroke="url(#hanyiRobe)" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
      <circle cx="44" cy="176" r="5" fill="url(#hanyiFace)" opacity="0.7"/>

      <!-- ===== 劍（掉落在地） ===== -->
      <!-- 劍刃（直線，~50.6px，掉在旁邊） -->
      <line x1="54" y1="190" x2="104" y2="195" stroke="url(#hanyiBlade)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <!-- 劍刃亮線 -->
      <line x1="54" y1="190" x2="104" y2="195" stroke="#e0e8f0" stroke-width="0.8" opacity="0.25"/>
      <!-- 劍護手 -->
      <line x1="50" y1="186" x2="54" y2="194" stroke="#b0b8c0" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <!-- 劍柄 -->
      <line x1="46" y1="188" x2="52" y2="192" stroke="#3a2a1a" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <!-- 柄底 -->
      <circle cx="45" cy="187" r="2.5" fill="#b0b8c0" opacity="0.7"/>
    </g>
  </g>
</svg>