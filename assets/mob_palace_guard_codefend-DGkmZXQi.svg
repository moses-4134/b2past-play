<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 宮廷侍衛 — 吉卜力2頭身 面朝右（敵方）協防（挺身護人） -->
  <defs>
    <radialGradient id="mobPalaceGuardFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </radialGradient>
    <linearGradient id="mobPalaceGuardArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#6a5a30"/>
      <stop offset="100%" stop-color="#4a3a20"/>
    </linearGradient>
    <linearGradient id="mobPalaceGuardPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a20"/>
      <stop offset="100%" stop-color="#2e2414"/>
    </linearGradient>
    <linearGradient id="mobPalaceGuardHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="mobPalaceGuardShield" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b88830"/>
      <stop offset="100%" stop-color="#785018"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="216" rx="30" ry="5" fill="#000" opacity="0.1"/>

      <!-- 腿（挺立，比防禦高8px） -->
      <ellipse cx="10" cy="178" rx="10" ry="18" fill="url(#mobPalaceGuardPants)" transform="rotate(-3,10,178)"/>
      <ellipse cx="8" cy="205" rx="12" ry="7" fill="#2e2010"/>
      <ellipse cx="-12" cy="176" rx="11" ry="19" fill="url(#mobPalaceGuardPants)" transform="rotate(6,-12,176)"/>
      <ellipse cx="-16" cy="205" rx="13" ry="7" fill="#2e2010"/>

      <!-- 身體（挺立微前傾） -->
      <ellipse cx="-2" cy="136" rx="25" ry="27" fill="url(#mobPalaceGuardArmor)" transform="rotate(-6,-2,148)"/>

      <!-- 領口 V -->
      <path d="M-12,126 L-4,138 L4,126" fill="none" stroke="#7a6a38" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-24,168 Q-2,175 24,168" fill="none" stroke="#4a3a20" stroke-width="5" stroke-linecap="round"/>
      <rect x="-7" y="166" width="8" height="8" rx="1" fill="#a08830" stroke="#806820" stroke-width="0.5"/>

      <!-- 畫面左側手臂（角色左手，空手向負x伸出護人） -->
      <path d="M-22,134 Q-36,140 -48,148 Q-56,154 -60,162" fill="none" stroke="url(#mobPalaceGuardArmor)" stroke-width="10" stroke-linecap="round"/>
      <!-- 手掌（張開護人手勢） -->
      <g transform="translate(-60,162)">
        <circle cx="0" cy="0" r="5" fill="url(#mobPalaceGuardFace)"/>
        <line x1="-2" y1="-4" x2="-5" y2="-9" stroke="url(#mobPalaceGuardFace)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-4" y1="-2" x2="-8" y2="-6" stroke="url(#mobPalaceGuardFace)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-5" y1="0" x2="-9" y2="-2" stroke="url(#mobPalaceGuardFace)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-4" y1="3" x2="-8" y2="2" stroke="url(#mobPalaceGuardFace)" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- 盾牌 -->
      <ellipse cx="-64" cy="160" rx="14" ry="16" fill="url(#mobPalaceGuardShield)" stroke="#3a2818" stroke-width="1"/>
      <line x1="-64" y1="144" x2="-64" y2="176" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <line x1="-76" y1="160" x2="-52" y2="160" stroke="#806040" stroke-width="1" opacity="0.5"/>
      <circle cx="-64" cy="160" r="3.5" fill="#806040" opacity="0.4"/>

      <!-- ===== 大頭 ===== -->
      <!-- 後腦髮量 -->
      <ellipse cx="0" cy="90" rx="35" ry="37" fill="url(#mobPalaceGuardHair)"/>

      <!-- 臉 -->
      <path d="M-24,82 C-28,92 -26,106 -20,116 C-14,124 -4,128 4,126 C12,124 18,116 22,106 C26,94 24,82 18,74 C12,68 4,66 -2,68 C-12,70 -22,76 -24,82Z" fill="url(#mobPalaceGuardFace)"/>

      <!-- 頭髮頂部 -->
      <path d="M-16,72 C-12,54 4,46 16,50 C24,56 28,66 24,76 C20,68 14,62 6,60 C0,58 -8,60 -14,66" fill="url(#mobPalaceGuardHair)"/>
      <!-- 瀏海 -->
      <path d="M-24,82 C-28,70 -30,74 -30,84 C-28,88 -24,88 -24,84" fill="url(#mobPalaceGuardHair)"/>
      <path d="M-20,76 C-24,64 -26,68 -26,78 C-24,82 -20,82 -20,78" fill="#2a1a10"/>

      <!-- 宮廷衛兵冠 -->
      <path d="M-22,66 Q0,52 22,66 Q20,60 0,48 Q-20,60 -22,66Z" fill="#a08830" stroke="#806820" stroke-width="0.8"/>
      <circle cx="0" cy="50" r="3" fill="#c0a040" stroke="#a08830" stroke-width="0.5"/>

      <!-- 側髮 -->
      <path d="M18,78 C24,72 26,80 24,88 C22,92 18,90 18,86" fill="url(#mobPalaceGuardHair)"/>
      <!-- 耳朵 -->
      <path d="M16,94 C20,90 22,96 20,102 C18,106 16,104 16,100" fill="url(#mobPalaceGuardFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- 左眼 -->
      <ellipse cx="-10" cy="100" rx="6.5" ry="6" fill="#fff"/>
      <ellipse cx="-11" cy="101" rx="4" ry="4.2" fill="#2a2418"/>
      <ellipse cx="-11.5" cy="100" rx="2.2" ry="2.5" fill="#141208"/>
      <circle cx="-13" cy="98.5" r="1" fill="#fff" opacity="0.6"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="100" rx="6.5" ry="6" fill="#fff"/>
      <ellipse cx="5" cy="101" rx="4" ry="4.2" fill="#2a2418"/>
      <ellipse cx="4.5" cy="100" rx="2.2" ry="2.5" fill="#141208"/>
      <circle cx="3" cy="98.5" r="1" fill="#fff" opacity="0.6"/>

      <!-- 眉毛（堅毅） -->
      <path d="M-14,93 C-10,91 -8,93 -6,95" fill="none" stroke="#2a1a10" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,95 C10,93 12,91 16,93" fill="none" stroke="#2a1a10" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-14,108 C-16,112 -12,116" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（緊閉，堅毅保護） -->
      <path d="M-10,120 C-6,119 0,119 4,120" fill="none" stroke="#704840" stroke-width="2" stroke-linecap="round"/>

      <!-- 畫面右側手臂（角色右手，持槍向正x伸出擋敵） -->
      <path d="M22,134 Q36,126 44,120" fill="none" stroke="url(#mobPalaceGuardArmor)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="44" cy="118" r="5.5" fill="url(#mobPalaceGuardFace)"/>

      <!-- 槍（向正x方向伸出擋格） -->
      <line x1="46" y1="116" x2="110" y2="102" stroke="#5a4028" stroke-width="4" stroke-linecap="round"/>
      <!-- 三角槍頭 -->
      <polygon points="114,99 110,105 118,105" fill="#aaa" stroke="#888" stroke-width="0.5"/>
      <!-- 槍尾 -->
      <circle cx="46" cy="118" r="2" fill="#5a4028"/>
    </g>
  </g>
</svg>
