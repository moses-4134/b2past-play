<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 嫪毐 — 吉卜力2頭身 面朝右（敵方）防禦（橫刀擋） -->
  <defs>
    <radialGradient id="laoaiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b080"/>
      <stop offset="100%" stop-color="#c09868"/>
    </radialGradient>
    <linearGradient id="laoaiArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#4a2a18"/>
    </linearGradient>
    <linearGradient id="laoaiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#221810"/>
    </linearGradient>
    <linearGradient id="laoaiBlade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#999"/>
      <stop offset="100%" stop-color="#bbb"/>
    </linearGradient>
    <linearGradient id="laoaiHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a08838"/>
      <stop offset="100%" stop-color="#8a7030"/>
    </linearGradient>
    <linearGradient id="laoaiGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8b848"/>
      <stop offset="100%" stop-color="#c8a840"/>
    </linearGradient>
    <linearGradient id="laoaiShoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="36" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（深蹲防禦） ===== -->
      <!-- 後腿 -->
      <ellipse cx="16" cy="202" rx="12" ry="17" fill="url(#laoaiPants)" transform="rotate(-8,16,202)"/>
      <ellipse cx="14" cy="218" rx="14" ry="7.5" fill="#3a2018"/>
      <!-- 前腿 -->
      <ellipse cx="-18" cy="200" rx="13" ry="18" fill="url(#laoaiPants)" transform="rotate(8,-18,200)"/>
      <ellipse cx="-20" cy="218" rx="14" ry="7.5" fill="#3a2018"/>

      <!-- ===== 身體（微蹲重心下壓） ===== -->
      <ellipse cx="-2" cy="158" rx="30" ry="34" fill="url(#laoaiArmor)" transform="rotate(-2,-2,158)"/>

      <!-- 金色鎧甲紋飾 -->
      <line x1="-22" y1="138" x2="-24" y2="184" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <line x1="18" y1="138" x2="20" y2="184" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <rect x="-18" y="150" width="28" height="18" rx="3" fill="none" stroke="#c8a840" stroke-width="1.2" opacity="0.5"/>

      <!-- 大肩甲 -->
      <ellipse cx="-36" cy="140" rx="14" ry="10" fill="url(#laoaiShoulder)" stroke="#c8a840" stroke-width="1"/>
      <ellipse cx="26" cy="140" rx="14" ry="10" fill="url(#laoaiShoulder)" stroke="#c8a840" stroke-width="1"/>

      <!-- 領口 -->
      <path d="M-14,136 L-6,152 L4,136" fill="none" stroke="#6a4828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 翡翠腰帶 -->
      <path d="M-30,184 Q-2,193 28,184" fill="none" stroke="#4a2a18" stroke-width="7" stroke-linecap="round"/>
      <rect x="-10" y="181" width="14" height="12" rx="2" fill="#4a8848" stroke="#c8a840" stroke-width="1"/>

      <!-- ===== 畫面左側手臂（輔助手，前推） ===== -->
      <path d="M-28,148 Q-44,140 -48,136" fill="none" stroke="url(#laoaiArmor)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-48" cy="138" r="7" fill="url(#laoaiFace)" opacity="0.85"/>

      <!-- ===== 大頭（低頭咬牙） ===== -->
      <!-- 頭盔底座 -->
      <ellipse cx="0" cy="94" rx="42" ry="44" fill="url(#laoaiHelmet)"/>

      <!-- 臉 -->
      <path d="M-32,88 C-36,100 -34,118 -28,128 C-22,136 -8,142 4,140 C14,138 24,128 28,118 C32,106 30,92 24,84 C18,78 6,74 -4,76 C-16,78 -30,82 -32,88Z" fill="url(#laoaiFace)"/>

      <!-- 鳳翼頭盔 -->
      <path d="M-34,82 C-28,62 -6,52 14,56 C30,60 38,74 34,86 C30,78 18,70 8,68 C-2,66 -14,68 -24,76" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M-34,86 C-24,80 -8,76 14,78 C28,80 36,84 34,88" fill="none" stroke="#c8a840" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 鳳翼左翼 -->
      <path d="M-30,78 C-40,64 -46,54 -42,48 C-38,44 -34,50 -30,62" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <!-- 鳳翼右翼 -->
      <path d="M28,78 C36,64 42,54 38,48 C34,44 30,50 28,62" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <!-- 頭盔頂飾 -->
      <path d="M-4,60 L0,44 L4,60" fill="url(#laoaiGold)" stroke="#c8a840" stroke-width="0.8"/>

      <!-- 耳朵 -->
      <path d="M22,106 C26,102 28,108 26,116 C24,120 22,118 22,112" fill="url(#laoaiFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（不耐煩斜眼） ===== -->
      <ellipse cx="-12" cy="112" rx="5.5" ry="4" fill="#fff"/>
      <ellipse cx="-13" cy="112.5" rx="3.5" ry="3.2" fill="#3a1810"/>
      <ellipse cx="-13.5" cy="112" rx="2" ry="2" fill="#1a0800"/>
      <circle cx="-15" cy="110.5" r="1" fill="#fff" opacity="0.6"/>

      <ellipse cx="6" cy="112" rx="5.5" ry="4" fill="#fff"/>
      <ellipse cx="5" cy="112.5" rx="3.5" ry="3.2" fill="#3a1810"/>
      <ellipse cx="4.5" cy="112" rx="2" ry="2" fill="#1a0800"/>
      <circle cx="3" cy="110.5" r="1" fill="#fff" opacity="0.6"/>

      <!-- 粗眉毛（煩躁皺眉） -->
      <path d="M-18,104 C-14,102 -10,103 -7,106" fill="none" stroke="#2a1808" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M10,106 C12,103 16,102 20,104" fill="none" stroke="#2a1808" stroke-width="3.5" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-18,118 C-20,124 -16,128" fill="none" stroke="#a08058" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙不耐） -->
      <path d="M-14,136 C-8,134 -2,134 4,136" fill="none" stroke="#805040" stroke-width="2.2" stroke-linecap="round"/>

      <!-- ===== 畫面右側手臂（武器手，橫刀正x防禦） ===== -->
      <path d="M28,146 Q48,138 58,134" fill="none" stroke="url(#laoaiArmor)" stroke-width="15" stroke-linecap="round"/>
      <path d="M44,140 Q50,136 54,134" fill="none" stroke="#4a2a18" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 斬馬大刀（正x，橫刀擋格） ===== -->
      <!-- 刀身（橫向擋格） -->
      <path d="M56,130 L96,108 L102,104 L106,116 Q82,124 62,134 Z" fill="url(#laoaiBlade)" stroke="#666" stroke-width="0.5"/>
      <!-- 刀背厚線 -->
      <line x1="56" y1="130" x2="96" y2="108" stroke="#888" stroke-width="2.8" stroke-linecap="round"/>
      <!-- 刀尖斜角 -->
      <line x1="102" y1="104" x2="106" y2="116" stroke="#777" stroke-width="1.5"/>
      <!-- 刀刃亮線 -->
      <path d="M62,134 Q82,124 106,116" fill="none" stroke="#ddd" stroke-width="0.8" opacity="0.3"/>
      <!-- 刀護手 -->
      <line x1="62" y1="136" x2="50" y2="128" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
      <!-- 刀柄 -->
      <line x1="54" y1="132" x2="52" y2="144" stroke="#5a3a20" stroke-width="6" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="51" cy="147" r="4" fill="#c8a840"/>
      <!-- 握刀的手 -->
      <circle cx="55" cy="136" r="7" fill="url(#laoaiFace)"/>
    </g>
  </g>
</svg>