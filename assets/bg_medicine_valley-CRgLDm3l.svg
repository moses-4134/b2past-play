<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 深山藥谷 — 吉卜力風格：幽碧深谷、雲霧流泉、藥草叢生、崖徑棧道 地平線 y=200 -->
  <defs>
    <linearGradient id="mvSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bcd8c8"/>
      <stop offset="60%" stop-color="#d8e8d0"/>
      <stop offset="100%" stop-color="#e8f0d8"/>
    </linearGradient>
    <linearGradient id="mvFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a9a86"/>
      <stop offset="100%" stop-color="#5a7a66"/>
    </linearGradient>
    <linearGradient id="mvCliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6450"/>
      <stop offset="100%" stop-color="#2e4636"/>
    </linearGradient>
    <linearGradient id="mvGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3e5840"/>
      <stop offset="100%" stop-color="#26381e"/>
    </linearGradient>
    <linearGradient id="mvStream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8d8d0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#88b0a8" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#mvSky)"/>
  <!-- 雲霧橫繚 -->
  <g opacity="0.55" fill="#eef4e6">
    <ellipse cx="220" cy="70" rx="150" ry="22"/><ellipse cx="620" cy="55" rx="170" ry="18"/><ellipse cx="820" cy="120" rx="130" ry="20"/>
  </g>

  <!-- 遠峰層疊 -->
  <path d="M0,200 L0,90 L150,130 L280,60 L420,120 L540,70 L700,130 L840,80 L960,120 L960,200 Z" fill="url(#mvFar)" opacity="0.7"/>
  <g opacity="0.4" fill="#eef4e6"><ellipse cx="300" cy="150" rx="120" ry="16"/><ellipse cx="700" cy="160" rx="140" ry="14"/></g>

  <!-- 兩側夾谷崖壁 -->
  <path d="M0,200 L0,40 L110,90 L170,200 Z" fill="url(#mvCliff)"/>
  <path d="M960,200 L960,40 L850,90 L790,200 Z" fill="url(#mvCliff)"/>
  <!-- 崖上垂藤與藥草 -->
  <g stroke="#5a8850" stroke-width="3" opacity="0.6" fill="none">
    <path d="M60,60 q6,40 -4,80 q8,30 0,56"/><path d="M120,90 q-4,36 4,70"/>
    <path d="M900,60 q-6,40 4,80 q-8,30 0,56"/><path d="M840,90 q4,36 -4,70"/>
  </g>
  <g fill="#c8d860" opacity="0.5"><circle cx="58" cy="150" r="5"/><circle cx="120" cy="170" r="4"/><circle cx="902" cy="150" r="5"/><circle cx="840" cy="170" r="4"/></g>

  <!-- 谷中流泉瀑布 -->
  <path d="M470,110 L466,200 L494,200 L490,110 Z" fill="url(#mvStream)" opacity="0.7"/>
  <g stroke="#e0f0ec" stroke-width="1" opacity="0.5"><line x1="474" y1="120" x2="472" y2="196"/><line x1="484" y1="120" x2="486" y2="196"/></g>
  <ellipse cx="480" cy="204" rx="40" ry="10" fill="#c8e0d8" opacity="0.5"/>

  <!-- 谷底地面 -->
  <rect x="0" y="200" width="960" height="340" fill="url(#mvGround)"/>
  <!-- 蜿蜒溪流 -->
  <path d="M440,200 Q400,300 300,380 Q220,450 160,540 L360,540 Q440,440 500,360 Q540,280 520,200 Z" fill="url(#mvStream)" opacity="0.35"/>
  <g stroke="#c8e0d8" stroke-width="1" opacity="0.3" fill="none">
    <path d="M460,230 Q420,320 340,400"/><path d="M500,240 Q470,320 420,400"/>
  </g>

  <!-- 藥草叢（前景） -->
  <g>
    <g fill="#4a7040" opacity="0.85">
      <ellipse cx="120" cy="430" rx="60" ry="30"/><ellipse cx="820" cy="450" rx="70" ry="32"/><ellipse cx="640" cy="490" rx="80" ry="34"/>
    </g>
    <!-- 開花藥草 -->
    <g fill="#e0c850" opacity="0.7"><circle cx="100" cy="410" r="5"/><circle cx="140" cy="418" r="4"/><circle cx="800" cy="432" r="5"/><circle cx="850" cy="440" r="4"/><circle cx="620" cy="472" r="5"/><circle cx="670" cy="480" r="4"/></g>
    <g fill="#d06868" opacity="0.6"><circle cx="118" cy="404" r="4"/><circle cx="828" cy="428" r="4"/><circle cx="648" cy="468" r="4"/></g>
  </g>
  <!-- 棧道崖徑（右下斜入） -->
  <g fill="#6a5236" opacity="0.7">
    <rect x="720" y="300" width="180" height="10" rx="2" transform="rotate(12 810 305)"/>
    <rect x="740" y="340" width="180" height="10" rx="2" transform="rotate(12 830 345)"/>
  </g>
  <line x1="0" y1="200" x2="960" y2="200" stroke="#243a1e" stroke-width="3" opacity="0.5"/>

  <!-- 靈氣塵光 -->
  <circle cx="360" cy="150" r="1.5" fill="#f0f8d8" opacity="0.5"/>
  <circle cx="560" cy="170" r="1.2" fill="#f0f8d8" opacity="0.4"/>
  <circle cx="480" cy="120" r="1" fill="#f0f8d8" opacity="0.4"/>
  <circle cx="280" cy="240" r="1.3" fill="#e0f0c8" opacity="0.35"/>
  <circle cx="700" cy="230" r="1.4" fill="#e0f0c8" opacity="0.3"/>
  <rect width="960" height="540" fill="#a0c060" opacity="0.04"/>
</svg>
