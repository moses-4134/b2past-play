<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 城門 — 吉卜力風格：巨大城門洞、城牆、石板路 地平線 y=180（33%） -->
  <defs>
    <!-- 天空漸層 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a870"/>
      <stop offset="40%" stop-color="#e0c898"/>
      <stop offset="100%" stop-color="#f0dcc0"/>
    </linearGradient>
    <!-- 城牆石材 -->
    <linearGradient id="wallStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7a68"/>
      <stop offset="100%" stop-color="#6a5a48"/>
    </linearGradient>
    <!-- 城門洞陰影 -->
    <linearGradient id="gateShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </linearGradient>
    <!-- 石板路 -->
    <linearGradient id="stoneRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a8a78"/>
      <stop offset="100%" stop-color="#7a6a58"/>
    </linearGradient>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- 雲朵 -->
  <g opacity="0.5">
    <ellipse cx="200" cy="50" rx="70" ry="25" fill="#f0e0c8"/>
    <ellipse cx="160" cy="48" rx="45" ry="20" fill="#f0e0c8"/>
    <ellipse cx="240" cy="52" rx="50" ry="18" fill="#f0e0c8"/>
  </g>
  <g opacity="0.4">
    <ellipse cx="750" cy="35" rx="80" ry="22" fill="#f0e0c8"/>
    <ellipse cx="700" cy="33" rx="50" ry="18" fill="#f0e0c8"/>
  </g>

  <!-- ===== 城牆主體 ===== -->
  <!-- 左城牆 -->
  <rect x="0" y="40" width="320" height="140" fill="url(#wallStone)"/>
  <!-- 右城牆 -->
  <rect x="640" y="40" width="320" height="140" fill="url(#wallStone)"/>

  <!-- 城牆石塊紋理 -->
  <g stroke="#5a4a38" stroke-width="0.8" opacity="0.3">
    <!-- 左牆 -->
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="110" x2="320" y2="110"/>
    <line x1="0" y1="140" x2="320" y2="140"/>
    <line x1="0" y1="165" x2="320" y2="165"/>
    <line x1="80" y1="40" x2="80" y2="180"/>
    <line x1="160" y1="40" x2="160" y2="180"/>
    <line x1="240" y1="40" x2="240" y2="180"/>
    <!-- 右牆 -->
    <line x1="640" y1="80" x2="960" y2="80"/>
    <line x1="640" y1="110" x2="960" y2="110"/>
    <line x1="640" y1="140" x2="960" y2="140"/>
    <line x1="640" y1="165" x2="960" y2="165"/>
    <line x1="720" y1="40" x2="720" y2="180"/>
    <line x1="800" y1="40" x2="800" y2="180"/>
    <line x1="880" y1="40" x2="880" y2="180"/>
  </g>

  <!-- 城牆頂部城垛 -->
  <g fill="#7a6a58">
    <rect x="0" y="30" width="40" height="20" rx="2"/>
    <rect x="55" y="30" width="40" height="20" rx="2"/>
    <rect x="110" y="30" width="40" height="20" rx="2"/>
    <rect x="165" y="30" width="40" height="20" rx="2"/>
    <rect x="220" y="30" width="40" height="20" rx="2"/>
    <rect x="275" y="30" width="45" height="20" rx="2"/>
    <rect x="640" y="30" width="45" height="20" rx="2"/>
    <rect x="700" y="30" width="40" height="20" rx="2"/>
    <rect x="755" y="30" width="40" height="20" rx="2"/>
    <rect x="810" y="30" width="40" height="20" rx="2"/>
    <rect x="865" y="30" width="40" height="20" rx="2"/>
    <rect x="920" y="30" width="40" height="20" rx="2"/>
  </g>

  <!-- ===== 城門拱洞 ===== -->
  <path d="M320,180 L320,100 Q480,20 640,100 L640,180 Z" fill="url(#gateShadow)"/>
  <!-- 拱門邊框石 -->
  <path d="M310,180 L310,95 Q480,10 650,95 L650,180 L640,180 L640,100 Q480,20 320,100 L320,180 Z" fill="#7a6a58"/>

  <!-- 城門洞內遠景（暗處街道） -->
  <rect x="340" y="110" width="280" height="70" fill="#3a3028" opacity="0.5"/>
  <!-- 遠處光源 -->
  <ellipse cx="480" cy="145" rx="60" ry="30" fill="#5a4a38" opacity="0.5"/>

  <!-- 城門木門（半開） -->
  <rect x="325" y="110" width="60" height="70" fill="#5a4030" rx="2" transform="skewY(-2)"/>
  <rect x="328" y="112" width="54" height="66" fill="#6a5040" rx="1"/>
  <!-- 門釘 -->
  <circle cx="345" cy="130" r="3" fill="#b8a040"/>
  <circle cx="365" cy="130" r="3" fill="#b8a040"/>
  <circle cx="345" cy="155" r="3" fill="#b8a040"/>
  <circle cx="365" cy="155" r="3" fill="#b8a040"/>

  <!-- 右門（半開） -->
  <rect x="575" y="108" width="60" height="72" fill="#5a4030" rx="2" transform="skewY(2)"/>
  <rect x="578" y="110" width="54" height="68" fill="#6a5040" rx="1"/>
  <circle cx="595" cy="130" r="3" fill="#b8a040"/>
  <circle cx="615" cy="130" r="3" fill="#b8a040"/>
  <circle cx="595" cy="155" r="3" fill="#b8a040"/>
  <circle cx="615" cy="155" r="3" fill="#b8a040"/>

  <!-- ===== 守衛哨位 ===== -->
  <!-- 左側燈籠 -->
  <rect x="280" y="140" width="4" height="30" fill="#5a4030"/>
  <rect x="270" y="132" width="24" height="18" fill="#cc4420" rx="3" opacity="0.8"/>
  <ellipse cx="282" cy="141" rx="8" ry="6" fill="#ff8840" opacity="0.3"/>

  <!-- 右側燈籠 -->
  <rect x="676" y="140" width="4" height="30" fill="#5a4030"/>
  <rect x="666" y="132" width="24" height="18" fill="#cc4420" rx="3" opacity="0.8"/>
  <ellipse cx="678" cy="141" rx="8" ry="6" fill="#ff8840" opacity="0.3"/>

  <!-- ===== 石板路面（y=180 開始，佔下方 2/3） ===== -->
  <rect x="0" y="180" width="960" height="360" fill="url(#stoneRoad)"/>
  <!-- 石板紋理 -->
  <g stroke="#6a5a48" stroke-width="1" opacity="0.25">
    <line x1="0" y1="220" x2="960" y2="220"/>
    <line x1="0" y1="265" x2="960" y2="265"/>
    <line x1="0" y1="315" x2="960" y2="315"/>
    <line x1="0" y1="365" x2="960" y2="365"/>
    <line x1="0" y1="415" x2="960" y2="415"/>
  </g>
  <g stroke="#6a5a48" stroke-width="0.6" opacity="0.2">
    <line x1="100" y1="180" x2="100" y2="540"/>
    <line x1="220" y1="180" x2="220" y2="540"/>
    <line x1="350" y1="180" x2="350" y2="540"/>
    <line x1="480" y1="180" x2="480" y2="540"/>
    <line x1="610" y1="180" x2="610" y2="540"/>
    <line x1="740" y1="180" x2="740" y2="540"/>
    <line x1="860" y1="180" x2="860" y2="540"/>
  </g>

  <!-- 牆地交界 -->
  <line x1="0" y1="180" x2="960" y2="180" stroke="#5a4a38" stroke-width="3"/>

  <!-- ===== 空氣粒子 ===== -->
  <circle cx="400" cy="150" r="1.5" fill="#f0dcc0" opacity="0.35"/>
  <circle cx="560" cy="180" r="1.2" fill="#f0dcc0" opacity="0.3"/>
  <circle cx="480" cy="120" r="1" fill="#f0dcc0" opacity="0.25"/>
  <circle cx="200" cy="200" r="1.3" fill="#e8d0b0" opacity="0.3"/>
  <circle cx="800" cy="180" r="1.5" fill="#e8d0b0" opacity="0.28"/>
  <circle cx="350" cy="250" r="1" fill="#e8d0b0" opacity="0.2"/>
  <circle cx="650" cy="240" r="1.2" fill="#e8d0b0" opacity="0.22"/>
  <circle cx="100" cy="150" r="0.8" fill="#f0dcc0" opacity="0.25"/>
  <circle cx="880" cy="120" r="1.4" fill="#f0dcc0" opacity="0.2"/>

  <!-- ===== 整體氛圍覆蓋 ===== -->
  <rect width="960" height="540" fill="#e0c080" opacity="0.05"/>
</svg>