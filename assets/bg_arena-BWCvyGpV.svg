<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 比武擂台 — 吉卜力風格：露天擂台、木造圍欄、沙地 -->
  <defs>
    <!-- 天空漸層 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ba4d0"/>
      <stop offset="40%" stop-color="#8ec4e8"/>
      <stop offset="100%" stop-color="#c8e4f0"/>
    </linearGradient>
    <!-- 沙地 -->
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c498"/>
      <stop offset="100%" stop-color="#c8b080"/>
    </linearGradient>
    <!-- 木頭 -->
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6840"/>
      <stop offset="100%" stop-color="#6a4e30"/>
    </linearGradient>
    <!-- 觀眾席 -->
    <linearGradient id="stands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a5e40"/>
      <stop offset="100%" stop-color="#5e4630"/>
    </linearGradient>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- 雲朵（吉卜力風圓潤） -->
  <g opacity="0.7">
    <ellipse cx="150" cy="35" rx="80" ry="25" fill="#ffffff"/>
    <ellipse cx="110" cy="30" rx="50" ry="20" fill="#ffffff"/>
    <ellipse cx="200" cy="33" rx="55" ry="18" fill="#ffffff"/>
  </g>
  <g opacity="0.5">
    <ellipse cx="700" cy="22" rx="90" ry="22" fill="#ffffff"/>
    <ellipse cx="650" cy="20" rx="55" ry="18" fill="#ffffff"/>
    <ellipse cx="760" cy="24" rx="50" ry="16" fill="#ffffff"/>
  </g>
  <g opacity="0.4">
    <ellipse cx="450" cy="50" rx="60" ry="14" fill="#ffffff"/>
    <ellipse cx="420" cy="48" rx="40" ry="12" fill="#ffffff"/>
  </g>

  <!-- ===== 遠景：山丘 ===== -->
  <path d="M0,110 Q80,70 180,92 Q300,50 420,80 Q540,40 660,72 Q780,30 900,62 L960,75 L960,145 L0,145 Z" fill="#8aaa68" opacity="0.5"/>
  <path d="M0,125 Q120,95 260,112 Q400,82 530,102 Q680,74 820,98 L960,88 L960,150 L0,150 Z" fill="#7a9a58" opacity="0.45"/>

  <!-- ===== 遠景樹叢 ===== -->
  <circle cx="100" cy="108" r="18" fill="#6a8a48" opacity="0.4"/>
  <circle cx="140" cy="104" r="22" fill="#5a7a40" opacity="0.35"/>
  <circle cx="500" cy="92" r="18" fill="#6a8a48" opacity="0.35"/>
  <circle cx="540" cy="88" r="15" fill="#5a7a40" opacity="0.3"/>
  <circle cx="850" cy="78" r="20" fill="#6a8a48" opacity="0.35"/>

  <!-- ===== 觀眾席（後方木造階梯座位） ===== -->
  <!-- 左側觀眾席 -->
  <path d="M0,115 L0,180 L200,180 L200,130 Z" fill="url(#stands)"/>
  <line x1="0" y1="132" x2="195" y2="142" stroke="#5a4228" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="148" x2="198" y2="156" stroke="#5a4228" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="165" x2="200" y2="172" stroke="#5a4228" stroke-width="1.5" opacity="0.4"/>

  <!-- 右側觀眾席 -->
  <path d="M960,115 L960,180 L760,180 L760,130 Z" fill="url(#stands)"/>
  <line x1="960" y1="132" x2="765" y2="142" stroke="#5a4228" stroke-width="1.5" opacity="0.4"/>
  <line x1="960" y1="148" x2="762" y2="156" stroke="#5a4228" stroke-width="1.5" opacity="0.4"/>
  <line x1="960" y1="165" x2="760" y2="172" stroke="#5a4228" stroke-width="1.5" opacity="0.4"/>

  <!-- 觀眾（簡化色塊人形） -->
  <g opacity="0.5">
    <circle cx="30" cy="122" r="4.5" fill="#b07050"/><rect x="26" y="127" width="8" height="9" fill="#8a5030" rx="1"/>
    <circle cx="55" cy="120" r="4.5" fill="#a06848"/><rect x="51" y="125" width="8" height="9" fill="#7a4828" rx="1"/>
    <circle cx="80" cy="124" r="4.5" fill="#c08060"/><rect x="76" y="129" width="8" height="9" fill="#9a6040" rx="1"/>
    <circle cx="110" cy="130" r="4.5" fill="#b07050"/><rect x="106" y="135" width="8" height="9" fill="#8a5030" rx="1"/>
    <circle cx="140" cy="135" r="4.5" fill="#a06848"/><rect x="136" y="140" width="8" height="9" fill="#7a4828" rx="1"/>
    <circle cx="165" cy="140" r="4.5" fill="#c08060"/><rect x="161" y="145" width="8" height="9" fill="#9a6040" rx="1"/>
    <circle cx="50" cy="147" r="4.5" fill="#b08058"/><rect x="46" y="152" width="8" height="9" fill="#8a5838" rx="1"/>
    <circle cx="90" cy="152" r="4.5" fill="#a07050"/><rect x="86" y="157" width="8" height="9" fill="#7a5030" rx="1"/>
    <circle cx="130" cy="158" r="4.5" fill="#c08868"/><rect x="126" y="163" width="8" height="9" fill="#9a6848" rx="1"/>
  </g>
  <g opacity="0.5">
    <circle cx="930" cy="122" r="4.5" fill="#b07050"/><rect x="926" y="127" width="8" height="9" fill="#8a5030" rx="1"/>
    <circle cx="905" cy="120" r="4.5" fill="#a06848"/><rect x="901" y="125" width="8" height="9" fill="#7a4828" rx="1"/>
    <circle cx="880" cy="124" r="4.5" fill="#c08060"/><rect x="876" y="129" width="8" height="9" fill="#9a6040" rx="1"/>
    <circle cx="850" cy="130" r="4.5" fill="#b07050"/><rect x="846" y="135" width="8" height="9" fill="#8a5030" rx="1"/>
    <circle cx="820" cy="135" r="4.5" fill="#a06848"/><rect x="816" y="140" width="8" height="9" fill="#7a4828" rx="1"/>
    <circle cx="795" cy="140" r="4.5" fill="#c08060"/><rect x="791" y="145" width="8" height="9" fill="#9a6040" rx="1"/>
    <circle cx="910" cy="147" r="4.5" fill="#b08058"/><rect x="906" y="152" width="8" height="9" fill="#8a5838" rx="1"/>
    <circle cx="870" cy="152" r="4.5" fill="#a07050"/><rect x="866" y="157" width="8" height="9" fill="#7a5030" rx="1"/>
    <circle cx="830" cy="158" r="4.5" fill="#c08868"/><rect x="826" y="163" width="8" height="9" fill="#9a6848" rx="1"/>
  </g>

  <!-- ===== 木造圍欄 ===== -->
  <!-- 後方圍欄 -->
  <rect x="200" y="150" width="560" height="7" fill="#8a6840" rx="2"/>
  <rect x="200" y="165" width="560" height="7" fill="#8a6840" rx="2"/>
  <!-- 圍欄柱子 -->
  <rect x="198" y="140" width="13" height="45" fill="#7a5830" rx="3"/>
  <rect x="340" y="144" width="11" height="40" fill="#7a5830" rx="3"/>
  <rect x="478" y="144" width="11" height="40" fill="#7a5830" rx="3"/>
  <rect x="610" y="144" width="11" height="40" fill="#7a5830" rx="3"/>
  <rect x="748" y="140" width="13" height="45" fill="#7a5830" rx="3"/>

  <!-- 左圍欄（透視斜線） -->
  <line x1="198" y1="153" x2="60" y2="176" stroke="#8a6840" stroke-width="6" stroke-linecap="round"/>
  <line x1="198" y1="168" x2="60" y2="180" stroke="#8a6840" stroke-width="6" stroke-linecap="round"/>

  <!-- 右圍欄（透視斜線） -->
  <line x1="762" y1="153" x2="900" y2="176" stroke="#8a6840" stroke-width="6" stroke-linecap="round"/>
  <line x1="762" y1="168" x2="900" y2="180" stroke="#8a6840" stroke-width="6" stroke-linecap="round"/>

  <!-- ===== 沙地擂台面（起始 y=180） ===== -->
  <rect x="0" y="180" width="960" height="360" fill="url(#sand)"/>
  <!-- 沙地紋理 -->
  <ellipse cx="300" cy="270" rx="80" ry="3" fill="#c0a878" opacity="0.3"/>
  <ellipse cx="600" cy="320" rx="100" ry="4" fill="#c0a878" opacity="0.25"/>
  <ellipse cx="150" cy="340" rx="60" ry="3" fill="#c0a878" opacity="0.2"/>
  <ellipse cx="750" cy="290" rx="70" ry="3" fill="#c0a878" opacity="0.25"/>
  <ellipse cx="480" cy="410" rx="90" ry="4" fill="#c0a878" opacity="0.2"/>

  <!-- 擂台圓形標記 -->
  <ellipse cx="480" cy="330" rx="200" ry="60" fill="none" stroke="#b09868" stroke-width="2" opacity="0.3"/>

  <!-- 牆地交界 -->
  <line x1="0" y1="180" x2="960" y2="180" stroke="#a08860" stroke-width="2"/>

  <!-- ===== 擂台角落旗幟 ===== -->
  <!-- 左旗 -->
  <rect x="220" y="120" width="4" height="70" fill="#6a4a28"/>
  <path d="M224,120 L260,130 L224,142 Z" fill="#cc3030" opacity="0.8"/>
  <!-- 右旗 -->
  <rect x="736" y="120" width="4" height="70" fill="#6a4a28"/>
  <path d="M736,120 L700,130 L736,142 Z" fill="#2050a0" opacity="0.8"/>

  <!-- ===== 空氣粒子（塵土飛揚） ===== -->
  <circle cx="200" cy="105" r="1.5" fill="#e8d8b0" opacity="0.35"/>
  <circle cx="400" cy="80" r="1.2" fill="#e8d8b0" opacity="0.3"/>
  <circle cx="600" cy="125" r="1" fill="#e8d8b0" opacity="0.25"/>
  <circle cx="800" cy="98" r="1.5" fill="#e8d8b0" opacity="0.3"/>
  <circle cx="350" cy="200" r="1.3" fill="#d8c8a0" opacity="0.25"/>
  <circle cx="550" cy="218" r="1" fill="#d8c8a0" opacity="0.2"/>
  <circle cx="700" cy="208" r="1.2" fill="#d8c8a0" opacity="0.22"/>
  <circle cx="250" cy="238" r="0.8" fill="#d8c8a0" opacity="0.18"/>
  <circle cx="480" cy="150" r="1.4" fill="#e8d8b0" opacity="0.28"/>
  <circle cx="100" cy="168" r="1" fill="#e8d8b0" opacity="0.2"/>

  <!-- ===== 整體氛圍覆蓋（暖陽光） ===== -->
  <rect width="960" height="540" fill="#f0d880" opacity="0.05"/>
</svg>