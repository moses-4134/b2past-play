<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 呂不韋 — 吉卜力2頭身 面朝右（敵方）技能：權杖掃弧 -->
  <defs>
    <radialGradient id="lubuweiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8dcd0"/>
      <stop offset="100%" stop-color="#d8c8b8"/>
    </radialGradient>
    <linearGradient id="lubuweiRobe" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#3a1028"/>
      <stop offset="100%" stop-color="#2a0818"/>
    </linearGradient>
    <linearGradient id="lubuweiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="lubuweiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0818"/>
      <stop offset="100%" stop-color="#1a0410"/>
    </linearGradient>
    <linearGradient id="lubuweiAura" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a840" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e0c060" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-6" cy="225" rx="32" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（穩站，指揮） ===== -->
      <ellipse cx="12" cy="196" rx="10" ry="18" fill="url(#lubuweiPants)" transform="rotate(-5,12,196)"/>
      <ellipse cx="14" cy="216" rx="11" ry="6" fill="#1a0810"/>
      <ellipse cx="-14" cy="194" rx="11" ry="19" fill="url(#lubuweiPants)" transform="rotate(5,-14,194)"/>
      <ellipse cx="-16" cy="216" rx="12" ry="6" fill="#1a0810"/>

      <!-- 長袍下擺（飄動） -->
      <path d="M-30,178 Q-34,200 -28,218 L24,218 Q28,200 26,178" fill="url(#lubuweiRobe)" opacity="0.45"/>
      <!-- 袍角飄動 -->
      <path d="M-28,210 Q-36,206 -34,216" fill="none" stroke="#3a1028" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

      <!-- ===== 身體（挺立，威嚴） ===== -->
      <ellipse cx="-2" cy="156" rx="26" ry="30" fill="url(#lubuweiRobe)" transform="rotate(-3,-2,156)"/>

      <!-- 內袍領口 -->
      <path d="M-14,132 L-4,150 L8,132" fill="none" stroke="#5a2838" stroke-width="3" stroke-linejoin="round"/>

      <!-- 金色繡花 -->
      <path d="M-18,148 Q-14,156 -10,164" fill="none" stroke="#c8a840" stroke-width="0.8" opacity="0.5"/>
      <path d="M14,146 Q10,154 8,162" fill="none" stroke="#c8a840" stroke-width="0.8" opacity="0.5"/>
      <path d="M-8,158 C-4,160 4,160 8,158" fill="none" stroke="#c8a840" stroke-width="0.6" opacity="0.4"/>

      <!-- 金腰帶 -->
      <path d="M-26,180 Q-2,188 22,180" fill="none" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
      <rect x="-6" y="178" width="8" height="8" rx="1" fill="#c8a840" stroke="#a08030" stroke-width="0.5"/>

      <!-- ===== 大頭（權威爆發表情） ===== -->
      <ellipse cx="0" cy="94" rx="38" ry="40" fill="url(#lubuweiHair)"/>

      <!-- 臉 -->
      <path d="M-30,88 C-34,100 -32,118 -26,130 C-20,138 -6,142 2,140 C12,138 22,130 26,118 C30,106 28,92 22,84 C16,78 4,74 -4,76 C-18,78 -28,82 -30,88Z" fill="url(#lubuweiFace)"/>

      <!-- 高冠 -->
      <rect x="-18" y="42" width="32" height="28" rx="2" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="0.5"/>
      <rect x="-18" y="56" width="32" height="3" fill="#c8a840" opacity="0.8"/>
      <rect x="-16" y="38" width="28" height="6" rx="1" fill="#0c0c0c"/>
      <line x1="-20" y1="52" x2="22" y2="52" stroke="#c8a840" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-20" cy="52" r="2" fill="#c8a840"/>
      <circle cx="22" cy="52" r="2" fill="#c8a840"/>

      <!-- 頭髮 -->
      <path d="M-20,78 C-16,66 0,60 14,64 C24,68 28,78 26,84 C22,78 14,74 6,72 C-2,70 -12,72 -18,76" fill="url(#lubuweiHair)"/>
      <path d="M22,86 C26,82 28,90 26,98 C24,104 22,100 22,96" fill="url(#lubuweiHair)"/>
      <path d="M24,88 C26,86 27,92 26,96" fill="none" stroke="#4a4a50" stroke-width="1" opacity="0.5"/>

      <!-- 耳朵 -->
      <path d="M22,102 C26,98 28,104 26,112 C24,116 22,114 22,108" fill="url(#lubuweiFace)" stroke="#c0b0a0" stroke-width="0.5"/>

      <!-- ===== 眼（威壓爆發，圓睜熾烈） ===== -->
      <ellipse cx="-12" cy="106" rx="7" ry="5.5" fill="#fff"/>
      <ellipse cx="-13" cy="107" rx="4" ry="3.8" fill="#2a1a10"/>
      <ellipse cx="-13.5" cy="106.5" rx="2.2" ry="2.5" fill="#0a0400"/>
      <circle cx="-15" cy="105.5" r="1.2" fill="#fff" opacity="0.5"/>

      <ellipse cx="8" cy="106" rx="7" ry="5.5" fill="#fff"/>
      <ellipse cx="7" cy="107" rx="4" ry="3.8" fill="#2a1a10"/>
      <ellipse cx="6.5" cy="106.5" rx="2.2" ry="2.5" fill="#0a0400"/>
      <circle cx="5" cy="105.5" r="1.2" fill="#fff" opacity="0.5"/>

      <!-- 眉毛（緊鎖，威壓） -->
      <path d="M-18,98 C-14,96 -10,97 -6,100" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M12,100 C14,97 18,96 20,98" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-6,114 C-8,120 -4,124 0,124" fill="none" stroke="#c0a890" stroke-width="1.4" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙發功） -->
      <path d="M-10,132 C-6,130 2,130 6,132" fill="none" stroke="#705040" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-8,133 C-4,131 2,131 6,133" fill="none" stroke="#804840" stroke-width="0.8" opacity="0.5"/>

      <!-- 鬍子 -->
      <line x1="-8" y1="138" x2="-10" y2="148" stroke="#2a2a30" stroke-width="1" opacity="0.5"/>
      <line x1="-5" y1="138" x2="-6" y2="150" stroke="#2a2a30" stroke-width="1" opacity="0.6"/>
      <line x1="-2" y1="138" x2="-2" y2="151" stroke="#2a2a30" stroke-width="1" opacity="0.6"/>
      <line x1="1" y1="138" x2="2" y2="150" stroke="#4a4a50" stroke-width="1" opacity="0.5"/>
      <line x1="4" y1="137" x2="6" y2="148" stroke="#4a4a50" stroke-width="1" opacity="0.5"/>

      <!-- ===== 空手臂（負x，向前伸出指揮手勢） ===== -->
      <path d="M-22,148 Q-40,140 -56,132" fill="none" stroke="url(#lubuweiRobe)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
      <ellipse cx="-56" cy="132" rx="8" ry="4" fill="#3a1028" opacity="0.5"/>
      <circle cx="-58" cy="132" r="5" fill="url(#lubuweiFace)" opacity="0.85"/>
      <!-- 展開的手指（指揮手勢） -->
      <line x1="-60" y1="130" x2="-66" y2="126" stroke="url(#lubuweiFace)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
      <line x1="-60" y1="132" x2="-68" y2="130" stroke="url(#lubuweiFace)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
      <line x1="-60" y1="134" x2="-66" y2="136" stroke="url(#lubuweiFace)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

      <!-- ===== 權杖手臂（正x舉高，杖掃向負x） ===== -->
      <path d="M24,148 Q16,126 -10,118" fill="none" stroke="url(#lubuweiRobe)" stroke-width="12" stroke-linecap="round"/>
      <ellipse cx="-10" cy="118" rx="7" ry="4" fill="#3a1028" opacity="0.5"/>
      <circle cx="-10" cy="118" r="5.5" fill="url(#lubuweiFace)"/>

      <!-- ===== 權杖（掃向負x，弧線軌跡，~70px） ===== -->
      <!-- 杖身 -->
      <line x1="-12" y1="118" x2="-80" y2="100" stroke="#3a2018" stroke-width="4" stroke-linecap="round"/>
      <!-- 漆面亮線 -->
      <line x1="-14" y1="117" x2="-78" y2="99" stroke="#5a3828" stroke-width="1" opacity="0.3"/>
      <!-- 玉環 -->
      <circle cx="-70" cy="102" r="4" fill="none" stroke="#4a8a50" stroke-width="2.5"/>
      <circle cx="-70" cy="102" r="4" fill="#4a8a50" opacity="0.2"/>
      <!-- 金龍頭 -->
      <circle cx="-80" cy="100" r="5.5" fill="#c8a840"/>
      <circle cx="-80" cy="100" r="4" fill="#a08030"/>
      <circle cx="-81" cy="98" r="1.5" fill="#e0c060" opacity="0.8"/>
      <!-- 龍角 -->
      <path d="M-83,96 L-86,91" fill="none" stroke="#c8a840" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-77,96 L-74,91" fill="none" stroke="#c8a840" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 杖底 -->
      <circle cx="-8" cy="120" r="2.5" fill="#c8a840"/>

      <!-- ===== 金色光環（權杖頂部威壓光芒） ===== -->
      <circle cx="-80" cy="100" r="12" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.4"/>
      <circle cx="-80" cy="100" r="18" fill="none" stroke="#c8a840" stroke-width="1" opacity="0.2"/>
      <!-- 光線 -->
      <line x1="-80" y1="82" x2="-80" y2="76" stroke="#c8a840" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
      <line x1="-66" y1="90" x2="-60" y2="86" stroke="#c8a840" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
      <line x1="-90" y1="92" x2="-94" y2="88" stroke="#c8a840" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
      <line x1="-66" y1="110" x2="-60" y2="114" stroke="#c8a840" stroke-width="1.2" opacity="0.3" stroke-linecap="round"/>
      <line x1="-90" y1="108" x2="-94" y2="112" stroke="#c8a840" stroke-width="1.2" opacity="0.3" stroke-linecap="round"/>

      <!-- 掃擊弧線 -->
      <path d="M-20,106 Q-50,88 -80,100" fill="none" stroke="#c8a840" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
      <path d="M-20,110 Q-48,92 -78,104" fill="none" stroke="#e0c060" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>