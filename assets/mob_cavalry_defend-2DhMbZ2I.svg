<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙國騎兵 — 防禦（劍身前擋） -->
  <defs>
    <radialGradient id="mobCavalryFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c0a470"/>
    </radialGradient>
    <linearGradient id="mobCavalryArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3030"/>
      <stop offset="100%" stop-color="#3a2020"/>
    </linearGradient>
    <linearGradient id="mobCavalryPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2828"/>
      <stop offset="100%" stop-color="#2a1818"/>
    </linearGradient>
    <linearGradient id="mobCavalryHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="mobCavalryBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="194" rx="22" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（低蹲防禦） ===== -->
      <ellipse cx="8" cy="174" rx="8" ry="15" fill="url(#mobCavalryPants)" transform="rotate(-3,8,174)"/>
      <ellipse cx="7" cy="188" rx="9" ry="6" fill="#2a1818"/>
      <ellipse cx="-10" cy="172" rx="9" ry="16" fill="url(#mobCavalryPants)" transform="rotate(3,-10,172)"/>
      <ellipse cx="-11" cy="188" rx="10" ry="6" fill="#2a1818"/>

      <!-- ===== 身體（蹲低） ===== -->
      <ellipse cx="-2" cy="142" rx="24" ry="26" fill="url(#mobCavalryArmor)" transform="rotate(-3,-2,142)"/>

      <!-- 肩甲 -->
      <ellipse cx="-20" cy="126" rx="8" ry="5" fill="#4a2828" stroke="#3a1818" stroke-width="0.5" transform="rotate(-10,-20,126)"/>
      <ellipse cx="16" cy="126" rx="8" ry="5" fill="#4a2828" stroke="#3a1818" stroke-width="0.5" transform="rotate(10,16,126)"/>

      <path d="M-10,126 L-4,134 L4,126" fill="none" stroke="#3a2020" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <path d="M-20,162 Q-2,168 18,162" fill="none" stroke="#3a2818" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 大頭 ===== -->
      <ellipse cx="0" cy="100" rx="32" ry="34" fill="url(#mobCavalryHair)"/>

      <path d="M-22,92 C-26,102 -24,112 -18,122 C-12,130 -4,134 4,132 C10,130 16,124 20,114 C24,102 22,92 16,84 C10,78 4,76 -2,78 C-12,80 -20,86 -22,92Z" fill="url(#mobCavalryFace)"/>

      <path d="M-14,80 C-10,64 4,56 14,60 C22,64 26,74 22,84 C18,76 12,70 4,68 C0,66 -6,68 -12,74" fill="url(#mobCavalryHair)"/>

      <path d="M6,60 C10,54 16,56 14,64" fill="url(#mobCavalryHair)" stroke="#2a2018" stroke-width="0.5"/>

      <path d="M-20,84 C-24,78 -26,82 -26,88 C-24,92 -20,90 -20,86" fill="url(#mobCavalryHair)"/>
      <path d="M16,86 C22,80 24,88 22,96 C20,100 16,98 16,94" fill="url(#mobCavalryHair)"/>

      <path d="M16,104 C20,100 22,106 20,112 C18,116 16,114 16,110" fill="url(#mobCavalryFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- 眼睛 -->
      <ellipse cx="-10" cy="108" rx="6.5" ry="5.5" fill="#fff"/>
      <ellipse cx="-11" cy="109" rx="3.8" ry="4.2" fill="#2a1818"/>
      <ellipse cx="-11.5" cy="108" rx="2" ry="2.2" fill="#1a0808"/>
      <circle cx="-13" cy="107" r="1.1" fill="#fff" opacity="0.6"/>

      <ellipse cx="6" cy="108" rx="6.5" ry="5.5" fill="#fff"/>
      <ellipse cx="5" cy="109" rx="3.8" ry="4.2" fill="#2a1818"/>
      <ellipse cx="4.5" cy="108" rx="2" ry="2.2" fill="#1a0808"/>
      <circle cx="3" cy="107" r="1.1" fill="#fff" opacity="0.6"/>

      <path d="M-14,102 C-10,101 -8,102 -6,103" fill="none" stroke="#2a2018" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,103 C10,102 12,101 16,102" fill="none" stroke="#2a2018" stroke-width="1.8" stroke-linecap="round"/>

      <path d="M-14,116 C-16,120 -12,124" fill="none" stroke="#a08858" stroke-width="1.2" stroke-linecap="round"/>

      <path d="M-8,128 C-4,129 2,129 6,128" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>

      <!-- ===== 左手臂（負x，握拳護胸） ===== -->
      <path d="M-18,130 Q-26,130 -28,138" fill="none" stroke="url(#mobCavalryArmor)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-28" cy="140" r="4.5" fill="url(#mobCavalryFace)" opacity="0.85"/>

      <!-- ===== 右手臂（正x，劍身前擋格） ===== -->
      <path d="M16,130 Q22,120 24,112" fill="none" stroke="url(#mobCavalryArmor)" stroke-width="10" stroke-linecap="round"/>

      <!-- 劍（身前斜擋，正x區域） -->
      <line x1="26" y1="108" x2="30" y2="58" stroke="url(#mobCavalryBlade)" stroke-width="4" stroke-linecap="round"/>
      <line x1="27" y1="106" x2="31" y2="60" stroke="#ddd" stroke-width="1" opacity="0.3"/>
      <line x1="22" y1="112" x2="30" y2="108" stroke="#806030" stroke-width="3" stroke-linecap="round"/>
      <line x1="25" y1="112" x2="23" y2="120" stroke="#4a3520" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="22" cy="122" r="2" fill="#806030"/>
      <circle cx="25" cy="110" r="5" fill="url(#mobCavalryFace)"/>
    </g>
  </g>
</svg>
