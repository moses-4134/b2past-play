<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 「鬼算盤」老高 — 吉卜力2頭身 面朝右（敵方）受擊 -->
  <defs>
    <radialGradient id="guisuanFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e4c898"/>
      <stop offset="100%" stop-color="#d0b078"/>
    </radialGradient>
    <linearGradient id="guisuanRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a3830"/>
      <stop offset="100%" stop-color="#282820"/>
    </linearGradient>
    <linearGradient id="guisuanPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#302e28"/>
      <stop offset="100%" stop-color="#1e1c18"/>
    </linearGradient>
    <linearGradient id="guisuanHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1810"/>
      <stop offset="100%" stop-color="#0e0c08"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="207" rx="26" ry="4" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（受擊後退） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="185" rx="9" ry="16" fill="url(#guisuanPants)" transform="rotate(-3,12,185)"/>
      <ellipse cx="11" cy="201" rx="10" ry="6" fill="#2a2820"/>
      <!-- 前腿 -->
      <ellipse cx="-10" cy="183" rx="10" ry="17" fill="url(#guisuanPants)" transform="rotate(3,-10,183)"/>
      <ellipse cx="-11" cy="201" rx="11" ry="6" fill="#2a2820"/>

      <!-- ===== 身體（後仰受擊） ===== -->
      <ellipse cx="-2" cy="150" rx="22" ry="28" fill="url(#guisuanRobe)" transform="rotate(8,-2,150)"/>

      <!-- 長袍衣褶 -->
      <path d="M-8,135 L-5,148" fill="none" stroke="#1e1c18" stroke-width="0.8" opacity="0.4"/>
      <path d="M6,138 L8,152" fill="none" stroke="#1e1c18" stroke-width="0.7" opacity="0.3"/>

      <!-- 領口 -->
      <path d="M-10,126 L-4,138 L6,126" fill="none" stroke="#4a4840" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-22,170 Q-2,176 20,170" fill="none" stroke="#4a4038" stroke-width="5" stroke-linecap="round"/>
      <!-- 算盤掛件（受擊甩動） -->
      <rect x="16" y="173" width="8" height="12" rx="1" fill="#6a5030" stroke="#4a3820" stroke-width="0.5" transform="rotate(10,20,179)"/>

      <!-- ===== 左手臂（角色左手，受擊向後甩） ===== -->
      <path d="M-18,132 Q-40,140 -42,148" fill="none" stroke="url(#guisuanRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-42" cy="150" r="5" fill="url(#guisuanFace)" opacity="0.85"/>

      <!-- ===== 大頭（後仰受擊） ===== -->
      <!-- 後腦 -->
      <ellipse cx="0" cy="92" rx="36" ry="40" fill="url(#guisuanHair)"/>

      <!-- 臉 -->
      <path d="M-26,86 C-30,96 -28,114 -24,126 C-18,136 -6,140 2,138 C12,136 20,128 24,116 C28,104 26,90 20,82 C14,76 4,72 -4,74 C-16,76 -24,80 -26,86Z" fill="url(#guisuanFace)"/>

      <!-- 髮髻（微散） -->
      <path d="M-14,76 C-10,54 4,48 14,52 C22,56 26,68 22,80 C18,72 12,66 4,64 C-2,62 -8,64 -12,70" fill="url(#guisuanHair)"/>
      <line x1="-8" y1="58" x2="16" y2="56" stroke="#a08050" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="17" cy="56" r="2" fill="#c0a060"/>

      <!-- 鬢角 -->
      <path d="M-26,86 C-28,78 -30,80 -30,88 C-28,92 -26,92 -26,88" fill="url(#guisuanHair)"/>
      <path d="M20,82 C24,78 26,84 24,92 C22,96 20,94 20,90" fill="url(#guisuanHair)"/>

      <!-- 耳朵 -->
      <path d="M18,100 C22,96 24,102 22,110 C20,114 18,112 18,106" fill="url(#guisuanFace)" stroke="#c0a068" stroke-width="0.5"/>

      <!-- ===== 眼睛（受擊瞇眼） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-10" cy="106" rx="5" ry="3.5" fill="#fff"/>
      <ellipse cx="-11" cy="107" rx="3.2" ry="2.5" fill="#342820"/>
      <ellipse cx="-11.5" cy="106.5" rx="1.8" ry="1.5" fill="#1a0c08"/>
      <circle cx="-12.5" cy="105.5" r="0.6" fill="#fff" opacity="0.4"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="106" rx="5" ry="3.5" fill="#fff"/>
      <ellipse cx="5" cy="107" rx="3.2" ry="2.5" fill="#342820"/>
      <ellipse cx="4.5" cy="106.5" rx="1.8" ry="1.5" fill="#1a0c08"/>
      <circle cx="3.5" cy="105.5" r="0.6" fill="#fff" opacity="0.4"/>

      <!-- 眉毛（痛苦皺起） -->
      <path d="M-14,97 C-10,94 -8,96 -6,98" fill="none" stroke="#1a1810" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8,98 C10,96 12,94 16,97" fill="none" stroke="#1a1810" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 八字鬍 -->
      <path d="M-8,120 C-12,124 -18,126" fill="none" stroke="#1a1810" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <path d="M-2,120 C2,124 8,126" fill="none" stroke="#1a1810" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

      <!-- 鼻子 -->
      <path d="M-14,112 C-16,118 -10,122" fill="none" stroke="#c0a068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（咬牙忍痛） -->
      <path d="M-12,128 C-6,127 2,127 6,128" fill="none" stroke="#704840" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-12,128 C-14,130 -15,131" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <path d="M6,128 C7,130 8,131" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

      <!-- ===== 右手臂（角色右手，受擊偏移）— 繪製在頭部之後 ===== -->
      <path d="M20,132 Q38,138 46,148" fill="none" stroke="url(#guisuanRobe)" stroke-width="10" stroke-linecap="round"/>
      <!-- 算盤（受擊甩開，微傾斜） -->
      <g transform="rotate(-15,64,132)">
        <rect x="40" y="132" width="24" height="32" rx="2" fill="#6a5030" stroke="#4a3820" stroke-width="1.5"/>
        <!-- 算盤橫桿 -->
        <line x1="42" y1="140" x2="62" y2="140" stroke="#8a6840" stroke-width="1"/>
        <line x1="42" y1="148" x2="62" y2="148" stroke="#8a6840" stroke-width="1"/>
        <line x1="42" y1="156" x2="62" y2="156" stroke="#8a6840" stroke-width="1"/>
        <!-- 算盤珠（散亂位置） -->
        <circle cx="48" cy="140" r="3" fill="#c8a060" stroke="#906830" stroke-width="0.5"/>
        <circle cx="56" cy="140" r="3" fill="#a08050" stroke="#906830" stroke-width="0.5"/>
        <circle cx="50" cy="148" r="3" fill="#c8a060" stroke="#906830" stroke-width="0.5"/>
        <circle cx="48" cy="156" r="3" fill="#a08050" stroke="#906830" stroke-width="0.5"/>
        <circle cx="56" cy="156" r="3" fill="#c8a060" stroke="#906830" stroke-width="0.5"/>
      </g>
      <!-- 甩落的算盤珠 -->
      <circle cx="58" cy="164" r="2.5" fill="#806030" opacity="0.7"/>
      <circle cx="52" cy="170" r="2" fill="#907040" opacity="0.6"/>
      <!-- 握算盤的手 -->
      <circle cx="46" cy="150" r="5.5" fill="url(#guisuanFace)"/>
    </g>
  </g>
</svg>