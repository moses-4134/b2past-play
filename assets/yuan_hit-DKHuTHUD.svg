<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 相里衍 — 吉卜力2頭身 側面朝左 受擊（微後仰，宗師抗性強） -->
  <defs>
    <radialGradient id="yuanFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8d0b8"/>
      <stop offset="100%" stop-color="#d0b090"/>
    </radialGradient>
    <linearGradient id="yuanRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#283050"/>
      <stop offset="100%" stop-color="#182038"/>
    </linearGradient>
    <linearGradient id="yuanPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="yuanHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="yuanSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e8f0"/>
      <stop offset="100%" stop-color="#a0a8b0"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="2" cy="224" rx="29" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（後退半步） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="14" cy="200" rx="10" ry="17" fill="url(#yuanPants)" transform="rotate(3,14,200)"/>
    <ellipse cx="14" cy="217" rx="11" ry="7" fill="#2a2018"/>
    <!-- 前腿（左腿） -->
    <ellipse cx="-10" cy="198" rx="10" ry="17" fill="url(#yuanPants)" transform="rotate(-3,-10,198)"/>
    <ellipse cx="-10" cy="217" rx="11" ry="7" fill="#2a2018"/>

    <!-- ===== 身體（微後仰） ===== -->
    <ellipse cx="2" cy="160" rx="28" ry="30" fill="url(#yuanRobe)" transform="rotate(5,2,160)"/>

    <!-- 衣襟交叉 -->
    <path d="M-10,140 L-2,160 L8,140" fill="none" stroke="#506080" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-24,181 Q2,189 28,181" fill="none" stroke="#3a3050" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="0" cy="185" rx="3.5" ry="3" fill="#706050"/>

    <!-- ===== 畫面右側手臂（角色左手） ===== -->
    <path d="M24,146 Q40,150 42,164" fill="none" stroke="url(#yuanRobe)" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
    <circle cx="42" cy="166" r="5.5" fill="url(#yuanFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，持劍偏斜） ===== -->
    <path d="M-22,148 Q-38,142 -46,140" fill="none" stroke="url(#yuanRobe)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-46" cy="142" r="5.5" fill="url(#yuanFace)"/>

    <!-- ===== 劍（略歪斜，受擊偏移，劍身50.6px） ===== -->
    <!-- 劍身 -->
    <line x1="-50" y1="133" x2="-71" y2="87" stroke="url(#yuanSteel)" stroke-width="4" stroke-linecap="round"/>
    <!-- 劍身亮線 -->
    <line x1="-50" y1="133" x2="-71" y2="87" stroke="#f0f4f8" stroke-width="1.5" opacity="0.4"/>
    <!-- 劍尖 -->
    <line x1="-71" y1="87" x2="-73" y2="81" stroke="#c8d0d8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 護手 -->
    <line x1="-55" y1="139" x2="-45" y2="135" stroke="#8a7848" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-48" y1="140" x2="-46" y2="146" stroke="#4a3828" stroke-width="4" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-45" cy="149" r="2.5" fill="#8a7848"/>

    <!-- ===== 大頭（微後仰） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="4" cy="96" rx="40" ry="42" fill="url(#yuanHair)"/>

    <!-- 臉（瘦長臉） -->
    <path d="M-26,86 C-30,98 -30,116 -24,128 C-18,138 -6,142 4,140 C14,138 24,132 28,120 C32,108 30,92 24,84 C18,78 8,74 -2,76 C-14,78 -24,80 -26,86Z" fill="url(#yuanFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-16,78 C-12,58 4,50 18,54 C30,58 36,70 32,82 C28,76 20,68 12,66 C4,64 -6,66 -12,72" fill="url(#yuanHair)"/>

    <!-- 高髻 -->
    <ellipse cx="6" cy="52" rx="8" ry="10" fill="url(#yuanHair)"/>
    <path d="M0,44 C4,36 8,36 10,44" fill="url(#yuanHair)"/>
    <ellipse cx="6" cy="58" rx="9" ry="2.5" fill="#3a3050"/>

    <!-- 短瀏海 -->
    <path d="M-24,86 C-28,76 -30,80 -30,86 C-28,90 -24,90 -24,88" fill="url(#yuanHair)"/>
    <path d="M-20,80 C-22,72 -26,74 -26,82 C-24,86 -20,86 -20,84" fill="#888888"/>

    <!-- 側髮 -->
    <path d="M26,84 C30,80 32,86 30,92 C28,96 26,94 26,90" fill="url(#yuanHair)"/>

    <!-- 耳朵 -->
    <path d="M24,102 C28,98 30,104 28,110 C26,114 24,112 24,108" fill="url(#yuanFace)" stroke="#c0a880" stroke-width="0.5"/>

    <!-- ===== 眼睛（瞇眼忍痛） ===== -->
    <!-- 左眼（ry=2.5 瞇眼） -->
    <ellipse cx="-8" cy="108" rx="7" ry="2.5" fill="#fff"/>
    <ellipse cx="-9" cy="108.5" rx="4.5" ry="2" fill="#201828"/>
    <ellipse cx="-9.5" cy="108" rx="2.5" ry="1.5" fill="#0c0810"/>

    <!-- 右眼 -->
    <ellipse cx="8" cy="108" rx="7" ry="2.5" fill="#fff"/>
    <ellipse cx="7" cy="108.5" rx="4.5" ry="2" fill="#201828"/>
    <ellipse cx="6.5" cy="108" rx="2.5" ry="1.5" fill="#0c0810"/>

    <!-- 鼻子 -->
    <path d="M-14,116 C-15,120 -13,124" fill="none" stroke="#c0a080" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 長山羊鬚 -->
    <path d="M-6,134 C-4,140 -2,148 -3,154" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-2,134 C0,140 1,148 0,154" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M2,134 C4,140 4,148 3,154" fill="none" stroke="#a0a0a0" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 嘴巴（咬牙） -->
    <path d="M-10,131 C-6,131 0,131 4,131" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8,131 L-8,133" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
    <path d="M-4,131 L-4,133" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
    <path d="M0,131 L0,133" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
  </g>
</svg>
