<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 市集潑皮 — 吉卜力2頭身 面朝右（敵方）倒地/戰敗 -->
  <defs>
    <radialGradient id="mobThugFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#dcc090"/>
      <stop offset="100%" stop-color="#c0a870"/>
    </radialGradient>
    <linearGradient id="mobThugCloth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#7a6a50"/>
      <stop offset="100%" stop-color="#5a4a38"/>
    </linearGradient>
    <linearGradient id="mobThugPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4a38"/>
      <stop offset="100%" stop-color="#3a2a20"/>
    </linearGradient>
    <linearGradient id="mobThugHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#181008"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(78, 10)">
      <!-- 陰影（倒地拉長） -->
      <ellipse cx="-4" cy="228" rx="44" ry="4" fill="#000" opacity="0.08"/>

      <g transform="rotate(90, -4, 176)">
        <!-- ===== 腿（放鬆垂落） ===== -->
        <!-- 後腿 -->
        <ellipse cx="10" cy="200" rx="10" ry="16" fill="url(#mobThugPants)"/>
        <ellipse cx="9" cy="216" rx="11" ry="6" fill="#3a2818"/>
        <!-- 前腿 -->
        <ellipse cx="-12" cy="198" rx="11" ry="17" fill="url(#mobThugPants)"/>
        <ellipse cx="-13" cy="216" rx="12" ry="6" fill="#3a2818"/>

        <!-- ===== 身體（放鬆） ===== -->
        <ellipse cx="-2" cy="162" rx="22" ry="24" fill="url(#mobThugCloth)"/>

        <!-- 敞胸 -->
        <path d="M-14,142 L-4,158 L8,142" fill="none" stroke="#5a4a38" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M-10,144 L-4,154 L4,144" fill="url(#mobThugFace)" opacity="0.6"/>

        <!-- 破衣裂痕 -->
        <path d="M-10,154 L-7,164" fill="none" stroke="#3a2a20" stroke-width="0.8" opacity="0.4"/>

        <!-- 腰帶 -->
        <path d="M-22,178 Q-2,184 20,178" fill="none" stroke="#4a3820" stroke-width="5" stroke-linecap="round"/>

        <!-- ===== 右手臂（角色左手，自然垂落） ===== -->
        <path d="M18,148 Q30,158 28,172" fill="none" stroke="url(#mobThugCloth)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
        <circle cx="28" cy="174" r="5.5" fill="url(#mobThugFace)" opacity="0.85"/>

        <!-- ===== 左手臂（角色右手，自然垂落） ===== -->
        <path d="M-20,148 Q-34,156 -38,168" fill="none" stroke="url(#mobThugCloth)" stroke-width="10" stroke-linecap="round"/>
        <circle cx="-38" cy="170" r="5.5" fill="url(#mobThugFace)"/>

        <!-- ===== 短棍（脫手掉落在身旁） ===== -->
        <line x1="-66" y1="180" x2="-56" y2="204" stroke="#5a4028" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>

        <!-- ===== 大頭 ===== -->
        <!-- 後腦 -->
        <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#mobThugHair)"/>

        <!-- 臉 -->
        <path d="M-28,88 C-32,98 -30,116 -26,128 C-20,136 -8,140 2,138 C14,136 22,128 26,116 C30,104 28,90 22,82 C16,76 4,72 -4,74 C-16,76 -26,82 -28,88Z" fill="url(#mobThugFace)"/>

        <!-- 短髮 -->
        <path d="M-18,78 C-14,60 4,52 16,56 C24,60 28,72 24,82 C20,74 14,68 6,66 C0,64 -8,66 -14,72" fill="url(#mobThugHair)"/>
        <path d="M-26,86 C-30,76 -34,78 -32,88 C-30,92 -26,92 -26,88" fill="url(#mobThugHair)"/>
        <path d="M-22,82 C-26,70 -30,74 -28,84 C-26,88 -22,88 -22,84" fill="#2a2018"/>
        <path d="M22,82 C26,76 28,82 26,90 C24,94 22,92 22,88" fill="url(#mobThugHair)"/>

        <!-- 耳朵 -->
        <path d="M20,102 C24,98 26,104 24,112 C22,116 20,114 20,108" fill="url(#mobThugFace)" stroke="#b09060" stroke-width="0.5"/>

        <!-- ===== 眼睛（閉眼橫線） ===== -->
        <!-- 左眼 -->
        <line x1="-14" y1="108" x2="-6" y2="108" stroke="#3a3018" stroke-width="2" stroke-linecap="round"/>
        <!-- 右眼 -->
        <line x1="2" y1="108" x2="10" y2="108" stroke="#3a3018" stroke-width="2" stroke-linecap="round"/>

        <!-- 粗眉毛（放鬆） -->
        <path d="M-16,103 C-12,101 -8,102 -6,104" fill="none" stroke="#2a2018" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
        <path d="M8,104 C10,102 14,101 18,103" fill="none" stroke="#2a2018" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

        <!-- 鼻子 -->
        <path d="M-14,114 C-16,118 -12,122" fill="none" stroke="#b09068" stroke-width="1.5" stroke-linecap="round"/>

        <!-- 嘴巴（倒地一字線） -->
        <path d="M-12,130 C-6,130 2,130 6,130" fill="none" stroke="#704840" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>