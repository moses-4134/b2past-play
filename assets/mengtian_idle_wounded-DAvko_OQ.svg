<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 蒙恬 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體微傾、單手按腹、眼睛半瞇、槍下垂） -->
  <defs>
    <radialGradient id="mengtianFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8cca8"/>
      <stop offset="100%" stop-color="#d0ac88"/>
    </radialGradient>
    <linearGradient id="mengtianJacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#281810"/>
    </linearGradient>
    <linearGradient id="mengtianPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#302e26"/>
      <stop offset="100%" stop-color="#1a1814"/>
    </linearGradient>
    <linearGradient id="mengtianHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0e0a06"/>
    </linearGradient>
    <linearGradient id="mengtianSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
    <linearGradient id="mengtianArmor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#584838"/>
      <stop offset="100%" stop-color="#382820"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="222" rx="28" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（站穩但重心偏移） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="12" cy="200" rx="10" ry="16" fill="url(#mengtianPants)" transform="rotate(-3,12,200)"/>
    <ellipse cx="10" cy="216" rx="11" ry="6.5" fill="#3a2818"/>
    <!-- 前腿（左腿，微彎支撐） -->
    <ellipse cx="-14" cy="199" rx="10" ry="16" fill="url(#mengtianPants)" transform="rotate(8,-14,199)"/>
    <ellipse cx="-17" cy="216" rx="11" ry="6.5" fill="#3a2818"/>

    <!-- ===== 身體（前傾彎腰） ===== -->
    <ellipse cx="-2" cy="162" rx="26" ry="32" fill="url(#mengtianJacket)" transform="rotate(-8,-2,162)"/>

    <!-- 輕甲護片 -->
    <rect x="-16" y="154" width="20" height="12" rx="2.5" fill="url(#mengtianArmor)" stroke="#3a2818" stroke-width="0.5" opacity="0.7"/>

    <!-- 肩甲護肩 -->
    <rect x="-30" y="141" width="10" height="8" rx="2" fill="url(#mengtianArmor)" stroke="#3a2818" stroke-width="0.6"/>
    <rect x="16" y="141" width="10" height="8" rx="2" fill="url(#mengtianArmor)" stroke="#3a2818" stroke-width="0.6"/>

    <!-- 領口 -->
    <path d="M-10,143 L-5,155 L2,143" fill="none" stroke="#7a6048" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-26,185 Q-2,192 22,185" fill="none" stroke="#5a4030" stroke-width="5" stroke-linecap="round"/>
    <rect x="-7" y="183" width="8" height="8" rx="1.5" fill="#b09030" stroke="#8a7020" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手）按住腹部傷口 ===== -->
    <path d="M18,148 Q24,162 12,176" fill="none" stroke="url(#mengtianJacket)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <circle cx="12" cy="178" r="5" fill="url(#mengtianFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，持槍）下垂無力 ===== -->
    <path d="M-24,149 Q-42,158 -50,170" fill="none" stroke="url(#mengtianJacket)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-50" cy="172" r="5" fill="url(#mengtianFace)"/>

    <!-- ===== 槍（下垂，單手無力拖著） ===== -->
    <line x1="-50" y1="172" x2="-80" y2="220" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
    <!-- 槍頭 -->
    <path d="M-89,222 L-78,217 L-82,224 Z" fill="url(#mengtianSteel)" stroke="#888" stroke-width="0.5"/>
    <!-- 槍纓 -->
    <line x1="-78" y1="219" x2="-76" y2="215" stroke="#c04040" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-80" y1="221" x2="-78" y2="217" stroke="#c04040" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ===== 大頭（低頭、微喘） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="98" rx="39" ry="41" fill="url(#mengtianHair)"/>

    <!-- 臉（微低頭） -->
    <path d="M-28,90 C-32,102 -30,117 -24,126 C-18,134 -6,138 4,136 C14,134 22,128 26,118 C30,106 28,92 22,84 C16,78 4,74 -4,76 C-16,78 -26,84 -28,90Z" fill="url(#mengtianFace)"/>

    <!-- 腮紅（傷痛泛紅） -->
    <ellipse cx="-20" cy="122" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

    <!-- 頭髮頂部（烏黑飄逸） -->
    <path d="M-18,78 C-14,60 2,52 16,56 C28,60 34,72 30,82 C26,76 18,70 10,68 C2,66 -8,68 -14,74" fill="url(#mengtianHair)"/>

    <!-- 後方長髮 -->
    <path d="M24,86 C28,92 30,104 28,118 C26,126 24,130 22,128" fill="none" stroke="#0e0a06" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M26,90 C30,98 32,110 30,122 C28,128 26,126 26,120" fill="none" stroke="#0e0a06" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- 頭巾/束帶 -->
    <path d="M-24,82 C-16,70 4,64 22,68 C30,72 34,78 30,82" fill="none" stroke="#8a3020" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-24,82 C-26,86 -28,90 -26,92" fill="none" stroke="#8a3020" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 束帶飄帶 -->
    <path d="M30,82 C34,88 36,98 34,106" fill="none" stroke="#8a3020" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M32,84 C36,92 38,102 36,110" fill="none" stroke="#8a3020" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

    <!-- 前瀏海 -->
    <path d="M-26,90 C-30,78 -32,82 -32,90 C-30,94 -26,94 -26,92" fill="url(#mengtianHair)"/>
    <path d="M-22,84 C-26,74 -28,76 -28,86 C-26,90 -22,90 -22,88" fill="#0e0a06"/>
    <path d="M-18,82 C-20,74 -24,76 -22,84" fill="#0e0a06" opacity="0.8"/>

    <!-- 側髮 -->
    <path d="M22,84 C26,80 28,86 26,94 C24,98 22,96 22,90" fill="url(#mengtianHair)"/>

    <!-- 耳朵 -->
    <path d="M20,102 C24,98 26,104 24,110 C22,114 20,112 20,108" fill="url(#mengtianFace)" stroke="#c0a080" stroke-width="0.5"/>

    <!-- ===== 眼睛（左眼半瞇忍痛、右眼微睜） ===== -->
    <!-- 左眼（半瞇） -->
    <ellipse cx="-10" cy="108" rx="7" ry="3.5" fill="#fff"/>
    <ellipse cx="-11" cy="108.5" rx="4.5" ry="2.8" fill="#2a2018"/>
    <ellipse cx="-11.5" cy="108" rx="2.8" ry="1.8" fill="#0c0804"/>
    <circle cx="-13.5" cy="107" r="1.2" fill="#fff" opacity="0.8"/>

    <!-- 右眼（微瞇但還睜著） -->
    <ellipse cx="6" cy="108" rx="7" ry="4.5" fill="#fff"/>
    <ellipse cx="5" cy="108.5" rx="4.5" ry="3.5" fill="#2a2018"/>
    <ellipse cx="4.5" cy="108" rx="2.8" ry="2.2" fill="#0c0804"/>
    <circle cx="2.5" cy="106.5" r="1.5" fill="#fff" opacity="0.8"/>

    <!-- 眉間皺紋（忍痛） -->
    <path d="M-3,102 C-2,100 0,100 1,102" fill="none" stroke="#c0a080" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- 眉毛（銳利，皺起） -->
    <path d="M-18,102 C-14,100 -8,100 -4,102" fill="none" stroke="#1a1008" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,102 C4,100 9,100 12,102" fill="none" stroke="#1a1008" stroke-width="2" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M-16,115 C-17,119 -15,123 -13,125" fill="none" stroke="#b09070" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（咬牙忍痛） -->
    <path d="M-12,130 C-8,131 -2,131 2,130" fill="none" stroke="#906050" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M-12,130 C-13,132 -14,133" fill="none" stroke="#906050" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 汗滴（額頭） -->
    <path d="M-22,92 C-23,96 -22,100 -21,102" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-21" cy="103" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
  </g>
</svg>