<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 鐵面人 — 吉卜力2頭身 面朝右（敵方）瀕死待機（HP <30%：半跪、撐刀、喘息） -->
  <defs>
    <radialGradient id="ironMaskCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b880"/>
      <stop offset="100%" stop-color="#c09868"/>
    </radialGradient>
    <linearGradient id="ironMaskCArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#2a1c10"/>
    </linearGradient>
    <linearGradient id="ironMaskCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="ironMaskCMask" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#5a5a62"/>
      <stop offset="100%" stop-color="#4a4a50"/>
    </linearGradient>
    <linearGradient id="ironMaskCBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aaa"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <linearGradient id="ironMaskCHair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#3a2a18"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="210" rx="36" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪姿態） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="8" cy="192" rx="12" ry="12" fill="url(#ironMaskCPants)" transform="rotate(-20,8,192)"/>
      <ellipse cx="2" cy="204" rx="10" ry="5" fill="url(#ironMaskCPants)"/>
      <ellipse cx="0" cy="208" rx="12" ry="5" fill="#2a1c10"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-16" cy="188" rx="13" ry="16" fill="url(#ironMaskCPants)" transform="rotate(12,-16,188)"/>
      <ellipse cx="-20" cy="208" rx="14" ry="6" fill="#2a1c10"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="156" rx="29" ry="30" fill="url(#ironMaskCArmor)" transform="rotate(-14,-4,156)"/>

      <!-- 皮甲金屬鉚釘 -->
      <circle cx="-14" cy="148" r="2" fill="#6a6a70" stroke="#4a4a50" stroke-width="0.5"/>
      <circle cx="-8" cy="156" r="2" fill="#6a6a70" stroke="#4a4a50" stroke-width="0.5"/>
      <circle cx="4" cy="148" r="2" fill="#6a6a70" stroke="#4a4a50" stroke-width="0.5"/>

      <!-- 皮甲裂痕 -->
      <path d="M-10,150 L-6,164" fill="none" stroke="#1a1008" stroke-width="1" opacity="0.3"/>

      <!-- 毛皮護肩（左） -->
      <ellipse cx="-28" cy="136" rx="12" ry="8" fill="#5a4028" stroke="#4a3018" stroke-width="0.8"/>
      <path d="M-36,132 L-32,138 M-34,130 L-30,136" fill="none" stroke="#3a2818" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <!-- 毛皮護肩（右） -->
      <ellipse cx="24" cy="136" rx="12" ry="8" fill="#5a4028" stroke="#4a3018" stroke-width="0.8"/>
      <path d="M30,132 L26,138 M32,130 L28,136" fill="none" stroke="#3a2818" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

      <!-- 領口 -->
      <path d="M-14,135 L-4,150 L6,135" fill="none" stroke="#4a3820" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-30,180 Q-2,188 26,180" fill="none" stroke="#3a2818" stroke-width="6" stroke-linecap="round"/>
      <rect x="-8" y="178" width="10" height="10" rx="1.5" fill="#8a6830" stroke="#6a4820" stroke-width="0.5"/>

      <!-- ===== 左手臂（負x，撐在膝蓋上） ===== -->
      <path d="M-24,146 Q-34,160 -26,178" fill="none" stroke="url(#ironMaskCArmor)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
      <circle cx="-26" cy="180" r="6" fill="url(#ironMaskCFace)" opacity="0.85"/>

      <!-- ===== 右手臂（正x，大刀插地撐身體） ===== -->
      <path d="M26,142 Q44,150 52,162" fill="none" stroke="url(#ironMaskCArmor)" stroke-width="13" stroke-linecap="round"/>

      <!-- ===== 大刀（插入地面當支撐） ===== -->
      <!-- 握刀的手 -->
      <circle cx="52" cy="164" r="6.5" fill="url(#ironMaskCFace)"/>
      <!-- 刀護手 -->
      <line x1="46" y1="162" x2="56" y2="160" stroke="#806030" stroke-width="4" stroke-linecap="round"/>
      <!-- 刀柄 -->
      <line x1="52" y1="160" x2="50" y2="154" stroke="#4a3520" stroke-width="5" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="49" cy="152" r="3" fill="#806030"/>
      <!-- 刀身（插地） -->
      <path d="M54,168 L58,210 L62,216 L66,212 Q60,194 56,166 Z" fill="url(#ironMaskCBlade)" stroke="#666" stroke-width="0.5"/>
      <!-- 刀背線 -->
      <line x1="54" y1="168" x2="58" y2="210" stroke="#888" stroke-width="2" stroke-linecap="round"/>
      <!-- 刀插入地面效果 -->
      <ellipse cx="60" cy="214" rx="5" ry="2.5" fill="#5a4a30" opacity="0.4"/>

      <!-- ===== 大頭（低垂喘息） ===== -->
      <!-- 蓬亂後髮 -->
      <ellipse cx="0" cy="92" rx="40" ry="42" fill="url(#ironMaskCHair)"/>

      <!-- 蓬亂頭髮突出（更散亂） -->
      <path d="M-30,70 C-36,58 -40,64 -38,76" fill="url(#ironMaskCHair)" opacity="0.9"/>
      <path d="M-24,64 C-28,52 -34,56 -30,70" fill="url(#ironMaskCHair)" opacity="0.85"/>
      <path d="M-18,60 C-20,46 -26,50 -22,64" fill="url(#ironMaskCHair)" opacity="0.8"/>
      <path d="M26,74 C32,64 36,70 32,82" fill="url(#ironMaskCHair)" opacity="0.85"/>
      <path d="M30,68 C36,56 40,62 34,76" fill="url(#ironMaskCHair)" opacity="0.8"/>
      <!-- 散落髮絲 -->
      <path d="M-36,84 C-38,90 -36,94" fill="none" stroke="url(#ironMaskCHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <!-- 側髮 -->
      <path d="M24,86 C30,80 34,88 30,98 C28,104 24,100 24,94" fill="url(#ironMaskCHair)"/>
      <path d="M28,96 C34,92 36,102 32,112 C30,116 26,112 26,106" fill="url(#ironMaskCHair)" opacity="0.8"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-28,90 C-32,102 -30,118 -24,128 C-18,136 -6,140 4,138 C14,136 22,128 26,118 C30,106 28,92 22,84 C16,78 4,76 -4,78 C-16,80 -26,84 -28,90Z" fill="url(#ironMaskCFace)"/>

      <!-- 腮紅（因痛苦更明顯） -->
      <ellipse cx="-18" cy="126" rx="7" ry="4" fill="#d09090" opacity="0.4"/>

      <!-- 鐵面具（覆蓋上半臉，有裂痕） -->
      <path d="M-26,86 C-28,82 -22,76 -14,74 L10,74 C18,76 24,82 22,86 L22,108 C22,112 16,114 8,114 L-14,114 C-22,114 -26,112 -26,108 Z" fill="url(#ironMaskCMask)" stroke="#3a3a40" stroke-width="1"/>
      <!-- 面具眼孔 -->
      <path d="M-16,96 L-4,96 L-4,106 L-16,106 Z" fill="#1a1a20" rx="1"/>
      <path d="M2,96 L14,96 L14,106 L2,106 Z" fill="#1a1a20" rx="1"/>
      <!-- 面具鉚釘 -->
      <circle cx="-20" cy="90" r="1.5" fill="#7a7a82"/>
      <circle cx="16" cy="90" r="1.5" fill="#7a7a82"/>
      <circle cx="-20" cy="110" r="1.5" fill="#7a7a82"/>
      <circle cx="16" cy="110" r="1.5" fill="#7a7a82"/>
      <!-- 面具中線 -->
      <line x1="-2" y1="76" x2="-2" y2="114" stroke="#5a5a62" stroke-width="1.5" opacity="0.5"/>
      <!-- 面具裂紋（更深，多條） -->
      <path d="M6,78 L8,96 L14,106" fill="none" stroke="#8a8a92" stroke-width="1" opacity="0.7"/>
      <path d="M-12,80 L-10,92 L-6,100" fill="none" stroke="#8a8a92" stroke-width="0.8" opacity="0.5"/>

      <!-- 耳朵 -->
      <path d="M20,102 C24,98 26,104 24,112 C22,116 20,114 20,108" fill="url(#ironMaskCFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（雙眼瞇成線，強忍痛苦） ===== -->
      <!-- 左眼（幾乎閉上） -->
      <ellipse cx="-10" cy="101" rx="5" ry="1.8" fill="#fff"/>
      <ellipse cx="-11" cy="101.5" rx="3" ry="1.2" fill="#301410"/>
      <ellipse cx="-11.5" cy="101" rx="1.5" ry="0.8" fill="#180808"/>

      <!-- 右眼（勉強睜一線） -->
      <ellipse cx="8" cy="101" rx="5" ry="2" fill="#fff"/>
      <ellipse cx="7" cy="101.5" rx="3" ry="1.5" fill="#301410"/>
      <ellipse cx="6.5" cy="101" rx="1.5" ry="1" fill="#180808"/>
      <circle cx="5" cy="100.5" r="0.6" fill="#fff" opacity="0.5"/>

      <!-- 鼻子 -->
      <path d="M-12,118 C-14,122 -10,126" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 下巴鬍渣 -->
      <path d="M-16,132 C-10,133 -4,133 0,133 C6,133 10,132" fill="none" stroke="#5a4a38" stroke-width="0.8" opacity="0.4" stroke-dasharray="1,1.5"/>

      <!-- 下巴疤痕 -->
      <path d="M2,126 L6,134" fill="none" stroke="#a08060" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

      <!-- 嘴巴（喘息張開） -->
      <ellipse cx="-4" cy="131" rx="5" ry="4.5" fill="#703030"/>
      <path d="M-8,129 L0,129" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 汗滴（多顆） -->
      <path d="M-24,82 C-25,86 -24,92 -23,95" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-23" cy="96" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M22,84 C23,88 22,92" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="22" cy="93" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-8" cy="76" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>