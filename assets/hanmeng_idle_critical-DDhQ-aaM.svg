<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 韓猛「鐵面」— 吉卜力2頭身 面朝右（敵方）瀕死待機（HP <30%） -->
  <defs>
    <radialGradient id="hanmengCFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b088"/>
      <stop offset="100%" stop-color="#c0986a"/>
    </radialGradient>
    <linearGradient id="hanmengCArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a1818"/>
      <stop offset="100%" stop-color="#2a0c0c"/>
    </linearGradient>
    <linearGradient id="hanmengCPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1818"/>
      <stop offset="100%" stop-color="#1e0a0a"/>
    </linearGradient>
    <linearGradient id="hanmengCMask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 28)">
      <!-- 陰影（半跪更寬） -->
      <ellipse cx="-4" cy="210" rx="38" ry="6" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（半跪姿態） ===== -->
      <!-- 後腿（膝蓋撐地） -->
      <ellipse cx="12" cy="188" rx="12" ry="12" fill="url(#hanmengCPants)" transform="rotate(-20,12,188)"/>
      <ellipse cx="6" cy="200" rx="9" ry="5" fill="url(#hanmengCPants)"/>
      <ellipse cx="4" cy="204" rx="11" ry="6" fill="#2a1010"/>
      <!-- 前腿（彎曲支撐） -->
      <ellipse cx="-14" cy="184" rx="13" ry="16" fill="url(#hanmengCPants)" transform="rotate(12,-14,184)"/>
      <ellipse cx="-18" cy="204" rx="14" ry="6" fill="#2a1010"/>

      <!-- ===== 身體（大幅前傾） ===== -->
      <ellipse cx="-4" cy="150" rx="30" ry="30" fill="url(#hanmengCArmor)" transform="rotate(-14,-4,150)"/>

      <!-- 重甲鉚釘 -->
      <circle cx="-16" cy="138" r="1.5" fill="#806040" opacity="0.6"/>
      <circle cx="4" cy="138" r="1.5" fill="#806040" opacity="0.6"/>
      <circle cx="-20" cy="152" r="1.5" fill="#806040" opacity="0.5"/>
      <circle cx="12" cy="152" r="1.5" fill="#806040" opacity="0.5"/>

      <!-- 領口 -->
      <path d="M-16,130 L-8,142 L2,130" fill="none" stroke="#3a1414" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-32,174 Q-4,183 24,174" fill="none" stroke="#3a2010" stroke-width="7" stroke-linecap="round"/>
      <rect x="-10" y="172" width="10" height="10" rx="1" fill="#806030" stroke="#604020" stroke-width="0.5"/>

      <!-- ===== 空手臂（負x左肩，撐在膝蓋上） ===== -->
      <path d="M-26,142 Q-42,152 -34,176" fill="none" stroke="url(#hanmengCArmor)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
      <path d="M-34,162 Q-38,160 -36,168" fill="none" stroke="#505050" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-32" cy="178" r="6.5" fill="url(#hanmengCFace)" opacity="0.85"/>

      <!-- ===== 大頭（光頭鐵面，低垂喘息） ===== -->
      <!-- 光頭 -->
      <ellipse cx="-2" cy="92" rx="38" ry="40" fill="url(#hanmengCFace)"/>

      <!-- 臉（明顯低頭） -->
      <path d="M-32,86 C-36,98 -34,114 -28,126 C-22,134 -10,138 0,136 C10,134 20,126 24,114 C28,102 26,88 20,80 C14,74 2,70 -6,72 C-20,74 -30,78 -32,86Z" fill="url(#hanmengCFace)"/>

      <!-- 光頭反光 -->
      <ellipse cx="-6" cy="70" rx="16" ry="8" fill="#e8c8a0" opacity="0.12"/>

      <!-- 腮紅（痛苦更明顯） -->
      <ellipse cx="-22" cy="108" rx="7" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

      <!-- 耳朵 -->
      <path d="M20,98 C24,94 26,100 24,108 C22,112 20,110 20,104" fill="url(#hanmengCFace)" stroke="#b08858" stroke-width="0.5"/>

      <!-- ===== 鐵面罩 ===== -->
      <path d="M-28,110 C-30,116 -28,126 -24,132 C-18,138 -6,142 2,140 C10,138 18,132 22,122 C24,116 22,110 20,108 L-26,108 Z" fill="url(#hanmengCMask)" stroke="#383838" stroke-width="0.8"/>
      <circle cx="-18" cy="116" r="1.2" fill="#888" opacity="0.7"/>
      <circle cx="10" cy="116" r="1.2" fill="#888" opacity="0.7"/>
      <circle cx="-4" cy="136" r="1.2" fill="#888" opacity="0.7"/>
      <ellipse cx="-6" cy="128" rx="6" ry="2" fill="#2a2a2a" opacity="0.4"/>
      <line x1="-10" y1="128" x2="-2" y2="128" stroke="#505050" stroke-width="0.5" opacity="0.6"/>
      <line x1="-10" y1="126" x2="-2" y2="126" stroke="#505050" stroke-width="0.5" opacity="0.4"/>
      <line x1="-10" y1="130" x2="-2" y2="130" stroke="#505050" stroke-width="0.5" opacity="0.4"/>

      <!-- ===== 眼睛（雙眼瞇成線） ===== -->
      <!-- 左眼（幾乎閉上） -->
      <ellipse cx="-14" cy="102" rx="5.5" ry="2" fill="#fff"/>
      <ellipse cx="-15" cy="102.5" rx="3.5" ry="1.5" fill="#2a0c08"/>
      <ellipse cx="-15.5" cy="102" rx="2" ry="1" fill="#1a0400"/>

      <!-- 右眼（勉強睜一線） -->
      <ellipse cx="4" cy="102" rx="5.5" ry="2.5" fill="#fff"/>
      <ellipse cx="3" cy="102.5" rx="3.5" ry="2" fill="#2a0c08"/>
      <ellipse cx="2.5" cy="102" rx="2" ry="1.2" fill="#1a0400"/>
      <circle cx="1" cy="101" r="0.8" fill="#fff" opacity="0.5"/>

      <!-- 眉間皺紋（深刻） -->
      <path d="M-5,95 C-3,93 0,93 2,95" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M-6,97 C-4,95.5 -1,95.5 1,97" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

      <!-- 粗眉毛 -->
      <path d="M-20,96 C-16,93 -12,95 -10,97" fill="none" stroke="#4a3020" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M8,97 C10,95 14,93 18,96" fill="none" stroke="#4a3020" stroke-width="2.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-18,106 C-20,110 -16,112" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- ===== 武器手臂（正x右肩，鐵鞭插地撐身體） ===== -->
      <path d="M26,142 Q48,134 58,146" fill="none" stroke="url(#hanmengCArmor)" stroke-width="14" stroke-linecap="round"/>
      <path d="M44,140 Q50,140 54,144" fill="none" stroke="#505050" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 鐵鞭（插入地面當支撐） ===== -->
      <circle cx="58" cy="148" r="6.5" fill="url(#hanmengCFace)"/>
      <!-- 鞭身（直插地面） -->
      <path d="M60,154 Q62,176 62,206" fill="none" stroke="#505050" stroke-width="5" stroke-linecap="round"/>
      <path d="M61,156 Q63,174 63,204" fill="none" stroke="#888" stroke-width="1" opacity="0.3"/>
      <!-- 鞭插入地面效果 -->
      <ellipse cx="62" cy="206" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>

      <!-- 汗滴（多顆） -->
      <path d="M-26,80 C-27,84 -26,90 -25,93" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-25" cy="94" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
      <path d="M18,82 C19,86 18,90" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="18" cy="91" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
      <!-- 額頭汗 -->
      <ellipse cx="-8" cy="72" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
    </g>
  </g>
</svg>