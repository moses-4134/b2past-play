<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 森林小徑 — 吉卜力風格：高大樹木、斑駁光影、苔蘚岩石 地平線 y=180（33%） -->
  <defs>
    <!-- 森林天空（透過樹冠的光） -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6a30"/>
      <stop offset="40%" stop-color="#6a8a48"/>
      <stop offset="100%" stop-color="#8aaa60"/>
    </linearGradient>
    <!-- 地面（泥土小徑） -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a6a48"/>
      <stop offset="100%" stop-color="#5a4a30"/>
    </linearGradient>
    <!-- 光束 -->
    <linearGradient id="lightBeam" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ffe880" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffe880" stop-opacity="0"/>
    </linearGradient>
    <!-- 樹幹漸層 -->
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a3820"/>
      <stop offset="50%" stop-color="#5a4828"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
  </defs>

  <!-- ===== 背景（深綠森林） ===== -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- ===== 遠景樹冠層（密集圓潤樹葉） ===== -->
  <circle cx="50" cy="40" r="60" fill="#3a5a20" opacity="0.8"/>
  <circle cx="130" cy="30" r="70" fill="#2a4a18" opacity="0.75"/>
  <circle cx="220" cy="50" r="55" fill="#4a6a28" opacity="0.7"/>
  <circle cx="310" cy="20" r="65" fill="#3a5a20" opacity="0.8"/>
  <circle cx="400" cy="40" r="58" fill="#2a4a18" opacity="0.75"/>
  <circle cx="480" cy="15" r="72" fill="#3a5a20" opacity="0.78"/>
  <circle cx="570" cy="35" r="60" fill="#4a6a28" opacity="0.72"/>
  <circle cx="650" cy="25" r="68" fill="#2a4a18" opacity="0.8"/>
  <circle cx="740" cy="45" r="55" fill="#3a5a20" opacity="0.75"/>
  <circle cx="830" cy="20" r="65" fill="#4a6a28" opacity="0.78"/>
  <circle cx="920" cy="40" r="60" fill="#2a4a18" opacity="0.8"/>

  <!-- 中層樹冠 -->
  <circle cx="80" cy="80" r="50" fill="#4a7a30" opacity="0.6"/>
  <circle cx="200" cy="90" r="45" fill="#3a6a25" opacity="0.55"/>
  <circle cx="350" cy="70" r="55" fill="#4a7a30" opacity="0.6"/>
  <circle cx="500" cy="85" r="48" fill="#3a6a25" opacity="0.58"/>
  <circle cx="650" cy="75" r="52" fill="#4a7a30" opacity="0.6"/>
  <circle cx="800" cy="90" r="46" fill="#3a6a25" opacity="0.55"/>
  <circle cx="950" cy="80" r="50" fill="#4a7a30" opacity="0.58"/>

  <!-- ===== 大樹幹（左） ===== -->
  <rect x="60" y="40" width="50" height="175" fill="url(#trunk)" rx="5"/>
  <!-- 樹皮紋理 -->
  <path d="M70,80 Q80,100 72,120 Q82,140 74,160 Q84,180 76,200" fill="none" stroke="#3a2818" stroke-width="1" opacity="0.4"/>
  <path d="M95,60 Q100,90 92,110 Q102,140 94,170" fill="none" stroke="#3a2818" stroke-width="0.8" opacity="0.35"/>
  <!-- 左樹枝 -->
  <path d="M60,120 Q30,100 10,80" fill="none" stroke="#4a3820" stroke-width="8" stroke-linecap="round"/>
  <path d="M85,80 Q60,50 40,30" fill="none" stroke="#4a3820" stroke-width="6" stroke-linecap="round"/>
  <!-- 左樹枝葉 -->
  <circle cx="10" cy="70" r="28" fill="#3a6a20" opacity="0.7"/>
  <circle cx="35" cy="25" r="24" fill="#4a7a28" opacity="0.65"/>

  <!-- ===== 大樹幹（右） ===== -->
  <rect x="830" y="30" width="55" height="185" fill="url(#trunk)" rx="5"/>
  <path d="M845,70 Q855,95 847,115 Q857,140 849,165 Q859,190 851,215" fill="none" stroke="#3a2818" stroke-width="1" opacity="0.4"/>
  <!-- 右樹枝 -->
  <path d="M885,100 Q910,75 940,60" fill="none" stroke="#4a3820" stroke-width="7" stroke-linecap="round"/>
  <path d="M860,70 Q890,40 920,20" fill="none" stroke="#4a3820" stroke-width="6" stroke-linecap="round"/>
  <circle cx="945" cy="50" r="30" fill="#3a6a20" opacity="0.7"/>
  <circle cx="925" cy="15" r="25" fill="#4a7a28" opacity="0.65"/>

  <!-- ===== 中景樹幹 ===== -->
  <rect x="280" y="80" width="30" height="100" fill="#5a4828" opacity="0.6" rx="3"/>
  <rect x="620" y="60" width="35" height="120" fill="#4a3820" opacity="0.55" rx="3"/>

  <!-- ===== 光束從樹冠間灑下 ===== -->
  <polygon points="380,0 450,180 350,180" fill="url(#lightBeam)"/>
  <polygon points="550,0 600,180 500,180" fill="url(#lightBeam)" opacity="0.7"/>
  <polygon points="200,0 240,150 170,150" fill="url(#lightBeam)" opacity="0.5"/>
  <polygon points="780,0 820,170 750,170" fill="url(#lightBeam)" opacity="0.6"/>

  <!-- ===== 地面（y=180 開始，佔下方 2/3） ===== -->
  <rect x="0" y="180" width="960" height="360" fill="url(#ground)"/>

  <!-- 小徑（較淺色泥土路） -->
  <path d="M350,180 Q380,215 400,255 Q430,315 460,375 Q480,415 500,540" fill="none" stroke="#8a7a58" stroke-width="80" opacity="0.4" stroke-linecap="round"/>
  <path d="M600,180 Q580,215 560,255 Q540,315 520,375 Q510,415 505,540" fill="none" stroke="#8a7a58" stroke-width="60" opacity="0.3" stroke-linecap="round"/>

  <!-- 落葉 -->
  <ellipse cx="200" cy="195" rx="4" ry="2" fill="#b08030" opacity="0.5" transform="rotate(30,200,195)"/>
  <ellipse cx="450" cy="215" rx="3.5" ry="2" fill="#a07028" opacity="0.45" transform="rotate(-20,450,215)"/>
  <ellipse cx="680" cy="205" rx="4" ry="2.5" fill="#c09038" opacity="0.4" transform="rotate(45,680,205)"/>
  <ellipse cx="350" cy="265" rx="3" ry="1.8" fill="#906828" opacity="0.4" transform="rotate(15,350,265)"/>
  <ellipse cx="580" cy="295" rx="4" ry="2" fill="#b08030" opacity="0.35" transform="rotate(-35,580,295)"/>

  <!-- ===== 苔蘚岩石 ===== -->
  <!-- 左邊岩石 -->
  <ellipse cx="150" cy="200" rx="35" ry="20" fill="#6a6a5a" opacity="0.7"/>
  <ellipse cx="148" cy="193" rx="30" ry="12" fill="#7a7a6a" opacity="0.6"/>
  <!-- 苔蘚 -->
  <ellipse cx="140" cy="191" rx="15" ry="6" fill="#5a8a38" opacity="0.5"/>
  <ellipse cx="160" cy="195" rx="10" ry="5" fill="#4a7a30" opacity="0.45"/>

  <!-- 右邊岩石 -->
  <ellipse cx="760" cy="205" rx="28" ry="18" fill="#6a6a5a" opacity="0.65"/>
  <ellipse cx="758" cy="199" rx="22" ry="10" fill="#7a7a6a" opacity="0.55"/>
  <ellipse cx="752" cy="197" rx="12" ry="5" fill="#5a8a38" opacity="0.45"/>

  <!-- ===== 前景草叢與蕨類 ===== -->
  <path d="M0,180 Q8,155 16,180 Q24,150 32,180 Q38,157 44,180" fill="none" stroke="#3a6a20" stroke-width="2" opacity="0.6"/>
  <path d="M900,180 Q908,153 916,180 Q922,155 928,180 Q936,157 944,180" fill="none" stroke="#3a6a20" stroke-width="2" opacity="0.55"/>

  <!-- 蕨類植物（左前） -->
  <path d="M20,195 Q10,175 0,165" fill="none" stroke="#4a8a30" stroke-width="2" opacity="0.5"/>
  <path d="M20,195 Q15,170 5,155" fill="none" stroke="#3a7a25" stroke-width="1.5" opacity="0.45"/>
  <path d="M20,195 Q25,173 35,163" fill="none" stroke="#4a8a30" stroke-width="2" opacity="0.5"/>

  <!-- ===== 空氣中的粒子（森林灰塵、光點） ===== -->
  <circle cx="400" cy="150" r="2" fill="#ffe880" opacity="0.5"/>
  <circle cx="420" cy="180" r="1.5" fill="#ffe880" opacity="0.4"/>
  <circle cx="380" cy="200" r="1.8" fill="#ffe880" opacity="0.35"/>
  <circle cx="550" cy="120" r="1.5" fill="#ffe880" opacity="0.45"/>
  <circle cx="530" cy="160" r="1.2" fill="#ffe880" opacity="0.4"/>
  <circle cx="220" cy="140" r="1" fill="#ffe880" opacity="0.35"/>
  <circle cx="790" cy="130" r="1.5" fill="#ffe880" opacity="0.4"/>
  <circle cx="300" cy="230" r="1.3" fill="#fff8d0" opacity="0.3"/>
  <circle cx="650" cy="200" r="1" fill="#fff8d0" opacity="0.3"/>
  <circle cx="480" cy="240" r="1.5" fill="#ffe880" opacity="0.3"/>
  <circle cx="150" cy="180" r="0.8" fill="#fff8d0" opacity="0.25"/>
  <circle cx="850" cy="190" r="1.2" fill="#fff8d0" opacity="0.28"/>

  <!-- ===== 整體氛圍覆蓋（綠色調） ===== -->
  <rect width="960" height="540" fill="#4a6a20" opacity="0.06"/>
</svg>