<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 蔡璋 — 吉卜力2頭身 面朝右（敵方）攻擊（袖箭暗器射出） -->
  <defs>
    <radialGradient id="dubiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0d0c0"/>
      <stop offset="100%" stop-color="#d0c0a8"/>
    </radialGradient>
    <linearGradient id="dubiRobe" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0c0c18"/>
    </linearGradient>
    <linearGradient id="dubiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="dubiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
    <linearGradient id="dubiNeedle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0c0c8"/>
      <stop offset="100%" stop-color="#808088"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-10" cy="225" rx="30" ry="5" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（微前踏，暗算姿態） ===== -->
      <ellipse cx="14" cy="202" rx="9" ry="16" fill="url(#dubiPants)" transform="rotate(-8,14,202)"/>
      <ellipse cx="16" cy="218" rx="10" ry="6" fill="#1a1a20"/>
      <ellipse cx="-14" cy="199" rx="10" ry="17" fill="url(#dubiPants)" transform="rotate(8,-14,199)"/>
      <ellipse cx="-18" cy="216" rx="11" ry="6" fill="#1a1a20"/>

      <!-- ===== 身體（微前傾，暗器射出重心） ===== -->
      <ellipse cx="-4" cy="158" rx="26" ry="30" fill="url(#dubiRobe)" transform="rotate(-6,-4,158)"/>

      <!-- 內袍領口 -->
      <path d="M-14,134 L-6,150 L4,134" fill="none" stroke="#4a1a1a" stroke-width="3" stroke-linejoin="round"/>

      <!-- 衣褶 -->
      <path d="M-10,148 L-8,168" fill="none" stroke="#0a0a14" stroke-width="0.8" opacity="0.4"/>
      <path d="M4,146 L6,164" fill="none" stroke="#0a0a14" stroke-width="0.8" opacity="0.3"/>

      <!-- 銅腰帶 -->
      <path d="M-28,178 Q-4,186 20,178" fill="none" stroke="#8a7030" stroke-width="5" stroke-linecap="round"/>
      <rect x="-8" y="176" width="7" height="7" rx="1" fill="#8a7030" stroke="#6a5020" stroke-width="0.5"/>

      <!-- ===== 大頭（冷酷暗算表情） ===== -->
      <ellipse cx="0" cy="92" rx="38" ry="40" fill="url(#dubiHair)"/>

      <!-- 臉 -->
      <path d="M-30,86 C-34,98 -32,116 -26,128 C-20,136 -6,140 2,138 C12,136 22,128 26,116 C30,104 28,90 22,82 C16,76 4,72 -4,74 C-18,76 -28,80 -30,86Z" fill="url(#dubiFace)"/>

      <!-- 黑眼圈 -->
      <ellipse cx="-12" cy="110" rx="8" ry="4" fill="#c0b098" opacity="0.3"/>
      <ellipse cx="8" cy="110" rx="8" ry="4" fill="#c0b098" opacity="0.3"/>

      <!-- 官帽 -->
      <rect x="-24" y="58" width="44" height="14" rx="2" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="0.5"/>
      <rect x="-20" y="52" width="36" height="8" rx="1" fill="#0c0c0c"/>
      <path d="M-24,64 L-38,60 L-36,66 Z" fill="#0a0a0a"/>
      <path d="M20,64 L34,60 L32,66 Z" fill="#0a0a0a"/>

      <!-- 頭髮 -->
      <path d="M-20,76 C-16,64 0,58 14,62 C24,66 28,76 26,82 C22,76 14,72 6,70 C-2,68 -12,70 -18,74" fill="url(#dubiHair)"/>
      <path d="M22,84 C26,80 28,88 26,96 C24,102 22,98 22,94" fill="url(#dubiHair)"/>

      <!-- 耳朵 -->
      <path d="M22,100 C26,96 28,102 26,110 C24,114 22,112 22,106" fill="url(#dubiFace)" stroke="#b0a088" stroke-width="0.5"/>

      <!-- ===== 眼（瞇眼冷酷瞄準） ===== -->
      <ellipse cx="-12" cy="106" rx="6" ry="3.5" fill="#fff"/>
      <ellipse cx="-13" cy="106.5" rx="3.5" ry="3" fill="#2a1a10"/>
      <ellipse cx="-13.5" cy="106" rx="2" ry="2" fill="#0a0400"/>
      <circle cx="-15" cy="105" r="1.2" fill="#fff" opacity="0.5"/>

      <ellipse cx="8" cy="106" rx="6" ry="3.5" fill="#fff"/>
      <ellipse cx="7" cy="106.5" rx="3.5" ry="3" fill="#2a1a10"/>
      <ellipse cx="6.5" cy="106" rx="2" ry="2" fill="#0a0400"/>
      <circle cx="5" cy="105" r="1.2" fill="#fff" opacity="0.5"/>

      <!-- 薄眉 -->
      <path d="M-18,100 C-14,98 -10,100 -8,102" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M12,102 C14,100 18,98 20,100" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-6,112 C-8,118 -4,122" fill="none" stroke="#b0a080" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（陰險冷笑） -->
      <path d="M-10,130 C-4,128 2,128 6,130" fill="none" stroke="#705040" stroke-width="2" stroke-linecap="round"/>
      <path d="M6,130 C8,129 9,128" fill="none" stroke="#705040" stroke-width="1" opacity="0.5"/>

      <!-- 山羊鬍 -->
      <line x1="-4" y1="134" x2="-5" y2="140" stroke="#2a2a2a" stroke-width="0.8" opacity="0.5"/>
      <line x1="-2" y1="134" x2="-2" y2="141" stroke="#2a2a2a" stroke-width="0.8" opacity="0.6"/>
      <line x1="0" y1="134" x2="1" y2="140" stroke="#2a2a2a" stroke-width="0.8" opacity="0.5"/>

      <!-- ===== 畫面右側手臂（角色左手，自然後擺） ===== -->
      <path d="M24,144 Q36,152 38,166" fill="none" stroke="url(#dubiRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="38" cy="168" r="5" fill="url(#dubiFace)" opacity="0.85"/>

      <!-- ===== 畫面左側手臂（角色右手，前伸射出袖箭） ===== -->
      <path d="M-22,144 Q-46,134 -58,130" fill="none" stroke="url(#dubiRobe)" stroke-width="10" stroke-linecap="round"/>
      <!-- 寬袖口（暗器射出處） -->
      <ellipse cx="-58" cy="130" rx="7" ry="5" fill="#101020" transform="rotate(-6,-58,130)"/>
      <!-- 伸出的手 -->
      <circle cx="-60" cy="132" r="5" fill="url(#dubiFace)"/>

      <!-- ===== 袖箭（3支暗針從袖口射出） ===== -->
      <!-- 暗針1（上） -->
      <line x1="-64" y1="127" x2="-92" y2="120" stroke="url(#dubiNeedle)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-92" y1="120" x2="-96" y2="118.5" stroke="#90a0b0" stroke-width="1.2"/>
      <!-- 暗針2（中） -->
      <line x1="-64" y1="131" x2="-94" y2="128" stroke="url(#dubiNeedle)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-94" y1="128" x2="-98" y2="127.5" stroke="#90a0b0" stroke-width="1.2"/>
      <!-- 暗針3（下） -->
      <line x1="-64" y1="135" x2="-90" y2="137" stroke="url(#dubiNeedle)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-90" y1="137" x2="-94" y2="137.5" stroke="#90a0b0" stroke-width="1.2"/>

      <!-- 蛛絲殘影（間諜風格） -->
      <path d="M-72,123 Q-78,121 -84,120" fill="none" stroke="#8090a0" stroke-width="0.4" opacity="0.3"/>
      <path d="M-74,130 Q-80,129 -86,128" fill="none" stroke="#8090a0" stroke-width="0.4" opacity="0.25"/>
      <path d="M-70,136 Q-76,137 -82,137" fill="none" stroke="#8090a0" stroke-width="0.4" opacity="0.2"/>
    </g>
  </g>
</svg>