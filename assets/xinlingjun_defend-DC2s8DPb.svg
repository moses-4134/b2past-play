<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 信陵君 — 吉卜力2頭身 側面朝左 防禦（劍橫舉格擋） -->
  <defs>
    <radialGradient id="xinlingFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0e0d0"/>
      <stop offset="100%" stop-color="#e0c8b0"/>
    </radialGradient>
    <linearGradient id="xinlingRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a1860"/>
      <stop offset="100%" stop-color="#2a1048"/>
    </linearGradient>
    <linearGradient id="xinlingPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1450"/>
      <stop offset="100%" stop-color="#1a0c30"/>
    </linearGradient>
    <linearGradient id="xinlingHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1020"/>
      <stop offset="100%" stop-color="#0c0610"/>
    </linearGradient>
    <linearGradient id="xinlingBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dde0e8"/>
      <stop offset="100%" stop-color="#8890a0"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="225" rx="30" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（低蹲防禦） ===== -->
    <!-- 後腿（正x側） -->
    <ellipse cx="12" cy="204" rx="10" ry="17" fill="url(#xinlingPants)" transform="rotate(-5,12,204)"/>
    <ellipse cx="10" cy="218" rx="11" ry="7" fill="#1a0c30"/>
    <!-- 前腿（負x側，前踏穩住） -->
    <ellipse cx="-16" cy="202" rx="10" ry="18" fill="url(#xinlingPants)" transform="rotate(6,-16,202)"/>
    <ellipse cx="-18" cy="218" rx="11" ry="7" fill="#1a0c30"/>

    <!-- ===== 身體（微蹲，重心降低） ===== -->
    <ellipse cx="-2" cy="164" rx="26" ry="32" fill="url(#xinlingRobe)" transform="rotate(-5,-2,164)"/>

    <!-- 金邊裝飾 -->
    <path d="M-26,147 Q-26,167 -22,187" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.7"/>
    <path d="M20,147 Q22,167 20,187" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.7"/>

    <!-- 領口 -->
    <path d="M-12,142 L-4,158 L4,142" fill="none" stroke="#c8a840" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 輕甲暗示 -->
    <path d="M-16,150 Q-2,156 12,150" fill="none" stroke="#4a3868" stroke-width="2" opacity="0.4"/>

    <!-- 腰帶 -->
    <path d="M-26,183 Q-2,191 22,183" fill="none" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
    <rect x="-7" y="181" width="8" height="8" rx="2" fill="#4a8a50" stroke="#c8a840" stroke-width="1"/>

    <!-- ===== 右側手臂（正x，非武器手，護胸） ===== -->
    <path d="M18,150 Q30,156 28,168" fill="none" stroke="url(#xinlingRobe)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <path d="M26,164 Q28,166 28,170" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.6"/>
    <circle cx="28" cy="170" r="5" fill="url(#xinlingFace)" opacity="0.85"/>

    <!-- ===== 頭部 ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#xinlingHair)"/>

    <!-- 臉 -->
    <path d="M-28,88 C-32,100 -30,116 -24,126 C-18,134 -8,138 2,136 C12,134 20,126 24,116 C28,104 26,92 20,84 C14,78 4,74 -6,76 C-16,78 -26,82 -28,88Z" fill="url(#xinlingFace)"/>

    <!-- 頭髮頂部 -->
    <path d="M-18,78 C-14,60 0,52 14,56 C24,60 30,72 26,82 C22,76 14,70 6,68 C-2,66 -10,68 -14,74" fill="url(#xinlingHair)"/>

    <!-- 瀏海 -->
    <path d="M-26,88 C-30,78 -32,80 -32,88 C-30,92 -26,92 -26,90" fill="url(#xinlingHair)"/>
    <path d="M-22,82 C-24,72 -28,74 -28,84 C-26,88 -22,88 -22,86" fill="#1a1020"/>

    <!-- 髮髻 -->
    <ellipse cx="2" cy="56" rx="9" ry="7" fill="url(#xinlingHair)"/>
    <path d="M-4,54 C-2,46 6,46 8,54" fill="url(#xinlingHair)"/>
    <circle cx="2" cy="50" r="3" fill="#4a8a50" stroke="#3a7a40" stroke-width="0.5"/>
    <circle cx="2" cy="50" r="1.2" fill="#6aba60" opacity="0.6"/>

    <!-- 飄逸髮絲 -->
    <path d="M18,80 C22,76 24,82 22,90 C20,96 18,94 18,88" fill="url(#xinlingHair)"/>
    <path d="M20,90 C24,88 26,96 24,104 C22,110 18,106 18,100" fill="url(#xinlingHair)" opacity="0.8"/>

    <!-- 耳朵 -->
    <path d="M18,102 C22,98 24,104 22,110 C20,114 18,112 18,108" fill="url(#xinlingFace)" stroke="#d8c0a0" stroke-width="0.5"/>

    <!-- ===== 眼睛（警覺凝視） ===== -->
    <!-- 左眼 -->
    <ellipse cx="-12" cy="108" rx="6.5" ry="6" fill="#fff"/>
    <ellipse cx="-13" cy="109" rx="4" ry="4.5" fill="#1a1830"/>
    <ellipse cx="-14" cy="108" rx="2.2" ry="2.5" fill="#0a0818"/>
    <circle cx="-15.5" cy="106" r="1.5" fill="#fff" opacity="0.8"/>

    <!-- 右眼 -->
    <ellipse cx="4" cy="108" rx="6.5" ry="6" fill="#fff"/>
    <ellipse cx="3" cy="109" rx="4" ry="4.5" fill="#1a1830"/>
    <ellipse cx="2" cy="108" rx="2.2" ry="2.5" fill="#0a0818"/>
    <circle cx="0.5" cy="106" r="1.5" fill="#fff" opacity="0.8"/>

    <!-- 鼻子 -->
    <path d="M-16,116 C-17,120 -15,124" fill="none" stroke="#d8c0a0" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（緊閉，嚴肅） -->
    <path d="M-11,130 C-7,130 -2,130 2,130" fill="none" stroke="#906050" stroke-width="2" stroke-linecap="round"/>

    <!-- ===== 左側手臂（負x，持劍手，橫舉格擋） ===== -->
    <path d="M-24,148 Q-40,138 -52,132" fill="none" stroke="url(#xinlingRobe)" stroke-width="11" stroke-linecap="round"/>
    <path d="M-44,136 Q-50,134 -52,134" fill="none" stroke="#c8a840" stroke-width="1.5" opacity="0.6"/>

    <!-- ===== 劍（負x側，橫舉格擋姿態） ===== -->
    <!-- 握劍的手 -->
    <circle cx="-54" cy="134" r="5.5" fill="url(#xinlingFace)"/>
    <!-- 劍身（直線，~50.6px，略微向上橫舉） -->
    <line x1="-58" y1="130" x2="-106" y2="118" stroke="url(#xinlingBlade)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 劍身亮線 -->
    <line x1="-58" y1="130" x2="-106" y2="118" stroke="#eef0f8" stroke-width="1.2" opacity="0.4"/>
    <!-- 劍尖 -->
    <line x1="-106" y1="118" x2="-108" y2="116" stroke="#ccd0d8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 護手 -->
    <line x1="-60" y1="136" x2="-52" y2="130" stroke="#c8a840" stroke-width="3" stroke-linecap="round"/>
    <!-- 劍柄 -->
    <line x1="-52" y1="135" x2="-50" y2="140" stroke="#3a2028" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 柄底 -->
    <circle cx="-49" cy="142" r="2.5" fill="#c8a840"/>
  </g>
</svg>