<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 巫醫/軍醫 — 施治：舉骨杖、綠光治癒爆發 面朝右（敵方） -->
  <defs>
    <radialGradient id="medSFace" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#cbb89a"/>
      <stop offset="100%" stop-color="#b09a78"/>
    </radialGradient>
    <linearGradient id="medSRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#54603c"/>
      <stop offset="100%" stop-color="#2c341e"/>
    </linearGradient>
    <linearGradient id="medSRobeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4228"/>
      <stop offset="100%" stop-color="#1c2212"/>
    </linearGradient>
    <linearGradient id="medSStaff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6a44"/>
      <stop offset="100%" stop-color="#4c3a24"/>
    </linearGradient>
    <radialGradient id="medSBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b0ffc8" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#60e090" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60e090" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <ellipse cx="-2" cy="192" rx="30" ry="5" fill="#000" opacity="0.12"/>

      <!-- 法袍下擺 -->
      <path d="M-26,188 C-24,150 -18,128 -4,126 C10,128 16,150 20,188 C10,192 -14,192 -26,188 Z" fill="url(#medSRobe)"/>
      <path d="M-14,150 L-16,186 M0,148 L0,188 M12,152 L14,186" fill="none" stroke="#1c2212" stroke-width="1.2" opacity="0.5"/>
      <path d="M-26,188 C-10,193 8,193 20,188" fill="none" stroke="#1c2212" stroke-width="2" stroke-linecap="round"/>

      <!-- 身體/肩 -->
      <ellipse cx="-2" cy="132" rx="22" ry="20" fill="url(#medSRobe)"/>
      <path d="M-22,122 C-14,132 8,132 18,122 C16,130 6,134 -2,134 C-12,134 -18,130 -22,122 Z" fill="url(#medSRobeDark)"/>

      <!-- 左手臂（前伸灑藥/引氣） -->
      <path d="M-16,126 Q-32,122 -42,128" fill="none" stroke="url(#medSRobe)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-46" cy="130" r="4.5" fill="url(#medSFace)"/>
      <circle cx="-52" cy="130" r="10" fill="url(#medSBurst)"/>
      <circle cx="-52" cy="130" r="3" fill="#c8ffd8"/>
      <!-- 灑落的藥點 -->
      <circle cx="-58" cy="122" r="1.6" fill="#90f0b0" opacity="0.8"/>
      <circle cx="-60" cy="136" r="1.4" fill="#90f0b0" opacity="0.7"/>

      <!-- 右手臂（高舉骨杖） -->
      <path d="M16,124 Q30,108 36,92" fill="none" stroke="url(#medSRobe)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="38" cy="90" r="4.5" fill="url(#medSFace)"/>

      <!-- 骨杖（高舉、綠光大爆） -->
      <line x1="40" y1="120" x2="42" y2="46" stroke="url(#medSStaff)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="42" cy="38" r="26" fill="url(#medSBurst)"/>
      <path d="M36,46 C32,34 38,26 44,28 C50,26 54,34 50,46" fill="none" stroke="#e8e0d0" stroke-width="3" stroke-linecap="round"/>
      <path d="M42,44 L40,30 M42,44 L44,30 M42,44 L42,28" stroke="#5a8a4a" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="42" cy="34" r="5" fill="#90f0b0"/>
      <circle cx="40" cy="32" r="1.8" fill="#fff" opacity="0.9"/>
      <!-- 放射治癒光 -->
      <path d="M42,14 L42,22 M62,36 L54,36 M22,36 L30,36 M56,20 L50,26 M28,20 L34,26" stroke="#90f0b0" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>

      <!-- 大頭 -->
      <ellipse cx="0" cy="100" rx="31" ry="33" fill="url(#medSRobeDark)"/>
      <path d="M-18,92 C-22,98 -20,114 -14,122 C-8,128 0,130 6,128 C14,126 18,118 18,108 C18,98 14,88 8,86 C-2,84 -14,86 -18,92 Z" fill="url(#medSFace)"/>
      <path d="M-18,92 C-8,86 10,86 18,94" fill="none" stroke="#c9a24a" stroke-width="3" stroke-linecap="round"/>
      <path d="M-9,100 l-2,12 M9,100 l2,12" stroke="#e8e0d0" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

      <!-- 眼（作法睜大） -->
      <ellipse cx="-6" cy="105" rx="5" ry="4.5" fill="#fff"/>
      <ellipse cx="-6" cy="106" rx="2.8" ry="2.8" fill="#2a3a20"/>
      <ellipse cx="8" cy="105" rx="5" ry="4.5" fill="#fff"/>
      <ellipse cx="8" cy="106" rx="2.8" ry="2.8" fill="#2a3a20"/>
      <path d="M-11,100 C-9,101 -4,101 -2,103" fill="none" stroke="#3a2c1c" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M3,103 C5,101 10,101 12,100" fill="none" stroke="#3a2c1c" stroke-width="1.3" stroke-linecap="round"/>
      <!-- 張口誦祝 -->
      <ellipse cx="1" cy="121" rx="3" ry="4" fill="#3a2018"/>
      <path d="M-8,118 C-4,124 8,124 12,118 C10,122 4,125 2,125 C-2,125 -6,122 -8,118 Z" fill="#d8d0c0" opacity="0.7"/>

      <!-- 治癒符 -->
      <text x="-42" y="106" font-size="11" fill="#60e090" opacity="0.6" font-family="serif">癒</text>
      <circle cx="54" cy="116" r="1.8" fill="#90f0b0" opacity="0.55"/>
    </g>
  </g>
</svg>
