<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 韓猛「鐵面」— 吉卜力2頭身 面朝右（敵方）受傷待機（HP 30~60%） -->
  <defs>
    <radialGradient id="hanmengWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b088"/>
      <stop offset="100%" stop-color="#c0986a"/>
    </radialGradient>
    <linearGradient id="hanmengWArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4a1818"/>
      <stop offset="100%" stop-color="#2a0c0c"/>
    </linearGradient>
    <linearGradient id="hanmengWPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1818"/>
      <stop offset="100%" stop-color="#1e0a0a"/>
    </linearGradient>
    <linearGradient id="hanmengWMask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
    <linearGradient id="hanmengWWhip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-4" cy="225" rx="36" ry="5" fill="#000" opacity="0.1"/>

      <!-- ===== 腿（重心偏移） ===== -->
      <!-- 後腿 -->
      <ellipse cx="14" cy="202" rx="12" ry="17" fill="url(#hanmengWPants)" transform="rotate(-3,14,202)"/>
      <ellipse cx="12" cy="218" rx="13" ry="7" fill="#2a1010"/>
      <!-- 前腿（微彎支撐） -->
      <ellipse cx="-14" cy="200" rx="13" ry="18" fill="url(#hanmengWPants)" transform="rotate(8,-14,200)"/>
      <ellipse cx="-16" cy="218" rx="14" ry="7" fill="#2a1010"/>

      <!-- ===== 身體（前傾彎腰） ===== -->
      <ellipse cx="-2" cy="162" rx="30" ry="32" fill="url(#hanmengWArmor)" transform="rotate(-8,-2,162)"/>

      <!-- 重甲鉚釘 -->
      <circle cx="-14" cy="148" r="1.5" fill="#806040" opacity="0.6"/>
      <circle cx="6" cy="148" r="1.5" fill="#806040" opacity="0.6"/>
      <circle cx="-18" cy="162" r="1.5" fill="#806040" opacity="0.5"/>
      <circle cx="14" cy="162" r="1.5" fill="#806040" opacity="0.5"/>

      <!-- 領口 -->
      <path d="M-14,137 L-6,148 L4,137" fill="none" stroke="#3a1414" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 腰帶 -->
      <path d="M-30,183 Q-2,192 26,183" fill="none" stroke="#3a2010" stroke-width="7" stroke-linecap="round"/>
      <rect x="-8" y="181" width="10" height="10" rx="1" fill="#806030" stroke="#604020" stroke-width="0.5"/>

      <!-- ===== 空手臂（負x左肩，按住腹部傷口） ===== -->
      <path d="M-24,148 Q-38,154 -30,174" fill="none" stroke="url(#hanmengWArmor)" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
      <path d="M-30,160 Q-34,158 -30,166" fill="none" stroke="#505050" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-28" cy="176" r="6.5" fill="url(#hanmengWFace)" opacity="0.85"/>

      <!-- ===== 大頭（光頭鐵面，微低頭） ===== -->
      <!-- 光頭 -->
      <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#hanmengWFace)"/>

      <!-- 臉 -->
      <path d="M-30,88 C-34,100 -32,116 -26,128 C-20,136 -8,140 2,138 C12,136 22,128 26,116 C30,104 28,90 22,82 C16,76 4,72 -4,74 C-18,76 -28,82 -30,88Z" fill="url(#hanmengWFace)"/>

      <!-- 光頭反光 -->
      <ellipse cx="-4" cy="72" rx="16" ry="8" fill="#e8c8a0" opacity="0.15"/>

      <!-- 腮紅（傷痛泛紅） -->
      <ellipse cx="-20" cy="110" rx="6" ry="3" fill="#e0a0a0" opacity="0.25"/>

      <!-- 耳朵 -->
      <path d="M22,100 C26,96 28,102 26,110 C24,114 22,112 22,106" fill="url(#hanmengWFace)" stroke="#b08858" stroke-width="0.5"/>

      <!-- ===== 鐵面罩 ===== -->
      <path d="M-26,112 C-28,118 -26,128 -22,134 C-16,140 -4,144 4,142 C12,140 20,134 24,124 C26,118 24,112 22,110 L-24,110 Z" fill="url(#hanmengWMask)" stroke="#383838" stroke-width="0.8"/>
      <circle cx="-16" cy="118" r="1.2" fill="#888" opacity="0.7"/>
      <circle cx="12" cy="118" r="1.2" fill="#888" opacity="0.7"/>
      <circle cx="-2" cy="138" r="1.2" fill="#888" opacity="0.7"/>
      <ellipse cx="-4" cy="130" rx="6" ry="2" fill="#2a2a2a" opacity="0.4"/>
      <line x1="-8" y1="130" x2="0" y2="130" stroke="#505050" stroke-width="0.5" opacity="0.6"/>
      <line x1="-8" y1="128" x2="0" y2="128" stroke="#505050" stroke-width="0.5" opacity="0.4"/>
      <line x1="-8" y1="132" x2="0" y2="132" stroke="#505050" stroke-width="0.5" opacity="0.4"/>

      <!-- ===== 眼睛（左眼半瞇忍痛） ===== -->
      <!-- 左眼（半瞇） -->
      <ellipse cx="-12" cy="104" rx="6" ry="3" fill="#fff"/>
      <ellipse cx="-13" cy="105" rx="4" ry="2.5" fill="#2a0c08"/>
      <ellipse cx="-13.5" cy="104" rx="2.2" ry="1.6" fill="#1a0400"/>
      <circle cx="-15" cy="103" r="0.8" fill="#fff" opacity="0.4"/>

      <!-- 右眼（微瞇但還睜著） -->
      <ellipse cx="6" cy="104" rx="6" ry="4.5" fill="#fff"/>
      <ellipse cx="5" cy="105" rx="4" ry="3.5" fill="#2a0c08"/>
      <ellipse cx="4.5" cy="104" rx="2.2" ry="2" fill="#1a0400"/>
      <circle cx="3" cy="103" r="0.8" fill="#fff" opacity="0.4"/>

      <!-- 眉間皺紋 -->
      <path d="M-3,98 C-2,96 0,96 1,98" fill="none" stroke="#c0a080" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

      <!-- 粗眉毛 -->
      <path d="M-18,98 C-14,95 -10,97 -8,99" fill="none" stroke="#4a3020" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M10,99 C12,97 16,95 20,98" fill="none" stroke="#4a3020" stroke-width="2.8" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-16,108 C-18,112 -14,114" fill="none" stroke="#b09068" stroke-width="1.2" stroke-linecap="round"/>

      <!-- ===== 武器手臂（正x右肩，持鐵鞭下垂） ===== -->
      <path d="M28,148 Q46,146 56,156" fill="none" stroke="url(#hanmengWArmor)" stroke-width="14" stroke-linecap="round"/>
      <path d="M42,150 Q48,150 52,154" fill="none" stroke="#505050" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 鐵鞭（下垂無力） ===== -->
      <circle cx="56" cy="158" r="6.5" fill="url(#hanmengWFace)"/>
      <path d="M58,164 Q60,190 60,220" fill="none" stroke="#505050" stroke-width="5" stroke-linecap="round"/>
      <path d="M59,166 Q61,188 61,218" fill="none" stroke="#888" stroke-width="1" opacity="0.3"/>

      <!-- 汗滴 -->
      <path d="M-24,82 C-25,86 -24,90 -23,92" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-23" cy="93" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
    </g>
  </g>
</svg>