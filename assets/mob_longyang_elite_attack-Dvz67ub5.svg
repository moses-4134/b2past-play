<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 龍陽君精兵 — 攻擊（前斬，劍從正x揮向負x） -->
  <defs>
    <radialGradient id="lyEliteFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8c0a0"/>
      <stop offset="100%" stop-color="#c0a880"/>
    </radialGradient>
    <linearGradient id="lyEliteArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a3a28"/>
      <stop offset="100%" stop-color="#0a2a18"/>
    </linearGradient>
    <linearGradient id="lyElitePants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2018"/>
      <stop offset="100%" stop-color="#101810"/>
    </linearGradient>
    <linearGradient id="lyEliteHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <linearGradient id="lyEliteBlade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d0d8e0"/>
      <stop offset="100%" stop-color="#909898"/>
    </linearGradient>
    <linearGradient id="lyEliteHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a28"/>
      <stop offset="100%" stop-color="#0e2e1a"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影 -->
      <ellipse cx="-10" cy="200" rx="26" ry="4" fill="#000" opacity="0.12"/>

      <!-- ===== 腿（前跨步） ===== -->
      <!-- 後腿 -->
      <ellipse cx="12" cy="180" rx="8" ry="15" fill="url(#lyElitePants)" transform="rotate(-8,12,180)"/>
      <ellipse cx="10" cy="194" rx="9" ry="6" fill="#1a1810"/>
      <!-- 前腿 -->
      <ellipse cx="-16" cy="176" rx="9" ry="16" fill="url(#lyElitePants)" transform="rotate(12,-16,176)"/>
      <ellipse cx="-20" cy="192" rx="10" ry="6" fill="#1a1810"/>

      <!-- ===== 身體（前傾攻擊） ===== -->
      <ellipse cx="-4" cy="148" rx="22" ry="26" fill="url(#lyEliteArmor)" transform="rotate(-10,-4,148)"/>

      <!-- 胸甲紋路 -->
      <path d="M-12,138 L-2,150 L8,138" fill="none" stroke="#0a2a18" stroke-width="1.2" opacity="0.5"/>

      <!-- 領口 -->
      <path d="M-12,130 L-5,140 L2,130" fill="none" stroke="#0e2e1a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 青銅肩甲 -->
      <ellipse cx="-22" cy="132" rx="8" ry="5" fill="#8a7030" stroke="#6a5820" stroke-width="0.5" transform="rotate(-18,-22,132)"/>
      <ellipse cx="14" cy="134" rx="8" ry="5" fill="#8a7030" stroke="#6a5820" stroke-width="0.5" transform="rotate(5,14,134)" opacity="0.85"/>

      <!-- 腰帶 -->
      <path d="M-22,168 Q-4,174 16,168" fill="none" stroke="#4a3820" stroke-width="3" stroke-linecap="round"/>
      <rect x="-6" y="167" width="8" height="6" rx="1" fill="#8a7030" stroke="#6a5820" stroke-width="0.5"/>

      <!-- ===== 右手臂（角色左手，後擺平衡） ===== -->
      <path d="M14,134 Q28,126 34,120" fill="none" stroke="url(#lyEliteArmor)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
      <circle cx="34" cy="118" r="4.5" fill="url(#lyEliteFace)" opacity="0.85"/>

      <!-- ===== 左手臂（角色右手，前伸揮劍） ===== -->
      <path d="M-20,132 Q-42,118 -52,112" fill="none" stroke="url(#lyEliteArmor)" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== 劍（向負x方向斬出） ===== -->
      <!-- 劍身 ~50.6px，水平向負x延伸 -->
      <line x1="-56" y1="110" x2="-106" y2="104" stroke="url(#lyEliteBlade)" stroke-width="2.8" stroke-linecap="round"/>
      <!-- 劍格 -->
      <line x1="-52" y1="107" x2="-54" y2="115" stroke="#8a7030" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 劍柄 -->
      <line x1="-50" y1="112" x2="-44" y2="116" stroke="#4a3020" stroke-width="3" stroke-linecap="round"/>
      <!-- 握劍的手 -->
      <circle cx="-52" cy="112" r="5" fill="url(#lyEliteFace)"/>

      <!-- 斬擊特效 -->
      <path d="M-60,100 Q-80,96 -108,100" fill="none" stroke="#d0d8e0" stroke-width="1" opacity="0.4"/>
      <path d="M-60,114 Q-82,118 -108,112" fill="none" stroke="#d0d8e0" stroke-width="0.8" opacity="0.3"/>

      <!-- ===== 大頭（前傾） ===== -->
      <ellipse cx="-2" cy="96" rx="32" ry="34" fill="url(#lyEliteHair)" transform="rotate(-5,-2,96)"/>

      <!-- 臉 -->
      <path d="M-20,88 C-24,98 -22,110 -16,120 C-10,128 -2,132 4,130 C10,128 14,122 18,112 C22,100 20,88 14,80 C8,74 2,72 -4,74 C-12,76 -18,82 -20,88Z" fill="url(#lyEliteFace)" transform="rotate(-5,-2,104)"/>

      <!-- 短髮 -->
      <path d="M-14,78 C-10,62 4,54 14,58 C22,62 26,72 22,82 C18,74 12,68 6,66 C0,64 -6,66 -12,72" fill="url(#lyEliteHair)"/>

      <!-- 頭盔 -->
      <path d="M-24,78 C-20,66 -6,60 8,62 C16,64 24,70 22,78" fill="url(#lyEliteHelmet)" stroke="#0e2e1a" stroke-width="0.5"/>
      <path d="M-26,78 C-26,76 -24,74 -20,76 L24,76 C26,76 26,80 24,80 L-24,80 C-26,80 -26,78 -26,78Z" fill="#8a7030" stroke="#6a5820" stroke-width="0.5"/>
      <circle cx="0" cy="62" r="3" fill="#8a7030" stroke="#6a5820" stroke-width="0.5"/>

      <!-- 短瀏海 -->
      <path d="M-20,82 C-24,76 -26,80 -26,86 C-24,90 -20,88 -20,84" fill="url(#lyEliteHair)"/>

      <!-- 側髮 -->
      <path d="M16,84 C22,78 24,86 22,94 C20,98 16,96 16,92" fill="url(#lyEliteHair)"/>

      <!-- 耳朵 -->
      <path d="M14,102 C18,98 20,104 18,110 C16,114 14,112 14,108" fill="url(#lyEliteFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（堅定果斷） ===== -->
      <!-- 左眼 -->
      <ellipse cx="-8" cy="106" rx="5.5" ry="4.5" fill="#fff"/>
      <ellipse cx="-9" cy="107" rx="3.2" ry="3.5" fill="#2a3028"/>
      <ellipse cx="-10" cy="106" rx="1.8" ry="2" fill="#1a1810"/>
      <circle cx="-11.5" cy="105" r="0.7" fill="#fff" opacity="0.5"/>

      <!-- 右眼 -->
      <ellipse cx="6" cy="106" rx="5.5" ry="4.5" fill="#fff"/>
      <ellipse cx="5" cy="107" rx="3.2" ry="3.5" fill="#2a3028"/>
      <ellipse cx="4" cy="106" rx="1.8" ry="2" fill="#1a1810"/>
      <circle cx="2.5" cy="105" r="0.7" fill="#fff" opacity="0.5"/>

      <!-- 眉毛（怒目） -->
      <path d="M-12,100 C-8,98 -6,99 -4,101" fill="none" stroke="#2a2420" stroke-width="2" stroke-linecap="round"/>
      <path d="M8,101 C10,99 12,98 16,100" fill="none" stroke="#2a2420" stroke-width="2" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-12,114 C-14,118 -10,122" fill="none" stroke="#a08858" stroke-width="1.2" stroke-linecap="round"/>

      <!-- 嘴巴（張嘴喝斥） -->
      <ellipse cx="-2" cy="128" rx="6" ry="4" fill="#4a2020"/>
      <path d="M-8,126 C-4,124 2,124 6,126" fill="none" stroke="#704840" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>