<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- 戰場 — 吉卜力風格：開闊戰場、煙塵、旗幟兵器、烽火焦土 地平線 y=180（33%） -->
  <defs>
    <!-- 天空（煙霧瀰漫） -->
    <linearGradient id="warSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6a50"/>
      <stop offset="30%" stop-color="#b08a68"/>
      <stop offset="70%" stop-color="#c8a880"/>
      <stop offset="100%" stop-color="#d0b890"/>
    </linearGradient>
    <!-- 焦土地面 -->
    <linearGradient id="scorched" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a5a40"/>
      <stop offset="100%" stop-color="#4a3a28"/>
    </linearGradient>
    <!-- 煙塵 -->
    <radialGradient id="smoke1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a09080" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a09080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="smoke2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a7a68" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8a7a68" stop-opacity="0"/>
    </radialGradient>
    <!-- 火焰光暈 -->
    <radialGradient id="fireGlow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ff6620" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="960" height="540" fill="url(#warSky)"/>

  <!-- 煙雲 -->
  <g opacity="0.6">
    <ellipse cx="200" cy="60" rx="120" ry="40" fill="#9a8a78"/>
    <ellipse cx="140" cy="55" rx="80" ry="35" fill="#8a7a68"/>
    <ellipse cx="280" cy="65" rx="90" ry="30" fill="#9a8a78"/>
  </g>
  <g opacity="0.5">
    <ellipse cx="650" cy="45" rx="130" ry="38" fill="#9a8a78"/>
    <ellipse cx="580" cy="50" rx="80" ry="30" fill="#8a7a68"/>
    <ellipse cx="740" cy="48" rx="70" ry="28" fill="#9a8a78"/>
  </g>
  <g opacity="0.4">
    <ellipse cx="450" cy="80" rx="100" ry="30" fill="#a09080"/>
  </g>

  <!-- ===== 遠景煙塵 ===== -->
  <ellipse cx="150" cy="120" rx="120" ry="50" fill="url(#smoke1)"/>
  <ellipse cx="800" cy="110" rx="140" ry="55" fill="url(#smoke2)"/>
  <ellipse cx="480" cy="100" rx="100" ry="45" fill="url(#smoke1)"/>

  <!-- ===== 遠景山丘（焦土色） ===== -->
  <path d="M0,148 Q120,118 250,138 Q400,105 550,130 Q700,95 850,122 L960,110 L960,172 L0,172 Z" fill="#7a6a50" opacity="0.5"/>
  <path d="M0,160 Q150,138 300,155 Q480,128 650,148 Q800,125 960,140 L960,180 L0,180 Z" fill="#6a5a40" opacity="0.45"/>

  <!-- ===== 遠處烽火 ===== -->
  <!-- 左側烽火 -->
  <rect x="120" y="105" width="6" height="40" fill="#4a3a28"/>
  <ellipse cx="123" cy="100" rx="10" ry="12" fill="#ff6620" opacity="0.5"/>
  <ellipse cx="123" cy="96" rx="7" ry="8" fill="#ffaa30" opacity="0.4"/>
  <ellipse cx="123" cy="85" rx="12" ry="15" fill="url(#smoke1)" opacity="0.4"/>

  <!-- 右側烽火 -->
  <rect x="820" y="100" width="6" height="42" fill="#4a3a28"/>
  <ellipse cx="823" cy="95" rx="10" ry="12" fill="#ff6620" opacity="0.5"/>
  <ellipse cx="823" cy="90" rx="7" ry="8" fill="#ffaa30" opacity="0.4"/>
  <ellipse cx="823" cy="80" rx="12" ry="15" fill="url(#smoke2)" opacity="0.4"/>

  <!-- ===== 中景：插在地上的旗幟和兵器 ===== -->
  <!-- 旗幟1（破損） -->
  <line x1="300" y1="130" x2="300" y2="180" stroke="#5a4030" stroke-width="3"/>
  <path d="M303,130 L340,138 L335,155 L303,148 Z" fill="#8a2020" opacity="0.7"/>
  <path d="M335,145 L338,150 L335,155" fill="none" stroke="#8a2020" stroke-width="1" opacity="0.5"/>

  <!-- 旗幟2 -->
  <line x1="650" y1="140" x2="650" y2="180" stroke="#5a4030" stroke-width="3"/>
  <path d="M653,140 L690,148 L685,168 L653,160 Z" fill="#2050a0" opacity="0.6"/>

  <!-- 插地之矛 -->
  <line x1="450" y1="150" x2="440" y2="180" stroke="#808080" stroke-width="2.5"/>
  <path d="M448,145 L453,150 L448,155 L443,150 Z" fill="#a0a0a0"/>

  <!-- 插地之劍 -->
  <line x1="550" y1="160" x2="560" y2="180" stroke="#909090" stroke-width="2"/>
  <rect x="546" y="157" width="8" height="3" fill="#a08030" rx="1"/>

  <!-- 破盾 -->
  <ellipse cx="500" cy="175" rx="15" ry="12" fill="#7a5a30" opacity="0.5" transform="rotate(-20,500,175)"/>

  <!-- ===== 焦土地面（y=180 開始，佔下方 2/3） ===== -->
  <rect x="0" y="180" width="960" height="360" fill="url(#scorched)"/>
  <!-- 地面紋理 -->
  <ellipse cx="200" cy="245" rx="80" ry="5" fill="#5a4a30" opacity="0.3"/>
  <ellipse cx="500" cy="295" rx="100" ry="6" fill="#5a4a30" opacity="0.25"/>
  <ellipse cx="750" cy="265" rx="70" ry="4" fill="#5a4a30" opacity="0.25"/>
  <ellipse cx="350" cy="365" rx="90" ry="5" fill="#5a4a30" opacity="0.2"/>
  <ellipse cx="650" cy="395" rx="80" ry="5" fill="#5a4a30" opacity="0.18"/>

  <!-- 焦痕 -->
  <ellipse cx="300" cy="225" rx="40" ry="15" fill="#3a2a18" opacity="0.3"/>
  <ellipse cx="700" cy="315" rx="50" ry="12" fill="#3a2a18" opacity="0.25"/>
  <ellipse cx="150" cy="335" rx="35" ry="10" fill="#3a2a18" opacity="0.2"/>

  <!-- 牆地交界 -->
  <line x1="0" y1="180" x2="960" y2="180" stroke="#4a3a28" stroke-width="2"/>

  <!-- ===== 地面火焰殘跡 ===== -->
  <circle cx="300" cy="215" r="40" fill="url(#fireGlow)" opacity="0.4"/>
  <ellipse cx="300" cy="210" rx="5" ry="10" fill="#ff6620" opacity="0.3"/>
  <ellipse cx="300" cy="207" rx="3" ry="6" fill="#ffaa30" opacity="0.2"/>

  <!-- ===== 空氣粒子（灰燼與塵土） ===== -->
  <circle cx="100" cy="120" r="1.5" fill="#c8b898" opacity="0.35"/>
  <circle cx="300" cy="100" r="1.2" fill="#c8b898" opacity="0.3"/>
  <circle cx="500" cy="140" r="1" fill="#c8b898" opacity="0.25"/>
  <circle cx="700" cy="110" r="1.3" fill="#c8b898" opacity="0.3"/>
  <circle cx="850" cy="90" r="1.5" fill="#c8b898" opacity="0.28"/>
  <circle cx="200" cy="135" r="1" fill="#a09080" opacity="0.25"/>
  <circle cx="400" cy="155" r="1.2" fill="#a09080" opacity="0.2"/>
  <circle cx="600" cy="115" r="0.8" fill="#a09080" opacity="0.22"/>
  <circle cx="780" cy="165" r="1.3" fill="#a09080" opacity="0.2"/>
  <circle cx="450" cy="215" r="1" fill="#c8b898" opacity="0.15"/>
  <circle cx="250" cy="265" r="1.2" fill="#a09080" opacity="0.12"/>
  <circle cx="680" cy="235" r="0.8" fill="#c8b898" opacity="0.13"/>

  <!-- ===== 整體氛圍覆蓋（煙塵調） ===== -->
  <rect width="960" height="540" fill="#a08060" opacity="0.05"/>
</svg>