<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 李斯 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體微傾、單手按腹、眼睛半瞇、杖下垂） -->
  <defs>
    <radialGradient id="lisiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f4e8d8"/>
      <stop offset="100%" stop-color="#e4d0bc"/>
    </radialGradient>
    <linearGradient id="lisiRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a3848"/>
      <stop offset="100%" stop-color="#2a2838"/>
    </linearGradient>
    <linearGradient id="lisiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2e3a"/>
      <stop offset="100%" stop-color="#1a1a24"/>
    </linearGradient>
    <linearGradient id="lisiHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#181010"/>
      <stop offset="100%" stop-color="#0c0606"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 10)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="221" rx="24" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（站穩但重心偏移） ===== -->
    <!-- 後腿（右腿） -->
    <ellipse cx="8" cy="194" rx="8" ry="16" fill="url(#lisiPants)" transform="rotate(-3,8,194)"/>
    <ellipse cx="6" cy="214" rx="9" ry="6.5" fill="#2a2030"/>
    <!-- 前腿（左腿，微彎支撐） -->
    <ellipse cx="-12" cy="193" rx="8.5" ry="17" fill="url(#lisiPants)" transform="rotate(8,-12,193)"/>
    <ellipse cx="-15" cy="214" rx="9.5" ry="6.5" fill="#2a2030"/>

    <!-- ===== 身體（前傾彎腰） ===== -->
    <ellipse cx="-2" cy="160" rx="22" ry="28" fill="url(#lisiRobe)" transform="rotate(-8,-2,160)"/>

    <!-- 領口 -->
    <path d="M-10,145 L-5,157 L0,145" fill="none" stroke="#505060" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 衣襟線 -->
    <path d="M-5,157 L-5,178" fill="none" stroke="#505060" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

    <!-- 腰帶 -->
    <path d="M-22,180 Q-2,187 18,180" fill="none" stroke="#1a1a24" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-3" cy="184" r="2.5" fill="#88aa88" stroke="#6a8a6a" stroke-width="0.5"/>
    <!-- 玉佩垂飾 -->
    <line x1="-3" y1="187" x2="-3" y2="194" stroke="#6a8a6a" stroke-width="1" stroke-linecap="round"/>
    <ellipse cx="-3" cy="195" rx="2" ry="1.5" fill="#88aa88" opacity="0.7"/>

    <!-- ===== 畫面右側手臂（角色左手）按住腹部傷口 ===== -->
    <path d="M16,146 Q22,158 12,172" fill="none" stroke="url(#lisiRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="12" cy="174" r="4.5" fill="url(#lisiFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，持杖）下垂無力 ===== -->
    <path d="M-20,149 Q-34,146 -42,148" fill="none" stroke="url(#lisiRobe)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-42" cy="150" r="4.5" fill="url(#lisiFace)"/>

    <!-- ===== 文人杖（下垂傾斜，無力拖著） ===== -->
    <line x1="-42" y1="150" x2="-50" y2="220" stroke="#4a3020" stroke-width="4" stroke-linecap="round"/>
    <!-- 頂端銅色裝飾圓球 -->
    <circle cx="-42" cy="150" r="4" fill="#b08040" stroke="#906830" stroke-width="0.5"/>
    <circle cx="-43" cy="148" r="1.2" fill="#d4a860" opacity="0.6"/>

    <!-- ===== 寬袖裝飾 ===== -->
    <path d="M-20,149 C-24,152 -28,156 -26,160" fill="url(#lisiRobe)" opacity="0.4"/>
    <path d="M16,146 C20,150 22,154 20,158" fill="url(#lisiRobe)" opacity="0.3"/>

    <!-- ===== 大頭（低頭、微喘） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="0" cy="96" rx="38" ry="40" fill="url(#lisiHair)"/>

    <!-- 臉（微低頭） -->
    <path d="M-24,90 C-28,100 -26,116 -20,126 C-14,134 -4,138 4,136 C12,134 16,126 20,116 C24,104 22,92 16,84 C10,78 2,76 -4,78 C-14,80 -22,84 -24,90Z" fill="url(#lisiFace)"/>

    <!-- 腮紅（傷痛泛紅） -->
    <ellipse cx="-16" cy="122" rx="6" ry="3.5" fill="#e0a0a0" opacity="0.35"/>

    <!-- 頭髮頂部 -->
    <path d="M-18,80 C-14,60 2,52 16,56 C28,60 34,72 30,84 C26,78 18,72 10,70 C2,68 -8,70 -14,76" fill="url(#lisiHair)"/>

    <!-- 瀏海（整齊但微亂） -->
    <path d="M-24,90 C-30,78 -32,82 -34,90 C-32,96 -26,98 -24,94" fill="url(#lisiHair)"/>
    <path d="M-20,84 C-24,72 -28,76 -28,86 C-26,92 -20,92 -20,88" fill="#181010"/>
    <path d="M-16,80 C-18,70 -22,72 -22,82 C-20,88 -16,88 -16,84" fill="url(#lisiHair)" opacity="0.9"/>

    <!-- 高冠 -->
    <rect x="-4" y="46" width="16" height="22" rx="2" fill="url(#lisiHair)" stroke="#181010" stroke-width="0.5"/>
    <path d="M-4,68 C-2,52 4,44 12,46 C18,50 18,60 16,68" fill="url(#lisiHair)"/>
    <!-- 冠帶底部束帶 -->
    <ellipse cx="4" cy="70" rx="8" ry="3" fill="#181010" stroke="#0c0606" stroke-width="0.5"/>
    <!-- 黑色冠帶（垂在後方） -->
    <path d="M12,70 C16,76 18,86 16,96" fill="none" stroke="#181010" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M14,70 C18,78 20,88 18,98" fill="none" stroke="#0c0606" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- 側髮（整齊） -->
    <path d="M20,86 C24,82 26,88 24,96 C22,102 20,100 20,94" fill="url(#lisiHair)"/>
    <path d="M22,94 C24,92 26,98 24,106 C22,112 20,110 20,104" fill="url(#lisiHair)" opacity="0.8"/>

    <!-- 耳朵 -->
    <path d="M18,104 C22,100 24,106 22,112 C20,116 18,114 18,110" fill="url(#lisiFace)" stroke="#dcc8b0" stroke-width="0.5"/>

    <!-- ===== 眼睛（左眼半瞇忍痛、右眼微睜） ===== -->
    <!-- 左眼（半瞇） -->
    <ellipse cx="-10" cy="110" rx="6.5" ry="4" fill="#fff"/>
    <ellipse cx="-11" cy="110.5" rx="4" ry="3" fill="#181820"/>
    <ellipse cx="-11.5" cy="110" rx="2.5" ry="2" fill="#080810"/>
    <circle cx="-13" cy="109" r="1" fill="#fff" opacity="0.7"/>

    <!-- 右眼（微瞇但還睜著） -->
    <ellipse cx="4" cy="110" rx="6.5" ry="5.5" fill="#fff"/>
    <ellipse cx="3" cy="110.5" rx="4" ry="4" fill="#181820"/>
    <ellipse cx="2.5" cy="110" rx="2.5" ry="2.5" fill="#080810"/>
    <circle cx="1" cy="108" r="1.3" fill="#fff" opacity="0.7"/>

    <!-- 眉間皺紋（忍痛） -->
    <path d="M-3,103 C-2,101 0,101 1,103" fill="none" stroke="#c0a080" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- 鼻子 -->
    <path d="M-16,118 C-17,122 -15,126" fill="none" stroke="#d8c0a8" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 八字鬍（文人鬍） -->
    <path d="M-14,130 C-12,133 -6,136 -2,135" fill="none" stroke="#181010" stroke-width="1" stroke-linecap="round"/>
    <path d="M-2,130 C0,133 6,136 10,135" fill="none" stroke="#181010" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴（咬牙忍痛） -->
    <path d="M-10,130 C-6,131 -1,131 3,130" fill="none" stroke="#806050" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-10,130 C-11,132 -12,133" fill="none" stroke="#806050" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 汗滴（額頭） -->
    <path d="M-20,92 C-21,96 -20,100 -19,102" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-19" cy="103" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>
  </g>
</svg>