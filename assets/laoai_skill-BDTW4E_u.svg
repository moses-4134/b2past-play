<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 嫪毐 — 吉卜力2頭身 面朝右（敵方）技能「斬馬橫掃」 -->
  <defs>
    <radialGradient id="laoaiFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d8b080"/>
      <stop offset="100%" stop-color="#c09868"/>
    </radialGradient>
    <linearGradient id="laoaiArmor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#4a2a18"/>
    </linearGradient>
    <linearGradient id="laoaiPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#221810"/>
    </linearGradient>
    <linearGradient id="laoaiBlade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#999"/>
      <stop offset="100%" stop-color="#ccc"/>
    </linearGradient>
    <linearGradient id="laoaiHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a08838"/>
      <stop offset="100%" stop-color="#8a7030"/>
    </linearGradient>
    <linearGradient id="laoaiGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8b848"/>
      <stop offset="100%" stop-color="#c8a840"/>
    </linearGradient>
    <linearGradient id="laoaiShoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3420"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1) translate(-236,0)">
    <g transform="translate(130, 10)">
      <!-- 陰影（旋轉加大） -->
      <ellipse cx="-8" cy="225" rx="40" ry="7" fill="#000" opacity="0.15"/>

      <!-- ===== 腿（旋轉橫掃馬步） ===== -->
      <!-- 後腿 -->
      <ellipse cx="24" cy="200" rx="12" ry="18" fill="url(#laoaiPants)" transform="rotate(-16,24,200)"/>
      <ellipse cx="22" cy="218" rx="14" ry="7.5" fill="#3a2018"/>
      <!-- 前腿（大步前踏） -->
      <ellipse cx="-28" cy="196" rx="13" ry="19" fill="url(#laoaiPants)" transform="rotate(18,-28,196)"/>
      <ellipse cx="-32" cy="218" rx="14" ry="7.5" fill="#3a2018"/>

      <!-- ===== 身體（旋轉扭腰） ===== -->
      <ellipse cx="-4" cy="152" rx="30" ry="34" fill="url(#laoaiArmor)" transform="rotate(-12,-4,152)"/>

      <!-- 金色鎧甲紋飾 -->
      <line x1="-22" y1="130" x2="-26" y2="178" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
      <line x1="16" y1="130" x2="18" y2="178" stroke="#c8a840" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

      <!-- 大肩甲 -->
      <ellipse cx="-38" cy="132" rx="14" ry="10" fill="url(#laoaiShoulder)" stroke="#c8a840" stroke-width="1"/>
      <ellipse cx="22" cy="138" rx="14" ry="10" fill="url(#laoaiShoulder)" stroke="#c8a840" stroke-width="1"/>

      <!-- 領口 -->
      <path d="M-16,130 L-8,146 L2,130" fill="none" stroke="#6a4828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 翡翠腰帶 -->
      <path d="M-32,178 Q-4,187 28,178" fill="none" stroke="#4a2a18" stroke-width="7" stroke-linecap="round"/>
      <rect x="-12" y="175" width="14" height="12" rx="2" fill="#4a8848" stroke="#c8a840" stroke-width="1"/>

      <!-- ===== 畫面右側手臂（後手跟隨） ===== -->
      <path d="M24,142 Q36,148 34,164" fill="none" stroke="url(#laoaiArmor)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
      <circle cx="34" cy="166" r="7" fill="url(#laoaiFace)" opacity="0.85"/>

      <!-- ===== 大頭（旋轉怒吼） ===== -->
      <!-- 頭盔底座 -->
      <ellipse cx="-2" cy="88" rx="42" ry="44" fill="url(#laoaiHelmet)"/>

      <!-- 臉 -->
      <path d="M-34,82 C-38,94 -36,114 -30,124 C-24,132 -10,138 2,136 C12,134 22,126 26,114 C30,102 28,88 22,80 C16,74 4,70 -6,72 C-18,74 -32,78 -34,82Z" fill="url(#laoaiFace)"/>

      <!-- 鳳翼頭盔 -->
      <path d="M-36,76 C-30,56 -8,46 12,50 C28,54 36,68 32,80 C28,72 16,64 6,62 C-4,60 -16,62 -26,70" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M-36,80 C-26,74 -10,70 12,72 C26,74 34,78 32,82" fill="none" stroke="#c8a840" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 鳳翼左翼 -->
      <path d="M-32,72 C-42,58 -48,48 -44,42 C-40,38 -36,44 -32,56" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M-44,42 C-50,36 -46,32 -40,38" fill="none" stroke="#c8a840" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 鳳翼右翼 -->
      <path d="M26,72 C34,58 40,48 36,42 C32,38 28,44 26,56" fill="url(#laoaiHelmet)" stroke="#c8a840" stroke-width="0.8"/>
      <path d="M36,42 C42,36 38,32 32,38" fill="none" stroke="#c8a840" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 頭盔頂飾 -->
      <path d="M-6,54 L-2,38 L2,54" fill="url(#laoaiGold)" stroke="#c8a840" stroke-width="0.8"/>

      <!-- 耳朵 -->
      <path d="M20,100 C24,96 26,102 24,110 C22,114 20,112 20,106" fill="url(#laoaiFace)" stroke="#b09060" stroke-width="0.5"/>

      <!-- ===== 眼睛（殺氣圓睜） ===== -->
      <ellipse cx="-14" cy="106" rx="6.5" ry="5.5" fill="#fff"/>
      <ellipse cx="-15" cy="107" rx="4.2" ry="4.2" fill="#3a1810"/>
      <ellipse cx="-15.5" cy="106" rx="2.5" ry="2.5" fill="#1a0800"/>
      <circle cx="-17" cy="104.5" r="1" fill="#fff" opacity="0.7"/>

      <ellipse cx="4" cy="106" rx="6.5" ry="5.5" fill="#fff"/>
      <ellipse cx="3" cy="107" rx="4.2" ry="4.2" fill="#3a1810"/>
      <ellipse cx="2.5" cy="106" rx="2.5" ry="2.5" fill="#1a0800"/>
      <circle cx="1" cy="104.5" r="1" fill="#fff" opacity="0.7"/>

      <!-- 粗眉毛（極怒） -->
      <path d="M-20,98 C-16,94 -12,95 -8,99" fill="none" stroke="#2a1808" stroke-width="4" stroke-linecap="round"/>
      <path d="M8,99 C10,95 14,94 18,98" fill="none" stroke="#2a1808" stroke-width="4" stroke-linecap="round"/>

      <!-- 鼻子 -->
      <path d="M-20,114 C-22,120 -18,124" fill="none" stroke="#a08058" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 嘴巴（大張嘴怒吼） -->
      <ellipse cx="-8" cy="130" rx="9" ry="5" fill="#603028"/>
      <path d="M-15,128 C-10,126 -6,126 -2,128" fill="none" stroke="#c09868" stroke-width="0.8"/>
      <path d="M-15,132 C-10,134 -6,134 -2,132" fill="none" stroke="#c09868" stroke-width="0.8"/>

      <!-- ===== 畫面左側手臂（武器手，橫掃至負x全展開） ===== -->
      <path d="M-30,136 Q-60,120 -78,116" fill="none" stroke="url(#laoaiArmor)" stroke-width="15" stroke-linecap="round"/>
      <path d="M-56,124 Q-64,120 -70,118" fill="none" stroke="#4a2a18" stroke-width="4" stroke-linecap="round"/>

      <!-- ===== 斬馬大刀（負x，橫掃全展開，最大範圍） ===== -->
      <!-- 刀身（橫向延展） -->
      <path d="M-78,110 L-114,92 L-118,88 L-112,78 Q-98,92 -82,106 Z" fill="url(#laoaiBlade)" stroke="#666" stroke-width="0.5"/>
      <!-- 刀背厚線 -->
      <line x1="-78" y1="110" x2="-114" y2="92" stroke="#888" stroke-width="2.8" stroke-linecap="round"/>
      <!-- 刀尖斜角 -->
      <line x1="-118" y1="88" x2="-112" y2="78" stroke="#777" stroke-width="1.5"/>
      <!-- 刀刃亮線 -->
      <path d="M-82,106 Q-98,92 -112,78" fill="none" stroke="#ddd" stroke-width="0.8" opacity="0.4"/>
      <!-- 刀護手 -->
      <line x1="-82" y1="114" x2="-72" y2="108" stroke="#c8a840" stroke-width="5" stroke-linecap="round"/>
      <!-- 刀柄 -->
      <line x1="-76" y1="112" x2="-74" y2="124" stroke="#5a3a20" stroke-width="6" stroke-linecap="round"/>
      <!-- 柄底 -->
      <circle cx="-73" cy="127" r="4" fill="#c8a840"/>
      <!-- 握刀的手 -->
      <circle cx="-75" cy="118" r="7" fill="url(#laoaiFace)"/>

      <!-- 風壓／衝擊線 -->
      <line x1="-90" y1="84" x2="-104" y2="78" stroke="#888" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <line x1="-86" y1="96" x2="-100" y2="92" stroke="#888" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
      <line x1="-94" y1="74" x2="-106" y2="66" stroke="#888" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
      <line x1="-82" y1="108" x2="-96" y2="106" stroke="#888" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
    </g>
  </g>
</svg>