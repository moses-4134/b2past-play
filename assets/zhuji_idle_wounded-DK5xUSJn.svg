<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 趙姬 — 吉卜力2頭身 側面朝左 受傷待機（HP 30~60%：身體微傾、杖下垂、單眼半瞇、咬牙、汗滴） -->
  <defs>
    <radialGradient id="zjWFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fff2e8"/>
      <stop offset="100%" stop-color="#f4dcc8"/>
    </radialGradient>
    <linearGradient id="zjWRobe" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#a83030"/>
      <stop offset="100%" stop-color="#7a1818"/>
    </linearGradient>
    <linearGradient id="zjWSkirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#902828"/>
      <stop offset="100%" stop-color="#601010"/>
    </linearGradient>
    <linearGradient id="zjWHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a0a04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <linearGradient id="zjWStaff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="100%" stop-color="#5c3a1a"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 14)">
    <!-- 陰影 -->
    <ellipse cx="-4" cy="217" rx="28" ry="5" fill="#000" opacity="0.1"/>

    <!-- ===== 腿（重心偏移，前腿微彎） ===== -->
    <ellipse cx="8" cy="196" rx="8" ry="15" fill="url(#zjWSkirt)" transform="rotate(-3,8,196)"/>
    <ellipse cx="6" cy="211" rx="9" ry="6" fill="#4a2020"/>
    <ellipse cx="-12" cy="195" rx="9" ry="16" fill="url(#zjWSkirt)" transform="rotate(8,-12,195)"/>
    <ellipse cx="-14" cy="211" rx="10" ry="6" fill="#4a2020"/>

    <!-- ===== 身體（前傾） ===== -->
    <ellipse cx="-2" cy="163" rx="24" ry="26" fill="url(#zjWRobe)" transform="rotate(-8,-2,163)"/>

    <!-- 金色腰帶 -->
    <path d="M-24,178 Q-2,186 20,178" fill="none" stroke="#d4a030" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-4" cy="182" r="3.5" fill="#e8c040"/>

    <!-- 白色交領 -->
    <path d="M-12,141 L-5,155 L4,141" fill="none" stroke="#f8f0e8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- ===== 後方髮髻垂帶 ===== -->
    <path d="M18,72 C22,82 24,100 22,120 C20,138 18,150 16,158" fill="none" stroke="url(#zjWHair)" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

    <!-- ===== 畫面右側手臂（角色左手，按住腹部） ===== -->
    <path d="M18,148 Q24,158 16,172" fill="none" stroke="url(#zjWRobe)" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="16" cy="174" r="4.5" fill="url(#zjWFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手，持杖下垂） ===== -->
    <path d="M-22,149 Q-36,152 -42,158" fill="none" stroke="url(#zjWRobe)" stroke-width="10" stroke-linecap="round"/>

    <!-- ===== 大頭 ===== -->
    <ellipse cx="0" cy="92" rx="36" ry="38" fill="url(#zjWHair)"/>

    <!-- 臉（低頭忍痛） -->
    <path d="M-24,88 C-28,98 -26,114 -20,124 C-14,132 -4,136 6,134 C14,132 20,126 24,116 C28,104 26,92 20,84 C14,78 6,76 -2,78 C-12,80 -22,82 -24,88Z" fill="url(#zjWFace)"/>

    <!-- 腮紅（傷痛泛紅） -->
    <ellipse cx="-18" cy="120" rx="7" ry="4" fill="#e0a0a0" opacity="0.4"/>

    <!-- 髮頂（高聳盤髮） -->
    <ellipse cx="0" cy="62" rx="20" ry="18" fill="url(#zjWHair)"/>
    <path d="M-16,76 C-12,52 4,44 18,50 C28,56 30,68 26,78 C22,72 14,66 6,64 C-2,62 -10,64 -14,70" fill="url(#zjWHair)"/>

    <!-- 瀏海（微散亂） -->
    <path d="M-8,78 C-12,68 -18,70 -20,78 C-20,84 -14,86 -10,82" fill="url(#zjWHair)"/>
    <path d="M4,78 C8,68 14,70 16,78 C16,84 10,86 6,82" fill="url(#zjWHair)"/>

    <!-- 金步搖（頭飾） -->
    <circle cx="-4" cy="50" r="4" fill="#e8c040" stroke="#d4a030" stroke-width="1"/>
    <circle cx="-4" cy="50" r="2" fill="#f0e070"/>
    <line x1="-8" y1="52" x2="-12" y2="62" stroke="#d4a030" stroke-width="0.8"/>
    <circle cx="-12" cy="63" r="2" fill="#48a070"/>
    <line x1="0" y1="53" x2="2" y2="62" stroke="#d4a030" stroke-width="0.8"/>
    <circle cx="2" cy="63" r="1.5" fill="#e8c040"/>

    <!-- 側髮 -->
    <path d="M22,82 C26,76 28,84 26,94" fill="url(#zjWHair)" stroke="none"/>
    <path d="M24,94 C26,104 26,114 24,126" fill="none" stroke="url(#zjWHair)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M-26,86 C-28,96 -28,108 -26,120" fill="none" stroke="url(#zjWHair)" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

    <!-- 耳朵 -->
    <path d="M22,98 C26,94 28,100 26,106 C24,110 22,108 22,104" fill="url(#zjWFace)" stroke="#f0d4c0" stroke-width="0.5"/>
    <circle cx="24" cy="112" r="2" fill="#48a070"/>

    <!-- ===== 眼睛（左眼半瞇、右眼微睜） ===== -->
    <!-- 左眼（半瞇） -->
    <path d="M-15,96 C-12,94 -6,94 -3,96" fill="none" stroke="#1a0a04" stroke-width="0.8" opacity="0.4"/>
    <ellipse cx="-8" cy="104" rx="7.5" ry="4.5" fill="#fff"/>
    <ellipse cx="-9" cy="105" rx="4.5" ry="3.5" fill="#3a2010"/>
    <ellipse cx="-9.5" cy="104.5" rx="2.2" ry="2" fill="#0a0804"/>
    <circle cx="-11" cy="103" r="1.5" fill="#fff" opacity="0.6"/>

    <!-- 右眼（微瞇但睜著） -->
    <path d="M1,96 C4,94 10,94 13,96" fill="none" stroke="#1a0a04" stroke-width="0.8" opacity="0.4"/>
    <ellipse cx="8" cy="104" rx="7.5" ry="6.5" fill="#fff"/>
    <ellipse cx="7" cy="105" rx="4.5" ry="4.5" fill="#3a2010"/>
    <ellipse cx="6.5" cy="104" rx="2.2" ry="2.5" fill="#0a0804"/>
    <circle cx="5" cy="102" r="1.8" fill="#fff" opacity="0.6"/>
    <circle cx="9" cy="107" r="0.8" fill="#fff" opacity="0.4"/>

    <!-- 眉間皺紋 -->
    <path d="M-3,98 C-2,96 0,96 1,98" fill="none" stroke="#d0b098" stroke-width="0.8" opacity="0.5"/>

    <!-- 鼻子 -->
    <path d="M-12,114 C-12.5,116 -11.5,117" fill="none" stroke="#f0d4c0" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴（咬牙忍痛） -->
    <path d="M-5,124 C-2,125 2,125 5,124" fill="none" stroke="#905050" stroke-width="2" stroke-linecap="round"/>
    <path d="M-5,124 C-6,126 -7,127" fill="none" stroke="#905050" stroke-width="1" opacity="0.6"/>

    <!-- 汗滴 -->
    <path d="M-22,90 C-23,94 -22,98 -21,100" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-21" cy="101" rx="1.2" ry="1.8" fill="#aaccee" opacity="0.5"/>

    <!-- ===== 儀杖（傾斜下垂） ===== -->
    <line x1="-44" y1="90" x2="-48" y2="214" stroke="#7a5028" stroke-width="4" stroke-linecap="round"/>
    <!-- 杖頂玉飾 -->
    <circle cx="-44" cy="88" r="5" fill="#48a070" stroke="#d4a030" stroke-width="1.5"/>
    <circle cx="-44" cy="88" r="2.5" fill="#80d8a8" opacity="0.7"/>
    <!-- 杖底金箍 -->
    <ellipse cx="-48" cy="214" rx="3" ry="2" fill="#d4a030"/>
    <!-- 握杖的手 -->
    <circle cx="-43" cy="158" r="5" fill="url(#zjWFace)"/>
  </g>
</svg>