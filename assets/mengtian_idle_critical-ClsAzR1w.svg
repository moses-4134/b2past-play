<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 264" width="236" height="264">
  <!-- 蒙恬 — 吉卜力2頭身 側面朝左 瀕死待機（HP <30%：半跪、槍撐地、喘息） -->
  <defs>
    <radialGradient id="mengtianFace" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8cca8"/>
      <stop offset="100%" stop-color="#d0ac88"/>
    </radialGradient>
    <linearGradient id="mengtianJacket" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#281810"/>
    </linearGradient>
    <linearGradient id="mengtianPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#302e26"/>
      <stop offset="100%" stop-color="#1a1814"/>
    </linearGradient>
    <linearGradient id="mengtianHair" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0e0a06"/>
    </linearGradient>
    <linearGradient id="mengtianSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
    <linearGradient id="mengtianArmor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#584838"/>
      <stop offset="100%" stop-color="#382820"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 28)">
    <!-- 陰影（因半跪而更寬） -->
    <ellipse cx="-4" cy="210" rx="32" ry="6" fill="#000" opacity="0.12"/>

    <!-- ===== 腿（半跪姿態） ===== -->
    <!-- 後腿（右腿，膝蓋撐地） -->
    <ellipse cx="8" cy="192" rx="10" ry="12" fill="url(#mengtianPants)" transform="rotate(-20,8,192)"/>
    <ellipse cx="2" cy="204" rx="8" ry="5" fill="url(#mengtianPants)"/>
    <ellipse cx="0" cy="208" rx="9" ry="5" fill="#3a2818"/>
    <!-- 前腿（左腿，彎曲支撐） -->
    <ellipse cx="-16" cy="188" rx="10" ry="16" fill="url(#mengtianPants)" transform="rotate(12,-16,188)"/>
    <ellipse cx="-20" cy="208" rx="11" ry="6" fill="#3a2818"/>

    <!-- ===== 身體（大幅前傾） ===== -->
    <ellipse cx="-4" cy="160" rx="26" ry="30" fill="url(#mengtianJacket)" transform="rotate(-14,-4,160)"/>

    <!-- 輕甲護片 -->
    <rect x="-16" y="152" width="20" height="12" rx="2.5" fill="url(#mengtianArmor)" stroke="#3a2818" stroke-width="0.5" opacity="0.7"/>

    <!-- 肩甲護肩 -->
    <rect x="-30" y="139" width="10" height="8" rx="2" fill="url(#mengtianArmor)" stroke="#3a2818" stroke-width="0.6"/>
    <rect x="14" y="141" width="10" height="8" rx="2" fill="url(#mengtianArmor)" stroke="#3a2818" stroke-width="0.6"/>

    <!-- 領口 -->
    <path d="M-12,141 L-7,153 L0,141" fill="none" stroke="#7a6048" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 腰帶 -->
    <path d="M-28,178 Q-4,186 20,180" fill="none" stroke="#5a4030" stroke-width="5" stroke-linecap="round"/>
    <rect x="-7" y="178" width="8" height="8" rx="1.5" fill="#b09030" stroke="#8a7020" stroke-width="0.5"/>

    <!-- ===== 畫面右側手臂（角色左手）撐在膝蓋上 ===== -->
    <path d="M16,148 Q24,162 16,182" fill="none" stroke="url(#mengtianJacket)" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <circle cx="15" cy="184" r="5" fill="url(#mengtianFace)" opacity="0.85"/>

    <!-- ===== 畫面左側手臂（角色右手）槍插地撐住身體 ===== -->
    <path d="M-24,146 Q-44,156 -54,170" fill="none" stroke="url(#mengtianJacket)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-54" cy="172" r="5" fill="url(#mengtianFace)"/>

    <!-- ===== 槍（插入地面當支撐） ===== -->
    <line x1="-55" y1="174" x2="-58" y2="214" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
    <!-- 槍頭（朝上） -->
    <path d="M-53,128 L-55,142 L-59,140 Z" fill="url(#mengtianSteel)" stroke="#888" stroke-width="0.5"/>
    <!-- 槍纓 -->
    <line x1="-54" y1="142" x2="-52" y2="138" stroke="#c04040" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-56" y1="144" x2="-54" y2="140" stroke="#c04040" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 槍桿上段 -->
    <line x1="-55" y1="142" x2="-55" y2="174" stroke="#5a3a20" stroke-width="4" stroke-linecap="round"/>
    <!-- 插入地面效果 -->
    <ellipse cx="-58" cy="214" rx="4" ry="2" fill="#5a4a30" opacity="0.4"/>

    <!-- ===== 大頭（低垂、喘息） ===== -->
    <!-- 後腦髮量 -->
    <ellipse cx="-2" cy="94" rx="39" ry="41" fill="url(#mengtianHair)"/>

    <!-- 臉（明顯低頭） -->
    <path d="M-30,90 C-34,102 -32,117 -26,126 C-20,134 -8,138 2,136 C12,134 20,128 24,118 C28,106 26,92 20,84 C14,78 2,74 -6,76 C-18,78 -28,82 -30,90Z" fill="url(#mengtianFace)"/>

    <!-- 腮紅（因痛苦更明顯） -->
    <ellipse cx="-22" cy="122" rx="7" ry="4" fill="#e0a0a0" opacity="0.45"/>

    <!-- 頭髮頂部（烏黑飄逸，散亂） -->
    <path d="M-20,78 C-16,60 0,52 14,56 C26,60 32,72 28,82 C24,76 16,70 8,68 C0,66 -10,68 -16,74" fill="url(#mengtianHair)"/>

    <!-- 後方長髮（散亂） -->
    <path d="M22,86 C26,92 28,104 26,118 C24,126 22,130 20,128" fill="none" stroke="#0e0a06" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M24,90 C28,98 30,110 28,122 C26,128 24,126 24,120" fill="none" stroke="#0e0a06" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- 頭巾/束帶（歪斜） -->
    <path d="M-26,82 C-18,70 2,64 20,68 C28,72 32,78 28,82" fill="none" stroke="#8a3020" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-26,82 C-28,86 -30,90 -28,92" fill="none" stroke="#8a3020" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 束帶飄帶（散落） -->
    <path d="M28,82 C32,88 34,98 32,106" fill="none" stroke="#8a3020" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M30,84 C34,92 36,102 34,110" fill="none" stroke="#8a3020" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

    <!-- 前瀏海（散亂） -->
    <path d="M-28,90 C-32,78 -34,82 -34,90 C-32,94 -28,94 -28,92" fill="url(#mengtianHair)"/>
    <path d="M-24,84 C-28,74 -30,76 -30,86 C-28,90 -24,90 -24,88" fill="#0e0a06"/>
    <path d="M-20,82 C-22,74 -26,76 -24,84" fill="#0e0a06" opacity="0.8"/>
    <!-- 散落髮絲 -->
    <path d="M-32,94 C-34,100 -32,104" fill="none" stroke="url(#mengtianHair)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- 側髮 -->
    <path d="M20,84 C24,80 26,86 24,94 C22,98 20,96 20,90" fill="url(#mengtianHair)"/>

    <!-- 耳朵 -->
    <path d="M18,102 C22,98 24,104 22,110 C20,114 18,112 18,108" fill="url(#mengtianFace)" stroke="#c0a080" stroke-width="0.5"/>

    <!-- ===== 眼睛（雙眼瞇成線） ===== -->
    <!-- 左眼（幾乎閉上） -->
    <ellipse cx="-10" cy="108" rx="7" ry="2" fill="#fff"/>
    <ellipse cx="-11" cy="108.5" rx="4.5" ry="1.5" fill="#2a2018"/>
    <ellipse cx="-11.5" cy="108" rx="2.5" ry="1" fill="#0c0804"/>

    <!-- 右眼（勉強睜一線） -->
    <ellipse cx="6" cy="108" rx="7" ry="2.5" fill="#fff"/>
    <ellipse cx="5" cy="108.5" rx="4.5" ry="2" fill="#2a2018"/>
    <ellipse cx="4.5" cy="108" rx="2.5" ry="1.2" fill="#0c0804"/>
    <circle cx="2.5" cy="107" r="0.8" fill="#fff" opacity="0.8"/>

    <!-- 眉間皺紋（深刻） -->
    <path d="M-3,101 C-2,99 0,99 1,101" fill="none" stroke="#c0a080" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M-4,103 C-2,101.5 1,101.5 2,103" fill="none" stroke="#c0a080" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

    <!-- 眉毛（痛苦皺起） -->
    <path d="M-18,103 C-14,101 -8,101 -4,103" fill="none" stroke="#1a1008" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,103 C4,101 9,101 12,103" fill="none" stroke="#1a1008" stroke-width="2" stroke-linecap="round"/>

    <!-- 鼻子 -->
    <path d="M-18,115 C-19,119 -17,123 -15,125" fill="none" stroke="#b09070" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 嘴巴（喘息張開） -->
    <ellipse cx="-4" cy="130" rx="5" ry="4.5" fill="#703030"/>
    <path d="M-8,128 L0,128" fill="none" stroke="#eee" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- 汗滴（多顆） -->
    <path d="M-24,90 C-25,94 -24,100 -23,103" fill="none" stroke="#aaccee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="-23" cy="104" rx="1.2" ry="2" fill="#aaccee" opacity="0.5"/>
    <path d="M22,92 C23,96 22,100" fill="none" stroke="#aaccee" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="22" cy="101" rx="1" ry="1.5" fill="#aaccee" opacity="0.4"/>
    <!-- 額頭汗 -->
    <ellipse cx="-6" cy="80" rx="1.5" ry="2" fill="#aaccee" opacity="0.4"/>
  </g>
</svg>